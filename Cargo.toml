[workspace]
resolver = "3"
# The playable clients are a separate workspace with their own lockfile and CI job
# (clients/README.md, lanes.toml); the engine core stays free of graphics and assets.
exclude = ["clients"]
members = [
    "crates/h3-kernel",
    "crates/h3-content",
    "crates/h3-content-battle",
    "crates/h3-contracts",
    "crates/h3-battle",
    "crates/h3-battle-ai",
    "crates/h3-heroes",
    "crates/h3-adventure",
    "crates/h3-game",
    "crates/h3-map",
    "crates/h3-pack-adventure",
    "crates/h3-pack",
    "crates/h3-pack-battle",
    "crates/h3-sim",
    "crates/h3-ffi",
    "crates/h3-cli",
    "crates/h3-formats",
    "crates/h3-harvest",
    "crates/h3-experiment",
    "crates/h3-protocol",
    "crates/h3-server",
    "xtask",
]
default-members = [
    "crates/h3-kernel",
    "crates/h3-content",
    "crates/h3-content-battle",
    "crates/h3-contracts",
    "crates/h3-battle",
    "crates/h3-battle-ai",
    "crates/h3-heroes",
    "crates/h3-adventure",
    "crates/h3-game",
    "crates/h3-map",
    "crates/h3-pack-adventure",
    "crates/h3-pack",
    "crates/h3-pack-battle",
    "crates/h3-sim",
    "crates/h3-ffi",
    "crates/h3-cli",
    "crates/h3-formats",
    "crates/h3-harvest",
    "crates/h3-experiment",
    "crates/h3-protocol",
    "crates/h3-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-2.0-or-later"
publish = false

[workspace.dependencies]
# Workspace crates (paths are the single source of truth; arch.toml declares which edges are allowed).
h3-kernel = { path = "crates/h3-kernel" }
h3-content = { path = "crates/h3-content" }
h3-content-battle = { path = "crates/h3-content-battle" }
h3-contracts = { path = "crates/h3-contracts" }
h3-battle = { path = "crates/h3-battle" }
h3-battle-ai = { path = "crates/h3-battle-ai" }
h3-heroes = { path = "crates/h3-heroes" }
h3-pack = { path = "crates/h3-pack" }
h3-pack-battle = { path = "crates/h3-pack-battle" }
h3-sim = { path = "crates/h3-sim" }
h3-formats = { path = "crates/h3-formats" }
h3-adventure = { path = "crates/h3-adventure" }
h3-game = { path = "crates/h3-game" }
h3-map = { path = "crates/h3-map" }
h3-pack-adventure = { path = "crates/h3-pack-adventure" }
h3-cli = { path = "crates/h3-cli" }
h3-protocol = { path = "crates/h3-protocol" }

# External crates. Every entry must be GPL-2.0-or-later compatible (deny.toml) and listed in arch.toml
# for the crates allowed to use it.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
# zlib inflate for LOD archive entries (h3-formats). License: MIT OR Zlib OR Apache-2.0.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# The server (E16, ADR-0018 point 3): the runtime with only the features the shell needs, WebSocket
# served without TLS (its TLS client below), and OS randomness for seeds and tokens. Licenses: MIT (tokio, tokio-tungstenite), MIT
# OR Apache-2.0 (futures-util, getrandom). `h3-protocol` takes `serde` and `serde_json` without
# `std` in its own manifest (ADR-0018 point 1): these entries enable it.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
# Accounts (E16 M3, ADR-0019 point 1; the user, SRV-Q17): the server checks Ed25519 signatures;
# the key's derivation (Argon2id) is a client's, and the server's test client's. Licenses:
# BSD-3-Clause (ed25519-dalek), MIT OR Apache-2.0 (argon2).
ed25519-dalek = "3"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# The server's TLS client (E16 M6 T3, ADR-0021 point 4; the user, SRV-Q23): it fetches its peers'
# cards at `wss://` through `tokio-tungstenite`'s rustls feature, with the pure-Rust graviola backend
# and the operating system's roots. `ring` and `aws-lc` are not GPLv2-compatible: no default
# features here, nor in the test's TLS endpoint (`tokio-rustls`, dev only). Licenses: Apache-2.0
# OR ISC OR MIT-0 (rustls-graviola, graviola), Apache-2.0 OR ISC OR MIT (rustls,
# rustls-native-certs), MIT OR Apache-2.0 (tokio-rustls).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false }
# Test-only: the wire types round-trip in a format that is not self-describing (ADR-0018 point 4;
# provisional, E16 M1 review). License: MIT OR Apache-2.0.
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Lints shared by every crate. Logic crates add a stricter crate-level policy in their lib.rs
# (enforced by `cargo xtask check-arch`, see docs/05-testing.md).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"

# Codegen settings are pinned here (ADR-0003 §5). Changing them requires re-running the
# determinism matrix (`cargo xtask determinism`).
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
panic = "unwind"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16
# Overflow checks stay on in release so debug and release behave identically on overflow
# (a panic that reveals a bug instead of a silent wrap that diverges). ADR-0003 §6.
overflow-checks = true
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true

  { offset = 0x14, name = "y", type = "i32", summary = "as x", confidence = "read" },
  { offset = 0x18, name = "z", type = "i32", summary = "the level from the layout", confidence = "read" },
  { offset = 0x1C, name = "size", type = "i32", summary = "base size x the scale / the layout's span (rmg_zones_lay_out); a water zone's: its source zone's", confidence = "read" },
  { offset = 0x20, name = "min_x", type = "i32", summary = "its cells' box: least x (32000 from the constructor; rmg_zone_bounds_compute)", confidence = "read" },
  { offset = 0x24, name = "min_y", type = "i32", summary = "least y", confidence = "read" },
  { offset = 0x28, name = "max_x", type = "i32", summary = "greatest x + 1 (-32000 from the constructor; H3API's width)", confidence = "read" },
  { offset = 0x2C, name = "max_y", type = "i32", summary = "greatest y + 1 (H3API's height)", confidence = "read" },
  { offset = 0x30, name = "town_entrance", type = "i32[3]", summary = "the first town's entrance x, y, z (rmg_town_place_central)", confidence = "read" },
  { offset = 0x3C, name = "has_town", type = "u8", summary = "set by rmg_town_place_central; then rmg_town_place_far places further towns away from the others; counted with the towns after the mines", confidence = "read" },
  { offset = 0x40, name = "hop_distance", type = "i32", summary = "the number of template connections from a given zone (rmg_zone_hop_distances: 20000 unreached), then the near-zone order key 10 x hops + rand() % 10, 1000 + rand() % 10 for neighbours (rmg_pile_place_in_near_zone)", confidence = "read" },
  { offset = 0x44, name = "count_by_type", type = "i32[232]", summary = "the objects by type whose entrance lies in the zone: +1 in rmg_generator_add_object, -1 in rmg_generator_remove_object; rmg_object_choose refuses a type that reached rmg_type_limit_zone (H3API's objectCount)", confidence = "read" },
  { offset = 0x3E4, name = "zone_distances", type = "vector<u16>", summary = "per zone the number of connections to it, 32000 unreached (rmg_water_zones_connect, rmg_zone_graph_distances)", confidence = "inferred" },
  { offset = 0x3F4, name = "polygon", type = "vector<point>", summary = "its cell's corners clipped to the map (rmg_zone_borders_draw); rmg_island_shape shrinks them into an island", confidence = "inferred" },
  { offset = 0x404, name = "passages", type = "vector<point>", summary = "the zone's connection points (8-byte x, y), emptied by the constructor: a land passage's P or Q (rmg_connection_by_land), the cells before a shipyard (rmg_connection_by_shipyard), a gate's entrance (rmg_connection_by_gate), a monolith's position (rmg_connection_by_monoliths); its reader not traced", confidence = "read" },
]


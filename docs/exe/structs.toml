# Record layouts in Heroes3.exe: our readings (docs/exe/README.md).
#
# One struct per [[struct]], its fields one per line, sorted by offset. A field inside an array
# field may be listed on its own when the docs cite it (e.g. one spell's duration). H3API's
# layouts (docs/exe/h3api.toml, `[[struct]]`, guesses) cover far more; a field read here goes here.
# confidence as in map.toml: read | inferred | guess. Seeded 2026-10-08 from installation.md §5–§7.

[[struct]]
name = "battle_stack"
size = 0x548
summary = "A stack record of the battle manager (21 per side, from +0x54CC; H3API's H3CombatCreature). The creature's table entry is copied in at +0x74."
refs = ["installation.md §7.7", "installation.md §7.9"]
h3api = "H3CombatCreature"
fields = [
  { offset = 0x0, name = "striking", type = "u8", summary = "set for a strike's striker (0x441A87): strike_animation 0x468990 plays its strike group +0x2", confidence = "read", refs = ["epics/E17-design.md §7"] },
  { offset = 0x1, name = "shooting", type = "u8", summary = "strike_animation: the stack shows a shot group (14-16) and plays it out", confidence = "read", refs = ["epics/E17-design.md §7"] },
  { offset = 0x2, name = "strike_group", type = "u8", summary = "the striker's group by the strike's direction (0x441AAF): 11 for directions 0, 5, 6, 12 for 1 and 4, 13 for the rest; 17-19 instead for a strike on two stacks whose DEF has them, the Ballista's 14-16", confidence = "read", refs = ["epics/E17-design.md §7"] },
  { offset = 0x3, name = "reaction_group", type = "i8", summary = "the group strike_animation plays: the strike group, death 5, defend 4 or hit 3; -1 none", confidence = "read", refs = ["epics/E17-design.md §7"] },
  { offset = 0x4, name = "reaction_frames", type = "i8", summary = "that group's frames, one less when the stack already shows it", confidence = "read", refs = ["epics/E17-design.md §7"] },
  { offset = 0x8, name = "draw_layer", type = "i32", summary = "the redraw pass that draws it (0x494F40): 4 from the setup, 6 for the attacker of a melee, 3 or 7 by direction (0x43F0B0); H3API calls it visibility", confidence = "read", refs = ["epics/E17-design.md §4"] },
  { offset = 0x20, name = "magic_shown", type = "u8", summary = "set while a magic animation is drawn over it (play_magic_animation 0x496840; draw_battle_stack's tail 0x43E795)", confidence = "read", refs = ["epics/E17-design.md §7.15"] },
  { offset = 0x24, name = "clone_original", type = "i32", summary = "a clone's original (record index)", confidence = "read", refs = ["installation.md §7.19"] },
  { offset = 0x28, name = "clone", type = "i32", summary = "the original's clone (record index), -1 none", confidence = "read", refs = ["installation.md §7.19"] },
  { offset = 0x2C, name = "clone_rounds_left", type = "i32", summary = "a clone's rounds left", confidence = "read", refs = ["installation.md §7.19"] },
  { offset = 0x30, name = "no_count_box", type = "u8", summary = "set: no count box (H3API skipCountDraw); a stack ahead with it set leaves the hex free for the box (0x43E61C); set through a walk (0x442145 to 0x4423D9) and a flight (0x4B4BD8 to 0x4B4E73) (no other byte store to it found)", confidence = "read", refs = ["epics/E17-design.md §4"] },
  { offset = 0x34, name = "creature", type = "i32", summary = "creature id", confidence = "inferred", refs = ["installation.md §7.21"] },

  { offset = 0x0, name = "objects", type = "vector<rmg_object*>", summary = "the objects on the cell (begin +0x4, end +0x8, capacity +0xC), appended by rmg_map_place_object; rmg_paths_and_connections takes only cells where it is empty", confidence = "read" },
  { offset = 0x10, name = "previous", type = "i32[3]", summary = "the cell a zone flood came from (rmg_zone_cost_flood; rmg_path_carve walks it back); -1 after rmg_map_cell_reset and rmg_zone_paths_connect's reset (H3API's previousTile)", confidence = "read" },
  { offset = 0x1C, name = "movement", type = "u32", summary = "bits 0-15 the cost from the cell's own zone's flood (rmg_zone_cost_flood; 0 joins the zone's free cells), bits 16-31 the cost of a neighbouring zone's flood entering it, or a water zone's distance to its edge (rmg_zone_distance_flood); 32000 in both halves after rmg_zone_paths_connect's reset, 32700 after rmg_map_cell_reset", confidence = "read" },
  { offset = 0x20, name = "zone", type = "u32", summary = "bits 0-15 the distance to the nearest object entrance (32700 after rmg_map_cell_reset; rmg_generator_add_object's flood, 2 per orthogonal and 3 per diagonal step), bits 16-23 the zone index as a signed byte (-1 none), bits 24-31 the zone whose flood entered the cell from outside (rmg_zone_cost_flood; -1 after reset and rmg_zone_paths_connect's reset; H3API: a second zone id); rmg_paths_and_connections tests bit 23", confidence = "read" },
  { offset = 0x24, name = "tile", type = "u32", summary = "0x548 after rmg_map_cell_reset (land 8, picture 21; bits 30-31 kept); bits 0-5 the land type (8 water, 9 rock), 6-13 its picture (the map vtable's slots), then the river and the road (H3API's H3RmgGroundTile)", confidence = "read" },
  { offset = 0x28, name = "tile_data", type = "u32", summary = "bits 12-14 a flood's step direction (rmg_zone_cost_flood: back toward the cell it came from; rmg_zone_distance_flood: its own), bits 15-16 two flags of the map vtable's tile record; bit 21 land beside water (rmg_map_shores_mark, H3API's shore); bit 23 a pile cell on its outline (rmg_pile_build, rmg_pile_fits_at); bit 22 an object's cell (rmg_map_place_object), 24 reached by boat (rmg_boat_reach_flood), 25 passable (set by rmg_map_cell_reset, cleared on a cell outside an object template's +0x4 mask), 26 to be filled with obstacles (step 6 marks, step 13 counts and fills them), 27 kept free (lanes, paths, guards, water and rock); rmg_map_place_object sets 22 and, unless +0x2C bit 0, clears 26 and sets 27 on a cell of the template's +0xC mask; bit 28 marks a zone's land (step 2's borders and fills, the islands of step 3), painted with the zone's terrain by rmg_terrain_paint. H3API names 21 shore, 22 has object, 25 must be blocked, 26 entrance, 27 blocked: 25 to 27 do not fit the reading", confidence = "read" },
  { offset = 0x2C, name = "pending_guard", type = "u32", summary = "bit 0 a pending Border Guard and bits 1-4 its colour (rmg_border_guard_ring_mark, rmg_connection_by_gate, rmg_monolith_border_guard): rmg_path_carve places a guard of that colour where a path crosses it; cleared by rmg_map_cell_reset; while set, rmg_map_place_object and the step 6 markings leave bits 26 and 27 of +0x28 alone", confidence = "read" },
]


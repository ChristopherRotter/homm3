  { offset = 0x3C, name = "group", type = "i32", summary = "the DEF group shown (0 moving, 1 mouse-over, 2 standing: the count box only in 1 and 2)", confidence = "read", refs = ["epics/E17-design.md §4"] },
  { offset = 0x40, name = "frame", type = "i32", summary = "the frame shown in that group", confidence = "read", refs = ["epics/E17-design.md §4"] },

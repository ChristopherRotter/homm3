[[struct]]
name = "battle_manager"
size = 0x140EC
summary = "The battle manager (pointer at 0x6993D0; H3API's H3CombatManager, whose size is used here)."
refs = ["installation.md §7.7", "installation.md §7.15", "installation.md §7.16"]
h3api = "H3CombatManager"
fields = [
  { offset = 0x3C, name = "action", type = "i32", summary = "the action the dispatcher runs next (0x47902F): 1 a hero's cast, 3 Defend, 8 Wait, 10 a creature's cast (the others not listed here)", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x40, name = "action_spell", type = "i32", summary = "a hero's cast: the spell", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x44, name = "action_hex", type = "i32", summary = "the action's target hex", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x48, name = "action_second_hex", type = "i32", summary = "a hero's cast: the second hex (Teleport's destination, Sacrifice's victim, Magic Mirror's new target, 0x59EF8B); -1 when a cast is entered (0x59ECB0); only the hero's cast action hands it to the cast routine (0x479036)", confidence = "read", refs = ["installation.md §7.13", "installation.md §7.21"] },
  { offset = 0x1C4, name = "hexes", type = "hex_record[187]", summary = "the hex records, stride 0x70", confidence = "read", refs = ["installation.md §7.15"] },
  { offset = 0x5394, name = "terrain", type = "i32", summary = "the battlefield's terrain (set by 0x4643B0: a siege the town's, a ship water, underground and some mines subterranean, the shore sand)", confidence = "read", refs = ["installation.md §7.16", "installation.md §7.26"] },
  { offset = 0x53A0, name = "absolute_obstacle", type = "i32", summary = "the absolute obstacle (record of 0x63BEC0), -1 none", confidence = "read", refs = ["epics/E17-design.md §4"] },

summary = "One cell of the generator's map (H3API's H3RmgMapItem); the bit fields as rmg_map_cell_reset, rmg_map_place_object, the map's vtable and step 6's functions use them (H3API's names for bits 25 to 27 do not fit)."
refs = ["rules/surveys/E14-generator.md §1.7", "rules/surveys/E14-generator.md §2.1", "rules/surveys/E14-generator.md §2.3", "rules/surveys/E14-generator.md §2.4"]

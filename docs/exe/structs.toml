# Record layouts in Heroes3.exe: our readings (docs/exe/README.md).
#
# One struct per [[struct]], its fields one per line, sorted by offset. A field inside an array
# field may be listed on its own when the docs cite it (e.g. one spell's duration). H3API's
# layouts (docs/exe/h3api.toml, `[[struct]]`, guesses) cover far more; a field read here goes here.
# confidence as in map.toml: read | inferred | guess. Seeded 2026-10-08 from installation.md §5–§7.

[[struct]]
name = "battle_stack"
size = 0x548
summary = "A stack record of the battle manager (21 per side, from +0x54CC; H3API's H3CombatCreature). The creature's table entry is copied in at +0x74."
refs = ["installation.md §7.7", "installation.md §7.9"]
h3api = "H3CombatCreature"
fields = [
  { offset = 0x24, name = "clone_original", type = "i32", summary = "a clone's original (record index)", confidence = "read", refs = ["installation.md §7.19"] },
  { offset = 0x28, name = "clone", type = "i32", summary = "the original's clone (record index), -1 none", confidence = "read", refs = ["installation.md §7.19"] },
  { offset = 0x2C, name = "clone_rounds_left", type = "i32", summary = "a clone's rounds left", confidence = "read", refs = ["installation.md §7.19"] },

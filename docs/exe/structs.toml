h3api = "H3RmgObjectPropsRef"
fields = [
  { offset = 0x0, name = "template", type = "rmg_object_template*", summary = "its objects.txt template", confidence = "read" },
  { offset = 0x4, name = "terrain", type = "i32", summary = "-1 at creation; rmg_rand_trn_read sets the first terrain 0..8 of its template's +0x18 bitset, 9 for none", confidence = "read" },
  { offset = 0x8, name = "used", type = "i32", summary = "0 at creation; each object created from it adds 1 (the generators' create methods); rmg_write_map writes the template when above 0", confidence = "read" },
  { offset = 0xC, name = "index", type = "i32", summary = "its index among the written templates (from 2)", confidence = "read" },
  { offset = 0x10, name = "obstacle", type = "rmg_obstacle*", summary = "the last rand_trn.txt row of its type group, terrain and subtype, else null (rmg_rand_trn_read)", confidence = "read" },
  { offset = 0x14, name = "f14", type = "vector", summary = "a vector freed with the prototype (rmg_generator_base_destroy); its use not read", confidence = "read" },

[[struct]]
name = "battle_manager"
size = 0x140EC
summary = "The battle manager (pointer at 0x6993D0; H3API's H3CombatManager, whose size is used here)."
refs = ["installation.md §7.7", "installation.md §7.15", "installation.md §7.16"]
h3api = "H3CombatManager"
fields = [
  { offset = 0x3C, name = "action", type = "i32", summary = "the action the dispatcher runs next (0x47902F): 1 a hero's cast, 3 Defend, 8 Wait, 10 a creature's cast (the others not listed here)", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x40, name = "action_spell", type = "i32", summary = "a hero's cast: the spell", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x44, name = "action_hex", type = "i32", summary = "the action's target hex", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x48, name = "action_second_hex", type = "i32", summary = "a hero's cast: the second hex (Teleport's destination, Sacrifice's victim, Magic Mirror's new target, 0x59EF8B); -1 when a cast is entered (0x59ECB0); only the hero's cast action hands it to the cast routine (0x479036)", confidence = "read", refs = ["installation.md §7.13", "installation.md §7.21"] },
  { offset = 0x1C4, name = "hexes", type = "hex_record[187]", summary = "the hex records, stride 0x70", confidence = "read", refs = ["installation.md §7.15"] },
  { offset = 0x5394, name = "terrain", type = "i32", summary = "the battlefield's terrain", confidence = "read", refs = ["installation.md §7.16"] },
  { offset = 0x53C0, name = "special_field", type = "i32", summary = "special battlefield type (1 Magic Plains, 2 Cursed Ground)", confidence = "read", refs = ["installation.md §7.16", "installation.md §7.21"] },
  { offset = 0x53C4, name = "anti_magic_garrison", type = "i32", summary = "set at the start for object 33 subtype 1", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x53CC, name = "heroes", type = "hero*[2]", summary = "each side's hero, null without one", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x547C, name = "spell_marks", type = "u8[2][20]", summary = "one byte per side and record, set and cleared by the damage spells' handlers: Chain Lightning marks each stack it struck (0x5A659A) and its search passes them over (0x5A6255)", confidence = "read", refs = ["installation.md §7.8"] },
  { offset = 0x54A4, name = "side_is_human", type = "u8[2]", summary = "per side: the human flag +0xE2 of the side's player record (0x463AA8), 0 for a side without a player; H3API: isNotAI. The bad-morale check gives a side with 0 a second draw (0x464BDB); the Faerie Dragon's draw message asks it (§7.21)", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x54A6, name = "side_player_flags", type = "u8[2]", summary = "per side: the player record's +0xE2 and +0xE1 both set (0x463ABD), 0 without a player; H3API: isHuman (the review took it for the local human; not read further)", confidence = "inferred", refs = ["installation.md §7.21"] },
  { offset = 0x54B4, name = "hero_cast_mark", type = "i32[2]", summary = "per side: the hero has cast this round; tested where a player's cast is entered (0x59EC76), cleared at the round start (0x4760EE)", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x54BC, name = "stack_count", type = "i32[2]", summary = "records in use per side", confidence = "read", refs = ["installation.md §7.7", "installation.md §7.19"] },
  { offset = 0x54C4, name = "armies", type = "army*[2]", summary = "each side's army (a hero's, or the monsters'); the spell cost reads it, untouched until the battle's end", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x54CC, name = "stacks", type = "battle_stack[2][21]", summary = "stack records, side stride 0x6EE8", confidence = "read", refs = ["installation.md §7.7"] },
  { offset = 0x1329C, name = "natives", type = "u8[2]", summary = "per side: any stack native at the battle's start", confidence = "read", refs = ["installation.md §7.16", "installation.md §7.17"] },
  { offset = 0x132A0, name = "enchanter_counter", type = "i32[2]", summary = "rounds since the side's Enchanters cast; +1 at each round start, 0 after a cast, never reset when a battle starts (BAT-QUIRK-14)", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x132A8, name = "summoned_elemental", type = "i32[2]", summary = "the side's summoned elemental creature, -1 none", confidence = "read", refs = ["installation.md §7.7", "installation.md §7.19"] },
  { offset = 0x132B0, name = "retreated", type = "u8[2]", summary = "the side retreated", confidence = "read", refs = ["installation.md §7.19"] },
  { offset = 0x132B2, name = "surrendered", type = "u8[2]", summary = "the side surrendered", confidence = "read", refs = ["installation.md §7.19"] },
  { offset = 0x132B8, name = "last_activated_side", type = "i32", summary = "the real side of the stack activated last (0x465362); the turn order's tie-break prefers the other side (0x46502A); 1 after the tactics phase", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x132BC, name = "last_activated_record", type = "i32", summary = "the record index of the stack activated last (the active stack)", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x132C0, name = "acting_side", type = "i32", summary = "the side acting now", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x13D58, name = "objects", type = "vector<battle_object>", summary = "battlefield objects (begin +0x13D5C, end +0x13D60)", confidence = "read", refs = ["installation.md §7.15"] },
  { offset = 0x13D68, name = "tactics_phase", type = "i32", summary = "in the tactics phase", confidence = "read", refs = ["installation.md §7.21"] },
  { offset = 0x13DE4, name = "wait_phase", type = "u8", summary = "the round's wait phase: set when no stack is left to act (0x4652A7), cleared at the round start; no Wraith drain while set", confidence = "read", refs = ["installation.md §7.21"] },
]


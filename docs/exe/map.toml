{ va = 0x4960D0, kind = "function", name = "battle_idle_step", size = 0x76A, confidence = "read", summary = "The battle's idle step, every 100 ms whatever the combat speed (0x474040). Per living stack that is not blind, petrified, paralysed or an arrow tower: in group 1 (its fidget) it advances a frame unless a draw 0x50B1D0(0, 100) gives less than 8 (0x49666D), and at the group's end stands (group 2, frame 0) with its fidget clock +0xFC = trunc(now + r / 2 - t / 4), r = 0x50B1D0(0, t), t its fidget interval +0x154 (0x4966C6); standing in group 2, it starts group 1 (frame 0) once now - +0xFC > t and its DEF has the group. The active and the mouse's stacks are redrawn; each flag a frame on (0x496137) and each hero's groups (0x49641D: standing, it plays a defeat or victory asked for, once a round, while the active side's player is human, 0x4CE970, else the requests lapse; else its idle group 1 more than 4 500 ms after its clock +0x53FC, 0x4965AB; a frame a step, standing again at the group's end with its clock then, 0x4967AE; E17 design §7.14). Then counts +0x13FFC up, rotates game.pal's entries 0x60-0x67 and 0x70-0x77 by one (0x522950 with -1: the outlines' pulse), redraws (0x494440), and sets its next time 0x6989B8 to the old plus max(now - old, 100) (0x496820).", refs = ["epics/E17-design.md §4", "epics/E17-design.md §7"] },
{ va = 0x496840, kind = "function", name = "play_magic_animation", size = 0x1C5, confidence = "read", summary = "Plays magic animation `id` (0 to 82, the table 0x641E08) over stack `target`: nothing while the battle is hidden; loads its DEF (0x5A92F0) and sets the target's byte +0x20; with `show_hit` (not when the target already shows group 3) the target plays its hit group 3 frame by frame, each redraw waiting 100 ms, the animation's frames beside it, then stands; then the entry's force-feedback effect (0x4B69F0); then each frame left (+0x132F0) a redraw waiting `time` (trunc(time x F) on the deadline, battle_redraw); then the byte cleared and a last redraw waiting `time` (E17 M3 T3b).", args = "id, target stack, time, show_hit", h3api = "H3CombatManager::PlayMagicAnimation", refs = ["epics/E17-design.md §7.15"] },
{ va = 0x49D160, kind = "function", name = "reveal_disk", size = 0x268, confidence = "read", summary = "Reveals the tiles around (x, y) on a level for a player and every player of its team (the team bytes at game +0x1F879): each tile within the map with sqrt(dx^2 + dy^2) <= radius + 0.5 (crt_sqrt, f64) gets those players' bits in its vision word; that is dx^2 + dy^2 <= r^2 + r, as VCMI (ADV-FOG-002). A changed tile is also queued through a helper, and the last argument decides a call after the loop (both not read). Called by the move's step at the step's destination (0x48106B), a placed hero's setup (0x486E25) and reveal_owned among others.", args = "this = game; x, y, level, player, radius, flag", refs = ["rules/surveys/E08-adventure-core.md §2"] },
{ va = 0x49E670, kind = "function", name = "hero_lands_from_boat", size = 0x15C, confidence = "read", summary = "A hero leaves its boat for the land (hero +0x105 bit 0x40000 cleared): its movement points then follow from hero_max_land_movement (0x4E4990) in proportion when it wears artifact 0x88, else 0 (unless bit 0x1000000); then guard_attack (0x481900) for its landing tile, the only call of it but 0x480090's (E08 T20b3a). Read in part.", refs = ["rules/surveys/E08-battles.md §2.2"] },
{ va = 0x4A1120, kind = "function", name = "visit_campfire", size = 0x1C4, confidence = "read", summary = "A campfire's visit: the tile's word holds the resource (low 4 bits) and the amount (bits 4 up); gives 100 x amount gold, then the amount of the resource (0x4E3600), removes the object (0x4AABB0); a random draw picks the pickup sound only.", refs = ["rules/surveys/E08-objects.md §3.3"] },

{ va = 0x480090, kind = "function", name = "after_step_guard_check", size = 0x1A4, confidence = "read", summary = "After a hero's step (hero_move_step, visit_from_neighbour; args: the hero, the step's object, a skip flag, the x and y the hero stood on before the step, the move's end, a flag): unless skipped or the hero stands where it stood (0x4800B8 to 0x4800C9: visit_from_neighbour passes the hero's own tile, so a visit from the neighbouring tile tests no guard), on a tile whose guard flag is set (vision word bit 8) and that is no boat's, the guard attacks (0x481900); a hero at sea at once, a flying one (Angel Wings, hero +0x112) only at its move's destination. Returns the step's object, none when the hero no longer is the current player's.", refs = ["rules/surveys/E08-battles.md §2.2"] },
{ va = 0x480240, kind = "function", name = "visit_from_neighbour", size = 0x131, confidence = "read", summary = "A move's step toward an object that is not entered: stops the move, takes the step's price (arg 6) from the hero's points (+0x4D) and sets them to 0 below the cheapest next step (arg 7), as hero_move_step does; then 0x480090 with the hero's own tile as the one it stood on, so no guard test. The hero stays on its tile.", refs = ["rules/surveys/E08-objects.md §2.1"] },
{ va = 0x4805E0, kind = "function", name = "hero_move_step", size = 0x131C, confidence = "read", summary = "One step of a hero's move: prices it with 0x4B18C0 at the points left (+0x4D); a step it cannot pay stops the move and sets the points to 0 (0x480864); after the step the points drop to 0 when fewer than the cheapest step from the new tile remain (0x4B1880, 0x481182). Read around those sites only.", refs = ["rules/surveys/E08-adventure-core.md §1.3"] },

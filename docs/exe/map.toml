{ va = 0x49D3D0, kind = "function", name = "hide_disk", size = 0x260, confidence = "inferred", summary = "Takes the tile (x, y, level), a player and a radius: builds the mask of the player's team (the team bytes game +0x1F879, as reveal_disk) and a disk of the radius + 0.5; called by cover_of_darkness_hide (radius 20, the town's owner), by 0x4A14B0 (radius 20, the current player) and by 0x402450 (radius 200, the whole map). Read to the disk's set-up only (E08 T34b): which players' bits it clears (every player but the team, as the Cover of Darkness hides) is inferred from its callers, not read.", args = "this = game; x, y, level, player, radius", refs = ["rules/surveys/E08-hero-movement.md §4.2"] },

{ va = 0x4B51A0, kind = "function", name = "text_draw_glyph", size = 0xA9, confidence = "read", summary = "Draws glyph c (0-255; others nothing) at x plus its left space, y: width x height bytes, 0 skipped, 255 the font's colour entry `colour` (+0x1058), any other the font's entry 32 (+0x1098); no clipping.", args = "this = font; c, 16-bit picture, x, y, colour entry", refs = ["epics/E17-design.md §3.6"] },

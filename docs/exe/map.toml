# The address map of Heroes3.exe: our readings (docs/exe/README.md).
#
# Query it, do not read it whole (about 70 KB): `scripts/exe.py lookup <address|name|text>`
# finds entries, H3API names and struct fields; `fn`, `callers`, `switch` show the code.
#
# One entry per line, sorted by address. `cargo xtask check-exe-map` checks the format and that
# every address cited under docs/ and crates/ lies in an entry (a function or table covers its
# whole size; a site only itself). `scripts/exe.py` shows these names in its listings and fills
# function sizes (`scripts/exe.py check --fix-sizes`).
#
# kind:       function | site (a notable instruction inside a function) | table | global
# confidence: read (an agent read the code) | inferred (role deduced from callers, data or
#             behaviour; not read) | guess (a name from elsewhere, e.g. H3API, not checked)
# summary:    our own words and numbers; never code or listings (Q29). Details stay in the docs
#             named in refs; the summary says enough to find the right one.
# args:       arguments in order, for thiscall `this` first; returns: the result.
#
# Seeded 2026-10-08 (shared/exe-map) from docs/formats/installation.md §5–§7.21 and the rule
# catalog: every address cited then. Readings before the map had no tool for function bounds;
# where a doc's address is a few bytes into a function, the entry is at the function's start
# and its summary says so.

# The executable (docs/formats/installation.md §1) and the range citations are checked in;
# `ignore` lists numbers in that range the docs use for something else.

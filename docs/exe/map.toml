{ va = 0x472E90, kind = "function", name = "battle_log_add", size = 0x35E, confidence = "read", summary = "Adds a text to the battle's log (the manager's +0x132FC; E17 M3 T4b-2a): nothing when the battle is not shown or the log has no window. With the second argument 0 (the status line) the text replaces the status line unless a log entry came less than 3 000 ms ago (+0x6C, 0x4F82E0) and the third argument is 0. With 1, the entry: a text without a line break is one entry; with one, its first break becomes a space if the text then takes fewer than two lines of the small font at the log item's width (0x4B5820), else the text is two entries split there; the new entries' count +0x64 (at most 2) sets the first line shown (0x472C30).", args = "this = the log; text, entry (1) or status line (0), force", refs = ["epics/E17-design.md §9.4"] },
{ va = 0x4731F0, kind = "function", name = "combat_dialog_battle_panel", size = 0x99, confidence = "read", summary = "The combat dialog's panel replaced by the battle's at the tactics phase's end (E17 M5 T4c2a): the panel +0x70 destroyed (its vtable +0, 1), battle_panel_create 0x46BC30 made the new +0x70, the dialog redrawn (vtable +0x14) and the whole screen shown; from the computer's phase end in the battle loop (0x474552), Start Combat (0x475258) and round_start (0x475F92).", args = "this = the combat dialog", refs = ["epics/E17-design.md \u00a77.23"] },

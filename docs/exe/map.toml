{ va = 0x56AB40, kind = "function", name = "pathfinder_pass_through", size = 0x50C, confidence = "read", summary = "The pathfinder's test whether a path may go on from an object's tile (called by pathfinder_run): border gate (212, 0x56ABB1) by the player's key bit; border guard (9) the same in the modes from 4 (else no); every class not in its switch by the 'cannot be entered' setting being clear (0x56AF27). Read in those cases only; when the caller asks was not read.", refs = ["rules/surveys/E08-objects.md §2.2"] },
{ va = 0x56B440, kind = "function", name = "pathfinder_run", size = 0x8EC, confidence = "read", summary = "The adventure pathfinder (H3Pathfinder at 0x699284): pops the cheapest node of its open list (+0x3C/+0x40, 30-byte nodes), reloads the tile's stored node (+0x24), and expands it with 0x4B2300 priced at start points (arg 7, the hero's +0x4D) minus the node's cost +0x18 (0x56BB62). One node per tile: like VCMI's and our query, not exact when a step's price depends on the points left (the diagonal exception).", refs = ["rules/surveys/E08-adventure-core.md §1.3"] },
{ va = 0x5996C0, kind = "function", name = "sound_volume", size = 0x97, confidence = "read", summary = "A sound's Miles volume from its own (0 to 127) and a setting: kind 0x65 the music's (0x698760), else the effects' (0x698764); v x (s + 1) / 10, at least 1, at most 127, for a setting of 1 to 10; 0 otherwise.", args = "volume, kind", returns = "the volume to set", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x599E80, kind = "function", name = "stop_sample", size = 0x3D, confidence = "read", summary = "Ends a sample by its handle (AIL_end_sample) under the sound manager's lock; nothing without sound. H3API calls it H3AdventureManager::StopSound, but `this` is the sound manager (0x6993C4) at every call read.", args = "this = sound manager; the sample handle", refs = ["epics/E17-design.md §8.2"] },

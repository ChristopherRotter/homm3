{ va = 0x4960D0, kind = "function", name = "battle_idle_step", size = 0x76A, confidence = "read", summary = "The battle's idle step, every 100 ms whatever the combat speed (0x474040). Per living stack that is not blind, petrified, paralysed or an arrow tower: in group 1 (its fidget) it advances a frame unless a draw 0x50B1D0(0, 100) gives less than 8 (0x49666D), and at the group's end stands (group 2, frame 0) with its fidget clock +0xFC = trunc(now + r / 2 - t / 4), r = 0x50B1D0(0, t), t its fidget interval +0x154 (0x4966C6); standing in group 2, it starts group 1 (frame 0) once now - +0xFC > t and its DEF has the group. The active and the mouse's stacks are redrawn; each flag a frame on (0x496137) and each hero's groups (0x49641D: standing, it plays a defeat or victory asked for, once a round, while the active side's player is human, 0x4CE970, else the requests lapse; else its idle group 1 more than 4 500 ms after its clock +0x53FC, 0x4965AB; a frame a step, standing again at the group's end with its clock then, 0x4967AE; E17 design §7.14). Then counts +0x13FFC up, rotates game.pal's entries 0x60-0x67 and 0x70-0x77 by one (0x522950 with -1: the outlines' pulse), redraws (0x494440), and sets its next time 0x6989B8 to the old plus max(now - old, 100) (0x496820).", refs = ["epics/E17-design.md §4", "epics/E17-design.md §7"] },
{ va = 0x496840, kind = "function", name = "play_magic_animation", size = 0x1C5, confidence = "read", summary = "Plays magic animation `id` (0 to 82, the table 0x641E08) over stack `target`: nothing while the battle is hidden; loads its DEF (0x5A92F0) and sets the target's byte +0x20; with `show_hit` (not when the target already shows group 3) the target plays its hit group 3 from frame 0, each redraw waiting 100 ms, the animation's frame i beside it while it has one, then stands (shown at once when the hit had at least as many frames); then the entry's force-feedback effect (0x4B69F0); then each frame left (+0x132F0) a redraw waiting `time` (trunc(time x F) on the deadline, battle_redraw); then the byte cleared and a last redraw waiting `time` (E17 M3 T3b, T7a-1: its 22 callers).", args = "id, target stack, time, show_hit", h3api = "H3CombatManager::PlayMagicAnimation", refs = ["epics/E17-design.md §7.15", "epics/E17-design.md §7.16"] },
{ va = 0x496A10, kind = "function", name = "play_magic_animation_at_hex", size = 0x23D, confidence = "read", summary = "Plays magic animation `id` at a hex (nothing while hidden): loads it (0x5A92F0), places it by the kind's low nibble (0 centred on the cell's lower edge, 1 centred 37 above the anchor, 4 from the hex's left on the lower edge, else at (keep, keep)); per frame a redraw waiting `time` not shown, the frame drawn over everything (0x47C170, translucent by bit 8), the battlefield shown; without `keep` a last redraw at `time` erases it. The frame is counted locally (E17 M3 T7a-1).", args = "id, hex, time, keep", refs = ["epics/E17-design.md §7.16"] },

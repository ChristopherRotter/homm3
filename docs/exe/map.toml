{ va = 0x441FA0, kind = "function", name = "stack_walk", size = 0x461, confidence = "read", summary = "The walker: enters each hex of the path (Fire Wall, Land Mine, moat), stops at stops (0x442266) and at Quicksand under its new position or other hex, the hexes it started on not excepted (0x442281, 0x4422FD), releases Bind (0x4420A3), ignores a mine's result (0x44237E); returns false when it stopped early. Saves the facing at its start (0x442023) and, with its second argument set (a plain move, 0x479106; not a move that strikes, 0x478971), turns back to it at the end, animated (0x4423A2, 0x4423B7; read for E17 M2 T4b-2a). Sets +0x30 (no count box) before the path's first step and its turn (0x442145) and clears it after the turn back and group 2, then redraws the whole battle and shows it at once (0x4423D9, battle_redraw 0x4423E7 with its first and fifth arguments; read for E17 M3 T5a).", refs = ["installation.md §7.15", "installation.md §7.16", "installation.md §7.17", "installation.md §7.20", "epics/E17-design.md §8.2"] },

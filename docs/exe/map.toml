{ va = 0x480380, kind = "function", name = "hero_walk_animation", size = 0x25C, confidence = "read", summary = "A step's animation (the hero, the direction 0-7, dx, dy): the view's offset +0xF4, +0xF8 0, +0x1F4 the direction, +0x1FC the walking group (5 up, 6 up-right and up-left, 7 right and left, 8 down-right and down-left, 9 down: 0x4805BC), +0x390 1, the hero's tile moved by (dx, dy). Shown only while view_shown: the speed (option_walk_speed for a human player, option_computer_walk_speed else, 0x480421), the view's corner the new tile less (9, 8) (0x480439), +0x214 1; at speed 4 the view drawn and shown once (0x480483), no wait; else 32 / walk_frame_pixels frames (16, 4, 3, 2 at speeds 0 to 3), each: the end time = clock + walk_frame_times, the offset from walk_start_offsets (dx x 32, dy x 32) less the frame's pixels x (dx, dy) (12 for the second frame of 10-pixel steps, 0x480509), the view drawn (view_draw_here 0x40F870) and (0, 8) to (608, 552) shown at once, wait_until the end time (0x480593). Then +0x390 0 and 0x6968E8 0 (E24 M2 T1b).", refs = ["epics/E24-design.md §3.5"] },
{ va = 0x4805E0, kind = "function", name = "hero_move_step", size = 0x131C, confidence = "read", summary = "One step of a hero's move: prices it with 0x4B18C0 at the points left (+0x4D); a step it cannot pay stops the move and sets the points to 0 (0x480864); after the step the points drop to 0 when fewer than the cheapest step from the new tile remain (0x4B1880, 0x481182). Read around those sites only. E08 T55a3: a step onto an event that fires for the player (event_fires_for 0x4FCDC0, at 0x4811A3) sets the stop flag and move_interrupted (0x69777C, 0x4816B6; cleared at the step's start, 0x48060D); after the step event_fire (0x4A0ED0, at 0x481741). E24 M2 T1b (the walk): the destination tile written to the third argument, the hero's facing +0x47 and +0x1F4 the direction (0x480946, +0x204 0 on a change), the selected hero lifted (mobilize_hero 0x4175E0 with 0, 0, 1: the view centred if it was not), +0x1EC 1 while view_shown (0x480922), the next tile's path arrow zeroed (path_arrow_at 0x41B010, 0x480B30), the step refused by hero_step_allowed 0x481BE0 (0x480CCB); then the animation (hero_walk_animation 0x480380, at 0x48117A), the points; at the move's last step (its second argument, or the points then 0, or an event) the standing group (hero_map_group, +0x1FC), +0x200 0 and the step sound stopped (0x4811CD), with the fifth argument the view redrawn (0x481255); the terrain's music when the view's centre changed terrain (0x4812DF), the step sound of the new tile played at once or queued (0x48137B: step_sound_playing, step_sound_next), the ambient sounds (0x48141B), the view's offset 0 (0x481423). E08 T62b (the order with a guard): the guard test after_step_guard_check at 0x48169D comes first, the event's fire at 0x481741 after it, on the frame's flag alone (whatever the guard's visit ended in: A-26). E08 T66a1 (the boat's sites): the drop's cheapest step in a boat without flying or water walking (0x4807EF); in a boat onto class 3 (the landing, 0x48095A) the hero's boat put on its water tile, its facing the hero's, aboard 0; the class switch 0x480C12: a boat (8) from land the network's calls only, from a boat the guard test only; a hero (34) from a boat visited from the neighbour when it is in a boat too (0x480D89); a neighbour-visited class from a boat visited from the neighbour without the flying test (0x480F3A); after the step an entrance or, in a boat, class 3 goes to the visit (0x48143B); the network's direct boarding 0x481137. E08 T66a2: before the class switch hero_step_or_meet_allowed 0x481AD0 (0x480BEB) must pass; a flyer reaches the switch only on its path's last step (0x480B44 to 0x480BD0); the default case 0x480F27, a class whose object_settings +0 is set: visit_from_neighbour 0x480240 at once in a boat or for a walker or water walker, a flyer after hero_flight_tile_test on the ground under it (0x480F5E); so a flyer on land takes a pickup on the water beside it by a click (a water walker gets no such step: the search refuses it, the keys walk); a step refused here zeroes the points when the fifth argument is set (0x480CDF).", refs = ["rules/surveys/E08-adventure-core.md §1.3", "rules/surveys/E08-rewards.md §7.3", "epics/E24-design.md §3.5", "rules/surveys/E08-sea.md §3.1", "rules/surveys/E08-sea.md §3.2", "rules/surveys/E08-sea.md §4.3", "rules/surveys/E08-sea.md §8.1"] },

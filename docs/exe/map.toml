{ va = 0x55BB00, kind = "function", name = "font_load", size = 0x8A, confidence = "read", summary = "A font by name from the resource cache (0x69E528, counted references), else read (0x55B8D0) and added. Confirms H3API.", args = "this = name", returns = "font", h3api = "H3Font::Load", refs = ["epics/E17-design.md §3.6"] },
{ va = 0x55C7B0, kind = "function", name = "load_def", size = 0x743, confidence = "read", summary = "Loads a DEF: the name cache, the sprite search list (twice, a report between), the header's type, width and height to the DEF (the archive's type unread), the frame form by type (0x47C360 or 0x47C2B0), the palette to the screen format (0x5226D0). Read in those parts.", h3api = "H3LoadedDef::Load", refs = ["epics/E17-design.md §3.1"] },

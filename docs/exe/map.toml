{ va = 0x4B5260, kind = "function", name = "text_draw_line", size = 0x22E, confidence = "read", summary = "Draws one line of a text: down by the font's y offset (+0x22), right by a negative left space of its first glyph; nothing unless it lies inside the box's height; glyphs left of the box skipped; braces switch the highlight (+1 to the entry); ends before a glyph that would pass the box's right edge; the colour argument + 9 unless bit 0x100; a caret `_` at index `caret` (-1 none).", args = "this = font; text, length, 16-bit picture, x, y, colour, box x, y, width, height, caret", refs = ["epics/E17-design.md §3.6"] },
{ va = 0x4B5490, kind = "function", name = "text_draw", size = 0x308, confidence = "read", summary = "Draws a text into a box: alignment bit 4 centres the lines in the height, bit 8 puts them at the bottom (0x4B5820 counts them), the rest aligns each line (1 centred, 2 right); lines end at a newline, the end or past the width, then break after the last space that fits, else at the first glyph from the end that fits (that glyph lost), in the box's last line at that glyph; stops at the first line past the bottom; each line through 0x4B5260. Confirms H3API.", args = "this = font; text, 16-bit picture, x, y, width, height, colour, alignment, caret", h3api = "H3LoadedPcx16::TextDraw", refs = ["epics/E17-design.md §3.6"] },

{ va = 0x56AB40, kind = "function", name = "pathfinder_pass_through", size = 0x50C, confidence = "read", summary = "The pathfinder's test whether a path may go on from an object's tile (called by pathfinder_run): border gate (212, 0x56ABB1) by the player's key bit; border guard (9) the same in the modes from 4 (else no); every class not in its switch by the 'cannot be entered' setting being clear (0x56AF27). Read in those cases only; when the caller asks was not read.", refs = ["rules/surveys/E08-objects.md §2.2"] },
{ va = 0x56B440, kind = "function", name = "pathfinder_run", size = 0x8EC, confidence = "read", summary = "The adventure pathfinder (H3Pathfinder at 0x699284): pops the cheapest node of its open list (+0x3C/+0x40, 30-byte nodes), reloads the tile's stored node (+0x24), and expands it with 0x4B2300 priced at start points (arg 7, the hero's +0x4D) minus the node's cost +0x18 (0x56BB62). One node per tile: like VCMI's and our query, not exact when a step's price depends on the points left (the diagonal exception).", refs = ["rules/surveys/E08-adventure-core.md §1.3"] },
{ va = 0x5996C0, kind = "function", name = "sound_volume", size = 0x97, confidence = "read", summary = "A sound's Miles volume from its own (0 to 127) and a setting: kind 0x65 the music's (0x698760), else the effects' (0x698764); v x (s + 1) / 10, at least 1, at most 127, for a setting of 1 to 10; 0 otherwise.", args = "volume, kind", returns = "the volume to set", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x599E80, kind = "function", name = "stop_sample", size = 0x3D, confidence = "read", summary = "Ends a sample by its handle (AIL_end_sample) under the sound manager's lock; nothing without sound. H3API calls it H3AdventureManager::StopSound, but `this` is the sound manager (0x6993C4) at every call read.", args = "this = sound manager; the sample handle", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x59A210, kind = "function", name = "play_sample", size = 0x1DB, confidence = "read", summary = "Plays a WAV object: its category (+0x28) picks a range of the manager's sample handles (0x684AB8), the first whose sample is done, else the range's next in turn (its sample ended, 0x59A2DD; category 4 then plays nothing); loads the file, sets the loop count (+0x30) and the volume (+0x2C through sound_volume 0x5996C0) and starts it; stores the handle in +0x1C.", args = "this = sound manager; the WAV object", returns = "the sample handle", h3api = "H3SoundManager::ClickSound", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x59A470, kind = "function", name = "play_sound_file", size = 0x43, confidence = "read", summary = "Loads a WAV by name (0x55C720), sets its category 2 and plays it (play_sample 0x59A210).", args = "ecx = name", returns = "the sample handle and the WAV object", h3api = "H3SoundManager::PlaySoundByFileAsync", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x59A4C0, kind = "function", name = "wait_for_sample", size = 0xCE, confidence = "read", summary = "Waits while the sample plays, at most the given milliseconds of the game clock (4000 if negative), handling messages meanwhile; then ends it and frees the WAV object.", args = "ecx = milliseconds; the WAV object, the sample handle", h3api = "H3SoundManager::PlaySoundAndWait", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x59A830, kind = "function", name = "music_thread", size = 0x3CB, confidence = "read", summary = "The music's thread (from +0x10, 0x59A840, which play_music 0x59ACB0 starts; the first 16 bytes a stub that ends it): opens the pending name as mp3\\<name>.mp3 (AIL_open_stream), sets its loop count; a looping track (count 0) starts silent at the position where that name last stopped (a table of names and positions, 0x59AA82), then its volume rises by a tenth of the music volume every 100 ms (0x59AB5D, an f32 sum truncated) to the whole after 900 ms; a track played once starts at its volume.", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x59ACB0, kind = "function", name = "play_music", size = 0x355, confidence = "read", summary = "Starts a music track by name unless it plays already: with its third argument set, first ends every effect sample (0x59ADAC); then hands the name and the loop count (0: forever) to music_thread (0x59A840).", args = "this = sound manager; name, loop count, stop the effects (byte)", refs = ["epics/E17-design.md §8.2"] },

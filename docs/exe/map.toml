{ va = 0x469F20, kind = "function", name = "necromancy_add_raised", size = 0xBA, confidence = "read", summary = "Adds the battle's raised creatures (+0x13D50 the creature, +0x13D4C the count; nothing if the count is 0) to the side's army (+0x54C4 by side) through army_add_stack 0x44ACE0. If they do not fit, their upgrade (0x47B1A0; none for creatures 112-115 while [game]+0x1F698 is 0) at (2c + 2) / 3 creatures (truncated: the count times 2/3 rounded up) is tried once; if that fails too the count becomes 0. Called once, from battle_end (0x47776E). Read for E08 T19a2 (D-9).", args = "this = the battle; the side", h3api = "H3CombatManager::AddNecromancyRaisedCreature", refs = ["epics/E08-design.md §5"] },
{ va = 0x469FE0, kind = "function", name = "eagle_eye_learn", size = 0x88, confidence = "read", summary = "Battle end, winner side: its hero learns each spell of the side's Eagle Eye set (+0x545C) if it wears a Spell Book (0) and the level is at most Wisdom (+0xD0) + 2.", refs = ["installation.md §7.24"] },

{ va = 0x4D9EC0, kind = "function", name = "starting_army_one_creature_caller_2", size = 0x4D3, confidence = "inferred", summary = "Sets a hero's movement points, then calls 0x4C9730 with the one-creature flag set unless 0x697744 is set; not read. Called for an attacking hero that lost a battle on the map (0x4AE6D5, argument 1): back into the heroes' pool.", refs = ["rules/surveys/E08-adventure-core.md §3.1", "rules/surveys/E08-battles.md §7.4"] },
{ va = 0x4DA720, kind = "function", name = "hero_level_up", size = 0x5DD, confidence = "read", summary = "Gives a hero the levels of its experience (+0x51), one at a time (E08 T24a1): finds the experience's level (0x679C88, beyond 12 the x 1.2 steps); a hero level (+0x55) above it is lowered to it (0x4DACA8); per level: the level +1, set_random_seed(214013 L + 156823 S + 154079) with S the level seed +0x8F (0x4DA830), the primary skill by random_between(1, 100) over the class's chances (record +0x10 to level 9, +0x14 from 10; +1 unclamped, 0x4DA8F7; a campaign branch for hero 45), two offers (0x4DAD00: an advance of a known skill, then a new one, each with a fallback), the counters +0x3F and +0x90 set to the level for an offered school or Wisdom; then a human owner at its own computer outside the new game's setup (0x698400 clear) answers the dialog (0x4F8880; one offer learned without a choice, results 2010 left, 2011 right, 9999 the computer's choice), anyone else gets 0x52BBD0's choice; learning through 0x4E22D0.", args = "this = the hero", refs = ["rules/surveys/E08-progression.md §2"] },
{ va = 0x4DAD00, kind = "function", name = "hero_secondary_offer", size = 0x283, confidence = "read", summary = "One level-up offer (E08 T24a1): a candidate skill has a level in [lowest, bound) and is not the excluded one; with 8 skills (+0x101) the lowest becomes 1, no window left -1. Wisdom (7) outright when +0x90 + interval <= the level (not banned); else a school (0x679CBC) when +0x3F + interval <= the level and the excluded one is no school: drawn among the unbanned candidate schools, a known one weighing 1, an unknown one its class weight; else a draw over all candidates by the class weight (record +0x18 + skill), a known skill at least 1, a banned one 0 or 1 if known. Intervals 3 and 3 for classes 1, 3, ..., 15, else 6 and 4 (the Elementalist 17 too). Banned: game +0x4E658, or 0x679CA0 in the campaign branch for hero 45. Draws: random_between(1, total), walked in skill order.", args = "ecx hero, edx lowest level; bound (exclusive), excluded skill (-1 none)", returns = "skill or -1", refs = ["rules/surveys/E08-progression.md §2.4"] },
{ va = 0x4DD2D0, kind = "function", name = "hero_screen_proc", size = 0x143E, confidence = "inferred", summary = "Reached through a pointer only: handles the commands of the hero screen for its hero; read only at two neighbouring cases (E08 T22b): one clears bit 0 of the hero's byte +0x48 (0x4DD577), the next sets it (0x4DD587): the formation buttons, loose and tight (the battle reads the bit, 0x463673).", refs = ["rules/surveys/E08-battles.md §6.4"] },
{ va = 0x4E22D0, kind = "function", name = "hero_learn_secondary_skill", size = 0x61, confidence = "read", summary = "Raises a known secondary skill (+0xC9 + id) by the amount, at most to 3; learns a new one only below 8 skills (+0x101): its level the amount, its slot (+0xE5 + id) the count + 1, the count + 1; a ninth is refused silently. Returns the levels gained. E08 T24a1.", args = "this = hero; id, amount", returns = "levels gained", h3api = "H3Hero::LearnSecondarySkill", refs = ["rules/surveys/E08-progression.md §2.5"] },

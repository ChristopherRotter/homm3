{ va = 0x4E33B0, kind = "function", name = "hero_gain_experience", size = 0x24A, confidence = "read", summary = "Adds the points to the hero's experience (+0x51, 32-bit). With the scenario's level limit (game +0x1F877, 0 none) the cap is the limit's threshold (0x679C88 to 12, beyond it steps x 1.2 by crt_ftol, 32-bit sums that wrap past level 75); above it the experience becomes the cap, lowered too (0x4E347E), the levels given only from below it, a message to a human owner if asked, returns 0. Else finds the level and, if asked, gives the levels (hero_level_up 0x4DA720); returns the levels gained. Called by the battle's end (0x477766, 0x477948) and 11 other sites. E08 T19a2a, T24a1.", args = "this = hero; points, give levels, tell the owner", refs = ["installation.md §7.24", "epics/E08-log.md T19a2a", "rules/surveys/E08-progression.md §1.3"] },

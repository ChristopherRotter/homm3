{ va = 0x446720, kind = "function", name = "stack_turn_around", size = 0x107, confidence = "read", summary = "Turns a stack around: flips its facing +0x44; a two-hex stack's position +0x38 moves onto its other hex (- 1 when it turns to face right, + 1 to face left), so it keeps its two hexes and its position stays the hex behind it; the two hexes' draw parts (+0x1A) are rewritten; with its argument set the turn is animated (0x446940). Callers: the shot, melee attack, walk step, strike, creature cast, flight, teleporting move and raise routines.", args = "this = stack; animate (byte)", refs = ["installation.md §7.25"] },

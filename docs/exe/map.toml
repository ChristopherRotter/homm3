{ va = 0x441CB0, kind = "function", name = "melee_attack", size = 0x2BE, confidence = "read", summary = "A melee attack: marks a blind/paralysed target (0x441D9C), strike, retaliation if the struck stack is alive and allowed (0x441DC5, 0x441DD4, petrified: none 0x441DED, one used 0x441DF7; the attacker's creatures are not asked), second strike (0x441E91 tests blind/petrified/paralysed, 0x441EAF the attacker's creatures), Berserk ends (0x441F55). Sets the attacker's draw layer 6 (0x441CC1); the struck stack turns to face its attacker, animated, when the attacker is not on its front side (0x4458B0, 0x441D79, the active stack set to it meanwhile), and turns back at the end if it lives and turned (0x441EE1 to 0x441F36; read for E17 M2 T4b-2a).", refs = ["installation.md §7.10", "installation.md §7.11", "installation.md §7.14", "installation.md §7.20"] },

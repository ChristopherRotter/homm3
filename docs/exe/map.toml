{ va = 0x486590, kind = "function", name = "carried_hero_setup", size = 0xA84, confidence = "read", summary = "Sets up a hero carried over from an earlier campaign scenario (E08 T24a2a; named map_hero_setup until then, when E08 T6b to T22b took it for the placed hero's setup, which is 0x4D8B30): called by carried_heroes_setup (0x487290) with the scenario header (H3API H3CmpScenarioHeader) and the carried hero; it tests the header's keepExperience to keepArtifacts (+0x44 to +0x48: 0x48661D, 0x486632, 0x48676D, 0x48694C, 0x486996): with the first it copies the experience and the level (+0x55) from the carried hero (0x486624); kept primary skills are copied without the worn artifacts' bonuses, clamped to 0-99 (Spell Power and Knowledge at least 1); a hero left without creatures gets the starting army (0x4C9730, site 0x486944); it reveals around the hero (0x486E25); the spell points: trunc(0x4E48B0 x f32(10 x Knowledge)), Knowledge (+0x479) clamped to 1-99 (0x486C5C to 0x486C98), with the worn artifacts' bonuses (equipped before, 0x4866D5 and 0x48675C); no write of the formation byte +0x48. Read in parts.", refs = ["rules/surveys/E08-adventure-core.md §1.1", "rules/surveys/E08-adventure-core.md §3.1", "rules/surveys/E08-battles.md §6.3", "rules/surveys/E08-progression.md §3.1"] },
{ va = 0x487290, kind = "function", name = "carried_heroes_setup", size = 0x664, confidence = "inferred", summary = "Called by new_game_heroes (0x4C0042) only when it has its third argument (one of its two callers passes one): walks the game's campaignInfo (+0x1F458) crossoverHeroes (+0x3C, H3API H3CmpInfo; 0x4872BB, 0x4875CE) and calls carried_hero_setup (0x486590) for a carried hero (0x487645, 0x4876CC). Named map_heroes_setup until E08 T24a2a. Read in parts.", refs = ["rules/surveys/E08-adventure-core.md §3.1", "rules/surveys/E08-progression.md §3.1"] },
{ va = 0x4922F0, kind = "function", name = "battle_status_line_caster", size = 0x54C, confidence = "inferred", summary = "After battle_status_line's kinds 0, 1, 2 and 5: for an acting Archangel (13), Pit Lord (51) or Ogre Mage (91) over an own stack or a corpse writes the caster's hint (raise_count, creature_spell_factor) and returns true (forced); not read further (E17 M3 T6c-1).", refs = ["epics/E17-design.md §9.9"] },

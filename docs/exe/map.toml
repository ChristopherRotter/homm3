{ va = 0x49D160, kind = "function", name = "reveal_disk", size = 0x268, confidence = "read", summary = "Reveals the tiles around (x, y) on a level for a player and every player of its team (the team bytes at game +0x1F879): each tile within the map with sqrt(dx^2 + dy^2) <= radius + 0.5 (crt_sqrt, f64) gets those players' bits in its vision word; that is dx^2 + dy^2 <= r^2 + r, as VCMI (ADV-FOG-002). A changed tile is also queued through a helper, and the last argument decides a call after the loop (both not read). Called by the move's step at the step's destination (0x48106B), a placed hero's setup (0x486E25) and reveal_owned among others.", args = "this = game; x, y, level, player, radius, flag", refs = ["rules/surveys/E08-adventure-core.md §2"] },
{ va = 0x4A1120, kind = "function", name = "visit_campfire", size = 0x1C4, confidence = "read", summary = "A campfire's visit: the tile's word holds the resource (low 4 bits) and the amount (bits 4 up); gives 100 x amount gold, then the amount of the resource (0x4E3600), removes the object (0x4AABB0); a random draw picks the pickup sound only.", refs = ["rules/surveys/E08-objects.md §3.3"] },
{ va = 0x4A4780, kind = "function", name = "visit_guarded_resource", size = 0x45D, confidence = "inferred", summary = "A resource pile with guards (bit 31 of the tile's word, 0x4A4BF4): the guards' question and battle before the pickup; not read.", refs = ["rules/surveys/E08-objects.md §3.1"] },

{ va = 0x4B1740, kind = "function", name = "step_cost", size = 0x13E, confidence = "read", summary = "The price of a step from a source tile in a direction: both roads -> the source road's cost; native terrain (no Cursed Ground) -> 100; else the terrain's by Pathfinding (0x63E510); Nomads, Favorable Winds, water walking and flying change it. A diagonal compares the points left with the plain terrain cost T: below T, T to below T*sqrt2 the straight cost, from T*sqrt2 trunc(cost*sqrt2) (A-2, A-3). Second reading agrees (2026-10-10).", args = "source tile, direction, points left, Pathfinding, destination road, fly level, water-walk level, native terrain, has Nomads", refs = ["rules/surveys/E08-adventure-core.md §1.2", "rules/surveys/E08-adventure-core.md §1.3"] },

{ va = 0x50CCA0, kind = "function", name = "mouse_set_cursor", size = 0xE0, confidence = "read", summary = "H3API's H3MouseManager::SetCursor(frame, type): loads the type's DEF (0x67FF38) when the type changes, then for a new frame (type 3, the spell cursor: frame 0) draws it (0x50D8B0) and the cursor (0x50CD90 with 1) (E17 M3 T6c-1).", refs = ["epics/E17-design.md §9.9"] },

{ va = 0x442690, kind = "function", name = "stack_controlling_hero", size = 0x39, confidence = "read", summary = "The hero controlling a stack: its side's, the other side's while hypnotized.", h3api = "H3CombatCreature::GetOwner", refs = ["installation.md §7.10", "installation.md §7.14"] },
{ va = 0x4426F0, kind = "function", name = "ai_damage_per_creature", size = 0x8B, confidence = "read", summary = "A stack's damage per creature for the computer (a double): max + Bless's bonus while blessed, max(1, min - Curse's penalty) while cursed, else (min + max) / 2.0.", args = "this = stack", refs = ["installation.md §7.46"] },
{ va = 0x442780, kind = "function", name = "ai_damage_estimate", size = 0x100, confidence = "read", summary = "The computer's damage of n creatures of the stack on T: per creature (the record's +0xD0, +0xD4: a Ballista's 2 and 3, without its hero's multiplier) max + Bless's bonus, max(1, min - Curse's penalty) or (min + max) / 2.0; the base trunc(n x d) through the physical damage 0x443F40 with the estimate flag (no death blow or Ballista draw); at least 1; x2 for a double shot; with the cap flag at most T's hit points.", args = "this = stack; T, shot flag, count, cap flag, jousting hexes", refs = ["installation.md §7.33", "installation.md §7.47"] },
{ va = 0x442880, kind = "function", name = "stacks_are_enemies", size = 0x68, confidence = "read", summary = "Whether the second stack is the first's enemy: the first's controller (its side flipped by its own Hypnotize) against the second's own side +0xF4; yes when either is berserk. Asked by the blocked-shooter test 0x469600 and the neighbour test of multi-headed strikes 0x523BB0 only.", args = "this = the first stack; the second stack", refs = ["installation.md §7.14", "BAT-MAG-025", "BAT-MAG-026"] },

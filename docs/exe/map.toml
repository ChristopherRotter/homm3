{ va = 0x44C590, kind = "function", name = "army_native_terrain", size = 0x76, confidence = "read", summary = "The army's native terrain for movement: walks the seven slots in order, each creature's faction's native terrain (0x643698; a neutral creature reads -1 before the table, as do the four elementals 112-115 while the game flag +0x1F698 is clear); the first value sets it unless it is -1, a later one that differs gives -1 (neutral stacks before the first faction stack are skipped: ADV-QUIRK-4). Second reading agrees (2026-10-11).", refs = ["rules/surveys/E08-adventure-core.md §1.2"] },

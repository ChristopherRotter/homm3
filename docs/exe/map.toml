{ va = 0x469750, kind = "function", name = "stack_morale_luck_update", size = 0x12B, confidence = "read", summary = "The only caller of stack_luck and stack_morale, at the battle's start (0x462E19) and after every action (0x479D16): for every record in use of both sides, from the stack's controller (+0xF4, flipped while +0x288): its hero and army, the other side's, the special field +0x53C0 and the town only for the defender's controller.", refs = ["installation.md §7.26", "installation.md §7.32"] },
{ va = 0x469880, kind = "function", name = "shot_angle_group", size = 0x190, confidence = "read", summary = "Client probe of the exe-decompile trial (2026-10-12), provisional, no experiment: a shot's animation group by angle. ecx creature, edx the shooter's screen x; then its y, facing, the target's x and y, the projectile DEF, and out: start x, start y, group, frame (ret 0x24). Start = the shooter plus the creature's straight missile offset ([0x67FF24] + creature x 0x54, +4/+6; x subtracted at facing 0); angle = atan(-dy / |dx|) in degrees (f64, stored f32), or for dx = 0 +90 if dy > 0 else -90 (the sign inverted against every other angle); > 25.0 group 14 (up), > -25.0 group 15 (straight), else 16 (down), f64 thresholds; then the start point from that group's offset; the frame = the count of leading midpoints of consecutive f32 angles from +0xC (up to the DEF's group 0 frames) that are at least the angle (0x469957; confirmed by E17 M2 T4b-1's reference frames, the Marksmen's straight shot frame 4).", refs = ["epics/E17-design.md §7.9", "lanes/battle/exe-decompile-trial.md"] },
{ va = 0x469A10, kind = "function", name = "hex_blocked", size = 0x80, confidence = "read", summary = "Whether a hex blocks movement and standing: the blocked bit 0x2; in a siege hexes 95 and 96 apart from it: free while the gate is not closed, blocked while it is closed but for the acting side 1 (the defender) when hexes 95 and 94 hold no living stack and no corpse (94 in every town).", refs = ["installation.md §7.15", "installation.md §7.28"] },

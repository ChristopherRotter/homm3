{ va = 0x481AD0, kind = "function", name = "hero_step_or_meet_allowed", size = 0x10D, confidence = "read", summary = "Called by hero_move_step (0x480BEB) before its class switch for a step onto an entrance (read whole, E08 T66a2): off the map 0; a destination that is not a hero (class 34): hero_step_allowed 0x481BE0 with flags 1, 0 (0x481B64); a hero: 1 when the moving hero is not in a boat, else the other hero's in-boat flag (+0x105 bit 18; 0x481B71 to 0x481BBD). A refusal sends the step down the ordinary path, where hero_step_allowed refuses it again: so a walking hero on land never visits from the neighbouring tile an object on water but a boat or class 85, and a boat meets or attacks only a hero in a boat.", args = "this = adventure manager; hero, direction", returns = "1 allowed, 0 not", refs = ["rules/surveys/E08-sea.md §4.3", "rules/surveys/E08-sea.md §8.1"] },
{ va = 0x481BE0, kind = "function", name = "hero_step_allowed", size = 0x2ED, confidence = "read", summary = "Whether the hero may step that way (the hero, the direction, two flags): 0 refuses (a key's step 0x408ED5, hero_move_step 0x480CCB, which then ends the move); tests the destination's object (tile_object_class 0x4FCBD0) and Angel Wings (0x4D91F0). Read in part (E24 M2 T1b named it). E08 T66a1, read for its boat and water branches: a flying hero not in a boat passes at once (0x481C44); a blocked destination refuses; onto water a hero neither in a boat nor water-walking only a boat's or a class-85 entrance (0x481D0D); from water a diagonal only between two water side tiles unless water-walking (0x481D33; E08 T66b: on the water destination's branch only, 0x481CDB, so a landing has no side test); in a boat onto land only class 3, which passes at once (0x481DF3). E08 T66a2: the fourth argument set treats a flyer and a water walker as walkers (0x481C66, 0x481D06): the arrow keys' check passes it (0x408ED5); hero_step_or_meet_allowed 0x481AD0 passes 1, 0 and hero_move_step 0, 0 (0x480CCB).", refs = ["epics/E24-design.md §3.5", "rules/surveys/E08-sea.md §4.1", "rules/surveys/E08-sea.md §8.1"] },

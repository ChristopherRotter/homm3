{ va = 0x523D90, kind = "function", name = "hex_neighbor", size = 0x57, confidence = "read", h3api = "H3CombatCreature::HexRelativePosition", summary = "The neighbour of a hex in direction 0-5 (0 up and right, clockwise; 6 and 7 map to 5 or 0 and 3 or 2 by the stack's facing) from the battle's table at +0x13468 (six words per hex); -1 off the field. A walk's step moves the position this way (0x442177). Read for E17 M2 T4b-2a.", args = "this = stack; hex, direction", refs = ["epics/E17-design.md §7"] },
{ va = 0x523DF0, kind = "function", name = "stack_neighbor", size = 0x86, confidence = "read", summary = "As 0x523D90 for a stack's hexes: a two-hex stack takes directions 0-2 (facing right) or 3-5 (facing left) and 6, 7 from its front hex (position + 1 or - 1), 6 and 7 being the hexes above and below its middle. The strike and its target choose their sides by it (0x445BCE, 0x4458B0). Read for E17 M2 T4b-2a.", args = "this = stack; hex, direction", refs = ["epics/E17-design.md §7"] },
{ va = 0x523EC0, kind = "function", name = "opposite_direction", size = 0x1F, confidence = "read", summary = "The opposite of a hex direction: (k + 3) mod 6 for 0-5; 6 gives 7, 7 gives 6. The pathfinder traces a path back with it.", args = "ecx = direction", returns = "direction", refs = ["installation.md §7.40"] },
{ va = 0x524690, kind = "function", name = "ai_secondary_skill_value", size = 0x684, confidence = "read", summary = "A secondary skill's value to the computer for a hero (E08 T25): 0 for a skill at Expert, or unknown with eight known; else by skill (switch 0x524732). The army's worth A and its shooters' B are 1000 and 500 with the flag clear (the new game's setup, a hero without an owner); set, plus each stack's AI value (creature record +0x40) x count, a shooter's into B too (0x5246D5-0x524722). Clear: Pathfinding trunc(A x ai_rough_share[level] / 4), Archery 0x640380[level] x B / 100, Logistics A/10, Scouting, Necromancy, Learning A/20, Diplomacy A/100, Navigation trunc(A x ai_water_share / 2), Leadership, Luck, Tactics A/50, Wisdom Spell Power x 25, Mysticism 1, Ballistics A/8, Eagle Eye 2 (0 without Wisdom), Estates 0x64038C[level], a school Spell Power x 10 with Wisdom (without it Fire 0, Air 25, Water 3, Earth 30), Scholar Spell Power x 5 (0 without Wisdom), Artillery Attack x 10, Offense and Armorer 7A/100, Intelligence Knowledge x 10, Sorcery Spell Power x 2, Resistance A/40, First Aid 250; the primary skills with the worn artifacts (+0x476), Spell Power and Knowledge held to 1-99, Attack to 0-99; divisions truncate. Set: Wisdom, Eagle Eye, Mysticism, Scholar, Intelligence, Sorcery by the hero's AI effectiveness (+0x47E, +0x486), Estates times a player's AI value (0x6929E0), the schools by 0x524D20, Artillery and First Aid only with the machine worn (0x4D91F0). No draws.", args = "ecx hero, edx skill; flag (the army and the AI state counted)", returns = "value", refs = ["rules/surveys/E08-progression.md §10"] },
{ va = 0x524D20, kind = "function", name = "ai_school_value", size = 0xA3, confidence = "inferred", summary = "A magic school's value with ai_secondary_skill_value's flag set: the hero's caster record (0x526D40) and a best spell value (0x5275B0); not read further (E08 T25; E10).", args = "ecx hero, edx school skill", returns = "value", refs = ["rules/surveys/E08-progression.md §10"] },
{ va = 0x524DD0, kind = "function", name = "ai_takes_new_secondary_skill", size = 0xF3, confidence = "read", summary = "Whether the computer takes a new skill over an advance (E08 T25): values the 28 skills by 0x524690 (0 for a known skill, and for an unknown one whose class weight is 0 unless it is the offered one), sorts them by value (an exchange sort, ascending, swapping only on greater), then walks from the highest: a known skill is passed, the offered skill means yes, any other unknown one uses up one of the hero's free slots (8 - count) and none left means no; the walk's end means yes. No draws.", args = "ecx hero, edx the new skill; flag", returns = "bool", refs = ["rules/surveys/E08-progression.md §10"] },
{ va = 0x526D40, kind = "function", name = "ai_caster_record", size = 0x393, confidence = "read", summary = "Sets up the adventure AI's caster record of a hero (this, 0x24 bytes): +0 the hero; without a spell book or with the Orb of Inhibition (126) +4 to +0x10 are 0; else +4 the army's value (0x44AC80), +8 Spell Power held to 1-99, +0xC that plus the duration bonus (0x4E4DB0), +0x10 the maximum mana trunc(f32(10 x Knowledge held to 1-99) x 0x4E48B0); +0x18 to +0x20 a vector of the army's entries {type, AI value x count, count}, sorted by value, highest first (the library's sort: 0x435160 for up to 16). Other callers (the adventure AI's): 0x432890, 0x432C20, 0x432F90 (through a function table), 0x433C60, 0x524D20, 0x527640, 0x527760.", args = "this = record; hero", returns = "this", refs = ["installation.md §7.35", "installation.md §7.38", "installation.md §7.39"] },
{ va = 0x5270E0, kind = "function", name = "ai_damage_spell_value", size = 0xDF, confidence = "read", summary = "A damage spell's value: base b = AI value[m] (+0x68) x (power R+8 + m), Titan's Lightning Bolt its effect; d = 0x4E5760 on b without a stack; X = 10 d / S; Y = the curve 0x640398 at X (the first row of 0-12 whose threshold X reaches, else 13); Z = X x the casts' factor (min(n, 13)); trunc(S x Z) when Y > Z, else trunc(S x Y).", args = "this = caster record; spell, m, casts n, strength S", returns = "value", refs = ["installation.md §7.39"] },
{ va = 0x5271C0, kind = "function", name = "ai_mass_damage_spell_value", size = 0xC1, confidence = "read", summary = "Kind 0x20000 (damage to every stack): A = the hero's army's AI value x count x (1 - spell factor 0x44A4D0), accumulated with truncation; 0 when A is 0, else max(0, 0x5270E0 against A - (R+4 - A)). Not reached by the battle.", args = "this = caster record; spell, m, casts n", returns = "value", refs = ["installation.md §7.39"] },
{ va = 0x527290, kind = "function", name = "ai_effect_spell_value", size = 0x134, confidence = "read", summary = "Kind 0x40000 (other battle spells): e = R+0xC x n rounds; a mass spell (0x59E060 false) the whole sorted army list with e held to 7, a single-target one 1 entry below 7, else min(e / 7, R+0xC) entries for 7; sum of AI value[m] x entry value x e (a positive spell skips entries it cannot affect), / 700. Not reached by the battle.", args = "this = caster record; spell, m, casts n", returns = "value", refs = ["installation.md §7.39"] },
{ va = 0x5273D0, kind = "function", name = "ai_spell_value", size = 0x1DD, confidence = "read", summary = "The adventure AI's value of a hero's spell: m = 0x4E5080 on the hero's tile's field (0x4E4FA0); cost 0x4E5240 (no enemy army, field -1); 0 above the mana R+0x10; n = mana / cost (1000 at cost 0); by the AI bits (flags & 0x1F8000): 0x8000 0x5270E0 with n and R+4, 0x10000 with 1, 0x20000 0x5271C0, 0x40000 0x527290, 0x80000 trunc(R+4 x min(min(10 AI value[m] (power + m) / R+4, 0.9) x factor(n), 3.9)), 0x100000 trunc((0.001 sqrt n + 0.009) x (AI value[m] x R+4)); else 1.", args = "this = caster record; spell", returns = "value", refs = ["installation.md §7.39"] },
{ va = 0x5275B0, kind = "function", name = "ai_best_spell_value", size = 0x8A, confidence = "read", summary = "The best value 0x5273D0 gives (from 0; 0 when the record's power +8 is 0) among the spells 0-69 the hero has available (+0x430) whose flags share a bit with the mask, only levels 1-2 when the hero wears Recanter's Cloak (83). 0x420A80 passes 0x8000 (spells 15-18, 20, 21, 23; 57 worth 1); the adventure AI's callers (0x433C60, 0x524D20, 0x527640, 0x527760) pass others, 0x1F8000 at several.", args = "this = caster record; AI bits mask", returns = "value", refs = ["installation.md §7.35", "installation.md §7.38", "installation.md §7.39"] },
{ va = 0x527F60, kind = "function", name = "ai_gold_offer_answer", size = 0x73, confidence = "inferred", summary = "The computer player's answer to a monster's offer to join for gold; not read.", refs = ["rules/surveys/E08-battles.md §3.2"] },
{ va = 0x52B9C0, kind = "function", name = "ai_map_terrain_shares", size = 0x20C, confidence = "read", summary = "The computer's terrain shares of the map (E08 T25), from new_game_heroes before the heroes' setups (0x4C0018) and from saved_game_load (0x4BDC36): over every tile of both levels with the tile flag 0x40 (+0xC, the map file's coast flag: land beside water only) that is not rock, the count, the water tiles among them and, per Pathfinding level 0-2, the tiles whose straight step costs more than 100 (step_cost 0x4B1740: direction 0, 9999 points, no road, no native terrain); stores water / count at ai_water_share and each level's count / count at ai_rough_share (f64; a NaN when no tile has the flag).", refs = ["rules/surveys/E08-progression.md §10"] },
{ va = 0x52BBD0, kind = "function", name = "ai_level_up_choice", size = 0x87, confidence = "read", summary = "Chooses between a level-up's two offers without asking (E08 T24a1; its helpers read in E08 T25, no draws): both known or both new, the higher of 0x524690's values, the first on a tie; otherwise 0x524DD0 decides whether the new one is taken. Called by hero_level_up for a computer player's hero, any hero during the new game's setup, and a human's dialog result 9999. The flag argument is clear during the setup or for a hero without an owner.", args = "ecx hero, edx first offer; second offer, flag", returns = "skill", refs = ["rules/surveys/E08-progression.md §2.5"] },
{ va = 0x52BD10, kind = "function", name = "ai_fight_answer", size = 0x1D, confidence = "inferred", summary = "The computer player's answer to a monster's flee offer and a guarded pile's question; not read.", refs = ["rules/surveys/E08-battles.md §3.2", "rules/surveys/E08-battles.md §5.1"] },
{ va = 0x52BD50, kind = "function", name = "army_entries_insert_back", size = 0x42, confidence = "read", summary = "The library's unguarded insertion (Visual C++ 5/6) of a 12-byte entry: moves it back from the position while its +4 is higher than the previous entry's (0x526D40's inlined sort).", args = "ecx = position; the entry by value", refs = ["installation.md §7.39"] },

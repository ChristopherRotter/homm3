{ va = 0x44E6A0, kind = "function", name = "pcx16_shade_under_pcx8", size = 0xE0, confidence = "read", summary = "Halves each pixel of a 16-bit picture under a non-zero index of an 8-bit one (E17 M5 T4c2a): each channel shifted right one within its mask (the screen masks 0x694D60 to 0x694D68), the size clipped to the target right and bottom; the movement shade of draw_hex_overlays 0x493930 (ccellshd.pcx).", args = "this = target pcx16; x, y, width, height, source pcx8, its x, its y", refs = ["epics/E17-design.md \u00a77.23"] },
{ va = 0x44E940, kind = "function", name = "pcx16_adjust_hue_saturation", size = 0x3B8, confidence = "read", summary = "Tints a rectangle of a 16-bit picture (cut at its right and bottom edges): per pixel the channels scaled by 0x7FFFFFFF / mask (masks 0x694D68, 0x694D60, 0x694D64), V the largest as an f32, then HSV with H = f32(hue x 6), i = ftol(H), f = fmod(H, 1) (0x617F20) and p, q, t as f32 products at 53 bits; the channels by i (0-5; else the pixel unchanged), each rounded by the 1.5 x 2^52 addition, divided back and masked. The count box tints its inside with it. Confirms H3API.", args = "this = 16-bit picture; x, y, width, height, hue (f32), saturation (f32)", h3api = "H3LoadedPcx16::AdjustHueSaturation", refs = ["epics/E17-design.md §3.7", "epics/E17-design.md §4.3"] },

{ va = 0x43F0B0, kind = "function", name = "walk_step", size = 0x206, confidence = "read", summary = "One step of a walk in direction d (0 to 5): first turns the stack (0x446720) to face the step, right for 0 to 2 and left for 3 to 5 (0x43F0E5); sets the draw layer +0x8: 3 for directions 0 and 5, 7 for 2 and 3 (+0x48), 4 once on the new hex. The first step plays group 20 then group 0, any other step group 0, each all frames (0x446940); then the stack stands on the hex (0x4687C0); the last step plays group 21 and one frame of group 2. Sounds +0x188 (start), +0x170 (moving), +0x18C (end).", args = "this = stack; hex, last (byte), first (byte)", refs = ["epics/E17-design.md §4", "epics/E17-design.md §7", "installation.md §7.25", "epics/E17-design.md §8.2"] },

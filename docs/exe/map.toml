{ va = 0x56A0D0, kind = "function", name = "pathfinder_build_path", size = 0x282, confidence = "read", summary = "Builds the arrow path (pathfinder +0x48) to the hero's destination (+0x35, +0x39, +0x3D), from the destination tile's bit-10 node (level x 2 + 0, 0x56A12E), which must be reached (flags bit 0, 0x56A275; else the path is emptied, 0x56A2FF), walking back over each node's predecessor, whose bit 10 a node keeps in its bit 11 (0x56A2D8): a move ends only on a tile a hero may stop on (E08 T34a, the second reading).", refs = ["rules/surveys/E08-hero-movement.md §3.4"] },
{ va = 0x56AB40, kind = "function", name = "pathfinder_pass_through", size = 0x50C, confidence = "read", summary = "The pathfinder's test whether a path may go on from an object's tile (called by pathfinder_run): border gate (212, 0x56ABB1) by the player's key bit; border guard (9) the same in the modes from 4 (else no); every class not in its switch by the 'cannot be entered' setting being clear (0x56AF27). Read in those cases only. E08 T55a4 (the second reading, checked): with its fourth argument 0 (a human's mouse path, from 0x41955B) it answers no before the switch for every class but 33 and 212, so a path never goes on past a stop tile there. E08 T58 (re-read): pathfinder_run asks it only of a stop node (0x56BB7C), and an event's tile (26) is none (place_object_tiles clears its visitable bit, 0x505C78), so its no for class 26 is never asked: a path crosses an event of any colour (batch E7's E7-23).", refs = ["rules/surveys/E08-objects.md §2.2", "rules/surveys/E08-rewards.md §7.3", "rules/surveys/E08-rewards.md §15"] },
{ va = 0x56B440, kind = "function", name = "pathfinder_run", size = 0x8EC, confidence = "read", summary = "The adventure pathfinder (H3Pathfinder at 0x699284): sets +0xC and +0x10 to the hero's land and sea maximum (0x4E4990), +0x1C and +0x18 to its fly and water-walk levels (hero +0x112, +0x116; Angel Wings 72 and Boots of Levitation 90 force 3); the start node takes flying, water walking and bit 10, cleared for a flyer or water walker whose tile fails 0x4E5CE0. Pops the cheapest node of its open list (+0x3C/+0x40, 30-byte nodes), reloads the tile's stored node (+0x24), skips the guard test for a flying node (0x56BBCE), and expands it with 0x4B2300 priced at start points (arg 7, the hero's +0x4D) minus the node's cost +0x18 (0x56BB62); a stop node (flags bit 1) is expanded only when pathfinder_pass_through allows it (0x56BB7C..0x56BB99, its mode the run's arg 6: 0 from the mouse's 0x41955B, E08 T58). One node per tile and kind: like VCMI's and our query, not exact when a step's price depends on the points left (the diagonal exception). E08 T66a1: a popped boat node (flags bit 2) is expanded only on water (0x56BBC1): a landing is a leaf.", refs = ["rules/surveys/E08-adventure-core.md §1.3", "rules/surveys/E08-hero-movement.md §3.1", "rules/surveys/E08-sea.md §4.1"] },
{ va = 0x573C80, kind = "function", name = "reward_creatures_2", size = 0x290, confidence = "inferred", summary = "Another reward's creatures (army_full_dialog at 0x573EBB for a human); caller 0x573670; not read (E08 T44a). The Seer's Hut's reward (0x573670): the sketch's item 11, after E09 and E10 (E08 decision 127).", refs = ["rules/surveys/E08-army.md \u00a71.1"] },
{ va = 0x597570, kind = "function", name = "video_play_in_dialog", size = 0x75, confidence = "read", summary = "Plays clip ecx of the clip table 0x6839C0 at (edx, the first word on the stack) with a width and height (0: the clip's), whether it plays on at its end and whether its frames are shown: below index 0x1C (and a few above by the table's +8 and the edition) the Bink clip through video_open_in_dialog 0x44D830, else 0x598AF0 (not read). From 0x471A24 the result window's (E17 M5 T4b2b): its index by the branches of its tune, at (272, 89), its own size, playing on, shown.", refs = ["epics/E17-design.md §7.21"] },
{ va = 0x5976E0, kind = "function", name = "video_service", size = 0x5E, confidence = "read", summary = "The videos' tick from the message pumps and waits (pump_messages 0x4F7FB0, wait_until 0x4F82F0, wait_ms 0x4F83C0, 0x4EE1B0, 0x4EE3E0), not re-entered (0x69FE54): a Smacker video's (0x598EB0) or the dialog's Bink clip's (video_tick 0x44DAA0). E17 M5 T4b2b.", refs = ["epics/E17-design.md §7.21"] },
{ va = 0x597740, kind = "function", name = "video_redraw_any", size = 0x53, confidence = "read", summary = "A Smacker video's frame decoded again (SmackDoFrame) or the dialog's Bink clip's redraw (video_redraw 0x44D9E0); from dialog_show (0x5FEBD4), the dialog's vRedraw (0x5FF0A7), battle_result_dialog_show (0x471B17), 0x4EE3E0 and 0x4F3AB0. E17 M5 T4b2b.", refs = ["epics/E17-design.md §7.21"] },
{ va = 0x5979D0, kind = "function", name = "video_show", size = 0x294, confidence = "read", summary = "Shows what the playing video changed: Smacker's rectangles (SmackToBufferRect), or the Bink clip's by BinkGetRects of the handle playing (the loop's once it took over: none before its first frame, so a start's last frame never reaches the screen, CLT-Q31), their union through screen_show_rect 0x602BD0 at the target's point; index 0x1D a blit of the whole screen. E17 M5 T4b2b.", refs = ["epics/E17-design.md §7.21"] },
{ va = 0x598210, kind = "function", name = "video_archives_open", size = 0x223, confidence = "read", summary = "Opens the video archives and reads their directories (a count, then 44-byte entries of a name and an offset): the CD's (0x597D00's path) into 0x69FE50 and 0x69FE2C; for editions 1 and 3 data\\h3ab_ahd.vid into 0x69FE48 and 0x69FE28; data\\Video.vid into 0x69FE4C and 0x69FDE0 (a message box and failure when either is missing). E17 M5 T4b2b.", refs = ["epics/E17-design.md §7.21"] },
{ va = 0x5996C0, kind = "function", name = "sound_volume", size = 0x97, confidence = "read", summary = "A sound's Miles volume from its own (0 to 127) and a setting: kind 0x65 the music's (0x698760), else the effects' (0x698764); v x (s + 1) / 10, at least 1, at most 127, for a setting of 1 to 10; 0 otherwise.", args = "volume, kind", returns = "the volume to set", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x599C40, kind = "function", name = "sound_focus_lost", size = 0x14B, confidence = "inferred", summary = "From window_procedure 0x4F7E88 when the game loses the focus; read to 0x599D4B: every effect sample stopped (AIL_stop_sample), whether each played kept at 0x6A3258; then, under +0xA8 and +0x90, a music stream playing (AIL_stream_status 4) ... the rest not read (E24 M2 T6a2: the lane's inbox).", refs = ["epics/E24-design.md §3.11"] },
{ va = 0x599E80, kind = "function", name = "stop_sample", size = 0x3D, confidence = "read", summary = "Ends a sample by its handle (AIL_end_sample) under the sound manager's lock; nothing without sound. H3API calls it H3AdventureManager::StopSound, but `this` is the sound manager (0x6993C4) at every call read.", args = "this = sound manager; the sample handle", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x599EC0, kind = "function", name = "sample_wait", size = 0x7F, confidence = "read", summary = "Waits while a sample handle plays (AIL status 4), at most the given milliseconds of the game clock (4000 if negative), handling messages meanwhile; nothing without sound. A wall shot waits for its two samples with it (0x4464C2, 0x4464D3).", refs = ["epics/E17-design.md §10.2"] },
{ va = 0x599F40, kind = "function", name = "sample_control", size = 0xE1, confidence = "read", summary = "Acts on a sample by its handle (handle, operation, value) under the manager's lock: 1 or 100 its volume sound_volume 0x5996C0(value, the effects') through AIL_set_sample_volume (kept at 0x69FEA0 by the handle's index), 5 AIL_start_sample; nothing without sound (E24 M2 T5).", refs = ["epics/E24-design.md §3.11"] },
{ va = 0x59A1E0, kind = "function", name = "music_track_play", size = 0x25, confidence = "read", summary = "Plays music track 2 to 10 (its name at 0x684AE0 + 4 x it: Water, Grass, Snow, Swamp, Lava, Sand, Dirt, Rough, Underground) through play_music 0x59ACB0 with a loop count of 0, the effects kept; others nothing. The map's terrain music: terrain_music_tracks 0x678330 by the terrain at the view's middle (manager +0x58 the one asked for last; the map's start 0x419C18, hero_select, hero_move_step 0x4812F1; the walk's and the key's ends ask for +0x58's again) (E24 M2 T1b, T5).", refs = ["epics/E24-design.md §3.5", "epics/E24-design.md §3.11"] },
{ va = 0x59A210, kind = "function", name = "play_sample", size = 0x1DB, confidence = "read", summary = "Plays a WAV object: its category (+0x28) picks a range of the manager's sample handles (0x684AB8), the first whose sample is done, else the range's next in turn (its sample ended, 0x59A2DD; category 4 then plays nothing); loads the file, sets the loop count (+0x30) and the volume (+0x2C through sound_volume 0x5996C0) and starts it; stores the handle in +0x1C.", args = "this = sound manager; the WAV object", returns = "the sample handle", h3api = "H3SoundManager::ClickSound", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x59A470, kind = "function", name = "play_sound_file", size = 0x43, confidence = "read", summary = "Loads a WAV by name (0x55C720), sets its category 2 and plays it (play_sample 0x59A210).", args = "ecx = name", returns = "the sample handle and the WAV object", h3api = "H3SoundManager::PlaySoundByFileAsync", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x59A4C0, kind = "function", name = "wait_for_sample", size = 0xCE, confidence = "read", summary = "Waits while the sample plays, at most the given milliseconds of the game clock (4000 if negative), handling messages meanwhile; then ends it and frees the WAV object.", args = "ecx = milliseconds; the WAV object, the sample handle", h3api = "H3SoundManager::PlaySoundAndWait", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x59A590, kind = "function", name = "play_sound_async", size = 0x112, confidence = "read", summary = "Plays a sound file by its name in a thread of its own: the WAV loaded at volume 127 (0x55C720), its category the third argument (a spell's sound: 3, the creature channels), the second a time-out (negative: 10 000 ms); nothing while the sound is off (E17 M3 T7b-1).", args = "ecx = name, edx = time-out; category", h3api = "H3SoundManager::PlaySoundAsync", refs = ["epics/E17-design.md §8.2"] },
{ va = 0x59A830, kind = "function", name = "music_thread", size = 0x3CB, confidence = "read", summary = "The music's thread (from +0x10, 0x59A840, which play_music 0x59ACB0 starts; the first 16 bytes a stub that fades the stream out through music_stop_fade and ends). Holds the manager's +0xA8 from 0x59A859 to its end (0x59ABE7), so threads run one after another; ends at once without a pending name (0x59A883); else music_stop_fade 0x59B080, closes the stream (0x59A8F4), takes the pending name as it is then into music_playing_name (0x59A96A, cleared 0x59A9A8), sets +0x8C (0x59A9CF) and opens mp3\\<name>.mp3 (AIL_open_stream 0x59A9F4); started only while app_active (0x59AA15); a looping track (count 0) starts silent at the place its name's last fade began (music_positions 0x69FEC0, 0x59AA82) and fades in, a tenth of the music volume added every 100 ms (0x59AB5D, an f32 sum truncated) to the whole after 900 ms, still holding +0xA8 (0x59AB42 to 0x59ABB1); a track played once starts at its volume (E24 M2 T6a2).", refs = ["epics/E17-design.md §8.2", "epics/E24-design.md §3.11"] },
{ va = 0x59AC00, kind = "function", name = "music_resume", size = 0xA9, confidence = "read", summary = "Asks for the music track the thread opened last again: music_playing_name copied into music_pending_name with its loop count (0x59AC4F), a thread of music_thread 0x59A840 started (0x59AC8B); nothing without one. From window_procedure 0x4F7E23 when the game has the focus again (E24 M2 T6a2).", refs = ["epics/E24-design.md §3.11"] },
{ va = 0x59ACB0, kind = "function", name = "play_music", size = 0x355, confidence = "read", summary = "Asks for a music track by name (nothing with the music's setting at 0): dropped when the name is pending (music_pending_name 0x6A3394, 0x59AD0D) or the one the thread opened last while its stream plays (music_playing_name 0x6A3290, AIL_stream_status 4, 0x59AD43 to 0x59ADA6); that name with its stream not playing is asked for again with the loop count it opened with after waiting for the manager's +0xA8 (0x59AE2B to 0x59AF0A); else it becomes the pending name with its loop count (0x59AF1F) and a thread of music_thread 0x59A840 starts (0x59AEFD), one a request. With its third argument set, first ends every effect sample (0x59ADAC, 0x59AF56) (E24 M2 T6a2).", args = "this = sound manager; name, loop count, stop the effects (byte)", refs = ["epics/E17-design.md §8.2", "epics/E24-design.md §3.11"] },
{ va = 0x59B080, kind = "function", name = "music_stop_fade", size = 0x215, confidence = "read", summary = "Fades the music stream out, under the manager's +0xA8 and +0x90: only a stream open (0x69FE78) and not yet faded (+0x8C, cleared at the end, 0x59B27F); its place (AIL_stream_position) kept under music_playing_name in music_positions 0x69FEC0 first (0x59B146 to 0x59B1A8, an entry appended for a new name), then from its volume (AIL_stream_volume 0x59B1E2; the whole after a fade-in, which holds +0xA8) a tenth less every 100 ms (0x59B21B, an f32 sum truncated, Sleep(100) between: 114 ... 12 from 127), then AIL_pause_stream (0x59B26A) (E24 M2 T5, T6a2).", refs = ["epics/E24-design.md §3.11"] },
{ va = 0x59BAA0, kind = "function", name = "spell_book_text", size = 0x341, confidence = "read", summary = "A spell's text for the spell book (E17 M5 T3a): its description at the hero's mastery on the battlefield (the record +0x78, 0x4E5080); for the status line (the flag 1, 0x59D739) cut at its first line break and followed by \" (\", the level's name and \")\" (0x684B80, 0x660350); for the message box the whole, a damage spell's (flag 0x200) with GENRLTXT 344 and its damage.", args = "this = dialog; out, spell, hero, the hint flag", refs = ["epics/E17-design.md §7.17"] },
{ va = 0x59BDF0, kind = "function", name = "spell_book_dialog", size = 0xAC9, confidence = "read", summary = "The spell book's dialog (E17 M3 T7a-2a): 620 x 595 at (90, 2), Spelback.pcx; twelve spell places 78 x 65 at the dialog's (117 + 86 c, 89 + 96 r) and (333 + 86 c, 89 + 96 r), each a school's mastery ribbon (ids 201-212) under the spell's icon (spells.def, ids 213-224) and a tiny.fnt text; the school tabs (ids 226-230), the bookmarks, the close (0x7801). Remembers its page, tab and kind for the same hero (0x684B40-0x684B48, 0x6A34F4); the first opening in battle shows the combat spells of all schools, page 0 (0x59C9A0).", args = "this = dialog; hero, the other hero, the kind (0 in battle), the battlefield's ground", refs = ["epics/E17-design.md §7.16"] },
{ va = 0x59C9A0, kind = "function", name = "spell_book_page", size = 0x691, confidence = "read", summary = "Fills the spell book's page: the hero's spells (+0x430) of the tab's schools (+0x70) and the bookmark's kind (+0x74, the spell's flags +0xC: 1 combat), sorted by 0x59DBE0; twelve a page from place 0 on the all-schools tab, a school's first page its emblem over places 0 and 1; each place its ribbon (SPLEVA/F/W/E.def by school, frame the mastery), icon (frame the spell) and text (name, level, cost; greyed above the hero's mana +0x18); the places left empty.", args = "this = dialog; page", refs = ["epics/E17-design.md §7.16"] },
{ va = 0x59D040, kind = "function", name = "spell_book_proc", size = 0xBA0, confidence = "read", summary = "The spell book's message handler: a left click on place k (ids 213-224, 0x59D3E3) in battle with the combat bookmark returns the place's spell (+0x7C + 4k) and closes the dialog when it costs at most the hero's mana, else a message (GENRLTXT 207); with the adventure bookmark the spell's description; the tabs, bookmarks and corners turn the page or the tab (0x59C9A0); the close returns 0x7801. E17 M5 T3a: the keys by scan code (0x59D1C3): Escape and Enter close, A and C take a bookmark, the left and right arrows turn a page where its corner shows, up and down the tab above or below (0x641DA4, 0x641DB8); a move (0x59D6C4) over another item than the last (0x684B4C) sets the default cursor (frame 1 over an item, 0 elsewhere) and the status line (a place's spell's hint by 0x59BAA0, the others' Help.txt pairs 0x6A52D0); the right button's message boxes.", refs = ["epics/E17-design.md §7.16", "epics/E17-design.md §7.17"] },

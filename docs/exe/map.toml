{ va = 0x442550, kind = "function", name = "ai_attack_bonus", size = 0x35, confidence = "read", summary = "A stack's attack against a target (0x442410) minus its creature's base attack (table +0x54).", args = "this = stack; target, shot flag", refs = ["installation.md §7.31"] },
{ va = 0x442590, kind = "function", name = "stack_defense_against", size = 0xC2, confidence = "read", summary = "A stack's defense against a striker: +0xCC, the Behemoths' reduction (the defense left computed in f32, then truncated: 0x4425C8 to 0x4425F5), 0 while frenzied when struck (flag 1), the moat's -3.", refs = ["installation.md §7.9", "installation.md §7.11"] },

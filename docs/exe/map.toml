{ va = 0x4ED490, kind = "function", name = "adventure_tick", size = 0x1B5, confidence = "read", summary = "The game's tick (71 callers; the view draw at its start and end), not reentrant (0x699578): polls the mouse; once the clock reaches 0x6989B4 sets it to now + 200 ms (110 while 0x698A18 is 1 or 3) and, while 0x67F574 is set, rotates by -1 the palette ranges of the animated DEFs: water (manager +0x80) 229-240 and 242-253, lava (+0x7C) 246-254, the clear river (+0x8C) 183-194 and 195-200, the mud river (+0x94) 228-239, 183-188 and 240-245, the lava river (+0x98) 240-248; every 60 ms (0x6989AC) network_keepalive 0x5546B0 and turn_timer_poll 0x557AF0, which draw nothing in a single game (E24 M2 T1a1). Polled by every turn of the managers' loop (input_next_message 0x4EC590) before its message is handled, and by each redraw.", refs = ["epics/E24-design.md §1.6", "epics/E24-design.md §3.1"] },

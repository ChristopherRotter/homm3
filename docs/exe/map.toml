{ va = 0x4C9DD0, kind = "function", name = "resolve_random_objects", size = 0x270, confidence = "read", summary = "At a new game (from 0x4BFE70, before 0x4C0CC0), walks the tiles (level, row, column) and turns random artifacts (65-69) and random monsters (71-75, 162-164) into their objects (a monster's creature by 0x4C92C0 with the class's levels), and each random resource (76) into a pile (79) of random_between(0, 6) (0x4C9EFB).", refs = ["rules/surveys/E08-objects.md §3.2", "rules/surveys/E08-battles.md §1.4"] },
{ va = 0x4CA240, kind = "function", name = "reveal_terrain_mask", size = 0xF6, confidence = "read", summary = "Reveals every tile on both levels whose terrain bit (1 << the tile's terrain byte +0x4) is in the mask (arg 2) for a player (arg 1) and every player of its team: the Cartographer's reveal.", args = "player, mask", refs = ["rules/surveys/E08-objects.md §4"] },
{ va = 0x4CA410, kind = "function", name = "refresh_guard_flags", size = 0x116, confidence = "read", summary = "Sets each tile's guard flag (vision word bit 8) from 0x41A460, on every level; at a new game and after an object's removal.", refs = ["rules/surveys/E08-battles.md §2.1"] },
{ va = 0x4CAE10, kind = "function", name = "placed_heroes_setup", size = 0x1B1, confidence = "read", summary = "At a new game (new_game_heroes 0x4C0037): for each of the 156 hero types its record in the game's heroSetup (+0xA4 + 0x334 x type; H3API H3SetupHero, the map file's placed hero) is set up by placed_hero_setup (0x4D8B30); a record with a position (+0x301 not negative) adds the hero to its owner and reveals around it (0x4CAF74). E08 T24a2a.", refs = ["rules/surveys/E08-progression.md §3.1"] },

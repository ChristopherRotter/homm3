{ va = 0x4C92C0, kind = "function", name = "random_creature_by_level", size = 0x202, confidence = "read", summary = "A random creature of zero-based levels a to b: every creature id 0-144 of those levels, drawn uniformly with random_between, but an excluded set: 118-144 when the game +0x1F698 (mapKind) is 0 (RoE), else 132-137 (0x4C932C to 0x4C9381), and in a campaign (byte 0x69774C) whose index (+0x1F45C, H3API campaignInfo +0x4) is 13 or more also the Conflux creatures 118-121, 123, 125, 127, 129-131 (0x4C9386 to 0x4C943B; E08 T20a2a). Resolves the map's random monsters at a new game (resolve_random_objects 0x4C9DD0); a generator's guards do not come through it.", args = "this = game; lowest level, highest level", returns = "creature", refs = ["rules/surveys/E08-battles.md §1.4"] },
{ va = 0x4C94D0, kind = "function", name = "random_artifact_of_level", size = 0xCD, confidence = "read", summary = "A random artifact of the level bits given (2 treasure, 4 minor, 8 major, 0x10 relic; 0xE any of the first three): drawn uniformly with random_between among the 144 records of the artifact table (0x660B68) whose class bits +0xC meet them, not disabled (+0x1C) and not yet given in this game (game +0x4E224 by id); none left: the flags start again from the map's bans (game +0x4E2B4), and with still none any level (0x1E); marks the one drawn. H3API GetRandomArtifactOfLevel. Read for the random artifacts (E24 M1 T4b).", args = "this = game; level bits", returns = "artifact", refs = ["epics/E24-design.md §2.7"] },
{ va = 0x4C95A0, kind = "function", name = "random_shrine_spell", size = 0x18E, confidence = "read", summary = "A random Shrine's spell: random_between(0, n - 1) over the spells 0-69 of the levels given (record +0x18) with a school (+0x1C) and no shrine mark (game +0x4); marks it. None left: the marks of those levels' unbanned spells (game +0x4A) are cleared and it draws again; none at all: -1 (E08 T55a2).", args = "this = game; level bits (bit n-1 level n)", returns = "a spell id or -1", refs = ["rules/surveys/E08-rewards.md §6.5"] },
{ va = 0x4C9730, kind = "function", name = "draw_starting_army", size = 0x159, confidence = "read", summary = "A hero's starting army from the hero table: slot 0 always (count random_between(low, high)); random_between(1, 100) <= 88 gives the second slot (the Ballista and the First Aid Tent as artifacts 4 and 6, no stack); a new roll <= 25 gives the third in the next free slot. With its third argument set only one creature of the first. A campaign case swaps hero 45's record for hero 96's.", args = "game, hero id, unused, one creature", refs = ["rules/surveys/E08-adventure-core.md §3.1"] },
{ va = 0x4C9990, kind = "function", name = "object_template_redraw", size = 0x43A, confidence = "read", summary = "Gives the object on an entrance tile a new picture (H3API RefreshMapItemAppearrance): appends a copy of its template to the map's (+0x4) and replaces the copy's DEF name, class (+0x38) and subclass (+0x3C) by the tile's class: an artifact (5) ava%04d of its id (0x677974), a monster (54, 71) the DEF of the last template of class 54 with that creature (0x505EA0, class written back into the tile), a town (77, 98) by its buildings (0x677A0C, 0x677A30, 0x677A54 by faction), a resource pile (79) 0x677958 by resource; loads the DEF onto the map's DEF list (+0x20), points the object's record (+0x8) at the copy on each tile of its footprint (the entries stay as placed) and refreshes the tiles (0x505A10). The copy keeps the template's size, colour and shadow masks, passability and priority. Called by resolve_random_objects 0x4C9DD0, the towns' setup 0x4CAA70 and two routines of a town's buildings (0x5BEC60, 0x5BEDE0; not read).", args = "this = game; the entrance tile", refs = ["epics/E24-design.md §2.7"] },

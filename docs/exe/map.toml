{ va = 0x467A00, kind = "function", name = "catapult_rock_flight", size = 0x3AF, confidence = "read", summary = "A wall shot's projectile (from wall_shot_animate 0x4462B9; args start x, y, target x, y, the missile DEF): d = trunc(sqrt(dx^2 + dy^2)), n = trunc((d + 10) / 20) steps of trunc(100 x the speed factor) ms each from its own start; step i (0 to n - 1) at x0 + trunc(i dx / n), y0 + trunc((dy - (n - i) 2|dx| / n) i / n) in f64 (an arc |dx| / 2 above the chord), the canvas centred, group 0 frame i mod its frames unmirrored, a save-under restored after each show; nothing shown after the last step. Skipped in a hidden battle (the test inlined).", refs = ["epics/E17-design.md §10.2"] },

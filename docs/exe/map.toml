{ va = 0x43D730, kind = "function", name = "stack_setup_from_creature", size = 0x17D, confidence = "read", summary = "Sets a stack record up from its creature's table entry at the battle's start or creation: native-terrain byte +0x4D8 (0x43D7DD), temporary-creature counter +0x54 = 0 (0x43D861), poison factor 1.0 (0x43D89D); clears the town of creatures 112-115 unless [0x6994E8]+0x1F698 is set (doubted by batch 2d).", refs = ["installation.md §7.16", "installation.md §7.18", "installation.md §7.19", "installation.md §7.20"] },
{ va = 0x43D8B0, kind = "function", name = "stack_setup_with_hero", size = 0x135, confidence = "read", summary = "Second part of a stack's setup: the side's hero bonuses (0x4E6120), morale, luck; retaliations at the battle's start (0x43D970).", refs = ["installation.md §7.10", "installation.md §7.19"] },
{ va = 0x43D9F0, kind = "function", name = "stack_load_graphics", size = 0x525, confidence = "inferred", summary = "Read at its head (0x43DA0F): copies the creature's 0x54-byte animation record (0x67FF24 + 0x54 x creature) into the stack at +0x110; and its sounds (0x43DA47 to 0x43DD07): the creature's sound prefix (+0x7C) with move, attk, wnce, shot, kill, dfnd, ext1, ext2 into +0x170 to +0x18C; a war machine (flag 0x40) none for moving and its wince for attack and defend (the Ballista, 146, its shot for attack), a shot only for shooters and creatures 37 and 91, start and end only for 54, 55, 62, 63; every one category 3, volume 64, looping for the move sound only (0x43DCE5). The DEFs not read.", refs = ["epics/E17-design.md §4", "epics/E17-design.md §8.2"] },
{ va = 0x43DF20, kind = "function", name = "stack_luck", size = 0xDD, confidence = "read", summary = "A stack's luck: the base luck 0x44B2D0, not clamped (the base routine's clamp argument is pushed as 0, 0x43DF6D), + Fortune's v - Misfortune's v, then the Halfling minimum (the docs once cited 0x43DF30, inside it).", refs = ["installation.md §7.9", "BAT-MAG-011"] },
{ va = 0x43E000, kind = "function", name = "stack_morale", size = 0x139, confidence = "read", summary = "A stack's morale: 0 without morale, else the base 0x44AE60, not clamped (the base routine's clamp argument is pushed as 0, 0x43E038), + Mirth's v - Sorrow's v, then the Minotaurs' minimum and Spirit of Oppression (the docs once cited 0x43E003).", refs = ["installation.md §7.9", "BAT-MAG-011"] },
{ va = 0x43E140, kind = "function", name = "draw_battle_stack", size = 0x8C0, confidence = "read", summary = "Draws a battle stack at a hex anchor (x, y) plus its +0x104/+0x100; part 0 the sprite: palette effects (clone, Stone Gaze, flags 0x20000000/0x40000000), the frame (group +0x3C, frame +0x40) through 0x4951B0, mirrored at x - W + 196 when facing +0x44 is 0, else at x - 196, y - 267, the outline game.pal entry 0x60 (active stack), 0x70 (byte +0x4F1, the mouse's hex) or none; group 0 of a walker moves by frame x 44 / n, x 42 / n (switch 0x43E1FE); then the count box (0x43E568: part 0 runs on into it, part 1 enters there and draws it alone; CmNumWin.pcx, by the hex ahead and the troop-count offset +0x14C), its tint and number. Its tail (0x43E795, part 0 only, after the box: read for E17 M3 T3b, its place after the box for T5b-2b): with the stack's byte +0x20 set and the magic animation's frame +0x132F0 inside its group 0, that frame over the stack through 0x4953B0, mirrored when facing 0, its flag the table entry's bit 8; placed by the entry's low nibble (switch 0x43E7F6): x = the position's anchor (+-22 toward the front of a two-hex stack) - W/2; y = anchor - H (0), - H/2 - h/2 (1), - H - h (2), h the creature's height +0x16C; 3 beside the creature's standing frame; above 3 at the entry's value (unused over a stack).", refs = ["epics/E17-design.md §3.3", "epics/E17-design.md §4", "epics/E17-design.md §7.15"] },
{ va = 0x43E6AA, kind = "site", name = "count_box_spell_hue", confidence = "read", summary = "The count box's hue under spells (+0x194 not 0): r = the sum of the spell records' +0 (polarity) over the stack's 81 durations +0x198 that are not 0, over the sum of their absolute values, as f64 (0 when that sum is 0); the hue f32((r + 1) x f32(0.1667)) at 53 bits, saturation 0.8, to pcx16_adjust_hue_saturation at 0x43E742.", refs = ["epics/E17-design.md §4.3"] },
{ va = 0x43EA70, kind = "function", name = "stack_revive_and_aura", size = 0x1DD, confidence = "read", summary = "Rebuilds a stack's Unicorn aura lists (+0x514/+0x524) and revives a raised dead stack. A Unicorn protects a neighbour when the Unicorn's controller (its side flipped by its Hypnotize, 0x43EAEE and 0x43EB9C) is the neighbour's own side +0xF4.", refs = ["installation.md §7.14", "installation.md §7.18"] },
{ va = 0x43EE10, kind = "function", name = "bind_release_on_move", size = 0x1C2, confidence = "read", summary = "Releases Bind links when a binder moves, dies or is teleported (ends Bind of a stack left with no binder), then empties the moving stack's own bound-by list without ending its Bind (0x43EEED).", refs = ["installation.md §7.20"] },
{ va = 0x43EFE0, kind = "function", name = "set_area_mark", size = 0xCF, confidence = "read", summary = "A stack's area mark +0x4F1 (an area spell's aim, 0x59F8A0): unchanged, nothing (0); changed, the stack flagged for the next redraw (+0x14000 by side and record; the arrow tower through 0x46A460) and, set, its group 1 started at frame 0 when its DEF has it and it does not show it, else it stands (group 2, frame 0) unless it does, as battle_mouse_stack; the mark gives the stack the mouse's outline 0x70 over the active one (draw_battle_stack 0x43E268) (E17 M5 T3b).", args = "this = stack; mark", returns = "whether it changed", refs = ["epics/E17-design.md §7.18"] },
{ va = 0x43F0B0, kind = "function", name = "walk_step", size = 0x206, confidence = "read", summary = "One step of a walk in direction d (0 to 5): first turns the stack (0x446720) to face the step, right for 0 to 2 and left for 3 to 5 (0x43F0E5); sets the draw layer +0x8: 3 for directions 0 and 5, 7 for 2 and 3 (+0x48), 4 once on the new hex. The first step plays group 20 then group 0, any other step group 0, each all frames (0x446940); then the stack stands on the hex (0x4687C0); the last step plays group 21 and one frame of group 2. Sounds +0x188 (start), +0x170 (moving), +0x18C (end).", args = "this = stack; hex, last (byte), first (byte)", refs = ["epics/E17-design.md §4", "epics/E17-design.md §7", "installation.md §7.25", "epics/E17-design.md §8.2"] },
{ va = 0x43F2C0, kind = "function", name = "shot_animation", size = 0x63B, confidence = "read", summary = "The shot's animation, called by stack_shot at 0x43F9DC (this = the shooter, the target); skipped while battle_is_hidden; the target point from the target's hex (+-22 for a two-hex target); asks 0x469880 for the group, start point and projectile frame (0x43F409). The shot group's frames up to the climax frame +0x150 (all without one), each trunc(attack time +0x15C / those frames) ms through battle_redraw's wait (0x43F495, so times the speed factor); a ray shooter (flag 0x800, from 0x43F51D) waits trunc(115 x the speed factor) (0x43F52F) and calls draw_ray from the start point to the target point, no branches or randomness, thickness 5 to 4, colour by creature (the switch 0x43F55B: 302 for 35, 304 for 74, 75, 120, 121, else 0), trunc(d / 15) + 15 steps per tick (0x43F578), delay 10, then returns (E17 design §7.12); the Enchanters (136) call 0x59FDE0 instead (not read); else the projectile in trunc((d + 20) / 40) steps over the distance d in pixels (crt_sqrt), each step trunc(33 x the speed factor) ms from its own start (0x43F65D, 0x43F815), outside the frame deadline. The projectile (from 0x43F5D6, read for E17 M2 T4b-1): the missile DEF (+0x168) group 0, the frame 0x469880 gave, canvas = the start point less half the DEF's width and height, step k at k x trunc(delta / steps) (idiv), def_draw_plain with runs skipped, mirrored when the target x is left of the start x; each step drawn over the screen with a save-under buffer (0x44E3F0) restored before the next and after the last. Arrow towers (creature 149) take another path. Read in part.", refs = ["epics/E17-design.md §7.9", "lanes/battle/exe-decompile-trial.md", "epics/E17-design.md §7", "epics/E17-design.md §8.2"] },
{ va = 0x43F900, kind = "function", name = "stack_shot", size = 0x7F9, confidence = "read", summary = "The shot routine: physical damage via 0x443F40 (Fire Shield value dropped: shots are never reflected); none of the melee strike's magic; luck roll clamp at 0x43F936.", refs = ["installation.md §7.9", "installation.md §7.10", "installation.md §7.20"] },
{ va = 0x43F955, kind = "site", name = "shot_luck_draw", confidence = "read", summary = "stack_shot's luck draw, random_between(1, 24) <= luck (0x43F95A): a lucky shot; the capture harness can force it (`shot_luck`, E17 M3 T7b-2b-1).", refs = ["epics/E17-design.md §7.16"] },
{ va = 0x43F998, kind = "site", name = "shot_luck_line", confidence = "read", summary = "A lucky shot's log line (E17 M3 T4b-2a): GENRLTXT row 46 with the shooter's name by its number (0x440100), added as a log entry after goodluck.82m; the melee strike's twin at 0x44187A. No line exists for bad luck.", refs = ["epics/E17-design.md §9.4"] },
{ va = 0x440100, kind = "function", name = "creature_name", size = 0x3E, confidence = "read", summary = "A creature's name by a number (E17 M3 T4b-2a): the creature table's singular (+0x14) for exactly 1, else its plural (+0x18), 0 included; an id outside 0 to 150 gives an empty text. The battle's log lines name their stacks through it or an inlined copy.", args = "ecx = creature id, edx = number", returns = "the name", refs = ["epics/E17-design.md §9.4"] },
{ va = 0x440160, kind = "function", name = "shot_action", size = 0x1A6, confidence = "read", summary = "The shot action: an arrow tower goes to 0x465AD0; else the shooter first turns to face the target (0x446720 at 0x440233 or 0x44024E: the target's position hex right of the shooter's other hex by the hex records' screen x and the shooter facing left, or left of it and facing right), shoots (0x43F900; further shots not read), turns back to the facing it had (0x4402F2); a berserk shooter's Berserk ends after its shot (0x4402F7).", refs = ["installation.md §7.14", "installation.md §7.25"] },

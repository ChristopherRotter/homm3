{ va = 0x4F79B0, kind = "function", name = "tile_vision_word", size = 0x25, confidence = "read", summary = "The vision word of the tile (x in ecx, y in edx, level on the stack) from tile_vision_pointer: the low byte holds one explored bit per player (bit n for colour n); the high byte's bit 0 is the guard flag (0x4CA410), tested by the pathfinder's run and after each step (0x480090).", returns = "u16", refs = ["rules/surveys/E08-adventure-core.md §1.4"] },
{ va = 0x4F82E0, kind = "function", name = "clock_ms", size = 0x6, confidence = "read", summary = "The game's clock: a jump to WINMM's timeGetTime (0x63A354), the time in milliseconds every animation and wait reads.", refs = ["epics/E17-design.md §7"] },
{ va = 0x4F82F0, kind = "function", name = "wait_until", size = 0xCD, confidence = "read", summary = "Waits until the clock reaches the given time (a signed difference), handling window messages meanwhile, and goes on waiting while the window is minimised (outside network play). H3API calls its argument milliseconds; it is a time, not a duration.", args = "time (ecx)", h3api = "WaitFor", refs = ["epics/E17-design.md §7"] },
{ va = 0x4F83C0, kind = "function", name = "wait_ms", size = 0xD0, confidence = "read", summary = "Waits the given milliseconds from now (0x4F83C7), handling window messages; independent of the frame deadline 0x698998.", args = "ms (ecx)", refs = ["epics/E17-design.md §7"] },
{ va = 0x4FA660, kind = "function", name = "archive_search", size = 0x113, confidence = "read", summary = "Binary search of an archive's directory (32-byte entries at +0x180) by name with a case-insensitive compare, linear below five entries; the index to +0x118, -1 when absent.", refs = ["epics/E17-design.md §3.1"] },

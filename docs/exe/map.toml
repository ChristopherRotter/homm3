{ va = 0x4B18C0, kind = "function", name = "hero_step_cost", size = 0x1A2, confidence = "read", summary = "The price of one step of a hero (H3API GetMovementCost): finds the source and destination tiles from the position and direction (0x678150), reads the Pathfinding level, fly and water-walk levels (artifacts 72 and 90 force 3), the army's native terrain and Nomads, and calls 0x4B1740.", h3api = "H3Hero::GetMovementCost", refs = ["rules/surveys/E08-adventure-core.md §6"] },
{ va = 0x4B1A70, kind = "function", name = "pathfinder_relax", size = 0x88D, confidence = "read", summary = "The pathfinder's relax step for one neighbour: the new node's cost is the source node's cost (+0x18) plus the step's price; it replaces the tile's stored node (H3Pathfinder +0x24, one 30-byte node per tile) only when strictly better by turn, then by cost (0x4B1CB0..0x4B1CF9), else nothing changes. Read around the comparison only.", refs = ["rules/surveys/E08-adventure-core.md §1.3"] },
{ va = 0x4B2300, kind = "function", name = "pathfinder_expand", size = 0xA94, confidence = "read", summary = "Expands one pathfinder node in the eight directions (0x678150): prices each step with 0x4B1740 at the points passed in (the caller's start points minus the node's cost: the points left on the node), the new node's points at +0x1C (a step it cannot pay today starts a new day when allowed, 0x4B252A), then relaxes through 0x4B1A70. Read around the pricing and the relax calls.", refs = ["rules/surveys/E08-adventure-core.md §1.3"] },
{ va = 0x4B25D4, kind = "site", name = "pathfinder_fog_test", confidence = "read", summary = "A neighbour's explored bit for the current player (its vision word against current_player_bit). An unexplored neighbour is inaccessible for a human player (player_is_human) unless the run's mode argument is 3 (the mouse's run, 0x4194A0, passes 0; 3 not read); for a computer player it is accessible from an explored tile, or anywhere while the player record's +0x3E is above 0 (not read). ADV-MOV-008.", refs = ["rules/surveys/E08-adventure-core.md §1.4"] },

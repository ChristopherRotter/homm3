{ va = 0x478D80, kind = "function", name = "action_dispatcher", size = 0x1054, confidence = "read", summary = "The battle action dispatcher, a switch on the action +0x3C (0x47902F): a hero's cast, 1 (0x479036: spell, hex and second hex from +0x40, +0x44, +0x48); Defend, 3 (0x479706: the bonus stored at +0x4DC and added to +0xCC, 0x47974A to 0x4798D7; re-entry 0x4798F3); Wait, 8 (0x479906: the waited bit, no test of the phase; re-entry 0x479AD6); a creature's cast, 10 (0x47936E: the target hex +0x44 alone; morale 0x4793A9); attack from where it stands (0x4792D7).", refs = ["installation.md §7.9", "installation.md §7.15", "installation.md §7.21"] },
{ va = 0x479637, kind = "site", name = "surrender_gold_transfer", confidence = "read", summary = "A surrender's price is taken from the surrendering side's owner's gold and added to the other side's owner's gold (0x47966F).", refs = ["rules/surveys/E08-battles.md §7.3"] },
{ va = 0x479F30, kind = "function", name = "battle_start_idle_clocks", size = 0x8B, confidence = "read", summary = "At the battle's start (battle_start 0x463098, after the idle step's time 0x6989B8 is set): the heroes' idle clocks +0x53FC, +0x5400 = now; every stack whose fidget interval t (+0x154) is above 51 gets its fidget clock +0xFC = now + 2r - t, r = random_between(50, t) (0x479F7C, the rules' generator): its first fidget comes 100 to 2t ms after the start. The action dispatcher (0x478D80, seven copies), move_and_attack and a routine of the battle loop repeat the same after every action.", refs = ["epics/E17-design.md §7"] },

{ va = 0x4A84F0, kind = "function", name = "visit_object", size = 0x2542, confidence = "read", summary = "The visit of an object by the current player's hero: a switch on the tile's class (+0x1E, 0x4A853A). Read for classes 9 border guard (0x4A8734), 10 Keymaster's tent (0x4A8843), 12 campfire, 13 Cartographer (0x4A8A14; gold paid at 0x4A8B60), 58 and 60 observatories (0x4A9992, 0x4A9A12; reveal_disk radius 20 at 0x4A9AC6), 79 resource and 212 border gate (0x4A8DD0); 5 artifact (0x49F7E0), 93 Spell Scroll (0x4A5EA0) and 101 treasure chest (0x4A6520) (E08 T55a1); the objects that teach (E08 T55a2): 4, 22, 23, 32, 39, 41, 47, 51, 61, 81, 88-90, 100, 102, 105, 107, 108, 113 by their handlers, 104 the University inline (0x4AA4DE: a human's dialog 0x5EF500, then the team's kind mark game +0x4E35C; the computer 0x524ED0); E08 T55a3: 6 Pandora's Box (0x4A0C50) and 63 the Pyramid (0x4A4230); the other cases not read. E08 T66a1: case 3 (a free coastal land tile, the landing) hero_lands_from_boat 0x49E670 (0x4A8624), case 8 (a boat) hero_boards_boat 0x4A1010 (0x4A871C). E08 T66a2: case 29 visit_flotsam 0x4A2230, 82 visit_sea_chest 0x4A5030, 86 visit_shipwreck_survivor 0x4A52A0; 59 the Ocean Bottle inline (0x4A9AFA: nothing for a computer, 0x4A9AFF; the message record's text, or sign_default_texts 0x696C74 by the column x mod 25; then removed with the pickups' tail) and 91 the Sign inline (0x4A9FC0: the same message, never removed).", args = "hero, tile (map item), packed position, human (false skips the messages and questions)", refs = ["rules/surveys/E08-objects.md §3", "rules/surveys/E08-objects.md §4", "rules/surveys/E08-objects.md §5", "rules/surveys/E08-objects.md §6", "rules/surveys/E08-rewards.md §2", "rules/surveys/E08-rewards.md §6", "rules/surveys/E08-rewards.md §7", "rules/surveys/E08-sea.md §3.1", "rules/surveys/E08-sea.md §3.2", "rules/surveys/E08-sea.md §8"] },
{ va = 0x4AABB0, kind = "function", name = "remove_map_object", size = 0x239, confidence = "read", summary = "Removes an object from the map (called by the pickups and the border guard's visit): per tile of its footprint, finds the object's entry in the tile's draw list (+0x12 to +0x16, 4-byte entries, the object's index in the low word: 0x4AACCD), moves the later entries down a place, keeping their order, and shortens the list (0x4AACE2 to 0x4AAD03), then refreshes the tile (0x505A10; E24 M1 T6b); the rest not read.", refs = ["rules/surveys/E08-objects.md §2.4", "epics/E24-design.md §2.1"] },
{ va = 0x4AADF0, kind = "function", name = "meeting_exchange_screen", size = 0x1DC, confidence = "read", summary = "Opens the exchange screen of a meeting for a human player (from visit_hero 0x4A28AA): swap_manager_create 0x5AE500 (visitor, visited), network messages for two players, the manager run, the map redrawn (E08 T44a).", args = "visitor, visited", refs = ["rules/surveys/E08-army.md \u00a72.3"] },
{ va = 0x4ABDC0, kind = "function", name = "reward_creatures", size = 0x6D0, confidence = "inferred", summary = "Gives a reward's creatures (army_add_stack, else army_full_dialog at 0x4AC3FB for a human); callers 0x4A15A0, 0x4A2140, 0x4AC490; not read (E08 T44a). Its callers are the creature banks' visits (16, 25; 24, 84, 85 through 0x4AC490): the sketch's item 10, not increment 7 (E08 decision 127).", refs = ["rules/surveys/E08-army.md \u00a71.1"] },
{ va = 0x4AC580, kind = "function", name = "monster_battle", size = 0x3A7, confidence = "read", summary = "A battle against wandering monsters (up to three types): srand of 248071 x + 276589 y + 310111 z + 155303 (the tile); stacks from the army ratio (table 0x6776E0) and a roll of 1-100 (at most 20: one fewer; at least 80: one more, at most 7), clamped to the count; even stacks, the first count mod n one more; a town's unupgraded creature alone gets its middle stack upgraded on a second roll of at most 50; the battle (0x4AD470) with the tile's hash as its seed; the count left of its own type (0x44ADC0). With a second or third creature (E08 T55a3, the Pyramid): the strength sums the types, the first type's stacks n are less the others' stacks (at least 1), each other type splits evenly into its stacks, no upgraded stack, and the slots are ordered by monster_stack_order 0x63DF94 (row 7 n + the third type's stacks).", args = "this = adventure manager; hero, creature, count (in and out), tile, position, then two more creature types, each with its count and its number of stacks (-1: none)", returns = "the winner (0 the hero)", refs = ["rules/surveys/E08-battles.md §4.1", "rules/surveys/E08-battles.md §4.2", "rules/surveys/E08-rewards.md §7.5"] },

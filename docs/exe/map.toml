{ va = 0x50C810, kind = "function", name = "load_cranim", size = 0x1E9, confidence = "read", summary = "Loads cranim.txt and parses 149 creature rows (14, then groups of 14, 6, 14, 13 and 4 with header rows between) through 0x50CA00.", refs = ["epics/E17-design.md §4"] },
{ va = 0x50CA00, kind = "function", name = "parse_cranim_row", size = 0x126, confidence = "read", summary = "One cranim.txt row into the 0x54-byte record at 0x6998E0 + 0x54 x creature: cells 0-3 x 9000, 500, 500, 115 (truncated) to +0x44..+0x50, cells 4-9 the i16 missile offsets +0x0..+0xA, cells 10-21 f32 angles +0xC..+0x38, cell 22 the troop-count offset +0x3C, cell 23 the attack climax frame +0x40.", refs = ["epics/E17-design.md §4"] },
{ va = 0x514610, kind = "function", name = "msk_load", size = 0x317, confidence = "read", summary = "Loads a picture's .msk (its name with the extension replaced; default.msk, 1 x 1, when the archives lack it): the width and height in tiles, then the colour and shadow masks of 6 bytes each (H3API H3LoadedMsk). The object templates take their width and height from it (H3API; 0x505B20 places an object on that rectangle).", refs = ["formats/h3m.md Import"] },

{ va = 0x480240, kind = "function", name = "visit_from_neighbour", size = 0x131, confidence = "read", summary = "A move's step toward an object that is not entered: stops the move, takes the step's price (arg 6) from the hero's points (+0x4D) and sets them to 0 below the cheapest next step (arg 7), as hero_move_step does; then the visit (0x480090, not read). The hero stays on its tile.", refs = ["rules/surveys/E08-objects.md §2.1"] },
{ va = 0x4805E0, kind = "function", name = "hero_move_step", size = 0x131C, confidence = "read", summary = "One step of a hero's move: prices it with 0x4B18C0 at the points left (+0x4D); a step it cannot pay stops the move and sets the points to 0 (0x480864); after the step the points drop to 0 when fewer than the cheapest step from the new tile remain (0x4B1880, 0x481182). Read around those sites only.", refs = ["rules/surveys/E08-adventure-core.md §1.3"] },
{ va = 0x486590, kind = "function", name = "map_hero_setup", size = 0xA84, confidence = "inferred", summary = "Fills a hero from the map's hero record (from 0x487290); when the hero has no creatures afterwards it draws the starting army (0x4C9730 with the one-creature flag clear, site 0x486944) and later sets its movement points (0x4E4D90). Read around those sites only.", refs = ["rules/surveys/E08-adventure-core.md §1.1", "rules/surveys/E08-adventure-core.md §3.1"] },
{ va = 0x487290, kind = "function", name = "map_heroes_setup", size = 0x664, confidence = "inferred", summary = "Calls 0x486590 for the map's heroes (two sites); not read.", refs = ["rules/surveys/E08-adventure-core.md §3.1"] },

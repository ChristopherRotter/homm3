{ va = 0x480090, kind = "function", name = "after_step_guard_check", size = 0x1A4, confidence = "read", summary = "After a hero's step (hero_move_step, visit_from_neighbour; args: the hero, the step's object, a skip flag, the x and y the hero stood on before the step, the move's end, a flag): unless skipped or the hero stands where it stood (0x4800B8 to 0x4800C9: visit_from_neighbour passes the hero's own tile, so a visit from the neighbouring tile tests no guard), on a tile whose guard flag is set (vision word bit 8) and that is no boat's, the guard attacks (0x481900); a hero at sea at once, a flying one (Angel Wings, hero +0x112) only at its move's destination. Returns the step's object, none when the hero no longer is the current player's. E08 T66a1: a hero in a boat stepping onto class 3 (the landing) is not tested here (0x4800E3): hero_lands_from_boat's guard_attack tests the landing tile.", refs = ["rules/surveys/E08-battles.md §2.2", "rules/surveys/E08-sea.md §3.2", "rules/surveys/E08-sea.md §3.3"] },

{ va = 0x445A60, kind = "function", name = "strike_action", size = 0x26D, confidence = "read", summary = "The strike action on a hex's stack: a shot (0x440160) for the Ballista, an arrow tower or a shooter that may shoot, else a melee (0x441CB0, with retaliation and second strike) from the chosen side; then +0x132C8 and the Phoenixes' rebirth check 0x469440 (0x445CB2). Called by the attack 0x478900 and the dispatcher (0x47927A). The melee's side: the first of the directions 0-5 (and 6, 7 for a two-hex stack, 0x523DF0) toward the target on the attacker's front side, else the first other, which turns the attacker around, animated (0x445BCE to 0x445C6A); it turns back after the melee only with its second argument set (0x445C9B; the attack 0x478900 clears it; read for E17 M2 T4b-2a).", refs = ["installation.md §7.21"] },

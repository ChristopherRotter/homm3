{ va = 0x446940, kind = "function", name = "stack_play_group", size = 0x2FE, confidence = "read", summary = "Plays frames of one DEF group on a stack: from frame `first`, `count` frames (to the group's end when count < 0). A frame lasts trunc(f32 walk time +0x158 x the speed factor / group 0's frames) for group 0 (0x4469C2), trunc(100 x the speed factor) for any other (0x4469E6). Per frame: draws the stack and the battle (0x494440, not shown yet), waits for the frame deadline 0x698998 (0x4F82F0), moves the deadline on by max(the frame's time, the lateness), shows the frame, counts +0x40 on; the last frame stays. Nothing while the battle is hidden. Each frame (0x446A06 to 0x446BB3) restores the previous frame's rectangle from the saved screen +0x53B0 (0x44E2B0), measures the stack's new frame with its count box (+0x13D2C, +0x13D34: measured, not drawn), widens it 17 pixels left and right (+0x13D38 is x0, +0x13D40 x1), redraws the battle with the clip flag +0x13D30 and no background over the union of both rectangles (items meeting it drawn whole), and shows that union (E17 design §7.11).", args = "this = stack; group, count, first", refs = ["epics/E17-design.md §7"] },
{ va = 0x446C40, kind = "function", name = "stack_fits_at_hex", size = 0x1E1, confidence = "read", summary = "Whether a creature fits at a hex (and its second hex by facing): on the field, outside the side columns, not blocked, no living stack but the mover itself (0x446CC6); with its second argument set (a two-hex stack's shifted position: Teleport's handler, a clone's and an elemental's placement) the shifted hexes may hold the active record (0x446D7F onwards); the computer's searches pass 0 (§7.59).", refs = ["installation.md §7.15", "installation.md §7.19", "installation.md §7.59"] },

{ va = 0x4721D0, kind = "function", name = "combat_dialog_create", size = 0x42A, confidence = "read", summary = "The battle's dialog, the manager's +0x132FC (E17 M3 T4b-2b-1): an 800 x 556 transparent item over the battlefield; +0x50 a text item at (75, 100), 520 x 440 in medfont.fnt (not read further); +0x4C an item of 0x5541A0 at (214, 563), 400 x 32 over cRollovr.pcx (inferred an edit line: while its +0x6D is set the log's status line is left alone); the panel +0x70 (0x46BC30, or 0x46C050 in the tactics phase); windows +0x74 to +0x88 (0x46C370, 0x46CEB0, not read); the log's new-entry count +0x64 and first line +0x68 at 0.", refs = ["epics/E17-design.md §9.5"] },

{ va = 0x441610, kind = "function", name = "melee_strike", size = 0x6A0, confidence = "read", summary = "One melee strike (attack, retaliation, second strike): damage, hit points, the strike's spell, pending casts, the striker's effects, Fire Shield; answers 'no retaliation' at 0x441C85. The striker's group (0x441AAF to 0x441B6C, read for E17 M2 T5c): by the strike's direction 11, 12 or 13; 17, 18 or 19 for a breath's two stacks (the stack behind, [ebp-8], set only for creature flag 0x8 at 0x44171B) where the DEF has that group; the Ballista its shot groups.", refs = ["installation.md §7.11", "installation.md §7.14", "installation.md §7.20", "epics/E17-design.md §7.4"] },

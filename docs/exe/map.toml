{ va = 0x467600, kind = "function", name = "shot_full_damage_distance", size = 0x23A, confidence = "read", summary = "Whether a shot is halved for distance: never for a shooter whose side's hero (the other side's while it is hypnotized, +0x288) wears artifact 91 or 137, nor for creatures 149 and 137; else the hex distance from the shooter's other hex (0x4466A0, its front hex by its current facing) to the target's position, then to a two-hex target's other hex: halved when both exceed 10. Called by the damage's stage 2 (0x443C96) after the shot action turned the shooter, and by the cursor (0x4767E6) without turning it.", args = "this = battle manager; shooter, target", returns = "bool (halved)", refs = ["installation.md §7.10", "installation.md §7.25"] },
{ va = 0x467840, kind = "function", name = "siege_line_clear", size = 0x1B6, confidence = "read", summary = "Outside a siege or for the same hex true; else walks the straight line on the column/row grid from one hex to the other in 17 x the larger difference steps of 1/17 cell (f32, truncated to a hex each step) and is false at hex 96 while the gate is closed or at a wall hex with the blocked bit. The shot's wall test and Teleport below Expert (0x5A3764) use it.", args = "from hex, to hex", returns = "bool", refs = ["installation.md §7.15", "installation.md §7.28"] },
{ va = 0x468730, kind = "function", name = "take_stack_off_hexes", size = 0x8E, confidence = "read", summary = "Takes a stack off the battlefield's hex records: three bytes of the occupant (+0x1DC to +0x1DE of each 0x70-byte record) set to 0xFF on its hex +0x38 and, for a two-hex stack (+0x84 bit 0), on its other hex (+0x38 + 1 facing right, - 1 facing left, by +0x44), so that the redraw's row passes no longer draw it; a flight calls it before its cycles (0x4B4BFE) and draws the flier by itself (read for E17 M2 T5a).", refs = ["epics/E17-design.md §7.10"] },
{ va = 0x4687C0, kind = "function", name = "place_stack_on_hex", size = 0x99, confidence = "read", summary = "Places a stack on its hex (a raised dead stack comes back on its own hex).", refs = ["installation.md §7.18"] },
{ va = 0x468860, kind = "function", name = "stack_stats_dialog", size = 0x124, confidence = "read", summary = "Shows a stack's stats dialog next to its hex (a left click: modal; a right click: held); when the modal dialog ends with result 301 (its cast button) it starts the creature's cast of the stack's drawn spell +0x4E0 through 0x59EC50 (site 0x468954) and turns the manager's action +0x3C from 1 into 10 (the creature's cast). Read 2026-10-09; the dialog itself (0x5F3360) is not.", args = "this = battle manager; stack, right click", h3api = "H3CombatCreature::ShowStatsDialog", refs = ["installation.md §7.21"] },
{ va = 0x468990, kind = "function", name = "strike_animation", size = 0xA08, confidence = "read", summary = "Animates the stacks a strike, a shot or a spell touched, then casts the pending spells (H3API: ApplyAnimationToLastHitArmy). Per stack its group: a striker's (+0x0 set) its strike group +0x2, else death 5 (+0xEA), defend 4 (flag 0x8000000) or hit 3 (+0xE9); L = max(the magic animation's frames, A + R - 1) iterations, A the strikers' longest group, R the reactions'. A shot marks no striker (stack_shot sets none of the flags melee_strike sets at 0x441A87), so A is 0 and the reactions start as the projectile lands (E17 M2 T5b). Each iteration advances every animating stack (a reaction starts once the iterations left are at most its frames; a shooter still in groups 14-16 plays its group out: its count is the group's frames less one (0x468ABF) and each stack's frame advances before its draw, so it stands from the second iteration, E17 M2 T4b-1), draws, waits on the frame deadline with 100 ms (0x46906E: trunc(100 x the speed factor)) and shows; a reaction ends standing (group 2), a death stays on its last frame. Then each living stack's pending spell (+0xEC) is cast as a creature's cast at mastery 0, power 3 (0x469102), and cleared.", h3api = "H3CombatManager::ApplyAnimationToLastHitArmy", refs = ["epics/E17-design.md §7.9", "installation.md §7.20", "epics/E17-design.md §7", "epics/E17-design.md §8.2"] },
{ va = 0x469440, kind = "function", name = "phoenix_rebirth_check", size = 0x1B2, confidence = "read", summary = "The Phoenixes' rebirth check after damage (creature 131; uses casts left, 0x469480); raises n times the health +0xC0 as the death routine left it (0x46959E to 0x4695AD: Age already ended).", refs = ["installation.md §7.17", "installation.md §7.21"] },

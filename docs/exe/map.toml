{ va = 0x4B1A70, kind = "function", name = "pathfinder_relax", size = 0x88D, confidence = "read", summary = "The pathfinder's relax step for one neighbour: the new node's cost is the source node's cost (+0x18) plus the step's price; it replaces the tile's stored node (H3Pathfinder +0x24, one 30-byte node per tile) only when strictly better by turn, then by cost (0x4B1CB0..0x4B1CF9), else nothing changes. Read around the comparison only.", refs = ["rules/surveys/E08-adventure-core.md §1.3"] },
{ va = 0x4B2300, kind = "function", name = "pathfinder_expand", size = 0xA94, confidence = "read", summary = "Expands one pathfinder node in the eight directions (0x678150): prices each step with 0x4B1740 at the points passed in (the caller's start points minus the node's cost: the points left on the node), the new node's points at +0x1C (a step it cannot pay today starts a new day when allowed, 0x4B252A), then relaxes through 0x4B1A70. Read around the pricing and the relax calls.", refs = ["rules/surveys/E08-adventure-core.md §1.3"] },
{ va = 0x4B25D4, kind = "site", name = "pathfinder_fog_test", confidence = "read", summary = "A neighbour's explored bit for the current player (its vision word against current_player_bit). An unexplored neighbour is inaccessible for a human player (player_is_human) unless the run's mode argument is 3 (the mouse's run, 0x4194A0, passes 0; 3 not read); for a computer player it is accessible from an explored tile, or anywhere while the player record's +0x3E is above 0 (not read). ADV-MOV-008.", refs = ["rules/surveys/E08-adventure-core.md §1.4"] },
{ va = 0x4B2DA0, kind = "function", name = "ai_pathfinder_map", size = 0x24B, confidence = "read", summary = "Builds the AI pathfinder's map over the field (side -1: every stack an enemy); gives a bound stack no movement (0x4B2DE0).", refs = ["installation.md §7.14", "installation.md §7.20"] },
{ va = 0x4B3290, kind = "function", name = "mark_walk_stops", size = 0x16F, confidence = "read", summary = "Marks the walker's stops: the moat and Quicksand its side owns or sees (not the stack's own hexes); blocked map at 0x4B3384.", refs = ["installation.md §7.16"] },
{ va = 0x4B3400, kind = "function", name = "battle_pathfinder", size = 0x787, confidence = "inferred", summary = "The battle pathfinder (survey S-11's bug would be here; not read in full): marks the stops for every caller (0x4B353E), avoids seen Quicksand, ends paths on stops (not one the stack already covers, 0x4B36ED) and marks no attack target from a position on a stop when the range asked is within the stack's speed (0x4B378D to 0x4B37D1; with a longer range it does, one move dearer, 0x4B378A); Bind gives no movement (0x4B350B).", refs = ["installation.md §7.14", "installation.md §7.15", "installation.md §7.16", "installation.md §7.20"] },
{ va = 0x4B49C0, kind = "function", name = "stack_fly", size = 0x76, confidence = "read", summary = "A flyer's move: enters only the landing hexes, no pit test; releases Bind (0x4B49E1). After the flight (0x4B49E9) a plain move (its second argument) turns back to the facing it started with, animated (0x4B49F5 to 0x4B4A08), then one frame of group 2 (0x4B4A15; read for E17 M2 T4b-2a).", refs = ["installation.md §7.15", "installation.md §7.16", "installation.md §7.20"] },
{ va = 0x4B4A40, kind = "function", name = "stack_flight_animation", size = 0x44E, confidence = "read", summary = "A flyer's flight, from stack_fly: group 20 (0x446940), then k = (d + D / 2) / D cycles of group 0 over the distance d in pixels between the hexes (crt_sqrt; D the flight distance +0x160, k = 1 without one), each frame trunc(f32 walk time +0x158 x the speed factor / group 0's frames) on the frame deadline (0x4B4C2C, 0x4B4DB5), the stack drawn at the interpolated point: from the start hex record's anchor (+0x1C4, +0x1C6) an f32 point moved on before each frame by f32((f32 delta / f32 k) / f32 n) and drawn at its truncation (0x4B4BA3 to 0x4B4D5D, read for E17 M2 T4b-1); then it stands on the landing hex (0x4687C0), group 21 and one frame of group 2. First turns around, animated, when the landing hex's column (+0x38 and the target hex modulo 17) lies the other way from its facing (0x4B4A53 to 0x4B4AF7; a two-hex stack's target moved by one, 0x4B4AD5); k = 0 (a one-hex flight) skips the cycles (0x4B4C5B to 0x4B4E1C, read for E17 M2 T5c); after the cycles group 21 and one frame of group 2 (0x4B4E59, 0x4B4E66; read for E17 M2 T4b-2a). Before the cycles +0x30 is set (0x4B4BD8, cleared at 0x4B4E73) and the stack taken off its hexes (0x468730), so no row pass draws it; each frame restores the last frame's rectangle from a saved buffer (0x44E2B0) and draws the flier by itself (draw_battle_stack 0x43E140 at 0x4B4D60): over everything (read for E17 M2 T5a).", refs = ["epics/E17-design.md §7.9", "epics/E17-design.md §7", "epics/E17-design.md §7.10", "epics/E17-design.md §8.2"] },
{ va = 0x4B4E90, kind = "function", name = "stack_teleporting_move", size = 0x76, confidence = "read", summary = "A teleporting creature's move (Devils): enters only the landing hexes; releases Bind (0x4B4EB1).", refs = ["installation.md §7.15", "installation.md §7.16", "installation.md §7.20"] },

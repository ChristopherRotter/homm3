{ va = 0x478900, kind = "function", name = "move_and_attack", size = 0x290, confidence = "read", summary = "A move and attack: skips the attack when the walk stopped early (0x478971), re-enters hexes after an attack from where it stands (0x4789C7), the Harpies' return (0x4789F8: a move through 0x445D10 and 0x445950, no test of the battle's end before it).", refs = ["installation.md §7.15", "installation.md §7.16", "installation.md §7.20"] },

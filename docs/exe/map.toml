{ va = 0x474BF0, kind = "function", name = "war_machine_automatic", size = 0x188, confidence = "inferred", summary = "Whether a war machine (switch on creature 145-149) acts on its own: hidden battle yes; with the side's skill (Ballistics +0xD3 for the Catapult, Artillery, First Aid; the arrow tower (149) takes the Ballista's case, Artillery) a human player commands it; options globals and +0x13D68 read in part.", refs = ["installation.md §7.29", "installation.md §7.30"] },
{ va = 0x474D80, kind = "function", name = "battle_buttons", size = 0x114D, confidence = "inferred", summary = "The battle window's message handler, read in parts: clicks by control id (switch 0x474E53: 2001 computes the surrender price, 0x474FE9 to 0x47507F; 2009 queues Wait, action 8, 0x4751B8) and keys by key code (switch 0x4758FB: 33, the F key, 0x475C17, enters a Faerie Dragon's cast of its drawn spell through 0x59EC50(spell, 1) at 0x475CD8 and makes the action 10).", refs = ["installation.md §7.19", "installation.md §7.21"] },

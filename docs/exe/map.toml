{ va = 0x479DE0, kind = "function", name = "battle_stand_fidgets", size = 0x14F, confidence = "read", summary = "As a walk, a strike (0x47926D), a shot, a cast (0x47903F), a creature's cast (0x479377), the Catapult's shot (0x479AEB) and move_and_attack (0x478951) start: when any stack (but those with bit 21 of +0x84) shows group 1, every such stack stands (group 2, frame 0, its fidget clock +0xFC now), the heroes' idle clocks (+0x53FC, +0x5400) become now and the battle is redrawn (E17 M3 T6c-2).", refs = ["epics/E17-design.md §9.10"] },
{ va = 0x479F30, kind = "function", name = "battle_start_idle_clocks", size = 0x8B, confidence = "read", summary = "At the battle's start (battle_start 0x463098, after the idle step's time 0x6989B8 is set): the heroes' idle clocks +0x53FC, +0x5400 = now; every stack whose fidget interval t (+0x154) is above 51 gets its fidget clock +0xFC = now + 2r - t, r = random_between(50, t) (0x479F7C, the rules' generator): its first fidget comes 100 to 2t ms after the start. The action dispatcher (0x478D80, seven copies), move_and_attack and a routine of the battle loop repeat the same after every action.", refs = ["epics/E17-design.md §7"] },

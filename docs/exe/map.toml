{ va = 0x4AD470, kind = "function", name = "adventure_battle", size = 0x1531, confidence = "inferred", summary = "A battle on the adventure map, read in parts: a seed of -1 becomes random_between(1, 1000); battle_side_setup, the battle, the winner (battle manager +0x13D48: 0 the attacker); an attacking hero that lost goes back to the heroes' pool (0x4D9EC0) and off the map (0x4ACBB0); the defeat test (0x5F2E10).", args = "this = adventure manager; position, attacking hero, its army, defending owner, town, defending hero, its army, seed, two flags", returns = "the winner", refs = ["rules/surveys/E08-battles.md §4.2", "rules/surveys/E08-battles.md §7.4"] },
{ va = 0x4B0E40, kind = "function", name = "executive_loop", size = 0xF5, confidence = "read", summary = "The managers' main loop (E24 M2 T1a1): pumps the Windows messages (0x4F7FB0), takes the next input message (0x4EC590: the tick, then the queue's oldest or an idle one, type 0), hands it to the managers from the top down (each one's procedure, vtable +8, while its +0x34 is 1; a mouse move skips the window manager) until one answers 1, and starts over at once: no wait, so a frozen clock leaves it spinning and a clock step is met by its next turn.", refs = ["epics/E24-design.md §3.1"] },
{ va = 0x4B1330, kind = "function", name = "position_on_map", size = 0x3B, confidence = "read", summary = "Whether a packed position (x in bits 0-9, y in bits 16-25, signed, as manager +0xE4) lies on the map: 0 <= x < 0x6783C8 and 0 <= y < 0x6783CC; the level is not tested.", refs = ["epics/E24-design.md §1.4"] },
{ va = 0x4B1460, kind = "function", name = "pathfinder_cells_alloc", size = 0x9F, confidence = "read", summary = "Frees and allocates the pathfinder's nodes (+0x24: the map's levels x width x height x 2 of 30 bytes, which a battle's 187 cells reuse) and its 187-byte stops (+0x68); +0x28, +0x2C cleared, +0x30 and +0x34 the map's size. Called when +0x24 is absent (0x4B3400's head, 0x4B2DA0, 0x4B2FF0) and by the map's 0x56B440.", args = "this = pathfinder", refs = ["installation.md §7.40", "installation.md §7.41"] },
{ va = 0x4B1740, kind = "function", name = "step_cost", size = 0x13E, confidence = "read", summary = "The price of a step from a source tile in a direction: both roads -> the source road's cost; native terrain (no Cursed Ground) -> 100; else the terrain's by Pathfinding (0x63E510); Nomads, Favorable Winds, water walking and flying change it; flying (level >= 0) takes the lesser of the fly price and the price so far from a land tile with the map item's +0xC bit 0x40 (no object blocks it: not the coast, E08 T38), the fly price from water or a tile without the bit (0x4B17EA). A diagonal compares the points left with the plain terrain cost T: below T, T to below T*sqrt2 the straight cost, from T*sqrt2 trunc(cost*sqrt2) (A-2, A-3). Second reading agrees (2026-10-10).", args = "source tile, direction, points left, Pathfinding, destination road, fly level, water-walk level, native terrain, has Nomads", refs = ["rules/surveys/E08-adventure-core.md §1.2", "rules/surveys/E08-adventure-core.md §1.3"] },
{ va = 0x4B1880, kind = "function", name = "cheapest_step_from", size = 0x33, confidence = "read", summary = "The cheapest straight step from a tile: 0x4B1740 with the tile as both ends and its terrain as native (its road's cost if it has a road, else 100, the terrain's on Cursed Ground); the move passes the hero's own fly and water-walk fields (+0x112, +0x116), not the artifacts' level 3 (0x48084E; E08 T34a, A-12). E08 T66a2 (the second reading): for a hero in a boat on a Favorable Winds tile the price's two thirds, 66 (step_cost's winds on the source).", refs = ["rules/surveys/E08-adventure-core.md §1.3", "rules/surveys/E08-hero-movement.md §2.5", "rules/surveys/E08-sea.md §4.1"] },
{ va = 0x4B18C0, kind = "function", name = "hero_step_cost", size = 0x1A2, confidence = "read", summary = "The price of one step of a hero (H3API GetMovementCost): finds the source and destination tiles from the position and direction (0x678150), reads the Pathfinding level, fly and water-walk levels (artifacts 72 and 90 force 3), the army's native terrain and Nomads, and calls 0x4B1740.", h3api = "H3Hero::GetMovementCost", refs = ["rules/surveys/E08-adventure-core.md §6"] },
{ va = 0x4B1A70, kind = "function", name = "pathfinder_relax", size = 0x88D, confidence = "read", summary = "The pathfinder's relax step for one neighbour: the new node's cost is the source node's cost (+0x18) plus the step's price; it replaces the tile's stored node (H3Pathfinder +0x24, one 30-byte node per tile) only when strictly better by turn, then by cost (0x4B1CB0..0x4B1CF9), else nothing changes. Its eighth argument, the entered tile's +0xD bit 0x10 (pathfinder_expand 0x4B2D12..0x4B2D22), becomes the node's stop flag (node +4 bit 1, 0x4B1EF1..0x4B1F04; E08 T58). Read around the comparison and that flag only.", refs = ["rules/surveys/E08-adventure-core.md §1.3", "rules/surveys/E08-rewards.md §15"] },
{ va = 0x4B2300, kind = "function", name = "pathfinder_expand", size = 0xA94, confidence = "read", summary = "Expands one pathfinder node in the eight directions (0x678150): prices each step with 0x4B1740 at the points left on the node with the node's flying (flags bit 4) and water walking (bit 5); a step it cannot pay starts a new day from a node with bit 10, priced without them (0x4B252A). Rock: none. Blocked, unexplored (human), up off a not-from-above entrance, an enemy hero in a Sanctuary: only flying, without bit 10; plain water: flying or water walking, without bit 10; down onto a not-from-above entrance: never. From a node without bit 10 no step enters a cannot-be-entered entrance or a town (98); a flying node at an entrance is relaxed again without bit 10 (0x4B2D3D). Relaxes through 0x4B1A70. The computer's mode 4 (Dimension Door, Fly, Water Walk on the way) not read (E08 T34a). E08 T66a1 (the boat node, flags bit 2, kept through a landing in modes 0-2): priced with no road, native terrain, flying or water walking (0x4B24B7); the next day starts with the sea's maximum (+0x10, 0x4B2536); onto water never a boat's entrance (0x4B26EB) and a diagonal only between two water side tiles (0x4B2703; E08 T66b: water to water only, the land branch 0x4B2867 has no side test, so a diagonal landing needs none); onto land only class 3 (0x4B2882; the computer's mode 4 lands with a day's change and clears the bits, 0x4B28B6); a walking node's boat node at 0x4B2B01 is the computer's (pathfinder +0x14), not read.", refs = ["rules/surveys/E08-adventure-core.md §1.3", "rules/surveys/E08-hero-movement.md §3.1", "rules/surveys/E08-sea.md §4.1"] },
{ va = 0x4B25D4, kind = "site", name = "pathfinder_fog_test", confidence = "read", summary = "A neighbour's explored bit for the current player (its vision word against current_player_bit). An unexplored neighbour is inaccessible for a human player (player_is_human) unless the run's mode argument is 3 (the mouse's run, 0x4194A0, passes 0; 3 not read); for a computer player it is accessible from an explored tile, or anywhere while the player record's +0x3E is above 0 (not read). ADV-MOV-008.", refs = ["rules/surveys/E08-adventure-core.md §1.4"] },
{ va = 0x4B2DA0, kind = "function", name = "ai_pathfinder_map", size = 0x24B, confidence = "read", summary = "Builds the AI pathfinder's map over the field (side -1: every stack an enemy); gives a bound stack no movement (0x4B2DE0). E17 M5 T4c2a: with the tactics flag (its fourth argument) range 1000; a reached cell (bit 0, cost within the range, no high bits) outside the side's zone (0x4763F0) is skipped, else +0x4A of its hex set, and a two-hex stack's front hex marked +0x4B, or the position's mark cleared when that hex is outside the zone (0x4B2EC8); a front in column 0 or 16 left unmarked.", refs = ["epics/E17-design.md \u00a77.23", "installation.md §7.14", "installation.md §7.20"] },
{ va = 0x4B2F18, kind = "site", name = "ai_map_shooter_marks", confidence = "read", summary = "0x4B2DA0 after the reached cells: a stack that can shoot now (0x4428F0), outside the tactics phase and not the Catapult (145), sets +0x4A on the position and the other hex of every living record of the other side but the arrow towers (to 0x4B2FE0); Hypnotize's value 0x43A500 then takes a shooter's whole side (E23 T4d).", refs = ["installation.md §7.54"] },
{ va = 0x4B2FF0, kind = "function", name = "ai_destination_map", size = 0x298, confidence = "read", summary = "0x421680's map with its flag 1: every hex but the side columns where the stack fits (0x446C40) and Teleport's test passes (0x5A3700) reached at cost 1 (hex record +0x4A set, others cleared); each other-side record but the stack, the dead and arrow towers with a neighbour among them has its position hex marked at cost 1 (a two-hex one's other hex not: the position marked twice). Writes nothing else: an unreached cell keeps its cost and the stops (+0x68) stay the last search's, which 0x436300 reads (survey slip 30).", args = "this = pathfinder; stack, side", refs = ["installation.md §7.34", "installation.md §7.38", "installation.md §7.58"] },
{ va = 0x4B3290, kind = "function", name = "mark_walk_stops", size = 0x16F, confidence = "read", summary = "Marks the walker's stops: the moat and Quicksand its side owns or sees (not the stack's own hexes); blocked map at 0x4B3384.", refs = ["installation.md §7.16"] },
{ va = 0x4B3400, kind = "function", name = "battle_pathfinder", size = 0x787, confidence = "read", summary = "The battle pathfinder (stack, side or -1, target hex or -1, tactics flag, range, speed or -1): a uniform-cost search from the stack's position, its queue first in, first out among equal costs (0x4B3BB0), each taken hex's neighbours in directions 0-5 (top right first, clockwise); a step costs 1, one entering a stop (0x4B3290; not a hex the stack already covers, 0x4B3701 to 0x4B3725) the rest of the turn; a hex where the stack does not fit (or an avoided stop, 0x4B375C) gets the attack marks of the stack there (hex record +0x4A; none from a stop when the range is within the speed, 0x4B378D to 0x4B37D1; from a stop one move dearer, 0x4B378A); flyers and Devils pass over such hexes (0x4B39C4). Ends at the target hex reached or marked; traces the path (+0x48, end first) against the cells' directions (0x523EC0). Bind gives no movement (0x4B350B). Its head (0x4B3420 to 0x4B34B2) keeps an automatic stack (0x474BF0) at a town out of its stops when its hit points are at most 4 x the town's 0x63BD18, or 40 x for side 1 or a gate not closed; it clears the hex records' attack marks, takes range and speed 1000 in the tactics phase, the stack's speed for -1, range 0 for speed 0 or Bind. An attack ends only at the target hex itself (0x4B38A6, 0x4B39BB; S-11). E17 M5 T4c2a: a neighbour where the stack does not fit marks the stack of the other side on it (+0x4A of its hexes, the cost kept in the cell, 0x4B37EF) and, for a two-hex mover, the one on the hex its front would take there (0x4B38C4); flyers (+0x84 bit 1) and creatures 0x36, 0x37 go on past it with a count (the cell's top six bits) below their speed (0x4B39E7).", args = "this = pathfinder; stack, side, target hex, tactics flag, range, speed", returns = "bool: a path", refs = ["epics/E17-design.md \u00a77.23", "installation.md §7.14", "installation.md §7.15", "installation.md §7.16", "installation.md §7.20", "installation.md §7.31", "installation.md §7.40", "installation.md §7.41"] },
{ va = 0x4B3B90, kind = "function", name = "pathfinder_cell", size = 0x20, confidence = "read", summary = "The pathfinder's cell of a hex: +0x24 + 30 x hex (0 without cells).", args = "this = pathfinder; hex", returns = "cell pointer", refs = ["installation.md §7.40"] },
{ va = 0x4B3BB0, kind = "function", name = "pathfinder_push", size = 0x35C, confidence = "read", summary = "Queues a hex for the battle pathfinder: nothing off the field, above the range, for a hex reached at no more, or at 500 entries; else inserted into the queue (+0x38, sorted by cost from highest to lowest) before the first entry whose cost is not higher (a binary search; 0x4B3F70 or an append), so equal costs leave first in, first out; the entry (hex, bit 0, direction bits 12-15, flown count bits 26-31, cost +0x18) copied into the cell.", args = "this = pathfinder; hex, direction, cost, flown count, range", refs = ["installation.md §7.40"] },

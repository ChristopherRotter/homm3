{ va = 0x47F860, kind = "function", name = "view_moving_hero_piece", size = 0x2D9, confidence = "read", summary = "Pass 7's piece of the selected hero lifted at the view's centre (manager +0x1EC; called at the view's places i = 8 to 10, j = 7 after layer 2 and j = 8 after layer 1, with i - 8 and j - 7): the 32 x 32 cell (32 a, 32 b) of its pictures at the screen's fixed (256 + 32 a, 232 + 32 b), not moved by the view's offset +0xF4. In a boat (0x4CE900) its waves (+0x160 by type, frame +0x200; not on a coast tile: the tile's +0xD bit 2), its flag (+0x18C by type x 8 + the boat's colour) and the boat (+0x154 by type); on land the flag (+0x16C by owner) and the hero (+0x10C by class +0x30); the flags' frame (+0x100 + +0x200) mod 8, the others' +0x200, group +0x1FC, mirrored when the facing +0x47 is above 4; through def_draw_group_flagged 0x47C080 (E24 M2 T1b).", refs = ["epics/E24-design.md §2.2", "epics/E24-design.md §3.5"] },

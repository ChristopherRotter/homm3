{ va = 0x476490, kind = "function", name = "battle_cursor", size = 0x52A, confidence = "read", summary = "The battle cursor: an attack or shot target is a stack whose own side +0xF4 differs from the acting side +0x132C0, the tent's patient one whose side equals it (0x476753 to 0x476799; no Hypnotize or Berserk test on the target); creature cast (0x4766EA, 0x4766FC, 0x47670B, 0x476736), empty hex test (0x47684B). E17 M3 T6c-2: the acting stack's target (+0x10, +0x14) is cleared over a hex of the field (0x476686), set over an enemy (0x47679D) and cleared again when neither a shot nor a strike reaches it (0x476837); nothing, a side column or a hero leaves it.", refs = ["installation.md §7.14", "installation.md §7.21", "epics/E17-design.md §9.9", "epics/E17-design.md §9.10"] },

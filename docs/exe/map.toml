{ va = 0x477EE0, kind = "function", name = "ai_battle_action", size = 0x3E5, confidence = "read", summary = "The computer's action for the active stack (the battle loop 0x4744CF: a hidden battle or a stack acting on its own): in the tactics phase or when the retreat test 0x41E570 says no, 0x4221F0. Else a human side in auto-combat is asked once per battle (+0x1402F; E17 M5 T4c1, 0x477F56: a two-button box of GENRLTXT's row with the hero's name, its Cancel 0x7806 clearing +0x1402F and fighting on); retreat (4) without a hero on either side; the surrender price into 0x695030; retreat for a town's defender, below price + 2500 gold, or with the army worth at most that; then a human is asked to surrender (5) or retreats (4); a computer side always retreats (0x47815A).", refs = ["installation.md §7.33", "installation.md §7.34", "epics/E17-design.md §7.22"] },
{ va = 0x4782D0, kind = "function", name = "battle_controls_state", size = 0x5B5, confidence = "read", summary = "Sets the battle panel's controls as a stack's turn starts (E17 M3 T6a, from 0x478457; the state 0x1000 disables, 0x5FE4F0): with Auto Combat on or a remote turn, an acting stack that plays itself dims the panel (0x46BF90) and a human's Auto Combat shows selected (0x4784F9); a side whose player is not a local human: 0x46BF90 (0x4787F6); else the picture takes that player's colours (subtype 0xD, 0x47856E), Surrender needs a hero on both sides and is refused to a town's defender (0x478573), Retreat needs the side's hero and, for a town's defender, a Stronghold with building 17 in its set +0x158 (0x4785C7), the options enabled, Auto Combat unselected and disabled when both sides are human (0x478635), in the tactics phase (+0x13D68) controls 2300 and 30722 enabled, else the log's scroll buttons enabled (0x4786CA), the spell book needs the side's hero to wear artifact 0 and not to have cast (+0x54B4, unless +0x13D74), outside the tactics phase (0x4786EF), Wait outside the wait phase (+0x13DE4) and the tactics phase (0x478755), Defend outside the tactics phase (0x4787B6); then the dialog redrawn. For a human player's side the log's new entries settle (0x472BF0 at 0x47884C) and the mouse is posted again (0x4ECC00), else the busy cursor (E17 M3 T6b). E04c T4 (installation.md §7.27). Both returns come after the computer's hero cast 0x422DA0 (0x478861, 0x47887D). E17 M5 T2a: its head forgets the mouse's hex and, unless Auto Combat (+0x132C4) or a remote turn, empties the input queue (0x4EC570 at 0x478301): a click, a key or a move made during an action or a computer's turn is dropped; +0x132B4 set when the side to act is played on this computer (0x47844D), cleared for a human elsewhere (0x478445): the battle takes a click or a command only while it is set.", refs = ["installation.md §7.21", "installation.md §7.34", "epics/E17-design.md §9.7", "epics/E17-design.md §
{ va = 0x4F6990, kind = "function", name = "message_box_build", size = 0xC8C, confidence = "read", summary = "Builds and runs a message box (E17 M5 T4a): framed_dialog_create 0x48FDC0 at the record's place and size, flags 0x12; its frame's DEF items in the viewing player's colours (0x4F6B5D); the text (medfont, colour 1, alignment 1, id 1; a scrolling text above 200); by the style (switch 0x4F6C93) the buttons, each Box64x30.pcx (66 x 32) at (x, h - 62) and a 64 x 30 DEF button at (x + 1, h - 61): 1, 5, 7 iOkay.def 0x7802 (Enter) at (w - 66) / 2; 2 iOkay.def 0x7805 (Enter) at max(1, w / 2 - 74) and iCancel.def 0x7806 (Escape) at min(w / 2 + 8, w - 66); 3 and 10 the same with 0x7802 and 0x7801 (style 10's OK disabled, 0x4F6F2E); 4, 8, 9 none; each picture a DEF item, its caption (smalfont, colour 1, alignment 1) and a hidden frame item 0x7809 + its index (0x4F731B), which a choice returns (E08 T55a1); the default cursor frame 0 (0x4F74AC); the modal loop with 0x4F08D0 (0x4F7620 for styles 5 and 6, a popup for 4).", refs = ["rules/surveys/E08-rewards.md §2.2", "rules/surveys/E08-rewards.md §6.2", "epics/E17-design.md §7.19"] },

{ va = 0x4B3400, kind = "function", name = "battle_pathfinder", size = 0x787, confidence = "read", summary = "The battle pathfinder (stack, side or -1, target hex or -1, tactics flag, range, speed or -1): a uniform-cost search from the stack's position, its queue first in, first out among equal costs (0x4B3BB0), each taken hex's neighbours in directions 0-5 (top right first, clockwise); a step costs 1, one entering a stop (0x4B3290; not a hex the stack already covers, 0x4B3701 to 0x4B3725) the rest of the turn; a hex where the stack does not fit (or an avoided stop, 0x4B375C) gets the attack marks of the stack there (hex record +0x4A; none from a stop when the range is within the speed, 0x4B378D to 0x4B37D1; from a stop one move dearer, 0x4B378A); flyers and Devils pass over such hexes (0x4B39C4). Ends at the target hex reached or marked; traces the path (+0x48, end first) against the cells' directions (0x523EC0). Bind gives no movement (0x4B350B). Its head (0x4B3420 to 0x4B34B2) keeps an automatic stack (0x474BF0) at a town out of its stops when its hit points are at most 4 x the town's 0x63BD18, or 40 x for side 1 or a gate not closed; it clears the hex records' attack marks, takes range and speed 1000 in the tactics phase, the stack's speed for -1, range 0 for speed 0 or Bind. An attack ends only at the target hex itself (0x4B38A6, 0x4B39BB; S-11).", args = "this = pathfinder; stack, side, target hex, tactics flag, range, speed", returns = "bool: a path", refs = ["installation.md §7.14", "installation.md §7.15", "installation.md §7.16", "installation.md §7.20", "installation.md §7.31", "installation.md §7.40", "installation.md §7.41"] },

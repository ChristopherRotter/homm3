{ va = 0x478900, kind = "function", name = "move_and_attack", size = 0x290, confidence = "read", summary = "A move and attack: skips the attack when the walk stopped early (0x478971), re-enters hexes after an attack from where it stands (0x4789C7), the Harpies' return (0x4789F8: a move through 0x445D10 and 0x445950, no test of the battle's end before it). Saves the attacker's facing and position (0x478934); moves without the walker's turn back (0x47896C: argument 0); after the strike and the Harpies' return turns the attacker back to its facing, animated, if it lives and turned (0x478A35 to 0x478A57; read for E17 M2 T4b-2a).", refs = ["installation.md §7.15", "installation.md §7.16", "installation.md §7.20"] },

{ va = 0x46B610, kind = "function", name = "battle_panel_base", size = 0x570, confidence = "read", summary = "Both battle panels' base (E17 M3 T6a): an 800 x 44 panel (0x5AA3C0) at the dialog's (0, 556) over cbar.pcx (id 2000, 0x46B704) in the colours of the side +0x132C0's player (+0x54A8; the game's player when it has none: 0x46B70F); then the 48 x 36 DEF buttons at y 5, each with its hotkeys: icm001 Surrender 2001 at x 54, icm002 Retreat 2002 at 105, icm003 the options 2003 at 3, icm004 Auto Combat 2004 at 156, icm005 the spell book 2008 at 645, icm006 Wait 2009 at 696, icm007 Defend 2010 at 747 (scan codes S, R, O, A, C, W, D and space); Auto Combat disabled when both sides are human (+0x54A4, +0x54A5; 0x46BB40).", refs = ["epics/E17-design.md §9.7"] },

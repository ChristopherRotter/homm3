{ va = 0x4B49C0, kind = "function", name = "stack_fly", size = 0x76, confidence = "read", summary = "A flyer's move: enters only the landing hexes, no pit test; releases Bind (0x4B49E1). After the flight (0x4B49E9) a plain move (its second argument) turns back to the facing it started with, animated (0x4B49F5 to 0x4B4A08), then one frame of group 2 (0x4B4A15; read for E17 M2 T4b-2a).", refs = ["installation.md §7.15", "installation.md §7.16", "installation.md §7.20"] },
{ va = 0x4B4A40, kind = "function", name = "stack_flight_animation", size = 0x44E, confidence = "read", summary = "A flyer's flight, from stack_fly: group 20 (0x446940), then k = (d + D / 2) / D cycles of group 0 over the distance d in pixels between the hexes (crt_sqrt; D the flight distance +0x160, k = 1 without one), each frame trunc(f32 walk time +0x158 x the speed factor / group 0's frames) on the frame deadline (0x4B4C2C, 0x4B4DB5), the stack drawn at the interpolated point: from the start hex record's anchor (+0x1C4, +0x1C6) an f32 point moved on before each frame by f32((f32 delta / f32 k) / f32 n) and drawn at its truncation (0x4B4BA3 to 0x4B4D5D, read for E17 M2 T4b-1); then it stands on the landing hex (0x4687C0), group 21 and one frame of group 2. First turns around, animated, when the landing hex's column (+0x38 and the target hex modulo 17) lies the other way from its facing (0x4B4A53 to 0x4B4AF7; a two-hex stack's target moved by one, 0x4B4AD5); k = 0 (a one-hex flight) skips the cycles (0x4B4C5B to 0x4B4E1C, read for E17 M2 T5c); after the cycles group 21 and one frame of group 2 (0x4B4E59, 0x4B4E66; read for E17 M2 T4b-2a). Before the cycles +0x30 is set (0x4B4BD8, cleared at 0x4B4E73) and the stack taken off its hexes (0x468730), so no row pass draws it; each frame restores the last frame's rectangle from a saved buffer (0x44E2B0) and draws the flier by itself (draw_battle_stack 0x43E140 at 0x4B4D60): over everything (read for E17 M2 T5a).", refs = ["epics/E17-design.md §7.9", "epics/E17-design.md §7", "epics/E17-design.md §7.10", "epics/E17-design.md §8.2"] },

{ va = 0x4BCDA0, kind = "function", name = "saved_game_load", size = 0xEC2, confidence = "inferred", summary = "Loads a saved game (H3SVG): among much else restores the game's +0x1F698 (mapKind) from the save's header (0x4BCE86) or, for old saves, a byte of the stream (0x4BD72C), and the Grail's position (+0x1F690).", refs = ["installation.md §7.27"] },
{ va = 0x4BFE70, kind = "function", name = "new_game_heroes", size = 0x6A8, confidence = "inferred", summary = "At a new game, per hero record: the experience random_between(0, 50) + 40 at +0x51 (0x4BFE94), the starting army (0x4C9730, flag clear), its movement points, the level-up seed random_between(1, 255) at +0x8F (0x4BFEC2), the level-up counters +0x90 and +0x3F to 0 (0x4BFECD, 0x4BFED4); sets 0x698400 for its run (0x4BFE7B to 0x4C04E2); sets the date's second word to 1 (0x4C00B1); each playing colour's starting resources (0x4C01EE: a human the row of the game's difficulty +0x1F6D8 from 0x678170, or 0x6779C8 when +0x1F69D is set; a computer its AI type random_between(0, 2) and the row from 0x6781FC); then the random objects (0x4C9DD0 at 0x4BFFF7) and the objects' setup (0x4C0CC0 at 0x4BFFFE). The new game's setup despite the name. Read in parts.", refs = ["rules/surveys/E08-adventure-core.md §3.1", "rules/surveys/E08-objects.md §3.4", "rules/surveys/E08-objects.md §7.2", "rules/surveys/E08-battles.md §6.2", "rules/surveys/E08-progression.md §2.2"] },
{ va = 0x4C0CC0, kind = "function", name = "setup_map_objects", size = 0x1668, confidence = "read", summary = "At a new game (from 0x4BFE70), walks every tile with an object's entrance (level, row, column) and fills each class's tile word (switch 0x4C0DAD). Read for campfires (0x4C0EE5: amount random_between(4, 6), then resource random_between(0, 5)) and resource piles (0x4C1AD1: an amount of 0, tested at 0x4C1AE4, becomes random_between(5, 10) for wood, ore and gold, random_between(3, 6) for the rest); the other cases not read.", refs = ["rules/surveys/E08-objects.md §3"] },
{ va = 0x4C1923, kind = "site", name = "monster_count_roll", confidence = "read", summary = "setup_map_objects, class 54: a count of 0 becomes random_between(creature record +0x6C, +0x70), the creature's adventure-map range.", refs = ["rules/surveys/E08-battles.md §1.5"] },
{ va = 0x4C6FE0, kind = "function", name = "next_player_turn", size = 0x947, confidence = "read", summary = "The next player's turn: steps 0x69CCA8 through the colours, skipping dead players and those whose human flag (+0xE2) differs (humans first, then computers); after the last calls the new day 0x4C7FE0 (site 0x4C71CC); then sets current and maximum movement points (0x4E4D90) of the new current player's heroes, its two tavern heroes and its towns' heroes. Read in the parts that decide these.", refs = ["rules/surveys/E08-adventure-core.md §1.1"] },
{ va = 0x4C7C50, kind = "function", name = "reveal_owned", size = 0x389, confidence = "inferred", summary = "Reveals around every owned hero (the 156 hero records from game +0x21620, owner byte +0x22, radius from hero_scouting_radius, through reveal_disk), then around other owned objects (not read); called by new_day among others. While no rule hides a tile it adds nothing to the reveals after each step. Read the hero loop only.", args = "this = game", refs = ["rules/surveys/E08-adventure-core.md §2"] },
{ va = 0x4C7FE0, kind = "function", name = "new_day", size = 0x462, confidence = "read", summary = "The new day: increments the date's first word (game +0x1F63E); no hero's movement is set within two calls of it. The rest not read.", refs = ["rules/surveys/E08-adventure-core.md §1.1"] },
{ va = 0x4C86A0, kind = "function", name = "starting_army_one_creature_caller", size = 0xD5, confidence = "inferred", summary = "Calls 0x4C9730 with the one-creature flag set; not read.", refs = ["rules/surveys/E08-adventure-core.md §3.1"] },

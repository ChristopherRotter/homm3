{ va = 0x4FBF90, kind = "function", name = "tile_mark_visited_by_team", size = 0x61, confidence = "read", summary = "Sets the tile word's bits 5-12 for every player of the given player's team (game +0x1F879); 12 callers, among them the Tree of Knowledge, the Shrines, the Witch Hut, the Wagon and the Warrior's Tomb (E08 T55a2).", args = "ecx = tile; player", refs = ["rules/surveys/E08-rewards.md §6.1"] },
{ va = 0x4FCAA0, kind = "function", name = "tile_object_entrance", size = 0x12F, confidence = "read", summary = "The entrance tile of a map tile's object (E24 M3 T3a): the tile itself when it is an entrance (+0xD bit 0x10); none for the classes 0, 3, 26 and 36 or an object index (+0x24) outside the objects; else the tile object_entrance_tile 0x4FEC30 gives for the object, none when its x is negative. The minimap reads the owner of the object recorded there (tile_object_setup 0x4FCC30).", args = "ecx = map tile", returns = "map tile or 0", refs = ["epics/E24-design.md §4.4"] },
{ va = 0x4FCBD0, kind = "function", name = "tile_object_class", size = 0x5C, confidence = "read", summary = "The object class of a map tile (+0x1E); for a hero (34) or boat (8) standing there, the class of the object under it when it has one, else 0. Read by the pathfinder's test from above (0x4B26AC, 0x4B267D) and others.", args = "ecx = map tile", returns = "class", refs = ["rules/surveys/E08-objects.md §2.5"] },
{ va = 0x4FCC30, kind = "function", name = "tile_object_setup", size = 0x4D, confidence = "read", summary = "The setup index (+0x14 of the object record) of a map tile's object; for a hero (34) or a boat (8) standing there, that of the object under it. The battlefield setup reads a mine's record with it.", args = "ecx = map tile", refs = ["installation.md §7.26"] },
{ va = 0x4FCDC0, kind = "function", name = "event_fires_for", size = 0x58, confidence = "read", summary = "Whether a tile is an event (class 26) that fires for the current player (E08 T55a3): a human (player_is_human_both) whose colour bit is in the word's bits 10-17; a computer with bit 18 set and its colour in them. It reads the tile's class (+0x1E, 0x4FCDC3) and word only, not the visitable bit an event's tile lacks (E08 T58).", args = "ecx = the tile (map item)", returns = "bool", refs = ["rules/surveys/E08-rewards.md §7.3", "rules/surveys/E08-rewards.md §15"] },
{ va = 0x4FCE20, kind = "function", name = "tile_special_ground", size = 0x116, confidence = "read", summary = "The special ground of a map tile: 33 for an anti-magic garrison's tile or a hero standing in one; else the first class among 21, 46, 222, 224-229 and 231 of the tile's objects, last to first (not 223 or 230); else the tile's class. The step cost reads 21 (Cursed Ground) and 225 (Favorable Winds); the battlefield setup the rest.", refs = ["rules/surveys/E08-adventure-core.md §1.2", "installation.md §7.26"] },
{ va = 0x4FCF40, kind = "function", name = "tile_spell_field", size = 0x112, confidence = "read", summary = "A map tile's special field for the spell masteries: by its special ground (0x4FCE20) 46 Magic Plains 1, 228 Lucid Pools 6, 226 Fiery Fields 7, 231 Rocklands 8, 229 Magic Clouds 9 (the numbers of the battle's setup 0x4643B0), else -1.", args = "ecx = tile", returns = "field, -1 none", refs = ["installation.md §7.39"] },
{ va = 0x4FD690, kind = "function", name = "map_objects_place_all", size = 0x2B3, confidence = "read", summary = "From the map loader 0x4C2450: reads the tiles of each level first (0x4FE220; the underground's when the map has one), then (read at its end) places every object of the game's object list on the map in list (map) order, 0x505B20 per object (the loop at 0x4FD91D).", refs = ["rules/surveys/E08-objects.md §2.5"] },
{ va = 0x4FE220, kind = "function", name = "map_tiles_load", size = 0x26B, confidence = "read", summary = "Reads one level's tiles from the map file, 7 bytes each (E08 T38): terrain +0x4, its picture +0x5, river +0x6, its picture +0x7, road +0x8, its picture +0x9; of the flags byte only the six mirror bits go to +0xC. The file's coast bit 0x40 on a land tile sets +0xD bit 0x02 (the coast the shore battlefield reads, 0x4643B0) and +0x1E = 3 (not read further). Every tile then gets +0xC bit 0x40 (no object blocks it) and loses +0xD bit 0x01, but rock, which gets 0x01 and not 0x40 (0x4FE3E9); a water tile of a shore picture (below 20) gets +0xD bit 0x02; water, lava, a river or a road set +0xC bit 0x80 (not read further). The objects placed after it clear 0x40 where they block (0x505610). E08 T66a1: a land tile with the file's coast bit gets class 3 (+0x1E, 0x4FE3D6), the tile a boat lands on, and loses the entrance bit; a water tile whose picture is below 20 gets +0xD 0x02 too.", args = "this = map, stream, side, level", refs = ["rules/surveys/E08-hero-movement.md §2.1", "rules/surveys/E08-sea.md §3.2"] },
{ va = 0x4FEC30, kind = "function", name = "object_entrance_tile", size = 0x106, confidence = "read", summary = "An object's entrance tile x, y (-1 none): its template's first visitable cell (+0x2C) on the map, rows from the anchor's upwards (dy below the height +0x11), each from the anchor's column leftwards (dx below the width +0x10). Passes 4 and 7 take the owner there (tile_object_owner 0x40FD20), tile (0, 0) of the surface when it gives none (0x410FC8).", refs = ["epics/E24-design.md §2.2", "epics/E24-design.md §2.9"] },
{ va = 0x4FEE50, kind = "function", name = "load_message_record", size = 0xBC, confidence = "inferred", summary = "Reads a message record (a text and the guards) from the map file for the artifact's and the scroll's body readers; not read (E08 T55a1).", refs = ["rules/surveys/E08-rewards.md §3.1"] },
{ va = 0x4FF120, kind = "function", name = "load_artifact_body", size = 0x1C9, confidence = "read", summary = "An artifact's body (classes 5, 65-69): the word 0; a flag; set, the message record (0x4FEE50) appended to the map's records (at most 4000, 0x4FF1E6) and the word's bit 31 with the index in bits 19-30 (E08 T55a1).", refs = ["rules/surveys/E08-rewards.md §3.1"] },
{ va = 0x4FF2F0, kind = "function", name = "load_scroll_body", size = 0x1D8, confidence = "read", summary = "A Spell Scroll's body (class 93): the record as 0x4FF120, then the spell: one byte into the word's low byte and three bytes skipped (E08 T55a1).", refs = ["rules/surveys/E08-rewards.md §4"] },
{ va = 0x4FF6B0, kind = "function", name = "load_rewards", size = 0x535, confidence = "inferred", summary = "Reads the format's message, guards and rewards into a reward record (load_message_record 0x4FEE50, then the experience, mana, morale, luck, resources, primary skills and the counted lists); skimmed only (E08 T55a3). The creatures' count is a byte with no bound of seven (0x4FFB55; the second reading, E08 T55a4: A-24).", refs = ["rules/surveys/E08-rewards.md §7.1", "rules/surveys/E08-rewards.md §7.4"] },
{ va = 0x4FFBF0, kind = "function", name = "load_pandora_body", size = 0x1F5, confidence = "read", summary = "A Pandora's Box's body (E08 T55a3): load_rewards, then the record appended to the map's reward records (+0x50) and its index in the word's bits 0-9, only below 400 records (past them the index stays 0).", refs = ["rules/surveys/E08-rewards.md §7.1"] },
{ va = 0x5008B0, kind = "function", name = "load_event_body", size = 0x27A, confidence = "read", summary = "An event's body (E08 T55a3): load_rewards; the players byte to the word's bits 10-17, the computer flag to bit 18, remove-after-visit to bit 19; the record appended to the map's reward records (+0x50, shared with Pandora's Boxes) and its index in bits 0-9, only below 400 records.", refs = ["rules/surveys/E08-rewards.md §7.1"] },
{ va = 0x500B30, kind = "function", name = "load_scholar_body", size = 0x2AE, confidence = "read", summary = "load_object_body's case 81 (at map load): the kind byte, 0xFF random_between(0, 2); defaults Knowledge, no skill, no spell; a random kind draws its id: a spell uniformly over 0-69 with a school and not banned (game +0x4A), a skill over the unbanned 28 (game +0x4E658), a primary skill random_between(0, 3); else the map's byte; then six bytes skipped (E08 T55a2).", refs = ["rules/surveys/E08-rewards.md §6.7"] },
{ va = 0x501270, kind = "function", name = "load_message_body", size = 0x138, confidence = "read", summary = "load_object_body's case for 59 and 91, an Ocean Bottle and a Sign (read whole, E08 T66a2): a length-prefixed text (0x4C6010), appended as a 20-byte record to the game's messages (+0x4E378, the vector's begin +0x4E37C: +0 set when the text has a character, the text's characters at +8; 0x4D07F0); the object's word becomes the record's index (the second argument); then 4 bytes read and not kept (-1 when short).", args = "file, word out", refs = ["rules/surveys/E08-sea.md §8.5"] },
{ va = 0x5013B0, kind = "function", name = "load_monster_body", size = 0x3DC, confidence = "read", summary = "Reads a monster's body from the map into its tile's word: the count's low 12 bits, the aggression in bits 12-16 (compliant -4, friendly 1-7, aggressive 1-10, hostile 4-10, savage 10, by random_between), the message's index (bits 19-26, flag bit 31) with its resources and artifact, never flees (bit 17), does not grow (bit 18).", refs = ["rules/surveys/E08-battles.md §1.2", "rules/surveys/E08-battles.md §1.3"] },
{ va = 0x502B60, kind = "function", name = "random_dwellings_resolve", size = 0x29B, confidence = "read", summary = "From map_objects_place_all (0x4FD90B), after the objects' bodies were read and before place_object_tiles: each random dwelling of the map's list (+0xC0, 16-byte records) gets a faction (its linked town's, else 0x5132D0 of its faction bits), a level random_between(min +0x7, max +0x8) and so a creature (0x6747B4: faction x 14 + level); a Stone Golem's becomes class 20 subclass 1, any other class 17 of the dwelling 0x63D570 lists for it (the last), through 0x505F20; then its anchor x grows by the count of the new template's bottom-row cells from the anchor leftwards that are passable and not visitable, and a dwelling record (game +0x4E39C) is made with the random dwelling's owner (+0x6).", refs = ["epics/E24-design.md §2.9"] },
{ va = 0x502E00, kind = "function", name = "load_object_body", size = 0x832, confidence = "read", summary = "Reads an object's body from the map file by its class (switch 0x502EEF; the cases follow the format's bodies, docs/formats/h3m.md); a Witch Hut on an RoE map (game +0x1F86C 0xE) gets the fixed mask 0xEFBF instead of the file's (0x5034BD; E08 T55a4); read only for 5 and 65-69 (0x4FF120) and 93 (0x4FF2F0) (E08 T55a1), and 81 (0x500B30, E08 T55a2); 6 (load_pandora_body 0x4FFBF0) and 26 (load_event_body 0x5008B0) (E08 T55a3). E08 T66a1: case 8 (a boat) reads no body and calls create_boat 0x4BB250 with the entrance tile, no owner and the template's subclass (+0x3C) as the type (0x502F28), the boat's index the object's word. E08 T66a2: 59 and 91 load_message_body 0x501270 (0x503219).", refs = ["rules/surveys/E08-rewards.md §3.1", "rules/surveys/E08-rewards.md §6", "rules/surveys/E08-rewards.md §7.1", "rules/surveys/E08-sea.md §2", "rules/surveys/E08-sea.md §8.5"] },
{ va = 0x503780, kind = "function", name = "map_template_read", size = 0x4C0, confidence = "inferred", summary = "Reads one object template of a map file (from map_objects_check 0x504470): its DEF, masks, terrains, class, subclass, group and priority; loads its .msk (an error box without one) and sets the class to the game's (object_class_values 0x63A6E4 through the object settings' +0x8, 0x503BA3).", refs = ["epics/E24-design.md §2.9"] },
{ va = 0x504470, kind = "function", name = "map_objects_check", size = 0x5C9, confidence = "inferred", summary = "From map_objects_place_all, once: walks the map's objects, reports one whose template does not match ('Invalid Object Referenced!'), and gives every object record (map +0x14, 12 bytes) its animation phase +0xA = random_between(0, 255) (0x5049C4). Read only there.", refs = ["epics/E24-design.md §1.6"] },
{ va = 0x505060, kind = "function", name = "object_tile_layers", size = 0x1CD, confidence = "read", summary = "Fills a 6-byte-per-column buffer with an object's draw layer at each tile of its width x height from its template's masks; a flat template (+0x40 set: the special grounds) keeps every layer 0 (0x50509C). Read by 0x505B20 and 0x505230.", refs = ["formats/h3m.md Import"] },
{ va = 0x505230, kind = "function", name = "tile_draw_insert", size = 0x3D9, confidence = "read", summary = "Inserts an object's draw entry into a tile's draw list (+0xE), walking from its end: after an entry of a lower layer byte (+3); before one of a higher; at an equal layer it compares the two objects' layers (0x505060) on every tile of their footprints' intersection (IntersectRect) and goes before the earlier one only where that one is higher. So objects of equal layers, the flat special grounds among them (all layers 0), keep map order: the later is drawn on top. The draw order decides which object a tile records (0x505610) and which ground a battle finds (0x4FCE20).", h3api = "H3MainSetup::DrawItem", refs = ["rules/surveys/E08-objects.md §2.5", "formats/h3m.md Import"] },
{ va = 0x505610, kind = "function", name = "tile_refresh_object", size = 0x3F8, confidence = "read", summary = "Recomputes the object a map tile records: walks its draw list (+0xE) from the last entry back and takes the first object whose template marks the tile visitable: its index (+0x24), the visitable flag (+0xD bit 0x10), class (+0x1E), subclass (+0x22) and, with arg 2, its data word (+0x0). Without one, a second walk takes the first ownable object (class_is_ownable 0x40FCA0) whose passability blocks the tile, a third the first object that blocks it (both without the visitable flag, the tile blocked), a fourth the first of class 124 (the tile not blocked); none leaves the reset class (E08 T54). One object per tile, the topmost drawn. It first resets the tile: +0xD bit 0x01 cleared (set again on rock), +0x1E 0 (3 on coastal land), +0xD bit 0x10 cleared, +0xC bit 0x40 set; an object whose entrance is on the tile keeps the bit, one whose passability mask (+0x1C) blocks the tile without an entrance there clears it and sets +0xD bit 0x01 (0x5058AE, 0x5059C4; E08 T38). Reached through 0x505A10 from place_object_tiles and remove_map_object, so the bit follows the objects on the map.", args = "this = map, tile, flag (copy the word)", refs = ["rules/surveys/E08-objects.md §2.5"] },
{ va = 0x505A10, kind = "function", name = "tile_refresh_around_heroes", size = 0x108, confidence = "read", summary = "Recomputes a tile's object (tile_refresh_object 0x505610) with a hero (34) or boat (8) standing there taken off the tile first and put back after (0x4D76E0, 0x4D75D0); an event (26) is left.", args = "this = map; tile, flag", refs = ["epics/E24-design.md §2.7"] },
{ va = 0x505B20, kind = "function", name = "place_object_tiles", size = 0x1F2, confidence = "read", summary = "Places one object (by index) on the tiles of its footprint, the template's width x height (+0x10, +0x11; H3API: from its picture's .msk, which 0x514610 loads) to the left of and above its anchor, clipped to the map: per tile, its draw entry (0x505230), then the tile's object again (0x505610 through 0x505A10); classes 8, 34, 36, 70 and 214 get none, an event (26) only its tile's class: on its entrance tile (the template's visitable mask +0x2C) +0x1E = 26, the word +0x0 copied and +0xD bits 0x01 and 0x10 cleared (0x505C78, E08 T58), so the tile is neither blocked nor a stop for the pathfinder. Called for every object at load (0x4FD690) and for one placed in play (H3API PlaceObjectOnMap).", args = "this = map, object index, flag", refs = ["rules/surveys/E08-objects.md §2.5", "formats/h3m.md Import"] },
{ va = 0x505EA0, kind = "function", name = "class_template_last", size = 0x80, confidence = "read", summary = "The map's per-class template list (map +0xDC + 16 x class, 0x44 bytes a template): the last of the class whose subclass (+0x3C) is the one given (scanning back from the end). With none the index runs to -1 and the record before the list is returned.", args = "this = map; class, subclass", returns = "template*", refs = ["epics/E24-design.md §2.7"] },
{ va = 0x505F20, kind = "function", name = "object_set_class_template", size = 0x157, confidence = "read", summary = "Gives an object the last template of the map's per-class list (map +0xDC + 16 x class) with the subclass given (and, unless -1, the terrain bit given), appending it to the map's templates (+0x4) and loading its DEF if it has no index there yet (+0x42); the object's template becomes it.", args = "this = map; object, class, subclass, terrain", refs = ["epics/E24-design.md §2.9"] },
{ va = 0x5093C0, kind = "function", name = "dwords_copy", size = 0x25, confidence = "read", summary = "The library's std::copy of 4-byte elements (an erase's tail); 11 call sites.", args = "ecx = first, edx = last; destination", returns = "destination end", refs = ["installation.md §7.40"] },
{ va = 0x50B1D0, kind = "function", name = "random_cosmetic", size = 0x54, confidence = "read", summary = "A draw for the looks (the idle step's): a when b <= a; in a network game (0x69954C) a + the clock mod (b - a + 1), so the players' generators stay together; else a + rand() mod (b - a + 1) (0x617E5C), the rules' generator.", args = "a (ecx), b (edx)", h3api = "H3Random::MultiplayerRandom", refs = ["epics/E17-design.md §7"] },
{ va = 0x50B230, kind = "function", name = "random_between", size = 0x28, confidence = "read", summary = "Random(a, b) = a + rand() mod (b - a + 1) (fastcall: ecx a, edx b); H3API's Rand(low, high), at 0x50C7C0 in 3.2.", args = "a, b", h3api = "H3Random::Rand(low, high)", refs = ["installation.md §7.5"] },
{ va = 0x50B260, kind = "function", name = "settings_check", size = 0x26C, confidence = "read", summary = "Puts the loaded settings into their ranges, read in part (E24 M2 T1a2): the flags to 0 or 1; the combat speed 0 to 2, else 0; the scroll speed (option_scroll_speed 0x69878C) 0 to 2, else 1; the computer's walk speed 2 to 5, else 3; the walk speed 1 to 4, else 2 (0x50B392 to 0x50B3E6).", refs = ["epics/E24-design.md §3.4"] },
{ va = 0x50B700, kind = "function", name = "settings_defaults", size = 0x44, confidence = "inferred", summary = "Sets settings to their defaults (read in part): the combat speed 0x6987EC to 0, among others.", refs = ["epics/E17-design.md §7"] },
{ va = 0x50B7B0, kind = "function", name = "settings_read", size = 0x657, confidence = "inferred", summary = "Read in part: reads the game's settings from the registry by their value names (the table 0x63FFC0: Combat Speed, Combat Auto Creatures at 0x50BB6D into 0x698794, Combat Auto Spells, the war machines' and so on; the whole table settings_names 0x63FF74, the speeds of the adventure map at 0x50B8F8, 0x50B914 and 0x50B9D5, E24 M2 T1a2); 0x50B260 then checks the values' ranges.", refs = ["epics/E17-design.md §6.3", "epics/E24-design.md §3.4"] },
{ va = 0x50C5F0, kind = "function", name = "set_random_seed", size = 0xE, confidence = "read", summary = "Seeds the C runtime's random generator (its srand), keeping the seed in a global.", args = "seed", refs = ["rules/surveys/E08-battles.md §4.1"] },
{ va = 0x50C6E0, kind = "function", name = "sampler_init", size = 0x55, confidence = "read", summary = "A sampler over a range that draws each value at most once (Quicksand, Land Mine, Summon Elemental, Magic Mirror).", h3api = "H3IndexVector::H3IndexVector", refs = ["installation.md §7.13", "installation.md §7.16", "installation.md §7.19"] },
{ va = 0x50C740, kind = "function", name = "sampler_draw", size = 0x52, confidence = "read", summary = "Draws uniformly among the values not drawn yet.", h3api = "H3IndexVector::ChooseRandom", refs = ["installation.md §7.13", "installation.md §7.16", "installation.md §7.19"] },
{ va = 0x50C810, kind = "function", name = "load_cranim", size = 0x1E9, confidence = "read", summary = "Loads cranim.txt and parses 149 creature rows (14, then groups of 14, 6, 14, 13 and 4 with header rows between) through 0x50CA00.", refs = ["epics/E17-design.md §4"] },
{ va = 0x50CA00, kind = "function", name = "parse_cranim_row", size = 0x126, confidence = "read", summary = "One cranim.txt row into the 0x54-byte record at 0x6998E0 + 0x54 x creature: cells 0-3 x 9000, 500, 500, 115 (truncated) to +0x44..+0x50, cells 4-9 the i16 missile offsets +0x0..+0xA, cells 10-21 f32 angles +0xC..+0x38, cell 22 the troop-count offset +0x3C, cell 23 the attack climax frame +0x40.", refs = ["epics/E17-design.md §4"] },
{ va = 0x50CCA0, kind = "function", name = "mouse_set_cursor", size = 0xE0, confidence = "read", summary = "H3API's H3MouseManager::SetCursor(frame, type): loads the type's DEF (0x67FF38) when the type changes, then for a frame other than the one shown (+0x50) draws it (type 3, the spell cursor: its frame 0 whatever is asked, kept as the frame shown, E17 M5 T3b) (0x50D8B0) and the cursor (0x50CD90 with 1) (E17 M3 T6c-1).", refs = ["epics/E17-design.md §9.9", "epics/E17-design.md §7.18"] },
{ va = 0x50CD90, kind = "function", name = "mouse_draw_cursor", size = 0x770, confidence = "inferred", summary = "Draws the software cursor where GetCursorPos puts the mouse, its canvas at the mouse less the hot spot 0x67FF50 + (type x 144 + frame) x 8 (0x50CEE0); read in part (E17 M3 T6c-1).", refs = ["epics/E17-design.md §9.9"] },
{ va = 0x50D500, kind = "function", name = "mouse_position_now", size = 0x3F, confidence = "read", summary = "The mouse's point now (E24 M2 T1a2): GetCursorPos, x rounded down to even, in the window's coordinates (ScreenToClient), not the 33 ms poll's point (mouse_poll 0x50D680).", args = "&x, &y", h3api = "H3POINT::GetCursorPosition", refs = ["epics/E24-design.md §3.4"] },
{ va = 0x50D540, kind = "function", name = "mouse_hide", size = 0x6F, confidence = "read", summary = "Hides the software cursor (H3API's H3MouseManager::TurnOff): counts the hides up (+0x68); the first erases the cursor from the screen (0x50CD90 with 1). draw_ray calls it as the ray starts (0x5A5C46; E17 M3 T6c-2). A hero's walk hides it from its start (adventure_key_down 0x409013, hero_move_loop 0x407E7C) to its end (E24 M2 T3a).", refs = ["epics/E17-design.md §9.10", "epics/E24-design.md §3.7"] },
{ va = 0x50D5B0, kind = "function", name = "mouse_show", size = 0xD0, confidence = "inferred", summary = "Shows the software cursor again (H3API's H3MouseManager::TurnOn): counts the hides down (+0x68; with its argument set from 1), the last draws it (0x50D65B). draw_ray calls it after the shot group's rest (0x5A61D4; E17 M3 T6c-2). Read in part.", refs = ["epics/E17-design.md §9.10"] },
{ va = 0x50D680, kind = "function", name = "mouse_poll", size = 0x210, confidence = "read", summary = "The mouse manager's poll from the input loop (0x4ED490): on a grid of 33 ms of the game's clock (its next time 0x69CA18 moves on by max(the time since it, 33)) it reads the mouse again and draws the cursor there (0x50CD90 with 0: GetCursorPos); a SetCursor between draws the new frame where it last read the mouse (E17 M3 T6c-2). E17 M5 T3b: on a second grid of 100 ms (0x69CA1C) a type-3 cursor shows its next frame round its group's (0x50D838). Read in part.", refs = ["epics/E17-design.md §9.10", "epics/E17-design.md §7.18"] },
{ va = 0x50D8B0, kind = "function", name = "mouse_cursor_frame", size = 0x16B, confidence = "read", summary = "The cursor's frame into its surface 0x6AACC4: filled with the colour key (the screen's green and blue masks), then the DEF's group 0 frame (0x47BEB0) (E17 M3 T6c-1).", refs = ["epics/E17-design.md §9.9"] },

{ va = 0x44E2B0, kind = "function", name = "pcx16_copy_rect", size = 0x139, confidence = "inferred", summary = "Copies a rectangle of a 16-bit picture into another (H3API: H3LoadedPcx16::DrawToPcx16; 12 arguments: the source position, the size, the target and its position). A flight restores the last frame's rectangle with it from the battle's saved picture (+0x53B0) before it draws the flier (0x4B4D0B; seen for E17 M2 T5a, not read).", refs = ["epics/E17-design.md §7.10"] },

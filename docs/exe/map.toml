{ va = 0x444090, kind = "function", name = "stack_take_damage", size = 0x8F, confidence = "read", summary = "Takes hit points from a stack: the deaths are (the amount + the top creature's lost +0x58) / the hit points +0xC0, the rest its new +0x58; a clone loses every creature; with deaths the count before them goes to +0x50 (0x4440DB: the count box shows it until strike_animation's end, E17 design §4.3), then +0x4C loses them (at most all); ends Blind, Stone Gaze and Paralyze on any damage.", h3api = "H3CombatCreature::ApplyPhysicalDamage", refs = ["installation.md §7.11", "installation.md §7.14", "installation.md §7.19", "installation.md §7.20"] },
{ va = 0x444120, kind = "function", name = "stack_death", size = 0x3A6, confidence = "read", summary = "A stack's death: (not a clone, +0x288) a draw of 1 to 100 below 60 asks its side's hero for defeat (+0x53DC, 0x4441F5), else one below 80 the other hero for victory (+0x53DE, 0x444221; E17 design §7.14); calls the end routine 0x444510 for every active spell (the loop 0x444228 to 0x444244; Disrupting Ray stays, as that routine refuses it), sets the dead bit, appends a corpse to its hexes (not sacrificed or summoned; 0x444380), takes it off the hex records' occupant byte (0x444400, 0x444418: its hexes then no longer hold a count box back, E17 M3 T5a), resets clone links, releases Bind (0x4441C7). strike_animation calls it for each dying stack after its iterations (0x4692C4).", refs = ["installation.md §7.9", "installation.md §7.16", "installation.md §7.18", "installation.md §7.19", "installation.md §7.20"] },

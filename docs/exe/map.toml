{ va = 0x4E2A00, kind = "function", name = "hero_equip_artifact", size = 0x1C7, confidence = "read", summary = "Puts an artifact (id and second word) into a body position; equipping Titan's Thunder (0x4E2A64) also puts a Spell Book into an empty book position (17); then adds the primary skills of a combination's parts (0x4E2AF7 to 0x4E2B0D) and of the artifact itself (artifact_primary_skills 0x63E758, 0x4E2B7E to 0x4E2B99) to the hero's +0x476 to +0x479, unclamped (E08 T20a1).", args = "artifact (id, second word), position", h3api = "H3Hero::GiveArtifact", refs = ["installation.md §7.22", "rules/catalog/heroes.toml HER-ADV-001"] },

{ va = 0x448AB0, kind = "function", name = "ai_multi_headed_pattern", size = 0x114, confidence = "read", summary = "The directions a multi-headed stack's strike hits from a position: every neighbour (0x3F, or 0xFF two-hex); the Cerberi (creature 47) only the direction touching the struck stack's hex or other hex and the one on each side of it ((d + 5) mod 6 and (d + 1) mod 6; for two-hex the places 0x660878 +- 1 back through 0x660898; corrected in installation.md §7.47).", args = "this = striker; position, struck stack, its hex", returns = "direction mask", refs = ["installation.md §7.36"] },

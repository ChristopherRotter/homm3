{ va = 0x473EA0, kind = "function", name = "automatic_first_aid_tent", size = 0x196, confidence = "read", summary = "The First Aid Tent's automatic turn (creature 147): over the records of the tent's side it skips dead stacks and war machines (flags 0x200040) and stacks without lost hit points and keeps the one with the most lost hit points (0x473F3C to 0x473F67; no Hypnotize test on the patient), then writes the heal action 11 on that stack's hex; none: action 3. Answers 0, leaving the choice to the player, when the tent's hero has First Aid (+0xE4) and the battle is shown.", refs = ["installation.md §7.14", "BAT-WAR-003"] },
{ va = 0x474040, kind = "function", name = "battle_tick", size = 0x8C, confidence = "read", summary = "The battle loop's tick (the same code opens 0x4740D0): unless the battle is hidden, once the clock reaches the frame deadline 0x698998 it calls a routine not read and moves the deadline on by max(trunc(100 x the speed factor), the lateness); once it reaches the idle step's time 0x6989B8, and no step runs (0x6989EC), the idle step 0x4960D0.", refs = ["epics/E17-design.md §7"] },
{ va = 0x4740D0, kind = "function", name = "battle_loop_turn", size = 0x5AB, confidence = "inferred", summary = "Named from the site read inside it. Battle loop part (the battle's procedure: one pass per message); its head (to 0x474170) is the tick of 0x474040; a berserk stack's turn goes to 0x4456D0 at 0x4745DF. E17 M5 T4c1: Auto Combat's stop (0x47419B to 0x47425B): shown, the side to act played here (+0x132B4), Auto Combat on (+0x132C4) or a remote turn, and the active stack playing itself (0x474BF0): the input queue read until a message of kind 0, 1 (a key down), 8, 0x10, 0x20 or 0x40 (the mouse's buttons), the moves and the keys' releases dropped; one but the idle empties the queue (0x4EC570), clears +0x132C4 and runs 0x4782D0 again. Then, no action yet and the stack playing itself (or the battle hidden), the computer's action 0x477EE0 (0x4744CF), else 0x474D80 with the message (0x474625); an action set goes to 0x478D80.", refs = ["installation.md §7.14", "epics/E17-design.md §7", "epics/E17-design.md §7.22"] },
{ va = 0x474690, kind = "function", name = "cursor_attack_slots", size = 0x36B, confidence = "read", summary = "With the cursor on a stack to attack: fills the active stack's twelve attack slots (the from-hex at +0x133FC, -1 none; the cursor at +0x133CC). A neighbouring position is taken only if the reach map marks it, the stack fits (0x446C40) and none of its hexes is in the stops array (0x4747BE to 0x474810; a two-hex stack's shifted position 0x47485F to 0x4748B5): no attack from a seen pit. E17 M5 T2a: read whole for the from-hexes; a two-hex stack also tries the position beside (n less 1 facing right, plus 1 facing left): right and left take it when it is taken; the other directions the preferred one when taken, else the other with a vertical sword (13, 14), which slots 0, 5, 6 and 11 take when both are; a slot without a sword copies the nearest's cursor and from-hex (0x474983).", args = "the target's hex", refs = ["installation.md §7.16", "epics/E17-design.md §9.11"] },
{ va = 0x474A00, kind = "function", name = "cursor_attack_from_hex", size = 0x198, confidence = "read", summary = "Picks the attack's from-hex (+0x132D8) and the cursor from the slot of 0x474690 the mouse points into inside the target's hex (by the angle, 0x474B4F); it has no other source.", refs = ["installation.md §7.16"] },
{ va = 0x474BA0, kind = "function", name = "active_stack_automatic", size = 0x4A, confidence = "read", summary = "Whether the active stack (+0x132B8, +0x132BC) acts on its own: true in a hidden battle, else stack_automatic 0x474BF0 (E17 M5 T4c2a: draw_hex_overlays leaves its overlay empty then).", args = "this = battle manager", returns = "bool", refs = ["epics/E17-design.md \u00a77.23"] },
{ va = 0x474BF0, kind = "function", name = "stack_automatic", size = 0x188, confidence = "read", summary = "Whether a stack acts on its own: a hidden battle yes; the Catapult, the Ballista and an arrow tower (149, the Ballista's case), the First Aid Tent: no in the tactics phase, yes with auto combat (+0x132C4) and the machine's setting (0x69879C, 0x6987A0, 0x6987A4), yes without the controlling hero's Ballistics, Artillery or First Aid (the Ballista also without a hero; the Catapult's case tests none), else the player's test; any other creature (the Ammo Cart too, 0x474CDF): yes with auto combat and option_auto_creatures, else the player's test: yes on a remote turn with +0x132B4, no when the controlling side's player (+0x54A8; +0x288 flips the side) is human, else yes.", args = "this = battle manager; stack", returns = "bool", refs = ["installation.md §7.29", "installation.md §7.30", "installation.md §7.31", "installation.md §7.41"] },
{ va = 0x474D80, kind = "function", name = "battle_buttons", size = 0x114D, confidence = "inferred", summary = "The battle window's message handler, read in parts: clicks by control id (switch 0x474E53: 2001 computes the surrender price, 0x474FE9 to 0x47507F; 2009 queues Wait, action 8, 0x4751B8) 2004 Auto Combat toggles +0x132C4, E17 M5 T4c1, 0x474E5A: on, 0x4782D0 again and, the active stack playing itself, the panel's vtable +0xC 0x46BF90; its mouse move (0x4753A4 to 0x4758E1: outside the battlefield the combat cursor's frame 6 and the items' hints, inside the hex's kind, cursor and status line, E17 M3 T6c-1) and keys by key code (switch 0x4758FB: 33, the F key, 0x475C17, enters a Faerie Dragon's cast of its drawn spell through 0x59EC50(spell, 1) at 0x475CD8 and makes the action 10; 72 and 80, the arrow keys, scroll the log by -1 and +1 through 0x472DB0, E17 M3 T6b). E17 M3 T6c-2: on the same hex only an attack's slot is computed again (0x475553); the status line is written for a new hex, another kind or an attack's new slot (0x4758A4, +0x132DC). E17 M5 T2a: the message type 1 a key down, 4 a move, 0x200 an item's (subtype 12 the left button pressed: over the battlefield's items 0 and 1, 0x475290, the action by the cursor's kind through 0x476BD0; 13 a command by control id; 14 the right button: over the battlefield 0x4769C0, else a control's help 0x472A50); 2010 Defend is action 3 (0x474EEE), 2009 and 2300 Wait action 8 (0x4751B8); clicks and commands only while +0x132B4.", refs = ["installation.md §7.19", "installation.md §7.21", "epics/E17-design.md §9.8", "epics/E17-design.md §9.9", "epics/E17-design.md §9.10", "epics/E17-design.md §9.11", "epics/E17-design.md §7.22"] },

{ va = 0x46A350, kind = "function", name = "battle_experience", size = 0x10C, confidence = "read", summary = "The battle's experience for the winning side (argument): the loser's 20 records without the summoned (bit 22) and war machine (bit 6) flags, (start - count) x the type's hit points (creature table +0x4C); +500 for the loser's hero (0x46A3DF), -500 again when a side retreated or surrendered (0x6985A3, 0x697744); E04c T4: +500 for the attacker's side at a town (0x46A416); for a winner's hero crt_ftol(the Learning getter 0x4E4840 x f32(points)) (0x46A42D; E08 T19a2a).", refs = ["installation.md §7.27", "installation.md §7.19", "epics/E08-log.md T19a2a"] },

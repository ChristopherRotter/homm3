{ va = 0x477EE0, kind = "function", name = "ai_battle_action", size = 0x3E5, confidence = "read", summary = "The computer's action for the active stack (the battle loop 0x4744CF: a hidden battle or a stack acting on its own): in the tactics phase or when the retreat test 0x41E570 says no, 0x4221F0. Else a human side in auto-combat is asked once per battle (+0x1402F); retreat (4) without a hero on either side; the surrender price into 0x695030; retreat for a town's defender, below price + 2500 gold, or with the army worth at most that; then a human is asked to surrender (5) or retreats (4); a computer side always retreats (0x47815A).", refs = ["installation.md §7.33", "installation.md §7.34"] },
{ va = 0x4782D0, kind = "function", name = "battle_controls_state", size = 0x5B5, confidence = "read", summary = "Sets the battle panel's controls as a stack's turn starts (E17 M3 T6a, from 0x478457; the state 0x1000 disables, 0x5FE4F0): with Auto Combat on or a remote turn, an acting stack that plays itself dims the panel (0x46BF90) and a human's Auto Combat shows selected (0x4784F9); a side whose player is not a local human: 0x46BF90 (0x4787F6); else the picture takes that player's colours (subtype 0xD, 0x47856E), Surrender needs a hero on both sides and is refused to a town's defender (0x478573), Retreat needs the side's hero and, for a town's defender, a Stronghold with building 17 in its set +0x158 (0x4785C7), the options enabled, Auto Combat unselected and disabled when both sides are human (0x478635), in the tactics phase (+0x13D68) controls 2300 and 30722 enabled, else the log's scroll buttons enabled (0x4786CA), the spell book needs the side's hero to wear artifact 0 and not to have cast (+0x54B4, unless +0x13D74), outside the tactics phase (0x4786EF), Wait outside the wait phase (+0x13DE4) and the tactics phase (0x478755), Defend outside the tactics phase (0x4787B6); then the dialog redrawn. For a human player's side the log's new entries settle (0x472BF0 at 0x47884C) and the mouse is posted again (0x4ECC00), else the busy cursor (E17 M3 T6b). E04c T4 (installation.md §7.27). Both returns come after the computer's hero cast 0x422DA0 (0x478861, 0x47887D).", refs = ["installation.md §7.21", "installation.md §7.34", "epics/E17-design.md §9.7", "epics/E17-design.md §9.8"] },
{ va = 0x478900, kind = "function", name = "move_and_attack", size = 0x290, confidence = "read", summary = "A move and attack: skips the attack when the walk stopped early (0x478971), re-enters hexes after an attack from where it stands (0x4789C7), the Harpies' return (0x4789F8: a move through 0x445D10 and 0x445950, no test of the battle's end before it). Saves the attacker's facing and position (0x478934); moves without the walker's turn back (0x47896C: argument 0); after the strike and the Harpies' return turns the attacker back to its facing, animated, if it lives and turned (0x478A35 to 0x478A57; read for E17 M2 T4b-2a).", refs = ["installation.md §7.15", "installation.md §7.16", "installation.md §7.20"] },
{ va = 0x478B90, kind = "function", name = "first_aid_tent_action", size = 0x1E5, confidence = "read", summary = "First Aid Tent's heal at 0x478BEC: Random(1, trunc(25 x getter)), capped by the patient's lost hit points +0x58, which it lowers (0x478C22; +0x4C only read for the name, +0x50 untouched: no count changes, E17 M3 T5b-2b); sets the tent's acted bit; unless hidden: Regener.wav (0x478C46, category 2), the log's line (0x472E90), magic animation 79 over the patient at 100 ms a frame without its hit (0x478D14, play_magic_animation), then waits for the sound to end (wait_for_sample). The tent itself shows no animation (E17 M3 T3b).", refs = ["installation.md §7.5", "epics/E17-design.md §4.3", "epics/E17-design.md §7.15"] },
{ va = 0x478D80, kind = "function", name = "action_dispatcher", size = 0x1054, confidence = "read", summary = "The battle action dispatcher, a switch on the action +0x3C (0x47902F): a hero's cast, 1 (0x479036: spell, hex and second hex from +0x40, +0x44, +0x48); Defend, 3 (0x479706: the bonus stored at +0x4DC and added to +0xCC, 0x47974A to 0x4798D7; re-entry 0x4798F3); Wait, 8 (0x479906: the waited bit, no test of the phase; re-entry 0x479AD6); a creature's cast, 10 (0x47936E: the target hex +0x44 alone; morale 0x4793A9); attack from where it stands (0x4792D7). E17 M3 T6c-2: every action (+0x3C, the switch's index its number less 1) shows the pointer at its start (0x478E3A).", refs = ["installation.md §7.9", "installation.md §7.15", "installation.md §7.21", "epics/E17-design.md §9.10"] },
{ va = 0x479637, kind = "site", name = "surrender_gold_transfer", confidence = "read", summary = "A surrender's price is taken from the surrendering side's owner's gold and added to the other side's owner's gold (0x47966F).", refs = ["rules/surveys/E08-battles.md §7.3"] },

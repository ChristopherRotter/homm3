{ va = 0x477C20, kind = "function", name = "battle_mouse_stack", size = 0x1E4, confidence = "read", summary = "The stack under the mouse (H3API guesses SimulateMouseAtHex; battle_buttons calls it when the mouse's hex +0x132D4 changes, 0x47570E): nothing while the battle is hidden or +0x132F8 is set, nor when the hex's stack is the marked one (+0x132D0 its position); else the marked stack is redrawn and unmarked (+0x132CC 0, +0x132D0 -1), and a stack on the hex is marked (outline 0x70) and, if its DEF has group 1 and it does not show it, starts group 1 at frame 0 (0x477D73), else stands (group 2, frame 0, unless it does); battle_redraw. The idle step then plays the group as a fidget.", refs = ["epics/E17-design.md §7"] },
{ va = 0x4782D0, kind = "function", name = "battle_controls_state", size = 0x5B5, confidence = "inferred", summary = "Read in part (0x478704 to 0x4787B6): sets or clears the state 0x1000 of the battle window's controls; control 2009, the Wait button, gets it while the wait phase (+0x13DE4) or the tactics phase is on (0x478755 to 0x478790). That the state disables a control is H3API's guess of the two callees' names. E04c T4: surrender needs a hero on both sides and is refused to a town's defender; a town's defender may retreat only from a Stronghold with building 17 in its set +0x158; retreat always needs the side's hero (0x478573 to 0x478635, installation.md §7.27).", refs = ["installation.md §7.21"] },
{ va = 0x478900, kind = "function", name = "move_and_attack", size = 0x290, confidence = "read", summary = "A move and attack: skips the attack when the walk stopped early (0x478971), re-enters hexes after an attack from where it stands (0x4789C7), the Harpies' return (0x4789F8: a move through 0x445D10 and 0x445950, no test of the battle's end before it). Saves the attacker's facing and position (0x478934); moves without the walker's turn back (0x47896C: argument 0); after the strike and the Harpies' return turns the attacker back to its facing, animated, if it lives and turned (0x478A35 to 0x478A57; read for E17 M2 T4b-2a).", refs = ["installation.md §7.15", "installation.md §7.16", "installation.md §7.20"] },

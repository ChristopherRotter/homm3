{ va = 0x476490, kind = "function", name = "battle_cursor", size = 0x52A, confidence = "read", summary = "The battle cursor: an attack or shot target is a stack whose own side +0xF4 differs from the acting side +0x132C0, the tent's patient one whose side equals it (0x476753 to 0x476799; no Hypnotize or Berserk test on the target); creature cast (0x4766EA, 0x4766FC, 0x47670B, 0x476736), empty hex test (0x47684B). E17 M3 T6c-2: the acting stack's target (+0x10, +0x14) is cleared over a hex of the field (0x476686), set over an enemy (0x47679D) and cleared again when neither a shot nor a strike reaches it (0x476837); nothing, a side column or a hero leaves it. E17 M4 T2a: 16 for an attacker's wall shooter (+0x84 bit 5) outside tactics over 0xFF with a Castle, 0xFE with a Citadel, or a standing target's aim hex (an empty one; the Catapult over any, 0x4766B2), the target +0x14 set; 22 over 0xFF or 0xFE with that fort otherwise and over hex 183 with a Castle when no move (0x476975).", refs = ["installation.md §7.14", "installation.md §7.21", "epics/E17-design.md §9.9", "epics/E17-design.md §9.10", "epics/E17-design.md §10.2"] },
{ va = 0x4769C0, kind = "function", name = "battle_right_click", size = 0x207, confidence = "inferred", summary = "The right button pressed over the battlefield (battle_buttons 0x474E00, the mouse's hex +0x132D4): a stack there shows its stats (stack_stats_dialog 0x468860 at 0x476B15, a right click's popup while held), a turret its info (0x47A380 at 0x476BBA); then for a human here the log settles and the mouse is posted again (E17 M5 T2a: named from its calls, not read).", refs = ["epics/E17-design.md §9.11"] },
{ va = 0x476BD0, kind = "function", name = "battle_click_action", size = 0x402, confidence = "read", summary = "The left button pressed over the battlefield (battle_buttons 0x47532B), by the cursor's kind (the argument, +0x132E0) less 1 through the byte table 0x476FBC: a walk or a flight (1, 2) action 2 at the mouse's hex +0x132D4, for a two-hex stack whose reach map marks it as a front hex (+0x20F) the position beside it (0x476C5F); a shot (3, 15) action 7; an attack (7) action 6 from +0x132D8; a wall-shot target (16) action 9; a heal (17) action 11; a creature's cast (20) action 10 (+0x3C the action, +0x44 the hex, +0x40 the from-hex or -1); the hero (4) its spell book (0x59E900, 0x59EC50); a stack to look at (5) its stats dialog (0x468860); a turret (22) its info (0x47A380); the others nothing (E17 M5 T2a).", args = "this = battle manager; the cursor's kind", refs = ["epics/E17-design.md §9.11"] },

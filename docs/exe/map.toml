{ va = 0x4C0CC0, kind = "function", name = "setup_map_objects", size = 0x1668, confidence = "read", summary = "At a new game (from 0x4BFE70), walks every tile with an object's entrance (level, row, column) and fills each class's tile word (switch 0x4C0DAD). Read for campfires (0x4C0EE5: amount random_between(4, 6), then resource random_between(0, 5)) and resource piles (0x4C1AD1: an amount of 0, tested at 0x4C1AE4, becomes random_between(5, 10) for wood, ore and gold, random_between(3, 6) for the rest); case 5 (0x4C0DC8: an artifact without a record costs a random_between(0, 99) whose result is dropped, and its word's low 4 bits are cleared) and case 101 (0x4C1DD8: the chest's draw r = random_between(0, 99), 60 in the tutorial, game +0x1F69D: below 32 1000 gold, below 64 1500, below 95 2000, else random_artifact_of_level(2), E08 T55a1). E08 T55a2: per-class counters from 0 (0x4C0CF6) give the word of 4, 23, 32, 41, 47, 51, 61, 100 and 107 the object's index in the walk (the Tree of Knowledge's masked to 5 bits, its price random_between(0, 2) in bits 13-15, 0x4C1E5D; Corpse 0x4C1131 and Lean To 0x4C157A in bits 0-4); Corpse: random_between(0, 99) below 20 a random_artifact_of_level(6); Wagon (0x4C1EA2): resource random_between(0, 5), amount random_between(2, 5), r below 10 empty, below 50 a random_artifact_of_level(6); Warrior's Tomb (0x4C1F1C): below 30 treasure, 80 minor, 95 major, else relic; Lean To: resource random_between(0, 5), amount random_between(1, 5); Scholar (0x4C1B29): a kind other than 0 gets a fallback primary skill random_between(0, 3); Shrines (0x4C1CA8, 0x4C1CF5, 0x4C1D59): a spell of 0x3FF drawn by random_shrine_spell; University university_setup; Witch Hut (0x4C207D): the map's mask (empty: all 28) less the bans, the r-th of them by random_between(1, n), none -1. E08 T55a3: case 6 (0x4C0DED) leaves a box whose word's low half is not negative (every loaded box); -1 to -5 would become random_artifact_of_level(0xE, 2, 4, 8, 0x10) by the switch at 0x4C0E0A (no loader read sets them); case 63 (0x4C19DE) the Pyramid: the spells 0-69 of level 5 with a school (+0x18, +0x1C) not banned (game +0x4A), one by random_between(0, n - 1), set with pyramid_word_set 0x4C2330. The other cases not read. E08 T66a2: case 29 (0x4C1466) the word random_between(0, 3); 82 (0x4C1B94) r = random_between(0, 99): below 20 the kind 0, below 90 the kind 1, else the kind 2 with random_artifact_of_level(2) in bits 3-12 (the kind in bits 0-2, the word's other bits kept); 86 (0x4C1BF2) r: below 55 random_artifact_of_level(2), below 75 (4), below 95 (8), else (0x10), the artifact as the word; 59 has no case.", refs = ["rules/surveys/E08-objects.md §3", "rules/surveys/E08-rewards.md §2.1", "rules/surveys/E08-rewards.md §6", "rules/surveys/E08-rewards.md §7.5", "rules/surveys/E08-sea.md §8"] },

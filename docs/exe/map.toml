{ va = 0x4A4780, kind = "function", name = "visit_guarded_resource", size = 0x45D, confidence = "read", summary = "A resource pile with a message record (bit 31 of the tile's word, 0x4A4BF4; the record, 0x4C bytes, by bits 19-30): no guards (flag +0x10 clear or no stack) is the plain pickup with the message; with guards, its text as a yes or no question (no: nothing happens) or, without a text, the battle at once (0x4AD470, seed -1, the guards unsplit); a win gives the pickup and removes the pile.", refs = ["rules/surveys/E08-objects.md §3.1", "rules/surveys/E08-battles.md §5.1"] },

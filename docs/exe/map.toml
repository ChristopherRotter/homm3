{ va = 0x494440, kind = "function", name = "battle_redraw", size = 0x7D5, confidence = "read", summary = "The battle's redraw: the background buffer (0x493CF0 when not composed), layer-1 obstacles by anchor, siege parts, the flags and heroes, then per row 0-10 passes 0-7 over columns 0-16 (siege walls 0, corpses 1, layer-0 obstacles 2, the living stack whose layer +0x8 is the pass, through 0x494F40), siege towers, two calls not read (0x494AAC, 0x494ABC); with its sixth argument set it then waits for the frame deadline 0x698998 (0x494ACE) and moves it on by max(trunc(f32 fourth argument x the speed factor), the lateness); with its first set it shows the frame. Its second argument marks the dirty rectangle +0x13D38 (0x495BF0) and sets the clip flag +0x13D30: then every item meeting the rectangle is drawn whole and the rectangle is shown; its fifth restores the background +0x53B0 first, inside the dirty rectangle when the clip flag is set, else the whole battlefield, recomposing it when +0x53B8 is clear (E17 design §7.11).", h3api = "H3CombatManager::Refresh", refs = ["epics/E17-design.md §4", "epics/E17-design.md §7"] },

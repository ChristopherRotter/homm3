{ va = 0x514610, kind = "function", name = "msk_load", size = 0x317, confidence = "read", summary = "Loads a picture's .msk (its name with the extension replaced; default.msk, 1 x 1, when the archives lack it): the width and height in tiles, then the colour and shadow masks of 6 bytes each (H3API H3LoadedMsk), cached; bit i of a file mask (byte i div 8, bit i mod 8) becomes bit i of a 48-bit set (0x51486F to 0x5148AF), the first mask at the record's +8, the second at +0x10, so a cell (dx, dy) is bit 7 - dx of byte 5 - dy as in the .h3m's masks. The object templates take their width and height and their colour (+0x14) and shadow (+0x24) masks from it (H3API; 0x505B20 places an object on that rectangle; E24 M1 T4a's survey and captures agree).", refs = ["formats/h3m.md Import", "epics/E24-design.md §2.6"] },
{ va = 0x5226D0, kind = "function", name = "palette_to_screen", size = 0x9D, confidence = "read", summary = "Converts a 24-bit palette to the screen format: per channel the top bits by truncation, shifted into place (565: (r >> 3) << 11 | (g >> 2) << 5 | b >> 3).", h3api = "H3BasePalette565::InitiateFromPalette888", refs = ["epics/E17-design.md §3.2"] },

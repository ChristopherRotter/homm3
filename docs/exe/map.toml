{ va = 0x449E90, kind = "function", name = "split_dialog", size = 0x2EF, confidence = "read", summary = "Splits a stack between two slots (read, E08 T44a): this = the source army; args source slot, target army, target slot, keep-source flag, keep-target flag. t = the two counts; m1 = 1 when (the first flag and the source army has one stack) or (the second flag and the target army has one stack); m2 = 1 when the second flag and the target army has one stack; at OK (0x44A0E2) the target's count is the chosen one held to [m2, t - m1], the source's t minus it, a 0 count empties its slot, the target takes the source's creature. The hero screen passes 0, 0, the exchange 1, 1.", args = "source slot, target army, target slot, keep source, keep target", refs = ["rules/surveys/E08-army.md \u00a73.3"] },

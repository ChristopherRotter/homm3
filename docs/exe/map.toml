{ va = 0x477AC0, kind = "function", name = "outline_turn_stack", size = 0x95, confidence = "read", summary = "Unless the battle is hidden: the stack whose turn it is (+0x132B8, +0x132BC) becomes the outlined one (+0x132C8) if it is not, standing (group 2, frame 0) unless flag 0x200000 or already, and a redraw shown at once; cast_spell's tail calls it for every caster (0x5A216B; E17 M3 T7b-2b-3, the recorded `acid`).", refs = ["epics/E17-design.md §7.16"] },
{ va = 0x477B60, kind = "function", name = "clear_outline", size = 0xB6, confidence = "read", summary = "If a stack is outlined (+0x132C8): with its argument the dirty rectangles reset (0x493710) and the stack's hexes marked for redraw (an arrow tower its own way, 0x46A460); the outline cleared; with its argument a redraw shown at once. cast_spell calls it as a cast starts (0x5A004C, argument 1; E17 M3 T7b-2b-3).", args = "redraw (bool)", refs = ["epics/E17-design.md §7.16"] },
{ va = 0x477C20, kind = "function", name = "battle_mouse_stack", size = 0x1E4, confidence = "read", summary = "The stack under the mouse (H3API guesses SimulateMouseAtHex; battle_buttons calls it when the mouse's hex +0x132D4 changes, 0x47570E): nothing while the battle is hidden or +0x132F8 is set, nor when the hex's stack is the marked one (+0x132D0 its position); else the marked stack is redrawn and unmarked (+0x132CC 0, +0x132D0 -1), and a stack on the hex is marked (outline 0x70) and, if its DEF has group 1 and it does not show it, starts group 1 at frame 0 (0x477D73), else stands (group 2, frame 0, unless it does); battle_redraw. The idle step then plays the group as a fidget. E17 M3 T6c-2: its redraw (0x477DF8) shows only the stack's new frame's rectangle, so pixels of its old frame outside it stay until the next idle step's redraw; the idle step plays the group 1 it starts as a fidget.", refs = ["epics/E17-design.md §7", "epics/E17-design.md §9.10"] },

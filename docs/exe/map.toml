{ va = 0x4FCC30, kind = "function", name = "tile_object_setup", size = 0x4D, confidence = "read", summary = "The setup index (+0x14 of the object record) of a map tile's object; for a hero (34) or a boat (8) standing there, that of the object under it. The battlefield setup reads a mine's record with it.", args = "ecx = map tile", refs = ["installation.md §7.26"] },
{ va = 0x4FCE20, kind = "function", name = "tile_special_ground", size = 0x116, confidence = "read", summary = "The special ground of a map tile: 33 for an anti-magic garrison's tile or a hero standing in one; else the first class among 21, 46, 222, 224-229 and 231 of the tile's objects, last to first (not 223 or 230); else the tile's class. The step cost reads 21 (Cursed Ground) and 225 (Favorable Winds); the battlefield setup the rest.", refs = ["rules/surveys/E08-adventure-core.md §1.2", "installation.md §7.26"] },
{ va = 0x4FCF40, kind = "function", name = "tile_spell_field", size = 0x112, confidence = "read", summary = "A map tile's special field for the spell masteries: by its special ground (0x4FCE20) 46 Magic Plains 1, 228 Lucid Pools 6, 226 Fiery Fields 7, 231 Rocklands 8, 229 Magic Clouds 9 (the numbers of the battle's setup 0x4643B0), else -1.", args = "ecx = tile", returns = "field, -1 none", refs = ["installation.md §7.39"] },
{ va = 0x4FD690, kind = "function", name = "map_objects_place_all", size = 0x2B3, confidence = "read", summary = "Read at its end (from the map loader 0x4C2450): places every object of the game's object list on the map in list (map) order, 0x505B20 per object (the loop at 0x4FD91D).", refs = ["rules/surveys/E08-objects.md §2.5"] },
{ va = 0x5013B0, kind = "function", name = "load_monster_body", size = 0x3DC, confidence = "read", summary = "Reads a monster's body from the map into its tile's word: the count's low 12 bits, the aggression in bits 12-16 (compliant -4, friendly 1-7, aggressive 1-10, hostile 4-10, savage 10, by random_between), the message's index (bits 19-26, flag bit 31) with its resources and artifact, never flees (bit 17), does not grow (bit 18).", refs = ["rules/surveys/E08-battles.md §1.2", "rules/surveys/E08-battles.md §1.3"] },
{ va = 0x505060, kind = "function", name = "object_tile_layers", size = 0x1CD, confidence = "read", summary = "Fills a 6-byte-per-column buffer with an object's draw layer at each tile of its width x height from its template's masks; a flat template (+0x40 set: the special grounds) keeps every layer 0 (0x50509C). Read by 0x505B20 and 0x505230.", refs = ["formats/h3m.md Import"] },
{ va = 0x505230, kind = "function", name = "tile_draw_insert", size = 0x3D9, confidence = "read", summary = "Inserts an object's draw entry into a tile's draw list (+0xE), walking from its end: after an entry of a lower layer byte (+3); before one of a higher; at an equal layer it compares the two objects' layers (0x505060) on every tile of their footprints' intersection (IntersectRect) and goes before the earlier one only where that one is higher. So objects of equal layers, the flat special grounds among them (all layers 0), keep map order: the later is drawn on top. The draw order decides which object a tile records (0x505610) and which ground a battle finds (0x4FCE20).", h3api = "H3MainSetup::DrawItem", refs = ["rules/surveys/E08-objects.md §2.5", "formats/h3m.md Import"] },
{ va = 0x505610, kind = "function", name = "tile_refresh_object", size = 0x3F8, confidence = "read", summary = "Recomputes the object a map tile records: walks its draw list (+0xE) from the last entry back and takes the first object whose template marks the tile visitable: its index (+0x24), the visitable flag (+0xD bit 0x10), class (+0x1E), subclass (+0x22) and, with arg 2, its data word (+0x0). One object per tile, the topmost drawn.", args = "this = map, tile, flag (copy the word)", refs = ["rules/surveys/E08-objects.md §2.5"] },
{ va = 0x505B20, kind = "function", name = "place_object_tiles", size = 0x1F2, confidence = "read", summary = "Places one object (by index) on the tiles of its footprint, the template's width x height (+0x10, +0x11; H3API: from its picture's .msk, which 0x514610 loads) to the left of and above its anchor, clipped to the map: per tile, its draw entry (0x505230), then the tile's object again (0x505610 through 0x505A10); classes 8, 34, 36, 70 and 214 get none, an event (26) only its tile's class. Called for every object at load (0x4FD690) and for one placed in play (H3API PlaceObjectOnMap).", args = "this = map, object index, flag", refs = ["rules/surveys/E08-objects.md §2.5", "formats/h3m.md Import"] },

{ va = 0x477470, kind = "function", name = "battle_end", size = 0x58C, confidence = "read", summary = "End of battle: temporary creatures taken away and the keep-one safeguard (0x4774E2), Necromancy (0x4775E1). E04c T4: restores the defending hero's attack, defense and power and caps its mana at the value before (0x4776E1 to 0x477719). E08 T19a2a: for a winner with a hero (0x477737) the experience (0x477747, given at 0x477766 unless the side's +0x54A6 is set, then at 0x477948), the raised creatures (0x47776E), Eagle Eye (0x477776), then the capture (0x477782). E17 M3 T8: then the whole screen darkened (0x47782C), the result window built (0x4702D0) and its tune played once with the effects ended (play_music 0x477905 for a human winner, 0x4779B4 else: the shown side, 0x4778B1), no clock step between.", refs = ["epics/E17-design.md §8.2", "installation.md §7.27", "installation.md §7.18", "installation.md §7.19", "epics/E08-log.md T19a2a"] },

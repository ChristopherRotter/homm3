{ va = 0x448260, kind = "function", name = "creature_cast_action", size = 0x582, confidence = "read", summary = "A creature's cast action: turns, lowers casts left, then by creature (tables 0x448740, 0x448768) Ogre Mage, elementals, Faerie Dragon, Master Genie, Archangel, Pit Lord. Every cast gives the cast routine the second hex -1 (the Faerie Dragon's 0x448656), so no creature's spell is redirected. Its animation (E17 M3 T7a-1): turned toward the target, the group by atan(dy / |dx|) from its centre to the target hex's anchor, dy the target's y less its own (not the shot's sign): above 25 deg 17, above -25 18, else 19, a missing group 11-13 (0x44840C to 0x4484BB); its shot sound +0x17C, the frames at trunc(A / n) (A +0x15C) each, the last kept (0x44851C) through the cast; then the sound's end (0x4486E2) and its turn back. Recorded (T7a-2a): a Faerie Dragon's level target beside it 17, above 19, below 17. Its cast (0x44863E): the drawn spell +0x4E0 at the hex, caster kind 1, mastery 2, power 5 per creature (E17 M3 T7c-1).", args = "this = stack; target hex", refs = ["installation.md §7.21", "epics/E17-design.md §7.16"] },

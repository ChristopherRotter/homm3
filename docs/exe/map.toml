{ va = 0x4960D0, kind = "function", name = "battle_idle_step", size = 0x76A, confidence = "read", summary = "The battle's idle step, every 100 ms whatever the combat speed (0x474040). Per living stack that is not blind, petrified, paralysed or an arrow tower: in group 1 (its fidget) it advances a frame unless a draw 0x50B1D0(0, 100) gives less than 8 (0x49666D), and at the group's end stands (group 2, frame 0) with its fidget clock +0xFC = trunc(now + r / 2 - t / 4), r = 0x50B1D0(0, t), t its fidget interval +0x154 (0x4966C6); standing in group 2, it starts group 1 (frame 0) once now - +0xFC > t and its DEF has the group. The active and the mouse's stacks are redrawn; the heroes' idle groups (4 500 ms after +0x53FC, 0x4965AB; read in part). Then counts +0x13FFC up, rotates game.pal's entries 0x60-0x67 and 0x70-0x77 by one (0x522950 with -1: the outlines' pulse), redraws (0x494440), and sets its next time 0x6989B8 to the old plus max(now - old, 100) (0x496820).", refs = ["epics/E17-design.md §4", "epics/E17-design.md §7"] },

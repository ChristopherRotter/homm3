{ va = 0x445FD0, kind = "function", name = "wall_shot_animate", size = 0x526, confidence = "read", summary = "Animates a wall shot at the part hit (args target, damage): the shot group by atan(dy / |dx|) not negated (a target above takes 16, below 14: E17 CLT-Q19), its sound +0x17C and frames to the climax; the shooter stands without a redraw (0x4462A3); the rock 0x467A00; WallMiss for 0 damage, else WallHit (category 0, 127), and CSGRCK or SGEXPL centred on the target (drawn 0x446453 with the battlefield-clipped rectangle's size from the canvas's top-left: over the top edge its bottom is cut as much again, E17 CLT-Q22), each frame after an unshown redraw without the background restored, at frame 5 0x465990 with the target and damage; a whole redraw shown, then the samples' waits (0x599EC0). In a hidden battle only the call.", refs = ["installation.md §7.29", "epics/E17-design.md §10.2"] },

{ va = 0x4DD2D0, kind = "function", name = "hero_screen_proc", size = 0x143E, confidence = "read", summary = "The hero screen's procedure (read at its army slots, buttons, worn positions and backpack places, E08 T44a; its views not read). Buttons: 77 and 78 rotate the backpack array (+0x1D4: the last to the front, the front to the end), 122 loose (clears +0x48 bit 0, 0x4DD577), 124 tight (sets it, 0x4DD587; the battle reads it, 0x463673), 126 toggles bit 1 (the tactics formation, 0x4DD5AD), 127 the split button (0x698A44), 128 the quest log, 129 the hero's dismissal (GENRLTXT 23). Army slots 68-74 (0x4DD962): select, the selected again opens the creature dialog (dismiss while more than one stack), split with the button or Shift, merge, else army_swap_slots. Worn positions 2-20 (0x4DDBCD): right-click (SoD) disassembles a combination or assembles at a part with every part worn; position 17 opens the book, 16 says GENRLTXT 313; else pick up, or drop with hero_can_replace_artifact (a swap), then 0x4DC100. Backpack places 40-44 (0x4DE06B): pick up (the rest move down) or insert (hero_give_backpack_artifact).", refs = ["rules/surveys/E08-battles.md §6.4", "rules/surveys/E08-army.md §3.1", "rules/surveys/E08-army.md §4", "rules/surveys/E08-army.md §5.2"] },

{ va = 0x442A50, kind = "function", name = "ai_creature_worth", size = 0x410, confidence = "read", summary = "The computer's worth of one creature of a stack (a double): sqrt(offense x defense factor) x Fight Value (table +0x3C); offense 1 + 0.05 (attack - base - min bonus), halved for a shooter that cannot shoot, the Ballista's Artillery factors (0x63B7F0), Bless and Curse, x2 for a double shot; defense (1 + 0.05 (defense - base - min bonus)) x the stage-3 protection; a war machine or summoned stack x its side's other hit points / (own + other). Not a damage estimate (the old name).", args = "this = stack; min attack bonus, min defense bonus, shot flag, 0", refs = ["installation.md §7.10", "installation.md §7.31", "installation.md §7.33"] },

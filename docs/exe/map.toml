{ va = 0x4A84F0, kind = "function", name = "visit_object", size = 0x2542, confidence = "read", summary = "The visit of an object by the current player's hero: a switch on the tile's class (+0x1E, 0x4A853A). Read for classes 9 border guard (0x4A8734), 10 Keymaster's tent (0x4A8843), 12 campfire, 13 Cartographer (0x4A8A14; gold paid at 0x4A8B60), 58 and 60 observatories (0x4A9992, 0x4A9A12; reveal_disk radius 20 at 0x4A9AC6), 79 resource and 212 border gate (0x4A8DD0); the other cases not read.", args = "hero, tile (map item), packed position, human (false skips the messages and questions)", refs = ["rules/surveys/E08-objects.md §3", "rules/surveys/E08-objects.md §4", "rules/surveys/E08-objects.md §5", "rules/surveys/E08-objects.md §6"] },

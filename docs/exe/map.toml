{ va = 0x44D5A0, kind = "function", name = "video_open", size = 0x283, confidence = "read", summary = "Opens a clip by its table name (ecx) with BinkOpen flags (edx): <name>.bik compared ignoring case with the video archives' directories, for the Complete edition (3) data\\Video.vid's (0x69FDE0, its handle 0x69FE4C), then the CD's when one is open (0x69FE2C, 0x69FE50), then data\\h3ab_ahd.vid's (0x69FE28, 0x69FE48; for edition 1 that one first); the handle set to the entry's offset, BinkOpen with the flags and 0x8000000; 0 when no archive holds it. E17 M5 T4b2b.", refs = ["epics/E17-design.md §7.21"] },
{ va = 0x44D830, kind = "function", name = "video_open_in_dialog", size = 0x1A3, confidence = "read", summary = "Opens a Bink clip of the clip table 0x6839C0 to play in a dialog (from video_play_in_dialog 0x597570; ecx the index, edx x, then y, a width and height, 0 the clip's, whether it plays on at its end 0x694CD8 and whether its frames are shown 0x694CA8): BinkDDSurfaceType of the primary surface into 0x694CA0; the loop (the entry's +4, unless empty) opened first into 0x694CB4 with flags 0x400000, then the start (+0) into 0x694CB0 (0x400000 by the entry's +0xB, 0 for the battle's); its target the back buffer at (x, y); playing (0x694D5C). E17 M5 T4b2b.", refs = ["epics/E17-design.md §7.21"] },
{ va = 0x44D9E0, kind = "function", name = "video_redraw", size = 0x6E, confidence = "read", summary = "The playing clip's frame copied into its target again (BinkCopyToBuffer), decoded first (BinkDoFrame) while the clip is at its first frame (+0xC = 1); from video_redraw_any 0x597740. Each such decode counts in BINKW32's schedule: the result window's show does two before its first tick, its clip two frames late (E17 M5 T4b2b, CLT-Q31).", refs = ["epics/E17-design.md §7.21"] },
{ va = 0x44DA50, kind = "function", name = "video_rewind", size = 0x4D, confidence = "read", summary = "The playing start clip back to its first frame (BinkGoto 1), decoded and copied into its target; from 0x45F2F0 and 0x597900 (not read). E17 M5 T4b2b.", refs = ["epics/E17-design.md §7.21"] },
{ va = 0x44DAA0, kind = "function", name = "video_tick", size = 0x21A, confidence = "read", summary = "One tick of the dialog's Bink clip (from video_service 0x5976E0): the start's handle, else the loop's; nothing unless playing (0x694D5C) and BinkWait says a frame is due; BinkDoFrame, BinkCopyToBuffer into the target (0x44DB19); at the clip's last frame (+0xC = +8), with 0x694CD8 set: a start with a loop closed and the loop playing from the next tick (the entry's +9 0), else BinkNextFrame (the clip circles); without it BinkGetSummary and both closed; else BinkNextFrame; then video_show 0x5979D0 when 0x694CA8. E17 M5 T4b2b.", refs = ["epics/E17-design.md §7.21"] },

{ va = 0x4C6FE0, kind = "function", name = "next_player_turn", size = 0x947, confidence = "read", summary = "The next player's turn: steps 0x69CCA8 through the colours, skipping dead players and those whose human flag (+0xE2) differs (humans first, then computers); after the last calls the new day 0x4C7FE0 (site 0x4C71CC); then sets current and maximum movement points (0x4E4D90) of the new current player's heroes, its two tavern heroes and its towns' heroes. Read in the parts that decide these.", refs = ["rules/surveys/E08-adventure-core.md §1.1"] },
{ va = 0x4C7BA0, kind = "function", name = "cover_of_darkness_hide", size = 0xAC, confidence = "read", summary = "The new day's Cover of Darkness (E08 T34b): for each town (records of 0x168 bytes, game +0x21614 to +0x21618) of faction 4 (Necropolis, +4) with building 17 built (the town's +0x150 and +0x154 against building_bits +0x88 and +0x8C), calls hide_disk (0x49D3D0) at the town's tile (+5, +6, +7) for its owner (+1) with radius 20; returns whether one did. new_day calls reveal_owned only then.", args = "this = game", refs = ["rules/surveys/E08-hero-movement.md §4.2"] },
{ va = 0x4C7C50, kind = "function", name = "reveal_owned", size = 0x389, confidence = "inferred", summary = "Reveals around every owned hero (the 156 hero records from game +0x21620, owner byte +0x22, radius from hero_scouting_radius, through reveal_disk), then around other owned objects (not read). Called only after a hide (E08 T34b): by new_day when cover_of_darkness_hide (0x4C7BA0) hid tiles, by 0x4A14B0 after an object visit's hide, by 0x402450 after a hide of the whole map; so no new day reveals around the heroes as a rule. Read the hero loop only.", args = "this = game", refs = ["rules/surveys/E08-adventure-core.md §2", "rules/surveys/E08-hero-movement.md §4.2"] },
{ va = 0x4C7FE0, kind = "function", name = "new_day", size = 0x462, confidence = "read", summary = "The new day: increments the date's first word (game +0x1F63E); no hero's movement is set within two calls of it. E08 T34b: at 0x4C80CF to 0x4C80FD every hero record (156) clears flags +0x105 bits 0 and 17, sets +0x10E, +0x112 (the fly level), +0x116 (the water-walk level) and +0x129 to -1 and +0x10D to 0 (the day's spells end); then calls reveal_owned only when cover_of_darkness_hide (0x4C7BA0) returns true (0x4C8101 to 0x4C810C). The rest not read.", refs = ["rules/surveys/E08-adventure-core.md §1.1", "rules/surveys/E08-hero-movement.md §4.2"] },
{ va = 0x4C86A0, kind = "function", name = "starting_army_one_creature_caller", size = 0xD5, confidence = "inferred", summary = "Calls 0x4C9730 with the one-creature flag set; not read.", refs = ["rules/surveys/E08-adventure-core.md §3.1"] },

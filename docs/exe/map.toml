{ va = 0x4D8B30, kind = "function", name = "placed_hero_setup", size = 0x434, confidence = "read", summary = "Sets a hero up from its heroSetup record (structs.toml hero_setup; E08 T24a2a): owner, type, class, position, patrol; the custom name, portrait; custom primary skills copied unclamped (+0x32C, 0x4D8BF1); custom secondary skills cleared and learned (+0x22, 0x4D8C59); the custom army (+0x38, 0x4D8C6B); spells (+0x31C); the worn artifacts replaced and equipped, the backpack (+0x67); the biography; with a custom experience (+0x1A) the experience set to 0 (0x4D8E02) and hero_gain_experience(the record's +0x1C, give the levels, quiet) (0x4D8EA2), then hero_level_up (0x4D8EA9); a campaign case replaces the experience (campaign 8, scenario index 3; 0x4D8E19 to 0x4D8E99); last the spell points (Knowledge clamped to 1-99, the Intelligence getter's arithmetic inline, 0x4D8EAE to 0x4D8F38) and the movement points. Read in parts.", refs = ["rules/surveys/E08-progression.md §3.2"] },

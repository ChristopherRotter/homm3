{ va = 0x4BCDA0, kind = "function", name = "saved_game_load", size = 0xEC2, confidence = "inferred", summary = "Loads a saved game (H3SVG): among much else restores the game's +0x1F698 (mapKind) from the save's header (0x4BCE86) or, for old saves, a byte of the stream (0x4BD72C), and the Grail's position (+0x1F690).", refs = ["installation.md §7.27"] },
{ va = 0x4BFE70, kind = "function", name = "new_game_heroes", size = 0x6A8, confidence = "inferred", summary = "At a new game, per hero record: the experience random_between(0, 50) + 40 at +0x51 (0x4BFE94), the starting army (0x4C9730, flag clear), its movement points, the level-up seed random_between(1, 255) at +0x8F; sets the date's second word to 1 (0x4C00B1); each playing colour's starting resources (0x4C01EE: a human the row of the game's difficulty +0x1F6D8 from 0x678170, or 0x6779C8 when +0x1F69D is set; a computer its AI type random_between(0, 2) and the row from 0x6781FC); then the random objects (0x4C9DD0 at 0x4BFFF7) and the objects' setup (0x4C0CC0 at 0x4BFFFE). The new game's setup despite the name. Read in parts.", refs = ["rules/surveys/E08-adventure-core.md §3.1", "rules/surveys/E08-objects.md §3.4", "rules/surveys/E08-objects.md §7.2", "rules/surveys/E08-battles.md §6.2"] },
{ va = 0x4C0CC0, kind = "function", name = "setup_map_objects", size = 0x1668, confidence = "read", summary = "At a new game (from 0x4BFE70), walks every tile with an object's entrance (level, row, column) and fills each class's tile word (switch 0x4C0DAD). Read for campfires (0x4C0EE5: amount random_between(4, 6), then resource random_between(0, 5)) and resource piles (0x4C1AD1: an amount of 0, tested at 0x4C1AE4, becomes random_between(5, 10) for wood, ore and gold, random_between(3, 6) for the rest); the other cases not read.", refs = ["rules/surveys/E08-objects.md §3"] },

{ va = 0x4BB250, kind = "function", name = "create_boat", size = 0x1AA, confidence = "read", summary = "Creates a boat (args: x, y, level, owner, quiet, type): the first record not in use or a new one (-1 when 64 are in use, the wiki's limit); the tile, in use 1, its index (+0x19), type (+0x1A), facing 2, owner, no captain (+0x20 -1), aboard 0; put on its tile as class 8 (hero_show 0x4D75D0). Without the quiet flag a message first (0x482390, 0x49C900; not read). Callers: load_object_body case 8 (quiet), Summon Boat 0x41C8A0, the network 0x482010, the computer 0x430F80 (E08 T66a1).", refs = ["rules/surveys/E08-sea.md §2"] },

{ va = 0x4E5240, kind = "function", name = "hero_spell_cost", size = 0xEF, confidence = "read", summary = "The hero's spell cost: cost at mastery, +2 against Pegasi, -2 with Mages (armies, not stacks), at least 1; Titan's Lightning Bolt 0.", args = "hero, spell, enemy army, battlefield", h3api = "H3Hero::CalculateSpellCost", refs = ["installation.md §7.21"] },

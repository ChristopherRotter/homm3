{ va = 0x468990, kind = "function", name = "strike_animation", size = 0xA08, confidence = "read", summary = "Animates the stacks a strike, a shot or a spell touched, then casts the pending spells (H3API: ApplyAnimationToLastHitArmy). Per stack its group: a striker's (+0x0 set) its strike group +0x2, else death 5 (+0xEA), defend 4 (flag 0x8000000) or hit 3 (+0xE9); L = max(n, A, R, A + R - 1) iterations (0x468CBB to 0x468CF9), n the magic animation's frames, A the strikers' longest group, R the reactions' (a death's group 5, else the hit group 3, a defending stack's too); with no striker every reaction starts at once (0x468EBA; E17 M3 T7c-1). After the loop and the pending casts every stack not standing plays on (0x4691A9 to 0x469268): a frame a partial redraw at trunc(100 F), standing after its group (a death stays), until none changes; then the end below. A shot marks no striker (stack_shot sets none of the flags melee_strike sets at 0x441A87), so A is 0 and the reactions start as the projectile lands (E17 M2 T5b). Each iteration advances every animating stack (a reaction starts once the iterations left are at most its frames; a shooter still in groups 14-16 plays its group out: its count is the group's frames less one (0x468ABF) and each stack's frame advances before its draw, so it stands from the second iteration, E17 M2 T4b-1), draws, waits on the frame deadline with 100 ms (0x46906E: trunc(100 x the speed factor)) and shows; a reaction ends standing (group 2), a death stays on its last frame. Then each living stack's pending spell (+0xEC) is cast as a creature's cast at mastery 0, power 3 (0x469102), and cleared; then the dead (+0xEA) die (stack_death 0x4692C4), and every stack's +0x20, +0xE9 and +0x0 are cleared, its layer +0x8 set to 4 and its shown count +0x50 to -1 (0x469336 to 0x469379), and the whole battle redrawn and shown at once (battle_redraw 0x46938A, its first and fifth arguments; E17 M3 T5b, design §4.3).", h3api = "H3CombatManager::ApplyAnimationToLastHitArmy", refs = ["epics/E17-design.md §7.9", "installation.md §7.20", "epics/E17-design.md §7", "epics/E17-design.md §8.2"] },

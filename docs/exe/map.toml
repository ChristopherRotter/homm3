{ va = 0x5A5260, kind = "function", name = "ray_aim", size = 0x1DC, confidence = "read", summary = "A ray branch's aim (DrawRay's record of 0x78 bytes, E17 M3 T1b-1): unless it closes in (+0x44), the share p of the start's distance (+0x64) gone from the head's pixel (+0x2C, +0x30; 0 beyond it) as an f32 (+0x70); the thickness (+0x14) = the start's + trunc((end - start +-1) x p), at least 1, its span -(w >> 1) to that + w - 1 (+0x4C, +0x50); the angle atan2(dx, dy) to the target as an f32 (+0x38, crt_atan2); with a randomness range (+0x68, +0x6C) a random turn added (not used by creatures).", refs = ["epics/E17-design.md §7.12"] },
{ va = 0x5A5440, kind = "function", name = "ray_step", size = 0x64C, confidence = "read", summary = "A ray branch's tick (DrawRay): draws a random number 7-12 and drops it; then the given number of steps: the f32 head plus sin and cos of the f32 angle (crt_sin, crt_cos; stored as f32), kept to the battlefield 0-799 x 0-555; at every pixel newly entered a cross-section of the thickness down the column (+0x34) or along the row, each pixel coloured by its distance from the nearer edge from the colour's table (300-305: 0x68833C and on, by the screen masks 0x68C860; any other colour written as the pixel itself); then the city-block distance m to the target: within 15 it closes in (+0x44, least +0x48) and the branch ends (+0x40) when m <= 2 or m > least + 1.", refs = ["epics/E17-design.md §7.12"] },
{ va = 0x5A5A90, kind = "function", name = "ray_init", size = 0x183, confidence = "read", summary = "A ray branch's record (DrawRay): start and target kept to 0-799 x 0-555, the head at the start (f32 and pixel), thickness, colour, randomness, the start's distance (+0x64, crt_sqrt truncated); cross-sections down the column (+0x34) when |dx| > |dy| (colours 300 and 303: when the start lies on the left or right edge); then ray_aim.", refs = ["epics/E17-design.md §7.12"] },
{ va = 0x5A5C20, kind = "function", name = "draw_ray", size = 0x5C2, confidence = "read", summary = "H3API's DrawRay (E17 M3 T1b-1): a ray (called by chain_lightning at 0x5A64EF, its arguments not read, and by shot_animation at 0x43F5BE for a creature's shot) drawn straight into the back buffer: one branch record (ray_init) in a 3000-byte buffer; every tick each live branch steps (ray_step), the tick waits for its own deadline (clock + trunc(f32 delay x the speed factor), then on by max(delay, lateness); not the frame deadline) and shows the branches' bounding box (screen_show_rect), then the branches aim again (ray_aim); at the end the battle redrawn and shown at once without the deadline (battle_redraw 1, 0, 0, 0, 1, 0), and when the active stack has a climax frame (+0x150) the rest of its group from the frame shown on, each trunc(attack time / frames) on the deadline, the last drawn but not shown (0x5A6136 to 0x5A61C9).", args = "this = battle manager; show, start x, start y, target x, target y, branches, randomness range, start thickness, end thickness, colour, two randomness bounds, steps per tick, smoothness, path randomness, delay, 0", refs = ["epics/E17-design.md §7.12"] },

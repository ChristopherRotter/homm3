{ va = 0x59EC50, kind = "function", name = "enter_player_cast", size = 0xAA8, confidence = "read", summary = "A player's cast entered from the spell book, or for a Faerie Dragon's drawn spell from the F key (0x475CE3) and the stats dialog (0x468954): nothing once the acting side's hero has cast this round (0x59EC76); per-spell cursor modes (the area spells 0x59EF9B), the Magic Mirror redirect (0x59EE7A), dispatcher (0x59ECC4, byte table 0x59F6AC). E17 M5 T3b: the stack spells scan the inner hexes for a target first (none: GENRLTXT 186), a mass spell at the mastery is cast at once; the aim is the modal loop 0x602520 with 0x5A3070, the cursor called at the mouse's point first (its hex not kept); every end sets the combat cursor's frame 6 (0x59F65C); the action 1, or 10 with the second argument.", args = "spell, creature caster (1)", h3api = "H3CombatManager::LoadSpell", refs = ["installation.md §7.7", "installation.md §7.13", "installation.md §7.15", "installation.md §7.21", "epics/E17-design.md §7.18"] },

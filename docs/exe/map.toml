{ va = 0x4EC0E0, kind = "function", name = "input_key_message", size = 0x1AB, confidence = "read", summary = "Queues a key's input message from the window procedure's WM_KEYDOWN and WM_KEYUP (0x4F7ED7; E24 M2 T1a2), when the input manager runs: kind 1 down, 2 up; +4 the scan code (lParam bits 16 to 23: an extended key's without its flag); +0xC the modifiers from GetKeyState, Ctrl 4, Alt 0x20, Shift 1; into the 64 messages' ring (write index +0x83C; when it meets the read index +0x838 the read index moves on, 0x4EC1D9: the oldest dropped, 63 kept; E24 M2 T4b2). Every WM_KEYDOWN is queued, a repeat's too (its flag not looked at). F1 and F4 on the adventure screen (0x4EC23B, 0x4EC25D) not read.", refs = ["epics/E24-design.md §3.4"] },
{ va = 0x4EC290, kind = "function", name = "input_mouse_message", size = 0x1CC, confidence = "read", summary = "Queues a Windows mouse message as an input message (E17 M5 T4c1; read at its kinds, 0x4EC2E7 to 0x4EC374): WM_MOUSEMOVE 4, WM_LBUTTONDOWN and its double click 8 (SetCapture), WM_LBUTTONUP 0x10, WM_RBUTTONDOWN and its double click 0x20 (SetCapture), WM_RBUTTONUP 0x40 (ReleaseCapture after the ups); the point at +4 and +0x10.", refs = ["epics/E17-design.md §7.22"] },
{ va = 0x4EC570, kind = "function", name = "input_flush", size = 0x18, confidence = "read", summary = "Empties the input queue (this = the input manager 0x6994E0): Windows' pending messages dispatched into it (pump_messages 0x4F7FB0), then its read and write indices (+0x838, +0x83C) 0; battle_controls_state calls it at every stack's turn start outside Auto Combat and a remote turn (0x478301), so input made during an action or a computer's turn is dropped (E17 M5 T2a); a path's walk on the map calls it at its start, after mouse_hide (hero_move_loop 0x407E87: the messages behind its click gone; E24 M2 T6a, the reviewer's R1-5).", args = "this = input manager", refs = ["epics/E17-design.md §9.11", "epics/E24-design.md §3.7"] },
{ va = 0x4EC590, kind = "function", name = "input_next_message", size = 0xAE, confidence = "read", summary = "The input manager's next message (this = the input manager, 0x6994E0; E24 M2 T1a1): runs the tick 0x4ED490 first, then copies the oldest of its 64 queued 32-byte messages (+0x38, read index +0x838, write index +0x83C; H3API's H3InputManager `messages`) into the caller's, a key first through 0x4EC6F0, or, the queue empty, an idle message (type 0).", args = "this = input manager; out message (32 bytes)", returns = "the out message", refs = ["epics/E24-design.md §3.1"] },
{ va = 0x4ECC00, kind = "function", name = "input_post_mouse_move", size = 0xCA, confidence = "read", summary = "Posts a mouse move at the cursor's position, with the Ctrl, Alt and Shift keys' state, into the input queue (+0x38, 64 entries of 0x20; +0x840 a guard while it posts, E17 M5 T2a) (E17 M3 T6b): battle_controls_state calls it at a human player's turn start (0x478857), so the battle's mouse handler sets the cursor and the status line for wherever the mouse rests.", args = "this = the input manager (0x6994E0)", refs = ["epics/E17-design.md §9.8", "epics/E17-design.md §9.11"] },

[[rule]]
id       = "HER-BAT-004"
title    = "The battle hero's damage bonuses"
context  = "heroes"
status   = "verified"
summary  = "The battle hero's damage bonuses (BattleHero.damage: ranged, melee, reduction, each a Rate) are the sums of the ranged_damage, melee_damage and damage_reduction effects of the hero's effect sources (HER-BAT-001): its secondary skills at their levels (Archery 10/25/50 %, Offense 10/20/30 %, Armorer 5/10/15 %), its worn artifacts and their combinations' parts, each artifact type once (the Archery artifacts +5/+10/+15 % count only with Archery, needs_skill), and its specialty's own. A skill specialty (skill_specialty) grows only that skill's values, by bp_per_level basis points of the value per hero level, rounded down (Orrin at level 10 with Expert Archery: 50 % * (1 + 0.05 * 10) = 75 %); artifacts do not grow. Sums saturate at u16::MAX; the reduction is at most 10 000 (100 %). The battle applies them (BAT-HER-004). Under quirk Q-0005 each rate also carries the single-precision value the original computes (OPEN-QUESTIONS Q45, option (b), E04b T3c): a skill's value grown as f32(r × (f32(level) × f32(0.05) + 1)) in x87 arithmetic (installation.md §7.4), then each artifact's f32 value added and the sum stored as f32, in the order of the artifact types as the original's getters add them; only where it differs from the single-precision value of the basis points (an Archery specialist at level 1 with the Bow of Elven Cherrywood and Angel Feather Arrows: one unit above f32(0.355))."
numeric  = "integer"


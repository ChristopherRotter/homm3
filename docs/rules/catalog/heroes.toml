[[rule]]
id       = "HER-SPL-003"
title    = "Mastery of a spell"
context  = "heroes"
status   = "implemented"
summary  = "A hero's mastery of a spell (h3_heroes::spell_masteries, for every spell above none; the one derivation for the adventure map and the battle, BAT-Q19) is the best level of its `school_mastery` effects among the spell's schools (the magic school skills: 1 Basic, 2 Advanced, 3 Expert), raised by a `spell_mastery` effect for the spell (Armageddon's Blade: Armageddon at Expert), at most Expert. It is the mastery on ordinary ground; a battlefield that raises it (Magic Plains, the elemental battlefields) is the battle's (E04c). No specialty or other artifact changes it. The list covers spells the hero does not have too: the original asks the hero for any spell's mastery (Sacrifice's test asks for Resurrection's, BAT-QUIRK-5)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (docs/formats/installation.md 7.22): 0x4E5080 returns Expert for Armageddon while the hero wears Armageddon's Blade (its positions, then a combination holding it), else 0x4E5100: Expert on battlefield 1 or a matching elemental battlefield, else the best of the Air, Fire, Earth and Water Magic levels among the spell's school bits"
  confidence = "high"


[[rule]]
id       = "HER-BAT-003"
title    = "The battle hero's morale and luck effects"
context  = "heroes"
status   = "implemented"
summary  = "The battle hero's morale and luck effects (BattleHero.effects: Morale, Luck, MoraleAtMost, LuckAtMost) come from the hero's effect sources (HER-BAT-001): its secondary skills at their levels (Leadership and Luck +1/+2/+3 for its own stacks), its worn artifacts and their combinations' parts, and its specialty. Unlike primary skills, an artifact type counts once however many copies are worn (two Clovers of Fortune: luck +1), also when it is both worn and part of a worn combination. Per kind and affected sides (own, enemy, both) the changes are summed (saturated to -128..127; a sum of 0 is left out) and the caps combine to the smallest; at most 12 effects, in the order morale, luck, morale cap, luck cap, each for own, enemy, both. The battle clamps morale and luck (BAT-HER-003). A skill specialty does not scale them (no original hero specializes in Leadership or Luck). Angelic Alliance's alignment group is E04a T10."

summary  = "The battle hero's Regeneration, NoRangePenalty and ShootWhenAdjacent effects come from the regeneration, no_range_penalty and shoot_when_adjacent effects of the hero's effect sources (HER-BAT-001), each worn artifact type once (also inside a combination): one effect per kind and creatures, a regeneration with the most hit points, in the order of their first appearance after the stack statistics (HER-BAT-008), all within MAX_BATTLE_EFFECTS. The Golden Bow and the Bow of the Sharpshooter (no range penalty for shooters, the Bow also shooting while adjacent) and the Elixir of Life (regeneration of 50 for living creatures) are the original's sources. The battle applies them (BAT-HER-006)."

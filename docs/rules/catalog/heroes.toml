[[rule]]
id       = "HER-SPL-002"
title    = "Available spells"
context  = "heroes"
status   = "implemented"
summary  = "A hero has, in spell order and each once (h3_heroes::available_spells, the one derivation for the adventure map and the battle, BAT-Q19): its learned spells (HER-SPL-001), the spell of every worn scroll (HER-ART-003) and the spells of its worn artifacts' `spells` effects (a combination with its parts, each artifact type once): `school` every spell of the school, `level` every spell of the level, both without the creature abilities and the spells marked `granted_by_name_only`, and `spell` the named spell. Artifacts in the backpack give nothing. In the packs: the Tomes their school, Spellbinder's Hat level 5, Armageddon's Blade Armageddon, the Sea Captain's Hat Summon Boat and Scuttle Boat, Titan's Thunder Titan's Lightning Bolt, which no grant by school or level gives (spell flag 0x2000). Having a spell is not casting it: that needs a worn spell book (HER-BAT-011)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (docs/formats/installation.md 7.22): 0x4D95D0 writes the available spells (+0x430) from the learned ones (+0x3EA), a worn Spell Scroll's spell and the sets 0x4D9350 of the worn artifacts of the list 0x63B998 and of such parts of worn combinations (the backpack is not read); every set but Titan's Thunder's clears spell 57 (0x4D9532); the adventure map and the battle read +0x430"
  confidence = "high"

[[rule]]
id       = "HER-SPL-003"
title    = "Mastery of a spell"
context  = "heroes"
status   = "implemented"
summary  = "A hero's mastery of a spell (h3_heroes::spell_masteries, for every spell above none; the one derivation for the adventure map and the battle, BAT-Q19) is the best level of its `school_mastery` effects among the spell's schools (the magic school skills: 1 Basic, 2 Advanced, 3 Expert), raised by a `spell_mastery` effect for the spell (Armageddon's Blade: Armageddon at Expert), at most Expert. It is the mastery on ordinary ground; a battlefield that raises it (Magic Plains, the elemental battlefields) is the battle's (BAT-TER-005). No specialty or other artifact changes it. The list covers spells the hero does not have too: the original asks the hero for any spell's mastery (Sacrifice's test asks for Resurrection's, BAT-QUIRK-5)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (docs/formats/installation.md 7.22): 0x4E5080 returns Expert for Armageddon while the hero wears Armageddon's Blade (its positions, then a combination holding it), else 0x4E5100: Expert on battlefield 1 or a matching elemental battlefield, else the best of the Air, Fire, Earth and Water Magic levels among the spell's school bits"
  confidence = "high"


# Rule catalog: battle context. Format: docs/04-rules-and-sources.md §3.
#
# E01 (walking skeleton) implemented a deliberately small subset; E03 completes the RoE battle
# rules. Remaining simplifications are stated in each summary under "Scope".
# Wiki pages were read on 2026-09-30 (E01) and 2026-10-01 (E03); VCMI references are to tag 1.7.5
# (commit 6901839ae976).

[[rule]]
id       = "BAT-GEO-001"
title    = "Battlefield hex layout, neighbours and distance"
context  = "battle"
status   = "implemented"
summary  = "The field is width x height hexes (original: 17 x 11 with one non-standable side column on each edge, i.e. 15 x 11 playable), hex = x + width*y. Even rows (0-based) are shifted half a hex right: left/right neighbours are (x-1,y)/(x+1,y); on even rows the upper/lower neighbours are x and x+1, on odd rows x-1 and x. Distance: with X = x + floor(y/2), dX = X2-X1, dY = y2-y1, distance = max(|dX|,|dY|) if dX and dY have the same sign, else |dX|+|dY|. Footprints of two-hex stacks: BAT-GEO-002; obstacles: BAT-GEO-003. A town's walls: BAT-SIE-002."
numeric  = "integer"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Combat - Heroes 3 wiki: 'the battlefield, that is 11 rows of 15 hexagonal frames (hexes)'"
  url        = "https://heroes.thelazy.net/index.php/Combat"
  retrieved  = "2026-09-30"
  confidence = "high"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "lib/battle/BattleHex.h: 17x11 grid (id = x + 17*y), moveInDirection, getDistance"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/battle/BattleHex.h"
  retrieved  = "2026-09-30"
  confidence = "high"
  note       = "Internal 17-column layout and siege hex ids match the original numbering (medium-high that the layout is the original's)."

[[rule]]
id       = "BAT-GEO-002"
title    = "Footprints of one- and two-hex stacks"
context  = "battle"
status   = "implemented"
summary  = "A stack's position is a hex. A stack of a creature with flag two_hex also covers its other hex, in front of its position in the same row: the right neighbour for the attacker, the left neighbour for the defender (stacks face the enemy and never turn). So a two-hex stack's position is its rear hex and its other hex its front hex, as in the original (the user, 2026-10-13: the engine follows the executable, where VCMI names the front hex, its head); a one-hex stack's front hex is its position. A footprint is valid only if both hexes are on the field. Two footprints touch when they do not overlap and some hex of one neighbours some hex of the other; their distance is the smallest hex distance between them."
numeric  = "integer"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "lib/battle/Unit.cpp occupiedHex (attacker: position - 1, defender: position + 1; VCMI's position is the front hex), coversPos, getHexes"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/battle/Unit.cpp"
  retrieved  = "2026-10-01"
  confidence = "high"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe static creature table, flag 0x1 (two-hex), harvested as `two_hex` (docs/formats/installation.md §5)"
  confidence = "high"

  [[rule.source]]
  kind       = "original-data"

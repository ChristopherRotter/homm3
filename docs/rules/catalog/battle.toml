[[rule]]
id       = "BAT-DMG-003"
title    = "Applying damage to a stack"
context  = "battle"
status   = "implemented"
summary  = "Damage goes into the top creature first. With total = (count - 1) * max_hp + top_hp: if damage >= total the stack dies (excess is lost); otherwise remaining = total - damage, count = ceil(remaining / max_hp), top_hp = remaining - (count - 1) * max_hp. Kills = old count - new count."
numeric  = "integer"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Health - Heroes 3 wiki (pikemen example: 10 HP each, 25 damage kills 2 and leaves the top pikeman at 5 HP)"

[[rule]]
id       = "BAT-TRN-002"
title    = "Wait"
context  = "battle"
status   = "implemented"
summary  = "Wait postpones the active stack's turn to a wait phase after the normal phase: the morale-and-wait phase for stacks that waited during a good-morale turn (BAT-MOR-003), then the wait phase for the others. In both, stacks act in ascending speed, with the same tie rules as BAT-TRN-001. A stack cannot wait twice in a round; it may defend after waiting. Waiting counts as the side's chance to act for tie-breaking."

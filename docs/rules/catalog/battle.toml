[[rule]]
id       = "BAT-MAG-010"
title    = "How long a timed effect lasts"
context  = "battle"
status   = "verified"
summary  = "A hero's timed spell lasts its power plus its duration bonus (HER-BAT-014: the Conjuring artifacts, the Ring of the Magi), at least 1 round, counting the round of the cast; a permanent spell (Disrupting Ray) lasts the rest of the battle (not allowed for a change that takes a stack's turns, BAT-MAG-024). At the start of every round each effect on a living stack either ends (its last round has passed) or loses a round: an effect cast in round n with duration d is active in rounds n to n + d − 1. An ending effect gives back what it changed (the attack Weakness took; Stone Skin's, Prayer's and Haste's additions, so a defense Disrupting Ray pushed to 0 can fall below 0) and is reported (EffectEnded). A stack that dies loses its timed effects (without events) and keeps its permanent ones (Disrupting Ray: the original's death routine 0x444120 ends each spell through 0x444510, which returns at once for it; Acid Breath, BAT-MAG-046, lowers the defense directly): they stay in the effect list and in the dead stack's values, and a stack that is raised (BAT-MAG-035, BAT-MAG-036, BAT-MAG-051) or reborn (BAT-MAG-059) comes back with them. A record reused for a newly created stack starts without any effect (BAT-MAG-037). The minimum of 1 round is the engine's: the original's heroes have at least 1 power. Effects counted by their stack's own turns (Frenzy, EffectDuration::OwnTurn, BAT-MAG-019) are skipped at the round start."

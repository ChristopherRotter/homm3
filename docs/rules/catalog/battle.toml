[[rule]]
id       = "BAT-DMG-002"
title    = "Attack/defense modifier and final rounding"
context  = "battle"
status   = "verified"
summary  = "Damage = base * (1 + sum of bonuses) * product of (1 - reduction), rounded down once at the end, at least 1. Attack/defense: if attack A > defense D, a bonus of min(0.05 * (A - D), 3.00); else a reduction of min(0.025 * (D - A), 0.70). The attack bonus is capped at +300 % (at most 4x base damage, reached at 60 points), per user decision 2026-09-30 (OPEN-QUESTIONS Q11). Other bonuses (luck, jousting, hate, death blow) add to the bonus sum; other reductions (ranged/melee penalty, ...) multiply. Rates and caps are ruleset parameters (percent / per mille). Computed exactly in integers with one final floor (a wide product, h3_kernel::arith::WideUint). Quirk Q-0005 (quirk.battle.single_precision_rates, on in faithful; observed, Q23, batch 1a): every rate and cap of a damage factor enters as its single-precision value (round to nearest; 0.05 = 13421773/2^28, 0.025 = 13421773/2^29, 0.70 = 11744051/2^24; binary fractions such as 0.5 and 1 unchanged), as an exact dyadic fraction (h3_kernel::arith::single_precision), counts multiply it exactly (22 points: 22 * 13421773/2^28), so a result can be one lower or stay exact where decimal rates give an integer. Applies to the attack and defense rates and caps, jousting, hate, luck, death blow and the shooter penalties (and E04a T6b's skill rates); strict-fixed uses the exact decimal rates."
quirks   = ["Q-0005"]
numeric  = "integer"


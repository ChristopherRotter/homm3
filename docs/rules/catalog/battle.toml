[[rule]]
id       = "BAT-ATK-001"
title    = "Melee attack"
context  = "battle"
status   = "implemented"
summary  = "A melee attack names an enemy stack and a hex adjacent to it: the attacker's own hex, or a hex it can walk to this turn (BAT-MOV-001). The attacker moves there, then strikes (BAT-DMG-001..003); the strike costs no movement. Then the target may retaliate (BAT-RET-001). Skeleton scope: no ranged attacks, double attacks or attack-direction effects."

[[rule]]
id       = "BAT-MAG-051"
title    = "A stack raiser's raise (Archangel)"
context  = "battle"
status   = "implemented"
summary  = "A stack whose creature has stack_raiser (spell, hit_points_per_creature) may, as its action while it has casts left (CreatureCast, BAT-MAG-048; the command and the sim's spell head name no spell, CastSpell::Raise, ADR-0014 point 9), raise another stack of its controller's side (never itself: the original's cursor), living or a corpse on top of its hexes, under the raise spell's test (BAT-MAG-035: of the side, fewer creatures than at the start, the spell's conditions, level and immunities, Anti-Magic on a living stack, and the hit points must reach one creature's health) with hit_points_per_creature × its creatures hit points and no caster's bonuses; the raise is for good (no creatures for the battle only), a dead stack coming back on its hexes. CreatureRaise then SpellRaised report it; one of its casts is used and its turn ends as after an action (good morale may follow). The Archangel: Resurrection's test, 100 per creature, once a battle. Not yet: Cursed Ground, the anti-magic garrison and the Orb of Inhibition forbid it (E04c, T8)."
numeric  = "integer"


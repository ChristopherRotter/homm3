[[rule]]
id       = "BAT-GEO-003"
title    = "Obstacles"
context  = "battle"
status   = "implemented"
summary  = "The battle setup lists the hexes blocked by obstacles (each once, all standable hexes of the field; anything else is a setup error). No stack can stand on an obstacle hex: walkers cannot pass them (BAT-MOV-001), flyers and teleporters pass over them but cannot land on them (BAT-MOV-002), and placement avoids them (BAT-SET-001). Obstacles are public information. Scope: obstacles do not affect shooting (only siege walls do, later). Which hexes are blocked is decided before the battle, e.g. by BAT-GEO-004."
numeric  = "integer"


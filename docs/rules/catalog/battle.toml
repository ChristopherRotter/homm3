[[rule]]
id       = "BAT-DMG-002"
title    = "Attack/defense modifier and final rounding"
context  = "battle"
status   = "implemented"
summary  = "Damage = base * (1 + sum of bonuses) * product of (1 - reduction), rounded down once at the end, at least 1. Attack/defense: if attack A > defense D, a bonus of min(0.05 * (A - D), 3.00); else a reduction of min(0.025 * (D - A), 0.70). The attack bonus is capped at +300 % (at most 4x base damage, reached at 60 points), per user decision 2026-09-30 (OPEN-QUESTIONS Q11). Other bonuses (luck, jousting, hate, death blow) add to the bonus sum; other reductions (ranged/melee penalty, ...) multiply. Rates and caps are ruleset parameters (percent / per mille). Computed exactly in integers: floor(base * (100 + bonus%) * prod(1000 - reduction permille) / (100 * 1000^n)). The original likely uses floating point (see the Armorer quirk on the wiki), so exact results may differ by 1 in rare edge cases; open question Q23 with a prepared experiment."
numeric  = "integer"


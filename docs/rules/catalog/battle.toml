summary  = "The automatic Ballista (BAT-WAR-002) shoots the stack the original's computer picks for a shooter (0x41F060, 0x41EB80): among the living stacks of the side its controller fights, whoever controls them (BAT-MAG-026: a stack of that side its own side hypnotized is one, its own side's hypnotized stack is none), but the turrets, a stack that keeps its turns (not blind, petrified or paralysed) before one that loses them, then the highest value, ties to the later stack; no preference for creatures over war machines. The value (0x435CB0, 0x435B90): the kills of the computer's damage estimate times the worth of one of the target's creatures with the shot flag (BAT-SIE-021; BAT-SIE-020's kill value: the top creature's lost hit points counted when the damage finishes it, a clone count x worth / 5), in desperate mode 1000 per creature (BAT-SIE-023, the Ballista's side's; chosen again without it when the best value is 0); whole on Easy (BattleSetup.difficulty 0) for a computer side, else divided by 10 for a stack that loses its turns, by 5 for a First Aid Tent or Ammo Cart, a stack without a target or more than 5 turns away (BAT-SIE-022), else by its turns; integers, truncated. The estimate (0x4359B0, 0x442780): the shooter's creatures from its total hit points (rounded up) times one creature's damage as the original's stack record holds it, a double (the maximum and Bless's bonus while blessed, max(1, minimum less Curse's penalty) while cursed, else (min + max) / 2.0; for a war machine its creature's own damage: the original multiplies the Ballista's 2..3 by its hero's attack + 1 only in a strike's base damage, BAT-WAR-005, so one Ballista's estimate starts from 2 whatever its hero's attack, which still counts in its attack), truncated, through every stage of a real shot without luck, death blow or double damage (BAT-DMG rules, the hero's Archery, the wall and distance halves, the protections); at least 1, doubled for a creature that strikes twice, at most the target's total hit points (1 for a clone). The shot is aimed at the target's position. Its numbers are the original's x87 arithmetic in every profile: they decide a choice, not an amount. It reads the other side's private facts as the turret's aim does (BAT-SIE-020; kept as the original, BAT-Q50 (5))."

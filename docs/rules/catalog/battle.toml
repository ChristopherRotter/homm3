[[rule]]
id       = "BAT-END-003"
title    = "The outcome of a battle"
context  = "battle"
status   = "implemented"
summary  = "Once the battle is over, BattleState::outcome reports facts for the orchestrator (ADR-0013 point 5): the result (victory, draw, retreat, surrender; BAT-END-001/002, BAT-FLE-001/002); per side every stack in stack order (army stacks, war machines, then the stacks created in the battle, in their slots' order), dead ones included, as StackRecord { origin: army slot, war machine or created (summoned stacks and clones, BAT-MAG-037, and an army stack Clone turned into one, BAT-QUIRK-7; E04b T6c, BAT-Q7, BAT-Q13), creature, start: the count when it entered the battle (at the start, or when created), end: the count at the end, whatever the result, without the creatures raised for the battle only (Basic Resurrection, BAT-MAG-035; E04b T6a), but a side whose living army creatures are all such keeps one in its last living army stack (BAT-QUIRK-6); a created stack that vanished when its rounds ran out keeps the creatures it vanished with, which were not killed (0x444120 keeps its count), while a clone killed by damage or with its original has lost them all }; a killed created stack's slot that a later created stack reused reports only that one, as the original's records (its earlier stack's losses are gone, BAT-QUIRK-11); a created stack that vanished at the end of its rounds keeps its slot and is always reported; the survivors (army stacks and stacks raised from corpses with end > 0, by slot; a Pit Lord's Demons are reported as StackOrigin::Raised(slot) in the slot of the dead stack they rose from, BAT-MAG-052) and surviving war machines derived from those records; the surrender's cost (the price paid, BAT-FLE-002) or none; per side the hero's mana left (E04b T2b) and the spells its Eagle Eye picked, by spell handle, each once (BAT-MAG-069; E04b T8d, which replaced the distinct spells cast); the last round started (0 if the battle ended in the tactics phase). The battle applies no consequence: casualties, a retreating side's lost army, the payment, captured artifacts, experience (killed war machines give none; Learning multiplies the whole sum including the +500, batch 1b R5; +500 more for the attacker in a battle at a town, any fort level, and 500 less after a retreat or a surrender: the original's 0x46A350, installation.md §7.32, which the orchestrator reads from the setup's siege) and Necromancy (rounded down per killed stack, R6; per record, start - end, created stacks included, which the experience leaves out: 0x4775E1, 0x46A350, batch 2d NE) are applied by the orchestrator with the epics that own hero progression (E08-E10). A side whose opponent retreated or surrendered but which has no army survivors has lost as well (the original names no winner, BAT-END-001), and still receives a surrender's price."

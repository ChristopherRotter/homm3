[[rule]]
id       = "BAT-MAG-037"
title    = "Stacks created in battle"
context  = "battle"
status   = "verified"
summary  = "Clone (BAT-MAG-038) and Summon Elemental (BAT-MAG-039) create stacks of the caster's side, legal only while the side has fewer stacks than the battle parameter side_stack_limit (20 in the original; at most 21, the engine's slots per side), dead ones included. A created stack takes the slot of its side's first (lowest id) killed created stack (dead with no creatures left: killed by damage, or a clone that died with its original), else a new id after every existing one; a created stack that vanished when its rounds ran out (a clone, BAT-MAG-038; an original turned into one, BAT-QUIRK-7) keeps its creatures (BAT-END-003) and with them its slot: no later stack takes it, and it still counts towards side_stack_limit; it starts as a stack of its side at the battle's start would (the side's hero's attack, defense and stack effects, the native terrain, morale and luck) and without any effect of the dead stack whose slot it takes (a dead stack keeps its permanent effects, BAT-MAG-010; the original sets a reused record up from scratch, 0x47A100), with Stack::slot CREATED_SLOT (after army slots and war machines in BAT-TRN-001's tie-break) and the trait SUMMONED, and without the round's flags, so it acts in the round it appears if its turn comes (StackCreated). Created stacks leave no corpse (BattleState::corpse NO_CORPSE: never raised, BAT-MAG-035), are no victim of a sacrifice (BAT-MAG-036), count as living for the end of the battle, but a side whose living stacks are all created does not win (both lose: Draw, BAT-END-001), and the outcome reports them with origin Created, out of the survivors (BAT-END-003; ADR-0014 point 6, BAT-Q7, BAT-Q13). Not modelled: the original's message when no hex is free (nothing happens; the mana is spent)."

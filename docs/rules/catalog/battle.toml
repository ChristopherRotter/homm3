[[rule]]
id       = "BAT-TRN-001"
title    = "Turn order within a round"
context  = "battle"
status   = "implemented"
summary  = "In the normal phase living stacks that have not acted or waited act in descending speed. Speed ties: the stack of the side that did not act last goes first (the attacker at the start of the battle; the rule carries across rounds), then the lower army slot. The order is re-evaluated before every activation. Good morale gives the stack that just acted another turn outside this order (BAT-MOR-003). War machines take their turns in this order too (speed 0, so last in the normal phase; BAT-WAR-002/003), as in VCMI. Scope: no siege phases (E04), speed never changes during a round."
numeric  = "integer"


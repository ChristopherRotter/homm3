[[rule]]
id       = "BAT-SET-001"
title    = "Initial placement of armies"
context  = "battle"
status   = "implemented"
summary  = "Stacks of each army are taken in slot order; the desired hex of the i-th stack of an army with n stacks is row formation[n-1][i] (ruleset data) in the first standable column (attacker) or the last (defender). Each stack, in id order, takes the head hex closest to its desired hex where its whole footprint (BAT-GEO-002) is standable and not blocked by obstacles or stacks placed before it; ties go to the column nearer the centre, then the row nearer the desired one, then the lower hex index. So a two-hex stack's tail stands in the edge column and its head one column further in. No such hex: setup error. Stack ids: attacker stacks first, then defender stacks, each in slot order. Scope: tight formation and tactics are later tasks (E03 T9, E04)."
numeric  = "integer"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "lib/battle/BattleInfo.cpp setupBattle (layout positions per army size), lib/battle/CBattleInfoCallback.cpp getAvailableHex, lib/battle/BattleHex.cpp getClosestTile (closest accessible hex, column nearer the centre, then nearer row)"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/battle/CBattleInfoCallback.cpp"
  retrieved  = "2026-10-01"
  confidence = "medium"
  note       = "The harvested base pack carries VCMI's loose layout (E02 gap-fill). The final hex-index tie-break is ours (VCMI keeps the first hex of its ordered set, i.e. also the lowest index)."


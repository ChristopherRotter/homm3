status   = "implemented"
summary  = "A timed spell (SpellEffect::Timed) that takes effect on a living stack first ends the effects of the spells it counters (Spell.counters: Bless and Curse, Haste and Slow end each other; Bloodlust and Weakness, Mirth and Sorrow, Fortune and Misfortune do not and add up). If its own effect is already on the stack, the effect keeps its value and takes the longer of the two durations; a cumulative spell (Disrupting Ray) instead applies its changes again. Otherwise a new entry joins the battle's effect list with v = effect[mastery] and the changes made now: speed + v (never on a war machine; Haste, Prayer), attack + v (Prayer), defense + v (Stone Skin, Prayer), attack_loss takes min(v, the attack now) (Weakness; the attack now without Bloodlust and Precision, even below 0), defense_loss sets the defense now to max(0, defense − v) (Disrupting Ray). The other changes are read while the effect lasts (BAT-MAG-011). Events: EffectApplied with the rounds left, EffectEnded for each countered effect. The effect list and the stacks' values are public and part of the state hash."

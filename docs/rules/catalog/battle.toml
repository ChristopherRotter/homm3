  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/battle/DamageCalculator.cpp"
  retrieved  = "2026-09-30"
  confidence = "medium"
  note       = "VCMI caps the attack bonus at +400% (80 points) instead of +300%. Not followed: the user decided for +300% (Q11)."

[[rule]]
id       = "BAT-DMG-003"
title    = "Applying damage to a stack"
context  = "battle"
status   = "implemented"
summary  = "Damage goes into the top creature first. With total = (count - 1) * max_hp + top_hp: if damage >= total the stack dies (excess is lost); otherwise remaining = total - damage, count = ceil(remaining / max_hp), top_hp = remaining - (count - 1) * max_hp. Kills = old count - new count."
numeric  = "integer"


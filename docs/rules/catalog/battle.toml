[[rule]]
id       = "BAT-END-001"
title    = "End of battle"
context  = "battle"
status   = "implemented"
summary  = "After every action (a whole melee sequence with retaliation and second attack, or a whole shot sequence; as VCMI checks after each action), if one side has no living stacks the battle ends and the other side wins (BattleResult::Victory); no stack is active afterwards and every command is rejected. War machines do not count as living stacks (BAT-WAR-001). The outcome lists the result, the surviving army stacks per side and, separately, the surviving war machines. If neither side has living stacks left the battle is a draw (BAT-END-002). Stacks created in battle (summoned stacks, clones) count as living, but a side whose living stacks are all created ones does not win: the battle is then a draw, both sides lose (BAT-MAG-037; the original's 0x4658B0, installation.md §7.19). Retreat and surrender: BAT-FLE-001/002; against a side left with only created stacks the original names no winner either (batch 2d SU): the result still names the side that left, and that side's opponent, with no army survivors in the outcome (BAT-END-003), has lost as well (BAT-Q7, the user 2026-10-08: no contract change)."

[[rule]]
id       = "BAT-HER-001"
title    = "The heroes leading the sides"
context  = "battle"
status   = "implemented"
summary  = "Each side may be led by a hero (BattleSetup.heroes, a BattleHero derived before the seam or given directly by a scenario; ADR-0013). The battle takes the hero as given and checks only what its rules need to run soundly (OPEN-QUESTIONS Q31): the hero type, every creature, faction, spell and spell school an effect names and every spell of the spell book are in the ruleset; the spell book lists each spell once and no creature ability; at most MAX_BATTLE_EFFECTS (64) effects and at most MAX_SPELL_BONUSES (4) spells with bonuses of their own; Tactics and school levels at most 3, and no mastery for a school the ruleset lacks; damage reduction, surrender discount and a commanded Ballista's double-damage chance at most 10 000 basis points, and a commanded Ballista has at least one shot. Values no real hero could have (attack 255) are accepted. Otherwise the battle does not start (SetupError::InvalidHero). The battle keeps the hero type, the primary skills, the Tactics level, mana and maximum mana, the damage bonuses (BAT-HER-004) the control of the Ballista and the First Aid Tent (BAT-WAR-006/007) and its magic (spell book, masteries, spell bonuses; BAT-MAG-001 to BAT-MAG-004); both sides see the hero type, primary skills, mana, its casts this round and which war machines it commands (ADR-0013 point 9, ADR-0014 point 8; HeroView), and only its own side sees its Tactics level, damage bonuses, how its war machines work, its surrender discount, its funds and its surrender price, its spell book, masteries and spell bonuses (Observation.own_hero, E04a T11a, E04b T2b). A side with a hero is 'led by a hero' (quirk Q-0003, BAT-LCK-002). The hero's values take effect with the rules that read them (E04a T5-T10, E04b)."
numeric  = "integer"


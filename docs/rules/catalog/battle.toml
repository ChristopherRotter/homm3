[[rule]]
id       = "BAT-GEO-004"
title    = "Random obstacles"
context  = "battle"
status   = "implemented"
summary  = "Before a battle on a terrain, its obstacles are generated (the caller puts the hexes into the setup, BAT-GEO-003): pick 5..=12 hexes to block; with 40 % chance place one absolute obstacle of the terrain (fixed hexes; it counts half its hex count); then, while hexes remain to be blocked, choose a usual obstacle of the terrain uniformly and an allowed anchor uniformly, block its hexes and subtract their count; stop when the terrain has no usual obstacle or the chosen one has no allowed anchor. An anchor (the obstacle's bottom-left hex) lies in rows 1..=height-2 (row height-2 only up to column width-2), needs more rows above it than the obstacle's height, column >= 1 and column + width <= field width - 2, and must not be blocked; every blocked hex (dx, dy from the anchor; from an odd row, hexes in even rows shift one column left) must be on the field, free, and in columns 3..=field width - 4, so the two columns next to each army's starting column stay free. Obstacle types (terrains, width, height, blocked hexes, absolute flag) are content. Random numbers come from the caller's stream (OBSTACLES in the tools); the original seeds this from the map tile. Scope: special battlefields (magic terrains, coast, ship) and their obstacles are E04; sieges have no random obstacles."
numeric  = "integer"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "lib/battle/BattleInfo.cpp setupBattle 'randomize obstacles' (tilesToBlock rand(5,12), 40 % absolute obstacle counting half, RangeGenerator over obstacles and positions 18..168, validPosition), lib/ObstacleHandler.cpp getBlocked (odd-row shift) and isAppropriate"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/battle/BattleInfo.cpp"
  retrieved  = "2026-10-01"
  confidence = "high"
  note       = "Ported with our RNG: VCMI reproduces the original's tile-seeded generator (MSVC rand); choosing uniformly among valid candidates has the same distribution as VCMI's draw-without-replacement."

  [[rule.source]]
  kind       = "vcmi"
  ref        = "config/obstacles.json: obstacle shapes and terrains (imported via crates/h3-harvest/data/gapfill.toml)"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/config/obstacles.json"
  retrieved  = "2026-10-01"
  confidence = "medium"
  note       = "The original keeps this table in the executable; not harvested from it yet (no layout known)."

[[rule]]
id       = "BAT-SET-001"
title    = "Initial placement of armies"
context  = "battle"
status   = "implemented"
summary  = "Each side arranges its army in its formation from the setup (BattleSetup.formations: loose by default, or tight; Q25). Stacks of each army are taken in slot order; the desired hex of the i-th stack of an army with n stacks is row F[n-1][i] of the formation's table (ruleset data: loose_formation spreads the stacks from top to bottom, e.g. rows 2, 5, 8 for three stacks; tight_formation clusters them around the middle row, e.g. 4, 5, 6; the tables coincide for six and seven stacks) in the first standable column (attacker) or the last (defender). Each stack, in id order, takes the head hex closest to its desired hex where its whole footprint (BAT-GEO-002) is standable and not blocked by obstacles or stacks placed before it; ties go to the column nearer the centre, then the row nearer the desired one, then the lower hex index. So a two-hex stack's tail stands in the edge column and its head one column further in. No such hex: setup error. Stack ids: attacker stacks first, then defender stacks, each in slot order. The tactics phase rearranges the stacks afterwards (BAT-TAC-001/002); creature-bank layouts come with creature banks."
numeric  = "integer"


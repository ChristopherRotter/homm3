[[rule]]
id       = "BAT-DMG-001"
title    = "Base damage of a stack"
context  = "battle"
status   = "implemented"
summary  = "For N <= 10 creatures (damage_roll_samples), every creature rolls a uniform integer in [damage_min, damage_max] and the rolls are summed. For N > 10, 10 rolls are summed and multiplied by N/10, rounded down: floor(S10 * N / 10). The result is an integer before any modifier."
numeric  = "integer"


# Rule catalog: battle context. Format: docs/04-rules-and-sources.md §3.
#
# E01 (walking skeleton) implements a deliberately small subset. Simplifications that E03 must
# revisit are stated in each summary under "Skeleton scope".
# Wiki pages were read on 2026-09-30; VCMI references are to tag 1.7.5 (commit 6901839ae976).

[[rule]]
id       = "BAT-GEO-001"
title    = "Battlefield hex layout, neighbours and distance"
context  = "battle"
status   = "implemented"
summary  = "The field is width x height hexes (original: 17 x 11 with one non-standable side column on each edge, i.e. 15 x 11 playable), hex = x + width*y. Even rows (0-based) are shifted half a hex right: left/right neighbours are (x-1,y)/(x+1,y); on even rows the upper/lower neighbours are x and x+1, on odd rows x-1 and x. Distance: with X = x + floor(y/2), dX = X2-X1, dY = y2-y1, distance = max(|dX|,|dY|) if dX and dY have the same sign, else |dX|+|dY|. Skeleton scope: no obstacles, no two-hex creatures, no siege walls."
numeric  = "integer"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Combat - Heroes 3 wiki: 'the battlefield, that is 11 rows of 15 hexagonal frames (hexes)'"
  url        = "https://heroes.thelazy.net/index.php/Combat"
  retrieved  = "2026-09-30"
  confidence = "high"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "lib/battle/BattleHex.h: 17x11 grid (id = x + 17*y), moveInDirection, getDistance"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/battle/BattleHex.h"
  retrieved  = "2026-09-30"
  confidence = "high"
  note       = "Internal 17-column layout and siege hex ids match the original numbering (medium-high that the layout is the original's)."

[[rule]]
id       = "BAT-SET-001"
title    = "Initial placement of armies"
context  = "battle"
status   = "implemented"
summary  = "Stacks of each army are taken in slot order; the attacker's stand in the first standable column, the defender's in the last. The i-th stack of an army with n stacks stands in row formation[n-1][i] (ruleset data). Stack ids: attacker stacks first, then defender stacks, each in slot order. Skeleton scope: the formation table of the synthetic pack is invented; the original loose/tight formations and tactics phase are for E03."
numeric  = "integer"

  [[rule.source]]
  kind       = "design"
  ref        = "E01 walking-skeleton simplification (docs/epics/E01-walking-skeleton.md); formation rows are ruleset data"
  confidence = "medium"
  note       = "Replace with the original formation data (E02 import) and a sourced rule in E03."

[[rule]]
id       = "BAT-TRN-001"
title    = "Turn order within a round"
context  = "battle"
status   = "implemented"
summary  = "In the normal phase living stacks that have not acted or waited act in descending speed. Speed ties: the stack of the side that did not act last goes first (the attacker at the start of the battle; the rule carries across rounds), then the lower army slot. The order is re-evaluated before every activation. Skeleton scope: no siege/war-machine phases, no morale phase, speed never changes during a round."
numeric  = "integer"


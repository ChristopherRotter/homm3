summary  = "A creature with strike_and_return that moved to attack returns to the hex it started its turn on after the whole melee attack (after the retaliation and a second attack), if it is still alive and does not lose its turns (Blind, Stone Gaze or Paralyze from the retaliation, BAT-MAG-024, BAT-MAG-043) and is not bound (BAT-MAG-045). The return is a move like any other and costs nothing (the original returns through its move handler, 0x445950): the stacks the returning stack binds are released (BAT-MAG-045) and it enters the hexes it lands on (a walker: those of its path), where a Fire Wall burns it (BAT-MAG-028) and an unseen enemy mine goes off (BAT-MAG-033), each followed by the rebirths (BAT-MAG-059). The return is a part of the strike's action, so the battle's end is checked once, after it (the original checks nothing before the return): a stack that dies where it lands as its side's last ends the battle; one whose strike killed the last enemy stack still lands and burns, and if it dies there nobody wins (BAT-END-002). It does not return if it did not move or died. A bound stack staying is the fix of the original's bug (survey S-14, in every profile, the user 2026-10-08): the original flies a bound Harpy back, which empties its binder lists without ending its Bind, so it stays bound for 255 rounds whatever its binders do. The start hex is always free again (nothing else moves during an attack)."
quirks   = ["BAT-QUIRK-20"]
numeric  = "integer"


title    = "Melee attack"
context  = "battle"
status   = "implemented"
summary  = "A melee attack names an enemy stack and the attacker's head position: its current one or one it can move to this turn (BAT-MOV-001/002), from which its footprint touches the target's (some hexes are neighbours, none overlap; BAT-GEO-002). So a two-hex stack can strike with its head or its tail, and a two-hex target can be hit from any of the hexes around it. The attacker moves there, then strikes (BAT-DMG-001..003); the strike costs no movement. Then the target may retaliate (BAT-RET-001). Ranged attacks, double attacks and multi-hex attacks are separate rules."

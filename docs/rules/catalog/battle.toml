[[rule]]
id       = "BAT-MAG-003"
title    = "The target of a spell"
context  = "battle"
status   = "verified"
summary  = "A spell names its target kind (SpellMagic.target). A stack spell (one stack, Chain Lightning) needs a living stack (CastTarget::Stack) on the side the spell may be aimed at (SpellMagic.side: any; enemy, the negative single-target spells and Chain Lightning; own) that the spell can affect (BAT-MAG-005) and that does not always resist: its share after resistance (BAT-MAG-008) is above zero, unless the spell is positive. A hex spell (the area spells) may be aimed at any hex outside the side columns (CastTarget::Hex), whatever stands there: an empty hex, an obstacle, a stack it cannot affect (batch 2a R3). A battle-wide spell (Armageddon, Death Ripple, Destroy Undead) takes no target (CastTarget::None) and is cast only if it would affect some stack: a living stack in its reach that it can affect (BAT-MAG-005) and that does not always resist (its share after resistance above zero, unless the spell is positive or ignores immunity: the test of a stack spell's target). Without one the cast is refused (CommandError::InvalidSpellTarget) before the mana or the round's cast is spent, as the original's spell book refuses it. A spell with a mass version (SpellMagic.mass_from: the executable's flag 0x40, Expert; the timed spells of E04b T3a) is a stack spell below that mastery and from it takes no target, is cast only if it would affect some stack of its side (own for positive spells, enemy for negative ones) as a battle-wide spell is, and reaches every stack of that side that it can affect except hypnotized stacks (BAT-MAG-026; not so for a spell that only dispels: Expert Dispel reaches them, BAT-MAG-016; Forgetfulness's mass version from Advanced under quirk Q-0011, BAT-MAG-023). A hypnotized stack it passes over still counts for that condition (the original's test reads a stack's Hypnotize only for the hero that controls it): with no other stack the spell is cast, paid for and reaches nobody. A stack without an active effect counts for the mass version of a spell that needs one when aimed (Expert Dispel). Any other target is rejected (CommandError::InvalidSpellTarget). Magic resistance is rolled when the spell takes effect, not checked here (BAT-MAG-008). Since E04b T3b1b a spell may widen its side by mastery (SpellMagic.any_side_from: Dispel reaches only own stacks below Advanced, either side from it) and a stack spell may need a target with an active timed effect (SpellMagic.needs_effect: Dispel below Expert; at Expert, mass, it reaches every stack); a spell that ignores immunity (Dispel) is aimable regardless of resistance."

context  = "battle"
status   = "implemented"
summary  = "A walking stack moves up to its speed in steps between neighbouring hexes; every step must enter a standable hex not occupied by a living stack of either side (dead stacks do not block; there is no zone of control). Moving to its own hex is not a move. Skeleton scope: no flyers, obstacles, two-hex creatures, quicksand/moat/mines."

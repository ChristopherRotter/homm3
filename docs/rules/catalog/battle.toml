title    = "Retaliation"
context  = "battle"
status   = "implemented"
summary  = "After a melee strike, the target retaliates once per round if it is still alive and has not retaliated this round; the retaliation is a normal strike (BAT-DMG-001..003) with the target's remaining creatures against the attacker. Retaliations reset at the start of each round (BAT-TRN-003). Skeleton scope: no unlimited/extra retaliations, no 'no enemy retaliation' attackers, no ranged attacks, no blind/paralyze effects."

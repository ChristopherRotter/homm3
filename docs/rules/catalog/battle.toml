summary  = "Hypnotize (a negative mind spell on one enemy stack that spares war machines; power factor 25, effect 10, 10, 20, 50) affects a stack only if its full hit points (creatures × hit points per creature: the top creature's wounds give no credit) are at most the cast's value power × 25 + effect[mastery] plus the caster's specialist bonus for the stack (BAT-MAG-020), and never a stack with Magic Mirror active (BAT-MAG-022); a Magic Mirror's new target must meet both too. It lasts the caster's rounds (BAT-MAG-010) and ends Berserk (and Berserk ends it). While active the stack's controller is the other side: the controller commands its turns (side_to_act; legal commands and validation check the controller, ADR-0004), and its hero may cast during them (BAT-MAG-001). On its turns it fights for its controller: it may attack and shoot the stacks of its own side and none of its controller's. To other stacks it stays a stack of its own side: who may attack or shoot a stack is decided by the acting stack's controller against the other stack's own side, so the side that controls it may attack and shoot it and its own side may not (batch 2c H1), the automatic Ballista included (BAT-WAR-002); beside another stack it counts as an enemy when that stack's controller is not its own side (it blocks the shooters of the side that controls it and not those of its own side, BAT-RNG-001; a multi-headed strike of the side that controls it reaches it, BAT-ATK-003), or when either is berserk (BAT-MAG-025). Unicorns protect the adjacent stacks whose own side is the Unicorns' controller (BAT-MAG-008): hypnotized, a stack keeps its own side's aura, and hypnotized Unicorns protect the side that controls them. Its own side's First Aid Tent heals it, its controller's does not (BAT-WAR-003, BAT-WAR-007), and its own side's Ammo Cart supplies it (BAT-WAR-004). The controller's hero counts for: Offense or Archery of its strikes and Armorer against strikes on it (BAT-HER-004), a specialist's Bless and Slayer terms (BAT-MAG-020), the hero resistance against spells on it (BAT-MAG-008), the bonuses of its Fire Shield's reflection (BAT-MAG-018). Its owner keeps: its statistics set at the battle's start (BAT-HER-002/005, morale and luck), the turn order's tie-break (BAT-TRN-001), the side tests of spells (BAT-MAG-003: its owner may cast positive spells on it, Cure ending Hypnotize, and no negative ones; the controller the other way round), the end of the battle (BAT-END-001: a side whose remaining stacks are hypnotized has not lost) and the outcome. The mass versions of the timed spells pass over hypnotized stacks (BAT-MAG-003). Expert Dispel does not, in any profile: the mass version of a spell that only dispels reaches them and ends their Hypnotize, as the original's own loop, which tests none (BAT-MAG-016). With quirk Q-0012 (faithful) Expert Cure passes over them, as the original's own loop does (survey S-13); without it (strict-fixed) a mass version whose dispel ends the stack's Hypnotize reaches the caster's hypnotized stacks. The Pendant of Free Will protects its hero's stacks, and the Sphere of Permanence is checked on a hypnotized stack's controlling hero (BAT-MAG-063)."

[[rule]]
id       = "BAT-END-001"
title    = "End of battle"
context  = "battle"
status   = "implemented"
summary  = "After every strike, if one side has no living stacks the battle ends and the other side wins; no stack is active afterwards and every command is rejected. The outcome lists the surviving stacks per side. Skeleton scope: no retreat/surrender, no war machines or summons (which do not count as living), no simultaneous wipe-out (cannot happen with single strikes; VCMI treats it as a draw)."
numeric  = "integer"


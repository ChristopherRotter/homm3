[[rule]]
id       = "BAT-MAG-010"
title    = "How long a timed effect lasts"
context  = "battle"
status   = "implemented"
summary  = "A hero's timed spell lasts its power plus its duration bonus (HER-BAT-014: the Conjuring artifacts, the Ring of the Magi), at least 1 round, counting the round of the cast; a permanent spell (Disrupting Ray) lasts the rest of the battle. At the start of every round each effect on a living stack either ends (its last round has passed) or loses a round: an effect cast in round n with duration d is active in rounds n to n + d − 1. An ending effect gives back what it changed (the attack Weakness took; Stone Skin's, Prayer's and Haste's additions, so a defense Disrupting Ray pushed to 0 can fall below 0) and is reported (EffectEnded). A stack that dies loses its effects (without events). The minimum of 1 round is the engine's: the original's heroes have at least 1 power."

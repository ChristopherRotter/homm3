[[rule]]
id       = "BAT-MAG-052"
title    = "A corpse raiser's raise (Pit Lord's Demons)"
context  = "battle"
status   = "implemented"
summary  = "A stack whose creature has corpse_raiser (creature, hit_points_per_creature) may, as its action while it has casts left (CreatureCast, BAT-MAG-048; spell head 0, CastSpell::Raise), raise a stack of the creature from a corpse of its controller's side whose creature is alive: the dead stack's hexes hold no living stack and are not blocked, it lies above every other such corpse on one of its hexes, and no spell test applies (no immunity, Anti-Magic or resistance); the count, min(start, min(hit_points_per_creature × the raiser's creatures, start × health) div the creature's base health) with the corpse's start count and creature health, must be at least 1, and the side must have a slot for the new stack: a dead created stack's or a new one below the side stack limit (the original crashes without one: BAT-QUIRK-12, always refused). The corpse is gone; the new stack (RoseFromCorpse) is set up as the side would have it at the battle's start (from a template kept per side when either army has a corpse raiser), takes the corpse's position and its army slot: an army stack, not a created one (StackTraits::RAISED; it leaves a corpse, counts for the battle's end and its winner, and the outcome reports it as StackOrigin::Raised(slot), in that slot after the battle, BAT-END-003), but placed after the army slots and war machines in the turn order's tie-break, as the original's new record (BAT-TRN-001). A hypnotized raiser raises its controller's dead for its controller. The Pit Lord: Demons, 50 per creature, once a battle. Not yet: Cursed Ground, the anti-magic garrison and the Orb of Inhibition (E04c, T8)."
numeric  = "integer"
quirks   = ["BAT-QUIRK-12"]


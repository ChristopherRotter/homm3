[[rule]]
id       = "BAT-TAC-002"
title    = "Placing stacks in the tactics phase"
context  = "battle"
status   = "verified"
summary  = "In the tactics phase the phase's side is handed its living army stacks one at a time in rounds of the phase like regular rounds (BAT-TRN-001/002): first the stacks that have not waited, faster first, then those that waited, slower first, ties to the lower army slot; when every stack has had its turn, the next round of the phase starts (the turn flags are cleared). War machines are never handed over or moved, and nothing acts automatically. Legal commands of the active stack: Move { to } places it on a free position (BAT-GEO-002 footprint, no obstacle or other stack) with its whole footprint inside the zone (BAT-TAC-001; CommandError::OutsideZone), without a speed limit: a walker needs a path, which may leave the zone (user decision 2026-10-04, as VCMI), a flyer or teleporter reaches any free position; a placement ends the stack's turn (Moved, then the next TurnStarted). Wait (the game's 'next creature', always allowed) makes the stack wait (Waited) or, if it has waited in this round of the phase, ends its turn. EndTactics ends the phase (TacticsEnded, then round 1 starts with RoundStarted { round: 1 }, which clears the flags, and its first activation as usual; last_side_acted stays empty). Everything else is refused (InTacticsPhase); EndTactics outside the phase is refused (NoTacticsPhase). Retreat in the phase comes with E04a T9. The phase has no limit in the rules (the sim's step limit truncates)."

[[rule]]
id       = "BAT-MOV-003"
title    = "A walker's path"
context  = "battle"
status   = "implemented"
summary  = "A walking stack (BAT-MOV-001) that moves to a position passes the positions of a shortest path between free positions, chosen from its end: each position's predecessor is its first neighbour, in the neighbour order of BAT-GEO-001 (right, bottom right, bottom left, left, top left, top right), one step nearer the start. The path never passes a position where the walk stops (a pit the stack's controller sees, BAT-MAG-032). The path matters only where the hexes a stack enters act on it (Fire Wall, BAT-MAG-028; an unseen pit, BAT-MAG-032); a flyer enters only the hexes it lands on (BAT-MOV-002). The engine's own choice: the original walks the path its battle pathfinder chose (0x5239D0 -> 0x4B3400, the pathfinder of survey S-11, not read), which on ties between shortest paths may pass other hexes (OPEN-QUESTIONS Q53, BACKLOG). The walk is reported hex by hex (E17 CLT-Q1, the user 2026-10-13): one public Moved per position, in order, each from the previous position, so a viewer animates it step by step as the original does; a flyer's, a teleporting creature's and a placement's (BAT-TAC-002) move is one Moved. A sink that keeps no events skips the path (the state is the same). The path is public: a detour around a pit only the walker's side sees shows the other side where the pit lies, as the original shows both players the walk (accepted, the user 2026-10-13; BAT-MAG-031's hygiene covers what a side may do and what its own commands report, not the walks it watches)."

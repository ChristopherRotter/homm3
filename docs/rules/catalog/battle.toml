[[rule]]
id       = "BAT-MAG-004"
title    = "Damage of a damage spell"
context  = "battle"
status   = "verified"
summary  = "A damage spell's value is power × power factor + effect[mastery] (the hero's spell power, the spell's row; BAT-MAG-002). Its damage to a stack follows the original's order (installation.md §7.8): first the bonuses of the caster's hero (none without a hero: the original runs this stage on the hero only, 0x5A78E0, so a stack's spell at one stack, the Thunderbirds' bolt and a hero-less side's shield, wall or mine keep the value; a stack's area spell or chain takes its controller's hero's, BAT-MAG-048): v × (1 + the best bonus among the spell's schools) (the Orbs, +50 %) × (1 + the every-spell bonus) (Sorcery), whose whole part is t; then this spell's own bonus of t rounded down (Ciele +50 %, Luna +100 %) and a spell specialist's ⌈per-level rate × (hero level div the stack's creature level, which is at least 1; the quotient may be 0) × t⌉ (3 % per level in SoD; HER-BAT-012). With exact rates the product is kept fractional and rounded down once to t, and the bonuses are added to t. Under quirk Q-0005 the rates are single precision (Sorcery's 5/10/15 %) and the value is kept as the executable keeps it (0x4E5760): v, its product with the school factor and that one's with the every-spell factor are each stored as a single-precision number (rounded to 24 bits, to nearest), the bonuses of the last product's whole part t are added to the stored product itself, and that sum, stored once more, is rounded down; a product a hair below a whole number so becomes that number (a Sorcery specialist's 16 % on 50: 57.99999982 is stored as 58, the damage of the exact rates). Then the target creature's: × 2 from a spell it is vulnerable to (spell_vulnerability; the elementals) and × (100 − p) / 100 from a spell damage reduction of p % (the Golems: 50, 75, 85, 95), each rounded down. The damage saturates for any value and rates. VCMI applies the target's reductions first and rounds after every factor (dispute M-6 settled by code reading; X-1). The damage kills like physical damage (BAT-DMG-003; no luck, morale or retaliation) and is reported as a public SpellDamage event; the battle ends at once if a side has no living stacks left (BAT-END-001/002). Protection spells on the target: BAT-MAG-013."
quirks   = ["BAT-QUIRK-19"]
numeric  = "integer"


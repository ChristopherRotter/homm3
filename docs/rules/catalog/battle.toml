[[rule]]
id       = "BAT-TRN-003"
title    = "New round"
context  = "battle"
status   = "implemented"
summary  = "When every living stack has acted in the current round, a new round begins: the round number increases and every stack regains its retaliation and may act and wait again. The Defend bonus is not reset by the new round (BAT-TRN-004)."
numeric  = "integer"


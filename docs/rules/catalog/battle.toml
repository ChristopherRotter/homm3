[[rule]]
id       = "BAT-GEO-003"
title    = "Obstacles"
context  = "battle"
status   = "implemented"
summary  = "The battle setup lists the natural obstacles as pieces (E04b T5b, OPEN-QUESTIONS Q55): the hexes each blocks and, for a usual obstacle, its anchor hex (the obstacle's bottom-left hex, BAT-GEO-004), which makes it removable (BAT-MAG-034); an absolute obstacle has no anchor. Every blocked hex is a standable hex of the field, blocked once across all obstacles; an anchor is a standable hex (it may lie on another obstacle's hex); at most 16 removable obstacles of at most 8 hexes each; anything else is a setup error (SetupError::InvalidObstacle, InvalidAnchor, TooManyObstacles). No stack can stand on a blocked hex: walkers cannot pass them (BAT-MOV-001), flyers and teleporters pass over them but cannot land on them (BAT-MOV-002), and placement avoids them (BAT-SET-001). With quirk BAT-QUIRK-3 (faithful) a removable obstacle's anchor hex belongs to it as in the original even where the obstacle does not block it: a stack may stand on it and pass it, but it takes no spell obstacle (Fire Wall, Force Field, BAT-MAG-027; no random pit or mine, BAT-MAG-032) and Remove Obstacle aimed at it removes the obstacle (BAT-MAG-034); without it (strict-fixed) such an anchor hex is a free hex. Obstacles, their anchors and which are removable are public information. Scope: obstacles do not affect shooting (only siege walls do, later). The obstacles are decided before the battle, e.g. by BAT-GEO-004."
numeric  = "integer"
quirks   = ["BAT-QUIRK-3"]

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (docs/formats/installation.md §7.15): a usual obstacle becomes an object (0x466010) placed by 0x4669B0, which sets the blocked bit 0x2 and the object's index on each blocked hex and bit 0x1 and the index on the anchor hex, even where the descriptor leaves out the offset (0, 0) (28 of the 55 usual types); only 0x2 blocks standing and moving (0x469A10); the spell obstacles' target test wants none of the bits 0x3F; an absolute obstacle (0x466939) only sets 0x2 and has no object"
  confidence = "high"

  [[rule.source]]
  kind       = "observation"
  ref        = "experiments/results/E04b-batch-2c.md A1, A2 (SoD 4.0 Complete, plain HD, 2026-10-07): the free hex left of a 3x1 rock takes Remove Obstacle, refuses Fire Wall as either of its hexes and takes the Phoenix; Remove Obstacle cast on it removes the whole rock; the 5x1 (absolute) obstacles cannot be removed"
  retrieved  = "2026-10-07"
  confidence = "high"


  confidence = "high"

[[rule]]
id       = "BAT-TRN-001"
title    = "Turn order within a round"
context  = "battle"
status   = "implemented"
summary  = "In the normal phase living stacks that have not acted or waited act in descending speed. Speed ties: the stack of the side that did not act last goes first (the attacker at the start of the battle; the rule carries across rounds), then the lower army slot. The order is re-evaluated before every activation. Good morale gives the stack that just acted another turn outside this order (BAT-MOR-003). Scope: no siege/war-machine phases yet (T8), speed never changes during a round."
numeric  = "integer"


[[rule]]
id       = "BAT-ATK-003"
title    = "Attacks that hit several stacks"
context  = "battle"
status   = "implemented"
summary  = "Some melee attacks also strike secondary targets, chosen from the positions at the time of the attack and never including the target itself: attacks_all_adjacent hits every living enemy stack whose footprint touches the attacker's; three_headed_attack hits enemy stacks on the two hexes beside the attacked hex; breath_attack hits any stack, friend or foe, on the hex behind the attacked hex. Pattern geometry (ported from VCMI): the origin is the attacker's head, or its tail if the head does not touch the target; the attack direction points from the origin to the target's tail if adjacent, else to its head; three-headed takes one step from the origin turned one sixth clockwise and one counter-clockwise from the attack direction, breath two steps in the attack direction; a walk whose first step would enter the attacker starts one step further (on the attacked hex); the attacker's own hexes are never hit. The target is struck first, then the secondary targets in stack-id order, each with its own damage roll; each stack is struck once per attack. Retaliations use the full pattern too. Secondary strikes carry the SECONDARY flag."
numeric  = "integer"


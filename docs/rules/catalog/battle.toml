[[rule]]
id       = "BAT-WAR-001"
title    = "War machines on the battlefield"
context  = "battle"
status   = "implemented"
summary  = "Each side may bring war machines (BattleSetup.war_machines; creatures with flag war_machine, at most one per kind; they may not stand in army slots): the Ballista (shooting kind), the Ammo Cart (ammo-supply kind) and the First Aid Tent (first-aid kind). They stand at fixed places (battle param war_machine_positions, each a machine's front hex, BAT-GEO-002: Ballista (1, 3), Ammo Cart (1, 1), First Aid Tent (1, 9) for the attacker, mirrored for the defender; a two-hex machine's position is the hex behind, in the side column), get stack ids after their side's army in the original's record order (the siege's Catapult, the Ballista, the First Aid Tent, the Ammo Cart; E04c T10a, survey D-23: VCMI's differs), so the computer's ties and the draws over stacks see the original's order, and slots 16 + kind. War machines never move (the compiler requires speed 0 for them, E04a T7a; also when their side commands them, BAT-WAR-006/007) and never attack in melee (CommandError::NoMelee), are not affected by morale (BAT-MOR-001) and do not count for the army's alignment (BAT-MOR-002), never retaliate (BAT-RET-001), and do not count as living stacks for the end of the battle (BAT-END-001). The compiler checks that the positions leave room for two-hex machines: every one has the hex behind it on the field, and no two footprints of either side (the defender's mirrored) share a hex (E04a T4a); an obstacle of the setup on a machine's place is a NoRoom setup error. In a siege the battle sets up the attacker's Catapult itself (BAT-SIE-009: slot 16 + 3, never listed in the setup) and the defender's turrets (BAT-SIE-016: slots 20 to 22, never listed)."

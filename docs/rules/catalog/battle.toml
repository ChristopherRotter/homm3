[[rule]]
id       = "BAT-MAG-001"
title    = "When a hero casts"
context  = "battle"
status   = "implemented"
summary  = "A side's hero may cast a spell (Command::Cast) while one of its side's stacks awaits a command outside the tactics phase (BAT-TAC-001), also during the turn of a war machine it commands (BAT-WAR-006/007; VCMI, observed in batch 2a R6, while the wiki says 'one of their creatures'). It needs the spell in its spell book (HER-BAT-011), a combat spell, fewer casts this round than the battle parameter hero_casts_per_round (1; the count is reset when a round starts, BAT-TRN-003), the mana for the cost (BAT-MAG-002) and a valid target (BAT-MAG-003). Casting is never required, and the active stack keeps its turn afterwards, unless the cast killed it (its own hero's area or battle-wide damage, a sacrifice, BAT-MAG-036): then its turn ends and the next stack's starts (E04b T6a; a dead stack cannot act). A cast is public: a SpellCast event with side, spell and target, and the casts this round in HeroView (ADR-0014 point 8). Only spells whose effects the battle implements can be cast (CommandError::NotCastable otherwise): the damage spells since E04b T2d (one stack, chain, area and every stack; BAT-MAG-004 to BAT-MAG-008), other effects with their tasks. Casts are not in legal_commands; castable_spells and cast_targets list exactly what apply accepts (the factorized action, ADR-0014 point 9)."

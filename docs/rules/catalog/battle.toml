[[rule]]
id       = "BAT-DMG-001"
title    = "Base damage of a stack"
context  = "battle"
status   = "implemented"
summary  = "For N <= 10 creatures (damage_roll_samples), every creature rolls a uniform integer in [damage_min, damage_max] and the rolls are summed. For N > 10, 10 rolls are summed and multiplied by N/10, rounded down: floor(S10 * N / 10). For N = 10 both descriptions coincide (ten rolls, times 10/10), so 'N >= 10 uses the scaled formula' is the same rule. The result is an integer before any modifier. User decision 2026-09-30 (OPEN-QUESTIONS Q12): follow the wiki, not VCMI."
numeric  = "integer"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Damage - Heroes 3 wiki, 'Damage calculation of creature stacks': 'If there are more than 10 creatures in a stack, 10 random integers are chosen ... multiplied by N/10 ... and rounded down'"
  url        = "https://heroes.thelazy.net/index.php/Damage"
  retrieved  = "2026-09-30"
  confidence = "high"

  [[rule.source]]

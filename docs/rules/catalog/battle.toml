[[rule]]
id       = "BAT-MOV-001"
title    = "Walking movement"
context  = "battle"
status   = "implemented"
summary  = "A walking stack moves its head up to its speed in steps between neighbouring hexes; after every step its whole footprint (BAT-GEO-002) must be on standable hexes that are neither obstacles (BAT-GEO-003) nor occupied by another living stack (its own hexes do not block it; dead stacks do not block; there is no zone of control). Moving to its own position is not a move. Flyers and teleporters: BAT-MOV-002. Scope: no quicksand, moat, land mines or fire walls (spells and sieges are later)."

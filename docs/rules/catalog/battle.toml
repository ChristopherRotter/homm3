[[rule]]
id       = "BAT-GEO-004"
title    = "Random obstacles"
context  = "battle"
status   = "implemented"
summary  = "Before a battle on a terrain, its obstacles are generated (the caller puts them into the setup, BAT-GEO-003, in the order placed, each with its hexes in hex order and its type's key): pick 5..=12 hexes to block; with 40 % chance place one absolute obstacle of the terrain (fixed hexes, no anchor; it counts half its hex count); then, while hexes remain to be blocked, draw a usual obstacle type of the terrain uniformly among those not drawn yet in this battle (each type at most once, in the content's order) and, if it has an allowed anchor, place it at an allowed anchor drawn uniformly, block its hexes (the obstacle keeps its anchor) and subtract their count; a type without an allowed anchor is passed over; stop when no type is left. An anchor (the obstacle's bottom-left hex) lies in rows 1..=height-2 (row height-2 only up to column width-2), needs at least as many rows above it as the obstacle's height (its row >= the height), column >= 1 and column + width <= field width - 2, and must not be blocked; every blocked hex (dx, dy from the anchor; from an odd row, hexes in even rows shift one column left) must be on the field, free, and in columns 3..=field width - 4, so the two columns next to each army's starting column stay free. Obstacle types (terrains, width, height, blocked hexes, absolute flag) are content; a usual type blocks at most 8 hexes (the compiler refuses more: a removable piece of the battle holds 8, BAT-GEO-003), an absolute one any number. This is the original's generator (0x466290 and 0x466010, installation.md §7.26; BAT-Q50); VCMI 1.7.5 wants one row more above the anchor, may draw a type again and stops at a type without a place. Random numbers come from the caller's stream (OBSTACLES in the tools), one draw where the original draws until a candidate fits (the same chances); the original seeds this from the map tile. On a special battlefield (BAT-TER-002) with its own obstacles the types are those listing it, not the terrain's (the original's mask is the field's bit, 0x466290, installation.md §7.26); a battlefield with fixed blocked hexes (two boats) gets them as one absolute obstacle without a type and no random obstacle; the others (a ship's deck) take the terrain's. Scope: sieges have no random obstacles."
numeric  = "integer"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "lib/battle/BattleInfo.cpp setupBattle 'randomize obstacles' (tilesToBlock rand(5,12), 40 % absolute obstacle counting half, RangeGenerator over obstacles and positions 18..168, validPosition), lib/ObstacleHandler.cpp getBlocked (odd-row shift) and isAppropriate"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/battle/BattleInfo.cpp"
  retrieved  = "2026-10-01"
  confidence = "high"
  note       = "First ported from here with our RNG. The original differs in two points the engine follows since the E04c T10b review (BAT-Q50): validPosition refuses an anchor in the row of the obstacle's height (obi.height >= pos.getY(); the original only above it, 0x46608D), and the loop draws a type again for every obstacle (obidgen made anew) and ends at a type without a place (its catch outside the loop; the original's sampler is set up once and the loop goes on, 0x4667F8, 0x466858). Choosing uniformly among the valid candidates has the same distribution as drawing without replacement until one fits."

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (docs/formats/installation.md §7.26): 0x466290 at the battle's start: two heroes in boats block the 32 hexes of 0x63D368 and nothing else; else random(5, 12) hexes to block and the mask (the field's bit when +0x53C0 is not -1, else the terrain's); with random(1, 100) <= 40 the absolute obstacles 0x4668A0 (the first of the 34 records of 0x63BEC0 drawn without repetition with the mask's bit), the count less half their hexes; then a sampler over the 91 usual types of 0x63C7C8 set up once (0x4667F8) draws until a type has the mask's bit, 0x466010 places it, its hex count is added only when placed (0x466858), until the count is reached or no type is left; 0x466010 draws anchors 18..168 without repetition until one passes: its row at least the type's height (0x46608D), column not 0, column + width <= 15, the anchor and each blocked hex free, each blocked hex in columns 3..13 after the odd-row shift"
  confidence = "high"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "config/obstacles.json: obstacle shapes, terrains and fields"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/config/obstacles.json"
  retrieved  = "2026-10-01"
  confidence = "medium"
  note       = "The packs harvest the original's tables from the executable since E04c T2 (0x63C7C8, 0x63BEC0; h3_formats::exe::obstacle_data); this file equals them in every record (installation.md §7.26)."

[[rule]]
id       = "BAT-SET-001"
title    = "Initial placement of armies"
context  = "battle"
status   = "implemented"
summary  = "Each side arranges its army in its formation from the setup (BattleSetup.formations: loose by default, or tight; Q25). Stacks of each army are taken in slot order; the desired hex of the i-th stack of an army with n stacks is row F[n-1][i] of the formation's table (ruleset data: loose_formation spreads the stacks from top to bottom, e.g. rows 2, 5, 8 for three stacks; tight_formation clusters them around the middle row, e.g. 4, 5, 6; the tables coincide for six and seven stacks) in the first standable column (attacker) or the last (defender). Each stack, in id order, takes the position where its whole footprint (BAT-GEO-002) is standable and not blocked by obstacles or stacks placed before it with its front hex closest to its desired hex; ties go to the front hex's column nearer the centre, then its row nearer the desired one, then its lower hex index. So a two-hex stack's position, its rear hex, stands in the edge column and its front hex one column further in. No such hex: setup error. Stack ids: attacker stacks first, then defender stacks, each in slot order. The tactics phase rearranges the stacks afterwards (BAT-TAC-001/002); creature-bank layouts come with creature banks."
numeric  = "integer"


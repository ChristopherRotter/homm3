[[rule]]
id       = "BAT-DMG-002"
title    = "Attack/defense modifier and final rounding"
context  = "battle"
status   = "implemented"
summary  = "If attack A > defense D: damage = base * (1 + min(0.05 * (A - D), 3.00)); else damage = base * (1 - min(0.025 * (D - A), 0.70)). Rates and caps are ruleset parameters (percent / per mille). The result is rounded down and is at least 1. Computed exactly in integers: floor(base * (100 + bonus%) / 100) or floor(base * (1000 - reduction permille) / 1000). Skeleton scope: no other I/R modifiers (luck, skills, spells, specialties) yet; the original likely uses floating point (see the Armorer quirk on the wiki), so exact-integer results may differ by 1 in edge cases once more factors combine - revisit with observations in E03/E04."
numeric  = "integer"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Damage - Heroes 3 wiki: 5% per point, 'up to +300% ... reached by a positive ADD of +60'; 2.5% per point, 'up to -70% ... a negative ADD of -28'"
  url        = "https://heroes.thelazy.net/index.php/Damage"
  retrieved  = "2026-09-30"
  confidence = "high"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Talk:Damage - Heroes 3 wiki (testers settled the reduction cap at 70%, bonuses add and reductions multiply)"
  url        = "https://heroes.thelazy.net/index.php/Talk:Damage"
  retrieved  = "2026-09-30"

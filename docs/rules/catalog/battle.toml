context  = "battle"
status   = "implemented"
summary  = "Wait postpones the active stack's turn to the wait phase, which follows the normal phase; waiting stacks act in ascending speed, with the same tie rules as BAT-TRN-001. A stack cannot wait twice in a round; it may defend after waiting. Waiting counts as the side's chance to act for tie-breaking. Skeleton scope: the morale-and-wait phase (phase 2 on the wiki) does not exist without morale."

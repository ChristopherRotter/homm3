[[rule]]
id       = "BAT-DMG-002"
title    = "Attack/defense modifier and final rounding"
context  = "battle"
status   = "verified"
summary  = "Damage from base damage b (BAT-DMG-001). Attack A against defense D: if A > D, a bonus of min(0.05 * (A - D), 3.00) (+300 % cap at 60 points, user decision Q11); if D > A, the factor max(1 - 0.025 * (D - A), 0.30) (-70 % cap at 28 points). Other bonuses: jousting, luck, hate, the hero's Offense or Archery, death blow, the Ballista's double damage; other factors: the range and melee penalties (BAT-RNG-002/003), the elementals' half (BAT-DMG-010), a blind stack's retaliation share (BAT-MAG-024), Shield and Air Shield (BAT-MAG-012), the target's hero's Armorer (BAT-HER-004). Rates and caps are ruleset parameters. With quirk Q-0005 (faithful) the executable's three stages, each truncated (docs/formats/installation.md §7.10), in its x87 arithmetic (h3_kernel::arith::X87, 53 bits): (1) the bonuses as an integer, each fractional one truncated as it is added in the code's order: jousting trunc(b * hexes * 0.05), luck + b, the attack bonus trunc(b * r + B) with r = min(0.05 * (A - D), 3.0) as a double, hate + b * percent / 100 (integer), Offense or Archery trunc(rate * b + B) with the single-precision rate, death blow + b, double damage + b; (2) times the defense factor (a double), the elementals' half (BAT-DMG-010), the penalties and a blind stack's retaliation share (its stored single-precision factor), truncated; (3) times Shield's or Air Shield's single-precision factor and 1 - Armorer (single precision), truncated, at least 1. The code's 0.05 and 0.025 are doubles slightly above the decimals; only skill rates and the spells' stored factors are single precision (user decision Q50, 2026-10-06). Without the quirk (strict-fixed): exact decimal rates, base * (1 + sum of bonuses) * product of (1 - reduction), computed exactly in integers (h3_kernel::arith::WideUint) and rounded down once, at least 1."
quirks   = ["Q-0005"]
numeric  = "integer"


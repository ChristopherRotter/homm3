[[rule]]
id       = "BAT-TRN-004"
title    = "Defend"
context  = "battle"
status   = "implemented"
summary  = "Defend ends the active stack's turn. Until the stack's next activation its defense is increased by floor(defense * defend_bonus_percent / 100), at least defend_bonus_min (original: 20 %, at least +1). Skeleton scope: defense has no hero/spell bonuses yet, so the 'after bonuses and spell effects' base question does not arise."
numeric  = "integer"


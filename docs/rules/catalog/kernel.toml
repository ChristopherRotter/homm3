# Rule catalog: kernel (engine-level rules shared by all contexts). Format: docs/04-rules-and-sources.md §3.
# Kernel rules are engine design decisions, not facts about the original game (source kind `design`).

[[rule]]
id       = "KER-RNG-001"
title    = "Pseudo-random generator, seeding and named streams"
context  = "kernel"
status   = "implemented"
summary  = "Randomness uses xoshiro256** seeded by expanding a 64-bit seed with SplitMix64 into four words. The generator for named stream S of master seed M is from_seed(M xor splitmix64_first_output(S)). next_u32 is the high half of next_u64. Stream ids are a closed list: BATTLE 1, AGENT 2, OBSTACLES 3, GAME 4, SETUP 5, player i's stream 0x100 + i (ADR-0017 point 4), battle seat s's stream 0x200 + s and batch environment i's stream 2^32 + i (ADR-0025 points 4 and 5). Algorithm id and version are recorded in replays. The original game's RNG is intentionally not reproduced (01-vision: fidelity is logic equivalence, not replay equivalence)."
numeric  = "integer"

  [[rule.source]]
  kind       = "design"
  ref        = "ADR-0003 §7 (amended by E01: algorithm choice)"
  confidence = "high"

  [[rule.source]]
  kind       = "reverse-engineering"
  ref        = "Reference implementations xoshiro256starstar.c and splitmix64.c (Blackman & Vigna), used for test vectors"
  url        = "https://prng.di.unimi.it/"
  retrieved  = "2026-09-30"
  confidence = "high"
  note       = "Not a game source; cited because the test vectors come from the reference C code."

[[rule]]
id       = "KER-RNG-002"
title    = "Uniform bounded integers"
context  = "kernel"
status   = "implemented"
summary  = "below(n) returns a uniform integer in 0..n using Lemire's multiply-and-reject method on 32-bit draws: m = x*n (64-bit), accept when (m mod 2^32) >= (2^32 - n) mod n, result m >> 32. below(0) = 0. range_inclusive(lo, hi) = lo + below(hi - lo + 1), bounds swapped if hi < lo, full u32 range returns next_u32."
numeric  = "integer"

  [[rule.source]]
  kind       = "design"
  ref        = "ADR-0003 §7; D. Lemire, Fast Random Integer Generation in an Interval (2019)"
  confidence = "high"

[[rule]]
id       = "KER-RNG-003"
title    = "Approximate binomial draws for large counts"
context  = "kernel"
status   = "implemented"
summary  = "binomial_approx(n, percent) draws the number of successes among n trials of percent % each in constant time from the normal approximation: mean n*p, standard deviation sqrt(n*p*(1-p)) (an integer square root in 32.32 fixed point), the normal variate Z as the sum of twelve uniform next_u32 draws scaled to [0,1) minus 6, the count round(mean + sd*Z) clamped to 0..=n; integer arithmetic only. Total-variation distance to the exact binomial law about 0.6 % for n >= 65 536 (computed for 1 %, 10 %, 50 % and 99 %); used only above a per-rule bound where rolling each trial would cost too much (BAT-DMG-009, OPEN-QUESTIONS Q39)."
numeric  = "integer"

  [[rule.source]]
  kind       = "design"
  ref        = "OPEN-QUESTIONS Q39 (user, 2026-10-04): exact rolls below a cutoff, a bounded-cost approximation above; Irwin-Hall sum of twelve uniforms as the normal variate (standard technique)"
  confidence = "high"

[[rule]]
id       = "KER-HSH-001"
title    = "Canonical state hash"
context  = "kernel"
status   = "implemented"
summary  = "State hashes are 64-bit FNV-1a over a canonical little-endian encoding: integers as fixed-width LE bytes, bool as one byte, Option as tag byte 0/1 then value, slices and strings as u32 length then elements. Hash algorithm id and version are recorded in replays; each state type documents its field order and bumps its own version on change."
numeric  = "integer"

  [[rule.source]]
  kind       = "design"
  ref        = "ADR-0003 §11 (amended by E01: algorithm choice)"
  confidence = "high"

[[rule]]
id       = "KER-MOD-001"
title    = "Modifier evaluation and stacking"
context  = "kernel"
status   = "implemented"
summary  = "A modifier changes a stat of a bearer by Add, AddPercent, AtLeast or AtMost with an i32 amount and a source key. A stat evaluates in fixed stages with i64 intermediates: flat = base + sum(Add); value = flat + floor(flat * sum(AddPercent) / 100); value = max(value, largest AtLeast) if any; value = min(value, smallest AtMost) if any (the upper bound wins); saturate to i32. The result does not depend on the order of the modifiers. A source contributes at most one modifier per bearer and stat: inserting one with an existing (bearer, stat, source) replaces it. Pools have a fixed capacity and keep insertion order (hashed, never evaluated)."
numeric  = "integer"

  [[rule.source]]
  kind       = "design"
  ref        = "ADR-0012 §2 (modifiers and abilities)"
  confidence = "high"

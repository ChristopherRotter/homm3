[[rule]]
id       = "ADV-MOV-002"
title    = "When a day's movement points are set"
context  = "adventure"
status   = "verified"
summary  = "At the start of its owner's turn every hero of that player gets the day's movement points for its army (ADV-MOV-001); points left from the day before are lost. A placed hero gets them when the game is built too. The original sets them at the start of the turn, not at the change of day for everyone as the wiki and VCMI have it; the difference shows only when another player changes the army between the two (a battle in that player's turn), which nothing in increment 1 can. The user chose the code reading (ADV-Q4, 2026-10-10); batch 1a confirmed it on day 1 and day 2 (E08 T10c), and a change of the army during the owner's own turn leaves the day's points as they are. E08 T6b: `AdventureState::start_turn`, run by `h3-game` at each turn group's start (ADR-0017 point 3). Since E08 T40 both read the hero's details in the game's store (ADV-MOV-001), and the build's points come after the levels at load (`AdventureState::start_game`, called by `GameState::new` after them: the original's `placed_hero_setup` 0x4D8B30, ADR-0017 point 1); a gain in the day (a level-up's Logistics, an artifact put on) changes neither the points left nor the day's maximum until the owner's next turn start (survey E08-hero-movement.md §1.4; batch E5's E5-3)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T6b; survey §1.1, CR-2): the End Turn handler 0x409A70 (a human's action) calls the next-player step 0x4C6FE0, which moves the current player 0x69CCA8 on, calls the new day 0x4C7FE0 when the last player has played (it sets no movement within two calls), then for the new current player's heroes (on the map, its two tavern heroes, the heroes in its towns) sets maximum (+0x49) and current (+0x4D) points (H3API maxMovement, movement) to 0x4E4D90's value. 0x4F4C00 does the same in the network branch. Placed heroes get them at setup in placed_hero_setup 0x4D8B30 (survey E08-progression.md §3.2; first read in 0x486590, a campaign's carried-over hero's setup, which does the same)"

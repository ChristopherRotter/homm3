  kind       = "observation"
  ref        = "experiments/results/E08-batch-1a.md C0, Q4a, Q4b (SoD 4.0 Complete, plain HD, 2026-10-12): a hero with 1 Pikeman (speed 4) walks 15 grass steps east and has 1 more marked for the next day (1500-1599 points); a hero with only Angels (speed 12) has 2000 points at the start of its turn"

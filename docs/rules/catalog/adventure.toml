[[rule]]
id       = "ADV-MOV-003"
title    = "The straight cost of a step"
context  = "adventure"
status   = "verified"
summary  = "A straight step costs the source tile's terrain cost (data: dirt 100, sand 150, grass 100, snow 150, swamp 175, rough 125, subterranean 100, lava 100; water 100 by boat) or, when both tiles have a road, the source tile's road's cost (data: dirt road 75, gravel road 65, cobblestone road 50). Only the source tile prices a step: stepping off a road onto swamp from a road on grass costs grass's 100 (D-2: the code reading and VCMI; the wiki's destination terrain not taken, the user, ADV-Q3, 2026-10-11; batch 1a confirmed it both ways, E08 T10c). Rivers change no cost. E08 T7b: `Pricing::step`, through `MoveHero` and the reachable-tiles query."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T7a, CR-1; survey §1.2): 0x4B18C0 (H3API GetMovementCost) calls 0x4B1740 with the source tile, the direction (0x678150), the points left and the destination's road byte; the price comes from the source tile alone: the source road's row of 0x63E510 (0x63E5E0: 75, 65, 50) when both tiles have a road, else 100 when the source terrain is the army's native terrain (not on Cursed Ground), else the source terrain's cost"
  confidence = "high"
  note       = "Read twice (T7a); D-2, the wiki's destination terrain for a road-to-terrain step, is decided for the reading and VCMI (the user, ADV-Q3, 2026-10-11)."

  [[rule.source]]

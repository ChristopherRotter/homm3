[[rule]]
id       = "ADV-MOV-003"
title    = "The straight cost of a step"
context  = "adventure"
status   = "verified"
summary  = "A straight step costs the source tile's terrain cost (data: dirt 100, sand 150, grass 100, snow 150, swamp 175, rough 125, subterranean 100, lava 100; water 100 by boat) or, when both tiles have a road, the source tile's road's cost (data: dirt road 75, gravel road 65, cobblestone road 50). Only the source tile prices a step: stepping off a road onto swamp from a road on grass costs grass's 100 (D-2: the code reading and VCMI; the wiki's destination terrain not taken, the user, ADV-Q3, 2026-10-11; batch 1a confirmed it both ways, E08 T10c). Rivers change no cost. Since E08 T40 a terrain's price is the one at the hero's Pathfinding level (the part's costs by level: sand and snow 125, 100, 100, swamp 150, 125, 100; roads, water and the native cost unchanged), and a terrain walker in the army counts the source's terrain as another for every price of the step, the native test and the diagonal exception's check included (the `ab` pack's Nomads: sand as dirt). E08 T7b: `Pricing::step`, through `MoveHero` and the reachable-tiles query; T40: `Pricing::new` from the hero's `h3_heroes::Movement` and its army."
numeric  = "integer"


numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = ".h3m templates: 6 bytes of passability (bit clear = blocked) and 6 of visitability; bit j of byte i is the tile 7 - j columns left of and 5 - i rows above the anchor, Objects.txt's character 47 - (8i + j), anchor first (docs/formats/h3m.md; E08 T5a: every shipped map's towns have their gate on their bottom row, heroes stand one column left of their position)"
  confidence = "high"


  retrieved  = "2026-10-09"
  confidence = "high"

[[rule]]
id       = "ADV-MOV-006"
title    = "A step needs its price; the diagonal exception; the points left"
context  = "adventure"
status   = "verified"
summary  = "A step is made only with at least its price in points left; MoveHero takes only paths payable today and rejects one with a step it cannot pay (the original stops there and loses the rest). The diagonal exception: with points from a check cost C up to ⌊C × √2⌋ (inclusive) a diagonal costs only its straight cost; C is the step's own straight cost, or under ADV-QUIRK-2 without the road and under ADV-QUIRK-3 without the native cost (the original compares with the source terrain's plain cost). After each step the points left drop to 0 when fewer remain than the cheapest straight step from the new tile: its road's cost, else the native cost (D-3: the code reading; VCMI's rule, below the step's own straight cost, not taken: the user, ADV-Q3, 2026-10-11). E08 T7b: `Pricing::step`, `Pricing::left_after`, `MoveHero`."
numeric  = "integer"
quirks   = ["ADV-QUIRK-2", "ADV-QUIRK-3"]

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T7a, re-read in T7b; survey §1.3): 0x4B1740 from 0x4B181A compares the points left with T, the source terrain's cost from 0x63E510 (no road, no native 100): below T the diagonal costs trunc(straight × 1.41421354); from T while T × 1.41421354 (x87) exceeds the points the straight cost; else the full diagonal. The move 0x4805E0 sets the points to 0 after a step when fewer than 0x4B1880's cheapest step from the new tile remain (0x481182), and stops a move at a step it cannot pay (0x480864)"
  confidence = "high"
  note       = "The exception's two bugs confirmed by an independent second reading (2026-10-10): ADV-QUIRK-2 and -3, fix-optional (the user, 2026-10-11)."

  [[rule.source]]
  kind       = "wiki"
  ref        = "Movement - Heroes 3 wiki: a hero cannot move with too few points for the next square; the diagonal exception, 'one notable, complex and buggy exception', and its two bugs"
  url        = "https://heroes.thelazy.net/index.php/Movement"
  retrieved  = "2026-10-09"
  confidence = "medium"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "CPathfinderHelper::getMovementCost: the clean exception (compared with the step's own straight cost; it takes every remaining point) and checkLast (the points left drop to 0 below the step's own straight cost)"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/pathfinder/CPathfinder.cpp"
  retrieved  = "2026-10-09"
  confidence = "high"
  note       = "Agrees on the clean exception's check, not on its charge or its last-step rule (D-3)."

  [[rule.source]]
  kind       = "observation"
  ref        = "experiments/results/E08-batch-2.md D3a-D3d (SoD 4.0 Complete, plain HD, 2026-10-13; stamp 59a4b43d): one-Angel heroes (2000 points) walk 13 tiles east; 200 points on sand, onto a cobblestone road: 50 left, the next road tile green and stepped onto, 0 left; the same onto a dirt road: 0 left, the next tile red, no step; 100 left on a snow tile reached from sand: 100; 50 left there: 0"
  retrieved  = "2026-10-13"
  confidence = "high"
  note       = "Confirms the reading's points left after a step (D-3, ADV-Q3): VCMI's drop below the step's own cost refuted by D3a and D3c, the wiki's no drop by D3b and D3d. The diagonal exception rests on the reading. Regression test: the_points_left_after_a_step_reproduce_batch_2."


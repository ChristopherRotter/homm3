[[rule]]
id       = "ADV-MOV-008"
title    = "A path uses explored tiles only"
context  = "adventure"
status   = "implemented"
summary  = "A hero steps only onto tiles its owner has explored, an empty one included; the fringe's tiles are unexplored. `MoveHero` checks every step against the tiles explored when the command is given (the reveals of its own steps do not open the rest of its path) and tests a step's tile for being explored before anything else about it, so a rejection tells nothing about a hidden tile; the reachable-tiles query keeps to explored tiles too. The original lets a computer player step one tile into the unexplored (or anywhere at some setting); the engine has no computer players: every player follows the human player's rule. E08 T8a."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T8a): pathfinder_expand (0x4B2300) marks a neighbour whose explored bit the current player lacks inaccessible for a human player (site 0x4B25D4, player_is_human 0x4BADA0); the mouse's search (0x4194A0) passes the mode that keeps this test (survey E08-adventure-core.md §1.4)"
  confidence = "high"

  [[rule.source]]
  kind       = "observation"

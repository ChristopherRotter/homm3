  [[rule.source]]
  kind       = "observation"
  ref        = "experiments/results/E08-batch-1a.md Q4a, Q4b (SoD 4.0 Complete, plain HD, 2026-10-12): Blue's hero with 4 Pikemen and 2 Angels loses the Pikemen in a battle in Red's turn (day 1, and day 2 after a new day) and has 2000 points at the start of Blue's turn (Angels only, speed 12), not 1560 (the Pikemen's speed 4, set at the day's start). The control Q4c was not on the map played (a stale build); the user's statement instead: dismissing or gaining a stack does not change the day's points"

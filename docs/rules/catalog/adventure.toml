[[rule]]
id       = "ADV-OBJ-003"
title    = "Visit modes: an object's visitable tile is entered, or visited from the tile before"
context  = "adventure"
status   = "implemented"
summary  = "A tile an object is visited from ends a path: a step onto it visits the object, and no step follows (`PastVisit`); a border gate whose key the player holds is no visit (ADV-VIS-005, E08 T15b: the mode is per player, its tile crossed as any). An object of a type visited from a neighbouring tile (piles, random resources, campfires, border guards; a border gate for a player without its key) is not entered: the step toward its visitable tile is paid as if taken (ADV-MOV-003's price, and ADV-MOV-006's drop to 0 below the cheapest next step from that tile), the hero stays on its tile, and the visit runs. Any other type is entered: the step onto the tile is priced as a step (ADV-MOV-003 to ADV-MOV-006), the hero stands there, and the visit runs. Which object a tile visits: the last in map order still on the map that is visited from it, for both modes (one object per tile, as the original's map tile records; VCMI takes the last for an entered tile, the first for a neighbour visit); its type decides the mode. No shipped map has a tile visited from two objects (E08 T14a, T21b: 0 of 100 311 visitable tiles over the 160 shipped maps). A visit runs only once its kind's is built (`ObjectKind::effect`; ADR-0016 point 4); any other visitable tile is refused (`Visit`): a blocker's (every typed kind's is built since E08 T15b). E08 T13b: the neighbour mode for pickups; T14a: the entered mode, built for the Cartographer (no effect until T14b's offer), the order, and the reachable-tiles query's destinations in both modes (never a tile on the way)."

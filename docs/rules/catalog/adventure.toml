[[rule]]
id       = "ADV-MOV-005"
title    = "A diagonal step"
context  = "adventure"
status   = "implemented"
summary  = "A diagonal step costs its straight cost (ADV-MOV-003, ADV-MOV-004) times √2, rounded down: in integers isqrt(2 · cost²) (141, 176, 212, 247 on terrain; 106, 91, 70 on roads), unless the diagonal exception applies (ADV-MOV-006). E08 T7b: `diagonal_cost`."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T7a; survey §1.2): 0x4B1740 multiplies the straight cost by the f32 1.41421354 at 0x63E5F0 on the x87 and truncates (crt_ftol); that equals isqrt(2 · cost²) for every cost below 5741"
  confidence = "high"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Movement - Heroes 3 wiki: the diagonal costs 141, 176, 212, 247 for terrain and 106, 91, 70 for roads"
  url        = "https://heroes.thelazy.net/index.php/Movement"
  retrieved  = "2026-10-09"
  confidence = "medium"

  [[rule.source]]

[[rule]]
id       = "ADV-MOV-005"
title    = "A diagonal step"
context  = "adventure"
status   = "implemented"
summary  = "A diagonal step costs its straight cost (ADV-MOV-003, ADV-MOV-004; a flight's or a water walk's, ADV-MOV-009, ADV-MOV-010, E08 T41) times √2, rounded down: in integers isqrt(2 · cost²) (141, 176, 212, 247 on terrain; 106, 91, 70 on roads), unless the diagonal exception applies (ADV-MOV-006). E08 T7b: `diagonal_cost`."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T7a; survey §1.2): 0x4B1740 multiplies the straight cost by the f32 1.41421354 at 0x63E5F0 on the x87 and truncates (crt_ftol); that equals isqrt(2 · cost²) for every cost below 5741"
  confidence = "high"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Movement - Heroes 3 wiki: the diagonal costs 141, 176, 212, 247 for terrain and 106, 91, 70 for roads"
  url        = "https://heroes.thelazy.net/index.php/Movement"
  retrieved  = "2026-10-09"
  confidence = "medium"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "CPathfinderHelper::getMovementCost: static_cast<int>(cost * M_SQRT2) for a diagonal"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/pathfinder/CPathfinder.cpp"
  retrieved  = "2026-10-09"
  confidence = "high"

[[rule]]
id       = "ADV-MOV-006"
title    = "A step needs its price; the diagonal exception; the points left"
context  = "adventure"
status   = "verified"
summary  = "A step is made only with at least its price in points left; MoveHero takes only paths payable today and rejects one with a step it cannot pay (the original stops there and loses the rest). The diagonal exception: with points from a check cost C up to ⌊C × √2⌋ (inclusive) a diagonal costs only its straight cost; C is the step's own straight cost, or under ADV-QUIRK-2 without the road and under ADV-QUIRK-3 without the native cost (the original compares with the source terrain's plain cost). After each step the points left drop to 0 when fewer remain than the cheapest straight step from the new tile: its road's cost, else the native cost (D-3: the code reading; VCMI's rule, below the step's own straight cost, not taken: the user, ADV-Q3, 2026-10-11), on Cursed Ground the terrain's walking price at the hero's Pathfinding level after a terrain walker (E08 T40, ADV-MOV-004). C is likewise the source terrain's price at the hero's Pathfinding level after a terrain walker. Flying and water walking (E08 T41, ADV-MOV-009, ADV-MOV-010): clean, C is the step's own straight cost whatever priced it, the fly or water-walk price included; under ADV-QUIRK-2 or ADV-QUIRK-3 it is the walking check, never the fly or water-walk price (water's 100). The drop then prices the cheapest step from the new tile with the hero's flying and water walking as a step from it (on water the water-walk price, then the fly price from water or a blocked tile and the lesser from a free land tile); under ADV-QUIRK-17 (faithful) without them, a walking step (the original passes the spells' levels, not the artifacts'). E08 T7b: `Pricing::step`, `Pricing::left_after`, `MoveHero`; T41: `Pricing::lifted`. E08 T73a (increment 8): a step that ends at sea or boards drops below a boat's cheapest step from the new tile (100, 66 on Favorable Winds), a landing as a walker without its levels, in both profiles (ADV-SEA-002 to -004; `Pricing::left_by`)."
numeric  = "integer"
quirks   = ["ADV-QUIRK-2", "ADV-QUIRK-3", "ADV-QUIRK-17"]

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T7a, re-read in T7b; survey §1.3): 0x4B1740 from 0x4B181A compares the points left with T, the source terrain's cost from 0x63E510 (no road, no native 100): below T the diagonal costs trunc(straight × 1.41421354); from T while T × 1.41421354 (x87) exceeds the points the straight cost; else the full diagonal. The move 0x4805E0 sets the points to 0 after a step when fewer than 0x4B1880's cheapest step from the new tile remain (0x481182), and stops a move at a step it cannot pay (0x480864)"
  confidence = "high"
  note       = "The exception's two bugs confirmed by an independent second reading (2026-10-10): ADV-QUIRK-2 and -3, fix-optional (the user, 2026-10-11)."

  [[rule.source]]
  kind       = "wiki"
  ref        = "Movement - Heroes 3 wiki: a hero cannot move with too few points for the next square; the diagonal exception, 'one notable, complex and buggy exception', and its two bugs"
  url        = "https://heroes.thelazy.net/index.php/Movement"
  retrieved  = "2026-10-09"
  confidence = "medium"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "CPathfinderHelper::getMovementCost: the clean exception (compared with the step's own straight cost; it takes every remaining point) and checkLast (the points left drop to 0 below the step's own straight cost)"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/pathfinder/CPathfinder.cpp"
  retrieved  = "2026-10-09"
  confidence = "high"
  note       = "Agrees on the clean exception's check, not on its charge or its last-step rule (D-3)."

  [[rule.source]]
  kind       = "observation"
  ref        = "experiments/results/E08-batch-2.md D3a-D3d (SoD 4.0 Complete, plain HD, 2026-10-13; stamp 59a4b43d): one-Angel heroes (2000 points) walk 13 tiles east; 200 points on sand, onto a cobblestone road: 50 left, the next road tile green and stepped onto, 0 left; the same onto a dirt road: 0 left, the next tile red, no step; 100 left on a snow tile reached from sand: 100; 50 left there: 0"
  retrieved  = "2026-10-13"

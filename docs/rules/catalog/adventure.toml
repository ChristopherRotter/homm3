[[rule]]
id       = "ADV-OBJ-002"
title    = "Object types: the import's classes and subclasses"
context  = "adventure"
status   = "implemented"
summary  = "The import maps an object's class and subclass to an object type of the adventure ruleset part (ADR-0016 point 4): resource piles (79, subclass = the resource 0-6), random resources (76), campfires (12), Cartographers (13: 0 water, 1 land, 2 subterranean), the Redwood Observatory (58), the Pillar of Fire (60), Keymaster's tents (10), border guards (9) and border gates (212, AB and SoD), each by key colour 0-7. A subclass its class does not define is an import error; every other class stays a blocker (its blocked and visitable tiles block). A type names its kind with typed parameters and two visit properties: entered or visited from a neighbouring tile, and visitable from above or not (classes 9, 12, 76, 79 and 212 are visited from a neighbour and from above; 10, 13, 58 and 60 are entered, not from above). A pile's or random resource's body gives a fixed amount (0 is none, drawn at setup; gold in hundreds), from 1 to 0x7FFFF, which the setup checks; a pile with a guards record is unsupported until battles exist (ADV-Q10, D-6). E08 T12a."

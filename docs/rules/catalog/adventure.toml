title    = "Object types: the import's classes and subclasses"
context  = "adventure"
status   = "implemented"
summary  = "The import maps an object's class and subclass to an object type of the adventure ruleset part (ADR-0016 point 4): resource piles (79, subclass = the resource 0-6), random resources (76), campfires (12), Cartographers (13: 0 water, 1 land, 2 subterranean), the Redwood Observatory (58), the Pillar of Fire (60), Keymaster's tents (10), border guards (9) and border gates (212, AB and SoD), each by key colour 0-7. A subclass its class does not define is an import error; every other class stays a blocker (its blocked and visitable tiles block). A type names its kind with typed parameters and two visit properties: entered or visited from a neighbouring tile, and visitable from above or not (classes 9, 12, 76, 79 and 212 are visited from a neighbour and from above; 10, 13, 58 and 60 are entered, not from above). A pile's or random resource's body gives a fixed amount (0 is none, drawn at setup; gold in hundreds), from 1 to 0x7FFFF, which the setup checks; a pile with a guards record is unsupported until battles exist (ADV-Q10, D-6). E08 T12a. Setup refuses two typed objects of one type on one anchor (`SharedAnchor`; a player names a typed object by both, ADR-0016 point 6; none in the 164 shipped maps; E08 T15's review); a key guard or gate type must be visited from a neighbour, and a gate from above too (T15b and its review). E08 T61a (increment 7, design §7 and §8): 31 more classes typed, each subclass to one type (a placed artifact's subclass is its artifact): 101 the treasure chest, 5 the placed artifact, 65-69 the random artifacts (any of treasure, minor and major; treasure; minor; major; relic), 93 the Spell Scroll, 4, 23, 32, 41, 47, 51, 61, 100, 102 and 107 the once-per-hero gifts, 88-90 the Shrines (levels 1-3), 113 the Witch Hut, 81 the Scholar, 104 the University, 22, 39, 105 and 108 the finds, 6 Pandora's Box, 26 the event, 63 the Pyramid; classes 5, 6, 22, 26, 65-69, 81, 93 and 101 visited from a neighbour and from above, the others entered and not from above (0x63AA58, 0x63AB00). Their kinds' parameters are the packs' (the chest's gold and chances, a gift's gain, prices and condition, a find's draws and full-backpack turn, the Pyramid's guards, spell level and looted bonus, a Witch Hut's RoE skills by profile, A-21). What the map puts in them is checked against the kind at setup (`Holds`, `SetupError::Holds`): a placed artifact one a hero may hold without a spell, a scroll the Spell Scroll with the map's spell (its u32's low byte), a Shrine's spell (255 drawn), a Witch Hut's mask (none on an RoE map; an empty mask every skill, 0x4C207D), a Scholar's gift (kind -1 drawn), Pandora's Box's and an event's reward record (skills of the ruleset at Basic to Expert, known artifacts, hero spells, distinct resources not 0, creatures valid as an army's) with the event's colours and computer and removal flags; every other kind nothing. A reward of more creature stacks than an army's slots is unsupported (A-24, always fixed), as a random creature code among them. Their visits come with T62: until then a step onto them is refused as a blocker's."

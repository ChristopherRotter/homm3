# Adventure rules (context `adventure`, crate `h3-adventure`): the adventure map, heroes on the
# map, movement, objects and fog of war (ADR-0016; E08). Format: docs/04-rules-and-sources.md §3.
# Survey: docs/rules/surveys/E08-adventure-core.md. E08 T4 wrote the rules whose data the
# adventure ruleset part holds (packs/*/adventure.toml); they stay `specified` until movement (T7)
# and fog of war (T8) implement them.

[[rule]]
id       = "ADV-MOV-001"
title    = "Movement points of a day on land"
context  = "adventure"
status   = "verified"
summary  = "A hero's movement points on land for a day come from the lowest speed among the creatures of its army through the land table (data: 1300, 1360, 1430, 1500, 1560, 1630, 1700, 1760, 1830, 1900, 1960, 2000 for speeds 0 to 11; faster armies take the last entry; the original reads its table up to speed 20, all 2000 from 11, and caps the speed at 20). Since E08 T40 the hero counts in: each stack's speed as `h3_heroes::movement_speed` gives it (HER-ADV-004: a creature specialist's creature and its direct upgrades one faster, which can lift the slowest speed past the table's end; speed artifacts do not count), then the hero's bonuses on the entry by `h3_heroes::land_points` (HER-ADV-003: Logistics +10/20/30 %, a Logistics specialist's growth under Q-0005, the worn Boots of Speed +600 and Equestrian's Gloves +300 after the rate). When they are set: ADV-MOV-002. Stables and a computer player's bonus come later (survey E08-hero-movement.md §6). E08 T4: the table; T6b: `h3_adventure::day_points`; T40: `land_table_points` and the details. At sea (E08 T72): a hero in a boat takes the day's sea points instead, `h3_heroes::sea_points` on the part's sea table (1 500, 2 250, 3 000, 3 750 by Navigation level; its specialists, the Necklace of Ocean Guidance and the two Hats, HER-ADV-009), the army's speeds not counted, the table's first entry without details (`h3_adventure::sea_day_points`)."
numeric  = "integer"


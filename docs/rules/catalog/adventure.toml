[[rule]]
id       = "ADV-MOV-002"
title    = "When a day's movement points are set"
context  = "adventure"
status   = "verified"
summary  = "At the start of its owner's turn every hero of that player gets the day's movement points for its army (ADV-MOV-001); points left from the day before are lost. A placed hero gets them when the game is built too. The original sets them at the start of the turn, not at the change of day for everyone as the wiki and VCMI have it; the difference shows only when another player changes the army between the two (a battle in that player's turn), which nothing in increment 1 can. The user chose the code reading (ADV-Q4, 2026-10-10); batch 1a confirmed it on day 1 and day 2 (E08 T10c), and a change of the army during the owner's own turn leaves the day's points as they are. E08 T6b: `AdventureState::start_turn`, run by `h3-game` at each turn group's start (ADR-0017 point 3)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T6b; survey §1.1, CR-2): the End Turn handler 0x409A70 (a human's action) calls the next-player step 0x4C6FE0, which moves the current player 0x69CCA8 on, calls the new day 0x4C7FE0 when the last player has played (it sets no movement within two calls), then for the new current player's heroes (on the map, its two tavern heroes, the heroes in its towns) sets maximum (+0x49) and current (+0x4D) points (H3API maxMovement, movement) to 0x4E4D90's value. 0x4F4C00 does the same in the network branch. Placed heroes get them at setup in 0x486590"
  confidence = "medium"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Movement - Heroes 3 wiki: 'Base movement is calculated only at the beginning of each day'"
  url        = "https://heroes.thelazy.net/index.php/Movement"
  retrieved  = "2026-10-09"
  confidence = "medium"
  note       = "Disagrees with the code reading on the hook (ADV-Q4); in sequential play each player's turn starts its day for it, so the sentence may mean either."

  [[rule.source]]
  kind       = "vcmi"
  ref        = "server/processors/NewTurnProcessor.cpp: at the change of day every hero's movement becomes movementPointsLimitCached for its tile"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/server/processors/NewTurnProcessor.cpp"
  retrieved  = "2026-10-10"

[[rule]]
id       = "ADV-ARM-007"
title    = "A stack's most creatures"
context  = "adventure"
status   = "implemented"
summary  = "A stack holds at most the adventure parameter max_stack_count creatures (base pack 1 000 000; a part's value at least MAX_MONSTER_COUNT, so any wandering monster's group fits a slot). A setup's hero or guards' stack above it is invalid. A merge past it is refused (ADV-ARM-001, -002); a split keeps both stacks within it (ADV-ARM-003). A group that joins (ADV-MON-008) or is raised (GAM-BAT-006) goes onto the army's first stack of its creature that takes it whole within the most, else into its first free slot, else finds no room (E08 decision 115: a join's no room is the army dialog, GAM-DEC-004, E08 T51b); a raise counts at most the most. Later rules that add creatures (recruiting, growth) keep it. Not the original's (32-bit counts, the map's 16-bit ones, A-15): E08 decisions 109 and 114, ADR-0016 point 3. E08 T50: `AdventureParams::max_stack_count`, `ArmyError::TooManyCreatures`, `ArmyCommandError::TooManyCreatures`; adventure ruleset part v11."
numeric  = "integer"

  [[rule.source]]
  kind       = "design"
  ref        = "the user at T47b's E6-5 (E08 decision 109: 'We should just support a reasonable amount and handle saturation gracefully, e.g. by not allowing stack merges to exceed that number') and at T50's start (decisions 114, 115: 1 000 000; a joining group to a free slot, else the army dialog); ADR-0016 point 3"
  confidence = "high"

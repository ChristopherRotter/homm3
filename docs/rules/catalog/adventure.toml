[[rule]]
id       = "ADV-OBJ-003"
title    = "Visit modes: a step toward a neighbour-visited object visits it from the tile before"
context  = "adventure"
status   = "implemented"
summary  = "A tile an object is visited from ends a path: a step onto it visits the object, and no step follows (`PastVisit`). An object of a type visited from a neighbouring tile (piles, random resources, campfires, border guards; a border gate for a holder without its key) is not entered: the step toward its visitable tile is paid as if taken (ADV-MOV-003's price, and ADV-MOV-006's drop to 0 below the cheapest next step from that tile), the hero stays on its tile, and the visit runs. Which object: the first in map order still on the map that is visited from the tile (VCMI's order; an agent's call while no shipped map is known to stack visitable tiles). E08 T13b builds the neighbour visit for pickups; a step onto any other object's visitable tile (a blocker's, or one whose visit a later task builds) is rejected (`Visit`), and the reachable-tiles query offers a pickup's tile as a destination, never a tile on the way. The entered mode (the hero steps onto the tile; the Cartographer, observatories, tents) comes with E08 T14, together with ADV-OBJ-004."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T11a, survey docs/rules/surveys/E08-objects.md §2.1, §2.2): hero_move_step (0x4805E0) sends a step toward a class on the 'cannot be entered' list (0x63AA58; 9, 12, 76, 79) to 0x480240, which stops the move, takes the step's price from the hero's points and sets them to 0 below the cheapest next step, then visits; the hero stays. A visit ends the move (0x481544); only garrisons and a key holder's border gate let a step that is not the last skip it (0x48160A)"
  confidence = "high"


title    = "Where a hero may step"
context  = "adventure"
status   = "specified"
summary  = "A hero steps to one of the eight neighbouring tiles on the same level inside the map. Each terrain has a passage (data): land terrains are walked, water only by boat (not before boats exist), rock never. A blocked tile of an object is never entered. E08 T4: the passages; T7: the rule."

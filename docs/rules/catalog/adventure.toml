[[rule]]
id       = "ADV-MOV-006"
title    = "A step needs its price; the diagonal exception; the points left"
context  = "adventure"
status   = "verified"
summary  = "A step is made only with at least its price in points left; MoveHero takes only paths payable today and rejects one with a step it cannot pay (the original stops there and loses the rest). The diagonal exception: with points from a check cost C up to ⌊C × √2⌋ (inclusive) a diagonal costs only its straight cost; C is the step's own straight cost, or under ADV-QUIRK-2 without the road and under ADV-QUIRK-3 without the native cost (the original compares with the source terrain's plain cost). After each step the points left drop to 0 when fewer remain than the cheapest straight step from the new tile: its road's cost, else the native cost (D-3: the code reading; VCMI's rule, below the step's own straight cost, not taken: the user, ADV-Q3, 2026-10-11), on Cursed Ground the terrain's walking price at the hero's Pathfinding level after a terrain walker (E08 T40, ADV-MOV-004). C is likewise the source terrain's price at the hero's Pathfinding level after a terrain walker. Flying and water walking (E08 T41, ADV-MOV-009, ADV-MOV-010): clean, C is the step's own straight cost whatever priced it, the fly or water-walk price included; under ADV-QUIRK-2 or ADV-QUIRK-3 it is the walking check, never the fly or water-walk price (water's 100). The drop then prices the cheapest step from the new tile with the hero's flying and water walking as a step from it (on water the water-walk price, then the fly price from water or a blocked tile and the lesser from a free land tile); under ADV-QUIRK-17 (faithful) without them, a walking step (the original passes the spells' levels, not the artifacts'). E08 T7b: `Pricing::step`, `Pricing::left_after`, `MoveHero`; T41: `Pricing::lifted`."
numeric  = "integer"
quirks   = ["ADV-QUIRK-2", "ADV-QUIRK-3", "ADV-QUIRK-17"]

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T7a, re-read in T7b; survey §1.3): 0x4B1740 from 0x4B181A compares the points left with T, the source terrain's cost from 0x63E510 (no road, no native 100): below T the diagonal costs trunc(straight × 1.41421354); from T while T × 1.41421354 (x87) exceeds the points the straight cost; else the full diagonal. The move 0x4805E0 sets the points to 0 after a step when fewer than 0x4B1880's cheapest step from the new tile remain (0x481182), and stops a move at a step it cannot pay (0x480864)"
  confidence = "high"
  note       = "The exception's two bugs confirmed by an independent second reading (2026-10-10): ADV-QUIRK-2 and -3, fix-optional (the user, 2026-10-11)."

  [[rule.source]]
  kind       = "wiki"
  ref        = "Movement - Heroes 3 wiki: a hero cannot move with too few points for the next square; the diagonal exception, 'one notable, complex and buggy exception', and its two bugs"
  url        = "https://heroes.thelazy.net/index.php/Movement"
  retrieved  = "2026-10-09"
  confidence = "medium"

  [[rule.source]]
  kind       = "vcmi"

# Adventure rules (context `adventure`, crate `h3-adventure`): the adventure map, heroes on the
# map, movement, objects and fog of war (ADR-0016; E08). Format: docs/04-rules-and-sources.md §3.
# Survey: docs/rules/surveys/E08-adventure-core.md. E08 T4 wrote the rules whose data the
# adventure ruleset part holds (packs/*/adventure.toml); they stay `specified` until movement (T7)
# and fog of war (T8) implement them.

[[rule]]
id       = "ADV-MOV-001"
title    = "Movement points of a day on land"
context  = "adventure"
status   = "verified"
summary  = "A hero's movement points on land for a day come from the lowest speed among the creatures of its army through the land table (data: 1300, 1360, 1430, 1500, 1560, 1630, 1700, 1760, 1830, 1900, 1960, 2000 for speeds 0 to 11; faster armies take the last entry; the original reads its table up to speed 20, all 2000 from 11, and caps the speed at 20). When they are set: ADV-MOV-002. Bonuses (Logistics, artifacts, Stables, a creature specialty's +1 speed) come with the adventure profile (increment 3); at sea (Navigation) with boats. E08 T4: the table; T6b: `h3_adventure::day_points`."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "movement.txt (H3bitmap.lod; H3ab_bmp.lod holds the same file), column 2 for speeds 0-20; Heroes3.exe reads it with 0x4D7240 into 0x698A98, and 0x4E4990 indexes it by the slowest speed of the seven slots, starting from 20 (E08 T4 reading; survey §1.1)"
  confidence = "high"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Movement - Heroes 3 wiki: the table by the slowest creature's speed (1300 at speed 0 to 2000 from speed 11); 'Base movement is calculated only at the beginning of each day'"
  url        = "https://heroes.thelazy.net/index.php/Movement"
  retrieved  = "2026-10-09"
  confidence = "medium"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "config/gameConfig.json movementPointsLand [1500, 1500, 1500, 1500, 1560, ..., 2000]; CGHeroInstance::getLowestCreatureSpeed"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/config/gameConfig.json"
  retrieved  = "2026-10-10"
  confidence = "medium"
  note       = "VCMI gives 1500 below speed 3, against the original's movement.txt and the wiki; no creature that can stand in an army is that slow (dispute D-4, settled by the original data)."


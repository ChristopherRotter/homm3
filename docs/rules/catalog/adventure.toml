[[rule]]
id       = "ADV-MOV-004"
title    = "Native terrain removes the penalty"
context  = "adventure"
status   = "verified"
summary  = "An army is native to a terrain when every creature's faction has it as native terrain (neutral creatures, and factions without one, have none); a step from that terrain without a road costs the native cost (data: 100) instead of the terrain's. Under ADV-QUIRK-4 (faithful) the original's walk: stacks without a native terrain in slots before the first that has one are skipped, so [Peasants, Pikemen] is native to grass but [Pikemen, Peasants] is not. The terrain compared is the source's as a terrain walker counts it (ADV-MOV-003). Cursed Ground (D-23, E08 T40): a step from a tile whose top ground (the last in map order lying on it, as for a battle's ground) takes the native cost away (the packs' `no_native`: the RoE and the SoD Cursed Ground) costs every army the terrain's walking price, and so does the drop's cheapest step on such a tile (ADV-MOV-006). E08 T7b: `native_terrain`, `Pricing`; T40: `StaticTile::no_native`."
numeric  = "integer"
quirks   = ["ADV-QUIRK-4"]

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T7b; survey §1.2): 0x44C590, called by 0x4B18C0, walks the seven slots, each creature's faction's native terrain from 0x643698 (a neutral creature reads -1 before the table); the first value sets the result unless it is -1, a later one that differs gives -1; 0x4B1740 then prices a step from that terrain at 100"
  confidence = "high"
  note       = "Confirmed by an independent second reading (2026-10-11); the slot-order effect is ADV-QUIRK-4."

  [[rule.source]]
  kind       = "wiki"
  ref        = "Movement - Heroes 3 wiki: the penalty is removed when 'all the creatures in hero's army are native' to the terrain"

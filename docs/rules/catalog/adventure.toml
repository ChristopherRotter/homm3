status   = "implemented"
summary  = "An army is native to a terrain when every creature's faction has it as native terrain (neutral creatures, and factions without one, have none); a step from that terrain without a road costs the native cost (data: 100) instead of the terrain's. Under ADV-QUIRK-4 (faithful) the original's walk: stacks without a native terrain in slots before the first that has one are skipped, so [Peasants, Pikemen] is native to grass but [Pikemen, Peasants] is not. Nomads' sand ability (increment 3) and Cursed Ground (with objects) come later. E08 T7b: `native_terrain`, `Pricing`."

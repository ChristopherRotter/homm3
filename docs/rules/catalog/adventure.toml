  url        = "https://heroes.thelazy.net/index.php/Movement"
  retrieved  = "2026-10-09"
  confidence = "medium"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "CGHeroInstance::getNativeTerrain (one native terrain shared by all stacks, otherwise none); CPathfinderHelper::getMovementCost uses GameConstants::BASE_MOVEMENT_COST (100) on native terrain; config/factions/neutral.json (no native terrain)"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/mapObjects/CGHeroInstance.cpp"

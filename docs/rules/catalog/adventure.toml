from above (0x63AA58, 0x63AB00). Their kinds' parameters are the packs' (the chest's gold and chances, a gift's gain, prices and condition, a find's draws and full-backpack turn, the Pyramid's guards, spell level and looted bonus, a Witch Hut's RoE skills by profile, A-21). What the map puts in them is checked against the kind at setup (`Holds`, `SetupError::Holds`): a placed artifact one a hero may hold without a spell, a scroll the Spell Scroll with the map's spell (its u32's low byte), a Shrine's spell (255 drawn), a Witch Hut's mask (none on an RoE map; an empty mask every skill, 0x4C207D), a Scholar's gift (kind -1 drawn), Pandora's Box's and an event's reward record (skills of the ruleset at Basic to Expert, known artifacts, hero spells, distinct resources not 0, creatures valid as an army's) with the event's colours and computer and removal flags; every other kind nothing. A reward of more creature stacks than an army's slots is unsupported (A-24, always fixed), as a random creature code among them. Their visits come with T62: until then a step onto them is refused as a blocker's. E08 T72 (increment 8, design §4 and §5): classes 29 Flotsam, 82 the Sea Chest and 86 the Shipwreck Survivor (finds that leave the map, ADV-PIK-014 to -016) and 59 the Ocean Bottle (a message that leaves; its text is the client's), visited from a neighbour and from above; 124 the hole and 225 Favorable Winds (SoD) entered and from above, each lying on its picture's tiles (every hole 1 x 1, the winds' eight pictures 6 x 4 to 2 x 5) and never visited: a hole forbids a landing on its tiles, a ground of the sea lowers a boat's step price from the tiles it tops (T73; the static map marks them, the tile's top ground deciding). A boat (class 8) is no object but a boat of the state (ADV-SEA-001). The sea's pickups and the bottle are visited from a boat only, built by T74: until then a step onto them is refused as any unbuilt visit's. The setup lets grounds of the sea and holes share a type a
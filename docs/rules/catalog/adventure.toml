er decides at once). A fight is a battle the game opens at once (ADV-MON-009, -010, E08 T20b2). Not modelled: the original's 32-bit army value, which would wrap above 2^31 (no army reaches it). E08 T20b1: `answer.rs` (Temper, power, sympathy), `AdventureState::decline_offer`."

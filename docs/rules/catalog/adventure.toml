numeric  = "integer"
quirks   = ["ADV-QUIRK-4"]

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T7b; survey §1.2): 0x44C590, called by 0x4B18C0, walks the seven slots, each creature's faction's native terrain from 0x643698 (a neutral creature reads -1 before the table); the first value sets the result unless it is -1, a later one that differs gives -1; 0x4B1740 then prices a step from that terrain at 100"

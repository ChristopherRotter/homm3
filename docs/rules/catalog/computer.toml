context  = "computer"
status   = "implemented"
summary  = "Any other battle spell (sim_other_spell_value 0x425510): nothing for a spell that only counters the enemy's spells (the Protections, Anti-Magic, Dispel, Magic Mirror, Cure; the original's 30 to 37) when the enemy cannot cast. A stack's part (0x423C80): 0 without value; else ftol(f32(the AI value at the mastery x min(rounds, 5) x the stack's value, 32 bits) x f32(the creature's factor, CPU-SIM-007) / 500). Dispel: its own stacks under the caster's hero, from Advanced the enemy's too, the stacks from the last; a mass version sums, else the best stack is kept (ties to the later one valued); at Advanced an enemy stack that beats the own value is its target. A positive spell values the own stacks, any other the enemy's. Its application (0x425B10, 0x4258A0): Dispel at Expert on both sides (the own as positive, the enemy's as negative), below on its target; another spell on the own side if positive, else on the enemy's: its aimed stack, or for a mass version every stack with value whose part is above 0, changes its value and its unit value up (positive) or down by its part and by unit x part / value (64 bits, toward 0), and its value per hit point to the new value over the old value times the old value per hit point (0x4259B2, survey section 5.5 #65: a slip, the hit points would be the old value over it; the quick battle's, state, ported as read). The side's strength stays."
numeric  = "float"


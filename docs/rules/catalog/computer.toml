# Computer rules (context `computer`, the module `h3_game::computer`; E31): the original's
# computer player on the adventure map, ported from Heroes3.exe (SoD's code) as a policy outside
# the game state. One id `CPU-<area>-nnn` per routine of the reading (the frame, the planning, the
# walk, the values by family, the simulated combat, the towns, the hires, the answers), each with
# its code reading's source (the survey's §) and its trace; values through `h3_kernel::arith`'s
# `X87` and `SignedX87` (`numeric = "float"`). Format: docs/04-rules-and-sources.md §3. Survey:
# docs/rules/surveys/E31-computer-player.md; ADR-0030 (points 9, 12). Created with ADR-0030's
# `shared/` pull request (E31 increment 2); its rules come with increment 2's code.

[[rule]]
id       = "CPU-TRN-001"
title    = "The computer player's command"
context  = "computer"
status   = "implemented"
summary  = "The policy of a player the original's computer plays on the adventure map (ADR-0030; h3_game::computer::choose): one command a call, for the player whatever its human flag says, from the whole state, its memory (CPU-TRN-005) and the caller's stream, never the game's; the same state, memory and stream give the same command and memory. None while another player's level-up holds the game (GAM-DEC-002) and for a battle, whose side the host's battle seat plays (h3_battle_ai's choose, or choose_fair in the fair variant, as the player's Battle command; ADR-0030 point 7). An open decision of the player's, in its turn or not, is answered by default_answer (AI-STUB-6, until increment 4). In its turn without a decision, the next command of the turn's frame (CPU-TRN-002), its last EndTurn; outside its turn none. Every command is one the game accepts (the property tests on the generated maps and on five shipped maps at every difficulty)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey docs/rules/surveys/E31-computer-player.md section 1.1; E31 T1a1a, re-read blind at T2a): adventure_manager_procedure 0x408BD8 calls ai_player_turn 0x525E80 for a player who is not human; the answers of section 3.4 and 3.5 run inside the game's visits and level-ups, in any player's turn"
  confidence = "high"

  [[rule.source]]
  kind       = "design"
  ref        = "ADR-0030 (accepted, AI-Q32) points 2, 3, 7, 8, 11: the function, always legal, battles by the host's seat, the caller's stream, every player played as the computer"
  confidence = "high"

[[rule]]
id       = "CPU-TRN-002"
title    = "The turn's frame: its start, its two passes, the middle and its end"
context  = "computer"
status   = "implemented"
summary  = "A computer player's turn (ai_player_turn 0x525E80): at its start (its first call on a new day) no hero is done (the original clears every hero's and garrison hero's +0x11C and +0x43) and the turn's flag F is set: the game's difficulty above Easy and a town owned. The first pass plays the next hero (CPU-TRN-003) through its turn (CPU-TRN-004) until none is left; then the middle (ai_turn_middle 0x428DD0) and F set again as at the start (0x525FD5); then the second pass the same way; then the turn ends (EndTurn). One call gives one command: the frame goes on from its memory until a step gives one, each step after a command reading the state the command made. The frame draws nothing. The start's records and the middle's builds, hires and shares are AI-STUB-3 (T2d, increment 3)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 1.1, 1.5; E31 T1a1a, re-read blind at T2a): ai_player_turn 0x525E80 (ai_turn_start 0x4297C0 and ai_turn_start_values 0x527960 at 0x525F01; F at 0x525F65 from the game's +0x1F6D8 and the player's +0x3E; ai_next_hero 0x526A90 and ai_hero_turn 0x5261F0 at 0x525F87 to 0x525FB8; ai_turn_middle 0x428DD0 at 0x525FCA; F again at 0x525FD5; the second pass inline from 0x526000; the end at 0x5261A6)"
  confidence = "high"

[[rule]]
id       = "CPU-TRN-003"
title    = "The order of the computer's heroes"
context  = "computer"
status   = "implemented"
summary  = "The next hero of a computer player's pass (ai_next_hero 0x526A90, and its copy in the second pass): the hero a garrison just sent out, if it stands on the map, without the alone flag; else among the player's heroes on the map with movement points left and not done, a free hero before a patrolling one (the game state keeps no patrol: every hero is free, AI-STUB-5), then the least sum of the primary skills (each of the four effective values the adventure map reads, the worn artifacts included, as a signed byte: above 99 counted 99, above 0 itself, else 0 for Attack and Defense and 1 for Spell Power and Knowledge), a tie to the earlier in the player's list of heroes (GAM-HER-003); the alone flag when exactly one hero qualified. With none, and fewer than eight heroes of the player's on the map, the first of its towns (in TownId order, the engine's order of a player's towns) whose garrison hero carries a creature, has points left and is not done, with no hero on the town's entrance: that hero is sent out onto the entrance (TownHeroChange::Leave, where the engine allows it: TWN-ROW-003) and plays next; else the pass ends."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 1.2; E31 T1a1a, re-read blind at T2a): ai_next_hero 0x526A90 (the flag set to 1 at 0x526AA5 and cleared by a second hero at 0x526B06; points +0x4D above 0 and +0x11C clear; the patrol byte +0x44 against 0xFF; the skills' sum at 0x526B12 over +0x476 to +0x479, signed, clamped to 99, 0 or 1 below 1 from index 2; a strictly smaller sum replaces; none: the flag 0, the selection -1, the hero count +0x1 against 8, the town list +0x40 over +0x3E, the town's garrison hero +0xC set and its visitor +0x10 none, the hero's creatures army_creature_count 0x44ADA0, points and sleep, town_garrison_to_visitor 0x5BE390); the second pass's copy at 0x526000 to 0x526187, the same tests"
  confidence = "high"

[[rule]]
id       = "CPU-TRN-004"
title    = "A computer hero's turn and its garrison step"
context  = "computer"
status   = "implemented"
summary  = "A computer hero's turn (ai_hero_turn 0x5261F0): a hero on a town's entrance visits the town first (AI-STUB-4, increment 3); a patrolling hero of radius 0 never moves (AI-STUB-5); with points left the selection, the danger map, the boat marks and the search and the walk (AI-STUB-2: until T2i and T2j every hero finds no destination and is done at once). Last the garrison step: a hero without points or done, standing on the entrance of a town of its owner's, goes into the garrison when no hero holds it (TownHeroChange::Enter; where the engine refuses it, the armies not merging, there is no step, as the original's town_visitor_to_garrison 0x4B9FC0 does nothing when army_absorb refuses); with a garrison hero the two change places (TownHeroChange::Swap) when the garrison hero has points left and is not done, or its army holds a creature and is worth less than the visitor's (army_value 0x44AC80: each stack's creature's AI value times its count, summed; h3_adventure::army_value). No step where the engine refuses the move."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 1.3; E31 T1a1a, re-read blind at T2a): ai_hero_turn 0x5261F0 (town_at_entrance 0x4BB870 and ai_town_visit 0x5253D0 first; the patrol at 0x526267; points at 0x5262AB; the selected hero at 0x5262F8; ai_danger_map at 0x5263B1; the boat marks from 0x5263B6; ai_hero_search_and_walk 0x5267B0 at 0x526571; the garrison step from 0x52667F: the owner +0x22 set, points not above 0 or asleep, the town at the entrance its owner's, its garrison hero +0xC none: town_visitor_to_garrison 0x4B9FC0; else points and sleep of the garrison hero, else town_garrison_army 0x5C1460's creatures and its army_value against the visitor's +0x91: town_swap_heroes 0x5BE450)"
  confidence = "high"

[[rule]]
id       = "CPU-TRN-005"
title    = "The computer player's memory"
context  = "computer"
status   = "implemented"
summary  = "What the computer player keeps outside the game state (ADR-0030 point 5; h3_game::computer::Memory), one per computer player, empty at its first turn in a game (the original's records survive from an earlier game: a quirk candidate, not reproduced): since E31 T2a the frame of the turn it plays: the turn's day, its pass, the turn's flag, the hero a garrison sent out, the heroes done (the original's sleep +0x11C, cleared at each of its turn starts). Its canonical encoding v1 (little-endian: the version; 0 without a turn, else 1, the day u32, the pass u8, the flag u8, the hero sent out as 0 or 1 and its id u16, the count u32 of heroes done and their ids u16 in ascending order) is the only one its decoder accepts; its hash is FNV-1a over the encoding. The heroes' destinations, the only fields the original carries into the next turn (+0x35, +0x41), come with the planning (T2i)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey sections 1.6 and 4.6; E31 T1a1a, T1a4c): ai_player_records 0x692950, set once at the program's start (ai_player_records_init 0x4340E0) and never by a new game or a load; the hero's +0x11C, +0x35 to +0x43 written by the computer's turn"
  confidence = "high"

  [[rule.source]]
  kind       = "design"
  ref        = "ADR-0030 (accepted, AI-Q32) point 5: the memory the policy's, outside the state, a plain value with a canonical encoding and a hash, kept by its host beside the journal"
  confidence = "high"

[[rule]]
id       = "CPU-SIM-001"
title    = "A side of the simulated combat"
context  = "computer"
status   = "implemented"
summary  = "One side of the computer's simulated combat (sim_combat_start 0x423EE0, sim_side_build 0x424120, sim_side_walls 0x424790; values in army-value units): its army's slots 0 to 6 with a creature, in slot order, with its hero, against the opponent hero, facing a town's walls, scaled by the caller's factor. The walls: a Fort 4, a Citadel 5, a Castle 6; none when the hero has Earthquake among its available spells; else less the hero's Ballistics, at least 2; at most 4. Tactics: the hero's level less the opponent's, at least 0. The factor times sqrt(1 + 0.05 a) x sqrt(1 + 0.05 d) with a hero (a its Attack over the opponent's Defense, d its Defense over the opponent's Attack, each clamped to 0..99 and each difference at least 0; its own without an opponent), in double precision. Per stack: speed the creature's plus the hero's (its speed changes for every creature: artifacts, a speed specialty; not a creature specialty's), hit points the creature's plus the hero's (its hit-point changes that select the creature, Elixir of Life's quarter of a living creature's rounded down); unit value ftol(sqrt(hit points with the bonus / hit points) x fight value x factor), value that times the count (32 bits, wrapping), summed into the strength; rounds to contact 0 for a shooter, else (speed + 2 (7 - Tactics)) / speed (4 for a creature of speed 0, where the original divides by 0), at most 4, raised to the walls' level for a walker; shares 0.2 of melee and 1 of the stand-off, a shooter's 0.1 and 0.7 without no_melee_penalty, and its shots the hero's Archery bonus (hero_archery 0x4E4160: the skill grown by its specialty and the bows, 0 without the skill) over 5, 0.2 without a hero, twice for strikes_twice, halved facing walls without the battle part's no_wall_penalty (the original names creature 35, the Arch Magi, alone). The stacks sorted by unit value, ties in slot order (the original's insertion sort; its quicksort for more than 16 stacks never runs). The casting inputs (spell points, whether it may cast, the battle tile's ground, a stack's value per hit point) come with the casts (T2c, AI-STUB-7)."
numeric  = "float"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey docs/rules/surveys/E31-computer-player.md section 2.2; E31 T1a2b, re-read blind at T2b): sim_combat_start 0x423EE0 (the army +0x28, sim_side_walls 0x424790 with the town, sim_side_build 0x424120 with the factor and the opponent); sim_side_build: Tactics +0xDC at 0x424149, the skills +0x476 and +0x477 clamped at 0x42417C to 0x424215, the roots and the factor at 0x42421A to 0x424263, hero_archery 0x4E4160 / 5.0 or 0.2 at 0x42426D, hero_creature_speed_bonus 0x4E5AA0 (artifacts 97, 69, 99 and the speed specialty, kind 5) and hero_creature_health_bonus 0x4E5B80 (artifacts 94, 95, 96, and a quarter for a living creature with 131), the unit value at 0x424325 to 0x424348, the rounds at 0x42436E to 0x424396, the shares at 0x42439A to 0x424424 (flags 0x4, 0x1000, 0x8000, creature 35), the insertion sort from 0x424453; sim_side_walls: building_bits 7 to 9, available spell 14 (+0x43E), Ballistics +0xD3"
  confidence = "high"

  [[rule.source]]
  kind       = "design"
  ref        = "ADR-0030 (accepted, AI-Q32) point 9: the original's x87 arithmetic through h3_kernel::arith; the hero's reads from the engine's battle hero (h3_heroes::derive_battle_hero: Tactics, Ballistics, the ranged rate, the stack statistic effects), the walls from h3_towns::fort_level (E31 T2b's agent decisions, E31-log.md T2b)"
  confidence = "high"

[[rule]]
id       = "CPU-SIM-002"
title    = "The simulated combat's losses"
context  = "computer"
status   = "implemented"
summary  = "A loss of a simulated side (sim_side_take_damage 0x426300): its strength less the loss (32 bits); at 0 or below the side is wiped (sim_side_wipe 0x4262B0: the strength and every stack's count and value 0); else the loss spread first over its stacks in contact by the round r (rounds to contact 1 to r), the rest over all its stacks (0 to 4). A spread over the stacks whose rounds to contact lie in lo..hi (sim_spread_losses 0x426170): the group's value the sum of theirs; each such stack in order (the weakest unit first) with value left takes ftol(its value x the loss left / the group's value left) (double precision; 0 for a group of 0, as the FPU's infinity truncates), the group less its value; a share above its value kills it and only its value is taken, else its value less the share and its count the ceiling of its value over its unit value; it stops when the loss or the group is used up, and the loss left is returned. The army after the fight (sim_apply_losses 0x424880): none with the strength at 0, else each stack with its simulated count, a count of 0 cleared; the original's flag that sends a beaten hero out of the game is the quick battle's (ai_quick_battle, ADR-0030 point 7)."
numeric  = "float"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 2.2; E31 T1a2b, re-read blind at T2b): sim_side_take_damage 0x426300 (the wipe inline at 0x42631A, sim_spread_losses with 1 and r at 0x426373, with 0 and 4 at 0x426382), sim_side_wipe 0x4262B0, sim_spread_losses 0x426170 (the group's sum at 0x42618C, the share at 0x42621B to 0x426236, the kill at 0x42624C, the ceiling at 0x426262, the stops at 0x426275 and 0x42627F), sim_apply_losses 0x424880 (army_clear_slot 0x44AB60, battle_aftermath 0x4AC930 with the flag)"
  confidence = "high"

[[rule]]
id       = "CPU-SIM-003"
title    = "The simulated combat's damage and stand-off"
context  = "computer"
status   = "implemented"
summary  = "A simulated side's damage in a round (sim_side_damage 0x426390) with the round r and a melee flag: over its stacks whose rounds to contact are at most r, the last first, count x unit value (32 bits) x share, the sum truncated after each stack: the shot share for a shooter without the flag, else the melee share; (0, no) the shots alone, (r, no) an engaging side's stacks in contact and its shots, (4, yes) every stack in melee. Its hold value (sim_side_hold_value 0x426450): over its stacks, the last first, value x hold share, truncated after each. The stand-off (sim_combat_finish 0x4264D0, and sim_engage_now's copy): each hold value stored as an f32; with either 0 nothing happens; the larger wins: the other side is wiped and the winner loses ftol(f32(loser / winner + 0.05) x loser) as a loss in round 0 (CPU-SIM-002); equal values: the first side (the attacker) is wiped and the second loses its share as well."
numeric  = "float"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 2.2; E31 T1a2b, re-read blind at T2b): sim_side_damage 0x426390 (the shot share +0x28 at 0x4263F7, the melee share +0x18 at 0x426418, crt_ftol at 0x426424), sim_side_hold_value 0x426450, sim_combat_finish 0x4264D0 (the f32 stores at 0x426546 and 0x4265A9, the comparisons at 0x4265AF to 0x4265DF, the loss at 0x42662F and 0x42671F, the spreads with 1 and 0 then 0 and 4)"
  confidence = "high"

[[rule]]
id       = "CPU-SIM-004"
title    = "The simulated combat's engagement lookahead"
context  = "computer"
status   = "implemented"
summary  = "Whether a simulated side engages its enemy in round r of 1 to 3 (sim_engage_now 0x4267C0): never when none of its living stacks with rounds to contact 1 to r exists; else a lookahead on copies of both sides for each engagement round e from 4 down to r: from r until e, while both stand, both cast (the faster side first, ties to the side asking; AI-STUB-7 until T2c) and both deal their shots alone, each loss over all the stacks; from e to round 3, while both stand, both cast, the side deals (round, no) and takes its loss on its stacks in contact by the round first, the enemy deals (4, yes) and takes its loss over all; then the stand-off (CPU-SIM-003). The score is the side's strength left, or minus the enemy's when it has none; the highest score is kept, ties to the later engagement round (the first found). True when the round kept is r."
numeric  = "float"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 2.2; E31 T1a2b, re-read blind at T2b): sim_engage_now 0x4267C0 (the reach test from 0x4267E3, the copies sim_stack_vector_copy 0x4276C0 at 0x42686A and 0x4268BB, the shots' loop 0x426910 to 0x4269C1, the melee loop 0x4269D5 to 0x426A7B, the stand-off 0x426A81 to 0x426B2B, the score and the best at 0x426B30 to 0x426B4C, the result at 0x426B9D)"
  confidence = "high"

[[rule]]
id       = "CPU-SIM-005"
title    = "The simulated combat's run"
context  = "computer"
status   = "implemented"
summary  = "A simulated combat of an attacker A against a defender B (sim_combat_run 0x426BC0): rounds 1 to 3 while both strengths are above 0: each side's choice to engage (CPU-SIM-004, A's first), the round's casts (the faster side first, equal speeds A; AI-STUB-7 until T2c), then both sides' damage at once (CPU-SIM-003): A alone engaging, A deals (round, no) and B (4, yes), A's loss first on its stacks in contact by the round; both engaging, or B alone (0x426D17, a quirk candidate of the quick battle's: B's choice makes both fight with every stack), both deal (4, yes); neither, both their shots alone (0, no); every other loss over all the stacks (CPU-SIM-002). Then the stand-off (CPU-SIM-003)."
numeric  = "float"


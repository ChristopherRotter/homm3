[[rule]]
id       = "CPU-SIM-006"
title    = "The simulated combat's casting inputs and a side's cast"
context  = "computer"
status   = "implemented"
summary  = "A side's casting inputs (sim_combat_start 0x423EE0): its spell points the hero's (0 without one); it may cast with a hero that has a spell book while neither hero has NoCasting (the Orb of Inhibition) and no anti-magic garrison stands on the tile (the original's Cursed Ground test of a game before SoD never holds); the tile's special ground (its battlefield: Cursed Ground's highest level 1, the schools a field casts at Expert); its highest spell level the ground's and both heroes' limits (Recanter's Cloak 2). A side's cast in a round (sim_cast_spell 0x425BD0): only with a strength other than 0, spell points and casting allowed; every available battle spell (the original's 10 to 69) in handle order up to that level whose cost at the hero's mastery on the ground (hero_spell_mastery 0x4E5080, hero_spell_cost 0x4E5240: the own army's and the enemy's spell_cost creatures) its points pay, with Spell Power clamped to 1..99 and its rounds the power and the duration bonus, is valued by its one AI kind (the original's switch on the flags 0x1F8000 as one value: two kinds are worth nothing): damage (CPU-SIM-007), damage once only in round 1, damage to all (CPU-SIM-008), an effect (CPU-SIM-009), stacks only for a raise (CPU-SIM-010); the highest value above 0 wins, ties to the lower spell. Its cost leaves the points; an enemy with a hero and a living stack with mana_channel (the Familiars; from the last stack, once) gains that percent of the cost, rounded down; then the spell is applied. The round's casts: the faster side's first (its highest living speed), equal speeds the first side's."
numeric  = "float"


context  = "computer"
status   = "implemented"
summary  = "pathfinder_expand 0x4B2300 for the computer's search, in the eight directions: the step priced as a human's (h3_adventure's pricing: the road, the native terrain, the hero's flying and water walking when the node has them, a boat's from water), its diagonal exception against the start points less the cost (never past the first day); the node's own points pay it, else, from a place to stop only, a new day starts with the whole land or sea maximum (the day-starting step is not taken off it: survey section 5.5 #75) and loses flying and water walking. The tile decides the node: rock and an object's blocked tile are flown or jumped over only; a tile the current player has not explored is, with the human's fog, flown over only, with the computer's (AI-Q41: the faithful policy's) only from another unexplored tile while the player owns a town, and in an enemy's reach (mode 3) read as it is; up off the entrance of an object not visited from above a flight only, down onto one never; water from land: an empty boat, a hero or a coast bank's entrance a step, another entrance a flight, plain water a sea step (flying, water walking or a boat); land from a boat a landing onto a free coastal tile only; an entrance of an object visited from the neighbouring tile, or a town's, is relaxed only from a place to stop. A flying node on an entrance is also kept as a pass node."

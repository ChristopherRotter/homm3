  confidence = "high"

[[rule]]
id       = "CPU-SIM-011"
title    = "Necromancy after a simulated win"
context  = "computer"
status   = "implemented"
summary  = "The winner's Necromancy in the fight estimate (sim_necromancy 0x426DF0): nothing without a share above 0 (hero_necromancy_power: the engine's Necromancy, HER-NEC-001, its single-precision value or its basis points as an f32); else with p = f32(share + 0.02), over the loser's army as it stood (the estimate's: the enemy's whole army) ftol(f32(min(the creature's hit points, the raised creature's) x count) x p / f32(the raised creature's hit points)), at most the count; the sum, at least 1, of the raised creature (HER-NEC-002) added to the survivors' stack of it, else their first empty slot, else nowhere (army_add_stack 0x44ACE0)."

[[rule]]
id       = "CPU-STA-002"
title    = "The recruit reserve"
context  = "computer"
status   = "implemented"
summary  = "A computer player's recruit reserve at its turn start (ai_recruit_reserve 0x429AD0; the record's +0x08): per resource the most, over its towns, of what a town's two most valuable available stacks cost. A town's stacks are its fourteen indexes with creatures available, each valued at the low 16 bits of its creature's AI value times the count in 16 bits (wrapping, then widened), sorted lowest first by the library's sort (CPU-STA-003's; at most fourteen, so by insertion: equal values keep their index order); the last two count, each its creature's cost times its count (32 bits). A town with a single stack counts none: the loop's bound, the count less 2, is compared unsigned (0x429CC6). Both are ported as read (survey section 5.5 #67, #68)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 1.5; E31 T1a1a, read whole at T2d): ai_recruit_reserve 0x429AD0 (the entries at 0x429B98 to 0x429BED: town_creatures 0x6747B4, the 16-bit product at 0x429BD4; army_entries_insertion_sort_low 0x435310; the last two at 0x429C9A to 0x429D00, creature_cost_array 0x54E7C0; the largest at 0x429D0D)"
  confidence = "high"

[[rule]]
id       = "CPU-STA-003"
title    = "The resource weights"
context  = "computer"
status   = "implemented"
summary  = "A computer player's resource weights at its turn start (ai_resource_weights 0x428740): the means (+0x24) per resource its stock plus twice the day's income (32 bits); the demand (+0x40) per resource the largest cost of a building any of its towns could build now (town_buildable_now 0x5C0F20, which does not read the day's mark: the hall's test of the town without the mark, the Capitol left out while the owner holds one), plus the full costs of the first three entries of a list of every creature with its available count summed over its towns' indexes (16 bits; from the week's fifth day each with the index's growth, TWN-GRO-001, added), valued at the count times the AI value (32 bits), sorted highest first by the library's std::sort (Visual C++ 5/6: the quicksort around the median of three down to parts of 16, then the insertion sort; equal values end where it leaves them); the rate the market's resource factor (an f32) at the count of its towns whose record lists a Marketplace not forbidden, from 1 to 10. Per resource the factor, in double precision: no demand, the rate; a demand at most the means, ((means - demand) x rate + demand) / means; more, the demand, over the means when they are above 1, at most 1 / rate; the weight (+0x60, the player's +0x128) the factor times the resource's value (resource_value 0x5ECD10, the market's). The player's mean weight (+0x160): the first six weights summed, each sum truncated, over 5."
numeric  = "float"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 1.5; E31 T1a1a, T1a2c, read whole at T2d): ai_resource_weights 0x428740 (the means at 0x428797, the buildings at 0x4287F9 to 0x42886A with building_bits 0x66CD98 and building_cost 0x5C1080, the list at 0x4288A3 to 0x428996 with town_dwelling_growth 0x5BFB60 from game +0x1F63E at least 5, the values at 0x4289A2, the sort's quicksort 0x434CE0 with army_entries_median 0x435240 and army_entries_partition 0x435290, the insertions 0x435160, the first three at 0x428B89 to 0x428C06, the Marketplaces by town_building_allowed 0x5C12A0 and market_resource_rates 0x678344 at 0x428C39 to 0x428C7E, the factor at 0x428C9F to 0x428D27, the weights at 0x428D2A, the mean at 0x428D6E to 0x428DAB)"
  confidence = "high"


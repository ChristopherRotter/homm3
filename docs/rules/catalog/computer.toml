  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 2.2; E31 T2c, the casts read whole): sim_combat_start 0x423EE0 (the points +0x18 at 0x423F3D, the book and the Orb of Inhibition 126 at 0x423F4F to 0x423F6E and 0x423FEA, tile_special_ground 0x4FCE20 and its switch at 0x423F96, map_kind +0x1F698 at 0x423FD8); sim_cast_spell 0x425BD0 (the tests at 0x425BDB to 0x425BF6, Recanter's Cloak 83 at 0x425C07 to 0x425C2C, the power at 0x425C30 to 0x425C50, hero_duration_bonus 0x4E4DB0, the loop 0x425C6C to 0x425EA2 with the level tests 0x425C8A to 0x425CA3, hero_spell_mastery and hero_spell_cost, sim_spell_init 0x436980, the switch on 0x1F8000 at 0x425CF5, the best at 0x425E6E; the cost and the Familiars 43 at 0x425EB4 to 0x425F2A; the applications from 0x425F2D)"

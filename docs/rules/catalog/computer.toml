[[rule]]
id       = "CPU-SIM-007"
title    = "The simulated combat's damage spells"
context  = "computer"
status   = "implemented"
summary  = "A damage spell's loss on a stack (the chain at 0x424DB7, sim_mass_damage_stack_loss 0x423DE0): 0 without value; else the creature's factor (creature_spell_factor 0x44A4D0 under the caster's hero and the stack's controller's: 0 for the Power of the Dragon Father's levels, Dispel's guard or an immunity, 1 for a positive spell, Dispel or a negation, else 1 less the creature's magic resistance less the controller's hero's, at least 0; BAT-MAG-005, -008, -064, -066) times f32(the damage), truncated; the target's damage factors (creature_spell_damage_factor 0x44B4B0: one spell's extra damage, the damage reduction; BAT-MAG-004); the caster's bonuses given no stack (hero_spell_damage_bonus 0x4E5760: the Orbs, Sorcery); that times the stack's value per hit point, truncated, at most its value. The damage: the spell's effect at the mastery plus its power factor times the Spell Power. Its value (sim_damage_spell_value 0x424D20): the enemy stack it takes the most from (the stacks from the last, ties to the later); with that above 0, a chain's three hops at half the damage each (toward 0) to the nearest weaker stack not yet hit that it takes something from, else the nearest stronger (0x4249D0), added; an area spell's stacks whose army slot is next to the target's that it takes something from, up to the area's radius (Inferno 2, the others 1; 0x424BF0), added. Its application (sim_damage_spell_apply 0x425260, 0x424FB0, 0x425100): the target, then the chain's hops or the area's neighbours on the stacks as they stand, each losing its loss (sim_stack_take_value 0x423EA0: above its value it dies and its value is taken, else its count the ceiling of the value left), the enemy's strength what each took. Spells are told by their data (the chain, the area) as the original tells them by their numbers."
numeric  = "float"


[[rule]]
id       = "CPU-SIM-012"
title    = "The computer's fight estimate"
context  = "computer"
status   = "implemented"
summary  = "What a fight of a computer's hero is worth (ai_army_fight_sim 0x427330), in army-value units, changing nothing: a simulated combat (CPU-SIM-001 to -010) of the hero's army against the opponent's army with its hero, the hero's side facing the town's walls, both on the tile's ground; the hero's factor its aggressiveness (AI-STUB-8: 1.0) halved for the victory condition's hero (AI-STUB-9), the enemy's 1.25, or with a human owner of either hero or the town ai_human_enemy_factor 0x6604D0 by the difficulty (0.5, 0.5, 1.0, 1.25, 1.25). A loss (the hero's side without strength): -1 000 000 000. A win: the enemy army's experience points (count x hit points, no hero's 500) grown by the hero's Learning (HER-EXP-001), truncated, times ai_experience_value 0x527710 (f32(2 500) + f32(the surviving army's value)) / f32(40 x the experience to the next level), truncated (the original's indefinite integer for a gap of 0); the survivors with Necromancy's creatures (CPU-SIM-011); less the value lost (the army's value less the survivors', 32 bits); a net loss under a quarter of the army's value counts 0. With an enemy hero or a town, plus f32(the enemy army's value) x ai_difficulty_blend 0x428710 of its owner (a town's, none for a neutral one, else the hero's): 0 for none, a computer's 1.0 on Easy else 0.75 - d / 4, a human's -0.4 (f32) on Easy else (d + 1) / 4 (ai_turn_start_values 0x527960's weights), plus f32(the value), truncated. The 5 000 000 for the victory or the loss condition's hero waits for the conditions (AI-STUB-9)."
numeric  = "float"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 2.2; E31 T1a2b, re-read at T2c): ai_army_fight_sim 0x427330 (the factor +0x47A at 0x427353, the victory hero at 0x42739F to 0x4273BE, the human tests 0x4273C1 to 0x42742A, the two sim_combat_start and sim_combat_run, the loss at 0x42748A, sim_apply_losses, army_experience_points 0x4CA3B0, hero_learning 0x4E4840, ai_experience_value 0x527710, sim_necromancy, army_value 0x44AC80, the net at 0x427547 to 0x427566, the owner at 0x427577 to 0x427587, ai_difficulty_blend 0x428710, the conditions 0x4275BB to 0x42760C); hero_reset 0x4D8720 at 0x4D890A to 0x4D8967 (the aggressiveness draw); ai_turn_start_values 0x527960 (the weights)"
  confidence = "high"

[[rule]]

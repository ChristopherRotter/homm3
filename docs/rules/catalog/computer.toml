[[rule]]
id       = "CPU-SIM-008"
title    = "The simulated combat's mass damage"
context  = "computer"
status   = "implemented"
summary  = "A spell that damages every stack (sim_cast_spell 0x425D4B, sim_mass_damage_enemy_loss 0x4253E0): its value the enemy's stacks' losses (CPU-SIM-007) summed less the own stacks' (the caster's hero their controller too) while the own sum is below both the side's strength and the enemy's sum, else nothing. Its application (0x425F7A to 0x4260EA): over the caster's stacks from the last a running total of their losses never reset (0x425FF6): a stack whose value is below the total dies and the total becomes its value (0x426028), else it loses the total; the side's strength loses the total at each stack; over the enemy's stacks from the last a total of the value the stack before took plus the stack's own loss, taken from it (sim_stack_take_value, 0x4260C6), the enemy's strength losing what each took. The carried totals are survey section 5.5's candidate #8 (state: the quick battle's), ported as read."
numeric  = "float"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 2.2; E31 T2c, read whole): sim_cast_spell 0x425D4B to 0x425DE5 (the value) and 0x425F7A to 0x4260EA (the application, the site sim_mass_damage_carry 0x425FF6), sim_mass_damage_enemy_loss 0x4253E0, sim_mass_damage_stack_loss 0x423DE0, sim_stack_take_value 0x423EA0"
  confidence = "high"

[[rule]]
id       = "CPU-SIM-009"
title    = "The simulated combat's other spells"
context  = "computer"
status   = "implemented"
summary  = "Any other battle spell (sim_other_spell_value 0x425510): nothing for a spell that only counters the enemy's spells (the Protections, Anti-Magic, Dispel, Magic Mirror, Cure; the original's 30 to 37) when the enemy cannot cast. A stack's part (0x423C80): 0 without value; else ftol(f32(the AI value at the mastery x min(rounds, 5) x the stack's value, 32 bits) x f32(the creature's factor, CPU-SIM-007) / 500). Dispel: its own stacks under the caster's hero, from Advanced the enemy's too, the stacks from the last; a mass version sums, else the best stack is kept (ties to the later one valued); at Advanced an enemy stack that beats the own value is its target. A positive spell values the own stacks, any other the enemy's. Its application (0x425B10, 0x4258A0): Dispel at Expert on both sides (the own as positive, the enemy's as negative), below on its target; another spell on the own side if positive, else on the enemy's: its aimed stack, or for a mass version every stack with value whose part is above 0, changes its value and its unit value up (positive) or down by its part and by unit x part / value (64 bits, toward 0), and its value per hit point to the new value over the old value times the old value per hit point (0x4259B2, survey section 5.5 #65: a slip, the hit points would be the old value over it; the quick battle's, state, ported as read). The side's strength stays."
numeric  = "float"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (survey section 2.2; E31 T2c, read whole for the first time): sim_other_spell_value 0x425510 (spells 30 to 37 at 0x42552B to 0x42556F, Dispel from 0x425575, the mastery tests at 0x42567D and 0x425723, the polarity at 0x425751), sim_stack_spell_value 0x423C80, sim_other_spell_apply_call 0x425B10, sim_other_spell_apply 0x4258A0 (the division sub_617AD0, the value per hit point at 0x4259A5 to 0x4259B5 and 0x425AD0 to 0x425AE2)"
  confidence = "high"

[[rule]]
id       = "CPU-SIM-010"
title    = "The simulated combat's raises"
context  = "computer"
status   = "implemented"
summary  = "Resurrection and Animate Dead, the stacks spells that raise (sim_cast_spell 0x425DF8, 0x42610D; 0x423D00): the own stack (from the last, ties to the later) a raise brings back the most to: nothing for a stack that lost no creatures or that the spell cannot affect (the creature's factor under the caster's hero 0); else the spell's effect at the mastery plus its power factor times the Spell Power, with the caster's spell specialty by the creature's level (hero_spell_specialty_bonus 0x4E5FF0), in hit points, times the stack's value per hit point, truncated, over its unit value (toward 0), at most the creatures it lost, times its unit value. The application gives the stack that over its unit value in creatures and that times its unit value in value; the side's strength stays (survey section 5.5 #66, the quick battle's, ported as read)."

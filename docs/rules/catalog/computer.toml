[[rule]]
id       = "CPU-PTH-001"
title    = "The computer's search: its set-up, start, loop and open list"
context  = "computer"
status   = "implemented"
summary  = "The original's computer pathfinder (pathfinder_run 0x56B440 in its modes 1 to 5: the value field's local search, the colleagues' claims, an enemy's reach, the hero's own search and its search again during the walk; h3_adventure::search, E31 T2i0, AI-Q41): from a tile with the caller's start points (also the day's points) and bound, inside a box (the whole map, or the caller's), over two nodes per tile and level (a place to stop, bit 10, and a pass). The start node: cost, second cost and key 0, the danger the tile's, flying and water walking from the hero's levels (none in a boat), a place to stop unless a flying or water-walking hero's tile fails the flight's tile test; in the modes from 3 a start on a monolith's or a Subterranean Gate's entrance goes through it at once (a copy with the visit mark and the second cost plus 50). The open list is kept sorted by the score S (the key, plus the danger past the day's points) and, for an equal S, by the second cost from highest to lowest, a new entry before its equals; the loop takes the back (the highest S, the lowest second cost, the oldest of equals), skips it when the next one is the same node, reloads the node and expands it; a node standing on an entrance (stop) only when the passage past it allows (CPU-PTH-005), a boat node only on water. At 500 entries an insert first drops the back entry, the best (as read: a slip candidate, survey section 5.5 #74). The reached list holds each place-to-stop node once, in the order first reached; the result's nodes are their final values."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E31 T2i0; survey docs/rules/surveys/E31-computer-player.md section 1.11): pathfinder_run 0x56B440 (the set-up 0x56B46F to 0x56B731, the start node 0x56B7DD to 0x56B8F9, the start's channels 0x56B9AA to 0x56B9E8, the loop 0x56BA14 to 0x56BC79), pathfinder_reset 0x4B1530, the open list's insert in pathfinder_relax 0x4B1A70 (0x4B1DE7 to 0x4B1EC2) and the reached list (0x4B2166 to 0x4B22E1)"
  confidence = "high"

[[rule]]
id       = "CPU-PTH-002"
title    = "The computer's search: a node relaxed"
context  = "computer"
status   = "implemented"
summary  = "pathfinder_relax 0x4B1A70 for the computer's search: the new node's cost is the source's plus the step's price, its second cost the source's plus the extras the step added plus the price; refused off the map or outside the box. Its danger is the caller's tile buffer at the tile (the danger map; 0 without one), past the day's points the lower of that and the source's, and a node past the day's points at or below -500 000 000 is refused. Its score S is its key plus, past the day's points, its danger. Against the node stored there (if reached): a higher stored S refuses it, a lower one makes it better, an equal one keeps it only with a strictly smaller second cost. A node whose cost passes the bound (a positive bound) and is not better is refused and marks the search short. It records the source tile, whether the source was a place to stop, the direction, the guard met, the stop flag (the tile's entrance), and the no-magic mark (the stored node's, else the tile's ground: Cursed Ground or an anti-magic garrison)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E31 T2i0; survey section 1.11): pathfinder_relax 0x4B1A70 (the costs 0x4B1A7E to 0x4B1AA9, the box 0x4B1AAC to 0x4B1B04, the danger 0x4B1BBC to 0x4B1C32, the comparison 0x4B1CB8 to 0x4B1CF9, the bound 0x4B1CFF to 0x4B1D15, the marks 0x4B1D21 to 0x4B1DBF, the writes 0x4B1EC4 to 0x4B1F13)"

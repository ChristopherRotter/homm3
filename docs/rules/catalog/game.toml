[[rule]]
id       = "GAM-BAT-006"
title    = "Necromancy after a battle: the creatures raised join the winner's army"
context  = "game"
status   = "implemented"
summary  = "When a battle on the map ends with a winner whose hero stays on the map (GAM-BAT-002; after a victory, a retreat or a surrender of the loser, not a draw), its hero's Necromancy (HER-NEC-001, HER-NEC-002) raises, after the experience: for each record of the loser that lost creatures (start - end; every record: army stacks, raised and summoned stacks, clones and war machines), killed x min(its type's hit points, the raised creature's) x the share / the raised creature's hit points, rounded down, at most the record's killed (hit points without artifacts); the sum, at least 1 if anything was killed. Under quirk Q-0005 the original's arithmetic: per record trunc(f32(min(hp, raised hp) x killed) x share / f32(raised hp)) in its x87 arithmetic, with the share in single precision (10 imps at 70 %: 6, not 7); its 32-bit product, which wraps above 2^31, is not modelled. They join the hero's stack of that creature, else a new stack in its first free slot; in a full army without one, (2c + 2) / 3 of the creature's first upgrade join its stack of the upgrade, if it has one, else none join. Told to the hero's owner only (`CreaturesRaised`: the creature and the count that joined). The original's elementals exception (no upgrade for 112 to 115 while a game flag is off) is not modelled: no hero raises them. E08 T19a2b: `GameState::heroes_after_battle`, `AdventureState::raise`."
numeric  = "float"
quirks   = ["Q-0005"]


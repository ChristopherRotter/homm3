[[rule]]
id       = "GAM-RES-001"
title    = "A player's treasury: never negative, gains saturate"
context  = "game"
status   = "implemented"
summary  = "Each player keeps an amount of every resource kind of the core ruleset (seven in the original packs), never negative. A gain adds to it and saturates at 2^31 - 1; the original adds with a 32-bit wrap and sets a negative result to 0, so a gain past 2^31 - 1 drops the resource to 0 (A-5: a state-corrupting bug, fixed without a flag; unreachable in increment 2, whose largest gain on a shipped map is 100 000 gold). Only the owner sees its treasury. E08 T13a: `h3_game::Treasury` in `GameState`, the owner's observation; T13b: the gains of visits."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E08 T11a, survey docs/rules/surveys/E08-objects.md §7.1, confirmed by a second reading): the seven resources are 32-bit signed amounts in the player record (game +0x20AD0 + 0x168 x colour, resources at +0x9C, gold +0xB4); every gain goes through 0x4E3600, which adds with 32-bit wrap and sets a negative result to 0, with no upper bound"
  confidence = "high"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "lib/gameState/GameStatePackVisitor.cpp visitSetResources: every change clamped to 0 ... 10^9 (PLAYER_RESOURCES_CAP); lib/CPlayerState.h PlayerState::resources, config/resources.json in the same order"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/gameState/GameStatePackVisitor.cpp"
  retrieved  = "2026-10-12"
  confidence = "medium"
  note       = "Agrees that a treasury never goes negative; caps at 10^9 where the original wraps (the engine saturates at 2^31 - 1, the original's largest positive amount)."


summary  = "The game holds what a visit still owes its hero (a rest) beside the decisions and runs it once the owner has no open decision, after every command (`apply`), the last held first: so a visit's own rests come before those of the visit it is part of, and after every command each held rest's owner has an open decision (a turn never ends with one; the hash covers them; no player sees one but through the decisions it leads to). The rests: (1) the visit of the monster guarding the hero's tile after the visit of the tile's own entered object (ADV-MON-006): after its questions, choices, University, army dialog, the experience and the levels they gave; (2) a reward record's experience, computed with the record (HER-CHG-003), given with its levels once the record's army dialog closes (ADV-RWD-001); (3) what a won battle against an object's guards gives, after the winner's levels: a guarded pile's, artifact's or scroll's pickup, a Pandora's Box's or an event's record, a Pyramid's loot and spell (`AdventureState::give_won`; read when given, so the levels' skills decide what the hero can receive or learn; nothing when the object left the map meanwhile); (4) an event on a guarded tile after the guard's visit, for a hero still on its tile (ADV-OBJ-007, `ADV-QUIRK-29`). The original runs the dialogs, the battle and its levels inside the visit and goes on after them; the engine's player has at most one open decision (ADR-0017 point 6), so the visit's tail waits. Before E08 T63b the guard's visit came as soon as the object's decision closed, beside what its answer opened (a level-up opened with the guard's battle, whose hero was read before the level), and the rewards came before the winner's levels (`ADV-STUB-10`). E08 T63b: `GameState::run_rests`, `AdventureOutcome::{guard_after, reward_after, event_after}`, `AdventureState::{give_won, fire_held_event}`."

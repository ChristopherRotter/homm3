 observation (`GameObservation::battle`). The command that ends it applies its outcome (GAM-BAT-002, GAM-BAT-003, GAM-BAT-005) and closes the decision. E08 T19a: `GameState::start_battle`, `battle_command`, `OpenBattle`, `AdventureState::battle_ground`."

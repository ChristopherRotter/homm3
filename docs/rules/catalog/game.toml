[[rule]]
id       = "GAM-DEC-001"
title    = "A pending decision: its owner's only legal commands are its answers"
context  = "game"
status   = "implemented"
summary  = "What needs a player's answer is a pending decision in the game's state, owned by that player and kept in opening order (increment 2: a Cartographer's offer, ADV-VIS-001; a border guard's, ADV-VIS-004, E08 T15a). While a player has an open decision its only legal commands are the answers, Accept and Decline (`legal_commands`), it has no legal moves, and `EndTurn` or a move is rejected (`DecisionOpen`) and changes nothing; it blocks no other player. An answer closes the player's first decision, in its turn or not; answering with none open is rejected (`NoDecision`). Accepting pays the offer's price from the treasury (a guard's offer has none) and carries the offer out; declining changes nothing else, and a later visit asks again. An offer whose price the treasury cannot pay is not opened (`OfferRefused`, to its owner only). ADR-0017 point 10's checks at the answer: that the offer still stands is checked (`AdventureState::offer_stands`; another player of the same turn group may have passed the guard, which then left the map): an acceptance of an offer that no longer stands is rejected (`OfferGone`) and changes nothing, and `legal_commands` then lists `Decline` alone; that the treasury can pay cannot fail in increment 2 (nothing but the owner's answer runs for it while the decision is open, and no other player's command reaches its treasury) and is not made. The opening, the answer and the payment are told to the owner alone; the owner's observation shows its open decision (the object by type and anchor, the offer's kind with a Cartographer's price). E08 T14b: `GameCommand::Answer`, `GameState::decision`, `GameObservation::decision`; T15a: `OfferKind`, `OfferGone`."
numeric  = "integer"

  [[rule.source]]
  kind       = "design"
  ref        = "ADR-0017 point 6 (pending decisions: the owner's only legal commands are the answers, no blocking prompt, a decline only closes) and point 10 (an offer opens only if the payer can pay, else it is told so; accepting pays and calls the context's acceptance)"
  confidence = "high"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe: the Cartographer's visit (0x4A8A14) asks a yes/no question (a message box of mode 2) that the player answers before play goes on, and shows a message instead when the gold is short; survey E08-objects.md §4 and §10"
  confidence = "high"

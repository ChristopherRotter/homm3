title    = "Starting resources by the game's difficulty"
context  = "game"
status   = "implemented"
summary  = "A game starts every player with the starting resources of the game's difficulty (0 easy to 4 impossible): a human player 30, 20, 15, 10, 0 wood and ore each, 15, 10, 7, 4, 0 of each rare resource and 30 000, 20 000, 15 000, 10 000, 0 gold; a computer player 5, 10, 15, 15, 15 wood and ore, 2, 4, 7, 7, 7 rare and 5 000, 7 500, 10 000, 10 000, 10 000 gold. The engine has no human/computer distinction, so every player gets the human row (E08 decision 16); the computer rows are data for later. The difficulty is the game's, chosen when it starts (`GameSetup.difficulty`, the import's default normal), not the map header's rating. Not modelled: the computer players' daily bonus and the tutorial's start (survey §7.2, inc. 4). E08 T13a: `h3_game::GameState::new`, the rows in `adventure.toml`."
numeric  = "integer"


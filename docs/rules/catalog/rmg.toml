  ref        = "Heroes3.exe code reading (E14 T1a1, T2c): rmg_generate_map 0x5499A1 to 0x549ACD (the two eight-byte arrays at ebp-0x14 and ebp-0xC zeroed, the zones' marks 0x5499BF to 0x5499F9, the colours listed 0x549A0D to 0x549A43, the players' loop 0x549A45 to 0x549A84, the computers' 0x549A86 to 0x549ACD, +0xEE0 nine entries set to -1); survey E14-generator.md §1.5, §2.1"
  confidence = "high"


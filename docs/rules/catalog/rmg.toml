  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E14 T1a2a, T2c): rmg_templates_read 0x537FF0 (0x53807B to 0x538177 the template rows, 0x5381DA to 0x53821E a connection row), rmg_template_zones_read 0x538480; survey E14-generator.md §2.1, §3.1"
  confidence = "high"

  [[rule.source]]
  kind       = "original-data"
  ref        = "H3bitmap.lod's and H3ab_bmp.lod's Rmg.txt, read by h3-pack-rmg's original_data check against the harvested packs (E14 T2b)"

# Rule catalog: rmg (map generation, the original's random map generator ported; ADR-0029, E14).
# Format: docs/04-rules-and-sources.md §3. The code reading of Heroes3.exe (GOG Complete, SoD's
# code; scripts/exe.py, docs/exe/) is the primary source, the oracle (the original generating under
# Wine, docs/lanes/rmg/ORACLE.md) the observation; the survey docs/rules/surveys/E14-generator.md
# holds the readings (§3.2 the rules by phase). Increment 2 (E14 T2b, T2c): the settings, the
# tables, the template and the positions; increment 3 (E14 T3c, T3d): steps 1 and 2, the zones;
# increment 4 (E14 T4b): the object model the steps place with (RMG-OBJ-009 to -011), steps 4 and
# 5, the towns (RMG-TWN-001 to -005).

[[rule]]
id       = "RMG-SET-001"
title    = "The players' Random choices"
context  = "rmg"
status   = "implemented"
summary  = "random_map_generate draws the tab's Random players as h + rand() % (9 - h), h the colours marked human (site 0x586168), then their Random teams as rand() % players + 1 (0x586183); teams of 0 or more than the players become the players. The original draws them from the game's rand state before the generator's seed, which no port reproduces: resolve_random applies the formulas to a stream the caller seeds (ADR-0029 point 2). No players (h 0 and a draw of 0, or a choice of 0) is refused: the teams' draw would divide by them (RMG-QUIRK-3)."
quirks   = ["RMG-QUIRK-3"]
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E14 T1a1, T2c): random_map_generate 0x5860E0, 0x586103 to 0x58619B (the human slots counted, rmg_choice_players_draw 0x586168, rmg_choice_teams_draw 0x586183, the teams' clamp 0x586191); survey E14-generator.md §1.1"
  confidence = "high"

  [[rule.source]]
  kind       = "design"
  ref        = "ADR-0029 point 2: the settings hold every choice resolved; resolve_random applies the original's formulas to a stream the caller seeds"
  confidence = "high"

[[rule]]
id       = "RMG-SET-002"
title    = "The computers' Random choices"
context  = "rmg"
status   = "implemented"
summary  = "With 8 players there are no computers and no computer teams (nothing drawn). Otherwise Random computers are rand() % (9 - players) (0x5861B1), and computers above 8 less the players become 8 less the players; without computers the computer teams are 0 (nothing drawn); with computers Random computer teams are rand() % computers + 1 (0x5861E4), 0 becomes the computers. Computer teams above the computers, which the original turns into the players' count, are refused with a typed error (RMG-QUIRK-6, exploit-fix)."
quirks   = ["RMG-QUIRK-6"]
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E14 T1a1, T2c): random_map_generate 0x58619E to 0x586205 (rmg_choice_computers_draw 0x5861B1, the clamp 0x5861C3, rmg_choice_computer_teams_draw 0x5861E4, 0 the computers 0x5861F8, above them the players 0x586205); survey E14-generator.md §1.1"
  confidence = "high"

[[rule]]
id       = "RMG-SET-003"
title    = "The monsters' Random choice"
context  = "rmg"
status   = "implemented"
summary  = "Random monster strength is rand() % 3 (0x58621D): 0 weak, 1 normal, 2 strong, the parameters' -1, 0, 1 (the dialog's choice less 1), drawn after the computers' choices. Water's Random is not drawn here: it goes on as 3 (RMG-SET-007)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E14 T1a1, T2c): random_map_generate 0x586208 to 0x58622C (rmg_choice_monsters_draw 0x58621D; a chosen strength is the dialog's +0x18BC less 1); survey E14-generator.md §1.1"
  confidence = "high"

[[rule]]
id       = "RMG-SET-004"
title    = "The settings and their checks"
context  = "rmg"
status   = "implemented"
summary  = "A map is generated with the tab's choices resolved: the size (S, M, L, XL: 36, 72, 108, 144 tiles a side, square), one or two levels, each colour's human flag and town type (0 to 8, Castle to Conflux, or Random), the players (1 to 8, the humans among them), their teams (1 to the players), the computers (at most 8 less the players), their teams (1 to the computers, 0 without), water (none 0, normal 1, islands 2, Random 3), monster strength (weak, normal, strong) and the format: the setup's 1 AB (version 1, 0x15), 2 or 3 SoD (version 2, 0x1C), else RoE (version 0, 0x0E). Settings outside those ranges are refused with a typed error before anything is drawn (an untrusted input)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E14 T1a1, T2c): random_map_generate 0x58622D to 0x58624A (the version), rmg_parameters_init 0x54BF00 (rmg_parameters: human flags +0, towns +8, width +0x28, height +0x2C, underground +0x30, players +0x34, teams +0x38, computers +0x3C, computer teams +0x40, water +0x44, monsters +0x48, version +0x4C); survey E14-generator.md §1.1"
  confidence = "high"

  [[rule.source]]
  kind       = "design"
  ref        = "docs/06-security.md: settings are untrusted input, refused with typed errors (ADR-0029 point 2: generate never panics)"
  confidence = "high"

[[rule]]
id       = "RMG-SET-005"
title    = "The run's adjustments"
context  = "rmg"
status   = "implemented"
summary  = "rmg_generate_and_write gives the generator the parameters' monster strength plus 3 clamped to 1..5 (weak 2, normal 3, strong 4) and, when the players and computers together are fewer than 2, one player and one computer (the computer teams unchanged). The run's codes: 0 done, 1 an exception, 2 the writer failed, 3 no template (GENRLTXT 750 to 752); the port returns typed errors instead."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E14 T1a1, T2c): rmg_generate_and_write 0x54BF60 (0x54BF8C the clamp, 0x54BFA4 to 0x54BFB4 one and one), rmg_run 0x54C090 (code 1); survey E14-generator.md §1.2"
  confidence = "high"

[[rule]]
id       = "RMG-SET-006"
title    = "The seed and the stream"
context  = "rmg"
status   = "implemented"
summary  = "The generator seeds the C runtime's rand with time() in seconds (srand at 0x536148, before the objects are read) and draws every later number of the generation and the writing from that one stream (KER-RNG-004). The port takes the seed as input (a u32) and reports each draw with its call site to the trace (ADR-0029 point 8). With water chosen, the first draw is the template's (RMG-TPL-007)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E14 T1a1): rmg_generator_base_init 0x536070, crt_time 0x6198E0, rmg_seed_srand 0x536148; survey E14-generator.md §1.3"
  confidence = "high"

  [[rule.source]]
  kind       = "observation"
  ref        = "The phase oracle (E14 T1b2, ORACLE.md): each map's log starts with its seed, the description names it; the 21 corpus cases' first draw after srand(seed) is the template's (h3rmg.py templates; E14 T2c compared the port's draws before step 1 with the logs)"
  confidence = "high"


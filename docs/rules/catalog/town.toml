[[rule]]
id       = "TWN-SET-005"
title    = "The hero pool"
context  = "town"
status   = "implemented"
summary  = "The game keeps a hero pool (ADR-0017's E09 paragraph; `GameState`'s, game state hash v23): per hero type of the core ruleset whether it is free, taken (by a colour, or as a prisoner) or out of the game, and the colours that may take it. Built with the game, before any draw: each type the map allows (`GameSetup::allowed_heroes`) free, the rest out; each type's colour mask the AND of the setup's masks of it (`GameSetup::hero_masks`, SoD's disposed heroes; 0xFF without one); then, whatever the allowed set, every placed hero's type taken by its owner's colour and every prisoner's taken as a prisoner (T-3 fixed, TWN-QUIRK-3), then each player's pick reserved, taken by its colour (T-2 fixed, TWN-QUIRK-2). A drawn hero's type is taken by its owner's colour at once (TWN-SET-007, -008); a pick no random hero took goes back free after the build's draws (the agent's call, design note section 14); a hero that leaves the map in play (every hero a battle's end removes) goes back free. E09 T7b1 (design note section 14): `h3_game`'s `town::pool::HeroPool`, `GameState::new`, `end_battle`. Not yet: the main towns' heroes (TWN-SET-009, E09 T7b2); the tavern's draws and a defeated player's heroes (E09 increment 3)."

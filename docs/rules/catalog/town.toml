context  = "town"
status   = "implemented"
summary  = "A battle at a town (any fort level) is fought on its faction's native terrain, whatever the tile (water, the underground or the coast), on the special ground's battlefield when one lies on the entrance, never the coast's shore nor a boat's deck (the original's battlefield setup takes a siege's terrain first, then the tile's special ground in every case); a faction without a native terrain keeps the terrain the visit gives (the tile's in the original's order), still without the shore's battlefield. A battle at a tile that is not the town's entrance is no siege (the game finds a siege's town by its tile at its end). Its natural obstacles: without a fort the usual ones on that terrain and battlefield, from the battle's obstacle seed (GAM-BAT-001, ADV-QUIRK-5); with a fort none, but a town with a Citadel or a Castle draws the usual ones beside the walls when its faction's record's `siege_obstacles` is set: the base pack's Stronghold (no moat there), which the SoD pack's override clears (the packs decide, not the game's version: E09 decision 14; the E04c survey's S-29); below a Citadel, never. E09 T6b (design §6): `h3_towns::siege_obstacles`. Since E09 T8b1 (design §15): `h3_game`'s `town::siege_setup` (the terrain, the battlefield), the obstacles by `generate_setup_obstacles` (none at a fort); the walled Stronghold's usual obstacles are `TWN-STUB-8` (their placement keeps off the walls by a branch for town type 6 not read, 0x466147 to 0x466194, and the battle's generator knows no walls)."

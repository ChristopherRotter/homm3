summary  = "At the game's build each town's buildings ever built and forbidden are set from the map's (h3m) set, its faction's record read through the map editor's 41 slots (a slot without one of the faction's buildings gives nothing). The record's Village Hall (its building of `hall` 1) is always ever built, even when a custom set forbids it. A custom set: forbidden its forbidden slots' buildings and, to a fixpoint, each building whose `forbidden_with` is forbidden (a horde's upgrade with its horde); built each built slot's building with every building it supersedes, less the forbidden; no draw. A standard set: the Fort (`fort` 1) with the map's flag; an owned town its Tavern (the building of role `tavern` that supersedes no other, not the Castle's Brotherhood of the Sword) and, only with the map's Fort, the level-1 dwelling and, when one draw of 1 to 100 from the setup stream is at most the part's `level_2_dwelling_chance` (the base pack's 30), the level-2 one (owned without a Fort: no dwelling and no draw; the draw is made with the Fort whether or not the record has the dwellings); a neutral town both dwellings, Fort or not, without a draw (TD-3); each with what it supersedes. Then the hordes' upgrade (decision 29): a building not forbidden whose non-empty `auto_with` is all ever built becomes ever built with what it supersedes, to a fixpoint, so that a horde and its level's upgraded dwelling stand as the upgraded horde alone. The standing set is derived from the ever-built set, so a custom set's horde never leaves its dwelling standing (the original's does: TWN-QUIRK-5, fixed). Not yet: the start's forbidden Grail building on a Grail-victory map in another town and Shipyard without a boat's spot (TWN-STUB-2, increments 2 and 4). The game draws the garrison (TWN-SET-004) before the buildings. E09 T6c (design §5): `h3_towns::town_buildings_setup`, `h3_towns::town_setup`; the game calls them at its build (E09 T7b, design §14)."

[[rule]]
id       = "TWN-SIE-002"
title    = "The garrison's merge into a defending visitor's army"
context  = "town"
status   = "verified"
summary  = "Before a siege a town's visitor defends (TWN-SIE-001), the town's garrison joins the visitor's army by each stack's value (its creature's AI value times its count), round after round: the visitor's weakest stack (the least value, of equal ones the last slot); each garrison stack's gain, its value when the army has room for it (a stack of its creature that takes it within a stack's most, ADV-ARM-007, else a free slot: the original's army_add_stack), else its value less the weakest's; the stack of the greatest positive gain (of equal ones the first slot) joins the army where it has room, else changes places with the weakest stack (creatures and counts swapped, each keeping its slot), which stays in the garrison; until no stack gains. What stays in the garrison does not fight: it stays there after the defender's win (the visitor keeps the merged army) or a battle without a winner, and is lost with the town after the attacker's (TWN-CAP-001's capture empties it). The game merges as it starts the siege the step gave, and tells each slot the merge changed, the visitor's then the garrison's (`ArmyRef::Garrison`), to its army's owner as the army dialog's `StackChanged` (the visitor's slots to the visitor's owner, the garrison's to the town's, a neutral town's to nobody) (*agent's call*, the user's choice of 2026-11-05: a garrison army reference, which no army command may name before the town screen of increment 3: `ArmyCommandError::Garrison`), before `BattleStarted`. E09 T8b2b (design section 10): `h3_adventure`'s `town::merge` and `AdventureState::merge_garrison`; `h3_game`'s `town::merge`, called by `settle_outcome` before `start_battle`. Since E09 T28b2 only before a siege a lone visitor defends: a garrison hero defends with its own army (its town's garrison is empty while it stands there, TWN-ROW-002), and the visitor's battle beside one is no siege (TWN-SIE-001)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E09 T1b1, garrison_merge 0x44B820 read whole; survey E09-towns.md section 9.2): a stack's value the creature's AI value (its record's +0x40) times its count; per round the visitor's weakest stack (the least value, the last slot of equal ones), each garrison stack's gain (its value with a stack of its creature or an empty slot in the visitor's army, else its value less the weakest's), the greatest positive gain (the first slot of equal ones) joining by army_add_stack (0x44ACE0), else changing places with the weakest; until no gain"

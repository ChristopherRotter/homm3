# Town rules (context `town`, crate `h3-towns`; E09): a town's record, its setup, the derivations
# over it (the hall and the day's income, the siege's facts, the reveal, the Tavern, the
# Capitol's limit) and the town on the map (ADR-0028). Format: docs/04-rules-and-sources.md §3.
# Survey: docs/rules/surveys/E09-towns.md; ids: docs/epics/E09-design.md §19 (created by E09 T6b).

[[rule]]
id       = "TWN-INC-001"
title    = "A town's day's gold: its hall and the Grail"
context  = "town"
status   = "implemented"
summary  = "A town's hall level is its highest standing building of role `hall` (1 the Village Hall to 4 the Capitol); a town without a standing hall counts as level 1 (the original pays the Village Hall's gold without testing for it). Its day's gold is the part's `hall_gold` of that level (the base pack's 500, 1 000, 2 000, 4 000), plus `grail_gold` (5 000) when a building of role `grail` was ever built; the faction plays no other part (at most 9 000 in the original packs), gold being the part's `gold` resource. Several Capitols at the start each pay 4 000 (the start never applies TWN-CAP-002). Paid at each day's start from day 2 to the town's owner only (a neutral town pays nobody; a town captured during a day pays its new owner the next day): the day's advance, E09 T8c (design §16). E09 T6b (design §6): `h3_towns::hall_level`, `h3_towns::daily_income`'s gold."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E09 T1b2a; survey E09-towns.md sections 11.1 to 11.3): town_gold_income (0x5BF600) starts at 500 and tests the Town Hall (11), the City Hall (12) and the Capitol (13) in the built set +0x150, the last found kept (1 000, 2 000, 4 000; the Village Hall 10 not tested), and adds 5 000 for the Grail building (26) in the every-built set +0x158; player_gold_income (0x4C7930) sums the owner's towns at each day's start from day 2"
  confidence = "high"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "VCMI 1.7.5 as read by survey E09-towns.md section 11.5: CGTownInstance::dailyIncome over each built building that no built upgrade supersedes (config/buildingsLibrary.json: the halls 500, 1 000, 2 000, 4 000, the Grail 5 000)"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/mapObjects/CGTownInstance.cpp"
  retrieved  = "2026-11-02"
  confidence = "medium"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Heroes 3 wiki, Halls and Grail (survey E09-towns.md section 11.5): the same amounts; a map may give a player two or more Capitols; the Grail building's 5 000 in every town"
  url        = "https://heroes.thelazy.net/index.php/Halls"
  retrieved  = "2026-11-02"
  confidence = "medium"

[[rule]]
id       = "TWN-CAP-001"
title    = "A town's capture: the reveal for its new owner"
context  = "town"
status   = "implemented"
summary  = "When a town changes owner (a capture, and each owned town at the start) its new owner sees the tiles within the part's `reveal_radius` (the base pack's 5) of the town, or within the largest `reveal` of a building ever built when larger (the Tower's Lookout Tower, 20); a building that reveals `all` (the Tower's Grail) shows every tile of every level, over any radius; a part without parameters reveals a radius of 0. The capture itself, the owner change and its reveal on the map, are E09 T8a's (design §11). E09 T6b (design §6): the reveal's radius, `h3_towns::reveal`."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E09 T1b1; survey E09-towns.md section 8.3 step 8): town_change_owner (0x4C61E0) reveals for the new owner with reveal_disk (0x49D160) radius 5 around the gate, radius 20 for a Tower (faction 2) with the Lookout Tower (building 21), every tile of the surface and of the underground for a Tower with the Grail (26); town_setup calls it for every town at the start (the same radii as reveal_owned)"
  confidence = "high"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "VCMI 1.7.5 as read by survey E09-towns.md section 9.5: CGTownInstance::onTownCaptured reveals the fog for the new owner at getSightRadius (a base setting and sight bonuses)"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/mapObjects/CGTownInstance.cpp"
  retrieved  = "2026-11-02"
  confidence = "medium"

[[rule]]
id       = "TWN-CAP-002"
title    = "The Capitol's limit: one per player after a capture"
context  = "town"
status   = "implemented"
summary  = "After a capture, a town with a standing building of role `hall` 4 (the Capitol) whose new owner holds another town with a standing Capitol loses it: the Capitol leaves the ever-built set and the record's `capitol_demoted_to` (its hall-3 building, the City Hall) enters it, so that the City Hall stands; a neutral owner never loses it. The start never applies it, so a map may give a player several Capitols (survey §11.3). E09 T6b (design §6, §11): `h3_towns::capitol_limit`, written by the store's `Towns::apply_capitol_limit` (its caller the game's capture after the adventure's, E09 T8a)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E09 T1b1; survey E09-towns.md sections 8.1, 8.2, 8.4 and 11.3): capitol_limit (0x5BEC60, read whole), after town_change_owner: a town with the Capitol (13) in its built set whose owner has another town with the Capitol loses it, 13 leaving the built (+0x150) and every-built (+0x158) sets and the City Hall (12) entering the built one; a neutral owner skips it; its only callers are town_visit's capture paths (0x4AB1BA, 0x4AB363), town_setup never calls it"
  confidence = "high"

  [[rule.source]]
  kind       = "vcmi"
  ref        = "VCMI 1.7.5 as read by survey E09-towns.md sections 8.4, 9.5 and 11.5: CGTownInstance::setOwner calls removeCapitols, which razes a captured Capitol the same way, only for a change in play"
  url        = "https://github.com/vcmi/vcmi/blob/1.7.5/lib/mapObjects/CGTownInstance.cpp"
  retrieved  = "2026-11-02"
  confidence = "medium"

  [[rule.source]]
  kind       = "wiki"
  ref        = "Heroes 3 wiki, Halls (survey E09-towns.md section 11.5): a captured Capitol becomes a City Hall when the captor already holds one, the only downgrade of a building; a map may give a player two or more Capitols"
  url        = "https://heroes.thelazy.net/index.php/Halls"
  retrieved  = "2026-11-02"
  confidence = "medium"

[[rule]]
id       = "TWN-VEW-002"
title    = "The garrison's levels a viewer sees"
context  = "town"
status   = "implemented"
summary  = "Another team's viewer sees a town's garrison by its level, the number of the viewer's towns with a standing building of role `tavern` (the Tavern, or Castle's Brotherhood of the Sword that supersedes it), at most 2: 0 nothing (not even whether it is empty), 1 each stack's creature by slot, 2 also each stack's size word (E08's monster words); the counts are the owner's team's and Visions' (TWN-VEW-003). E09 T6b (design §6): what a town counts, `h3_towns::has_tavern`; the level and the views are E09 T8c's (design §12)."
numeric  = "integer"

  [[rule.source]]
  kind       = "original-data"
  ref        = "Heroes3.exe code reading (E09 T1b2a; survey E09-towns.md section 12.3): town_popup (0x4167A0) sets the level at 0x416E63: 3 for the owner's team or Visions at level 3 in reach (hero_visions_level 0x4E5DE0, hero_visions_reach 0x4E5E10), else player_tavern_count (0x4CCE30: the viewer's towns with the Tavern, 5, built, or for Castle the Brotherhood of the Sword, 22, that replaces it), at most 2; quick_view_army (0x530990) shows nothing at level 0, each stack's creature at 1, also its size word (creature_quantity_word 0x44ADE0) at 2"

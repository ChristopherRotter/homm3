rd. Since E09 T37b (decision 138, design note section 70) each type the map customises map-wide (`GameSetup::custom_types`, GAM-HER-001) that is still free once the build's heroes took theirs (so neither a type the map does not allow nor a prisoner's) gets its record at the build, after the build's heroes in type order, and the taverns offer it as the map sets it (the original sets up every type's hero before the first fill, placed_heroes_setup 0x4CAE10)."

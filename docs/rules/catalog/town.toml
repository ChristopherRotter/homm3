summary  = "A player may pick its starting hero before the game is built (the setup's `PlayerStart::pick`, which whoever seats the players may change, E09 decision 6; a map's import picks none). The pick must be one of the player's offer: none unless its faction choice is fixed and its main town generates its hero or it has the random-hero flag; then the first 16 hero types in the ruleset's type order that the map allows (`GameSetup::allowed_heroes`), that no placed hero and no prisoner has, of a hero class of the chosen faction, and that the player's colour may take (SoD's colour masks: every mask of the type has the colour's bit). The game refuses (E09 T7a2, `GameSetup::validate`) a pick outside the offer (`GameSetupError::Pick`) and a pick an earlier player also has (`PickTaken`). The original's dialog knows only the map's allowed set and the masks, so it would offer a placed hero's or a prisoner's type; none is allowed on the shipped maps (survey section 4.2), and leaving them out keeps a pick off a hero already on the map (the design note's section 13). The pick is reserved in the pool before every draw (T-2 fixed, TWN-SET-005, E09 T7b1) and goes to its player's first random hero (TWN-SET-008). Not yet: a human player's main-town hero (TWN-SET-009, E09 T7b2)."

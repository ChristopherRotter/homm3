[[rule]]
id       = "TWN-SET-001"
title    = "A player's factions at the start"
context  = "town"
status   = "implemented"
summary  = "Each playing colour starts with a set of factions and a choice among them (the setup's `PlayerStart`, the seam whoever seats the players may change before the build, E09 decision 6). A map's import gives the set: the map's allowed towns (a bit per faction in the format's order, `TOWNTYPE.TXT`'s: Castle 0 to Fortress 7, Conflux 8 from AB on) that the ruleset has as factions with a town record; a bit past the nine names none. An RoE-format map's player whose eight bits are all set also has Conflux when the ruleset has it (E09 decision 14: the enabled expansions decide, not the map's format; the original's map-format test is the recorded deviation, TD-2); one restricted to fewer stays restricted. The choice is the set's faction when it holds exactly one, else Random; no starting-hero pick. With the start come the player's main town (the town whose entrance is the header's position, survey finding 3; one that is no town's entrance is refused, TWN-QUIRK-4), whether it generates the starting hero (the map's flag, an RoE map's always) and the random-hero flag. The game refuses (E09 T7a2, `GameSetup::validate`, `GameSetupError::Choice`) a player whose set holds a faction without a town record (so a draw always gives one, TWN-QUIRK-4), whose choice is a fixed faction outside its set or Random over an empty set, or who has no choice while its start needs a faction (a main town, the random-hero flag, a random hero of its own or a random town aligned to its colour; the agent's call); and a main town that is none of the setup's towns (`MainTown`). A Random choice is drawn when the game is built, uniform over the player's set, from the setup stream before every other draw, in player order (E09 T7b1, design note section 14; the resolved faction is not kept), when the player's start reads it (a main town, the random-hero flag, a random hero of its own or a random town aligned to its colour): a choice nothing reads draws nothing (the agent's call, E09 T7b1; the original draws every colour's, with no effect but on its stream). Not yet: a main town of another owner, refused once the towns have owners (E09 T8a, the user's cut of 2026-11-04). E09 T7a1 (design note sections 7 and 13): `h3_map::import` (`import/town.rs`, `starts`), `h3_game::PlayerStart`."

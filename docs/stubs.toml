[[stub]]
id     = "TWN-STUB-2"
where  = "crates/h3-towns/src/setup.rs::town_buildings_setup"
reason = "The start's two forbids the original adds before a town's buildings (E09 survey E09-towns.md section 5.3 step 2; design note E09-design.md section 5, 'Not now'): the Grail building forbidden in every town a Grail-victory map's condition does not name (0x5F2160, increment 2, with the victory conditions) and the Shipyard forbidden when the faction has none or neither tile two rows below the entrance, one column left or right, is a boat's spot (0x5C0C90, increment 4, with the Shipyard). Until then a custom set's built Shipyard without water is kept (the siege's keep counts it) and the Grail building may be built anywhere"
epic   = "E09"

[[stub]]
id     = "TWN-STUB-6"
where  = "crates/h3-game/src/town/heroes.rs::main_town_heroes"
reason = "A main town's hero learns none of the town's guild spells at the start (TWN-SET-009; E09 T7b2b): the original's main_town_heroes calls town_heroes_learn_spells 0x5BE030 at 0x4CA1A2 after placing the hero, which teaches the town's visitor and garrison hero the spells of the town's Mage Guild when that hero has a spell book and the town has its Mage Guild ever built (building 0); VCMI 1.7.5 teaches them nothing at the start: a dispute for increment 4, when the guild's spells are drawn (they are not yet). The census (h3-map's example original_data, seed 0): 33 of the 523 main towns' heroes of the 156 shipped maps that build start with a spell book in a main town with a Mage Guild built"
epic   = "E09"

[[stub]]
id     = "TWN-STUB-8"
where  = "crates/h3-game/src/town/siege.rs::siege_setup"
reason = "A walled town whose faction's record draws natural obstacles in a siege (TWN-SIE-005, h3_towns::siege_obstacles: the base pack's Stronghold with a Citadel or a Castle, as RoE and AB play it; the SoD pack's override clears it, so the full pack set never meets it) gets none (E09 T8b1): the battle's generator (generate_setup_obstacles) places none at a town with a fort, and generate_battlefield_obstacles knows no walls, while the original's placement (0x466010) keeps every obstacle hex off a blocked hex (the walls) and takes a branch for a siege of town type 6 on the game's version that is not read (0x466147 to 0x466194; docs/formats/installation.md section 7.26). Lifted by a siege-aware draw in h3-battle (the battle lane's inbox) after that branch is read"
epic   = "E09"

[[stub]]

# --- ai (AI-STUB-<n>) ---

[[stub]]
id     = "AI-STUB-1"
where  = "crates/h3-battle/src/world.rs::determinized"
reason = "A search agent's world (E06 T8b, ADR-0025 point 12a) places the other side's hidden spell obstacles again by their rule, but keeps their number and value: the cast is public, while the number of pits or mines and a mine's value follow the caster's mastery, which is private. A world should take them from the guessed hero's mastery (the cast's rule) instead; the twin tests vary only the hexes. Also kept: a random caster's last drawn spell for stacks other than the active one (Casts::last), which only the computer's cast choice reads, never a rule or a search. Moved to E25 at E06's last checkpoint (the user, 2026-10-27): it matters only to a search trained on its own choices. Two more gaps found by E06 T9b's review (the user, 2026-10-27: E25's, with this one), each against ADR-0025 point 12a.2 (its third, the magic limits recomputed with the guess, closed 2026-10-28: a world keeps what the battle forbids every caster, BAT-MAG-061, BAT-MAG-062): a world keeps the true other hero's morale and luck modifiers (`BattleState::modifiers`, BAT-HER-003: built from its private effects at the start), so two battles that differ only in its artifacts give different worlds; and without a guess (a scenario batch, a hero type outside the distribution) `public` only removes war-machine control, so the other side's commanded Ballista, tent or Catapult acts automatically in every world"
epic   = "E25"

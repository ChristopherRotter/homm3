# --- battle (BAT-STUB-<n>) ---

[[stub]]
id     = "BAT-STUB-1"
where  = "crates/h3-battle/src/observe.rs::observe_as"
reason = "The observation does not show which dead created stacks vanished when their rounds ran out (Created::vanished). Since the E04b T11b review that mark decides whether a later created stack takes the record (BAT-MAG-037, BAT-MAG-052), so the observation is not complete on this point (ADR-0014 point 8): a public per-stack field for the next observation-encoding bump (BAT-Q35)"
epic   = "E05"

[[stub]]
id     = "BAT-STUB-8"
where  = "crates/h3-battle-ai/src/casts.rs"
reason = "The computer's creature casts take only the targets the engine accepts (the user, E23 T4a; ADR-0027 point 3): the original's Faerie Dragon may also aim an area spell at a free hex, its own or an immune stack's (its cast routine tests nothing for a creature's cast; the rules' cursor, BAT-MAG-049, only a stack the spell affects), so its best hex there is passed over; the original's raise ignores the engine's slot test for the raised Demons (BAT-MAG-052). The dragon's targets settle with BAT-Q32 (1) (BAT-AI-012, BAT-AI-013)"
epic   = "E23"

[[stub]]
id     = "BAT-STUB-10"
where  = "crates/h3-battle-ai/src/walker.rs::Walker::choose"
reason = "The original's walker (0x421680) values every record of the other side, a hypnotized walker itself included (no test against it): one without retaliation (a Harpy) plans a move and attack on itself, which the engine refuses. The port leaves the walker out of its candidates (the user, E23 T4b2; ADR-0027 point 3); what the original does with that attack is open (BAT-Q58)"
epic   = "E23"

[[stub]]
id     = "BAT-STUB-11"
where  = "crates/h3-battle-ai/src/ends.rs"
reason = "With BAT-QUIRK-25's slip 22 (BAT-Q59) the besieger's walk and the guard of a shooter take their hex from the map a spell context's last search left, which the walker's own walk may not reach: the original's walk then writes nothing and the besieger's walk (0x421E15) and the guard (0x4208DE) return true with the action fields as they were (the last predicted move and attack or the battle's last action, installation.md §7.52, §7.53). The port does not model those fields: it defends there (BAT-AI-005, BAT-AI-010)"
epic   = "E23"

[[stub]]
id     = "BAT-STUB-15"
where  = "crates/h3-battle-ai/src/tactics.rs::in_zone"
reason = "In the tactics phase the original's computer tests only a stack's position hex against the zone (0x4763F0: its shooter's placement, its walk's end); the engine places a two-hex stack only with both hexes in the zone (BAT-TAC-002), so the policy asks both and a two-hex walker stops a hex short of the original's end (BAT-AI-023)"
epic   = "E23"

[[stub]]
id     = "BAT-STUB-16"
where  = "crates/h3-battle-ai/src/tactics.rs::turn"
reason = "The original's Defend in the tactics phase ends the stack's turn (0x479706); the engine's phase has no Defend and its Wait makes the stack wait first (BAT-TAC-002). The policy gives Wait, and a walker below Hard that has waited Wait again at once, but on Hard and above a walker that defended is asked again among the waited stacks, where the original's turn had ended (BAT-AI-023)"
epic   = "E23"

# --- adventure (ADV-STUB-<n>) ---

[[stub]]
id     = "ADV-STUB-8"
where  = "crates/h3-game/src/legal.rs::default_answer"
reason = "The system actor's default answer to a level-up (ADR-0017 point 6) is the original's choice (HER-LVL-006) with the setup's inputs (ArmyWorth::SETUP and the map's terrain shares), as at load (GAM-SET-002): the original's flag-set path when the dialog's time runs out reads the computer player's state with the army counted (survey E08-progression.md §10.4, ADV-Q17, decision 60), which the engine gets with E10"
epic   = "E10"

[[stub]]
id     = "ADV-STUB-9"
where  = "crates/h3-game/src/state/battle.rs::start_battle"
reason = "A battle from the map leaves BattleSetup.retreat (ADR-0027 point 14: each hero's experience, its artifacts' worth, a Tavern town of its player to hire it again, whether the scenario's victory condition wants it defeated) at its default, which never retreats: the facts are read only for a computer player's hero, which the engine gets with E10, and the Tavern needs towns (E09) and the condition E10's scenarios (E08 decision 123, T54)"
epic   = "E10"

[[stub]]
id     = "ADV-STUB-10"
where  = "crates/h3-game/src/state.rs::choose_by_default"
reason = "Increment 7's new decisions wait for T63's typed answers (E08 decision 150, T62a): a visit's choice is answered at once with its default (the chest's gold, the Arena's first skill, a School left; ADR-0017 point 6) and a University is left at once, instead of opening as their owner's decisions (GAM-DEC-005, GAM-DEC-006); a won guarded artifact's or scroll's pickup is given before the winner's level-ups (`state/battle.rs::end_battle`), not as the visit's rest after them (GAM-DEC-007, E08 decision 141)"
epic   = "E08"


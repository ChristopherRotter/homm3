# --- town (TWN-STUB-<n>) ---

[[stub]]
id     = "TWN-STUB-2"
where  = "crates/h3-towns/src/setup.rs::town_buildings_setup"
reason = "The start's two forbids the original adds before a town's buildings (E09 survey E09-towns.md section 5.3 step 2; design note E09-design.md section 5, 'Not now'): the Grail building forbidden in every town a Grail-victory map's condition does not name (0x5F2160, increment 2, with the victory conditions) and the Shipyard forbidden when the faction has none or neither tile two rows below the entrance, one column left or right, is a boat's spot (0x5C0C90, increment 4, with the Shipyard). Until then a custom set's built Shipyard without water is kept (the siege's keep counts it) and the Grail building may be built anywhere"
epic   = "E09"

[[stub]]
id     = "TWN-STUB-3"
where  = "crates/h3-game/src/town.rs::main_town_heroes"
reason = "The main towns' heroes and the towns' draws (design note E09-design.md section 14; E09 T7b2, after T8a): a setup whose main town generates a hero is refused with `GameSetupError::HeroDraw` until the main towns' heroes (TWN-SET-009) and the towns' factions, buildings and garrisons are built. The hero pool and the random heroes' draws exist since E09 T7b1. Of the 160 shipped maps 156 import; since T7b1 31 build whole and the other 125 are refused here (the census, `h3-map`'s example `original_data`)"
epic   = "E09"

[[stub]]
id     = "TWN-STUB-4"
where  = "crates/h3-adventure/src/state.rs::StaticMap::place"
reason = "A town's entrance is not entered until its step (design note E09-design.md section 9; E09 T8a2): since E09 T8a1 a town is typed (ObjectKind::Town, ownable, entered, not from above) but its object marks no typed visit on its entrance (StaticMap's typed_visits), so the step, the reachable tiles and the legal moves meet a blocker's entrance there exactly as before the town was typed: no hero ends on or passes it (AdventureCommandError::Visit), and a hero standing on it leaves it upwards too (the from-above test, ADV-OBJ-004, reads no town). The reach's and the step's loops test nothing more. T8a2 marks the entrance, builds the step's three cases and lifts this"
epic   = "E09"

[[stub]]
id     = "TWN-STUB-5"
where  = "crates/h3-game/src/town/build.rs::start_radius"
reason = "A town whose start reveals every tile (h3_towns::Reveal::All: a Tower with its Grail, the Skyship, ever built) reveals only its own level (design note E09-design.md section 8; since E09 T7b2a, narrowed from the towns' garrisons and radii, which the game now passes): the adventure's start takes one radius per town (AdventureState::start_game's town_radii, a u8 by TownId), and the game gives Reveal::All a radius of 255, whose disc covers every tile of the town's level on a map of up to 181 tiles a side (the base pack's largest is 144) but not the other level of a two-level map, which the original reveals too (survey E09-towns.md section 8.3 step 8). A whole-map reveal at the start (and at T8a2's capture) needs the adventure to take one. The census (h3-map's example original_data): none in the 31 shipped maps that build; 9 towns of the imported maps have a custom set with such a Grail built (an upper bound: a random town's Grail slot counts)"
epic   = "E09"

# --- ai (AI-STUB-<n>) ---

[[stub]]
id     = "AI-STUB-1"
where  = "crates/h3-battle/src/world.rs::determinized"
reason = "A search agent's world (E06 T8b, ADR-0025 point 12a) places the other side's hidden spell obstacles again by their rule, but keeps their number and value: the cast is public, while the number of pits or mines and a mine's value follow the caster's mastery, which is private. A world should take them from the guessed hero's mastery (the cast's rule) instead; the twin tests vary only the hexes. Also kept: a random caster's last drawn spell for stacks other than the active one (Casts::last), which only the computer's cast choice reads, never a rule or a search. Moved to E25 at E06's last checkpoint (the user, 2026-10-27): it matters only to a search trained on its own choices. Two more gaps found by E06 T9b's review (the user, 2026-10-27: E25's, with this one), each against ADR-0025 point 12a.2 (its third, the magic limits recomputed with the guess, closed 2026-10-28: a world keeps what the battle forbids every caster, BAT-MAG-061, BAT-MAG-062): a world keeps the true other hero's morale and luck modifiers (`BattleState::modifiers`, BAT-HER-003: built from its private effects at the start), so two battles that differ only in its artifacts give different worlds; and without a guess (a scenario batch, a hero type outside the distribution) `public` only removes war-machine control, so the other side's commanded Ballista, tent or Catapult acts automatically in every world"
epic   = "E25"

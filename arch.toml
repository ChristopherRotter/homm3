# Architecture declaration, enforced by `cargo xtask check-arch` (ADR-0005, docs/02-architecture.md §2).
#
# Layers, lowest first: shared < domain < application < adapter. `tool` crates (xtask) sit outside.
# A dependency must point to a strictly lower layer, except shared -> shared and adapter -> adapter.
# Domain contexts never depend on each other. Every workspace member must be declared here, and every
# dependency edge (workspace or external, normal or build) must be listed under `deps` / `external`.
# Dev-dependencies (tests, benches) are checked against `dev_deps` / `dev_external`.
#
# `logic = true` marks pure game-logic crates: no I/O, clock, threads, globals, HashMap/HashSet,
# ad-hoc floats or unsafe; they must carry the logic lint header in src/lib.rs and pass the
# forbidden-token scan below. They are the crates with the 100% coverage gate.

[policy]
# Inner attributes every logic crate root (src/lib.rs) must carry. `no_std` makes I/O, clocks,
# threads, environment access and std's HashMap/HashSet unavailable at compile time.
logic_attributes = ["no_std"]
# Lints every logic crate root must set with `#![forbid(...)]`, and with `#![deny(...)]` or
# `#![forbid(...)]`. Relaxing any of them (`allow`/`expect`/`warn`, also inside `cfg_attr`) in
# non-test logic code is a violation unless listed under [[policy.lint_allow]].
logic_forbid = ["unsafe_code"]
logic_deny = [
    "clippy::unwrap_used",
    "clippy::expect_used",
    "clippy::panic",
    "clippy::todo",
    "clippy::unimplemented",
    "clippy::unreachable",
    "clippy::float_arithmetic",
    "clippy::print_stdout",
    "clippy::print_stderr",
    "clippy::exit",
]

[[policy.lint_allow]]
file = "crates/h3-kernel/src/num.rs"
lint = "clippy::float_arithmetic"

# Token sequences forbidden in logic crate sources (comments and string literals are ignored;
# matching is on whole tokens, so `unsafe_code` does not match `unsafe`). `allowed_in` lists the
# files where the token is sanctioned. A line carrying `// arch-ok: <RULE-ID or ADR-NNNN> <reason>`
# is exempt; the reference is mandatory. Use sparingly, the exemption shows up in review.
[[policy.forbidden]]
token = "HashMap"
reason = "unordered iteration (ADR-0003 §8)"
[[policy.forbidden]]
token = "HashSet"
reason = "unordered iteration (ADR-0003 §8)"
[[policy.forbidden]]
token = "std"
reason = "logic crates are no_std + alloc; std access is only allowed in tests (ADR-0005)"
[[policy.forbidden]]
token = "static mut"
reason = "global mutable state (ADR-0003 §10)"
[[policy.forbidden]]
token = "unsafe"
reason = "unsafe in logic (ADR-0002)"
[[policy.forbidden]]
token = "f32"
reason = "floats only through kernel::num (ADR-0003 §4)"
allowed_in = ["crates/h3-kernel/src/num.rs"]
[[policy.forbidden]]
token = "f64"
reason = "floats only through kernel::num (ADR-0003 §4)"
allowed_in = ["crates/h3-kernel/src/num.rs"]
[[policy.forbidden]]
token = "sort"
reason = "sorting must use kernel::order with a unique tie-breaker (ADR-0003 §9)"
allowed_in = ["crates/h3-kernel/src/order.rs"]
[[policy.forbidden]]
token = "sort_by"
reason = "sorting must use kernel::order with a unique tie-breaker (ADR-0003 §9)"
allowed_in = ["crates/h3-kernel/src/order.rs"]
[[policy.forbidden]]
token = "sort_by_key"
reason = "sorting must use kernel::order with a unique tie-breaker (ADR-0003 §9)"
allowed_in = ["crates/h3-kernel/src/order.rs"]
[[policy.forbidden]]
token = "sort_unstable"
reason = "sorting must use kernel::order with a unique tie-breaker (ADR-0003 §9)"
allowed_in = ["crates/h3-kernel/src/order.rs"]
[[policy.forbidden]]
token = "sort_unstable_by"
reason = "sorting must use kernel::order with a unique tie-breaker (ADR-0003 §9)"
allowed_in = ["crates/h3-kernel/src/order.rs"]
[[policy.forbidden]]
token = "sort_unstable_by_key"
reason = "sorting must use kernel::order with a unique tie-breaker (ADR-0003 §9)"
allowed_in = ["crates/h3-kernel/src/order.rs"]
[[policy.forbidden]]
token = "sort_by_cached_key"
reason = "sorting must use kernel::order with a unique tie-breaker (ADR-0003 §9)"
allowed_in = ["crates/h3-kernel/src/order.rs"]

[[policy.forbidden]]
token = "ptr_eq"
reason = "pointer identity never enters logic or the hash; only the persistent structures may use it as a shortcut (ADR-0016 point 2)"
allowed_in = ["crates/h3-adventure/src/persistent.rs"]
[[policy.forbidden]]
token = "as_ptr"
reason = "pointer identity never enters logic or the hash; only the persistent structures may use it as a shortcut (ADR-0016 point 2)"
allowed_in = ["crates/h3-adventure/src/persistent.rs"]

# Edges the layers would allow but a decision rules out: rejected whether `deps` declares them or
# not (ADR-0005's amendment of 2026-10-14).
[[policy.forbidden_edge]]
from = "h3-battle"
to = "h3-heroes"
reason = "the battle sees only BattleHero, never the hero model (ADR-0013 point 2)"

[crate.h3-kernel]
layer = "shared"
logic = true
deps = []
external = []
dev_deps = []
dev_external = ["proptest"]

[crate.h3-content]
layer = "shared"
logic = true
deps = ["h3-kernel"]
external = []
dev_deps = []
dev_external = ["proptest"]

# The battle's ruleset part (R01, ADR-0015 point 3): compiled on the core `h3-content` from one
# battle pack per core pack, like the adventure's part.
[crate.h3-content-battle]
layer = "shared"
logic = true
deps = ["h3-kernel", "h3-content"]
external = []
dev_deps = []
dev_external = ["proptest"]

[crate.h3-contracts]
layer = "shared"
logic = true
deps = ["h3-kernel", "h3-content"]
external = []
dev_deps = []
dev_external = []

[crate.h3-battle]
layer = "domain"
logic = true
deps = ["h3-kernel", "h3-content", "h3-content-battle", "h3-contracts"]
external = []
dev_deps = []
dev_external = ["proptest"]

# The hero model (ADR-0013 point 2, amended by E08 T18a): hero details, their validation, what a
# hero has from them in every context, hero changes and the translations to the battle's types.
# Shared layer, beneath the contexts that read it (the adventure, the game); the battle never
# depends on it (a forbidden edge below).
[crate.h3-heroes]
layer = "shared"
logic = true
deps = ["h3-kernel", "h3-content", "h3-contracts"]
external = []
dev_deps = []
dev_external = ["proptest"]

# The adventure context (ADR-0015, ADR-0016; E08). A domain context: it never depends on another
# context or on h3-game; it reads a hero's details through the hero model (ADR-0016 point 3).
[crate.h3-adventure]
layer = "domain"
logic = true
deps = ["h3-kernel", "h3-content", "h3-contracts", "h3-heroes"]
external = []
dev_deps = []
dev_external = ["proptest"]

# The whole game (ADR-0015 point 1, ADR-0017; E08): the first application crate, and a logic
# crate. It wires the adventure and the battle (increment 3), keeps the store of heroes (the hero
# model) and bundles the battle's ruleset part (ADR-0017 points 1 and 11).
[crate.h3-game]
layer = "application"
logic = true
deps = ["h3-kernel", "h3-content", "h3-contracts", "h3-heroes", "h3-content-battle", "h3-battle", "h3-adventure"]
external = []
dev_deps = []
dev_external = ["proptest"]

# .h3m reader and import into the setup types (ADR-0015 point 4; E08 T3). Map files are untrusted:
# property-tested on arbitrary bytes. The experiment maps' writer (moved here from h3-formats with
# the content split, R01a).
# miniz_oxide: a map file is a gzip stream.
[crate.h3-map]
layer = "adapter"
logic = false
deps = ["h3-kernel", "h3-content", "h3-contracts", "h3-adventure", "h3-game"]
external = ["miniz_oxide"]
# Dev: the rulesets of the packs for the import and play tests; the battle part (E08 T19a) for the
# game's rules bundle, which battles need.
dev_deps = ["h3-pack", "h3-pack-adventure", "h3-content-battle", "h3-pack-battle"]
dev_external = ["proptest"]

# packs/*/adventure.toml -> the adventure's definitions (ADR-0015 point 2; E08 T4).
[crate.h3-pack-adventure]
layer = "adapter"
logic = false
deps = ["h3-kernel", "h3-content", "h3-adventure", "h3-pack"]
external = ["serde", "toml"]
dev_deps = []
dev_external = []

# packs/*/core.toml -> the core's definitions (R01 decision 6).
[crate.h3-pack]
layer = "adapter"
logic = false
deps = ["h3-kernel", "h3-content"]
external = ["serde", "toml"]
dev_deps = []
dev_external = []

# packs/*/battle.toml and the battle scenarios -> the battle's definitions and setups (R01
# decision 6).
[crate.h3-pack-battle]
layer = "adapter"
logic = false
deps = ["h3-kernel", "h3-content", "h3-content-battle", "h3-contracts", "h3-pack"]
external = ["serde", "toml"]
dev_deps = ["h3-heroes", "h3-battle"]  # hero details and their battle effects checked against the harvested packs
dev_external = []

[crate.h3-sim]
layer = "adapter"
logic = false
# h3-game and h3-adventure: AdventureEnv in the adventure-owned src/adventure/ (ADR-0017 point 8).
deps = ["h3-kernel", "h3-content", "h3-content-battle", "h3-contracts", "h3-battle", "h3-adventure", "h3-game"]
external = []
dev_deps = ["h3-pack-battle", "h3-map", "h3-pack-adventure"]
dev_external = ["proptest", "criterion"]

[crate.h3-ffi]
layer = "adapter"
logic = false
deps = ["h3-kernel", "h3-content", "h3-contracts", "h3-battle", "h3-pack-battle", "h3-sim"]
external = []
dev_deps = []
dev_external = []

[crate.h3-cli]
layer = "adapter"
logic = false
# The adventure crates: the adventure commands in the adventure-owned src/adventure/ (ADR-0017 point 8).
deps = ["h3-kernel", "h3-content", "h3-content-battle", "h3-contracts", "h3-battle", "h3-pack-battle", "h3-sim", "h3-adventure", "h3-game", "h3-map", "h3-pack-adventure"]
external = ["serde", "toml"]
dev_deps = []
dev_external = []

# The server's published language and session core (E16, ADR-0018 point 1): a logic crate in the
# adapter layer, so the decoder at the trust boundary is under the purity checks and the 100 % gate.
# `postcard`: a round-trip test of the wire types (provisional, E16 M1 review).
[crate.h3-protocol]
layer = "adapter"
logic = true
deps = ["h3-kernel", "h3-content", "h3-content-battle", "h3-contracts", "h3-battle"]
external = ["serde", "serde_json"]
dev_deps = ["h3-pack-battle", "h3-sim"]
dev_external = ["proptest", "postcard"]

# The server binary (E16, ADR-0018): the I/O shell around h3-protocol. `h3-cli` for the pack,
# scenario and replay-file functions (provisional, E16 M1 review; else they move into h3-sim).
# `ed25519-dalek` checks logins; `argon2` derives the test client's keys (E16 M3, ADR-0019).
[crate.h3-server]
layer = "adapter"
logic = false
deps = ["h3-kernel", "h3-content", "h3-content-battle", "h3-contracts", "h3-battle", "h3-pack-battle", "h3-sim", "h3-cli", "h3-protocol"]
external = ["serde", "serde_json", "toml", "tokio", "tokio-tungstenite", "futures-util", "getrandom", "ed25519-dalek", "argon2", "rustls", "rustls-graviola", "rustls-native-certs"]
dev_deps = []
dev_external = ["tokio-rustls"]

# Readers for the original game's files; used only by the harvesting tool (E02, Q13).
[crate.h3-formats]
layer = "adapter"
logic = false
deps = []
external = ["miniz_oxide"]
dev_deps = []
dev_external = ["proptest"]

# One-off harvester: original files -> committed packs base/ab/sod (E02, Q13). Tool layer: nothing
# may depend on it.
[crate.h3-harvest]
layer = "tool"
logic = false
deps = ["h3-formats", "h3-pack-battle"]
external = ["serde", "toml"]
dev_deps = ["h3-content", "h3-content-battle"]
dev_external = []

# Experiment compiler: spec -> SoD .h3m + results template for the user (E04a T2, Q28). Tool layer.
# h3-map: the map writer (R01a).
[crate.h3-experiment]
layer = "tool"
logic = false
deps = ["h3-formats", "h3-map"]
external = ["serde", "toml"]
dev_deps = []
dev_external = []

[crate.xtask]
layer = "tool"
logic = false
deps = []
external = ["serde", "toml", "serde_json"]
dev_deps = []
dev_external = []

# object), the neutral ones (73 to 79). Ownable and entered as base's. Creatures:
# dwelling_creatures 0x63D570[subclass] (load_dwelling_body 0x4FED40, dwelling_record_init
# 0x4B8860; survey section 2.2). Footprint: the subclass's last template in Objects.txt
# (H3ab_bmp; random_dwellings_resolve 0x502B60 step 5, survey section 3.2), blocked the
# passability mask's '0' cells, visitable the visitability mask's '1' cells, as [columns left,
# rows up] of the anchor. Names: CrGen1.txt by subclass.

# original class 17 subclass 59 (CrGen1.txt row 59; dwelling_creatures 0x63D570[59] = 118; Objects.txt AVGpixie.def, the subclass's last template)

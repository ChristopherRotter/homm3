# Armageddon's Blade's adventure-map data (E08 T4; format: crates/h3-pack-adventure). Hand-written
# source; the harvester never writes this file (E08 decision 10). AB holds the same movement.txt
# and adds no terrain, road or river.

# ADV-VIS-005 (E08 T12a): border gates (class 212, AB and SoD; subclass = the key colour as for
# the base pack's tents and guards). Never removed; a key holder's heroes enter and cross it, the
# others visit it from the neighbouring tile (0x4A8DD0, 0x480EE2, 0x56ABB1). VCMI
# CGBorderGate::passableFor and the wiki (Border Gate: "from Armageddon's Blade on"): the same.


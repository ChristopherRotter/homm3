# The Shadow of Death's adventure-map data (E08 T4; format: crates/h3-pack-adventure). Hand-written
# source; the harvester never writes this file (E08 decision 10).
#
# SoD adds no terrain, road or river of its own.

# ADV-GRD-001 (E08 T20a2a): the Shadow of Death's special grounds (classes 222 to 231 but 225,
# Favorable Winds, which changes no battle). Each lies on its picture's tiles and is never
# visited; a battle on a tile it lies on is fought on its battlefield. Code reading 0x4643B0 and
# 0x4FCE20 (installation.md section 7.26): Clover Field 222 field 5, Evil Fog 224 4, Fiery Fields
# 226 7, Holy Ground 227 3, Lucid Pools 228 6, Magic Clouds 229 9, Rocklands 231 8; the SoD
# pictures of Cursed Ground (223) and Magic Plains (230), which that list lacks, fight on Cursed
# Ground and Magic Plains (E04c batch 3a, D-4: an observation). VCMI 1.7.5
# config/objects/generic.json gives each the same battleground (and Favorable Winds the ship's,
# a battle on a boat: later increments).
[[object_type]]
id = "clover_field"
name = "Clover Field"
visit = "enter"
from_above = true
ground = { battlefield = "clover_field" }


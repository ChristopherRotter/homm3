# E08 T72 (design section 5; survey E08-sea.md section 4.1 point 1): Favorable Winds (225), a ground
# of the sea: it lies on its picture's tiles (water only), is never visited and changes no battle;
# a boat's step from a tile it tops costs the parameters' sea_ground share (ADV-SEA-004, T73).
[[object_type]]
id = "favorable_winds"
name = "Favorable Winds"
visit = "enter"
from_above = true
sea_ground = {}

# ADV-TEL-001 (E08 T103a, increment 11's design note sections 1 and 3; survey E08-teleporters.md
# sections 1 and 2): the monoliths of channels 3 to 7 (classes 43, 44 and 45, subclass = channel),
# which only SoD's Objects.txt lists (H3bitmap.lod's: 0 to 7) and only SoD maps place; channels 0
# to 2 are the base pack's. Pictures AVXmn4i0 to AVXmn8b0: channel 3 one visitable tile at the
# anchor with one blocked, channels 4 to 7 one left of it with two blocked; the maps' templates
# rule (42 SoD monoliths block one tile where Objects.txt blocks two).
[[object_type]]
id = "monolith_entrance_3"
name = "Monolith One Way Entrance 3"
visit = "enter"
from_above = false
monolith = { channel = 3, way = "entrance" }


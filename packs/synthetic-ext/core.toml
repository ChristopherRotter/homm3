# Synthetic expansion pack (E02 pack format v2): exercises dependencies and overrides the way the
# harvested `ab` and `sod` packs do. Invented names and numbers.
# This file: the manifest and the core data (pack format v35, R01); the battle data: battle.toml.

[pack]
id = "synthetic-ext"
version = "0.1.0"
depends = ["synthetic"]

[[faction]]
id = "marsh"
name = "Marsh"

[[creature]]
id = "lurker"
name = "Lurker"
plural = "Lurkers"
faction = "marsh"
level = 3
speed = 6
cost = { "synthetic:coin" = 200 }
growth = 5
fight_value = 300
ai_value = 310
adventure_count = [8, 16]
flags = ["alive"]
# Format v50 (E08 T81b): an ability outside battle, read by the game's day (GAM-RES-005).
abilities_outside_battle = [{ kind = "weekly_resource", resource = "synthetic:shard", amount = 2 }]

# Changes to creatures of the base pack: only the listed fields change.
[[creature_override]]
target = "synthetic:wisp"
faction = "marsh"           # the expansion adopts a neutral creature
level = 2
upgrades = ["lurker"]       # pack format v3 (E04a T3): the upgrade comes with the expansion

[[creature_override]]
target = "synthetic:brute"
growth = 8
cost = { "synthetic:coin" = 110, "synthetic:shard" = 1 }

# Artifacts (E04a T3b): one more charm position, and a combination that needs all three.
[[artifact_slot_override]]
target = "synthetic:charm"
count = 3

[[artifact]]
id = "storm_regalia"
name = "Storm Regalia"
class = "relic"
slot = "synthetic:charm"            # locks two more charms and the crown
parts = ["synthetic:lucky_knot", "synthetic:gloom_bell", "synthetic:sight_lens", "synthetic:iron_crown"]
effects = [
    { kind = "shoot_when_adjacent", creatures = { flag = "shooter" } },
    { kind = "alignment_group", factions = ["synthetic:vale", "marsh"] },
    # Format v37 (E08 T18a): kinds no battle reads (the outcome's and the adventure's). Here, not
    # in `synthetic`, so the battle replays' ruleset hash stays.
    # Format v40 (E08 T19a2b): a share only without the skill.
    { kind = "necromancy", bp = 500, unless_skill = "synthetic:keen_eye" },
    { kind = "experience_gain", bp = 500 },
    { kind = "max_mana", bp = 2500 },
    { kind = "join_bonus", level = 1 },
    # Format v38 (E08 T19a2): the creature raised, by the hero's level in a skill.
    { kind = "raises", priority = 1, skill = "synthetic:keen_eye", by_level = ["synthetic:shade", "synthetic:wisp", "lurker", "synthetic:chanter"] },
    # Format v39 (E04c T6): the Ballistics level (the Catapult's control, BAT-SIE-011).
    { kind = "ballistics", level = 2 },
    # Format v40 (E08 T19a2b): the highest spell level learnable grows (Wisdom).
    { kind = "learn_level", levels = 1 },
]

# Format v46 (E08 T35b): the hero's movement and scouting, kinds only the adventure reads (its own
# artifact: the regalia's list is full). Here, not in `synthetic`, so the battle replays' ruleset
# hash stays. Format v47 (E08 T45): Scholar's meeting level and Titan's Thunder's book, read by
# the hero model's increment-6 rules. Format v49 (E08 T70): the Navigation level, the sea points
# and free boarding, read by the hero model's increment-8 derivations. Format v50 (E08 T81b): a
# daily income, the day's spell point regain, the extra regain and full mana, read by the hero
# model's increment-9 derivations.
[[artifact]]
id = "wayfarer_sash"
name = "Wayfarer Sash"
class = "major"
slot = "synthetic:charm"
effects = [
    { kind = "pathfinding", level = 1 },
    { kind = "land_movement", bp = 500 },
    { kind = "land_movement_points", points = 200 },
    { kind = "flying", level = 3 },
    { kind = "water_walking", level = 2 },
    { kind = "scouting_radius", tiles = 1 },
    { kind = "meeting_spells", level = 3 },
    { kind = "gives_spell_book" },
    { kind = "navigation", level = 2 },
    { kind = "sea_movement_points", points = 250 },
    { kind = "free_boarding" },
    { kind = "daily_resource", resource = "synthetic:shard", amount = 2 },
    { kind = "mana_regain", points = 3 },
    { kind = "extra_mana_regain", points = 1 },
    { kind = "full_mana" },
]

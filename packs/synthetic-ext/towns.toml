# The synthetic expansion's town data (E09 T5b2a; format: crates/h3-pack-towns). Invented values
# for tests: an override of the synthetic pack's `vale`, as the SoD pack's of the moats (since
# E09 T36 one of its tavern weights too, as the AB pack's Conflux classes in the base records),
# and a Visions creature, as the AB pack's Rogue (E09 T8c2); since E09 T56 a Transformer dragon, as
# the AB pack's four dragons.

[town_visions]
creatures = ["lurker"]

[town_transformer]
dragons = ["lurker"]

[[town_override]]
faction = "synthetic:vale"
moat = "damaging"
siege_obstacles = true
silo = { "synthetic:shard" = 3 }
tavern = { "synthetic:sage" = 4 }

# The synthetic pack's adventure-map data (E08 T4; format: crates/h3-pack-adventure). Invented
# values for tests, not original game data (docs/05-testing.md, "Test data policy").

[params]
native_cost = 100
land_points = [1500, 1600, 1700]
scouting_radius = 4
max_map_size = 16
max_levels = 2
max_players = 4
army_slots = 5
max_stack_count = 9999
starting_stack_chances = [80, 20]
fly_cost = [160, 150, 130, 110]
water_walk_cost = [170, 150, 140, 120]
sea_points = [1600, 2400, 3200, 4000]
sea_ground = [1, 2]
flag_radius = 2

# E08 T83a: a five-day week, three weeks a month (invented).
[params.calendar]
week_days = 5
month_weeks = 3

# E08 T93a: the dwellings' parameters need the monsters' (invented values).
[params.monsters]

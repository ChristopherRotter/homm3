effects = [{ kind = "obstacle", obstacle = "pit" }]

[[spell]]                           # format v15: a Land Mine, random mines for the whole battle,
id = "snare"                        # hidden from the other side, whose stacks they damage (no target)
polarity = "neutral"
obstacle = { hexes = [4, 4, 6, 8], random = true, separate = true }
effects = [{ kind = "obstacle", obstacle = "mine" }]

[[spell]]                           # format v16 (E04b T5b): a Remove Obstacle, a natural obstacle
id = "uproot"                       # at every mastery, Fire Wall from Advanced, any at Expert
polarity = "neutral"
target = "hex"
removes = { fire = "advanced", wall = "expert", pit = "expert", mine = "expert" }
effects = [{ kind = "remove_obstacle" }]

[[spell]]                           # format v17 (E04b T6a): a Resurrection, a living stack of
id = "revive"                       # the caster's side, dead or alive; for the battle below Advanced
polarity = "positive"
target = "stack"
side = "own"
requires = ["alive"]
excludes = ["war_machine"]
temporary_below = "advanced"
effects = [{ kind = "raise" }]

[[spell]]                           # format v17: a Sacrifice (second target: the victim), its target
id = "offer"                        # tested as Revive's under BAT-QUIRK-5
polarity = "positive"
target = "stack"
side = "own"
requires = ["alive"]
excludes = ["undead", "war_machine"]
tests_as = "revive"
effects = [{ kind = "sacrifice" }]

[[spell]]                           # format v18 (E04b T6b): a Clone, of a stack up to level 1, 1, 2, 3
id = "copy"                         # by mastery, for the caster's power in rounds
polarity = "positive"
target = "stack"
side = "own"
excludes = ["war_machine"]
effects = [{ kind = "clone" }]

[[spell]]                           # format v18: a Summon Elemental, effect × power Shades on the
id = "conjure"                      # caster's side (no target)
polarity = "neutral"
summons = "shade"
effects = [{ kind = "summon" }]

# Format v20: the strike's statuses (BAT-MAG-043, BAT-MAG-044), cast by the Brutes' strikes.
[[spell]]
id = "freeze"                       # a Stone Gaze: no turns, half damage, ends when struck
polarity = "negative"
target = "stack"
side = "enemy"
excludes = ["war_machine"]
ends = "damaged"
effects = [{ kind = "timed", change = "petrify" }]

[[spell]]
id = "numb"                         # a Paralyze: no turns, retaliates at 25 %, ends when struck
polarity = "negative"
target = "stack"
side = "enemy"
excludes = ["war_machine"]
ends = "damaged"
effects = [{ kind = "timed", change = "paralyze" }]

[[spell]]
id = "rot"                          # a Disease: −2 attack and defense
polarity = "negative"
target = "stack"
side = "enemy"
excludes = ["war_machine"]
effects = [{ kind = "timed", change = "attack_loss" }, { kind = "timed", change = "defense_loss" }]

[[spell]]
id = "wane"                         # an Age: half the hit points per creature
polarity = "negative"
target = "stack"
side = "enemy"
excludes = ["war_machine"]
effects = [{ kind = "timed", change = "age" }]

[[spell]]
id = "taint"                        # a Poison: a tenth of the hit points per creature each round
polarity = "negative"
target = "stack"
side = "enemy"
requires = ["alive"]
excludes = ["war_machine"]
effects = [{ kind = "timed", change = "poison" }]

# Format v21: Bind and Acid Breath (BAT-MAG-045, BAT-MAG-046), cast by the Brutes' strikes without
# a test.
[[spell]]
id = "tangle"                       # a Bind: no movement while a striker that bound it stays
polarity = "negative"
target = "stack"
side = "enemy"
duration = "fixed"
fixed_rounds = 255
ignores_immunity = true
effects = [{ kind = "timed", change = "bind" }]

[[spell]]
id = "etch"                         # an Acid Breath: −1 defense for the battle, at every strike
polarity = "negative"
target = "stack"
side = "enemy"
duration = "permanent"
cumulative = true
ignores_immunity = true
effects = [{ kind = "timed", change = "defense_loss" }]

[[spell]]
id = "bane"
polarity = "negative"
target = "stack"
side = "enemy"
mass = "expert"
counters = ["boon"]
excludes = ["undead"]
needs_damage = true                 # format v32: not the Aid Tent or the Supply Wagon (BAT-MAG-067)

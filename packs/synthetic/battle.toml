# Synthetic content pack for tests and the walking skeleton. Invented creatures with neutral names;
# numbers are chosen to exercise the rules, not taken from the original game.
# This file: the battle data (pack format v35, R01); the manifest and the core data: core.toml.

# Battle parameters (Tier 2). Values of the rule parameters follow the sourced rules in
# docs/rules/catalog/battle.toml; the field and formation are skeleton choices.
[battle]
field_width = 17                            # BAT-GEO-001: 15 standable columns + 2 side columns
field_height = 11
side_columns = 1
army_slots = 7
damage_roll_samples = 10                    # BAT-DMG-001
attack_bonus_per_point_percent = 5          # BAT-DMG-002
attack_bonus_cap_percent = 300              # BAT-DMG-002 (+300 %, user decision Q11)
defense_reduction_per_point_permille = 25   # BAT-DMG-002
defense_reduction_cap_permille = 700        # BAT-DMG-002
defend_bonus_percent = 20                   # BAT-TRN-004
defend_bonus_min = 1                        # BAT-TRN-004
ranged_full_damage_distance = 10            # BAT-RNG-002
ranged_penalty_percent = 50                 # BAT-RNG-002
melee_penalty_percent = 50                  # BAT-RNG-003
morale_dice = 24                            # BAT-MOR-003/004: chances out of 24
good_morale_chances = [1, 2, 3]             # BAT-MOR-003: morale +1..+3
bad_morale_chances = [2, 4, 6]              # BAT-MOR-004: morale -1..-3
luck_dice = 24                              # BAT-LCK-002
good_luck_chances = [1, 2, 3]               # BAT-LCK-002: luck +1..+3 (no bad luck before HotA)
war_machine_positions = [[1, 3], [1, 1], [1, 9]]   # BAT-WAR-001: shooting, ammo, first aid
# BAT-SET-001: *_formation[n-1] = starting rows of an army with n stacks, in slot order.
loose_formation = [
    [5],
    [3, 7],
    [2, 5, 8],
    [1, 4, 6, 9],
    [0, 2, 5, 8, 10],
    [0, 2, 4, 6, 8, 10],
    [0, 2, 4, 5, 6, 8, 10],
]
tight_formation = [
    [5],
    [4, 6],
    [4, 5, 6],
    [3, 4, 6, 7],
    [3, 4, 5, 6, 7],
    [2, 3, 4, 6, 7, 8],
    [2, 3, 4, 5, 6, 7, 8],
]
tactics_zone_columns = [3, 5, 7]            # BAT-TAC-001: zone width by Tactics level difference
surrender = { resource = "coin", cost_percent = 50 }  # BAT-FLE-002: half the coin cost
hero_casts_per_round = 1                    # BAT-MAG-001 (pack format v4)
side_stack_limit = 20                       # BAT-MAG-037 (pack format v18)
# BAT-SIE-002 to BAT-SIE-007 (pack format v37): the siege's field, the original's hexes; the wall
# shots (pack format v38, BAT-SIE-009 onwards): the original's targets, lists, the Catapult's hex
# and the Ballistics table.
siege = { walls = [12, 29, 45, 62, 78, 96, 112, 130, 147, 165, 182], gate = 96, moat = [11, 28, 44, 61, 77, 95, 111, 129, 146, 164, 181], second_moat = [10, 27, 43, 60, 76, 94, 110, 128, 145, 163, 180], moat_defense_penalty = 3, mine_power = 3, catapult = 119, targets = [{ kind = "tower" }, { kind = "wall", wall = 29 }, { kind = "wall", wall = 78 }, { kind = "gate", wall = 96 }, { kind = "wall", wall = 130 }, { kind = "wall", wall = 182 }, { kind = "tower" }, { kind = "keep" }], missed = [1, 2, 5, 4], automatic = [1, 2, 4, 5], fallback = [3, 7, 0, 6], castle_bonus = 1, ballistics = [{ hit = [5, 10, 25, 50], shots = 1, damage = [10, 60, 30] }, { hit = [7, 15, 30, 60], shots = 1, damage = [0, 50, 50] }, { hit = [7, 15, 30, 60], shots = 2, damage = [0, 50, 50] }, { hit = [10, 20, 40, 75], shots = 2, damage = [0, 0, 100] }] }

[[battlefield]]                      # pack format v36 (E04c): a special battlefield (BAT-TER-002)
id = "hallow"
own_obstacles = true                 # BAT-GEO-004: its own obstacle types (the cairn), not the terrain's
morale = [{ factions = ["vale"], amount = 1 }]  # BAT-TER-003: Holy Ground's kind, by faction
expert_schools = ["storm"]           # BAT-TER-005: a hero's Storm spells at Expert

[[battlefield]]                      # Cursed Ground's kind
id = "barrens"
no_morale = true                     # BAT-TER-003: every stack's morale and luck 0
no_luck = true
no_native = true                     # BAT-TER-006: no native bonus
max_spell_level = 1                  # BAT-TER-004: no spell above level 1 cast or taking effect
no_creature_casts = true             # BAT-TER-004: no creature cast, raise or periodic cast

[[siege]]                            # pack format v37 (E04c T5): the vale's town (BAT-SIE-001)
faction = "vale"
moat_damage = 70                     # BAT-SIE-005: a damaging moat's damage
second_moat = true                   # BAT-SIE-004: the Fortress's shape
hit_points = [2, 2, 2, 2, 2, 2, 2, 2]    # BAT-SIE-009 (pack format v38): each wall target's

[[obstacle]]
id = "boulder"
terrains = ["meadow", "ash"]
width = 2
height = 1
blocked = [[0, 0], [1, 0]]          # [dx, dy] from the anchor (bottom-left hex)

[[obstacle]]
id = "crag"
terrains = ["meadow"]
width = 3
height = 2
blocked = [[0, 0], [1, 0], [1, -1]]

[[obstacle]]
id = "cairn"
battlefields = ["hallow"]           # pack format v36: only on that battlefield
width = 2
height = 2
blocked = [[0, 0], [1, -1]]

[[obstacle]]
id = "ridge"
terrains = ["ash"]
absolute = true
blocked = [[8, 3], [8, 4], [8, 5], [8, 6]]   # [x, y] on the field

[[creature]]
id = "spearman"
attack = 4
defense = 5
damage = [1, 3]
hit_points = 10

[[creature]]
id = "brute"
attack = 7
defense = 4
damage = [2, 5]
hit_points = 18
casts = 1                   # format v29: its rebirth's (BAT-MAG-059)
# Format v19: spells after a melee strike (BAT-MAG-040 to BAT-MAG-042); v20: the statuses; v21:
# Bind, Acid Breath and the extra damage (BAT-MAG-045 to BAT-MAG-047).
abilities = [
    { kind = "spell_after_strike", spell = "glare", chance_percent = 100, mastery = 0, rounds = 3 },
    { kind = "spell_after_strike", spell = "dazzle", chance_percent = 20, mastery = 0, rounds = 3, unless_active = true },
    { kind = "spell_after_strike", spell = "bane", chance_percent = 25, mastery = 0, rounds = 3, living = true },
    { kind = "spell_damage_after_strike", spell = "spark", chance_percent = 20, per_creature = 2 },
    { kind = "spell_after_strike", spell = "freeze", chance_percent = 10, mastery = 0, rounds = 3 },
    { kind = "spell_after_strike", spell = "numb", chance_percent = 10, mastery = 0, rounds = 3 },
    { kind = "spell_after_strike", spell = "rot", chance_percent = 10, mastery = 0, rounds = 3, living = true },
    { kind = "spell_after_strike", spell = "wane", chance_percent = 10, mastery = 0, rounds = 3, living = true },
    { kind = "spell_after_strike", spell = "taint", chance_percent = 30, mastery = 0, rounds = 3, living = true },
    { kind = "spell_after_strike", spell = "tangle", chance_percent = 25, mastery = 0, rounds = 3 },
    { kind = "spell_after_strike", spell = "etch", chance_percent = 30, mastery = 0, rounds = 3, defended = true },
    { kind = "damage_after_strike", chance_percent = 20, percent = 50 },
    # Format v27: in an army, its own hero's spells cost 2 less (the Mages, BAT-MAG-054).
    { kind = "spell_cost", amount = -2, affects = "allies" },
    # Format v29: once a battle, after the action that killed it, a fifth comes back (the
    # Phoenix's rebirth, BAT-MAG-059).
    { kind = "rebirth", divisor = 5 },
]

[[creature]]
id = "wisp"                 # neutral (no faction)
attack = 3
defense = 2
damage = [1, 2]
hit_points = 4
shots = 8
casts = 2
# Format v22: casts Hasten as its action, twice a battle, at Advanced with power 6 (BAT-MAG-048);
# v27: while it lives, its hero gains a fifth of the other hero's cost after each cast (the
# Familiars' channel, BAT-MAG-055).
abilities = [
    { kind = "spell_caster", spell = "hasten", mastery = 2, power = 6 },
    { kind = "mana_channel", percent = 20 },
]

# War machines (E03 T8/T9, BAT-WAR-001..004): one of each kind, controlled by the engine.
[[creature]]
id = "bolt_thrower"         # shooting kind (BAT-WAR-002)
attack = 6
defense = 6
damage = [3, 4]
hit_points = 120
shots = 12

[[creature]]
id = "supply_wagon"         # ammo-supply kind: its side's shots are unlimited (BAT-WAR-004)
attack = 0
defense = 3
damage = [0, 0]
hit_points = 60
abilities = [{ kind = "ammo_supply" }]

[[creature]]
id = "aid_tent"             # first-aid kind (BAT-WAR-003)
attack = 0
defense = 0
damage = [0, 0]
hit_points = 50
abilities = [{ kind = "first_aid", min_hp = 1, max_hp = 10 }]

[[creature]]
id = "shade"                # format v18: summoned by Conjure (BAT-MAG-039), not living
attack = 5
defense = 5
damage = [2, 4]
hit_points = 15

[[creature]]
id = "drake"                # neutral (no faction)
attack = 12
defense = 12
damage = [6, 10]
hit_points = 60
casts = 3
# Format v23: at each activation while it has casts left it draws Spark, Cinders or Arc by weight
# and may cast it at Advanced with power 2 per creature, at any stack but itself the spell can
# affect (a Faerie Dragon's random spell, BAT-MAG-049).
# Format v28: its own Magic Mirror (Glass) of 20 % while the spell is not on it with more (a
# Faerie Dragon's mirror, BAT-MAG-057).
# Format v29: the enemy's stacks freeze with 10 % chance when picked to act (an Azure Dragon's
# Fear, BAT-MAG-060).
abilities = [
    { kind = "random_spell_caster", mastery = 2, power_per_creature = 2 },
    { kind = "drawn_spell", spell = "spark", weight = 5 },
    { kind = "drawn_spell", spell = "cinders", weight = 3 },
    { kind = "drawn_spell", spell = "arc", weight = 2 },
    { kind = "innate_spell", spell = "glass", value = 20 },
    { kind = "fear", percent = 10 },
]

[[creature]]
id = "djinn"                # neutral (no faction)
attack = 9
defense = 8
damage = [3, 6]
hit_points = 30
casts = 3
# Format v24: casts at another own stack a spell drawn at the cast among those useful for it, at
# Advanced with power 6, three times a battle (a Master Genie's draw, BAT-MAG-050).
# Format v27: in an army, the enemy hero's spells cost 2 more (the Pegasi, BAT-MAG-054).
# Format v28: half damage to two-hex creatures (a Psychic Elemental's half by flag, BAT-DMG-010).
abilities = [
    { kind = "spell_cost", amount = 2, affects = "enemies" },
    { kind = "damage_penalty_by_flag", flag = "two_hex", percent = 50 },
    { kind = "helpful_spell_caster", mastery = 2, power = 6 },
    { kind = "drawn_spell", spell = "hasten", weight = 1 },
    { kind = "drawn_spell", spell = "fury", weight = 1 },
    { kind = "drawn_spell", spell = "boon", weight = 1 },
    { kind = "drawn_spell", spell = "aegis", weight = 1 },
    { kind = "drawn_spell", spell = "hallow", weight = 1 },
    { kind = "drawn_spell", spell = "smiting", weight = 1 },
    { kind = "drawn_spell", spell = "mend", weight = 1 },
]

[[creature]]
id = "seraph"               # neutral (no faction)
attack = 20
defense = 20
damage = [20, 25]
hit_points = 120
casts = 1
# Format v25: once a battle raises another stack of its side, living or dead, for good by 100 hit
# points per creature under Revive's test (an Archangel's raise, BAT-MAG-051).
abilities = [{ kind = "stack_raiser", spell = "revive", hit_points_per_creature = 100 }]

[[creature]]
id = "fiend"                # neutral (no faction)
attack = 13
defense = 13
damage = [13, 17]
hit_points = 45
casts = 1
# Format v25: once a battle raises Spearmen from a corpse of a living creature's stack of its
# side, with 50 hit points per creature, into that stack's army slot (a Pit Lord's Demons,
# BAT-MAG-052).
# Format v27: at its activations of a round's normal phase, the enemy hero loses 2 mana (a
# Wraith's drain, BAT-MAG-056).
# Format v28: its own Fire Shield (Blaze) of 20 % while the spell is not on it with more (an
# Efreet Sultan's shield, BAT-MAG-058).
abilities = [
    { kind = "corpse_raiser", creature = "spearman", hit_points_per_creature = 50 },
    { kind = "mana_drain", amount = 2 },
    { kind = "innate_spell", spell = "blaze", value = 20 },
]

[[creature]]
id = "chanter"              # neutral (no faction)
attack = 17
defense = 12
damage = [14, 14]
hit_points = 30
shots = 32
casts = 0
# Format v26: no action; at its activation, once in three round starts of its side, casts at
# Expert with power 3 a spell drawn by weight among those useful on its side's first stack (on the
# enemy's first one for Drag and Gloom): an Enchanter's cast, BAT-MAG-053.
# Format v28: half damage to Djinns (a Magic Elemental's half, BAT-DMG-010).
abilities = [
    { kind = "periodic_spell_caster", rounds = 3, mastery = 3, power = 3 },
    { kind = "damage_penalty", creature = "djinn", percent = 50 },
    { kind = "drawn_spell", spell = "hasten", weight = 15 },
    { kind = "drawn_spell", spell = "aegis", weight = 10 },
    { kind = "drawn_spell", spell = "drag", weight = 10 },
    { kind = "drawn_spell", spell = "fury", weight = 5 },
    { kind = "drawn_spell", spell = "mend", weight = 10 },
    { kind = "drawn_spell", spell = "gloom", weight = 4 },
]

[[spell]]
id = "spark"
polarity = "negative"
target = "stack"                    # none (default) | stack | hex
side = "enemy"                      # whose stacks it reaches: any (default) | enemy | own
effects = [{ kind = "damage" }]     # none: not castable yet

[[spell]]
id = "cinders"
polarity = "negative"
target = "hex"
area = { radius = [1, 1, 1, 2] }    # hexes at distance inner (default 0) to radius[mastery]
excludes = ["war_machine"]          # creature flags a stack may not have
effects = [{ kind = "damage" }]

[[spell]]
id = "arc"
polarity = "negative"
target = "stack"
chain = { targets = [3, 3, 4, 4], factor_bp = 5000 }  # stacks struck by mastery; each next takes half
effects = [{ kind = "damage" }]

[[spell]]
id = "blight"
polarity = "negative"
requires = ["alive"]                # creature flags a stack needs; target none: every such stack
effects = [{ kind = "damage" }]

[[spell]]
id = "ward"
polarity = "positive"

[[spell]]
id = "farsight"
polarity = "neutral"

[[spell]]
id = "glare"                        # a creature ability: no school, may have level 0
polarity = "negative"
target = "stack"                    # format v19: cast by the Brutes' strikes (BAT-MAG-042):
side = "enemy"                      #   it ends positive spells only, on any stack with one
ignores_immunity = true
dispels_positive = true
effects = [{ kind = "dispel" }]

# Timed spells (pack format v5, E04b T3a): every timed change, a mass version, a mind spell,
# counters and a permanent cumulative spell appear at least once.
[[spell]]
id = "hasten"
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"                     # from Expert no target: every stack it may reach
excludes = ["war_machine"]
counters = ["drag"]                 # a cast ends these spells' effects
effects = [{ kind = "timed", change = "speed" }]
# v9: what a specialist in it adds, by the stack's creature level 1 to 7 (or a fixed `amount`,
# or a `total` the value becomes); without it a specialty scales the value by the hero's level
specialist = { kind = "creature_level", values = [3, 3, 2, 2, 1, 1, 0] }

[[spell]]
id = "drag"
polarity = "negative"
target = "stack"
side = "enemy"
mass = "expert"
excludes = ["war_machine"]
counters = ["hasten"]
effects = [{ kind = "timed", change = "speed_percent" }]

[[spell]]
id = "fury"
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"
mind = true                         # mind_immune creatures are immune
effects = [
    { kind = "timed", change = "melee_attack" },
    { kind = "timed", change = "ranged_attack" },
    { kind = "timed", change = "morale" },
    { kind = "timed", change = "luck" },
]
useful = "melee"                 # format v24: when a helpful caster finds it useful (BAT-MAG-050)

[[spell]]
id = "zeal"
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"
effects = [
    { kind = "timed", change = "attack" },
    { kind = "timed", change = "defense" },
    { kind = "timed", change = "speed" },
]

[[spell]]
id = "gloom"
polarity = "negative"
target = "stack"
side = "enemy"
mass = "expert"
mind = true
effects = [
    { kind = "timed", change = "attack_loss" },
    { kind = "timed", change = "morale_loss" },
    { kind = "timed", change = "luck_loss" },
]

[[spell]]
id = "boon"
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"
counters = ["bane"]
excludes = ["undead"]

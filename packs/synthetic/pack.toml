# Synthetic content pack for tests and the walking skeleton. Invented creatures with neutral names;
# numbers are chosen to exercise the rules, not taken from the original game.

[pack]
id = "synthetic"
version = "0.1.0"
depends = []

# Battle parameters (Tier 2). Values of the rule parameters follow the sourced rules in
# docs/rules/catalog/battle.toml; the field and formation are skeleton choices.
[battle]
field_width = 17                            # BAT-GEO-001: 15 standable columns + 2 side columns
field_height = 11
side_columns = 1
army_slots = 7
damage_roll_samples = 10                    # BAT-DMG-001
attack_bonus_per_point_percent = 5          # BAT-DMG-002
attack_bonus_cap_percent = 300              # BAT-DMG-002 (+300 %, user decision Q11)
defense_reduction_per_point_permille = 25   # BAT-DMG-002
defense_reduction_cap_permille = 700        # BAT-DMG-002
defend_bonus_percent = 20                   # BAT-TRN-004
defend_bonus_min = 1                        # BAT-TRN-004
ranged_full_damage_distance = 10            # BAT-RNG-002
ranged_penalty_percent = 50                 # BAT-RNG-002
melee_penalty_percent = 50                  # BAT-RNG-003
morale_dice = 24                            # BAT-MOR-003/004: chances out of 24
good_morale_chances = [1, 2, 3]             # BAT-MOR-003: morale +1..+3
bad_morale_chances = [2, 4, 6]              # BAT-MOR-004: morale -1..-3
luck_dice = 24                              # BAT-LCK-002
good_luck_chances = [1, 2, 3]               # BAT-LCK-002: luck +1..+3 (no bad luck before HotA)
war_machine_positions = [[1, 3], [1, 1], [1, 9]]   # BAT-WAR-001: shooting, ammo, first aid
# BAT-SET-001: *_formation[n-1] = starting rows of an army with n stacks, in slot order.
loose_formation = [
    [5],
    [3, 7],
    [2, 5, 8],
    [1, 4, 6, 9],
    [0, 2, 5, 8, 10],
    [0, 2, 4, 6, 8, 10],
    [0, 2, 4, 5, 6, 8, 10],
]
tight_formation = [
    [5],
    [4, 6],
    [4, 5, 6],
    [3, 4, 6, 7],
    [3, 4, 5, 6, 7],
    [2, 3, 4, 6, 7, 8],
    [2, 3, 4, 5, 6, 7, 8],
]
tactics_zone_columns = [3, 5, 7]            # BAT-TAC-001: zone width by Tactics level difference
surrender = { resource = "coin", cost_percent = 50 }  # BAT-FLE-002: half the coin cost
hero_casts_per_round = 1                    # BAT-MAG-001 (pack format v4)
side_stack_limit = 20                       # BAT-MAG-037 (pack format v18)

# Content of pack format v2 (E02): resource kinds, factions and the non-battle creature fields.
# Invented names; the values only exercise the format.
[[resource]]
id = "coin"
name = "Coin"

[[resource]]
id = "shard"
name = "Shard"

# Terrain (E03): terrain types, native terrains (BAT-TER-001) and obstacle types (BAT-GEO-004).
[[terrain]]
id = "meadow"
name = "Meadow"

[[terrain]]
id = "ash"
name = "Ash"

[[faction]]
id = "vale"
name = "Vale"
native_terrain = "meadow"

[[obstacle]]
id = "boulder"
terrains = ["meadow", "ash"]
width = 2
height = 1
blocked = [[0, 0], [1, 0]]          # [dx, dy] from the anchor (bottom-left hex)

[[obstacle]]
id = "crag"
terrains = ["meadow"]
width = 3
height = 2
blocked = [[0, 0], [1, 0], [1, -1]]

[[obstacle]]
id = "ridge"
terrains = ["ash"]
absolute = true
blocked = [[8, 3], [8, 4], [8, 5], [8, 6]]   # [x, y] on the field

[[creature]]
id = "spearman"
name = "Spearman"
plural = "Spearmen"
faction = "vale"
level = 1
attack = 4
defense = 5
damage = [1, 3]
hit_points = 10
speed = 4
cost = { coin = 50 }
growth = 12
fight_value = 90
ai_value = 70
adventure_count = [20, 40]
flags = ["alive"]

[[creature]]
id = "brute"
name = "Brute"
plural = "Brutes"
faction = "synthetic:vale"
level = 2
attack = 7
defense = 4
damage = [2, 5]
hit_points = 18
speed = 5
cost = { coin = 120, shard = 1 }
growth = 7
horde_growth = 3
fight_value = 220
ai_value = 250
adventure_count = [10, 25]
flags = ["alive", "two_hex", "king_1"]     # king_1: Smiting counts against it (BAT-MAG-014)
casts = 1                   # format v29: its rebirth's (BAT-MAG-059)
# Format v19: spells after a melee strike (BAT-MAG-040 to BAT-MAG-042); v20: the statuses; v21:
# Bind, Acid Breath and the extra damage (BAT-MAG-045 to BAT-MAG-047).
abilities = [
    { kind = "spell_after_strike", spell = "glare", chance_percent = 100, mastery = 0, rounds = 3 },
    { kind = "spell_after_strike", spell = "dazzle", chance_percent = 20, mastery = 0, rounds = 3, unless_active = true },
    { kind = "spell_after_strike", spell = "bane", chance_percent = 25, mastery = 0, rounds = 3, living = true },
    { kind = "spell_damage_after_strike", spell = "spark", chance_percent = 20, per_creature = 2 },
    { kind = "spell_after_strike", spell = "freeze", chance_percent = 10, mastery = 0, rounds = 3 },
    { kind = "spell_after_strike", spell = "numb", chance_percent = 10, mastery = 0, rounds = 3 },
    { kind = "spell_after_strike", spell = "rot", chance_percent = 10, mastery = 0, rounds = 3, living = true },
    { kind = "spell_after_strike", spell = "wane", chance_percent = 10, mastery = 0, rounds = 3, living = true },
    { kind = "spell_after_strike", spell = "taint", chance_percent = 30, mastery = 0, rounds = 3, living = true },
    { kind = "spell_after_strike", spell = "tangle", chance_percent = 25, mastery = 0, rounds = 3 },
    { kind = "spell_after_strike", spell = "etch", chance_percent = 30, mastery = 0, rounds = 3, defended = true },
    { kind = "damage_after_strike", chance_percent = 20, percent = 50 },
    # Format v27: in an army, its own hero's spells cost 2 less (the Mages, BAT-MAG-054).
    { kind = "spell_cost", amount = -2, affects = "allies" },
    # Format v29: once a battle, after the action that killed it, a fifth comes back (the
    # Phoenix's rebirth, BAT-MAG-059).
    { kind = "rebirth", divisor = 5 },
]

[[creature]]
id = "wisp"                 # neutral (no faction)
name = "Wisp"
plural = "Wisps"
level = 1
attack = 3
defense = 2
damage = [1, 2]
hit_points = 4
speed = 9
shots = 8
casts = 2
cost = { coin = 40 }
growth = 10
fight_value = 60
ai_value = 65
adventure_count = [15, 30]
flags = ["flying", "shooter", "no_morale"]
# Format v22: casts Hasten as its action, twice a battle, at Advanced with power 6 (BAT-MAG-048);
# v27: while it lives, its hero gains a fifth of the other hero's cost after each cast (the
# Familiars' channel, BAT-MAG-055).
abilities = [
    { kind = "spell_caster", spell = "hasten", mastery = 2, power = 6 },
    { kind = "mana_channel", percent = 20 },
]

# War machines (E03 T8/T9, BAT-WAR-001..004): one of each kind, controlled by the engine.
[[creature]]

schools = ["stone"]
cost = [8, 6, 6, 6]
effect = [1, 1, 2, 2]
polarity = "negative"
target = "stack"
side = "enemy"
mass = "expert"
mind = true
effects = [
    { kind = "timed", change = "attack_loss" },
    { kind = "timed", change = "morale_loss" },
    { kind = "timed", change = "luck_loss" },
]

[[spell]]
id = "boon"
name = "Boon"
category = "combat"
level = 1
schools = ["stone"]
cost = [5, 4, 4, 4]
effect = [0, 0, 1, 1]
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"
counters = ["bane"]
effects = [{ kind = "timed", change = "maximum_damage" }]

[[spell]]
id = "bane"
name = "Bane"
category = "combat"
level = 1
schools = ["stone"]
cost = [5, 4, 4, 4]
effect = [0, 0, 1, 1]
polarity = "negative"
target = "stack"
side = "enemy"
mass = "expert"
counters = ["boon"]

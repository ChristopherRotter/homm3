[[spell]]                           # format v7 (E04b T3b1b): a dispel like the original's Dispel
id = "purge"
name = "Purge"
category = "combat"
level = 1
schools = ["stone"]
cost = [5, 4, 4, 4]
effect = [0, 0, 0, 0]
polarity = "neutral"
target = "stack"
side = "own"
any_side = "advanced"               # either side from Advanced
needs_effect = true                 # a stack it is aimed at needs an effect
ignores_immunity = true             # no immunity, resistance or aura
mass = "expert"
spares = ["drag"]                   # it ends every effect but Drag's
effects = [{ kind = "dispel" }]

[[spell]]                           # format v7: a heal that ends three spells, like Cure
id = "mend"
name = "Mend"
category = "combat"
level = 1
schools = ["storm"]
cost = [6, 5, 5, 5]
power = 5
effect = [10, 10, 20, 30]
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"
dispels = ["drag", "bane", "gloom"] # it ends only these
effects = [{ kind = "dispel" }, { kind = "heal" }]

[[spell]]                           # format v8 (E04b T3b2): a Fire Shield
id = "blaze"

name = "Ward"
category = "combat"
level = 2
schools = ["stone", "storm"]
cost = [8, 6, 6, 6]
effect = [3, 3, 6, 6]
polarity = "positive"

[[spell]]
id = "farsight"
name = "Farsight"
category = "adventure"
level = 1
schools = ["stone"]
cost = [2, 1, 1, 1]
effect = [0, 0, 0, 0]
polarity = "neutral"

[[spell]]
id = "glare"                        # a creature ability: no school, may have level 0
name = "Glare"
category = "ability"
level = 0
cost = [0, 0, 0, 0]
effect = [0, 0, 0, 0]
polarity = "negative"
target = "stack"                    # format v19: cast by the Brutes' strikes (BAT-MAG-042):
side = "enemy"                      #   it ends positive spells only, on any stack with one
ignores_immunity = true
dispels_positive = true
effects = [{ kind = "dispel" }]

# Timed spells (pack format v5, E04b T3a): every timed change, a mass version, a mind spell,
# counters and a permanent cumulative spell appear at least once.
[[spell]]
id = "hasten"
name = "Hasten"
category = "combat"
level = 1
schools = ["storm"]
cost = [6, 5, 5, 5]
effect = [3, 3, 5, 5]               # v by mastery
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"                     # from Expert no target: every stack it may reach
excludes = ["war_machine"]
counters = ["drag"]                 # a cast ends these spells' effects
effects = [{ kind = "timed", change = "speed" }]
# v9: what a specialist in it adds, by the stack's creature level 1 to 7 (or a fixed `amount`,
# or a `total` the value becomes); without it a specialty scales the value by the hero's level
specialist = { kind = "creature_level", values = [3, 3, 2, 2, 1, 1, 0] }

[[spell]]
id = "drag"
name = "Drag"
category = "combat"
level = 1
schools = ["storm"]
cost = [6, 5, 5, 5]
effect = [75, 75, 50, 50]
polarity = "negative"
target = "stack"
side = "enemy"
mass = "expert"
excludes = ["war_machine"]
counters = ["hasten"]
effects = [{ kind = "timed", change = "speed_percent" }]

[[spell]]
id = "fury"
name = "Fury"
category = "combat"
level = 2
schools = ["storm"]
cost = [8, 6, 6, 6]
effect = [1, 1, 2, 2]
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"
mind = true                         # mind_immune creatures are immune
effects = [
    { kind = "timed", change = "melee_attack" },
    { kind = "timed", change = "ranged_attack" },
    { kind = "timed", change = "morale" },
    { kind = "timed", change = "luck" },
]

# ---- Hero content (pack format v3, E04a T3): invented schools, spells, skills, classes and heroes.
# Every hero-effect kind appears at least once. Spells carry their battle magic since format v4
# (E04b T2a): every target kind, an area, a chain and target conditions appear at least once.

[[spell_school]]
id = "storm"
name = "Storm"
protection_rank = 1                 # quirk Q-0007: stone's protection is checked first

[[spell_school]]
id = "stone"
name = "Stone"

[[spell]]
id = "spark"
name = "Spark"
category = "combat"
level = 1
schools = ["storm"]
cost = [6, 5, 5, 5]                 # mana by mastery: none, basic, advanced, expert
power = 10
effect = [10, 10, 20, 30]
polarity = "negative"
target = "stack"                    # none (default) | stack | hex
side = "enemy"                      # whose stacks it reaches: any (default) | enemy | own
effects = [{ kind = "damage" }]     # none: not castable yet

[[spell]]
id = "cinders"
name = "Cinders"
category = "combat"
level = 3
schools = ["storm"]
cost = [12, 10, 10, 10]
power = 10
effect = [15, 15, 30, 60]
polarity = "negative"
target = "hex"
area = { radius = [1, 1, 1, 2] }    # hexes at distance inner (default 0) to radius[mastery]
excludes = ["war_machine"]          # creature flags a stack may not have
effects = [{ kind = "damage" }]

[[spell]]
id = "arc"
name = "Arc"
category = "combat"
level = 4
schools = ["storm"]
cost = [10, 8, 8, 8]
power = 25
effect = [25, 25, 50, 100]
polarity = "negative"
target = "stack"
chain = { targets = [3, 3, 4, 4], factor_bp = 5000 }  # stacks struck by mastery; each next takes half
effects = [{ kind = "damage" }]

[[spell]]
id = "blight"
name = "Blight"
category = "combat"
level = 5
schools = ["stone"]
cost = [20, 18, 18, 18]
power = 30
effect = [40, 40, 80, 120]
polarity = "negative"
requires = ["alive"]                # creature flags a stack needs; target none: every such stack
effects = [{ kind = "damage" }]

[[spell]]
id = "ward"
name = "Ward"
category = "combat"
level = 2
schools = ["stone", "storm"]
cost = [8, 6, 6, 6]
effect = [3, 3, 6, 6]
polarity = "positive"

[[spell]]
id = "farsight"
name = "Farsight"
category = "adventure"
level = 1
schools = ["stone"]
cost = [2, 1, 1, 1]
effect = [0, 0, 0, 0]
polarity = "neutral"

[[spell]]
id = "glare"                        # a creature ability: no school, may have level 0
name = "Glare"
category = "ability"
level = 0
cost = [0, 0, 0, 0]
effect = [0, 0, 0, 0]
polarity = "negative"

# Timed spells (pack format v5, E04b T3a): every timed change, a mass version, a mind spell,
# counters and a permanent cumulative spell appear at least once.
[[spell]]
id = "hasten"
name = "Hasten"
category = "combat"
level = 1
schools = ["storm"]
cost = [6, 5, 5, 5]
effect = [3, 3, 5, 5]               # v by mastery
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"                     # from Expert no target: every stack it may reach
excludes = ["war_machine"]
counters = ["drag"]                 # a cast ends these spells' effects
effects = [{ kind = "timed", change = "speed" }]
# v9: what a specialist in it adds, by the stack's creature level 1 to 7 (or a fixed `amount`,
# or a `total` the value becomes); without it a specialty scales the value by the hero's level
specialist = { kind = "creature_level", values = [3, 3, 2, 2, 1, 1, 0] }

[[spell]]
id = "drag"
name = "Drag"
category = "combat"
level = 1
schools = ["storm"]
cost = [6, 5, 5, 5]
effect = [75, 75, 50, 50]
polarity = "negative"
target = "stack"
side = "enemy"
mass = "expert"
excludes = ["war_machine"]
counters = ["hasten"]
effects = [{ kind = "timed", change = "speed_percent" }]

[[spell]]
id = "fury"
name = "Fury"
category = "combat"
level = 2
schools = ["storm"]
cost = [8, 6, 6, 6]
effect = [1, 1, 2, 2]
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"
mind = true                         # mind_immune creatures are immune
effects = [
    { kind = "timed", change = "melee_attack" },
    { kind = "timed", change = "ranged_attack" },
    { kind = "timed", change = "morale" },
    { kind = "timed", change = "luck" },
]

[[spell]]
id = "zeal"
name = "Zeal"
category = "combat"
level = 3
schools = ["stone"]
cost = [12, 10, 10, 10]
effect = [2, 2, 4, 4]
polarity = "positive"
target = "stack"
side = "own"
mass = "expert"
effects = [
    { kind = "timed", change = "attack" },
    { kind = "timed", change = "defense" },
    { kind = "timed", change = "speed" },
]

[[spell]]
id = "gloom"
name = "Gloom"
category = "combat"

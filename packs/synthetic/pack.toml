# Artifacts (pack format v3, E04a T3b): invented slots and artifacts; with the expansion's
# combination they use every artifact feature and effect kind once.
[[artifact_slot]]
id = "crown"
name = "Crown"

[[artifact_slot]]
id = "hand"
name = "Hand"
count = 2

[[artifact_slot]]
id = "charm"
name = "Charm"
count = 2                           # synthetic-ext raises it to 3

[[artifact_slot]]
id = "engine"
name = "Engine"
backpack = false                    # HER-ART-002: its artifacts never go to the backpack

[[artifact_slot]]
id = "tome"
name = "Tome"
backpack = false


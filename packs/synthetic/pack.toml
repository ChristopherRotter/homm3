[[creature]]
id = "shade"                # format v18: summoned by Conjure (BAT-MAG-039), not living
name = "Shade"
plural = "Shades"
level = 2
attack = 5
defense = 5
damage = [2, 4]
hit_points = 15
speed = 6
cost = { coin = 100 }
growth = 6
fight_value = 150
ai_value = 160
adventure_count = [10, 20]
flags = ["no_morale"]

[[creature]]
id = "drake"                # neutral (no faction)
name = "Drake"
plural = "Drakes"
level = 5
attack = 12
defense = 12
damage = [6, 10]
hit_points = 60
speed = 8
casts = 3
cost = { coin = 900 }
growth = 2
fight_value = 1400
ai_value = 1500
adventure_count = [2, 5]
flags = ["alive", "two_hex", "flying"]
# Format v23: at each activation while it has casts left it draws Spark, Cinders or Arc by weight
# and may cast it at Advanced with power 2 per creature, at any stack but itself the spell can
# affect (a Faerie Dragon's random spell, BAT-MAG-049).
# Format v28: its own Magic Mirror (Glass) of 20 % while the spell is not on it with more (a
# Faerie Dragon's mirror, BAT-MAG-057).
# Format v29: the enemy's stacks freeze with 10 % chance when picked to act (an Azure Dragon's
# Fear, BAT-MAG-060).
abilities = [
    { kind = "random_spell_caster", mastery = 2, power_per_creature = 2 },
    { kind = "drawn_spell", spell = "spark", weight = 5 },
    { kind = "drawn_spell", spell = "cinders", weight = 3 },
    { kind = "drawn_spell", spell = "arc", weight = 2 },
    { kind = "innate_spell", spell = "glass", value = 20 },
    { kind = "fear", percent = 10 },
]

[[creature]]
id = "djinn"                # neutral (no faction)
name = "Djinn"
plural = "Djinns"
level = 3
attack = 9
defense = 8
damage = [3, 6]
hit_points = 30
speed = 7
casts = 3
cost = { coin = 400 }
growth = 4
fight_value = 500
ai_value = 550
adventure_count = [4, 8]
flags = ["alive", "flying"]
# Format v24: casts at another own stack a spell drawn at the cast among those useful for it, at
# Advanced with power 6, three times a battle (a Master Genie's draw, BAT-MAG-050).
# Format v27: in an army, the enemy hero's spells cost 2 more (the Pegasi, BAT-MAG-054).
# Format v28: half damage to two-hex creatures (a Psychic Elemental's half by flag, BAT-DMG-010).
abilities = [
    { kind = "spell_cost", amount = 2, affects = "enemies" },
    { kind = "damage_penalty_by_flag", flag = "two_hex", percent = 50 },
    { kind = "helpful_spell_caster", mastery = 2, power = 6 },
    { kind = "drawn_spell", spell = "hasten", weight = 1 },
    { kind = "drawn_spell", spell = "fury", weight = 1 },
    { kind = "drawn_spell", spell = "boon", weight = 1 },
    { kind = "drawn_spell", spell = "aegis", weight = 1 },
    { kind = "drawn_spell", spell = "hallow", weight = 1 },
    { kind = "drawn_spell", spell = "smiting", weight = 1 },
    { kind = "drawn_spell", spell = "mend", weight = 1 },
]

[[creature]]
id = "seraph"               # neutral (no faction)
name = "Seraph"
plural = "Seraphs"
level = 7
attack = 20
defense = 20
damage = [20, 25]
hit_points = 120
speed = 9
casts = 1
cost = { coin = 3000 }
growth = 1
fight_value = 4000
ai_value = 4500
adventure_count = [1, 3]
flags = ["alive", "two_hex", "flying"]
# Format v25: once a battle raises another stack of its side, living or dead, for good by 100 hit
# points per creature under Revive's test (an Archangel's raise, BAT-MAG-051).
abilities = [{ kind = "stack_raiser", spell = "revive", hit_points_per_creature = 100 }]

[[creature]]
id = "fiend"                # neutral (no faction)
name = "Fiend"
plural = "Fiends"
level = 5
attack = 13
defense = 13
damage = [13, 17]
hit_points = 45
speed = 7
casts = 1
cost = { coin = 700 }
growth = 3
fight_value = 1000
ai_value = 1200
adventure_count = [3, 6]
flags = ["alive"]           # living, so its corpse can raise Spearmen too
# Format v25: once a battle raises Spearmen from a corpse of a living creature's stack of its
# side, with 50 hit points per creature, into that stack's army slot (a Pit Lord's Demons,
# BAT-MAG-052).
# Format v27: at its activations of a round's normal phase, the enemy hero loses 2 mana (a
# Wraith's drain, BAT-MAG-056).
# Format v28: its own Fire Shield (Blaze) of 20 % while the spell is not on it with more (an
# Efreet Sultan's shield, BAT-MAG-058).
abilities = [
    { kind = "corpse_raiser", creature = "spearman", hit_points_per_creature = 50 },
    { kind = "mana_drain", amount = 2 },
    { kind = "innate_spell", spell = "blaze", value = 20 },
]

[[creature]]
id = "chanter"              # neutral (no faction)
name = "Chanter"
plural = "Chanters"
level = 6
attack = 17
defense = 12
damage = [14, 14]
hit_points = 30
speed = 9
shots = 32
casts = 0
cost = { coin = 750 }
growth = 2
fight_value = 1200
ai_value = 1400
adventure_count = [2, 4]
flags = ["alive", "shooter"]
# Format v26: no action; at its activation, once in three round starts of its side, casts at
# Expert with power 3 a spell drawn by weight among those useful on its side's first stack (on the
# enemy's first one for Drag and Gloom): an Enchanter's cast, BAT-MAG-053.
# Format v28: half damage to Djinns (a Magic Elemental's half, BAT-DMG-010).
abilities = [
    { kind = "periodic_spell_caster", rounds = 3, mastery = 3, power = 3 },
    { kind = "damage_penalty", creature = "djinn", percent = 50 },
    { kind = "drawn_spell", spell = "hasten", weight = 15 },
    { kind = "drawn_spell", spell = "aegis", weight = 10 },
    { kind = "drawn_spell", spell = "drag", weight = 10 },
    { kind = "drawn_spell", spell = "fury", weight = 5 },
    { kind = "drawn_spell", spell = "mend", weight = 10 },
    { kind = "drawn_spell", spell = "gloom", weight = 4 },
]

# ---- Hero content (pack format v3, E04a T3): invented schools, spells, skills, classes and heroes.
# Every hero-effect kind appears at least once. Spells carry their battle magic since format v4
# (E04b T2a): every target kind, an area, a chain and target conditions appear at least once.

[[spell_school]]
id = "storm"
name = "Storm"
protection_rank = 1                 # quirk Q-0007: stone's protection is checked first

[[spell_school]]
id = "stone"
name = "Stone"

[[spell]]
id = "spark"
name = "Spark"
category = "combat"
level = 1
schools = ["storm"]
cost = [6, 5, 5, 5]                 # mana by mastery: none, basic, advanced, expert
power = 10
effect = [10, 10, 20, 30]
polarity = "negative"
target = "stack"                    # none (default) | stack | hex
side = "enemy"                      # whose stacks it reaches: any (default) | enemy | own
effects = [{ kind = "damage" }]     # none: not castable yet

[[spell]]
id = "cinders"
name = "Cinders"
category = "combat"
level = 3
schools = ["storm"]
cost = [12, 10, 10, 10]
power = 10
effect = [15, 15, 30, 60]
polarity = "negative"
target = "hex"
area = { radius = [1, 1, 1, 2] }    # hexes at distance inner (default 0) to radius[mastery]
excludes = ["war_machine"]          # creature flags a stack may not have
effects = [{ kind = "damage" }]

[[spell]]
id = "arc"
name = "Arc"
category = "combat"
level = 4
schools = ["storm"]
cost = [10, 8, 8, 8]
power = 25
effect = [25, 25, 50, 100]
polarity = "negative"
target = "stack"
chain = { targets = [3, 3, 4, 4], factor_bp = 5000 }  # stacks struck by mastery; each next takes half
effects = [{ kind = "damage" }]

[[spell]]
id = "blight"
name = "Blight"
category = "combat"
level = 5
schools = ["stone"]
cost = [20, 18, 18, 18]
power = 30
effect = [40, 40, 80, 120]
polarity = "negative"
requires = ["alive"]                # creature flags a stack needs; target none: every such stack
effects = [{ kind = "damage" }]

[[spell]]

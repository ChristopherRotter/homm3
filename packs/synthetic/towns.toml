# The synthetic pack's town data (E09 T5b2a; format: crates/h3-pack-towns). Invented values for
# tests, not original game data (docs/05-testing.md, "Test data policy"): the parameters and a
# town record of `vale`, its two levels without upgrades, every role once.

[town_params]
gold = "coin"
hall_gold = [500, 1000, 2000, 4000]
grail_gold = 5000
reveal_radius = 5
level_2_dwelling_chance = 30
neutral_garrison = [
  { chance = 33, count = [8, 15] }, { chance = 33, count = [5, 7] },
  { chance = 20, count = [3, 5] },  { chance = 13, count = [1, 3] } ]
capitol_demoted_to = "city_hall"

[[town]]
faction = "vale"
moat = "harmless"
silo = { shard = 1, "synthetic:coin" = 2 }
creatures = [["spearman"], ["synthetic:brute"]]

  [[town.building]]
  key = "village_hall"
  name = "Village Hall"
  slot = 10
  hall = 1

  [[town.building]]
  key = "town_hall"
  name = "Town Hall"
  slot = 11
  supersedes = ["village_hall"]
  hall = 2

  [[town.building]]
  key = "city_hall"
  name = "City Hall"
  supersedes = ["town_hall"]
  hall = 3

  [[town.building]]
  key = "capitol"
  name = "Capitol"
  supersedes = ["city_hall"]
  hall = 4

  [[town.building]]
  key = "fort"
  name = "Fort"
  fort = 1

  [[town.building]]
  key = "citadel"
  name = "Citadel"
  supersedes = ["fort"]
  fort = 2

  [[town.building]]
  key = "castle"
  name = "Castle"
  supersedes = ["citadel"]
  fort = 3

  [[town.building]]
  key = "tavern"
  name = "Tavern"
  tavern = true
  morale = 1

  [[town.building]]
  key = "silo"
  name = "Resource Silo"
  silo = true

  [[town.building]]
  key = "grail"
  name = "Grail"
  grail = true
  luck = 2
  escape_tunnel = true
  defender = { attack = 2, mana = 150 }
  reveal = "all"

  [[town.building]]
  key = "dwelling_1"
  name = "Dwelling 1"
  dwelling = [1, false]

  [[town.building]]
  key = "dwelling_2"
  name = "Dwelling 2"
  dwelling = [2, false]

  [[town.building]]
  key = "lookout"
  name = "Lookout"
  reveal = 20

  # A horde superseding its level's dwelling, and its upgrade: forbidden with it, built once the
  # horde and the level-2 dwelling are both ever built (the original's upgraded horde waits for
  # the upgraded dwelling, which `vale` lacks).
  [[town.building]]
  key = "horde"
  name = "Horde"
  supersedes = ["dwelling_2"]

  [[town.building]]
  key = "horde_up"
  name = "Horde Upgraded"
  supersedes = ["horde"]
  forbidden_with = "horde"
  auto_with = ["horde", "dwelling_2"]

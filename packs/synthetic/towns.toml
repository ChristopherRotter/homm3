# The synthetic pack's town data (E09 T5b2a; format: crates/h3-pack-towns). Invented values for
# tests, not original game data (docs/05-testing.md, "Test data policy"): the parameters and a
# town record of `vale`, its two levels without upgrades, every role once; since E09 T16a the
# requirements (the halls' chain to the Capitol through the Tavern and the Castle, the forts',
# the dwellings', the hordes') and the costs, and a Shipyard; since E09 T25a the growth's
# parameters, a horde (its upgrade has none: `vale`'s levels have no upgrades), a Portal of
# Summoning (the Lookout's) and a week's building (the Grail's, as the Inferno's Deity of Fire).

[town_params]
gold = "coin"
hall_gold = [500, 1000, 2000, 4000]
grail_gold = 5000
reveal_radius = 5
level_2_dwelling_chance = 30
neutral_garrison = [
  { chance = 33, count = [8, 15] }, { chance = 33, count = [5, 7] },
  { chance = 20, count = [3, 5] },  { chance = 13, count = [1, 3] } ]
capitol_demoted_to = "city_hall"
visions_factor = 2                 # TWN-VEW-003 (E09 T8c2); the original's 3 and 3
visions_min_radius = 4
week_creature_chance = [1, 3]      # TWN-GRO-002 (E09 T25a); the original's 1 in 4
week_creature_bonus = 4            # the original's 5
garrison_week = { odds = [30, 70], out_of = 100, weights = [2, 3, 4], weeks = 6, upgrade = 10 }

[[town]]
faction = "vale"
moat = "harmless"
silo = { shard = 1, "synthetic:coin" = 2 }
creatures = [["spearman"], ["synthetic:brute"]]

  [[town.building]]
  key = "village_hall"
  name = "Village Hall"
  slot = 10
  hall = 1

  [[town.building]]
  key = "town_hall"
  name = "Town Hall"
  slot = 11
  supersedes = ["village_hall"]
  requires = ["tavern"]
  cost = { coin = 2500 }
  hall = 2

  [[town.building]]
  key = "city_hall"
  name = "City Hall"
  supersedes = ["town_hall"]
  requires = ["town_hall"]
  cost = { coin = 5000, shard = 5 }
  hall = 3

  [[town.building]]
  key = "capitol"
  name = "Capitol"
  supersedes = ["city_hall"]
  requires = ["city_hall", "castle"]
  cost = { coin = 10000, shard = 10 }
  hall = 4

  [[town.building]]
  key = "fort"
  name = "Fort"
  cost = { coin = 5000, shard = 20 }
  fort = 1

  [[town.building]]
  key = "citadel"
  name = "Citadel"
  supersedes = ["fort"]
  requires = ["fort"]
  cost = { coin = 2500, shard = 5 }
  fort = 2

  [[town.building]]
  key = "castle"
  name = "Castle"
  supersedes = ["citadel"]
  requires = ["citadel"]
  cost = { coin = 5000, shard = 20 }
  fort = 3

  [[town.building]]
  key = "tavern"
  name = "Tavern"
  cost = { coin = 500, shard = 5 }
  tavern = true
  morale = 1

  [[town.building]]
  key = "silo"
  name = "Resource Silo"
  requires = ["tavern"]
  cost = { coin = 5000, shard = 5 }
  silo = true

  [[town.building]]
  key = "grail"
  name = "Grail"
  grail = true
  luck = 2
  escape_tunnel = true
  defender = { attack = 2, mana = 150 }
  reveal = "all"
  week_of = 1

  [[town.building]]
  key = "dwelling_1"
  name = "Dwelling 1"
  requires = ["fort"]
  cost = { coin = 300 }
  dwelling = [1, false]

  [[town.building]]
  key = "dwelling_2"
  name = "Dwelling 2"
  requires = ["dwelling_1"]
  cost = { coin = 500, shard = 5 }
  dwelling = [2, false]

  [[town.building]]
  key = "lookout"
  name = "Lookout"
  requires = ["fort"]
  cost = { coin = 1000, shard = 5 }
  reveal = 20
  portal = true

  # A horde superseding its level's dwelling, and its upgrade: forbidden with it, built once the
  # horde and the level-2 dwelling are both ever built (the original's upgraded horde waits for
  # the upgraded dwelling, which `vale` lacks).
  [[town.building]]
  key = "horde"
  name = "Horde"
  supersedes = ["dwelling_2"]
  requires = ["dwelling_2"]
  cost = { coin = 1000 }
  horde = [2, false]

  [[town.building]]
  key = "horde_up"
  name = "Horde Upgraded"
  supersedes = ["horde"]
  forbidden_with = "horde"
  auto_with = ["horde", "dwelling_2"]
  requires = ["horde"]
  cost = { coin = 1000 }

  # The Shipyard (E09 T16a): the building that needs water (TWN-SET-011).
  [[town.building]]
  key = "shipyard"
  name = "Shipyard"
  requires = ["tavern"]
  cost = { coin = 2000, shard = 20 }
  shipyard = true

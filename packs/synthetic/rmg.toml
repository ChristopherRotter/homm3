# The generator's constants (E14 T2c; the original's in packs/sod/rmg.toml): four heroes, the
# second RoE's only, the third the expansions' only, the fourth a campaign hero; two limits per
# map, one per zone; step 1's layout points (the original's, E14 T3c), its terrains' town types

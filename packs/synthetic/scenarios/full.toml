# Seven stacks per side (full armies) plus war machines; used for benchmarks and clone-cost
# measurements.

[scenario]
id = "full"
packs = ["synthetic"]
profile = "synthetic:faithful"
attacker_war_machines = ["synthetic:bolt_thrower", "synthetic:aid_tent"]
defender_war_machines = ["synthetic:bolt_thrower", "synthetic:supply_wagon"]
attacker_funds = 10000
defender_funds = 10000

# Both sides are led by a hero, so both may get lucky strikes (Q-0003). The battle heroes are
# given directly (Q31). The attacker: Brea at level 1, Drill (Tactics) at Advanced, Basic
# Marksmanship, Brawling and Plating (+10 % shots, +10 % melee, −5 % damage taken), Basic Gunnery
# (she commands her Bolt Thrower: one shot per turn, 50 % double damage) and Basic Mending (she
# commands her Aid Tent: heals 1–20 instead of 1–10), wearing a Lucky Knot (morale +1, luck +1).
# Her Tactics give her a tactics phase with a five-column zone before round 1 (BAT-TAC-001).
[scenario.attacker_hero]
hero_type = "synthetic:brea"
attack = 2
defense = 2
power = 1
knowledge = 1
tactics = 2
mana = 10
max_mana = 10
ranged_bp = 1000
melee_bp = 1000
reduction_bp = 500
ballista = { shots = 1, double_damage_chance_bp = 5000 }
tent = { heal_bonus_bp = 10000 }
effects = [{ kind = "morale", amount = 1 }, { kind = "luck", amount = 1 }]

# The defender is led by a hero too (E04a T11c), so both sides may retreat and surrender (the
# owners can pay) and the workload runs the heroes' stack effects (BAT-HER-005/006). Corwin at
# level 1, given directly: Basic Gunnery (he commands his Bolt Thrower: one shot per turn, 50 %
# double damage), his specialty (Wisps +2 attack and +1 damage, flying creatures +1 defense), a
# Far Scope (shooters without range penalty, flying creatures +1 speed, 10 % surrender discount),
# a Vigor Stone (living creatures +25 % hit points, regenerating 10) and, as the expansion's
# Storm Regalia gives it, shooters that shoot while adjacent. The base pack has one faction, so
# an alignment group (BAT-HER-007) could change nothing here.
[scenario.defender_hero]
hero_type = "synthetic:corwin"
attack = 1
defense = 3
power = 1
knowledge = 1
mana = 10
max_mana = 10
surrender_discount_bp = 1000
ballista = { shots = 1, double_damage_chance_bp = 5000 }
effects = [
    { kind = "stack_stat", creatures = { creature = "synthetic:wisp" }, stat = "attack", op = "add", amount = 2 },
    { kind = "stack_stat", creatures = { creature = "synthetic:wisp" }, stat = "min_damage", op = "add", amount = 1 },
    { kind = "stack_stat", creatures = { creature = "synthetic:wisp" }, stat = "max_damage", op = "add", amount = 1 },
    { kind = "stack_stat", creatures = { flag = "flying" }, stat = "defense", op = "add", amount = 1 },
    { kind = "no_range_penalty", creatures = { flag = "shooter" } },
    { kind = "stack_stat", creatures = { flag = "flying" }, stat = "speed", op = "add", amount = 1 },
    { kind = "stack_stat", creatures = { flag = "alive" }, stat = "hit_points", op = "percent_bp", amount = 2500 },
    { kind = "regeneration", creatures = { flag = "alive" }, hit_points = 10 },
    { kind = "shoot_when_adjacent", creatures = { flag = "shooter" } },
]


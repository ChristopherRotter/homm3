# Seven stacks per side (full armies) plus war machines; used for benchmarks and clone-cost
# measurements.

[scenario]
id = "full"
packs = ["synthetic"]
profile = "synthetic:faithful"
attacker_war_machines = ["synthetic:bolt_thrower", "synthetic:aid_tent"]
defender_war_machines = ["synthetic:bolt_thrower", "synthetic:supply_wagon"]
attacker_funds = 10000
defender_funds = 10000

# Both sides are led by a hero, so both may get lucky strikes (Q-0003). The battle heroes are
# given directly (Q31). The attacker: Brea at level 1, Drill (Tactics) at Advanced, Basic
# Marksmanship, Brawling and Plating (+10 % shots, +10 % melee, −5 % damage taken), Basic Gunnery
# (she commands her Bolt Thrower: one shot per turn, 50 % double damage) and Basic Mending (she
# commands her Aid Tent: heals 1–20 instead of 1–10), wearing a Lucky Knot (morale +1, luck +1).
# Her Tactics give her a tactics phase with a five-column zone before round 1 (BAT-TAC-001).
# Both heroes cast (E04b T2c): Brea knows the four damage spells with Basic Storm magic, so
# random rollouts exercise every kind of damage spell the battle implements; since E04b T3a also
# three timed storm spells, since T3b1 Smiting (Slayer) and Riposte (extra retaliations), since
# T3b1b Mend (a Cure: it heals and ends the negative spells), since T3b2 Blaze (a Fire Shield);
# since T3c she is a level-6 specialist in Hasten (by the creature level, BAT-MAG-020); since T4a
# she mirrors (Glass, a Magic Mirror: Corwin's spells at a mirrored stack may hit his own); since
# T4b she makes one shooter forget (Haze, a Forgetfulness at Basic: half its creatures count);
# since T4c she charms a stack of up to 60 hit points (Charm, a Hypnotize: power 2 × 25 + 10), which
# then fights for her; since T5a she raises a two-hex wall of fire (Scorch, a Fire Wall: 30 damage
# to a stack that enters it or acts on it) and moves her own stacks anywhere (Blink, a Teleport);
# since T5c2 she hides four mines (Snare, a Land Mine at Basic: 45 damage to a Corwin stack that
# steps on one unseen; Corwin has no natives, as the battlefield has no terrain); since T6a she
# raises her stacks for the battle (Revive, a Resurrection without Stone magic: 140 hit points)
# and sacrifices one stack to raise another (Offer, a Sacrifice at Basic); since T6b she copies a
# stack of level 1 for two rounds (Copy, a Clone at Basic). Since E04b T9b (the casting workload)
# six of her spells are at Advanced, so the values above are Basic's for Spark, Cinders, Haze,
# Charm, Scorch and Snare (they hit harder, Haze makes every enemy shooter forget, Charm takes a
# larger stack, Scorch burns hotter, Snare's mines hurt more); her army starts hasted (an opening
# Hasten at Expert, as Angelic Alliance's Prayer); her stacks never take Corwin's Spark (a
# Pendant); and her Basic Eagle Eye (40 %) may learn his spells up to level 2 that she does not
# know but Mire. (Neither Eagle Eye lists the other side's hidden spell, Mire or Snare: its draw
# would come before the obstacles' own and show in the learner's private part, which the
# server's hygiene tests compare across seeds; see the battle HANDOFF's trap.)
[scenario.attacker_hero]
hero_type = "synthetic:brea"
attack = 2
defense = 2
power = 2
knowledge = 1
tactics = 2
mana = 40
max_mana = 40
spell_book = [
    "synthetic:spark", "synthetic:cinders", "synthetic:arc", "synthetic:blight", "synthetic:ward",
    "synthetic:hasten", "synthetic:drag", "synthetic:fury", "synthetic:smiting",
    "synthetic:riposte", "synthetic:mend", "synthetic:blaze", "synthetic:glass",
    "synthetic:haze", "synthetic:charm", "synthetic:scorch", "synthetic:blink",
    "synthetic:snare", "synthetic:revive", "synthetic:offer", "synthetic:copy",
]
ranged_bp = 1000
melee_bp = 1000
reduction_bp = 500
ballista = { level = 1, shots = 1, double_damage_chance_bp = 5000 }
tent = { heal_bonus_bp = 10000 }
effects = [
    { kind = "morale", amount = 1 },
    { kind = "luck", amount = 1 },
    { kind = "spell_specialty", spell = "synthetic:hasten", bp_per_level = 300, level = 6 },
    { kind = "spell_immunity", spell = "synthetic:spark" },
    { kind = "opening_spell", spell = "synthetic:hasten", mastery = 3, power = 3 },
]
[scenario.attacker_hero.eagle_eye]
chance_bp = 4000
spells = [
    "synthetic:boon", "synthetic:bane", "synthetic:hallow", "synthetic:purge", "synthetic:gloom",
    "synthetic:corrode", "synthetic:aegis", "synthetic:rage", "synthetic:dazzle", "synthetic:uproot",
]
[scenario.attacker_hero.masteries]  # Storm magic: Basic, six spells at Advanced (per spell since E04b T8a)
"synthetic:spark" = 2
"synthetic:cinders" = 2
"synthetic:arc" = 1
"synthetic:ward" = 1
"synthetic:hasten" = 1
"synthetic:drag" = 1
"synthetic:fury" = 1
"synthetic:smiting" = 1
"synthetic:riposte" = 1
"synthetic:mend" = 1
"synthetic:blaze" = 1
"synthetic:glass" = 1
"synthetic:haze" = 2
"synthetic:charm" = 2
"synthetic:scorch" = 2
"synthetic:blink" = 1
"synthetic:snare" = 2
"synthetic:offer" = 1
"synthetic:copy" = 1

# The defender is led by a hero too (E04a T11c), so both sides may retreat and surrender (the
# owners can pay) and the workload runs the heroes' stack effects (BAT-HER-005/006). Corwin at
# level 1, given directly: Basic Gunnery (he commands his Bolt Thrower: one shot per turn, 50 %
# double damage), his specialty (Wisps +2 attack and +1 damage, flying creatures +1 defense), a
# Far Scope (shooters without range penalty, flying creatures +1 speed, 10 % surrender discount),
# a Vigor Stone (living creatures +25 % hit points, regenerating 10) and, as the expansion's
# Storm Regalia gives it, shooters that shoot while adjacent. The base pack has one faction, so
# an alignment group (BAT-HER-007) could change nothing here. He casts with Expert Stone magic
# (Blight and the timed stone spells, their mass versions among them; E04b T3a) and no Storm
# mastery (Spark, Arc), and his timed spells last 2 rounds longer, as a Storm Orb's would. Since
# E04b T3b1 he shields his stacks (Aegis, mass at Expert) and hallows them against storm spells;
# since T3b1b he purges every stack's effects (mass at Expert, sparing Drag), since T3b2 he
# enrages one (a Frenzy); since T3c he is a level-1 specialist in Boon (a Bless: his blessed
# stacks' strikes gain 3 % of their base per level step, BAT-MAG-020), as given; since T4a he
# veils a stack (Veil, an Anti-Magic: Expert keeps spells below level 5 off it); since T4b he
# dazzles one (Dazzle, a Blind at Expert: it loses its turns and does not retaliate); since T4c
# he enrages the stacks around a hex (Rampage, a Berserk at Expert: two hexes around, his own
# stacks too), which then attack the nearest stack on their own; since T5a he raises a three-hex
# wall (Bulwark, a Force Field at Expert), and his Purge at Expert also removes the walls and fire;
# since T5c1 he hides eight pits (Mire, a Quicksand at Expert), which stop Brea's walkers; since
# T5b he takes away any spell obstacle he sees (Uproot, a Remove Obstacle at Expert: Brea's fire,
# his own walls and pits, her mines once they showed themselves; the battlefield has no natural
# obstacles); since T6a he raises his stacks for good (Revive at Expert: 310 hit points); since
# T6b he summons twelve Shades at a time (Conjure, a Summon Elemental at Expert: 4 per power).
# Since E04b T9b (the casting workload) Brea's army starts slowed and cursed (opening Drag and
# Bane at Expert, as Armor of the Damned's), his stacks resist 10 % of her hostile spells and
# never take her Cinders (a Pendant), and his Advanced Eagle Eye (50 %) may learn her spells up
# to level 3 that he does not know but Snare. (Resistance stays off Brea's side: it would draw on
# Corwin's opening spells, a public roll before the first cast, which the server's hygiene tests
# keep out of the frames they compare across seeds.)
[scenario.defender_hero]
hero_type = "synthetic:corwin"
attack = 1
defense = 3
power = 3
knowledge = 1
mana = 40
max_mana = 40
spell_book = [
    "synthetic:spark", "synthetic:arc", "synthetic:blight", "synthetic:zeal", "synthetic:gloom",
    "synthetic:boon", "synthetic:bane", "synthetic:corrode", "synthetic:aegis",
    "synthetic:hallow", "synthetic:purge", "synthetic:rage", "synthetic:veil",
    "synthetic:dazzle", "synthetic:rampage", "synthetic:bulwark", "synthetic:mire",
    "synthetic:uproot", "synthetic:revive", "synthetic:conjure",
]
surrender_discount_bp = 1000
ballista = { level = 1, shots = 1, double_damage_chance_bp = 5000 }
effects = [
    { kind = "stack_stat", creatures = { creature = "synthetic:wisp" }, stat = "attack", op = "add", amount = 2 },
    { kind = "stack_stat", creatures = { creature = "synthetic:wisp" }, stat = "min_damage", op = "add", amount = 1 },
    { kind = "stack_stat", creatures = { creature = "synthetic:wisp" }, stat = "max_damage", op = "add", amount = 1 },
    { kind = "stack_stat", creatures = { flag = "flying" }, stat = "defense", op = "add", amount = 1 },
    { kind = "no_range_penalty", creatures = { flag = "shooter" } },
    { kind = "stack_stat", creatures = { flag = "flying" }, stat = "speed", op = "add", amount = 1 },
    { kind = "stack_stat", creatures = { flag = "alive" }, stat = "hit_points", op = "percent_bp", amount = 2500 },
    { kind = "regeneration", creatures = { flag = "alive" }, hit_points = 10 },
    { kind = "shoot_when_adjacent", creatures = { flag = "shooter" } },
    { kind = "spell_duration", rounds = 2 },
    { kind = "spell_specialty", spell = "synthetic:boon", bp_per_level = 300, level = 1 },
    { kind = "magic_resistance", bp = 1000 },
    { kind = "spell_immunity", spell = "synthetic:cinders" },
    { kind = "opening_spell", spell = "synthetic:drag", mastery = 3, power = 2 },
    { kind = "opening_spell", spell = "synthetic:bane", mastery = 3, power = 2 },
]
[scenario.defender_hero.eagle_eye]
chance_bp = 5000
spells = [
    "synthetic:hasten", "synthetic:drag", "synthetic:mend", "synthetic:ward", "synthetic:fury",
    "synthetic:smiting", "synthetic:riposte", "synthetic:blaze", "synthetic:scorch",
    "synthetic:cinders", "synthetic:haze", "synthetic:charm", "synthetic:blink",
]
[scenario.defender_hero.masteries]  # Expert Stone magic: his stone spells at Expert (per spell since E04b T8a)
"synthetic:blight" = 3
"synthetic:zeal" = 3
"synthetic:gloom" = 3
"synthetic:boon" = 3
"synthetic:bane" = 3
"synthetic:corrode" = 3
"synthetic:aegis" = 3

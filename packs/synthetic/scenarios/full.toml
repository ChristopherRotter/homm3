# Seven stacks per side (full armies) plus war machines; used for benchmarks and clone-cost
# measurements.

[scenario]
id = "full"
packs = ["synthetic"]
profile = "synthetic:faithful"
attacker_war_machines = ["synthetic:bolt_thrower", "synthetic:aid_tent"]
defender_war_machines = ["synthetic:bolt_thrower", "synthetic:supply_wagon"]

# Only the attacker is led by a hero, so only it may get lucky strikes (Q-0003). The battle hero
# is given directly (Q31): Brea at level 1, Drill (Tactics) at Advanced, Basic Marksmanship,
# Brawling and Plating (+10 % shots, +10 % melee, −5 % damage taken), Basic Gunnery (she
# commands her Bolt Thrower: one shot per turn, 50 % double damage) and Basic Mending (she
# commands her Aid Tent: heals 1–20 instead of 1–10), wearing a Lucky Knot (morale +1, luck +1).
# Her Tactics give her a tactics phase with a five-column zone before round 1 (BAT-TAC-001).
[scenario.attacker_hero]
hero_type = "synthetic:brea"
attack = 2
defense = 2
power = 1
knowledge = 1
tactics = 2
mana = 10
max_mana = 10
ranged_bp = 1000
melee_bp = 1000
reduction_bp = 500
ballista = { shots = 1, double_damage_chance_bp = 5000 }
tent = { heal_bonus_bp = 10000 }
effects = [{ kind = "morale", amount = 1 }, { kind = "luck", amount = 1 }]

[[attacker]]
slot = 0
creature = "synthetic:spearman"
count = 40
[[attacker]]
slot = 1
creature = "synthetic:brute"
count = 12
[[attacker]]
slot = 2
creature = "synthetic:wisp"
count = 30

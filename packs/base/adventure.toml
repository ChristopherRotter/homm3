# The Restoration of Erathia's adventure-map data (E08 T4; format: crates/h3-pack-adventure).
# Hand-written source with its sources beside each value: the harvester never writes this file
# (E08 decision 10). The rules that read it: docs/rules/catalog/adventure.toml.

[params]
# ADV-MOV-004: a step on terrain native to every creature of the army costs as on dirt. Wiki
# (Movement): "the penalty is removed"; VCMI 1.7.5 lib/GameConstants.h BASE_MOVEMENT_COST = 100.
native_cost = 100
# ADV-MOV-001: a day's movement points on land by the slowest speed in the army, from speed 0.
# Original data: movement.txt (H3bitmap.lod; H3ab_bmp.lod has the same file), column 2, read by
# 0x4D7240 into 0x698A98 and indexed by the slowest speed in 0x4E4990 (E08 T4 reading). The file
# goes on with 2000 up to speed 20, where the original caps the speed; faster armies take the
# last entry here. The wiki (Movement) has the same row; VCMI gives 1500 below speed 3 (no army
# creature is that slow).
land_points = [1300, 1360, 1430, 1500, 1560, 1630, 1700, 1760, 1830, 1900, 1960, 2000]
# ADV-FOG-001: a hero's scouting radius without Scouting or artifacts. Original data:
# skill_scouting (0x63E9D8) holds 5, 6, 7, 8 for no, Basic, Advanced and Expert Scouting; VCMI
# baseScoutingRange 5.
scouting_radius = 5
# Setup bounds (E08 T5a; ADR-0015 point 6: sizes come from the map, bounded by the ruleset). The
# map editor's largest map is extra large, 144 x 144 (VCMI 1.7.5 lib/mapping/CMapHeader.h
# MAP_SIZE_XLARGE; larger sizes are HotA's), on two levels, the surface and the underground (the
# .h3m header's two-levels flag), for eight players, one per colour (VCMI PlayerColor::
# PLAYER_LIMIT_I = 8; the .h3m header's eight player records). docs/formats/h3m.md, "Input
# bounds", gives the same limits for the reader.
max_map_size = 144
max_levels = 2
max_players = 8
# A hero's army has seven slots: the .h3m hero body's army is 7 stacks (docs/formats/h3m.md);
# VCMI 1.7.5 lib/constants/NumericConstants.h ARMY_SIZE = 7; the battle pack's army_slots.
army_slots = 7
# ADV-ARM-007 (E08 T50; the user, E08 decisions 109 and 114): a stack holds at most 1 000 000
# creatures. Not the original's: its army keeps 32-bit counts, the map 16-bit ones and the exchange
# moves a count through 16 bits (A-15, fixed); the engine supports a reasonable count instead, far
# above any game's stacks, with count x the largest hit points (1 000) within 32 bits. A merge
# past it is refused, a split keeps both stacks within it, a joining or raised group its stack
# cannot take whole goes to a free slot (decision 115).
max_stack_count = 1000000
# GAM-SET-001 (E08 T6b): a hero placed without an army of its own gets its type's first starting
# stack always, the second slot's with 88 % and the third's with 25 %, each its own roll of 1-100.
# Code reading: 0x4C9730 (new_game_heroes 0x4BFEA6 for every hero, before a placed hero's custom
# army replaces it in placed_hero_setup 0x4D8C6B; survey E08-progression.md §3.1) rolls
# random_between(1, 100) <= 88 for the second slot (a war machine there needs the same roll) and
# then <= 25 for the third. The wiki's hero template has 88 % and 25 % for SoD; VCMI 1.7.5
# config/gameConfig.json startingStackChances [100, 88, 25] uses one roll for both (ADV-Q6).
starting_stack_chances = [88, 25]
# ADV-MOV-009, ADV-MOV-010 (E08 T40; read by the step's price from T41): a flying hero's straight
# step, and a water-walking hero's from water, by the level of its flying or water walking (0 to 2
# the spells', later; 3 Angel Wings' and Boots of Levitation's). Code reading (survey
# E08-hero-movement.md section 2.1 points 4, 5): fly_walk_step_cost (0x6778AC) holds 140, 140, 120,
# 100 for both, read by step_cost 0x4B1740. The wiki (Fly, Water Walk: "40% penalty", 20 % at
# advanced, none at expert) and VCMI 1.7.5 config/spells/adventure.json (Fly and Water Walk 40,
# 40, 20, 0 over 100) agree on the amounts; two fields so that data can tell the two apart.
fly_cost = [140, 140, 120, 100]
water_walk_cost = [140, 140, 120, 100]

# GAM-BAT-001 (E08 T19a): where a battle on the map is fought, by the defender's tile, in the
# original's order (survey E04c-battlefields.md section 4, code 0x4FCE20, installation.md
# section 7.26): underground on subterranean ground; else on a coast tile (the map's flag 0x40,
# docs/formats/h3m.md; E04c batch 3b) on sand with the shore's battlefield; else on the tile's
# terrain. The core's "desert" is the original's sand (terrain code 1). Boats, mines and sieges
# come with the increments that build them; a special ground on the tile (Cursed Ground and the
# like) with the ground kinds (E08 T20a).
[params.battle]
underground = "subterranean"
coast = "desert"
coast_battlefield = "shore"

# E08 T20a2a: the wandering monsters' parameters.
# ADV-MON-002: the aggression by disposition code (0 compliant, 1 friendly, 2 aggressive, 3 hostile,
# 4 savage), drawn when the game is built. Code reading (survey E08-battles.md section 1.3): the
# map loader 0x5013B0's switch gives compliant -4, friendly random_between(1, 7), aggressive (1,
# 10), hostile (4, 10), savage 10. VCMI 1.7.5 CGCreature::initObj and the wiki (Wandering
# creature: "-4 Compliant; 1-7 Friendly; 1-10 Aggressive; 4-10 Hostile; 10 Savage") agree.
# ADV-FOG-006: what a player sees of a monster's count, one word each from these counts on: the
# original's 0x44ADE0 (survey E08-battles.md section 0) and the wiki (Wandering creature: Few 1-4,
# Several 5-9, Pack 10-19, Lots 20-49, Horde 50-99, Throng 100-249, Swarm 250-499, Zounds
# 500-999, Legion 1000 and more).
# ADV-MON-008 (E08 T20b1): a group's price to join is its creature's gold cost times its count,
# offered only when the player can pay: monster_join_for_gold 0x4A7250 (creature record +0x38, the
# gold of the cost; compared with the owner's gold at 0x4A72A5). VCMI 1.7.5 CGCreature::joinDecision
# (getRecruitCost(GOLD) * getStackCount()) agrees.
[params.monsters]
aggression = [[-4, -4], [1, 7], [1, 10], [4, 10], [10, 10]]
count_words = [5, 10, 20, 50, 100, 250, 500, 1000]
price_resource = "gold"

# GAM-RES-002 (E08 T13a): the starting resources by the game's difficulty, from 0 (easy) to 4
# (impossible), a human player's and a computer player's; the engine gives every player the human
# row (E08 decision 16: no human/computer distinction yet). Code reading (survey
# docs/rules/surveys/E08-objects.md §7.2): new_game_heroes (0x4C01EE) copies, for each playing
# colour, a human's row of the chosen difficulty (game +0x1F6D8) from 0x678170 and a computer's
# from 0x6781FC. VCMI 1.7.5 config/difficulty.json (human, ai; pawn to king) and the wiki
# (Difficulty level) have the same ten rows. The difficulty is the game's, not the map header's
# byte (that is the map's rating).
[[difficulty]]
human = { wood = 30, ore = 30, mercury = 15, sulfur = 15, crystal = 15, gems = 15, gold = 30000 }
computer = { wood = 5, ore = 5, mercury = 2, sulfur = 2, crystal = 2, gems = 2, gold = 5000 }

[[difficulty]]
human = { wood = 20, ore = 20, mercury = 10, sulfur = 10, crystal = 10, gems = 10, gold = 20000 }
computer = { wood = 10, ore = 10, mercury = 4, sulfur = 4, crystal = 4, gems = 4, gold = 7500 }

[[difficulty]]
human = { wood = 15, ore = 15, mercury = 7, sulfur = 7, crystal = 7, gems = 7, gold = 15000 }
computer = { wood = 15, ore = 15, mercury = 7, sulfur = 7, crystal = 7, gems = 7, gold = 10000 }

[[difficulty]]
human = { wood = 10, ore = 10, mercury = 4, sulfur = 4, crystal = 4, gems = 4, gold = 10000 }
computer = { wood = 15, ore = 15, mercury = 7, sulfur = 7, crystal = 7, gems = 7, gold = 10000 }

[[difficulty]]
human = {}
computer = { wood = 15, ore = 15, mercury = 7, sulfur = 7, crystal = 7, gems = 7, gold = 10000 }

# ADV-MOV-003, ADV-MOV-007: the straight cost of a step on each terrain (the .h3m terrain codes 0-9
# in this order). Wiki (Movement) and VCMI 1.7.5 config/terrains.json agree. Water is sailed by
# boat only (VCMI type WATER); rock is never entered (VCMI moveCost -1, type ROCK).
# E08 T29: `pathfinding` is a step's cost with Pathfinding at Basic, Advanced and Expert, read
# for the map's terrain shares (ADV-MAP-002) until the hero's movement skills come; left out, the
# cost at every level. Code reading: step_cost_table 0x63E510 (survey E08-progression.md §10.3:
# sand and snow 125, 100, 100; swamp 150, 125, 100; rough 100 at every level). The wiki
# (Pathfinding: 25, 50 or 75 points less per tile, at least 100) and VCMI 1.7.5 config/skills.json
# (ROUGH_TERRAIN_DISCOUNT 25, 50, 75) agree (survey E04-skills.md, row 0).
[[terrain]]
terrain = "dirt"
cost = 100

[[terrain]]
terrain = "desert"
cost = 150
pathfinding = [125, 100, 100]

[[terrain]]
terrain = "grass"
cost = 100

[[terrain]]
terrain = "snow"
cost = 150
pathfinding = [125, 100, 100]

[[terrain]]
terrain = "swamp"
cost = 175
pathfinding = [150, 125, 100]

[[terrain]]
terrain = "rough"
cost = 125
pathfinding = [100, 100, 100]

[[terrain]]
terrain = "subterranean"
cost = 100

[[terrain]]
terrain = "lava"
cost = 100

[[terrain]]
terrain = "water"
passage = "water"
cost = 100

[[terrain]]
terrain = "rock"
passage = "impassable"

# ADV-MOV-003: roads (the .h3m road codes 1-3 in this order). Wiki (Movement) and VCMI 1.7.5
# config/roads.json agree.
[[road]]
id = "dirt_road"
name = "Dirt road"
cost = 75

[[road]]
id = "gravel_road"
name = "Gravel road"
cost = 65

[[road]]
id = "cobblestone_road"
name = "Cobblestone road"
cost = 50

# Rivers (the .h3m river codes 1-4 in this order; VCMI 1.7.5 config/rivers.json): appearance

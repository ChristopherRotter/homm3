# ADV-MON-001 (E08 T20a2a): wandering monsters. Class 54 is a monster of the creature its subclass
# names; classes 71 (any level), 72 to 75 (levels 1 to 4) and 162 to 164 (levels 5 to 7) are random
# monsters (survey E08-battles.md section 1.1; the map file's body is the same for all nine). Each
# is attacked from the tile beside it and may be from above (survey section 2.3: class 54 is on
# both of the original's lists). ADV-MON-003: a random monster's creature is drawn when the game
# is built among the creatures of its levels (code reading 0x4C92C0; VCMI
# GameRandomizer::rollCreature); the war machines never, nor the creatures the packs list in
# not_random_monsters. Their visit comes with E08 T20b.
[[object_type]]
id = "monster"
name = "Monster"
visit = "neighbour"
from_above = true
monster = {}

[[object_type]]
id = "random_monster"
name = "Random monster"
visit = "neighbour"
from_above = true
monster = { levels = [1, 7] }

[[object_type]]
id = "random_monster_1"
name = "Random monster (level 1)"
visit = "neighbour"
from_above = true
monster = { levels = [1, 1] }

[[object_type]]
id = "random_monster_2"
name = "Random monster (level 2)"

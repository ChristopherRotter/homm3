# ADV-GRD-001 (E08 T20a2a): the special grounds of the Restoration of Erathia, Cursed Ground (class
# 21) and Magic Plains (46). A ground lies on its picture's tiles and is never visited (its map
# templates have no blocked and no visitable tile); a battle on a tile it lies on is fought on its
# battlefield, the battle part's (code reading 0x4643B0 and 0x4FCE20, installation.md section
# 7.26: field 2 for class 21, field 1 for class 46; E04c batch 3a).
[[object_type]]
id = "cursed_ground"
name = "Cursed Ground"
visit = "enter"
from_above = true
ground = { battlefield = "cursed_ground" }

[[object_type]]
id = "magic_plains"
name = "Magic Plains"
visit = "enter"
from_above = true
ground = { battlefield = "magic_plains" }

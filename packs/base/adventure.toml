# E08 T61a, increment 7 (ADR-0016 point 4; survey docs/rules/surveys/E08-rewards.md, design
# section 8 of increment 7's note in docs/epics/E08-log.md): the objects that hand a visiting hero
# something. The visit modes are the original's per-class lists (0x63AA58 "cannot be entered",
# 0x63AB00 "visitable from above"): classes 5, 6, 22, 26, 65-69, 81, 93 and 101 are visited from a
# neighbour and from above, every other class here is entered and not visitable from above. The
# visits come with T62, the draws when the game is built with T61b; until then a step onto these
# objects is refused as a blocker's (ADV-OBJ-003).

# ADV-PIK-005: a treasure chest (class 101). setup_map_objects (0x4C0CC0, case 101 at 0x4C1DD8)
# draws r in 0-99: below 32 1 000 gold, below 64 1 500, below 95 2 000, else a treasure artifact
# (random_artifact_of_level(2), 0x4C94D0). The visit (0x4A6520): an artifact with a full backpack
# counts as 1 000 gold; gold asks gold or (gold - 500) times Learning as experience (0x4A6440).
# Survey section 2; VCMI config/objects/rewardablePickable.json treasureChest and the wiki agree
# but for the full backpack (batch E7's E7-1 to E7-3).
[[object_type]]
id = "treasure_chest"
name = "Treasure Chest"
visit = "neighbour"
from_above = true
chest = { resource = "gold", gold = [[32, 1000], [32, 1500], [31, 2000]], artifact = ["treasure"], full_backpack = 1000, experience_offset = 500 }


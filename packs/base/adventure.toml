# The Restoration of Erathia's adventure-map data (E08 T4; format: crates/h3-pack-adventure).
# Hand-written source with its sources beside each value: the harvester never writes this file
# (E08 decision 10). The rules that read it: docs/rules/catalog/adventure.toml.

[params]
# ADV-MOV-004: a step on terrain native to every creature of the army costs as on dirt. Wiki
# (Movement): "the penalty is removed"; VCMI 1.7.5 lib/GameConstants.h BASE_MOVEMENT_COST = 100.
native_cost = 100
# ADV-MOV-001: a day's movement points on land by the slowest speed in the army, from speed 0.
# Original data: movement.txt (H3bitmap.lod; H3ab_bmp.lod has the same file), column 2, read by
# 0x4D7240 into 0x698A98 and indexed by the slowest speed in 0x4E4990 (E08 T4 reading). The file
# goes on with 2000 up to speed 20, where the original caps the speed; faster armies take the
# last entry here. The wiki (Movement) has the same row; VCMI gives 1500 below speed 3 (no army
# creature is that slow).
land_points = [1300, 1360, 1430, 1500, 1560, 1630, 1700, 1760, 1830, 1900, 1960, 2000]
# ADV-FOG-001: a hero's scouting radius without Scouting or artifacts. Original data:
# skill_scouting (0x63E9D8) holds 5, 6, 7, 8 for no, Basic, Advanced and Expert Scouting; VCMI
# baseScoutingRange 5.
scouting_radius = 5
# Setup bounds (E08 T5a; ADR-0015 point 6: sizes come from the map, bounded by the ruleset). The
# map editor's largest map is extra large, 144 x 144 (VCMI 1.7.5 lib/mapping/CMapHeader.h
# MAP_SIZE_XLARGE; larger sizes are HotA's), on two levels, the surface and the underground (the
# .h3m header's two-levels flag), for eight players, one per colour (VCMI PlayerColor::
# PLAYER_LIMIT_I = 8; the .h3m header's eight player records). docs/formats/h3m.md, "Input
# bounds", gives the same limits for the reader.
max_map_size = 144
max_levels = 2
max_players = 8
# A hero's army has seven slots: the .h3m hero body's army is 7 stacks (docs/formats/h3m.md);
# VCMI 1.7.5 lib/constants/NumericConstants.h ARMY_SIZE = 7; the battle pack's army_slots.
army_slots = 7
# GAM-SET-001 (E08 T6b): a hero placed without an army of its own gets its type's first starting
# stack always, the second slot's with 88 % and the third's with 25 %, each its own roll of 1-100.
# Code reading: 0x4C9730 (placed heroes: 0x487290 -> 0x486590 when the map gives no stacks) rolls
# random_between(1, 100) <= 88 for the second slot (a war machine there needs the same roll) and
# then <= 25 for the third. The wiki's hero template has 88 % and 25 % for SoD; VCMI 1.7.5
# config/gameConfig.json startingStackChances [100, 88, 25] uses one roll for both (ADV-Q6).
starting_stack_chances = [88, 25]

# ADV-MOV-003, ADV-MOV-007: the straight cost of a step on each terrain (the .h3m terrain codes 0-9
# in this order). Wiki (Movement) and VCMI 1.7.5 config/terrains.json agree. Water is sailed by
# boat only (VCMI type WATER); rock is never entered (VCMI moveCost -1, type ROCK).
[[terrain]]
terrain = "dirt"
cost = 100

[[terrain]]
terrain = "desert"
cost = 150

[[terrain]]
terrain = "grass"
cost = 100

[[terrain]]
terrain = "snow"
cost = 150

[[terrain]]
terrain = "swamp"
cost = 175

[[terrain]]
terrain = "rough"
cost = 125

[[terrain]]
terrain = "subterranean"
cost = 100

[[terrain]]
terrain = "lava"
cost = 100

[[terrain]]
terrain = "water"
passage = "water"
cost = 100

[[terrain]]
terrain = "rock"
passage = "impassable"

# ADV-MOV-003: roads (the .h3m road codes 1-3 in this order). Wiki (Movement) and VCMI 1.7.5
# config/roads.json agree.
[[road]]
id = "dirt_road"
name = "Dirt road"
cost = 75

[[road]]
id = "gravel_road"
name = "Gravel road"
cost = 65

[[road]]
id = "cobblestone_road"
name = "Cobblestone road"
cost = 50

# Rivers (the .h3m river codes 1-4 in this order; VCMI 1.7.5 config/rivers.json): appearance
# only, no step cost reads them.
[[river]]
id = "clear_river"
name = "Clear river"

[[river]]
id = "icy_river"
name = "Icy river"

[[river]]
id = "muddy_river"
name = "Muddy river"

[[river]]
id = "lava_river"
name = "Lava river"

# Object types (E08 T12a; ADR-0016 point 4, ADV-OBJ-002). The import maps the .h3m classes and
# subclasses to these keys (crates/h3-map/src/import/codes.rs); every other class is a blocker.
# Survey docs/rules/surveys/E08-objects.md (a code reading confirmed by a second one, VCMI 1.7.5
# and the wiki). Visits (survey §2.1, §2.3): the original's per-class settings (0x41B500) list
# classes 9, 12, 76 and 79 as "cannot be entered" (visited from a neighbouring tile; VCMI
# blockVisit) and 9, 12, 76, 79 and 212 as "visitable from above"; every other class here is
# entered and not visitable from above (VCMI's visitableFrom, the same members).

# ADV-PIK-001: resource piles (class 79, subclass = the resource: 0 wood, 1 mercury, 2 ore,
# 3 sulfur, 4 crystal, 5 gems, 6 gold). A random amount is drawn at setup (0x4C0CC0 via
# 0x4C1AD1): 5-10 for wood, ore and gold, 3-6 for the others; the wiki (Resources) agrees ("5-10
# units of Wood", "3-6 units" of mercury, sulfur and crystal, "500-1000 units of gold"); VCMI
# 1.7.5 config/objects/moddables.json has 6-10 and 3-5 (D-5: the user took the reading, ADV-Q10).
# Gold counts in hundreds, a map's fixed amount too (0x4A4C25; VCMI MapFormatH3M.cpp readResource
# amountMultiplier).
[[object_type]]
id = "pile_wood"
name = "Wood"
visit = "neighbour"
from_above = true
pickup = { resource = "wood", amount = [5, 10] }

[[object_type]]
id = "pile_mercury"
name = "Mercury"
visit = "neighbour"
from_above = true
pickup = { resource = "mercury", amount = [3, 6] }

[[object_type]]
id = "pile_ore"
name = "Ore"
visit = "neighbour"
from_above = true
pickup = { resource = "ore", amount = [5, 10] }

[[object_type]]
id = "pile_sulfur"
name = "Sulfur"
visit = "neighbour"
from_above = true
pickup = { resource = "sulfur", amount = [3, 6] }

[[object_type]]
id = "pile_crystal"
name = "Crystal"
visit = "neighbour"
from_above = true
pickup = { resource = "crystal", amount = [3, 6] }

[[object_type]]
id = "pile_gems"
name = "Gems"
visit = "neighbour"
from_above = true
pickup = { resource = "gems", amount = [3, 6] }

[[object_type]]
id = "pile_gold"
name = "Gold"
visit = "neighbour"
from_above = true
pickup = { resource = "gold", amount = [5, 10], multiplier = 100 }

# ADV-PIK-002: a random resource (class 76) becomes a pile of one of the seven resources at
# setup, equal chances (0x4C9DD0: random_between(0, 6), before the amounts); its amount is the
# file's or drawn as the pile's. VCMI CGResource::pickRandomObject: the same.
[[object_type]]
id = "random_resource"
name = "Random resource"
visit = "neighbour"
from_above = true
pickup_one_of = ["pile_wood", "pile_mercury", "pile_ore", "pile_sulfur", "pile_crystal", "pile_gems", "pile_gold"]

# ADV-PIK-003: a campfire (class 12): at setup an amount of 4-6, then one of wood to gems
# (0x4C0CC0, case 12 at 0x4C0EE5); the visit gives that many of it and 100 times as much gold
# (0x4A1120). VCMI config/objects/rewardablePickable.json campfire: the same six resources and
# pairs; the wiki (Campfire): 400-600 gold and 4-6 of another resource.
[[object_type]]
id = "campfire"
name = "Campfire"
visit = "neighbour"
from_above = true
pickup_paired = { amount = [4, 6], resources = ["wood", "mercury", "ore", "sulfur", "crystal", "gems"], paired = "gold", multiplier = 100 }

# ADV-VIS-001: the Cartographers (class 13, subclass 0 water, 1 land, 2 subterranean): 1 000 gold
# (0x4A8A14 against 0x3E8; VCMI config/objects/cartographer.json; the wiki's SoD price), then
# every tile of the kind's terrains on both levels (masks set at 0x4CE457: water 0x100, land 0xBF,
# subterranean 0x40; rock in none). VCMI reveals the same sets by terrain layer; the wiki agrees
# by terrain.
[[object_type]]
id = "cartographer_water"
name = "Cartographer (water)"
visit = "enter"
from_above = false
reveal_terrain = { terrains = ["water"], price = { gold = 1000 } }

[[object_type]]
id = "cartographer_land"
name = "Cartographer (land)"
visit = "enter"
from_above = false
reveal_terrain = { terrains = ["dirt", "desert", "grass", "snow", "swamp", "rough", "lava"], price = { gold = 1000 } }

[[object_type]]
id = "cartographer_subterranean"
name = "Cartographer (subterranean)"
visit = "enter"
from_above = false
reveal_terrain = { terrains = ["subterranean"], price = { gold = 1000 } }

# ADV-VIS-002: the Redwood Observatory (class 58) and the Pillar of Fire (class 60) reveal radius
# 20 around the visited tile at every visit (0x4A9AC6). VCMI config/objects/observatory.json and
# the wiki ("a 20 tile radius around the observatory"): the same.
[[object_type]]
id = "redwood_observatory"
name = "Redwood Observatory"
visit = "enter"
from_above = false
reveal_area = { radius = 20 }

[[object_type]]
id = "pillar_of_fire"
name = "Pillar of Fire"
visit = "enter"
from_above = false
reveal_area = { radius = 20 }


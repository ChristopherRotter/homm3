# Lanes: which paths each work lane owns (docs/08-work-process.md, "Lanes"; AGENTS.md, "Lanes").
#
# One agent at a time works in a lane, on a branch `<lane>/<task>`, and a lane's pull request
# changes only its own paths and the common ones. Shared paths change only through small, separate
# pull requests (branch `shared/<topic>`) that merge first. `cargo xtask check-lane` enforces this
# on every pull request (CI, `.github/workflows/ci.yml`); a deliberate cross-lane change carries
# the PR label `cross-lane` (locally: `--cross-lane`).
#
# Patterns: `dir/` matches everything below `dir`; `prefix*` matches every path starting with
# `prefix`; anything else matches that one file. The longest matching pattern decides the owner.
# Every tracked path must have an owner: a new top-level file or directory is added here first
# (a shared change).
#
# Ownership decided by the user on 2026-10-07: `h3-content` and `h3-pack` stayed with battle until
# the content split (R01 decision 6) made these core crates shared paths; the battle's parts
# (`h3-content-battle`, `h3-pack-battle`) are battle's. The formats/tools crates (`h3-formats`,
# `h3-harvest`, `h3-experiment`) are battle's until a formats/tools lane opens. The AI lane took
# `h3-sim` and `h3-ffi` at E05 (the user, 2026-10-18, AI-Q1). The battle lane leads E11 (the
# user, 2026-10-24, Q58). The epics E15 and E18–E20 have no lane yet: their files get a pattern
# here when they start.

[shared]
paths = [
    # Workspace, toolchain, gates, CI.
    "Cargo.toml",
    "arch.toml",
    "lanes.toml",
    "deny.toml",
    "clippy.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
    "coverage-exclusions.toml",
    ".cargo/",
    ".github/",
    ".gitattributes",
    ".gitignore",
    "xtask/",
    "scripts/",
    "benches/README.md",
    # Seam and kernel crates; the core content every context reads (R01 decision 6).
    "crates/h3-kernel/",
    "crates/h3-contracts/",
    "crates/h3-content/",
    "crates/h3-pack/",
    # Project-wide docs and process.
    "AGENTS.md",
    "CLAUDE.md",
    "README.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "docs/README.md",
    "docs/01-vision.md",
    "docs/02-architecture.md",
    "docs/03-domain.md",
    "docs/04-rules-and-sources.md",
    "docs/05-testing.md",
    "docs/06-security.md",
    "docs/07-simulation-and-ai.md",
    "docs/08-work-process.md",
    "docs/BACKLOG.md",
    "docs/HANDOFF.md",
    # Shared refactors' design notes (BACKLOG's R rows; R01 the content split).
    "docs/epics/R0*",
    "docs/pull_request_template.md",
    "docs/adr/",
    "docs/rules/catalog/README.md",
    "docs/rules/catalog/kernel.toml",
    # The Heroes3.exe address map's README and the generated H3API port (docs/exe/README.md).
    "docs/exe/",
]

# Any lane may change these: the two registries (lane-prefixed ids and one block per lane keep
# concurrent additions apart) and the lockfile (generated; a lane may add a dependency to its own
# crate, the full verify's `deny` gate checks it, and a heavy dependency stops the line anyway;
# user, 2026-10-07). The executable's address map and record layouts are common too: a lane
# records what it reads in the same pull request (one line per entry, sorted by address, keeps
# concurrent additions apart; docs/exe/README.md).
[common]
paths = [
    "docs/OPEN-QUESTIONS.md",
    "docs/stubs.toml",
    "Cargo.lock",
    # The client workspace's lockfile (the client lanes' otherwise): an engine crate the client
    # builds that changes its dependencies changes it too, in the same pull request; the verify's
    # `clients-lock` gate checks it (user, 2026-10-14).
    "clients/Cargo.lock",
    # The client foundation both client lanes build on (the user, 2026-10-23, at the client lane's
    # split): the decoders, the compositor, the SDL adapter, the workspace's files and gates, the
    # string catalogue. Either client lane changes them in its own pull request: an additive change
    # freely, a change in behaviour noted in the other client lane's inbox; `clients/scripts/check.sh`
    # runs every client test (docs/08-work-process.md, "Lanes").
    "clients/Cargo.toml",
    "clients/deny.toml",
    "clients/.gitignore",
    "clients/README.md",
    "clients/scripts/",
    "clients/crates/h3-assets/",
    "clients/crates/h3-render/",
    "clients/crates/h3-sdl/",
    "clients/text/",
    # The capture harness (the user, 2026-10-23): any lane changes it, the adventure lane's
    # recipes and reads included, without the `cross-lane` label; a change runs the harness check
    # (`clients/capture/README.md`).
    "clients/capture/",
    # The survey index: each lane adds its epics' sections (E08 T2).
    "docs/rules/surveys/README.md",
    "docs/exe/map.toml",
    "docs/exe/structs.toml",
    # Each lane's queue, for its inbox only: a lane adds what another lane should learn about to
    # that lane's inbox itself, never its tasks (user, 2026-10-19; docs/08-work-process.md,
    # "Lanes"). The longest match makes these files common inside each lane's folder.
    "docs/lanes/adventure/QUEUE.md",
    "docs/lanes/ai/QUEUE.md",
    "docs/lanes/battle/QUEUE.md",
    "docs/lanes/client/QUEUE.md",
    "docs/lanes/map-client/QUEUE.md",
    "docs/lanes/server/QUEUE.md",
]

[[lane]]
name = "battle"
code = "BAT"
paths = [
    "crates/h3-battle/",
    # The original's battle AI, the computer's policy of a battle side (E23, ADR-0027).
    "crates/h3-battle-ai/",
    "crates/h3-content-battle/",
    "crates/h3-pack-battle/",
    # The CLI's battle commands and golden replays; its AI commands are the AI lane's (`src/ai/`).
    "crates/h3-cli/",
    # Until a formats/tools lane opens.
    "crates/h3-formats/",
    "crates/h3-harvest/",
    "crates/h3-experiment/",
    "docs/formats/",
    "packs/",
    "fixtures/",
    "experiments/",
    "benches/battle/",
    "docs/rules/catalog/battle.toml",
    "docs/rules/quirks-ledger.md",
    "docs/rules/surveys/",
    "docs/experiments/",
    "docs/epics/E01*",
    "docs/epics/E02*",
    "docs/epics/E03*",
    "docs/epics/E04*",
    "docs/epics/E11*",
    "docs/epics/E23*",
    "docs/lanes/battle/",
]

[[lane]]
name = "adventure"
code = "ADV"
paths = [
    "crates/h3-adventure/",
    "crates/h3-game/",
    "crates/h3-map/",
    "crates/h3-pack-adventure/",
    # The hero model beneath the contexts and its rules (ADR-0013 points 1 and 2, E08 decision 25):
    # moved from battle when E04c closed (the user, ADV-Q13: once the battle lane is done with it).
    "crates/h3-heroes/",
    "docs/rules/catalog/heroes.toml",
    # Adventure-owned sub-paths of the battle and AI lanes' crates and folders, by the longest
    # match (ADR-0017 point 8): the adventure replay model of game commands (the env and its
    # encoding are the AI lane's since E08 T45, E08 decisions 99 and 103), the CLI's adventure
    # commands and the test that re-runs the adventure's golden replays (`cargo xtask
    # determinism`), the replays, test maps.
    "crates/h3-sim/src/adventure/replay.rs",
    "crates/h3-cli/src/adventure/",
    "crates/h3-cli/tests/adventure_replays.rs",
    "fixtures/replays/adventure/",
    "fixtures/maps/",
    # One pack file per context (ADR-0006's E08 amendment); hand-written, never harvested.
    "packs/base/adventure.toml",
    "packs/ab/adventure.toml",
    "packs/sod/adventure.toml",
    "packs/synthetic/adventure.toml",
    "packs/synthetic-ext/adventure.toml",
    # The map format's notes (moved from battle with the user's consent, 2026-10-10).
    "docs/formats/h3m.md",
    "docs/rules/catalog/game.toml",
    "benches/adventure/",
    "docs/rules/catalog/adventure.toml",
    "docs/rules/catalog/town.toml",
    "docs/rules/quirks-adventure.md",
    "docs/rules/surveys/E07*",
    "docs/rules/surveys/E08*",
    "docs/rules/surveys/E09*",
    "docs/rules/surveys/E10*",
    "docs/rules/surveys/E12*",
    "docs/rules/surveys/E13*",
    "docs/rules/surveys/E14*",
    # Experiments in the original game follow the epic prefix (`experiments/specs/E07-batch-1.toml`).
    "experiments/specs/E07*",
    "experiments/specs/E08*",
    "experiments/specs/E09*",
    "experiments/specs/E10*",
    "experiments/specs/E12*",
    "experiments/specs/E13*",
    "experiments/specs/E14*",
    "experiments/results/E07*",
    "experiments/results/E08*",
    "experiments/results/E09*",
    "experiments/results/E10*",
    "experiments/results/E12*",
    "experiments/results/E13*",
    "experiments/results/E14*",
    "docs/epics/E07*",
    "docs/epics/E08*",
    "docs/epics/E09*",
    "docs/epics/E10*",
    "docs/epics/E12*",
    "docs/epics/E13*",
    "docs/epics/E14*",
    "docs/lanes/adventure/",
]

[[lane]]
name = "server"
code = "SRV"
paths = [
    "crates/h3-protocol/",
    "crates/h3-server/",
    "benches/server/",
    "docs/epics/E16*",
    "docs/lanes/server/",
]

# The battle client (E17: the battle viewer, then sieges and live play): the rest of the client
# workspace. The client foundation and the capture harness are common (above).
[[lane]]
name = "client"
code = "CLT"
paths = [
    "clients/",
    "docs/epics/E17*",
    "docs/lanes/client/",
]

# The adventure map client (E24; the user, 2026-10-23, splitting the client lane at E17 M3's
# closure): its crates in the client workspace (named `h3-map…`, such as `h3-map-view`), its data
# folder `clients/map/` (layouts, situations, tables of the adventure map), its epic and folder.
[[lane]]
name = "map-client"
code = "MCL"
paths = [
    "clients/crates/h3-map*",
    "clients/map/",
    "docs/epics/E24*",
    "docs/lanes/map-client/",
]

# The battle agent (E05, E06, E25; the user, 2026-10-18, AI-Q1): the sim layer and its encodings, the
# C ABI, the Python side, the AI benchmarks. A battle rule that changes the observation or the
# action encoding is a `cross-lane` change from the battle lane (`docs/08-work-process.md`).
# The adventure env (`crates/h3-sim/src/adventure/`: AdventureEnv, its action encoding and
# masks, the rollout, their tests) since E08 T45 (the user, E08 decisions 99 and 103; ADR-0017
# point 8), but its replay model (`replay.rs`, the adventure lane's above).
[[lane]]
name = "ai"
code = "AI"
paths = [
    "crates/h3-sim/",
    "crates/h3-ffi/",
    "crates/h3-cli/src/ai/",
    "python/",
    "benches/ai/",
    "docs/epics/E05*",
    "docs/epics/E06*",
    "docs/epics/E25*",
    "docs/lanes/ai/",
]

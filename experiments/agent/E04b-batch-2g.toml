# The runs of batch 2g's first map (the battle lane's inbox, 2026-10-24) for experiments/agent/ai.py:
# one per encounter of the spec, and a second for BR (BC: the control) (the second map's:
# E04b-batch-2h.toml). Hot seat with Red and Blue human: the agent commands both
# sides, `side` 0 Red, 1 Blue; `record` in army slot order. Keys as batch 4a's recipe; a plan step
# `roll` or `price` comes before the stack's command in the same turn (ai.py). Good and bad morale
# fail in every run unless it forces one draw.
spec = "experiments/specs/E04b-batch-2g.toml"

[[run]]
id = "BR"
rolls = { good_morale = "fails", bad_morale = "fails" }
rounds = 2
plan = [
    { round = 1, side = 0, record = 0, action = "move", argument = 93 },
    { round = 2, side = 0, record = 0, action = "attack", argument = [{ stack = [1, 1] }, "lower_left"] },
]

[[run]]
id = "BC"
encounter = "BR"
rolls = { good_morale = "fails", bad_morale = "fails" }
rounds = 2
# The control: the Pikemen walk to (14, 3); the dragon attacks them from their left, its head on
# (13, 3) (the original takes the clicked neighbour as a two-hex attacker's rear hex when its head
# then has room, else as its head), so the breath goes right onto (15, 3), the Ballista's front.
# (Two earlier tries from below put the dragon's tail on (14, 5), its head on (15, 5): the breath
# went up-left, off the Ballista.)
plan = [
    { round = 1, side = 0, record = 0, action = "move", argument = 93 },
    { round = 1, side = 1, record = 1, action = "move", argument = 65 },
    { round = 2, side = 0, record = 0, action = "attack", argument = [{ stack = [1, 1] }, "left"] },
]

[[run]]
id = "SP"
rolls = { good_morale = "fails", bad_morale = "fails" }
rounds = 3
plan = [
    { round = 1, side = 1, record = 0, action = "cast", argument = [0, { stack = [0, 0] }] },
    { round = 2, side = 0, record = 0, action = "price" },
    { round = 2, side = 0, record = 0, action = "cast", argument = [0, { stack = [0, 0] }] },
    { round = 2, side = 0, record = 0, action = "price" },
    { round = 2, side = 1, record = 0, action = "cast", argument = [0, { stack = [0, 0] }] },
    { round = 3, side = 0, record = 0, action = "price" },
]

[[run]]
id = "FS"
rolls = { good_morale = "fails", bad_morale = "fails" }
rounds = 2
plan = [
    { round = 1, side = 1, record = 0, action = "cast", argument = [0, { stack = [0, 0] }] },
    { round = 1, side = 0, record = 1, action = "move", argument = 94 },
    { round = 2, side = 0, record = 0, action = "attack", argument = [{ stack = [1, 0] }, "left"] },
    { round = 2, side = 0, record = 1, action = "attack", argument = [{ stack = [1, 0] }, "upper_left"] },
]

[[run]]
id = "RS"
rolls = { good_morale = "fails", bad_morale = "fails" }
rounds = 3
plan = [
    { round = 1, side = 1, record = 0, action = "cast", argument = [0, { stack = [0, 0] }] },
    { round = 2, side = 0, record = 1, action = "move", argument = { stack = [0, 0] } },
    { round = 2, side = 1, record = 0, action = "cast", argument = [0, { stack = [0, 1] }] },
    { round = 3, side = 0, record = 2, action = "cast", argument = [0, 36] },
]


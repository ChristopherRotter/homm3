# The runs of batch 4b (E23 T7) for experiments/agent/ai.py: one per encounter of the spec (and
# per seed where a row compares the computer's draws). Keys: `id` (the run's folder), `encounter`
# (default `id`), `difficulty` (default normal), `key` (the hero's step into the battle, default
# Right), `rolls` (forced: every draw `falls` or `fails`), `seed` (ms the clock idles before Red's
# first command), `step` (ms per clock step, default 10), `rounds` (then `end`, default retreat),
# `catapult` (the walls Red's aimed Catapult shoots at in turn: 1 upper, 2 mid-upper, 3 gate, 4
# mid-lower, 5 lower), `plan` (Red's commands: `{ round, side, record, action, argument }`, else
# Defend; a hex may be `{ stack = [side, record] }`, that stack's hex at the turn; a cast's
# argument is `[book place, hex]`).
spec = "experiments/specs/E23-batch-4b.toml"

[[run]]
id = "LC"
rolls = { bad_morale = "falls", good_morale = "fails" }
step = 50
rounds = 12

[[run]]
id = "H1"
step = 20
rounds = 1

[[run]]
id = "H3"
step = 20
rounds = 2

[[run]]
id = "H4"
step = 20
rounds = 4

[[run]]
id = "R1a"
difficulty = "hard"
step = 20
rounds = 2

[[run]]
id = "R1b"
difficulty = "hard"
step = 20
rounds = 2

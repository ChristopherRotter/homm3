# with docs/epics/E08-design.md §19's changes), in SoD on Easy, hot seat, day 1. The Prison and the
# Market of Time are `E08-batch-15a.toml`, the boats and the grounds `E08-batch-15c.toml`. Build:
# docs/experiments/README.md. Predictions are for the agent who evaluates the results; the template
# never shows them.
#
# | row    | settles                                   | the reading (faithful)                        | the other source(s)                    |
# | E15-5  | §4.2: Magic Plains raise every school     | 4 casts, 200 points and 20 spell points each; | VCMI the same (casts 1, 2, 3, 4)       |
# |        |                                           | the fifth refused (GENRLTXT 339), free        |                                        |
# | E15-6  | §8.1: the door's points                   | 1 left: cast, 0; 0: refused (126), free       | VCMI, the manual: > 0 needed           |
# | E15-7  | §8.1, A-52: a door from land onto water   | "failed" (71); 300 and 25 spent, the cast     | VCMI `waterLandFailureTakesPoints`     |
# |        |                                           | used (the next refused: 339)                  | (SoD) the same                         |
# | E15-8  | §8.2, A-53: the door's cursor in the fog  | the cursor on a hidden free tile, none on a   | VCMI `ignoreFow`, `exposeFow`; the     |
# |        |                                           | hidden tree; the tree's click nothing; the    | manual "visible"                       |
# |        |                                           | free one: the hero there, revealed around it  |                                        |
# | E15-13 | §13, A-13: Fly (level 0) over a hidden    | through the strip; 100 from each free tile,   | VCMI (and the engine): no path; the    |
# |        |                                           | 140 from the hidden tree: 420 left            | plan's 140 a hidden tile: 300 left     |
# | E15-14 | D-78: Water Walk facing hidden water      | no path (the fog first)                       | the wiki's Sea page: across, 400 left  |
# | E15-15 | D-79, O-1: a bookless hero's worn scroll  | not read: the record decides (ADV-STUB-21)    | HER-BAT-011 (the battle's): no cast    |
# | E15-16 | §8.2, A-54: the door's target at dy +9    | accepted (the view's last 8 pixel rows)       | VCMI `rangeY` 8: refused               |
#
# **Changes from survey §15** (agent's calls): **E15-13**'s prediction: the plan's "140 a step"
# is the fly price from a blocked tile; `step_cost` (survey `E08-hero-movement.md` §2.1 point 5)
# takes the lesser of the fly price and the walking price from every tile no object blocks, and
# the fog does not change that bit, so the reading prices the strip's free tiles at 100 and only a
# blocked one at 140: a hidden tree in the strip (12, 24) shows both, and the record tells the
# reading (420 left) from the plan's (300). **E15-14** is clicked once only (the path, the row's
# question): a walk across would reveal E15-13's strip; it runs first. **E15-16** is E15-8's
# hero's second cast from its arrival, recorded in E15-8's encounter (Red holds eight heroes
# already); its target (17, 19) is explored by then (E15-13's arrival on (15, 24): 4 + 25 ≤ 30), a
# free tile a target either way. E15-8 has **Advanced** Air Magic (three a day, knowledge 6): if the
# original spends a cast on the click at the hidden tree, E15-16 still has one (the review's). **E15-6**'s one point comes from a walk
# of 1 259 (a swamp diagonal 247, a sand diagonal 212, eight grass steps; the door takes 300 at
# least 0 and has no drop), then a second cast at 0 needs a third one allowed: Advanced Air Magic
# (three a day). **The spell points** cover every attempt the book is asked for (the book tests
# the cost first, GENRLTXT 207): E15-5's five attempts 5 × 20, E15-6's three 3 × 20, E15-7's two
# 2 × 25, E15-8's three 3 × 20.
#
# **The fog** (`[[map.hidden]]`, checked by the build: each Red hero reveals radius 5 at the start,
# dx² + dy² ≤ 30; Red's town 5 around its entrance): the rectangle (16, 6) to (19, 14) (E15-8's
# targets) and (10, 20) to (13, 31) (E15-13's and E15-14's strip:
# E15-13 at (4, 24) and E15-14 at (4, 27) reveal up to column 9, the scout E15-13s at (19, 25) from
# column 14). Every hidden target lies inside Dimension Door's window (dx −9 to +9, dy −8 to +9
# around the hero, survey §8.2), outside the radius.
#
# **The heroes.** Red has eight, Blue none (its town only). Every army is 10 Pikemen (speed 4,
# native to grass): 1 560 points a day; a step costs 100 on grass, 141 diagonally, from swamp 175
# (247), from sand 150 (212) (packs/base/adventure.toml). A caster wears a spell book with the
# spells listed (none for E15-15) and starts with 10 × knowledge spell points (no Intelligence).
# Dimension Door (packs/base/core.toml): cost 25 at None, 20 above; casts a day 1, 2, 3, 4; 300
# points, 200 at Expert. Fly costs 20 at None, Water Walk 12. No hero has a skill or an artifact
# but those listed.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact; the template asks for gold. An artifact the spec does not give goes under "anything
# odd".


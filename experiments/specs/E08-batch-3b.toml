# Experiment batch E3b (E08 T22a2a; decision 44): the monster's answer on Normal (D-9, D-10's
# control, D-8), the split's upgraded stack (D-11, with a control) and its survivors after a
# retreat (A-6).
# Batch E3's monster rows (survey docs/rules/surveys/E08-battles.md §13) in two maps: this one is
# played on Normal, E08-batch-3a.toml on Easy with E3-1, E3-1c, E3-2 and E3-2c at the same tiles.
# The user chose the code reading for D-8 to D-11 and A-6 always fixed (decision 23); the batch
# confirms or refutes the reading. Build: see docs/experiments/README.md. Predictions are for the
# agent who evaluates the results; the template never shows them.
#
# The monster's answer (survey §3, 0x4A7740; the engine's ADV-MON-007): C = St + Sy + L, as in
# batch 3a's header. St from r = power / strength: r >= 7 gives 11, r >= 1 floor(2r - 2), r > 0.5
# -1, r > 0.333 -2 (the reading; VCMI 1.7.5 and the wiki take r >= 0.5 for -1: D-8, only an exact
# 0.5 differs). On Normal L is the hero's Diplomacy (0 to 3) for every source. M > C fights;
# M <= Sy + L + 1 offers to join; M <= Sy + 2L + 1 to join for gold; M = C or a monster that never
# flees fights; else a flee offer. AI values: Pikeman 80, Halberdier 115, Griffin 351,
# Archangel 8776 (packs/base/core.toml, the executable's record +0x40).
#
# The split (survey §4.1, 0x4AC580; ADV-MON-009 under ADV-QUIRK-6, on in faithful): srand(248071 x
# + 276589 y + 310111 z + 155303), the Microsoft rand; n from the army's value over the monster's
# strength (below 0.5, 0.67, 1, 1.5, 2: 7, 6, 5, 4, 3, else 2); d1 = 1 + rand() mod 100: <= 20 one
# stack fewer, >= 80 one more (below 7); even stacks, the first count mod n one more; a town's
# unupgraded creature alone with n > 1: d2 = 1 + rand() mod 100 <= 50 turns stack n / 2 (slots
# from 0) into the upgrade, same count. VCMI 1.7.5 (CGCreature::hashByPosition is exactly d1;
# containsUpgradedStack replaces d2 by a float formula, ((floor(2992.911117 x + 14174.264968 y +
# 5325.181015 z + 32788.72792) mod 32768) mod 100) < 50). After a lost or fled battle the monster
# keeps the survivors of its own creature only (A-6: the upgraded stack's survivors vanish; the
# wiki agrees; VCMI turns them back and keeps them; the engine always keeps them, ADV-QUIRK-7).
#
# | tile             | d1 | d2 | reading: upgraded | VCMI: upgraded |
# | (12, 27) surface | 60 | 25 | yes               | yes            |
# | (12, 27) below   | 44 | 50 | yes               | no (D-11)      |
# | (29, 10) surface | 52 | 50 | yes               | yes (its value 49) |
#
# VCMI's value is the float formula evaluated in single precision step by step (it agrees with
# d2 on all but the boundary tiles, survey §4.1). E3-4 and E3-4c tell three readings apart: the
# code's d2 <= 50 (Halberdiers at both), VCMI's formula (none at E3-4, Halberdiers at E3-4c) and
# an off-by-one d2 < 50 in the reading (none at both).
#
# The engine: a throwaway run of the compiled map through h3-map's reader and import and h3-game
# (base:faithful, difficulty 1; never committed, E08-log.md T22a2a) gave every prediction marked
# "the reading" below: E3-1 and E3-1c a battle at once, E3-2 and E3-2c a flee offer; E3-3 at each
# aggression 1 to 7 (seeds searched) a join offer exactly at L >= M, 32 Halberdiers kept after the
# retreats; E3-4, E3-4c and E3-5 A 8 Pikemen, 8 Pikemen, 7 Halberdiers, 7 Pikemen, 30 kept
# after the retreat (A-6 fixed); E3-5 B 15 Pikemen, 15 Halberdiers.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact; E3-3 needs Attack and Defense 0 exactly (a visit by a hero showing more is void), the
# other rows stand +2. Each answer's visit records the hero's primary skills before it.

[map]
name = "E08 batch E3b"
description = "Engine-generated experiment map (E08, batch E3b): the monster's answer on Normal, the split's upgraded stack, a retreat's survivors. Hot seat, Red and Blue human, difficulty Normal; follow the results template."
size = 36
terrain = "grass"
difficulty = "normal"
instructions = [
    "Copy `E08-batch-3b.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Normal**. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and again at the start of Blue's turn (save 2).",
    "Move only the hero an encounter names, and only as it says. Before each visit of E3-1 to E3-3, read the hero's primary skills: if Attack or Defense is above 0 (a starting bonus's artifact), note it under `anything odd`.",
    "A click on a monster shows the hero's path, a second click attacks it. Answer every question as the encounter says. A battle: as the encounter says (auto combat, or retreat at once: the flag button, then Yes).",
    "E3-3 needs the monster's aggression, which only the game's memory shows: the capture harness reads it (clients/capture/batches/E08-batch-3b.toml); played by hand, leave those lines empty.",
    "Order: day 1, Red's turn: E3-1, E3-1c, E3-2, E3-2c, then E3-3r; end the turn. Day 1, Blue's turn: save 2, then E3-3b, E3-4 (on the underground: the level button under the minimap), E3-4c (back on the surface) and E3-5. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]

# E3-4's level: a second level, all subterranean.
[map.underground]
terrain = "subterranean"


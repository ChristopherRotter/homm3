procedure = [
    "Every stack defends; Red's Ballista shoots on its own.",
    "Play to round 2, noting the Ballista's targets, then end the battle as you like.",
]
predictions = """
Red's Ballista (attack 30: 62..93 damage, attack 40). Not desperate (100 Pikemen).
- The code: the Archer 24 (the estimate 2 of its 10 hit points; it shoots: 1 turn), the
  Behemoths 13 (2 of 480 times 3162 per 160, over three turns): **round 1 the Archer (slot 0)**,
  round 2 the Behemoths (the Archer is dead). With the hero-multiplied range (82): the Behemoths
  540 against 120.
- VCMI: the Archer first too (it can attack next turn, the Behemoths cannot).
"""
[encounter.hero]
type = "Damacon"
specialty = "resource gold"
primary = [30, 0, 1, 1]
skills = []
army = [["Pikeman", 100]]
artifacts = { "war machine 1" = "Ballista" }
[encounter.opponent.hero]
name = "TUb"
type = "Octavia"
specialty = "resource gold"
primary = [0, 0, 1, 1]
skills = []
army = [["Archer", 1], ["Behemoth", 3]]
[[encounter.record]]
field = "TU: the Ballista's shot in rounds 1 and 2: the stack it hit (Blue's slot) and the hit points it lost"
[[encounter.record]]
field = "anything odd"


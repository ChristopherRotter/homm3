# Experiment batch 3h (E04c T7e): the automatic Ballista's target. Checks the code reading of
# installation.md §7.33 that the battle follows since T7e (BAT-WAR-008, BAT-SIE-021's Artillery
# factors): the Ballista without Artillery takes the computer's shooter (0x41F060), not VCMI's rule
# (the engine's until T7e). Each stack scores the kills of the computer's estimate of the shot times
# the worth of one of its creatures (its Fight Value, scaled by its bonuses; an enemy Ballista's by
# its hero's Artillery: x1, x1.5, x3, x4 inside the root), divided by its turns until it can attack
# (1 for a shooter); a stack that keeps its turns first, then the best value, a tie the later
# stack; no preference for creatures over war machines; a weak human side (twice its strength below
# the other's) counts every creature 1000.
# Build: see docs/experiments/README.md. Predictions are for the agent who evaluates the results;
# the template never shows them. They are the code's and the engine's (faithful profile, run on the
# base pack with each encounter's armies, grass, both players human; every stack defends; the same
# targets with eight random obstacle layouts). The estimate of one Ballista starts from its record's
# 2..3, not the range its hero's attack makes of them in a strike (the first port's mistake, which
# predicted the Behemoths in TU and the Titans in DN: the run refuted it, which was played on the
# build with those predictions, stamp a8deac4e; the map itself is unchanged); "VCMI" names the
# engine's rule until T7e
# (`tryMakeAutomaticActionOfRangedUnit`: creatures before war machines, then a stack that can
# attack next turn, then expected damage times the AI value, the lower id on a tie).
#
# Each Red hero stands west of a Blue hero: stepping east attacks it. Play in hot seat (Red and
# Blue human). Red's heroes have a Ballista, no Artillery: it shoots on its own, last in the round
# (speed 0). Heroes at level 1 with resource specialties, no secondary skills unless listed; Red's
# attack sets the Ballista's damage (2..3 x (attack + 1)) and attack (10 + attack). Every stack
# defends (a commanded Ballista too). An agent's run (experiments/agent/ballista.py) reads the
# Ballista's target from memory as batch 3f's: a drop of a stack's hit points while Red's Ballista
# is the last activated stack.

[map]
name = "E04c batch 3h"
description = "Engine-generated experiment map (E04c, batch 3h): the automatic Ballista's target. Follow the results template."
size = 36
terrain = "grass"
instructions = [
    "Copy `E04c-batch-3h.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps` and start it in hot seat (Red and Blue human). Save right away.",
    "Each Red hero stands west of a Blue hero. Play the encounters in any order: select the Red hero and step east into the Blue hero; every stack defends (a Ballista commanded with Artillery too), Red's Ballista shoots on its own at the end of each round.",
    "Note Red's Ballista's shot in rounds 1 and 2: the stack it hit (Blue's slot, or Blue's Ballista) and the hit points it lost. Then end the battle as you like and load the save for the next encounter.",
    "Fill in this file (anything unexpected goes into the last line of an encounter) and keep it in the repo.",
]

# --- BAT-WAR-008: a tie goes to the later stack ---------------------------------------------------

[[encounter]]
id = "TI"
title = "Two like stacks of Archers: the later or the lower slot"
questions = ["BAT-WAR-008"]
procedure = [
    "Every stack defends; Red's Ballista shoots on its own.",
    "Play to round 2, noting the Ballista's targets, then end the battle as you like.",
]
predictions = """
Red's Ballista (attack 10: 22..33 damage, attack 20) against two stacks of ten Archers (both shoot:
divisor 1). Not desperate (20 Pikemen against 20 Archers).
- The code: both score 12 (the estimate 1 hit point times 115 with the native bonus per 10):
  **the later stack, slot 1**, in both rounds.
- VCMI: both 491: the lower slot, 0, in both rounds.
"""
[encounter.hero]
type = "Caitlin"
specialty = "resource gold"
primary = [10, 0, 1, 1]
skills = []
army = [["Pikeman", 20]]
artifacts = { "war machine 1" = "Ballista" }
[encounter.opponent.hero]
name = "TIb"
type = "Nagash"
specialty = "resource gold"
primary = [0, 0, 1, 1]
skills = []
army = [["Archer", 10], ["Archer", 10]]
[[encounter.record]]
field = "TI: the Ballista's shot in rounds 1 and 2: the stack it hit (Blue's slot) and the hit points it lost"
[[encounter.record]]
field = "anything odd"


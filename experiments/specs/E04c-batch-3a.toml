# --- Clover Field (D-2) ----------------------------------------------------------------------------

[[encounter]]
id = "CF"
title = "Clover Field: +2 luck for Stronghold, Fortress and Conflux creatures; creatures without a town"
questions = ["D-2", "BAT-TER-003"]
procedure = [
    "Attack the Peasant. At the battle's start, note each stack's morale, luck and speed (right-click).",
    "End the battle as you like.",
]
predictions = """
Field **5** (Clover Field), terrain grass. Five alignments: morale -3 for every Red stack.
- The code (0x43DFF4: towns 6-8) and the engine (BAT-TER-003): luck Goblins **+2**, Gnolls **+2**,
  Pixies **+2**, Red's Peasants **0**, Pikemen **0**; the Blue Peasant **0**.
- VCMI 1.7.5 (alignment neutral, D-2): the Peasants (Red's and Blue's) **+2** too.
Speeds: Goblins 5, Gnolls 4, Pixies 8 (native), Peasants 3, Pikemen 5 (native).
"""
[encounter.hero]
type = "Calid"
specialty = "resource sulfur"
primary = [1, 1, 1, 1]
army = [["Goblin", 10], ["Gnoll", 10], ["Pixie", 10], ["Peasant", 10], ["Pikeman", 10]]
[encounter.opponent]
monster = "Peasant"
count = 1
[[encounter.record]]
table = ["stack", "morale", "luck", "speed"]
labels = ["Goblins", "Gnolls", "Pixies", "Peasants (Red's)", "Pikemen", "Peasant (the monster)"]
[[encounter.record]]
field = "the battlefield (its picture)"
[[encounter.record]]
field = "anything odd"


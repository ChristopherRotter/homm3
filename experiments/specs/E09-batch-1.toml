- **The reading** (`town_buildings_setup` 0x5C08C0, survey §5.3): every town the Village Hall
  (10). **Owned without a Fort** (R1 to R4, B1 to B4): **{5, 10}**, the Tavern and no dwelling.
  **Owned with a Fort** (RF1 to RF8, BF1 to BF8): **{5, 7, 10, 30}**, and 31 at
  `random_between(1, 100)` at most 30: about 14 of the 48 (a 95 % range of about 8 to 20).
  **Neutral** (NF1 to NF4, N1 to N4, NEF, NE): **{10, 30, 31}** without a Fort, **{7, 10, 30, 31}**
  with one, no Tavern. The every-built sets equal the built ones (none of these supersedes
  another). The draws differ between the games; the sets without a draw do not.
- **VCMI** (`initTowns`, `startingDwellingChances` [100, 50]): every standard town 10 and 30, 31

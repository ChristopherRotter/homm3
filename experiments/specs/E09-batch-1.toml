# --- TWN-1-3: the garrison's merge into a lone visitor's army ----------------------------------

[[encounter]]
id = "TWN-1-3"
title = "The garrison's merge: Blue's town with a lone visitor of seven stacks and a garrison of three; Red besieges"
questions = ["TD-7", "TWN-SIE-001", "TWN-SIE-002", "TWN-CAP-003"]
procedure = [
    "Blue's Castle (a Fort only: no towers) has its entrance at (20, 61); Blue's hero Visitor visits it (it stands on the entrance) with seven stacks, and the town's garrison holds three. Red's hero TWN-1-3 (twenty Archangels) stands south of it at (20, 62). Before the step, read Red's hero's movement points, the town's garrison and Blue's hero's army (slot, creature, count).",
    "3a: step north onto the entrance (a siege). At the battle's opening read Blue's stacks (each one's army slot or hex, creature, count). Every Blue stack defends; Red retreats at its first stack's turn. After the battle read the town's garrison and Blue's hero's army.",
    "3b: load save 1 and step north again. At the opening read Blue's stacks again; then Red wins (auto combat, or the Archangels strike stack after stack while Blue's stacks defend; take any level-up's first offer). Right after the battle read: Red's hero's tile and movement points, the town's owner, whether a town screen opened, the town's garrison.",
]
record = [
    { table = ["slot", "before: garrison", "before: Blue's army", "3a opening: Blue's stacks", "3a after: garrison", "3a after: Blue's army", "3b opening: Blue's stacks"], labels = ["0", "1", "2", "3", "4", "5", "6"] },
    { field = "Red's hero before the step: tile, movement points" },
    { field = "3b after the battle: Red's hero's tile, movement points; the town's owner; a town screen (yes/no); the garrison" },
    { field = "anything odd" },
]
predictions = """
Values (the header): the visitor [Swordsman 4: 1 780, Centaur 4: 400, Archer 5: 630, Griffin 5:
1 755, Pikeman 5: 400, Monk 3: 1 455, Pikeman 10: 800], the garrison [Cavalier 1: 1 946,
Halberdier 16: 1 840, Marksman 10: 1 840].
- **The reading** (`garrison_merge` 0x44B820, survey §9.2), round by round: (1) the weakest is
  slot 4's Pikemen (400, the last of the two of 400); gains Cavalier 1 546, Halberdier and
  Marksman 1 440: the Cavalier swaps with slot 4, the 5 Pikemen go to garrison slot 0. (2) The
  weakest is slot 1's Centaurs (400); gains: the Pikemen 400 (the visitor has Pikemen), the
  Halberdiers and Marksmen 1 440 each: the Halberdiers (the first) swap with slot 1, the Centaurs
  go to garrison slot 1. (3) The weakest is slot 2's Archers (630): the Marksmen gain 1 210, the
  Pikemen 400: the Marksmen swap with slot 2, the Archers go to garrison slot 2. (4) The weakest is
  slot 6's Pikemen (800): the garrison's Pikemen gain 400 (their creature), the Centaurs and
  Archers nothing: **the 5 Pikemen join slot 6 (15)**. (5) The weakest is 1 200: no gain; the end.
  **Blue's stacks at the opening: 0 Swordsman 4, 1 Halberdier 16, 2 Marksman 10, 3 Griffin 5,
  4 Cavalier 1, 5 Monk 3, 6 Pikeman 15.** **3a after:** the garrison **1 Centaur 4, 2 Archer 5**
  (slots 0, 3 to 6 empty), Blue's army as at the opening (Red retreats before any blow). The merge
  is the same in 3b. **3b after** (§8.2, §8.3): Red's hero on **(20, 62)** with its points before
  the step **less 100** (the step paid, a visit from the neighbouring tile), the owner **Red**, **no
  town screen**, the garrison **empty** (the merge's leftovers lost with the town; the step onto
  the gate later is row 4's).
- **VCMI** (`mergeGarrisonOnSiege`, survey §9.5: three rounds, the stack of most power, its
  creature's slot else a swap with the weakest weaker one, the first of equal): (1) the Cavalier
  swaps with slot 1's Centaurs; (2) the Halberdiers (1 840 against the Pikemen's 400 + 800) with
  slot 4's Pikemen; (3) the Marksmen with slot 2's Archers: **0 Swordsman 4, 1 Cavalier 1,
  2 Marksman 10, 3 Griffin 5, 4 Halberdier 16, 5 Monk 3, 6 Pikeman 10**, the garrison **0 Centaur
  4, 1 Pikeman 5, 2 Archer 5**. With the last of the equal weakest (VCMI's `max_element` of the
  slots, if the survey's "first" is wrong): 1 Halberdier, 4 Cavalier, 6 Pikeman 10, the garrison
  0 Pikeman 5, 1 Centaur 4, 2 Archer 5. Either way **Pikeman 10** and the 5 Pikemen left in the
  garrison: the reading's fourth round is not VCMI's.
- **The reading with one tie the other way** (to tell the points apart): the first of the equal
  weakest: 1 Cavalier, 4 Halberdier, 2 Marksman, Pikeman 15, the garrison 0 Centaur 4, 2 Archer 5;
  the last of the equal garrison stacks: 1 Marksman, 2 Halberdier, 4 Cavalier, Pikeman 15, the
  garrison 1 Archer 5, 2 Centaur 4.
"""
[encounter.hero]
type = "Caitlin"
specialty = "resource gold"
at = [20, 62]
primary = [1, 1, 1, 1]
army = [["Archangel", 20]]
[encounter.opponent.town]
faction = "castle"
buildings = ["fort"]
garrison = [["Cavalier", 1], ["Halberdier", 16], ["Marksman", 10]]

# Experiment batch TWN-1 (E09 T3a; decisions 13, 15): rows TWN-1-1 to TWN-1-4 of increment 1's
# plan (survey docs/rules/surveys/E09-towns.md §13; docs/epics/E09-design.md §20), the town's
# setup and the siege's aftermath, in SoD on Easy, hot seat. Build: docs/experiments/README.md.
# Predictions are for the agent who evaluates the results (T3c, survey §15); the template never
# shows them. "The reading" is the survey's code reading of Heroes3.exe (the engine follows it,
# faithful); VCMI's is VCMI 1.7.5 as the survey summarises it.
#
# | row     | settles                  | the reading                         | otherwise                   |
# | TWN-1-1 | TD-3 (§5.3): a standard  | owned without a Fort: a Tavern, no  | VCMI: dwelling 1 always, 2  |
# |         | set's dwellings          | dwelling; with one: dwelling 1, 2   | at 50 in 100, every town;   |
# |         |                          | at 30 in 100; neutral: both, no     | HotA: 2 always with a Fort  |
# |         |                          | Tavern                              | (its own rule)              |
# | TWN-1-2 | TD-5 (§5.2): an          | stays empty; the controls drawn by  | VCMI draws one (its FIXME); |
# |         | explicitly empty custom  | the four rolls                      | the wiki: only an undefined |
# |         | garrison                 |                                     | garrison is drawn           |
# | TWN-1-3 | TD-7 (§9.2): the merge   | greatest gain first until nothing   | VCMI: most power first, one |
# |         | into a lone visitor's    | gains; ties the first garrison      | round per garrison stack, a |
# |         | army                     | stack, the last weakest slot        | swap only with a weaker one |
# | TWN-1-4 | §8.2, §8.3: after a      | the owner changes, the attacker     | VCMI: the garrison cleared, |
# |         | siege won                | stays with its points, no screen;   | captured (§9.5); the tile   |
# |         |                          | the garrison emptied; the screen at | not read there              |
# |         |                          | a later step                        |                             |
#
# **The towns of rows 1 and 2** (`[[map.town]]`, the editor's standard sets, `fort = true` its
# has-fort flag; E09 T3a's fields): five rows of towns, eight a row, the entrances 8 columns apart
# from column 7, the factions in turn (castle, rampart, …, conflux, castle, …). On map row 7: Red's
# eight with a Fort (RF1 to RF8); 15: Blue's eight with a Fort (BF1 to BF8); 23: Red's four without
# (R1 to R4), Blue's four without (B1 to B4); 31: four neutral with a Fort (NF1 to NF4), four
# without (N1 to N4), their garrisons the map's default (row 2's controls); 39: two neutral towns with an explicitly empty custom garrison (`garrison = []`), NEF with a Fort, NE
# without. No hero ever comes near them. Sixteen owned towns with a Fort a game: three new games
# give 48 draws of the level-2 dwelling (the reading's 30 in 100: about 14; VCMI's 50: about 24).
#
# **The building ids** (the game's, `docs/rules/surveys/E09-towns.md` §5.3; a town's built set
# +0x150 and every-built set +0x158 hold a bit per id): 5 Tavern, 7 Fort, 10 Village Hall, 30 the
# level-1 dwelling, 31 the level-2 dwelling. The standard sets build nothing that supersedes
# another, so the two sets are equal.
#
# **The merge's values** (row 3; survey §9.2: a stack's value is its creature's AI value, the
# record's +0x40 from `CRTRAITS.TXT`, times its count): Swordsman 445, Centaur 100, Archer 126,
# Griffin 351, Pikeman 80, Monk 485, Cavalier 1 946, Halberdier 115, Marksman 184. The visitor:
# 1 780, 400, 630, 1 755, 400, 1 455, 800 (two weakest of 400, slots 1 and 4; two Pikeman stacks,
# slots 4 and 6); the garrison: 1 946, 1 840, 1 840 (two equal, slots 1 and 2). Each of the
# reading's three points moves a stack: the last of the equal weakest takes the first swap, the
# first of the equal garrison stacks the second, and a fourth round brings the swapped-out
# Pikemen back into the visitor's other Pikeman stack (VCMI stops after three rounds).
#
# The trap of the starting bonus: a hot-seat player's random starting bonus (gold, an artifact or
# a resource) changes none of the records.

[map]
name = "E09 batch TWN-1"
description = "Engine-generated experiment map (E09, batch TWN-1): the standard sets' dwellings, an empty custom garrison, the garrison's merge into a lone visitor's army before a siege, a siege's aftermath. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E09-batch-1.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1).",
    "The records are the game's memory: a town's record (game +0x21614, 0x168 bytes each, `docs/exe/structs.toml`; its fields from docs/rules/surveys/E09-towns.md §5, §8, §9): its owner +0x1 (−1 neutral), its visiting hero +0x10, its garrison +0xE0 (seven creature ids, then seven counts), its built set +0x150 and every-built set +0x158 (a bit per building id); the battle's stacks at a siege's opening (E04c's reads); a hero's tile and movement points (E08's). The capture harness reads them (`clients/capture/batches/E09-batch-1.toml`, E09 T3b). Played by hand, only rows 3 and 4 can be read from the screens.",
    "Tiles are (column, row) from 0 at the top left; a town's entrance is the tile its gate stands on. A step: click the target once (the path's marks show), then again (the hero goes).",
    "Order: game 1, day 1, Red's turn, before any hero moves: TWN-1-1's and TWN-1-2's reads; save 1. TWN-1-3 twice from save 1 (3a, then load save 1 and 3b); TWN-1-4 after 3b, in the same turn. Then start the map anew (a new game, not a load) twice more, games 2 and 3: TWN-1-1's and TWN-1-2's reads at day 1, nothing else.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


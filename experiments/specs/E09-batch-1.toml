    { table = ["town", "game 1: built (ids)", "game 2: built", "game 3: built"], labels = ["RF1 castle (7, 7)", "RF2 rampart (15, 7)", "RF3 tower (23, 7)", "RF4 inferno (31, 7)", "RF5 necropolis (39, 7)", "RF6 dungeon (47, 7)", "RF7 stronghold (55, 7)", "RF8 fortress (63, 7)", "BF1 conflux (7, 15)", "BF2 castle (15, 15)", "BF3 rampart (23, 15)", "BF4 tower (31, 15)", "BF5 inferno (39, 15)", "BF6 necropolis (47, 15)", "BF7 dungeon (55, 15)", "BF8 stronghold (63, 15)", "R1 fortress (7, 23)", "R2 conflux (15, 23)", "R3 castle (23, 23)", "R4 rampart (31, 23)", "B1 tower (39, 23)", "B2 inferno (47, 23)", "B3 necropolis (55, 23)", "B4 dungeon (63, 23)", "NF1 stronghold (7, 31)", "NF2 fortress (15, 31)", "NF3 conflux (23, 31)", "NF4 castle (31, 31)", "N1 rampart (39, 31)", "N2 tower (47, 31)", "N3 inferno (55, 31)", "N4 necropolis (63, 31)", "NEF dungeon (7, 39)", "NE stronghold (15, 39)"] },
    { field = "every-built (+0x158) different from built anywhere (which town, which ids)" },
    { field = "anything odd" },
]

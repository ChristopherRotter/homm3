[[encounter]]
id = "E8-17"
title = "A flyer's way east across water: a Flotsam from land, a Flotsam from water, plain water, an empty boat from land, an empty boat from water"
questions = ["D-46", "ADV-MOV-009"]
procedure = [
    "Day 1, Red's turn: five Red heroes wearing Angel Wings stand at the west end of five pockets closed by rock: E8-17a at (11, 4), a Flotsam on the water tile (12, 4) east of it; E8-17b at (11, 9), water on (12, 9) to (14, 9) and a Flotsam on (13, 9); E8-17c at (11, 14), plain water on (12, 14) to (14, 14); E8-17d at (11, 19), an empty boat on the water tile (12, 19); E8-17e at (11, 24), water on (12, 24) to (14, 24) and an empty boat on (13, 24). Each pocket's only way east crosses its water.",
    "Read each hero's movement points, whether the far side (E8-17a and E8-17d: the tile just past the water, (13, 4) and (13, 19); E8-17b, E8-17c and E8-17e: (15, 9), (15, 14) and (15, 24)) is explored, each Flotsam's word, the boats' records and Red's treasury (wood and gold).",
    "E8-17a: click (13, 4) once (note the marks, or that none show), then again. Read E8-17a's tile and movement points, Red's wood and gold, the Flotsam's word; note any message.",
    "E8-17b: click (15, 9) the same way. The same reads.",
    "E8-17c: click (15, 14) the same way. The same reads (no Flotsam).",
    "E8-17d: click (13, 19) the same way. The same reads, and the boat's record (no Flotsam).",
    "E8-17e: click (15, 24) the same way. The same reads, and the boat's record (no Flotsam).",
]
record = [
    { table = ["hero", "the far side explored", "the Flotsam's word before", "the marks (or none)", "tile after", "movement points before / after", "wood, gold before / after", "the Flotsam after (word, or gone)"], labels = [
        "E8-17a (a Flotsam, from land)",
        "E8-17b (a Flotsam, from water)",
        "E8-17c (plain water)",
        "E8-17d (an empty boat, from land)",
        "E8-17e (an empty boat, from water)",
    ] },
    { field = "anything odd" },
]
predictions = """
- **The code** (survey §15, the re-read; `pathfinder_expand` 0x4B26D6, `pathfinder_relax`,
  `pathfinder_run` 0x56BB7C to 0x56BB99, `pathfinder_build_path` 0x56A0D0): a flying node that
  steps onto a water tile holding an entrance of any class but a hero (34), a boat (8) or class
  85 is "flying only", loses bit 10 and is relaxed with the entrance as its stop flag; it lies in
  the tile's second slot (no path ends there) and is never expanded (no flight goes on from it), and its
  flying copy without the stop flag needs the bit 10 it lost. **E8-17a and E8-17b: no path**
  (no marks), the hero stays on (11, 4) and (11, 9), **1 560** kept, the Flotsam's word and the
  treasury unchanged. **E8-17c: a path over** the three water tiles, four marks, the hero on
  (15, 14), **1 160** left. **E8-17d: a path over** the boat (a boat's node keeps bit 10, so its
  flying copy is made and goes on), two marks, the hero on (13, 19), **1 360** left, the boat's
  record unchanged (nobody aboard) and the hero not in it (bit 18 clear). **E8-17e: no path**: from
  the first water tile's node (no bit 10) the boat's class 8, not entered (0x63AA58), gets no node
  at all (0x4B2CF3 to 0x4B2D10, which jumps past the flying copy); the hero stays on (11, 24),
  1 560 kept, the boat unchanged.
- **Survey `E08-hero-movement.md` §3.1 point 6** (T34a's reading of the same branch: "a flying
  node still passes over it") and **design §7's table** ("a flight over water passes it"):
  E8-17e a path over, four marks, (15, 24), 1 160, not aboard. If E8-17e passes while E8-17b does
  not, only the flying-only branch (0x4B27FB) closes a tile, and the re-read's 0x4B2CF3 is wrong.
- **ADV-MOV-009** (the engine, increment 5, `verified` on land objects and plain water) and
  **VCMI 1.7.5** (`PathfinderUtil.h` `evaluateAccessibility`: every tile of the air layer
  flyable): **all five a path over** (E8-17e as above): E8-17a two marks, (13, 4), 1 360; E8-17b four marks,
  (15, 9), 1 160; the Flotsams not taken (a flight visits nothing on its way, ADV-MOV-009) and
  the treasury unchanged. The wiki is silent.
- A confirmed reading keeps the drafts and design §7, §15 as they are and T73 amends
  ADV-MOV-009; a reverted one sends them back to the pass, and the reading is read again.
"""

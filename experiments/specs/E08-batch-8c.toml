# Experiment batch E8c (E08 T69b; decisions 179, 180): row E8-17, a flight over a water tile
# holding an object (D-46; survey docs/rules/surveys/E08-sea.md §15), on a map of its own, in SoD
# on Easy, hot seat. Build: docs/experiments/README.md. Predictions are for the agent who evaluates
# the results; the template never shows them.
#
# | row      | settles                                 | the reading (faithful)                     | the other source(s)                     |
# | E8-17a   | D-46: one water tile with a Flotsam,    | no path to the far side; the hero stays    | ADV-MOV-009 (`verified`, increment 5)   |
# |          | entered from land                       |                                            | and VCMI 1.7.5: a path over, 200        |
# | E8-17b   | D-46: three water tiles, the Flotsam in | no path to the far side; the hero stays    | ADV-MOV-009 and VCMI: a path over, 400  |
# |          | the middle, entered from water          |                                            |                                         |
# | E8-17c   | control: three plain water tiles        | a path over, 400                           | the same                                |
# | E8-17d   | control: one water tile with an empty   | a path over (the flying copy), 200         | the same                                |
# |          | boat                                    |                                            |                                         |
# | E8-17e   | three water tiles, an empty boat in the | no path (from water, a class not entered   | survey `E08-hero-movement.md` §3.1      |
# |          | middle, entered from water              | gets no node: 0x4B2CF3)                    | point 6, the design's table and VCMI:   |
# |          |                                         |                                            | a path over, 400                        |
#
# **The pockets.** Each Red hero stands at column 11 of a pocket closed by rock (terrain 9, closed
# to every hero, a flyer too: survey `E08-hero-movement.md` §3.1), one row of open tiles from
# column 11 to 16 with the rock at columns 10 and 17 and on the rows above and below: the only way
# to the far side crosses the pocket's water. The far side lies within the scouting radius (5 without Scouting;
# ADV-FOG-002), so it is explored before the click (ADV-MOV-008: no path is drawn onto an
# unexplored tile). Each pair of a row and its control differs only in the object on the water:
# E8-17a and E8-17d one water tile (column 12), E8-17b, E8-17c and E8-17e three (columns 12 to 14).
# E8-17e (added at T69b's start) separates the re-read's two closures: E8-17a's Flotsam is closed
# from land by the flying-only branch (0x4B27FB), E8-17b's from water by that branch and by
# 0x4B2CF3 (from a node without bit 10 a class not entered, 0x63AA58, gets no node); a boat is
# exempt from the first (class 8) but on the list of the second, so E8-17e tests 0x4B2CF3 alone.
#
# **The points.** Ten Pikemen (speed 4): 1 560 on land (packs/base/adventure.toml `land_points`).
# A step is priced by the tile left (batch E1a): grass and water 100 each; a path over costs 100 a
# tile crossed: 200 for one water tile (from column 11 to 13), 400 for three (11 to 15).
#
# **Angel Wings** (shoulders) make each Red hero a flyer; the four wear nothing else. Blue's hero
# (E8-17x) stands on land far away and never moves: it makes the map a two-player one for hot
# seat, as the other batches. The trap of the starting bonus: a hot-seat player's random starting
# bonus may give a hero an artifact; the template asks for gold, and an artifact the spec does not
# give goes under "anything odd".

[map]
name = "E08 batch E8c"
description = "Engine-generated experiment map (E08, batch E8c): a flight over a water tile holding an object. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-8c.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1).",
    "Most records are the game's memory: a hero's tile and movement points (+0x4D), an object's word on its tile, a tile explored, the players' treasuries, the path marks (batch E1a's). The capture harness reads them (`clients/capture/batches/E08-batch-8c.toml`, E08 T69b). Played by hand, read the screens instead and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left. A walk: click the target once (the path's marks show; note them, or that none show), then again (the hero goes, if a path showed).",
    "Order: day 1, Red's turn: E8-17a, E8-17b, E8-17c, E8-17d. Then the map is done (Blue does nothing).",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


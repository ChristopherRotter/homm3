id = "C0"
title = "Control: grass only, the land table"
questions = ["ADV-MOV-001"]
procedure = [
    "Day 1, Red's turn: count Red's C0 hero's path east on grass (the whole path has 16 marks).",
]
record = [
    { field = "green marks" },
    { field = "red marks" },
    { field = "did the hero stop on the last green mark" },
    { field = "anything odd" },
]

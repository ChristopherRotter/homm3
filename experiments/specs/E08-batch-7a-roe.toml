predictions = """
- **The code** (0x5034BD, the second reading, survey §13; A-21): an RoE map's hut (no mask in the
  file) takes the fixed mask **0xEFBF**: 14 skills, 0 to 15 but Leadership (6) and Necromancy (12):
  Pathfinding, Archery, Logistics, Scouting, Diplomacy, Navigation, Wisdom, Mysticism, Luck,
  Ballistics, Eagle Eye, Estates, Fire Magic, Air Magic. **None of the 60 teaches Water Magic,
  Earth Magic, Scholar, Tactics, Artillery, Learning, Offense, Armorer, Intelligence, Sorcery,
  Resistance or First Aid**, nor Leadership or Necromancy; each of the 14 about 4 times.
- **VCMI** (the default mask, every skill but Leadership and Necromancy, 26): one of the twelve last
  skills in 60 draws almost surely (none with probability (14/26)^60 ≈ 10⁻¹⁶).
- **The wiki**: "cannot be Leadership, Necromancy" (the editor's default); RoE not addressed.
- Decision 130 (A-21's flag): `faithful` the 14, `strict-fixed` VCMI's 26; this row confirms or
  reverts the `faithful` side.
"""
[encounter.hero]
type = "Sylvia"
specialty = "skill Navigation"
at = [3, 30]
defaults = true

[[encounter.also]]
type = "Voy"

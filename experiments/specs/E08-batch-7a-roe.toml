# Experiment batch E7a, its RoE map (E08 T56; decisions 130, 132, 142): row E7-7 of increment
# 7's plan (survey docs/rules/surveys/E08-rewards.md §11, §13; docs/epics/E08-design.md §18), an RoE
# map's Witch Huts, in SoD on Easy, hot seat. The map is written in the RoE format (version 0x0E):
# its huts store no skills, so the game draws from its RoE mask. The other rows of run E7a are on
# E08-batch-7a.toml's map. Build: docs/experiments/README.md. Predictions are for the agent who
# evaluates the results; the template never shows them.
#
# | row   | settles            | the reading (faithful)                              | the other source(s)                   |
# | E7-7  | D-33, A-21         | 14 skills (0xEFBF): never Leadership or Necromancy, | VCMI: every skill but Leadership and  |
# |       |                    | never Water Magic to First Aid                      | Necromancy (26)                       |
#
# Both heroes take their hero types' own army, skills and artifacts (`defaults`: an RoE map stores
# no hero spells or primary skills); they play nothing.

[map]
name = "E08 batch E7a RoE"
description = "Engine-generated experiment map (E08, batch E7a, row E7-7), in the RoE format: sixty Witch Huts whose skills the game draws at the new game. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
format = "roe"
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-7a-roe.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy** (the scenario list shows it as a Restoration of Erathia map). Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1).",
    "The record is the game's memory: each Witch Hut's word on its tile (bits 13 to 19: the skill). The capture harness reads it (`clients/capture/batches/E08-batch-7a-roe.toml`, E08 T57). Played by hand, visit the huts with a hero instead (each tells its skill) and note them.",
    "Nothing is played: the row reads the new game's draws. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]

# Sixty Witch Huts, ten to a row 3 columns apart, the rows 3 apart (each covers its bottom-right
# tile and is visited from the tile west of it).
[[map.hut]]
at = [5, 5]
grid = { columns = 10, rows = 6, step = [3, 3] }

[[encounter]]
id = "E7-7"
title = "Sixty Witch Huts on an RoE map: their skills"
questions = ["D-33", "A-21", "ADV-TCH-005"]
procedure = [
    "At the start (save 1): sixty Witch Huts stand with their bottom-right corners at (5, 5) to (32, 20), ten to a row. Read each one's word on its tile (bits 13 to 19: the skill, `SSTRAITS.TXT` order: 0 Pathfinding … 27 First Aid).",
    "The heroes E7-7 (Red) and Blue's stand at (3, 30) and (30, 30) only to make the map playable; they play nothing.",
]
record = [
    { table = ["Witch Hut", "the word (hex)", "the skill"], labels = [

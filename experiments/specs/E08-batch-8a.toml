# Experiment batch E8a (E08 T67; decisions 158, 162, 163, 165, 171): rows E8-1 to E8-4, E8-7,
# E8-10, E8-15 and E8-16 of increment 8's plan (survey docs/rules/surveys/E08-sea.md §11;
# docs/epics/E08-design.md §17), movement and the shore, in SoD on Easy, hot seat, on one map; row
# E8-5 (a hero written on water) is the map `E08-batch-8a-water` of its own, so that a game that
# refuses such a hero costs this map nothing. Build: docs/experiments/README.md. Predictions are
# for the agent who evaluates the results; the template never shows them.
#
# | row   | settles                                   | the reading (faithful)                       | the other source(s)                     |
# | E8-1  | D-41: the Hat's conversion at boarding    | 75 left after the step: dropped to 0, then   | VCMI: 75 × 3000 ÷ 2000 = 112            |
# |       |                                           | 0 × 3000 ÷ 2000 = 0; the control 637          | the control: 637                        |
# | E8-2  | D-41: the Hat's conversion at landing     | 59 left: dropped to 0, then 0; control 333    | VCMI: 59 × 2000 ÷ 3000 = 39; 333        |
# | E8-3  | D-42: where a boat lands                  | no path to the event's or the hole's tile;    | VCMI: lands on the event and fires it   |
# |       |                                           | the free tile lands                           | (the wiki: "not on a hole")             |
# | E8-4  | D-43: the diagonal exception on the winds | 80 on a winds tile: the diagonal (93)         | VCMI: the diagonal taken, 0 left        |
# |       |                                           | refused; the straight one (66) taken, then 0  |                                         |
# | E8-7  | D-45: a sea pickup from the shore         | the clicking flyer takes its Flotsam; the     | the wiki: only boats; VCMI: the walker  |
# |       |                                           | key's flyer, the water walker, the walker not | and the water walker not                |
# | E8-10 | §4.2: the day's sea points                | 4 000 and 2 000; after the landing 0 and the  | consensus on 4 000 and 2 000 (A-28 the  |
# |       |                                           | maximum kept (A-28); 1 560 the next day       | reading's alone)                        |
# | E8-15 | §3.2, §3.3: a guarded landing             | the battle on the shore after the landing;    | consensus                               |
# |       |                                           | the boat on the water tile, facing south      |                                         |
# | E8-16 | §2: any hero boards any boat              | the boat Red left: owner and captain Blue's   | consensus                               |
#
# **The points.** A day's land points from the slowest speed (packs/base/adventure.toml
# `land_points`): one Angel (speed 12) 2 000, ten Pikemen (speed 4) 1 560. Sea points (survey
# §4.2): 1 500, Navigation +50, 100, 150 %, the Necklace of Ocean Guidance +1 000, the Sea
# Captain's Hat +500, the Admiral's Hat +1 500 (through its two parts). A step is priced by the
# tile left (batch E1a): grass 100, swamp 175 for Castle creatures (native grass), water 100, 141
# diagonally, from a Favorable Winds tile 66 and 93; the step onto a boat by the land tile left. The
# drop (D-3, ADV-MOV-006): after a step the points become 0 when fewer remain than the cheapest
# straight step from the new tile, 100 on land without a road and on water, 66 on a winds tile.
#
# **The corridors** (E8-1): rock rows 3, 5 and 7 beside the swamp rows 4 and 6, so that a boat at
# (20, 4) or (20, 6) is reached only along its swamp row (a detour over the grass would be
# cheaper). Every path a row predicts is the cheapest one, so the legs the procedures name (at
# most five tiles: the original draws no path onto an unexplored tile, ADV-MOV-008, the scouting
# radius is 5) give the same points as one long walk.
#
# **The boats** (`AVXboat0` to `AVXboat2`): as a hero, a boat stands one column west of its
# `at`; it blocks its tile and is boarded by a click on it from a land tile beside it.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact. The template asks for gold; an artifact the spec does not give goes under "anything
# odd".

[map]
name = "E08 batch E8a"
description = "Engine-generated experiment map (E08, batch E8a): boats and the sea, movement and the shore: the Admiral's Hat at boarding and landing, where a boat lands, the diagonal on Favorable Winds, a sea pickup from the shore, the day's sea points, a guarded landing, any hero boards any boat. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-8a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and at the start of each later turn (save 2 Blue's day 1, save 3 Red's day 2, save 4 Blue's day 2, save 5 Red's day 3).",
    "Most records are the game's memory: a hero's tile, movement points (+0x4D) and day's maximum (+0x49), its status flags (+0x105; bit 18, 0x40000, is the hero in a boat), the boats' records (game +0x4E3BC, 0x28 bytes each: tile, in use +0x18, type +0x1A, facing +0x1B, owner +0x1C, captain +0x20, aboard +0x24; `docs/exe/structs.toml` \"boat\"), an object's word on its tile, the players' treasuries, a battle's terrain, special field, ship flag (`battle_manager` +0x53C6) and blocked hexes at its opening, the path marks (batch E1a's). The capture harness reads them (`clients/capture/batches/E08-batch-8a.toml`, E08 T68). Played by hand, read the screens instead and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left. A walk: click the target once (the path's marks show; note them where asked), then again (the hero goes). A walk the procedure splits into legs goes leg by leg, each leg's target clicked twice: the original draws no path onto a tile not yet explored.",
    "A boat stands on water beside the hero's tile; a click on it from the land beside it boards it (the walk ends there). A click on a land tile beside a hero's boat lands it (the walk ends there).",
    "Each battle by auto combat; a tactics phase is ended at once (its Start button).",
    "Order: day 1, Red's turn: E8-1 (both heroes board), E8-3, E8-4, E8-10 (both board), E8-15 (boards); end the turn. Blue's turn: E8-7; end the turn. Day 2, Red's turn: E8-1's day 2 (both land), E8-3, E8-4, E8-10, E8-15; end the turn. Blue's turn: E8-16; end the turn. Day 3, Red's turn: E8-10's last reads. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


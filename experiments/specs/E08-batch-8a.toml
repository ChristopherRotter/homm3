# --- E8-1, E8-2: the Admiral's Hat at boarding and landing (Red) ---------------------------------

[[encounter]]
id = "E8-1"
title = "The Admiral's Hat at boarding (row E8-1) and landing (row E8-2): about 50 points left after the step, and a control"
questions = ["D-41", "ADV-SEA-002", "ADV-SEA-003", "HER-ADV-009"]
procedure = [
    "Day 1, Red's turn: E8-1 stands at (9, 4) on a swamp corridor with the Admiral's Hat and one Angel (2 000 points on land); its boat stands at (20, 4), the corridor's east end. E8-1c, the control, stands at (11, 6) the same way, its boat at (20, 6).",
    "Read E8-1's tile, movement points, day's maximum and status flags. Walk it east in three legs: (13, 4), (17, 4), then the boat (20, 4). Read the points after each leg; after boarding read the tile, movement points, day's maximum, status flags and the boat's record.",
    "The same for E8-1c: legs (15, 6), (19, 6), then the boat (20, 6).",
    "Day 2, Red's turn: read both heroes' movement points and day's maximum at the turn's start.",
    "E8-1 (row E8-2): one step south-east to (21, 5); then east along row 5 in legs: (26, 5), (31, 5), (36, 5), (41, 5), (46, 5), then the coast tile (49, 5), which lands it. Read the points after each leg; after the landing read the tile, movement points, day's maximum, status flags and its boat's record.",
    "E8-1c: east along row 6 in legs: (25, 6), (30, 6), (35, 6), (40, 6), then the coast tile (45, 6), which lands it. The same reads. Leave its boat where it is: E8-16 boards it.",
]
record = [
    { table = ["hero, moment", "tile", "movement points", "day's maximum", "status flags (hex)"], labels = [
        "E8-1, day 1 start",
        "E8-1, after (13, 4)",
        "E8-1, after (17, 4)",
        "E8-1, after boarding",
        "E8-1c, day 1 start",
        "E8-1c, after (15, 6)",
        "E8-1c, after (19, 6)",
        "E8-1c, after boarding",
        "E8-1, day 2 start",
        "E8-1, after (21, 5)",
        "E8-1, after (46, 5)",
        "E8-1, after the landing",
        "E8-1c, day 2 start",
        "E8-1c, after (40, 6)",
        "E8-1c, after the landing",
    ] },
    { field = "the boats' records after boarding (E8-1's, E8-1c's: tile, in use, type, facing, owner, captain, aboard)" },
    { field = "the boats' records after the landings" },
    { field = "anything odd" },
]
predictions = """
- **Day 1, boarding** (survey §3.1; D-41). The step onto the boat is priced by the swamp tile left
  (175): E8-1 spends 11 × 175 = 1 925 of 2 000 and has **75** after the step; E8-1c 9 × 175 =
  1 575, **425**.
  - **The code** (`hero_move_step` 0x481182, then `hero_boards_boat` 0x4A1010): the step's drop
    first: 75 is fewer than 100 (the cheapest step from the boat's water tile), so **0**; then
    the Hat's proportion 0 × 3 000 ÷ 2 000 = **0**. E8-1c: no drop, 425 × 3 000 ÷ 2 000 =
    **637** (truncated). Both: the day's maximum **3 000** (1 500 + the Hat's 1 500), the status
    bit 18 set, the boat's owner Red (0), the captain the hero, aboard 1.
  - **VCMI** (`movementPointsAfterEmbark`, no drop): E8-1 75 × 3 000 ÷ 2 000 = **112**; E8-1c
    **637**. The wiki: "converts" (silent on the amounts).
- **Day 2's start** (survey §4.2): both in their boats: **3 000** (both sources).
- **Day 2, landing** (survey §3.2; D-41). E8-1: the diagonal 141 (both side tiles water), then 27
  steps on water and the landing step, 100 each: 2 941, **59** after the landing step; E8-1c: 24
  on water and the landing: 2 500, **500**.
  - **The code** (the drop: 59 fewer than 100, the cheapest step from a coast tile without a
    road; then `hero_lands_from_boat` 0x49E670): E8-1 **0** (0 × 2 000 ÷ 3 000); E8-1c 500 ×
    2 000 ÷ 3 000 = **333**. Both: the day's maximum **2 000**, bit 18 clear; the boat left on the
    water tile behind (E8-1's (48, 5), E8-1c's (44, 6)), facing east, aboard 0, owner and captain
    kept.
  - **VCMI**: E8-1 59 × 2 000 ÷ 3 000 = **39**; E8-1c **333**.
- A difference in the legs' points (not 1 925 and 1 575 on day 1, not 2 859 after the diagonal on
  day 2) means a price this map assumes is wrong: the row then reads the conversion from the
  points the record shows.
"""
[encounter.hero]
type = "Orrin"
specialty = "skill Archery"
at = [9, 4]
primary = [1, 1, 1, 1]
army = [["Angel", 1]]

# Experiment batch TWN-6, part a (E09 T54; design note §117, survey
# docs/rules/surveys/E09-trades.md §11 rows TWN-6-1, TWN-6-3, TWN-6-4 and TWN-6-5): the
# Marketplaces' count at a town (D-70), the artifact sale after the backpack's arrows (T-20), a
# combination artifact's sale price (§3.4), the town's trades with a garrison hero and no visitor
# (TD-28); in SoD on Easy, hot seat, day 1 only. Part b (`E09-batch-6b.toml`) holds TWN-6-2 (an
# ally's merchants), part c (`-6c.toml`) TWN-6-8 (the stock over a month), part d (`-6d.toml`)
# TWN-6-6 and TWN-6-7 (the Shipyard's boat, the Magic University). Build:
# docs/experiments/README.md. Predictions are for the agent who evaluates the results; the
# template never shows them. "The reading" is the survey's code reading of Heroes3.exe; VCMI's is
# VCMI 1.7.5 as the survey summarises it (§9).
#
# | row     | settles             | the reading                          | otherwise                   |
# | TWN-6-1 | D-70 (§2.1)         | 1 wood or ore for 37, 62, 112 gold   | VCMI: 38, 63, 113 (its      |
# |         |                     | at 2, 4, 8 Marketplaces              | rounding)                   |
# | TWN-6-3 | T-20 (§2.4)         | after the arrow the first place's    | the shown artifact's price  |
# |         |                     | price is backpack place 0's, the     | and removal                 |
# |         |                     | artifact removed the one shown       |                             |
# | TWN-6-4 | §3.4                | Ring of the Magi sells for 600 at 1  | a blank cost: 1 gold        |
# |         |                     | Marketplace (3 000 x 0.2)            |                             |
# | TWN-6-5 | TD-28 (§2.1, §4.2)  | GENRLTXT 274 at the merchants, the   | VCMI: the garrison hero     |
# |         |                     | guild, the Blacksmith, the Ballista  | served                      |
# |         |                     | Yard; the Marketplace: screens 0, 1  |                             |
#
# **The map** (36 x 36, grass): Red owns eight towns, two with the Marketplace at the start: T1
# (7, 7) a Tower with the Marketplace and the Artifact Merchants, S1 (15, 7) a Stronghold with the
# Marketplace, the Blacksmith, the Freelancer's Guild and the Ballista Yard (the Blacksmith of a
# Stronghold sells the Ammo Cart, its Ballista Yard the Ballista), and six Castles with nothing but
# the Village Hall: C1 (23, 7), C2 (31, 7), C3 (7, 15), C4 (15, 15), C5 (23, 15), C6 (31, 15). Red's
# count is 2 at the start, 4 once C1 and C2 build their Marketplaces, 8 once C3 to C6 do (one build
# a town a day; Red's resources written before the builds). Blue owns B (23, 30), a Tower with the
# Marketplace and the Artifact Merchants: Blue's count is 1 (TWN-6-4 on Blue's turn). Every
# garrison empty. No hero stands on an entrance at the start; no main town (no hero generated).

[map]
name = "E09 batch TWN-6a"
description = "Engine-generated experiment map (E09, batch TWN-6, part a): the Marketplaces' count at a town, the artifact sale after the backpack's arrows, Ring of the Magi sold, a garrison hero at the merchants, the guild, the Blacksmith and the Ballista Yard. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E09-batch-6a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, Red and Blue both human, difficulty **Easy**, both players' starting bonus Gold. Before you start it, compare the stamp at the start of the map's description with the stamp above.",
    "The records are the game's screens and memory (the capture harness, `clients/capture/batches/E09-batch-6a.toml`, E09 T54): the trade window's state (its screen, the count of Marketplaces 0x6AAA98, the pair, the rate, the buttons shown), a town's record (game +0x21614, 0x168 bytes each, `docs/exe/structs.toml` \"town\"), a hero's backpack, the players' treasuries, the message a click brings (as the record it was written from: `GENRLTXT:274`, never its text). Played by hand they show on the screens.",
    "Tiles are (column, row) from 0 at the top left; a town's entrance is the tile its gate stands on. A step: click the target once (the path's marks show), then again (the hero goes).",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


# Experiment batch E11b (E08 T99b2b; decisions 261, 269, 274 to 277): the repetitions with the space
# key of increment 11's plan (survey docs/rules/surveys/E08-teleporters.md §12; docs/epics/E08-design.md
# §16) at two-way monoliths, an owned dwelling and Whirlpools, in SoD on Easy, hot seat, day 1 and the
# next turns. Batch E11a (`E08-batch-11a`) is the jumps. Build: docs/experiments/README.md.
# Predictions are for the agent who evaluates the results; the template never shows them.
#
# | row    | settles                                    | the reading (faithful)                       | the other source(s)                     |
# | E11-14 | §11: the space key without points          | the hire question again (no points spent);   | the wiki: AB and SoD, without points;   |
# |        |                                            | at 0 points B → A → B, no draw               | VCMI not read                           |
# | E11-15 | §4.1, D-53: a two-way channel of four      | each jump one of the three others, uniform;  | VCMI: the client names the exit (D-53)  |
# |        |                                            | never the one stood on                       |                                         |
# | E11-17 | §4.1, D-57: a Whirlpool's exit tile        | W2's five list tiles drawn as W3's (about    | VCMI never W2 (its visitable tile holds |
# |        |                                            | 20 of 61); never a boat's tile               | a hero of the team)                     |
# | E11-16 | A-37: a Whirlpool lands on an enemy hero   | both on one tile, no battle, no message;     | VCMI the mover stays (survey §8)        |
# |        |                                            | the next turns unread (recorded)             |                                         |
#
# **The agent's call for E11-16** (the queue's, told at the start): the sides swapped. Red moves first,
# and its turn holds E11-17's 60 presses, so the enemy on a Whirlpool's tile is E11-17's hero where its
# presses left it, and Blue's E11-16 presses on Blue's day 1 until it lands there (at most 60 presses).
# Red's day 2 and Blue's day 2 are "the next turn": a step off by each hero (a new day comes between
# the landing and E11-17's turn, which changes nothing on the tile). **Design §16's addition:**
# an empty boat on one of W3's tiles, never drawn.
#
# **Read at T99b2b** (`setup_map_objects` 0x4C0CC0): the setup's walk dispatches on the tile's class
# (map_item +0x1E, 0x4C0D96), and class 8, the boat, has no case: a tile whose class is the boat's
# is **not appended to the Whirlpools' list**, so it is never drawn, by any player, also after a hero
# boards the boat there. The boat is the tile's class whatever the order (the review's reading of the
# address map): `create_boat` 0x4BB250 shows it as class 8 (`hero_show` 0x4D75D0, which keeps the
# class and word under it), and a tile's refresh takes a boat off and puts it back on top
# (`tile_refresh_around_heroes` 0x505A10); the boats are written after the Whirlpools all the same
# (T99a's call). A boat's tile holds its boat's index as its word (`hero_show`'s id).
# The six tiles' shared word is copied from the tile of cell (2, 1) (0x4C1FAD: column + x − 2, row +
# y − 1), the Whirlpool's **top-left** tile: neither boat lies on one. The list then holds 16 tiles in
# the walk's order (row by row): W1's six, W3's five, W2's five; the words W1 0, W3 1, W2 2.
#
# **The rows.** E11-14: one hero (Dendroid Guards: 1 500 points a day) steps onto Red's own Barracks,
# declines the hire question, presses Space (the question again), walks east along row 4 in three
# legs onto A, the first of the green channel's two monoliths, with its last 100 points (14 straight
# steps after the Barracks: 1 500 in all), jumps to B, and presses Space twice at 0 points (B → A →
# B; one candidate each, no draw). E11-15: one hero steps onto M1 of the orange channel's four and
# presses Space 60 times. E11-17: E11-17b boards the empty boat on W2's anchor (18, 24) from the
# island east of it (VCMI's visitable tile of W2; `vcmi_tile`); E11-17, wearing the Admiral's Hat
# (free boarding, no loss: it holds the Sea Captain's Hat), boards beside W1, sails onto it and
# presses Space 60 times. E11-16 (Blue), also with the Admiral's Hat, boards beside W1 on Blue's day
# 1, sails onto it and presses until it lands on E11-17's tile.
#
# **The heroes.** Red has four, Blue one. Nobody has Scouting, Pathfinding, Logistics or Navigation;
# no artifact but the two Admiral's Hats (batch E8a had two). Land points (packs/base/adventure.toml
# `land_points`, by the slowest speed from 0): E11-14's Dendroid Guards (speed 3) 1 500, the Angels
# and Archangels 2 000, E11-16's Pikeman 1 560; at sea with the Admiral's Hat 3 000 (1 500 + 500 +
# 1 000). A step costs 100 on grass and water, 141 diagonally. A hero's scouting radius is 5
# (ADV-FOG-002: dx² + dy² ≤ 30); every click's target lies within the clicking hero's own radius.
#
# **The pictures** (docs/experiments/README.md, "Increment 11's objects"): a monolith of channels 0 to
# 3 is the one tile `at`, entered there from any side but the three tiles above it; a Whirlpool is
# the 3 × 2 tiles ending on `at`, all six entered, from above too; a boat stands on the tile west of
# its `at`; the Barracks covers `at` and the tile west of it and is entered at `at`.
#
# **The places.** The Barracks S (5, 4) (it covers (4, 4)); the green two-way channel 0: A (19, 4), B
# (12, 9); the orange two-way channel 1: M1 (26, 4), M2 (32, 4), M3 (26, 9), M4 (32, 9). The sea:
# water from (14, 14) to (35, 35), with a grass island (19, 22) to (21, 24) east of W2. W1 (22, 15)
# to (24, 16), W2 (16, 23) to (18, 24), W3 (28, 19) to (30, 20); every list tile has a plain water
# tile beside it (the next turns' steps off). The boats: (22, 14) for E11-17 and (24, 14) for E11-16,
# north of W1's top row; (18, 24), W2's anchor, for E11-17b; (29, 20), W3's bottom middle, empty.
#
# **The walks** (priced on the written map by a throwaway test, TRAPS.md, on a copy without the two
# boats on Whirlpools' tiles, which the engine's setup refuses; the monoliths and Whirlpools import as
# blockers until T103, so each step onto one was priced by hand): see each row's predictions.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or a resource; an artifact on a moving hero goes under "anything odd" (boots would move
# the points).

[map]
name = "E08 batch E11b"
description = "Engine-generated experiment map (E08, batch E11b): the space key at a two-way monolith with no points and at an owned dwelling, a two-way channel of four pressed 60 times, three Whirlpools pressed 60 times with a hero of the team on one's visitable tile and an empty boat on another's, a Whirlpool landing on an enemy hero. Hot seat, Red and Blue human; difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-11b.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and at the start of each later turn (save 2 Blue's day 1, save 3 Red's day 2, save 4 Blue's day 2).",
    "Most records are the game's memory: a hero's tile (column, row), its movement points (hero +0x4D), the day's maximum (+0x49) and army (slot, creature, count), whether it is in a boat (its status +0x105, bit 18, 0x40000), a tile's class (its map_item record +0x1E) and the hero there, the Whirlpools' list (game +0x4E77C: its packed positions in order) and each Whirlpool tile's word (map_item +0x0), the messages and dialogs shown (by their text's table and line), a battle's opening (terrain, sides, stacks). The capture harness reads them (`clients/capture/batches/E08-batch-11b.toml`, E08 T100). Played by hand, read the screens instead and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left. A walk: click the target once (the path's marks show), then again (the hero goes). A step onto a monolith, a dwelling or a Whirlpool: click its tile from the neighbouring tile named (twice). A boat: click it from the shore beside it (twice): the hero boards it and its walk ends there. **Space:** with the hero selected, press the space bar once; a row's \"presses\" are that, one at a time, with the reads after each.",
    "A battle between Red's and Blue's heroes (none is expected): play it, Red's stacks attacking, Blue's Pikeman only waiting or defending (never a retreat or a surrender). A level-up's dialog after a battle: take the left skill.",
    "Order: day 1, Red's turn: E11-14, E11-15, E11-17 (E11-17b's boarding, then E11-17's presses); end the turn. Blue's turn: E11-16's steps 1 to 3; end the turn. Day 2, Red's turn: E11-16's step 4; end the turn. Blue's turn: E11-16's step 5. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


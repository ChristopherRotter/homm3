  right**.
- **The reading** (§2.1, §4.1; 0x4DA720 one level at a time; the engine's GAM-DEC-002): each
  level is drawn after the previous answer, so an answer changes the next level's candidates (a
  skill learned at level 2 can be advanced at level 3; its slot is taken). From S the scorer
  prints each dialog and the hero after. **The alternative** (every level drawn before the first
  answer, from the skills before the battle) is printed too; where the two agree the row tells
  only D-14 (the draws from S).
"""

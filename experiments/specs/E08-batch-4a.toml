# Experiment batch E4a (E08 T32a; decision 67): increment 4's progression rows E4-1 to E4-5
# (survey docs/rules/surveys/E08-progression.md §7) in SoD on Easy, hot seat. E4-6 (the map's
# level limit binds every hero on its map) is batch E4b; decision 45's rows E4-7 to E4-10 are
# batch E4c. Build: docs/experiments/README.md. Predictions are for the agent who evaluates the
# results; the template never shows them.
#
# | row  | settles                      | the reading (the engine, faithful)  | the other source(s)         |
# | E4-1 | D-20, D-14: levels at load   | the computer's evaluation chooses    | the wiki, VCMI: the left    |
# | E4-2 | D-15: level 10's primary     | the second row (the new level)       | VCMI: the first (old level) |
# | E4-3 | D-16, A-10: Wisdom at 3      | due every 6 (might): by chance       | VCMI, HotA: due at 3        |
# | E4-4 | §2.1, §4.1: three dialogs    | each drawn after the previous answer | drawn before the answers    |
# | E4-5 | D-17: a known school's weight | 1                                   | VCMI: its class weight      |
#
# The key to most rows: the hero's seed byte S (hero +0x8F, drawn by the new game, never
# advanced; §2.2) and the levels Wisdom (+0x90) and a school (+0x3F) were last offered, read at
# the start. With S each level's primary skill and offers follow from the level, the class and
# the hero's skills (§2), so each row is a prediction per hero, made by the scorer:
#
#   cargo run -p h3-map --example e4_score -- experiments/out/E08-batch-4a.h3m experiments/results/E08-batch-4a.md
#
# (crates/h3-map/examples/e4_score.rs: the reading as the engine's h3_heroes draws it, and each
# other source's rule on the same draws). A row whose S gives the same prediction under both
# rules is inconclusive: each row has several heroes, each with its own S, and a new game draws
# them again. Played by hand the seed bytes stay empty; E4-1's always-left test still holds.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact, whose primary skills then show in the hero's (+0x476 to +0x479, HER-ADV-001): the
# dialogs' primary skill decides D-15, the secondary skills decide E4-1; note a worn artifact
# under "anything odd". The heroes' armies are only there to win: at load the evaluation replaces
# the army's worth by defaults (§10.2).

[map]
name = "E08 batch E4a"
description = "Engine-generated experiment map (E08, batch E4a): hero progression, levels at load and level-ups. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-4a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1).",
    "Every hero's seed byte (hero +0x8F) and the levels Wisdom (+0x90) and a magic school (+0x3F) were last offered show only in the game's memory: the capture harness reads them (clients/capture/batches/E08-batch-4a.toml). Played by hand, leave them empty.",
    "Each level-up dialog: note the new level, the primary skill it raises, the skill offered left and right (one skill alone: under left, right empty) and the one taken; answer as the encounter says.",
    "Order: day 1, Red's turn: E4-2a to E4-2c, E4-3a to E4-3c, E4-4a, E4-4b, each as its encounter says; end the turn. Blue's turn: E4-5a to E4-5c; end the turn. E4-1's heroes never move. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]

# --- D-20, D-14: levels at load ------------------------------------------------------------------

[[encounter]]
id = "E4-1a"
title = "Levels at load: a Knight with Basic Leadership and 3 200 experience"
questions = ["D-20", "D-14", "GAM-SET-002", "HER-LVL-006"]
procedure = [
    "Day 1, Red's turn, before anything moves: Blue's hero E4-1a (a Knight, 3 200 experience on the map, 2/2/1/1, Basic Leadership) never moves. Read its seed byte and the two levels last offered (the harness, from the game's memory), then its experience, level, primary and secondary skills (its portrait's window).",
]
record = [
    { field = "seed byte (hero +0x8F)" },
    { field = "Wisdom last offered (hero +0x90)" },
    { field = "a school last offered (hero +0x3F)" },
    { field = "experience at the start" },
    { field = "level at the start" },
    { field = "primary skills at the start (attack/defense/power/knowledge)" },
    { field = "secondary skills at the start (in the hero's order, each with its level)" },
    { field = "anything odd" },
]
predictions = """
- **The level** (HER-EXP-002, every source): 3 200 is level 4's threshold: **level 4**, the
  experience **stays 3 200**; three level-ups (2, 3 and 4) while the new game is set up, no dialog.
- **The reading** (survey docs/rules/surveys/E08-progression.md §3.2, §9, §10; D-20; the
  engine's GAM-SET-002 and HER-LVL-006): each level is drawn by the original's generator from the
  seed byte S and the new level (D-14: the primary skill by the Knight's levels-2-to-9 chances
  35/45/10/10, then two offers), and **the computer's evaluation chooses** (0x52BBD0: the army's
  worth replaced by 1 000 and 500, the map's terrain shares, all 0 here: no coast). From S the
  scorer prints each level's primary skill, offers and choice and the hero after: primary
  skills, secondary skills, the levels Wisdom and a school were last offered.
- **The wiki's always-left** (§5.2; VCMI 1.7.5's levelUpAutomatically takes the first offer too,
  with its own draws): the left offer at every level. **Without S already**: the known skill ends
  **Expert** and the hero has **exactly one new skill**, at Basic (levels 2 and 3 advance it,
  level 4's first offer falls back to a new skill); any other outcome refutes always-left. With S
  the scorer prints always-left's hero too (the original's draws, the left offer taken).
- The primary skills gain 3 points under every source: they sum to **9**, each at least 2/2/1/1.
"""
[encounter.hero]
type = "Orrin"
specialty = "skill Archery"
owner = "blue"
experience = 3200
primary = [2, 2, 1, 1]
skills = [["Leadership", 1]]
army = [["Pikeman", 1]]


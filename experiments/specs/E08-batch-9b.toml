# Experiment batch E9b (E08 T78; decisions 193, 198, 201, 202): rows E9-6 to E9-12 of increment
# 9's plan (survey docs/rules/surveys/E08-economy.md §15; docs/epics/E08-design.md §17), the day's
# start, in SoD on Easy, hot seat, fifteen days of end turns. Batch E9a (`E08-batch-9a`) is the
# visits. Build: docs/experiments/README.md. Predictions are for the agent who evaluates the
# results; the template never shows them.
#
# | row   | settles                                  | the reading (faithful)                       | the other source(s)                     |
# | E9-6  | §7.1, §8.3: no income on day 1; mines    | no change on day 1; +1 000 gold and +2 ore    | consensus; the start's reveal: VCMI and |
# |       |                                          | from day 2; their surroundings explored       | the engine the same                     |
# | E9-7  | §8.1, §8.2: the heroes' and creatures'   | +125, +500, +5 of mercury, sulfur, crystal,   | VCMI: the Cornucopia +4 each            |
# |       | income                                   | gems, +1 crystal a day; +3 crystal on day 8   |                                         |
# | E9-8  | §9, decision 201: the weekly objects     | 3 to 6, 500, 5 gems or 500; nothing on day 2  | consensus                               |
# |       |                                          | nor to Blue; again on day 8 (the Wheel        |                                         |
# |       |                                          | 1 000); the unvisited set full on day 9       |                                         |
# | E9-9  | D-49: growth in sixteenths               | 47, 89, 16 then 51, 97, 18; 43 kept           | VCMI: 52 and 98 on day 15               |
# | E9-10 | A-32: the cap above 4 000                | 4 095 becomes 4 000 on day 8                  | VCMI: 4 095 kept                        |
# | E9-11 | §11: timed events                        | the list's order, floored at 0, every two     | consensus (VCMI's interval-1 slip does  |
# |       |                                          | days from day 2                               | not apply)                              |
# | E9-12 | §12: spell points                        | +2 a day; +3; the maximum                     | consensus                               |
#
# **The players' incomes** are kept apart: Red holds every income of E9-6 and E9-7; Blue (E9-11's
# events) only E9-11's Endless Purse of Gold (+500 a day), so its events can be told apart from the
# floor. No other hero of either player has an income specialty, Estates, Mysticism or an income
# artifact (each `specialty` checks it).
#
# **The pictures** (`Objects.txt`; docs/experiments/README.md, "Increment 9's objects"): the
# Windmill blocks only its entrance, the tile west of `at`; the Water Wheel covers two rows of
# three ending on `at` and is entered at `at`; the Mystical Garden covers three tiles on `at`'s row
# and is entered at the middle one. An object is entered from a tile beside it or below it, never
# from above. A mine as in batch E9a.
#
# **The points.** Angels 2 000 a day (packs/base/adventure.toml `land_points`); a step 100 on
# grass, 141 diagonally; each day's walk below is within its points with a margin (each leg priced
# by a throwaway search over the written map; a target is within the explored tiles at its click).
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or a resource. The template asks for gold; anything the spec does not give goes under
# "anything odd". The treasuries are compared between turns, so the bonus cancels out.

[map]
name = "E08 batch E9b"
description = "Engine-generated experiment map (E08, batch E9b): the day's start: no income on day 1, the mines', heroes' and Crystal Dragons' income, the weekly objects, the monsters' growth, timed events, spell points. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-9b.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and at the start of Red's turn on days 2, 3, 8, 9 and 15 (saves 2 to 6).",
    "Most records are the game's memory: the date (game +0x1F63E day of the week, +0x1F640 week, +0x1F642 month), the players' treasuries and their income (player +0x108), the mine records (game +0x4E38C, survey §2.1), the explored tiles, a hero's spell points, the Mystical Garden's mask of a player (+0xB8), the weekly objects' and the monsters' tile words (a Windmill's resource bits 0 to 3 and amount bits 13 to 16, a Water Wheel's gold bits 0 to 4 in 500s, a Garden's resource bits 6 to 9 and full bit 10; a monster's count bits 0 to 11 and sixteenths bits 27 to 30). The capture harness reads them (`clients/capture/batches/E08-batch-9b.toml`, E08 T79). Played by hand, read the screens instead and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left. A walk: click the target once (the path's marks show), then again (the hero goes). A visit: walk to the tile named, then click the object's entrance from there (twice).",
    "Order: day 1, Red's turn: E9-6's reads, Red's treasury, E9-12, E9-8; Red's treasury; end the turn. Blue's turn: Blue's gold (E9-11), E9-11's visits (E9-8); end the turn. Day 2: Red: the treasury, E9-12, E9-8 again, the treasury; Blue: the gold. Days 3 to 7: Red's treasury (and E9-12 on day 3), Blue's gold until day 6; end each turn. Day 8: Red: the treasury, E9-9's reads, E9-8, the treasury. Day 9: Red: the treasury, Ivor's visits (E9-8), the treasury. Days 10 to 14: end the turns. Day 15: Red: E9-9's reads. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


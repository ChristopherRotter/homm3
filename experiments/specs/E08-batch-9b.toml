# --- E9-8: the weekly objects ---------------------------------------------------------------------

[[encounter]]
id = "E9-8"
title = "The Windmill, the Water Wheel and the Mystical Garden through two weeks"
questions = ["ADV-WEK-001", "ADV-WEK-002", "ADV-WEK-003", "ADV-VIS-006"]
procedure = [
    "The first set: the Windmill W1 (entrance (10, 40)), the Water Wheel H1 (entrance (14, 40); it covers (12, 39) to (14, 40)), the Mystical Garden M1 (entrance (17, 40); it covers (16, 40) to (18, 40)). The second set: W2 (entrance (5, 8)), H2 (entrance (10, 8); it covers (8, 7) to (10, 8)), M2 (entrance (13, 8)). For each visit note the message, the gain (the treasury before and after) and, before and after, the object's word (the Garden's: and the visitor's mask).",
    "Day 1, Red's turn: before the visits read all six words. E9-8 stands at (12, 42) with two Angels. Walk to (10, 41), click W1 (10, 40); walk to (13, 41), click H1 (14, 40); walk to (16, 41), click M1 (17, 40); walk to (19, 42).",
    "Day 1, Blue's turn: E9-11 stands at (12, 44) with two Angels. As Red: walk to (10, 41), click W1; walk to (13, 41), click H1; walk to (16, 41), click M1; walk to (18, 43).",
    "Day 2, Red's turn: E9-8 visits the first set again, in the other order: walk to (16, 41), click M1 (17, 40); walk to (15, 41), click H1 (14, 40); walk to (11, 41), click W1 (10, 40). It stays on W1's entrance until day 8.",
    "Day 8, Red's turn: before the visits read all six words (E9-8 still stands on W1's entrance). Click (10, 41) (off the entrance), then W1 (10, 40) again; walk to (13, 41), click H1; walk to (16, 41), click M1.",
    "Day 9, Red's turn: before the visits read W2's, H2's and M2's words. Ivor (E9-7's, at (6, 6)) walks to (5, 9), clicks W2 (5, 8); walks to (10, 9), clicks H2 (10, 8); walks to (13, 9), clicks M2 (13, 8).",
]
record = [
    { table = ["object", "word at day 1's start", "word at day 8's start"], labels = ["W1", "H1", "M1", "W2", "H2", "M2"] },
    { table = ["day", "visitor", "object", "message", "gain", "word after"], labels = ["1", "1", "1", "1", "1", "1", "2", "2", "2", "8", "8", "8", "9", "9", "9"] },
    { field = "anything odd" },
]
predictions = """
- **The code** (survey §9; no new day on day 1, the week's scan on day 8 resets every weekly
  object, visited or not; decision 201: one load a week, taken by whoever visits first):
  - **Day 1, Red:** W1 gives its drawn resource, **3 to 6 of mercury, ore, sulfur, crystal or
    gems** (never wood or gold), its amount cleared; H1 **500 gold** (the first week's 1); M1 **5
    gems or 500 gold** (one in two), its full bit cleared, Red's mask bit set.
  - **Day 1, Blue:** **nothing** at all three (W1's and H1's empty messages; M1's "already"; Blue's
    mask bit set): the content was taken, not one per player.
  - **Day 2, Red:** nothing at all three.
  - **Day 8, Red:** W1 a new draw (3 to 6 of mercury to gems) though E9-8 stood on its entrance
    at the week's scan (the scan lifts the hero off and resets the object under it, survey §7.3),
    H1 **1 000 gold** (the week's reset to 2), M1 5 gems or 500 gold, full again.
  - **Day 9, Ivor:** W2, H2 (**1 000 gold**, not 500 nor 1 500: the day-8 reset sets 2 whatever it
    held) and M2 full, with day 8's draws.
  - The visited marks (W's and H's bits 5 to 12 by team, M's player mask) are never cleared.
- **VCMI and the wiki** agree on the amounts and on one visit a week, reset at the week's start.
"""
[encounter.hero]
type = "Clancy"
specialty = "creature Unicorn"
at = [12, 42]
primary = [1, 1, 1, 1]
army = [["Angel", 2]]

# --- E9-9, E9-10: the monsters' growth ------------------------------------------------------------

[[encounter]]
id = "E9-9"
title = "The monsters' growth in sixteenths (E9-9) and its cap above 4 000 (E9-10)"
questions = ["D-49", "A-32", "ADV-MON-013"]
procedure = [
    "Five wandering monsters stand on row 58, far from every hero: 43 Pikemen at (44, 58), 81 Archers at (48, 58), 15 Griffins at (52, 58) and 4 095 Troglodytes at (60, 58) grow; 43 Pikemen at (56, 58) do not grow (the map's flag). E9-9 (Blue's) stands at (50, 66) and never moves.",
    "Read each monster's count and sixteenths (its tile word) at day 1, at Red's turn of day 8 and at Red's turn of day 15.",
]
record = [
    { table = ["monster", "day 1", "day 8", "day 15"], labels = ["43 Pikemen (44, 58)", "81 Archers (48, 58)", "15 Griffins (52, 58)", "43 Pikemen, no growth (56, 58)", "4 095 Troglodytes (60, 58)"] },
    { field = "anything odd" },
]
predictions = """
- **The code** (survey §10.1): the count held in sixteenths, a week adding a tenth of the value,
  truncated, the result capped at 0xFA00 (4 000.0); the loader leaves the sixteenths 0.
  - 43: 688 → 756 (**47**, sixteenths 4) → 831 (**51**, 15).
  - 81: 1 296 → 1 425 (**89**, 1) → 1 567 (**97**, 15).
  - 15: 240 → 264 (**16**, 8) → 290 (**18**, 2).
  - 43 not growing: **43** (0) both days.
  - 4 095: 65 520 + 6 552 capped → **4 000** (0) on day 8 (A-32), 4 000 on day 15.
- **VCMI** (`temppower` in thousandths, +10 % a week, no growth at 4 000 or more): day 8 the same
  47, 89, 16; day 15 **52** and **98**, 18; the 4 095 **kept** (D-49, A-32). The wiki's exact formula
  agrees with both for the 15.
"""
[encounter.hero]
type = "Aislinn"
specialty = "spell Meteor Shower"
owner = "blue"
at = [50, 66]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]

# --- E9-11: Blue's timed events -------------------------------------------------------------------

[[encounter]]
id = "E9-11"
title = "Timed events: their order, the floor at 0, the repeat"
questions = ["GAM-CAL-004"]
procedure = [
    "Blue owns nothing; E9-11 (at (12, 44)) wears the Endless Purse of Gold (+500 gold a day from day 2). The map's events, in this order: day 1 takes 99 999 gold; day 1 gives 300 gold; from day 2 every two days takes 500 gold; all for Blue.",
    "Read Blue's gold at the start of each Blue turn of days 1 to 6 (after the messages), and note the messages.",
]
record = [
    { table = ["Blue, day", "messages", "gold at the turn's start"], labels = ["1", "2", "3", "4", "5", "6"] },
    { field = "anything odd" },
]
predictions = """
- **The code** (survey §11): at each Blue turn's start the events fire in the list's order when
  their day comes; each resource floored at 0. Day 1: the take leaves **0**, then **300** (the
  list's order; the other order would leave 0). Then the Purse's 500 at each day's start, the take
  of 500 on days 2, 4 and 6: **300, 300, 800, 800, 1 300, 1 300** for days 1 to 6. Unfloored, day 1
  would be negative. The messages: the two on day 1, one on days 2, 4 and 6.
- **VCMI** (`CMapEvent::occursToday`) and the wiki: the same days for an interval of 2, the same
  floor.
"""
[encounter.hero]
type = "Alagar"
specialty = "spell Ice Bolt"
owner = "blue"
at = [12, 44]
primary = [1, 1, 1, 1]
army = [["Angel", 2]]
artifacts = { "misc 1" = "Endless Purse of Gold" }

# --- E9-12: spell points --------------------------------------------------------------------------

[[encounter]]
id = "E9-12"
title = "The day's spell points: Mysticism, the Charm of Mana, the Wizard's Well"
questions = ["HER-MAN-002"]
procedure = [
    "Day 1, Red's turn: three heroes with Knowledge 2 (20 spell points at most) stand on row 16, an event east of each that takes 20 spell points: E9-12 at (4, 16) (Basic Mysticism), Uland at (8, 16) (Basic Mysticism and the Charm of Mana), Melodia at (12, 16) (the Wizard's Well). Click (5, 16) with E9-12, (9, 16) with Uland, (13, 16) with Melodia: each steps onto its event. Read each hero's spell points.",
    "Days 2 and 3, Red's turn's start: read each hero's spell points.",
]
record = [
    { table = ["hero", "day 1 after the event", "day 2", "day 3"], labels = ["E9-12", "Uland", "Melodia"] },
    { field = "anything odd" },
]
predictions = """
- **The code** (survey §12): the events leave **0**. At each new day: the regain is Mysticism's by

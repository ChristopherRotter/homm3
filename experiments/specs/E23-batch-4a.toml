# Experiment batch 4a (E23 T7): the original's computer playing a side without a hero (the
# survey docs/rules/surveys/E23-battle-ai.md §3, rows 4a; BAT-Q33's S-25, BAT-Q51's tent). Each
# encounter is one battle against neutral creatures: a guarded pile's guards (a mixed army in
# slot order, up to seven stacks) or a neutral town's garrison. Played by an agent on the capture
# harness (experiments/agent/ai.py, its recipe experiments/agent/E23-batch-4a.toml): one map per
# encounter (`--only <id>`), hot seat (Red and Blue human), the clock stepped 10 ms at a time;
# Red's stacks follow the recipe's plan (else Defend), the neutral side acts on its own, and every
# pick, freeze and action is read from the game's memory (the battle manager's action +0x3C to
# +0x48, the stacks' flags, hexes, hit points, spells and a Faerie Dragon's drawn spell +0x4E0).
# A run per seed (ms the clock idles before Red's first command: the fidgets draw from the rules'
# generator, which the battle's setup seeds from its tile, 0x463A08) gives the computer's draws
# another stream on the same field.
#
# Predictions are for the agent who evaluates the results; the template never shows them. "The
# reading" is installation.md §7.34 to §7.60 (the port, h3-battle-ai, faithful); "the engine" is
# today's rules or the port where they differ; VCMI's AI where the survey names it. Formations
# (BAT-SET-001, loose): k stacks stand on these rows of column 1 (Red, the attacker) or 15 (the
# defender): 1 [5], 2 [2, 8], 3 [2, 5, 8], 4 [0, 4, 6, 10], 5 [0, 2, 5, 8, 10], 7 every even row
# and row 5; hex = 17 x row + column.
#
# Not staged (the survey's rows): W2, W4, W5 and P1 need positions the formations and the
# original's own obstacles (drawn from the tile) do not give; C5 needs the mean of the Genie's 34
# evaluators on the original's state, which no tool computes yet; S3 needs an RoE map, and the
# writer writes SoD maps only. They stay open (survey §3).

[map]
name = "E23 batch 4a"
description = "Engine-generated experiment map (E23, batch 4a): the computer's neutral side. Follow the results template."
size = 36
terrain = "grass"
instructions = [
    "Played by an agent (experiments/agent/ai.py): one map per encounter, `h3-experiment E23-batch-4a.toml --only <id>`. By hand: copy the map into `Maps`, start it in hot seat (Red and Blue human) at the difficulty the run names, select the Red hero and step east into the guards (north into a town).",
    "Every Red stack defends unless the procedure says otherwise. Note what the encounter asks, then end the battle (retreat) as the procedure says.",
    "Fill in this file (anything unexpected goes into the last line of an encounter) and keep it in the repo.",
]

# --- S-25, BAT-Q33: who commands a side ------------------------------------------------------------

[[map.pile]]
resource = "gold"
row = 10
from = 11
to = 11
amount = 1
guards = [["Archer", 10], ["Wood Elf", 10], ["Master Gremlin", 10], ["Gog", 10], ["Orc", 10], ["Lizardman", 10], ["Halfling", 10]]

[[encounter]]
id = "LO"
title = "S-25: a neutral stack frozen by bad morale is let off one time in four"
questions = ["BAT-Q33", "S-25", "BAT-MOR-004"]
procedure = [
    "Red's Bone Dragons defend every turn; Red's Pikemen freeze (forced).",
    "At the opening the harness forces every bad-morale draw to fall (`rolls bad_morale 1`) and every good-morale draw to fail: each stack with morale below 0 is frozen at every pick, unless a second draw lets it off.",
    "Count, for each neutral pick after the battle's first, whether the stack froze (the bad-morale animation 30 over it) or took its turn; the same for Red's Pikemen. After round 15 Red retreats.",
]
predictions = """
The seven neutral shooters stand at morale -1 or lower (Red's Bone Dragons: -1 to the enemy; the
alignment of seven towns, if it counts for a side without a hero): read at the opening. Red's
Pikemen at -1 (undead in the army), the Bone Dragons without morale.
- The reading (0x464BDB): a side whose +0x54A4 is 0 (no player) draws random(1, 4) after the
  freeze, and a 1 lets the stack off: about **one neutral pick in four takes its turn** (25 %;
  over about 100 picks 15 to 35), Red's Pikemen (a human side) **never** (0 %).
- The engine (BAT-MOR-004) and VCMI: one draw for every side: **every** forced pick freezes, the
  neutrals' as the Pikemen's (0 %).
"""
[encounter.hero]
type = "Clavius"
specialty = "resource gold"
at = [10, 10]
primary = [0, 10, 1, 1]
skills = []
army = [["Bone Dragon", 20], ["Pikeman", 100]]
[[encounter.also]]
type = "Nagash"
specialty = "resource gold"
owner = "blue"
at = [33, 2]
primary = [0, 0, 1, 1]
skills = []
army = [["Peasant", 1]]
[[encounter.record]]
field = "LO: the stacks' morale at the opening (Red's and the neutrals')"
[[encounter.record]]
field = "LO: neutral picks after the first: frozen, let off (took their turn)"
[[encounter.record]]
field = "LO: Red's Pikemen's picks: frozen, took their turn"
[[encounter.record]]
field = "anything odd"

# --- W1: no Wait below Hard (§7.34, 0x42201D) -------------------------------------------------------

[[encounter]]
id = "W1"
title = "W1: a walker that chooses nothing defends on Normal, waits on Hard"
questions = ["E23 survey row 4a W1"]
procedure = [
    "Step north into the neutral Citadel. Red's Champions and Dwarves defend (no shooter, no spell book): Red is the weaker at range, the keep's turret makes the garrison the stronger, so its Swordsmen hold the walls with no enemy inside them. Red's Catapult shoots on its own.",
    "Played twice: on Normal and on Hard. At each turn of Red's Dwarves (speed 3, after the Swordsmen's first turn and before the wait phase; ten Peasants died to the keep's first arrow in the first runs) note whether the Swordsmen defend or wait (their flags), and the log's lines; while every wall stands. Red retreats after round 4.",
]
predictions = """
The garrison's Swordsmen hold the walls (0x4213F0: a fort without an open hex, the defender the
stronger at range by its keep, every defender inside): only enemies inside the walls are
candidates, so none. No besieger, so the fallback: no shooter to guard (the arrow towers are left
out, 0x420760), on Hard 0x4208F0 finds no hex scoring below 0 inside the walls; no cast. Then
0x421F80: **Normal: Defend (3); Hard: Wait (8), and in the wait phase Defend (3)**: at the turn
of Red's Dwarves the Swordsmen show the defending bit on Normal, the waited bit on Hard. VCMI and
the port alike (BAT-AI-001; the port replayed on this siege in the engine: Defend on Normal, Wait
then Defend on Hard while the walls stand); the survey's "otherwise": a Wait on Normal. The walls
are read at each turn: a breach before the Swordsmen's turn (Red's automatic Catapult) ends the
holding: a destroyed mid-lower wall or gate fails the test (S4), a mid-upper or lower wall does
not (slip 2).
"""
[encounter.hero]
type = "Caitlin"
specialty = "resource gold"
at = [8, 30]
primary = [0, 10, 1, 1]
skills = []
army = [["Champion", 10], ["Dwarf", 30]]
[encounter.opponent.town]
faction = "castle"
owner = "neutral"
buildings = ["fort", "citadel"]
garrison = [["Swordsman", 20]]
[[encounter.also]]
type = "Sylvia"
specialty = "skill Navigation"
owner = "blue"
at = [33, 5]
primary = [0, 0, 1, 1]
skills = []
army = [["Peasant", 1]]
[[encounter.record]]
field = "W1: the Swordsmen's actions in rounds 1 and 2, on Normal"
[[encounter.record]]
field = "W1: the Swordsmen's actions in rounds 1 and 2, on Hard"
[[encounter.record]]
field = "anything odd"

# --- S4: the walls test's wrong records (§7.35, 0x42142F; survey slip 2) ----------------------------

[[encounter]]
id = "S4"
title = "S4: a garrison holds the walls behind a destroyed mid-upper wall, not behind the mid-lower"
questions = ["E23 survey row 4a S4", "slip 2"]
procedure = [
    "Step north into the neutral Citadel. Red's hero has Basic Ballistics (one aimed shot a turn; Expert's second shot broke a second wall in the first runs): the agent aims the Catapult at one wall until it falls (the mid-upper in one run, the mid-lower in the other); Red's Champions defend.",
    "Note the Swordsmen's action at each turn and the walls' hit points before it; after round 6 Red retreats.",
]
predictions = """
As W1 while every wall stands: the Swordsmen hold the walls and Defend (Normal). Once the aimed
wall is down:
- The reading (0x42142F's wrong records): a destroyed **mid-upper wall never counts as a breach**:
  the Swordsmen still hold and Defend; a destroyed **mid-lower wall fails the test** (its record
  gives hex 0, free): they no longer hold and sally (a move or a move and attack at Red's
  Champions).
- The test as meant (`strict-fixed`, slip 2 fixed): both breaches open a hex: they sally in both.
"""
[encounter.hero]
type = "Jenova"
specialty = "resource gold"
at = [18, 30]
primary = [0, 10, 1, 1]
skills = [["Ballistics", 1]]
army = [["Champion", 10]]
[encounter.opponent.town]
faction = "castle"
owner = "neutral"
buildings = ["fort", "citadel"]
garrison = [["Swordsman", 20]]
[[encounter.also]]
type = "Piquedram"
specialty = "creature Stone Gargoyle"
owner = "blue"
at = [33, 8]
primary = [0, 0, 1, 1]
skills = []
army = [["Peasant", 1]]
[[encounter.record]]
field = "S4: the mid-upper wall's run: the round it fell; the Swordsmen's actions before and after"
[[encounter.record]]
field = "S4: the mid-lower wall's run: the round it fell; the Swordsmen's actions before and after"
[[encounter.record]]
field = "anything odd"


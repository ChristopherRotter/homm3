# Experiment batch 2b (E04b, end of T3): timed effects and the staged damage. Checks what the code
# reading of the executable (docs/formats/installation.md §7.9–§7.12) inferred but no observation
# has shown: the x87 precision of the damage stages (53 bits, Q50; 64 bits would change many
# results by one point), Counterstrike's extra round (quirk Q-0008), Fire Shield's reflection base
# (quirk Q-0010), Shield with Armorer in one product (BAT-DMG-002 stage 3), one counter pair (Q47:
# Bloodlust and Weakness add up, Haste and Slow cancel), and a skill specialist's rate grown in
# single precision at level 10 (Q45 option (b), HER-BAT-004).
# Build: see docs/experiments/README.md. Predictions are for the agent who evaluates the results;
# the template never shows them. Predictions are the engine's at 0faeb87 (faithful profile unless
# a line names another); the alternatives name their source.
#
# Played with plain HD (HD+ off). Hero levels: experience 0 (level 1), except Mephala (R6, level
# 10). Heroes have resource specialties unless the encounter is about a specialty; casters get a
# Spell Book and only the listed spells; no Wisdom, no school skills (mastery none), no luck
# sources, so no lucky strikes. Every caster starts with full mana, 10 x knowledge. Creatures:
# Angel 20/20, 50 damage, 200 hit points, speed 12; Naga Queen 16/13, 30 damage, 110 hit points,
# speed 7, no enemy retaliation; Peasant 1/1, 1 damage, 1 hit point, speed 3.
# Not staged: Q-0005's single-precision resistance and Q43 (as batch 2a); the E04a candidates
# (1)-(4) of docs/experiments/README.md; batch 2a's open costs (R6, T7).

[map]
name = "E04b batch 2b"
description = "Engine-generated experiment map (E04b, batch 2b). Play it in hot seat with Red and Blue as human players and follow the results template."
size = 36
terrain = "dirt"
instructions = [
    "Copy `E04b-batch-2b.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human. In the battles against Blue's heroes you control both sides. Save right away.",
    "On day 1, Red's hero R6 (Mephala, 14 700 experience) levels up to level 10: accept the level-up offers; any choice will do (none changes R6's battle). Then play Red's encounters R1–R6 in any order: each Red hero attacks the Blue hero next to it.",
    "In battle, the combat log at the bottom shows each strike's damage and kills (scroll it with its arrow); right-click a stack to see its numbers (attack, speed, health left of the top creature, active spells). Unless an encounter says otherwise, a stack that is not needed Defends, and a stack that gets an extra turn from good morale Defends.",
    "Fill in this file (anything unexpected goes into the last line of an encounter) and keep it in the repo.",
]

# --- The x87 precision of the damage stages (Q50, BAT-DMG-002) ---------------------------------------

[[encounter]]
id = "R1"
title = "Angels against one defense point more: the x87 precision"
questions = ["Q50"]
procedure = [
    "Attack the Blue hero.",
    "Round 1: the stack of 4 Angels attacks the Peasants; note the damage and the kills from the log. Then the stack of 8 Angels attacks the Peasants; note the same. (The Angels act before the Peasants, so the Peasants are not defending.)",
    "Finish the battle as you like.",
]
predictions = """
Angels attack 20 (hero attack 0) against Peasants defense 21 (1 + the Blue hero's 20): one point
less, so stage 2's factor is 1 - 1 x 0.025 as a double (0.97499999999999997780, the double 0.025
is slightly above the decimal). 4 Angels: base 200, 8 Angels: 400.
- Ours (53 bits, `h3_kernel::arith::X87_PRECISION`; faithful and strict-fixed agree): 200 x f =
  194.999999999999995559 rounds to 195.0 at 53 bits: **195**, then **390** (kills the same).
- 64 bits (the x87 default without the Windows runtime's precision control): the product stays
  below the integer: **194**, then **389**. This would change BAT-DMG-002's stages and
  `X87_PRECISION`.
- Exact decimals (VCMI's one rounding gives the same here): 195, 390.
"""
[encounter.hero]
type = "Caitlin"
specialty = "resource gold"
primary = [0, 0, 1, 1]
army = [["Angel", 4], ["Angel", 8]]
[encounter.opponent.hero]
name = "R1b"
type = "Nagash"
specialty = "resource gold"
primary = [0, 20, 0, 0]
army = [["Peasant", 700]]
[[encounter.record]]
table = ["strike", "damage (log)", "Peasants killed (log)"]
rows = 2
[[encounter.record]]
field = "anything odd"

# --- Counterstrike's extra round (Q-0008, BAT-MAG-015) ----------------------------------------------

[[encounter]]
id = "R2"
title = "Counterstrike: retaliations in the round after it ends"
questions = ["Q-0008"]
procedure = [
    "Before attacking, check R2's spell points (30 expected) and spell power (1, so Counterstrike lasts one round).",
    "Attack the Blue hero. Round 1: no attacks. Move both Wolf Rider stacks and the Pikemen toward the middle so that the Wolf Riders can reach the Pikemen in round 2.",
    "Round 2: both Wolf Rider stacks Wait. On the Pikemen's turn, cast Counterstrike on the Pikemen, then let the Pikemen Defend. Then each Wolf Rider stack attacks the Pikemen. For each attack note whether the Pikemen strike back (the log shows the Pikemen's damage and the Wolf Riders killed).",
    "Round 3: right-click the Pikemen: is Counterstrike still listed? Then each Wolf Rider stack attacks the Pikemen (no Wait); note again whether each attack is struck back. The Pikemen Defend.",
    "Round 4: as round 3.",
]
predictions = """
Counterstrike, mastery none: +1 retaliation (2 per round) for 1 round (power 1): active in round 2
only. The round start resets the retaliations before the durations fall
(`installation.md` §7.10), so round 3 starts with 2 although the spell has ended.
- Ours, faithful (Q-0008 on, the executable): round 2: both attacks struck back; round 3: **both
  struck back**, Counterstrike no longer listed; round 4: only the first.
- Strict-fixed (Q-0008 off) and VCMI: round 3: **only the first**; round 4: only the first.
- Damage scale (both heroes' defense 30, so each factor is at its 0.3 floor): a Wolf Rider attack
  kills about 2-3 Pikemen, a retaliation about 6 Wolf Riders (Pikemen 1-3 damage).
"""
[encounter.hero]
type = "Jenova"
specialty = "resource gold"
primary = [0, 30, 1, 3]
army = [["Pikeman", 100]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Counterstrike"]
[encounter.opponent.hero]
name = "R2b"
type = "Damacon"
specialty = "resource gold"
primary = [0, 30, 0, 0]
army = [["Wolf Rider", 40], ["Wolf Rider", 41]]
[[encounter.record]]
field = "spell points and spell power at the start"
[[encounter.record]]
table = ["round", "attack by", "Pikemen struck back (yes/no)", "Wolf Riders killed by the retaliation (log)"]
rows = 6
[[encounter.record]]
field = "round 3: Counterstrike still listed on the Pikemen (yes/no)"
[[encounter.record]]
field = "anything odd"

# --- Fire Shield's reflection base (Q-0010, BAT-MAG-018) --------------------------------------------

[[encounter]]
id = "R3"
title = "Fire Shield: a share of the strike before the defense, or of the damage dealt"
questions = ["Q-0010"]
procedure = [
    "Attack the Blue hero. Round 1: move the Naga Queens toward the Peasants (no attack). On the Peasants' turn, Blue casts Fire Shield on the Peasants; then move the Peasants one hex toward the Naga Queens (do not Defend: it would raise their defense).",
    "Round 2: the Naga Queens attack the Peasants. Note the damage and the kills from the log, and any line about the fire shield.",
    "Right-click the Naga Queens: note their number and the health left of the top one (110 at full health).",
    "Finish the battle as you like.",
]
predictions = """
10 Naga Queens: base 300, attack 16 against Peasants defense 36 (1 + 35): 20 points less, so
stage 2 halves it: **150 damage, 150 Peasants killed** (every model). Fire Shield at mastery
none reflects 20 % (`f32(0.2)`); the Naga Queens never get a retaliation, so their loss is the
reflection alone.
- Ours, faithful (Q-0010 on, the executable): a share of stage 1, `min(300, the Peasants' hit
  points)` = 300: trunc(300 x f32(0.2)) = **60**: 10 Naga Queens, the top one **50** health left.
- Strict-fixed (Q-0010 off), VCMI and the spell's text: a share of the damage dealt, 150 x 0.2 =
  **30**: 10 Naga Queens, **80** health left.
"""
[encounter.hero]
type = "Aine"
specialty = "resource gold"
primary = [0, 0, 1, 1]
army = [["Naga Queen", 10]]
[encounter.opponent.hero]
name = "R3b"
type = "Sephinroth"
specialty = "resource crystal"
primary = [0, 35, 5, 2]
army = [["Peasant", 1000]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Fire Shield"]
[[encounter.record]]
field = "damage and kills of the Naga Queens' attack (log)"
[[encounter.record]]
field = "log line about the fire shield, if any (copy it)"
[[encounter.record]]
field = "Naga Queens afterwards: number, health left of the top one"
[[encounter.record]]
field = "anything odd"

# --- Shield with Armorer: one product in stage 3 (BAT-DMG-002, BAT-MAG-012, BAT-HER-004) -------------

[[encounter]]
id = "R4"
title = "Shield with Basic Armorer, and Armorer alone"
questions = ["BAT-DMG-002", "Q-0005"]
procedure = [
    "Attack the Blue hero. Round 1: the Firebird acts first (speed 15, the Angels 12): on its turn cast Shield on the Peasants of 1000 (call them A); the Firebird Defends. Do not let any Angels Wait.",
    "Then the Angels attack (the Peasants act after them, so they are not defending): the 3 Angels attack A, the 1 Angel attacks A, the 4 Angels attack the Peasants of 1001 (B). Note each strike's damage and kills from the log.",
    "Finish the battle as you like.",
]
predictions = """
Angels attack 20 against Peasants defense 20 (1 + the Red hero's 19): no bonus, no reduction, so
stage 3 alone acts. Shield at mastery none lets `f32(0.85)` through; Basic Armorer keeps 1 -
`f32(0.05)`. Ours (the executable's stage 3): one product, `trunc(d x (1 - f32(0.05)) x f32(0.85))`
in x87 arithmetic.
- 3 Angels on A (base 150): ours **121**; Shield and Armorer truncated one after the other
  (either order) 120; added as 20 % 120. Exact decimals 121.
- 1 Angel on A (base 50): ours **40**; one after the other 39; added 40.
- 4 Angels on B, Armorer alone (base 200): ours (faithful, Q-0005: the single-precision 0.05 is
  slightly above the decimal) **189**; strict-fixed and exact decimals 190.
"""
[encounter.hero]
type = "Octavia"
specialty = "resource gold"
primary = [0, 19, 1, 1]
skills = [["Armorer", 1]]
army = [["Peasant", 1000], ["Peasant", 1001], ["Firebird", 1]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Shield"]
[encounter.opponent.hero]
name = "R4b"
type = "Saurug"
specialty = "resource gems"
primary = [0, 0, 0, 0]
army = [["Angel", 3], ["Angel", 1], ["Angel", 4]]
[[encounter.record]]
table = ["strike", "damage (log)", "Peasants killed (log)"]
rows = 3
[[encounter.record]]
field = "anything odd"

# --- A counter pair (Q47, BAT-MAG-010) --------------------------------------------------------------

[[encounter]]
id = "R5"
title = "Bloodlust and Weakness on one stack; Haste and Slow"
questions = ["Q47"]
procedure = [
    "Attack the Blue hero. Round 1: on the Pikemen's turn, cast Bloodlust on the Pikemen, then they Defend. On the Peasants' turn, Blue casts Weakness on Red's Pikemen, then the Peasants Defend.",
    "Right-click the Pikemen: note the attack as shown and the spells listed.",
    "Round 2: on the Pikemen's turn, cast Haste on the Pikemen, then they Defend. On the Peasants' turn, Blue casts Slow on the Pikemen, then the Peasants Defend.",
    "Right-click the Pikemen: note attack, speed and the spells listed. Finish the battle as you like.",
]
predictions = """
Pikemen attack 4, speed 4. Mastery none: Bloodlust +3, Weakness -3, Haste +3, Slow 75 %. Power 3,
so all last to the end of round 3.
The spell list decides; the attack shown is secondary: Weakness changes the stack's attack when
cast, Bloodlust acts only at a melee strike (`installation.md` §7.9), so the window may or may
not count Bloodlust.
- Ours (the executable, Q47: only Bless/Curse and Haste/Slow cancel each other): after round 1
  **both Bloodlust and Weakness listed**, attack 4 (4 + 3 - 3) or 1 (Bloodlust not shown); after
  round 2 Slow has ended Haste: speed 3 (75 % of 4), Bloodlust, Weakness and Slow listed.
- VCMI (all five pairs cancel): after round 1 only Weakness listed, attack 1; round 2 as ours for
  Haste and Slow (speed 3).
"""
[encounter.hero]
type = "Calid"
specialty = "resource sulfur"
primary = [0, 0, 3, 2]
army = [["Pikeman", 20]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Bloodlust", "Haste"]
[encounter.opponent.hero]
name = "R5b"
type = "Grindan"
specialty = "resource gold"
primary = [0, 0, 3, 2]
army = [["Peasant", 20]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Weakness", "Slow"]
[[encounter.record]]
field = "after round 1: Pikemen attack as shown, spells listed"
[[encounter.record]]
field = "after round 2: Pikemen attack, speed, spells listed"
[[encounter.record]]
field = "anything odd"

# --- A skill specialist at level 10 (Q45 option (b), HER-BAT-004) -----------------------------------

[[encounter]]
id = "R6"
title = "Mephala at level 10: the Armorer specialty grown in single precision"
questions = ["Q45"]
procedure = [
    "On Red's turn (after the level-ups), open R6's hero screen: note level, attack, defense and the secondary skills.",
    "Attack the Blue hero. Round 1: the 4 Angels attack the Peasants, then the 1 Angel attacks the Peasants (the Angels act first, so the Peasants are not defending). Note each strike's damage and kills from the log.",
    "Finish the battle as you like.",
]
predictions = """
Mephala, Expert Armorer (15 %), specialist +5 % per level. Blue's Angels attack 90 against at
most 10 defense: the attack bonus is at its cap (+300 %) whatever Mephala's level-ups gave, so
stage 1 is 4 x base and stage 2 leaves it: 800 and 200 before the Armorer.
- Ours, faithful (Q45 (b), the executable's getter: `f32(0.15f x (f32(10) x 0.05f + 1))` =
  0.22500000894, slightly above 22.5 %): **619** and **154**.
- Strict-fixed, exact decimals (22.5 %) and the bp growth before Q45 (f32(0.225), slightly
  below): 620 and 155.
- If the level is not 10 (ours / exact): level 9: 625 / 626, 156 / 156; level 11: 613 / 614,
  153 / 153.
"""
[encounter.hero]
type = "Mephala"
specialty = "skill Armorer"
experience = 14700
primary = [0, 0, 1, 1]
skills = [["Armorer", 3]]
army = [["Peasant", 1500]]
[encounter.opponent.hero]
name = "R6b"
type = "Clavius"
specialty = "resource gold"
primary = [70, 0, 0, 0]
army = [["Angel", 4], ["Angel", 1]]
[[encounter.record]]
field = "R6 after the level-ups: level, attack, defense, secondary skills"
[[encounter.record]]
table = ["strike", "damage (log)", "Peasants killed (log)"]
rows = 2
[[encounter.record]]
field = "anything odd"

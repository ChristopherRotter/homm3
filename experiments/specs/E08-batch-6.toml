# Experiment batch E6 (E08 T46; decisions 100, 105, 107): all eleven rows of increment 6's plan
# (survey docs/rules/surveys/E08-army.md §9; docs/epics/E08-design.md §14), army and hero
# management, in SoD on Easy, hot seat, on one map (decision 107: 16 heroes, the original's eight
# per player). Build: docs/experiments/README.md. Predictions are for the agent who evaluates the
# results; the template never shows them.
#
# | row   | settles                                      | the reading (faithful)                          | the other source(s)                      |
# | E6-1  | §1: the army dialog (a check)                | asked; the dialog; OK: the group lost            | VCMI the same; the engine: a fight today |
# | E6-2  | §1.1 point 3: room made in the dialog        | the group in the freed slot                      | VCMI the same                            |
# | E6-3  | §3.2: a hero's last stack in the exchange    | move refused, merge refused, swap allowed        | VCMI and the wiki the same               |
# | E6-4  | A-16, D-27: the split's bounds               | the source keeps one creature                    | VCMI: the whole stack moves              |
# | E6-5  | A-15: a count through 16 bits                | a move in the hero screen whole; the exchange's  | VCMI: 32 bits everywhere                 |
# |       |                                              | move and the screen's swap onto it -25 536       |                                          |
# | E6-6  | §4: the tactics formation                    | off: no tactics phase; on: the phase             | VCMI and the wiki the same               |
# | E6-7  | §2.2: Scholar at a meeting                   | each learns up to min(Wisdom + 2, Scholar + 1)   | VCMI and the wiki the same               |
# | E6-8  | §5.3: the assembly's questions and position; | asked once after an equip; the right-click asks; | VCMI: at the clicked part's position;    |
# |       | D-28: no disassembly in the backpack         | the combination at the first position taking it; | in the backpack the disassembly asked    |
# |       |                                              | in the backpack only its window                 |                                          |
# | E6-9  | §5.4: Titan's Thunder's book                 | the book stays after the Thunder comes off       | VCMI and the wiki the same               |
# | E6-10 | §5.1: the backpack's arrows                  | the array rotated by one                         | VCMI: a view, not observable here        |
# | E6-11 | §2.1: a meeting's price                      | the step's price, the visitor stays              | not compared                             |
#
# **Where the plan changed** (T46): E6-5 as survey §9 wrote it (a move to an empty slot in the
# hero screen, -25 536) contradicts §3.5's roles (`army_swap_slots` 0x44AD60, re-read: slot b
# receives a's count through 16 bits; the hero screen passes a = the clicked slot, b = the
# selected one, 0x4DDB53; the exchange a = the source, b = the target, 0x5B0ED5), so a move in the
# hero screen keeps 40 000 and wraps only the emptied slot's 0; the row moves (control), then
# moves to the other hero in the exchange and swaps in the hero screen with the big stack clicked
# (both -25 536 by the reading). E6-7 gives each hero a spell above the other's limit, so both
# sides of the limit show. E6-8 uses Wizard's Well (three misc parts) with the first misc position
# free, so "the first position that takes it" and VCMI's clicked position differ, and ends with
# the Well right-clicked in the backpack (D-28, which exit criterion 7 lists). E6-9 and E6-10
# share one hero (Blue's eighth went to E6-5's second hero): the rotation first, then the Thunder.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact. Rows E6-8 to E6-10 read the artifacts first; an artifact the spec does not give goes
# under "anything odd". A stack of 40 000 is loaded from the map's 16-bit count: E6-5 reads the
# counts first, as a loader that sign-extends would show -25 536 before any click.

[map]
name = "E08 batch E6"
description = "Engine-generated experiment map (E08, batch E6): army and hero management: the army dialog, a hero's last stack, the split, a stack of 40 000, the tactics formation, Scholar, a combination, Titan's Thunder, the backpack, a meeting's price. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-6.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1).",
    "A hero's army (creature ids +0x91, counts +0xAD), its worn positions (+0x12D, 8 bytes each), its backpack in order (+0x1D4, the count +0x3D4), its learned spells (+0x3EA), its flags (+0x48: bit 0 tight, bit 1 the tactics formation) and movement points, and the battle manager's tactics phase (+0x13D68) show in the game's memory: the capture harness reads them (clients/capture/batches/E08-batch-6.toml). Played by hand, read the screens instead and leave the memory-only lines empty.",
    "Positions are the original's numbers: head 0, shoulders 1, neck 2, right hand 3, left hand 4, torso 5, rings 6 and 7, feet 8, misc 9 to 12 (the hero screen's misc 1 to 4) and 18 (misc 5), war machines 13 to 16, spell book 17. Army slots count from 0 at the left.",
    "Answer questions as the encounter says; write each question's or message's text (or its first words) down where the encounter asks for it.",
    "Each battle by auto combat; a tactics phase is ended at once (its Start button) before the auto combat.",
    "Order: day 1, Red's turn: E6-1, E6-2, E6-3, E6-4, E6-11; end the turn. Blue's turn (save 2 at its start): E6-6a, E6-6b, E6-7, E6-8, E6-10 (with E6-9 on the same hero), then save 3 and E6-5 last. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


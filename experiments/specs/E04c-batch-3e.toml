specialty = "creature Swordsman"
at = [18, 28]
primary = [0, 0, 1, 1]
army = [["Titan", 6]]
[encounter.opponent.town]
faction = "Castle"
buildings = ["fort", "citadel"]
garrison = [["Peasant", 10]]
[encounter.opponent.hero]
type = "Edric"
specialty = "creature Griffin"
primary = [0, 0, 1, 1]
skills = [["Artillery", 3]]
army = [["Peasant", 10]]
[[encounter.record]]
field = "AT1: did the game wait for Blue's command at the keep's turn; how many shots per turn; the Wait accepted, and when the keep acted after it"
[[encounter.record]]
field = "AT2: every keep's shot: the round and the hit points the Titans lost"
[[encounter.record]]
field = "anything odd"

# --- D-19: the automatic turret's target (BAT-SIE-016) --------------------------------------------

[[encounter]]
id = "AI"
title = "The automatic keep's target: ten Marksmen or one"
questions = ["BAT-SIE-016", "D-19"]
procedure = [
    "Every stack defends; the keep shoots on its own.",
    "Play to round 3, noting the keep's targets, then end the battle as you like.",
]
predictions = """
Both Marksmen stacks can shoot (both class A by the wiki; both can attack next turn by VCMI).
- The engine (the Ballista's rule, VCMI's `tryMakeAutomaticActionOfRangedUnit`): the higher value
  of the expected damage: the ten Marksmen (slot 0) in round 1.
- The wiki (the computer's classes; "The AI considers the Arrow tower damage equal to 1 (bug)",
  so the smaller of two like stacks; ties to the rightmost slot): the single Marksman (slot 1).
- The Catapult (a war machine) is shot by neither.
"""
[encounter.hero]
type = "Tyris"
specialty = "creature Cavalier"
at = [28, 28]
primary = [0, 0, 1, 1]
army = [["Marksman", 10], ["Marksman", 1]]
[encounter.opponent.town]
faction = "Castle"
buildings = ["fort", "citadel"]
garrison = [["Peasant", 10]]
[[encounter.record]]
field = "AI1: the keep's count; every keep's shot: the round, the stack it hit (slot) and the hit points it lost"
[[encounter.record]]
field = "anything odd"

# --- Artillery commands the turrets (BAT-SIE-016, BAT-SIE-018) ------------------------------------

[[encounter]]
id = "AT"
title = "Expert Artillery on the defending hero: the keep commanded"
questions = ["BAT-SIE-016", "BAT-SIE-018"]
procedure = [
    "Every stack defends unless a step below says otherwise.",
    "Round 1: at the keep's turn, Blue shoots the Titans with it (a click on the Titans).",
    "Round 2: at the keep's turn, Blue makes it wait; when it gets its turn again, it shoots the Titans.",
    "Rounds 3 and 4: the keep shoots the Titans at its turn. Then end the battle as you like.",
]
predictions = """
- The keep's turn waits for Blue's command (Artillery: 0x474BF0, the Ballista's case; a human
  player), first in every round.
- One shot per turn although Expert Artillery gives the Ballista two (0x440160 returns after the
  turret's shot): the Titans lose hit points once per keep's turn, 2N..4N each.
- A Wait is accepted (as the Ballista's, BAT-WAR-006): the keep acts again at the wait phase's
  start, before the waiting stacks.
"""
[encounter.hero]

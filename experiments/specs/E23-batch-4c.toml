The Ogre Mages' walker values an attack on Red's lone Peasant above 0; the only stack Bloodlust
helps is the lone Champion (the Archers can shoot now: 0), strength 1800 below a caster's 2016.
- The reading (0x420D20): with a value above 0 to beat only a stack at least as strong as the
  caster is a candidate: **no cast** at any Ogre Mage turn. The port replayed in the engine (no
  obstacles): none in 200 streams.
- Otherwise: the lone Champion blessed (C4f2's outcome).

type = "Clavius"
specialty = "resource gold"
at = [3, 31]
primary = [0, 10, 6, 10]
skills = []
army = [["Swordsman", 30], ["Champion", 10]]
artifacts = { "war machine 3" = "First Aid Tent", "spell book" = "Spell Book" }

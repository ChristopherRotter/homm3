procedure = [
    "Step east into the guards (Diamond Golems: slow, a twentieth of spell damage). Round 1: no Red stack is hurt (the golems are far): the tent's turn has no patient. Rounds 2 to 5, Red's first turn: the hero casts Death Ripple (its book's only spell; power 6: 10 + 5 x 6 = 40 to every living stack, the tent spared): both Red stacks are hurt, the Champions' top creature (100 hit points) 40, the Swordsmen's (35) 5. A first run with Armageddon destroyed the tent with its first cast (80 against 75 hit points).",
    "Note at each tent turn both stacks' top lost hit points and the stack healed (or Defend); after round 8 Red retreats.",
]
predictions = """
TP's row hurt only the Swordsmen (the neutral shooters' target): both rules healed them. Here
Death Ripple (power 6: 40 per living stack) leaves the Champions' top creature 40 down (more with
the golems' blows), the Swordsmen's 40 - 35 = 5.
- The reading (0x473EA0, 0x473F3C): the tent heals **the stack whose top creature lost the
  most** at every turn (the Champions while they lead); **with no patient it defends** (action 3,
  round 1).
- BAT-WAR-003 (the wiki, VCMI): a hurt stack drawn uniformly (the Swordsmen about half the time);
  with no patient nothing.
"""

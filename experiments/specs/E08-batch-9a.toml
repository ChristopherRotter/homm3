size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-9a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and at the start of each later turn (save 2 Blue's day 1, save 3 Red's day 2, save 4 Blue's day 2).",
    "Most records are the game's memory: the mine and Lighthouse records (game +0x4E38C, 0x40 bytes each: owner +0x0, resource +0x1, abandoned +0x2, the guards' creature types +0x4 and counts +0x20, the entrance +0x3C; survey §2.1), a Shipyard's tile word (owner, boat tile), the boats' records (game +0x4E3BC, `docs/exe/structs.toml` \"boat\"), a hero's tile, movement points (+0x4D) and day's maximum (+0x49), the players' treasuries, the explored tiles, a battle's terrain, special field and stacks at its opening and its sides' owners and controllers (`battle_manager`). The capture harness reads them (`clients/capture/batches/E08-batch-9a.toml`, E08 T79). Played by hand, read the screens instead and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left. A walk: click the target once (the path's marks show), then again (the hero goes). A visit: walk to the tile named, then click the object's entrance from there (twice).",
    "Each battle by auto combat; a tactics phase is ended at once (its Start button). A level-up's dialog after a battle: take the left skill.",
    "Order: day 1, Red's turn: E9-4's first reads, E9-1, E9-3, E9-4 (boards), E9-5; Red's treasury; end the turn. Blue's turn: Blue's treasury, E9-2 (Leave Guards), E9-3b; Blue's treasury; end the turn. Day 2, Red's turn: Red's treasury, E9-4's reads, E9-2r's two battles; end the turn. Blue's turn: Blue's treasury. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",

    { field = "before: B's record (owner, resource, guards' creature and count by slot)" },
    { field = "A: the question's text" },
    { table = ["slot", "creature", "count"], rows = 7 },
    { field = "A: the battle's result; the messages after it" },
    { field = "after: A's record (owner, resource, guards)" },
    { field = "B: the question's text" },
    { table = ["slot", "creature", "count"], rows = 7 },
    { field = "B: the battle's result; the messages after it" },
    { field = "after: B's record (owner, resource, guards)" },
    { field = "anything odd" },
]
predictions = """
- **The code** (survey §3.2, §3.4; D-47): each mine's guards are one stack of Troglodytes, its
  count c drawn at the new game from 100 to 200 (the records' slot 0; D-48: VCMI 100 to 199). A
  neutral mine with one stack fights the wandering monster's battle (`monster_battle`): the split
  of ADV-MON-009, its draws from the C runtime seeded by the tile (ADV-QUIRK-6). Six Archangels
  (52 656) against at most 200 Troglodytes (11 800) give a ratio of at least 4.4: two stacks
  before the draws (five Archangels after a loss still give 3.7). Seeded by the **entrance**:
  **A (8, 8)** draws 100 then 87: **three stacks** of Troglodytes, c divided evenly (the first
  c mod 3 one more), none upgraded; **B (14, 8)** draws 41 then 44: **two stacks**, the first
  ⌈c/2⌉ Troglodytes, the second ⌊c/2⌋ **Infernal Troglodytes** (the middle stack n / 2 = 1
  upgraded at a second draw of at most 50). The question is ADVEVENT 84 ("You come upon an
  abandoned mine. … infested with Troglodytes. Do you wish to enter?"). A win: ADVEVENT 85 ("You
  beat the Troglodytes …"), then the drawn resource's mine message (MINEEVNT; A crystal or gems,
  B gold); the record's owner Red, its guards empty.
- **Seeded by the hero's tile before the step** instead (another reading of the position): A from
  (7, 9) draws 24 then 68, two stacks none upgraded; B from (13, 9) 33 then 57, two stacks none
  upgraded.
- **VCMI** (`CGMine`, `startBattle`): **one stack** of c Troglodytes each, never split.
"""

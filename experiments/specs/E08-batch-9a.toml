# Experiment batch E9a (E08 T78; decisions 193, 198, 201, 202): rows E9-1 to E9-5 of increment 9's
# plan (survey docs/rules/surveys/E08-economy.md §15; docs/epics/E08-design.md §17), the visits of
# mines, Lighthouses and Shipyards, in SoD on Easy, hot seat, two days. Batch E9b
# (`E08-batch-9b`) is the day's start. Build: docs/experiments/README.md. Predictions are for the
# agent who evaluates the results; the template never shows them.
#
# | row  | settles                                     | the reading (faithful)                      | the other source(s)                    |
# | E9-1 | D-47: a neutral abandoned mine's guards      | split as a monster's (ADV-MON-009), seeded  | VCMI: one stack, never split           |
# |      |                                             | by the entrance: 3 stacks; 2, the second    |                                        |
# |      |                                             | Infernal Troglodytes                        |                                        |
# | E9-2 | §3.2, §3.3: an owned mine's guards           | the owned mine's question; one stack as     | consensus (the subterranean field: the |
# |      |                                             | left; the cavern on the subterranean field, | wiki and VCMI); who plays the guards:  |
# |      |                                             | the sawmill on grass                        | recorded (design §13, §17)             |
# | E9-3 | §2.3, §2.4, §3.1: flagging and Leave Guards  | Red's; the dialog; Blue's without a         | consensus                              |
# |      |                                             | question (no guards); +2 wood to Blue       |                                        |
# | E9-4 | §4: Lighthouses; A-33                       | sea points 2 500; their tiles not explored  | VCMI and the engine: radius 3 explored |
# |      |                                             | at day 1                                    | at the start                           |
# | E9-5 | §5.2, §5.3: a Shipyard's offer, its refusal, | 1 000 gold, 10 wood, a type-1 boat on       | consensus (VCMI and the wiki: the use  |
# |      | its use without a visit                     | (31, 50); refused with a hero on it; the    | without a visit)                       |
# |      |                                             | click opens the offer                       |                                        |
#
# **The pictures** (`Objects.txt`; docs/experiments/README.md, "Increment 9's objects"): a mine
# blocks its row from two columns west of `at` to `at` and is entered at the middle tile from the
# row below (from a tile beside it or below it; never from above, the original's per-class
# settings); the grass sawmill blocks three columns west of `at` and its top row's two east tiles
# too. The Lighthouse is the tile `at`. The Shipyard is three tiles on `at`'s row, entered at the
# middle one from the row below; its boat tile is the first clear water tile of twelve offsets
# from its entrance, (−2, 0) first (survey §5.1): here (31, 50), the lake's east edge.
#
# **The points.** A day's land points from the slowest speed (packs/base/adventure.toml
# `land_points`): Angels and Archangels 2 000. Sea points 1 500 without
# Navigation, +500 for each Lighthouse the hero's owner holds (survey §4). A step costs 100 on
# grass, 141 diagonally; every route below is within the day's points with a margin (each leg
# priced by a throwaway search over the written map; a target is within the explored tiles at its
# click, the scouting radius being 5).
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or a resource. The template asks for gold; anything the spec does not give goes under
# "anything odd". The treasuries are compared within a player's turns, so the bonus cancels out.

[map]
name = "E08 batch E9a"

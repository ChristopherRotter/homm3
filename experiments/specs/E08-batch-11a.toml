# Experiment batch E11a (E08 T99b1, T99b2a; decisions 261, 269, 274 to 277): the jumps of increment
# 11's plan (survey docs/rules/surveys/E08-teleporters.md §12; docs/epics/E08-design.md §16) through
# monoliths, Subterranean Gates and Whirlpools, in SoD on Easy, hot seat, two days. T99b1 wrote the
# land and underground rows, T99b2a the Whirlpool rows E11-10 to E11-13 (decision 276: the cut by
# land and water; 277: T99b2 by spec). Batch E11b (`E08-batch-11b`) is the repetitions with the
# space key. Build: docs/experiments/README.md. Predictions are for the agent who evaluates the
# results; the template never shows them.
#
# | row    | settles                                   | the reading (faithful)                       | the other source(s)                     |
# | E11-1  | §9.1, D-58: a path past a teleporter       | no path to B (none through A, the way round | VCMI plans through A (A, then B)        |
# |        |                                           | dark); the path to A ends on A              |                                         |
# | E11-2  | §5, §6: the arrival                       | on B; 100 paid, no more; B's radius 5        | VCMI the same (points kept)             |
# |        |                                           | explored; the walk ended                    |                                         |
# | E11-3  | §4.5, §5: a guard beside the exit          | no battle on arrival; a step in its zone     | VCMI the same (IGNORE_GUARDS)           |
# |        |                                           | after it is fought (the control)            |                                         |
# | E11-5  | §4.2: a one-way exit visited               | ADVEVENT 70; the hero stays                  | VCMI the same                           |
# | E11-4  | §4.2: the only exit holds Red's hero       | stays on the entrance, nothing shown         | VCMI the same exit test                 |
# | E11-6  | §4.3: a gate's exit holds Red's hero       | the meeting; the mover stays                 | the wiki and VCMI the same              |
# | E11-7  | §4.3: a gate's exit holds Blue's hero      | the 3 × 3 revealed, the battle on the        | VCMI a blocking visit (the battle)      |
# |        |                                           | underground's battlefield, then Red on it   |                                         |
# | E11-9  | §3.2, D-56: the gates' tie                 | G to Uf (the first of a truncated tie)       | VCMI G to Un (the nearer by squares)    |
# | E11-8  | §4.3: a gate with no pair                  | ADVEVENT 153; the hero stays                 | VCMI and the wiki the same message      |
# | E11-10 | §4.4, D-54, D-55: the weakest stack        | Pegasi 3 → 1 (fight value × count)           | VCMI the Dendroids 3 → 2 (AI value)     |
# | E11-11 | §4.4, D-54: a tie                          | slot 1's Pikemen 5 → 2 (the first)           | VCMI slot 2 → 3 (the last)              |
# | E11-12 | §4.4, D-55, A-38: lone stacks              | 1 kept with the message; 1 775 → 887;        | VCMI: 1 kept, no message; 888; 888      |
# |        |                                           | 1 776 all kept (the bound), the message     |                                         |
# | E11-13 | §4.4: the Hats                             | nothing lost, no message (both Hats)         | VCMI the same                           |
# | E11-18 | §10, A-41: Replay Opponent Turn            | the view to the exit (the wiki); nothing     | not read past the record                |
# |        |                                           | explored; Blue's boardings in the shroud    |                                         |
# |        |                                           | not shown (the agent's call; a control)     |                                         |
# | E11-19 | design §7, §13: the entrance's guards      | no battle at the jump; none at the revisit   | unread (the agent's call)               |
#
# **Design §16's additions:** E11-6 and E11-7 record the tiles explored within 1 of the pair before
# the meeting or the battle (E11-6's a sanity check: its hero on the exit explored them), and E11-7
# the battlefield (the exit's). **This spec's additions:** the points and the day's maximum after
# every jump (E11-2's, E11-6b's, E11-9's); E11-3's and E11-19's controls (a step onto a plain tile
# in the guard's zone after the readings, fought: the monster does guard); E11-8 played at E11-9's
# leftover gate (whichever gate G was not paired with, by either rule), as T99a's record suggested;
# E11-18's replay also shows E11-7b's gate jump of the same Blue turn into Red's shroud.
#
# **The guards** stand on their monolith's row or the row below: a tile whose object is not entered
# from above leaves the row above out of its guard scan (ADV-MON-005; the original's 0x41A460, VCMI's
# `checkForVisitableDir`), so a monster above a monolith would not guard it. P (13, 11) guards B, M
# (9, 51) A19, N (31, 50) B19. B guarded, E11-1 reads the path to B itself: a guarded tile still ends
# a path, so B is a destination by both rules (a tile past B would end at B by both).
#
# **The heroes.** Red has eight, the original's most on the map, and so has Blue: E11-7b and E11-18
# on land, the six Whirlpool heroes E11-10 to E11-13 on the strait's shores; E11-18's hero also
# plays E11-13's Admiral's Hat on day 2 (T99b2a's call: every Whirlpool army Blue's, below). Nobody
# has Scouting, Pathfinding, Logistics or Navigation; no artifact but E11-13's Sea Captain's Hat and
# E11-18's Admiral's Hat. Every Red army's slowest creature is an Angel or an Archangel, so every
# Red hero has 2 000 land points a day (packs/base/adventure.toml `land_points`, by the slowest
# speed from 0), Blue's Pikemen 1 560, Dendroid Guards (speed 3) 1 500, Azure Dragons 2 000; at sea
# 1 500 (`sea_points`, no Navigation), with the Sea Captain's Hat 2 000, with the Admiral's Hat
# 3 000. A step costs 100 on grass, dirt and water, 141 diagonally. A hero's scouting radius is 5
# (ADV-FOG-002: dx² + dy² ≤ 30), a radius 1 the 3 × 3 square.
#
# **The Whirlpools** (T99b2a). The strait, water from (46, 62) to (71, 65), and the sea south-east
# of it, (56, 66) to (71, 71), lie in Red's shroud. W1 covers (50, 63) to (52, 64), W2 (59, 68) to
# (61, 69), W3 (65, 68) to (67, 69). No hero starts in a boat (the map gives a hero on water none),
# and a boarding without the Admiral's Hat leaves 0 points (ADV-SEA-002; batch E8a), so the six
# Whirlpool heroes board on Blue's day 1, from the shore, the empty boats beside W1: three on row
# 62 north of W1's top row, three on row 65 south of its bottom row, each hero on the shore beyond
# its boat; on Blue's day 2 each sails one straight step onto the W1 tile beside its boat. E11-18's
# hero, on X18 since day 1, walks onto the boat at (66, 62) on day 2 (the Admiral's Hat's free
# boarding keeps its points) and sails to W1's east side. **Why so:** a jump never lands on the
# Whirlpool it left (the entrance's word excluded, survey §4.1), so W1, every hero's entrance, is
# no exit and no landing blocks a later entry; every jumper is Blue's, so no jump draws an enemy's
# tile (A-37 is batch E11b's E11-16) and Blue's own landed heroes are skipped (twelve tiles of W2
# and W3 for seven jumps); Red is full and Blue had six free slots for seven armies, hence E11-18's
# second part (no third human player: the spec gives Tan to the computer).
#
# **The pictures** (docs/experiments/README.md, "Increment 11's objects"): a monolith of channels 0
# to 3 is the one tile `at`, entered there from any side but the three tiles above it; a gate
# covers three tiles ending on `at` and the middle one above them and is entered at the tile west of
# `at` (its entrance, the middle one), from the row below it. The surface is grass, the underground
# dirt (the underground's battles are subterranean, GAM-BAT-001; the dirt tells the tile's own).
#
# **The channels.** Two-way 0 (green): A (9, 10) and B (12, 10). Two-way 1 (orange): A19 (10, 50)
# and B19 (30, 50). One-way 0 (blue): the entrance E4 (32, 10), its one exit X4 (40, 10). One-way 1
# (red): M18 (48, 33), its one exit X18 (66, 60). Every channel has one exit for each entrance, so
# no jump draws (`random_between` returns an equal bound without a draw, survey §4.1). **The gates**
# (entrances; the original pairs them in the walk's order: level, row, column): on the surface G6
# (51, 10), G9 (20, 30), G7 (44, 30); underground U6 (51, 10), Uf (17, 27), Un (16, 30), U7
# (44, 30). G6 pairs with U6 and G7 with U7 at distance 0; G9 is 4 from Uf (squared 18) and from Un
# (squared 16) when truncated: the original pairs G9 with Uf (the first in the walk), VCMI with Un,
# and the other is left without a pair. The compiler checks both pairings (`pair`, `vcmi_pair`).
#
# **The fog.** The zones lie apart so that each read's tiles are unexplored by Red until the row's
# own move: B's east side (E11-2), U7's surroundings underground (E11-7) and X18's (E11-18) lie
# beyond every Red hero's radius at the start and after every Red move of day 1. The strait and the
# sea stay in Red's shroud through Red's day 2 (no Red hero comes within 5 of them), so Blue's six
# boardings of day 1, which Red's Replay Opponent Turn plays back on day 2, lie wholly in Red's
# shroud: E11-18's control.
#
# **The walks** (priced on the written map by a throwaway test, TRAPS.md; the teleporters import as
# blockers until T103, so a step onto an entrance and a walk from an exit were priced by hand):
# every Red move but E11-9's is one step (100 or 141); E11-9's day is 100 (onto G9), the jump, then
# 623 to the other underground gate (five steps, either way); E11-19's is 100, the jump, the
# revisit (0), then 100 (the control). Each target is within the hero's explored tiles at its
# click; the fog's claims (each row's tiles unexplored by Red until its move) were checked on the
# written map. T99b2a's: every boarding one straight step (100); every step onto W1 one straight
# step at sea (100); E11-18's day 2 as its row says, in two legs (the second leg's tiles unexplored
# by Blue until the first's). The Whirlpools import as blockers until T103, so each step onto W1 was
# priced by hand.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or a resource; an artifact on a moving hero goes under "anything odd" (boots would move
# the points).

[map]
name = "E08 batch E11a"
description = "Engine-generated experiment map (E08, batch E11a): monoliths and Subterranean Gates: a path past a teleporter, the arrival, a guard beside an exit, a one-way exit, an exit held by one's own hero, a gate's meeting and battle, the gates' pairing tie, a gate without a pair, the replay of an enemy's jump, the guards at a jump and a revisit; Whirlpools: the weakest stack, a tie, lone stacks and the bound, the Hats. Hot seat, Red and Blue human; difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-11a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and at the start of each later turn (save 2 Blue's day 1, save 3 Red's day 2, save 4 Blue's day 2).",
    "Most records are the game's memory: a hero's tile (column, row, level), its movement points (hero +0x4D), the day's maximum (+0x49) and army (slot, creature, count), whether it is in a boat (its status +0x105, bit 18, 0x40000), a tile's explored bit for Red, the hero's path after a first click (its tiles, or none), the messages and dialogs shown (by their text's table and line), the meeting dialog, a battle's opening (terrain, sides, stacks), the adventure map's view during Replay Opponent Turn. The capture harness reads them (`clients/capture/batches/E08-batch-11a.toml`, E08 T100). Played by hand, read the screens instead (the level button under the minimap shows the underground; a tile is explored when it is not black) and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left; underground tiles say so. A walk: click the target once (the path's marks show), then again (the hero goes). A step onto a monolith or a gate: click its tile from the neighbouring tile named (twice). A boat: click it from the shore beside it (twice): the hero boards it and its walk ends there. A Whirlpool: from a boat beside it, click the Whirlpool's tile named (twice). **Space:** with the hero selected, press the space bar once.",
    "Each battle against a monster by auto combat. E11-7's battle is between two human players, so auto combat is refused: play it, Red's stacks attacking, Blue's stack only waiting or defending (never a retreat or a surrender). A level-up's dialog after a battle (none is expected): take the left skill.",
    "Order: day 1, Red's turn: E11-1 (rows E11-1 to E11-3), E11-4 (rows E11-5, then E11-4), E11-6, E11-9 (rows E11-9, then E11-8), E11-19; E11-7's and E11-18's first reads; end the turn. Blue's turn: E11-7's Blue step, then E11-18's; then the boardings of E11-10, E11-11, E11-12, E11-12b, E11-12c and E11-13, in that order; end the turn. Day 2, Red's turn: E11-18's replay and reads first, then E11-7's step and battle; end the turn. Blue's turn: E11-10, E11-11, E11-12 (E11-12, E11-12b, E11-12c), E11-13 (E11-13, then E11-18's hero); end the turn. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


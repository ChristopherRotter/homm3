# Experiment batch E11a (E08 T99b1; decisions 261, 269, 274, 275, 276): the land and underground rows
# of increment 11's plan (survey docs/rules/surveys/E08-teleporters.md §12; docs/epics/E08-design.md
# §16), the jumps through monoliths and Subterranean Gates, in SoD on Easy, hot seat, two days.
# Batch E11b (`E08-batch-11b`) is the repetitions with the space key. The Whirlpool rows E11-10 to
# E11-13 join this spec in T99b2 (decision 276: the cut by land and water). Build:
# docs/experiments/README.md. Predictions are for the agent who evaluates the results; the template
# never shows them.
#
# | row    | settles                                   | the reading (faithful)                       | the other source(s)                     |
# | E11-1  | §9.1, D-58: a path past a teleporter       | no path to B's side (none through A, the    | VCMI plans through A (A, B, the tile)   |
# |        |                                           | rest unexplored); the path to A ends on A   |                                         |
# | E11-2  | §5, §6: the arrival                       | on B; 100 paid, no more; B's radius 5        | VCMI the same (points kept)             |
# |        |                                           | explored; the walk ended                    |                                         |
# | E11-3  | §4.5, §5: a guard beside the exit          | no battle on arrival; a step in its zone     | VCMI the same (IGNORE_GUARDS)           |
# |        |                                           | after it is fought (the control)            |                                         |
# | E11-5  | §4.2: a one-way exit visited               | ADVEVENT 70; the hero stays                  | VCMI the same                           |
# | E11-4  | §4.2: the only exit holds Red's hero       | stays on the entrance, nothing shown         | VCMI the same exit test                 |
# | E11-6  | §4.3: a gate's exit holds Red's hero       | the meeting; the mover stays                 | the wiki and VCMI the same              |
# | E11-7  | §4.3: a gate's exit holds Blue's hero      | the 3 × 3 revealed, the battle on the        | VCMI a blocking visit (the battle)      |
# |        |                                           | underground's battlefield, then Red on it   |                                         |
# | E11-9  | §3.2, D-56: the gates' tie                 | G to Uf (the first of a truncated tie)       | VCMI G to Un (the nearer by squares)    |
# | E11-8  | §4.3: a gate with no pair                  | ADVEVENT 153; the hero stays                 | VCMI and the wiki the same message      |
# | E11-18 | §10, A-41: Replay Opponent Turn            | the view to the exit (the wiki); nothing     | not read past the record                |
# |        |                                           | explored                                    |                                         |
# | E11-19 | design §7, §13: the entrance's guards      | no battle at the jump; none at the revisit   | unread (the agent's call)               |
#
# **Design §16's additions:** E11-6 and E11-7 record the tiles explored within 1 of the pair before
# the meeting or the battle, and E11-7 the battlefield (the exit's). **This spec's additions:**
# E11-2's points of a second jump (E11-6b's); E11-3's and E11-19's controls (a step in the guard's
# zone after the readings, fought: the monster does guard); E11-8 played at E11-9's leftover gate
# (whichever gate G was not paired with, by either rule), as T99a's record suggested; E11-18's
# replay also shows E11-7b's gate jump of the same Blue turn into Red's shroud.
#
# **The heroes.** Red has eight, the original's most on the map; Blue two. Nobody has Scouting,
# Pathfinding or Logistics or an artifact; every Red army's slowest creature is an Angel or an
# Archangel, so every Red hero has 2 000 land points a day (packs/base/adventure.toml
# `land_points`), Blue's Pikemen 1 560. A step costs 100 on grass and dirt, 141 diagonally. A
# hero's scouting radius is 5 (ADV-FOG-002: dx² + dy² ≤ 30), a radius 1 the 3 × 3 square.
#
# **The pictures** (docs/experiments/README.md, "Increment 11's objects"): a monolith of channels 0
# to 3 is the one tile `at`, entered there from any side but the three tiles above it; a gate
# covers three tiles ending on `at` and the middle one above them and is entered at the tile west of
# `at` (its entrance, the middle one), from the row below it. The surface is grass, the underground
# dirt (the underground's battles are subterranean, GAM-BAT-001; the dirt tells the tile's own).
#
# **The channels.** Two-way 0 (green): A (9, 10) and B (12, 10). Two-way 1 (orange): A19 (10, 50)
# and B19 (30, 50). One-way 0 (blue): the entrance E4 (32, 10), its one exit X4 (40, 10). One-way 1
# (red): M18 (48, 33), its one exit X18 (66, 60). Every channel has one exit for each entrance, so
# no jump draws (`random_between` returns an equal bound without a draw, survey §4.1). **The gates**
# (entrances; the original pairs them in the walk's order: level, row, column): on the surface G6
# (51, 10), G9 (20, 30), G7 (44, 30); underground U6 (51, 10), Uf (17, 27), Un (16, 30), U7
# (44, 30). G6 pairs with U6 and G7 with U7 at distance 0; G9 is 4 from Uf (squared 18) and from Un
# (squared 16) when truncated: the original pairs G9 with Uf (the first in the walk), VCMI with Un,
# and the other is left without a pair. The compiler checks both pairings (`pair`, `vcmi_pair`).
#
# **The fog.** The zones lie apart so that each read's tiles are unexplored by Red until the row's
# own move: B's east side (E11-2), U7's surroundings underground (E11-7) and X18's (E11-18) lie
# beyond every Red hero's radius at the start and after every Red move of day 1.
#
# **The walks** (priced on the written map by a throwaway test, TRAPS.md; the teleporters import as
# blockers until T103, so a step onto an entrance and a walk from an exit were priced by hand):
# every Red move but E11-9's is one step (100 or 141); E11-9's day is 100 (onto G9), the jump, then
# 623 to the other underground gate (five steps, either way); E11-19's is 100, the jump, the
# revisit (0), then 100 (the control). Each target is within the hero's explored tiles at its
# click; the fog's claims (each row's tiles unexplored by Red until its move) were checked on the
# written map.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or a resource; an artifact on a moving hero goes under "anything odd" (boots would move
# the points).

[map]
name = "E08 batch E11a"
description = "Engine-generated experiment map (E08, batch E11a): monoliths and Subterranean Gates: a path past a teleporter, the arrival, a guard beside an exit, a one-way exit, an exit held by one's own hero, a gate's meeting and battle, the gates' pairing tie, a gate without a pair, the replay of an enemy's jump, the guards at a jump and a revisit. Hot seat, Red and Blue human; difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-11a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and at the start of each later turn (save 2 Blue's day 1, save 3 Red's day 2).",
    "Most records are the game's memory: a hero's tile (column, row, level), its movement points (hero +0x4D) and army, a tile's explored bit for Red, the hero's path after a first click (its tiles, or none), the messages and dialogs shown (by their text's table and line), the meeting dialog, a battle's opening (terrain, sides, stacks), the adventure map's view during Replay Opponent Turn. The capture harness reads them (`clients/capture/batches/E08-batch-11a.toml`, E08 T100). Played by hand, read the screens instead (the level button under the minimap shows the underground; a tile is explored when it is not black) and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left; underground tiles say so. A walk: click the target once (the path's marks show), then again (the hero goes). A step onto a monolith or a gate: click its tile from the neighbouring tile named (twice). **Space:** with the hero selected, press the space bar once.",
    "Each battle against a monster by auto combat. E11-7's battle is between two human players, so auto combat is refused: play it, Red's stacks attacking, Blue's defending. A level-up's dialog after a battle (none is expected): take the left skill.",
    "Order: day 1, Red's turn: E11-1 (rows E11-1 to E11-3), E11-4 (rows E11-5, then E11-4), E11-6, E11-9 (rows E11-9, then E11-8), E11-19; E11-7's and E11-18's first reads; end the turn. Blue's turn: E11-7's Blue step, then E11-18's; end the turn. Day 2, Red's turn: E11-18's replay and reads first, then E11-7's step and battle; end the turn. Blue's turn: end the turn. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


# --- E11-1 to E11-3 ------------------------------------------------------------------------------------

[[encounter]]
id = "E11-1"
title = "A path past a two-way monolith (E11-1), the step onto it (E11-2), a monster beside its exit (E11-3)"
questions = ["D-58", "ADV-OBJ-003", "ADV-TEL-004", "ADV-TEL-007", "ADV-MOV-008"]
procedure = [
    "Day 1, Red's turn, first: E11-1 stands at (8, 10) with ten Archangels. East of it the two-way monolith A (9, 10), green; a rock wall fills columns 10 and 11 from row 1 to row 19; east of the wall the green monolith B (12, 10) and a Peasant P at (13, 9). Read E11-1's points and the explored bits of the tiles (12, 11), (16, 13), (16, 14), (17, 10) and (18, 10).",
    "Click (12, 11) once (south of B): note the path shown (its tiles, or that none shows). Do not click again.",
    "Click A (9, 10) once: note the path shown. Click it again: E11-1 steps onto A. Note any message or battle, then E11-1's tile and points, and the explored bits of the five tiles above.",
    "If E11-1 stands on B (12, 10): click (13, 10) (east of B, beside P) twice. Note the battle (auto combat) or that none came, and E11-1's tile after.",
]
record = [
    { field = "E11-1 before: points; explored (12, 11), (16, 13), (16, 14), (17, 10), (18, 10)" },
    { field = "E11-1: the path to (12, 11) (its tiles, or none)" },
    { field = "E11-1: the path to A (its tiles)" },
    { field = "E11-2: after the step onto A: messages; battles; E11-1's tile and points" },
    { field = "E11-2: explored after: (12, 11), (16, 13), (16, 14), (17, 10), (18, 10)" },
    { field = "E11-3: the battle on arrival, if any (the defender, the result)" },
    { field = "E11-3's control: the step to (13, 10): the battle or none; E11-1's tile after" },
    { field = "anything odd" },
]
predictions = """
- **E11-1, the path** (survey §9.1, D-58; ADV-MOV-008): the human's mouse path (mode 0) stops at a
  teleporter's entrance and never goes on through its exit, and it steps only onto explored tiles.
  (12, 11) is explored (from (8, 10): 16 + 1 ≤ 30) but cut off: the wall covers every explored row
  between, and the way round lies in the dark. So **no path to (12, 11)** (no marks; "around or
  none": none). **VCMI 1.7.5** plans a human's path through two-way monoliths (`useMonolithTwoWay`):
  A, then B, then (12, 11), its client naming B as the exit. **The path to A:** the one tile A,
  ending on A.
- **E11-2, the arrival** (§5, §6): the step onto A costs **100** (straight, grass), paid as any step;
  the visit is the jump (two-way channel 0 has one other member: B, no draw); **no message**;
  E11-1 stands on **B (12, 10)** with **1 900** points (2 000 − 100; the jump costs none, the day's
  maximum kept); the walk ended there (the path was to A; nothing goes on past the exit). The
  reveal: the step's own around A, then B's with the scouting radius 5: **(16, 13) and (17, 10)
  explored** (from B 16 + 9 = 25 and 25), **(16, 14) and (18, 10) not** (32, 36); before the
  step none of the four was (from (8, 10) 73, 81, 80, 100; from A at most 58). (12, 11) explored
  throughout. VCMI: `TELEPORTATION` keeps the points too.
- **E11-3** (§4.5, §5): P at (13, 9) guards B (its neighbour), but `hero_relocate` runs **no guard
  test**: **no battle** on arrival. **The control:** a step from B to (13, 10), in P's zone, ends
  with the guard's test (`after_step_guard_check`): **a battle** at once (P savage, never flees),
  won by auto combat; E11-1 on (13, 10) after it (the step's 100 paid). VCMI: `IGNORE_GUARDS` on
  the arrival, the same.
"""
[encounter.hero]
type = "Edric"
specialty = "creature Griffin"
at = [8, 10]
primary = [10, 10, 1, 1]
army = [["Archangel", 10]]


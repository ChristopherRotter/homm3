# Experiment batch E10a (E08 T89b; decisions 237, 242, 244): rows E10-1 and E10-3 to E10-7 of
# increment 10's plan (survey docs/rules/surveys/E08-dwellings.md §13; docs/epics/E08-design.md
# §16), the visits of dwellings, random dwellings and the hire dialog, in SoD on Easy, hot seat, two
# days. Batch E10b (`E08-batch-10b`) is the week. E10-2 is dropped (decision 238). Build:
# docs/experiments/README.md. Predictions are for the agent who evaluates the results; the template
# never shows them.
#
# | row   | settles                                        | the reading (faithful)                     | the other source(s)                    |
# | E10-1 | §2.2, §4.2, §4.3: a neutral dwelling's guards,  | 3 Green Dragons; 9 Gold + 6 Diamond Golems; | consensus on the guards and counts;    |
# |       | the question, the battle, the flag              | 12 Earth Elementals; unowned, unsplit; the  | VCMI's size word from the first stack  |
# |       |                                                 | size word of the total; flagged; counts =   | ("several" Gold Golems)                |
# |       |                                                 | growth                                      |                                        |
# | E10-3 | §4.4, D-52: the free level-1 creatures          | +14 Pikemen, then "no Pikemen"; a full      | VCMI merges the two Archers, then the  |
# |       |                                                 | army: refused, the count kept               | Pikemen join                           |
# | E10-4 | §5.2, §5.3: the most, the purchase              | the most 3; 900 paid, the count 1; the      | consensus                              |
# |       |                                                 | dialog closed after it                      |                                        |
# | E10-5 | §5.1, §5.2: the other resource bounds the most  | 0 without crystal, 1 with one; 2 400 and    | consensus                              |
# |       |                                                 | 1 crystal paid; no guards for the owner     |                                        |
# | E10-6 | §4.1, §4.4: an ally's dwellings                 | no guards' question, no flag; the dialog    | the wiki the same; VCMI shows nothing  |
# |       |                                                 | with its buttons disabled                   |                                        |
# |       |                                                 | disabled                                    |                                        |
# | E10-7 | §3.2: random dwellings                          | the Angel Portal one tile right; the Golem  | VCMI the same kinds (its templates not |
# |       |                                                 | Factory whole; the Dwarf Cottage's entrance | compared tile by tile)                 |
# |       |                                                 | one left of the anchor                      |                                        |
#
# **Design §16's two additions:** E10-4 records whether the Barracks' dialog closes after its
# purchase (a single creature's closes, survey §5.3); E10-1 records each question's size word
# against the guards' total and their first stack (the Golem Factory's 15 against its first 9 tells
# them apart).
#
# **The teams** (E10-6): Red and Blue are one team, so the hot-seat map holds no enemy of either
# unless a third player plays: Tan, a computer player, has one hero walled in by rock at (66, 66)
# (a team of its own; whether the original ends a game whose every player is on one team at once
# was not read, Tan keeps the question away). Red and Blue see what the other explored (the reveal
# is the team's, survey §4.5). If the scenario's information shows no alliance, E10-6 is scored
# from the reading and says so (design §16).
#
# **The treasuries** are set by Red's timed events (the original fires them after the day's
# income and the starting bonus, in the list's order, each resource floored at 0: batch E9-11):
# day 1 leaves Red **1 000 gold and no crystal**, day 2 **10 000 gold** (still no crystal). Nothing
# else on these two days pays Red: the hire questions of E10-1 are answered no, E10-3's Pikemen are
# free, E10-6's dialogs buy nothing (its Recruit is never clicked while enabled).
#
# **The pictures** (`Objects.txt`; docs/experiments/README.md, "Increment 10's objects"): the Dragon
# Cliffs, the Golem Factory and the Barracks block `at` and the tile west of it and are entered at
# `at`; the Guardhouse also blocks the tile north-west of `at`; the Elemental Conflux blocks two rows
# of three ending on `at` and is entered at the tile west of `at`. A random dwelling blocks the 2 × 2
# ending on `at` until the game draws what it becomes. An object is entered from a tile beside it or
# below it, never from above: every visit below steps up from the tile under the entrance.
#
# **The points.** A day's land points from the slowest speed (packs/base/adventure.toml
# `land_points`): Angels and Archangels 2 000. A step costs 100 on grass, 141 diagonally; every route
# below is within the day's points with a margin (each leg priced by a throwaway search over the
# written map; a target is within the explored tiles at its click, the scouting radius being 5).
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or a resource. Red's events take it back (gold and crystal); anything else the spec does
# not give goes under "anything odd".

[map]
name = "E08 batch E10a"
description = "Engine-generated experiment map (E08, batch E10a): dwellings: a neutral dwelling's guards and flag, free level-1 creatures, the hire dialog's most and purchase, an ally's dwelling, random dwellings. Hot seat, Red and Blue human and allied, Tan a computer; difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
teams = [["red", "blue"]]
instructions = [
    "Copy `E08-batch-10a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**; Tan is the computer's (the map lets no human play it). Red and Blue are allied: note what the scenario's information shows of the teams. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and at the start of each later turn (save 2 Blue's day 1, save 3 Red's day 2, save 4 Blue's day 2).",
    "Most records are the game's memory: the dwelling records (game +0x4E39C, 0x5C bytes each: class +0x0, subclass +0x1, four creature types +0x4 and counts +0x14, the guards' seven types +0x1C and counts +0x38, the entrance +0x54, the owner +0x57; survey §2.1), the map's objects (class, subclass, anchor) and the tiles' blocked and visitable bits, the hire dialog (the most +0xAC, the amount +0xB8, the ally's flag +0x4C, whether its Max, Recruit and slider buttons are enabled, whether it is open), the players' teams (game +0x1F879) and treasuries, a hero's army and tile, a battle's terrain, special field, stacks at its opening and its sides' owners and controllers (`battle_manager`). The capture harness reads them (`clients/capture/batches/E08-batch-10a.toml`, E08 T90). Played by hand, read the screens instead and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left. A walk: click the target once (the path's marks show), then again (the hero goes). A visit: walk to the tile named, then click the object's entrance from there (twice).",
    "Each battle by auto combat; a tactics phase is ended at once (its Start button). A level-up's dialog after a battle: take the left skill.",
    "The hire dialog: **Max** sets the most, **Recruit** buys the amount set, **Close** (the dialog's exit) ends it. The most (+0xAC) is memory-only; by hand note the dialog's Available and the amount Max sets.",
    "A dwelling's record is found in the vector by its entrance (+0x54), not by the tile's word, so a hero standing on the entrance after a visit hides nothing of it (a hero on a tile hides only the tile's word: its +0x14 holds it).",
    "Order: day 1, Red's turn: Red's treasury (after the events' messages, E10-6's first line); E10-7's reads; E10-1; E10-3; E10-6; E10-4; Red's treasury (E10-4's last line); end the turn. Blue's turn: E10-6's Blue reads; end the turn. Tan plays its turn. Day 2, Red's turn: Red's treasury (after the messages); E10-5; Red's treasury; end the turn. Blue's turn: end the turn. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


[[encounter]]
id = "E10-1"
title = "A hero visits three neutral dwellings of guarded creatures"
questions = ["ADV-DWL-002", "ADV-DWL-004", "ADV-OWN-001", "GAM-BAT-001"]
procedure = [
    "Day 1, Red's turn: E10-1 stands at (9, 12) with ten Archangels. Three neutral dwellings stand north of it: the Dragon Cliffs D (entrance (8, 10); it covers (7, 10) and (8, 10)), the Golem Factory F (entrance (13, 10); (12, 10) and (13, 10)) and the Elemental Conflux X (entrance (18, 10); it covers (17, 9) to (19, 10)). Before any move read the three records (owner, creatures and counts, guards).",
    "Walk to (8, 11), then click D's entrance (8, 10). Note the question; answer yes. At the battle's opening note the terrain, the special field, the defending stacks (creature and count, by slot) and the defending side's owner. Auto combat. Note the messages after the battle and the next question; answer **no**. Read D's record.",
    "Walk to (13, 11), then click F's entrance (13, 10). As for D: the question (yes), the opening, the messages, the next question (no), F's record.",
    "Walk to (18, 11), then click X's entrance (18, 10). As for D: the question (yes), the opening, the messages, the next question (no), X's record. E10-1 ends the day on X's entrance.",
]
record = [
    { table = ["dwelling", "owner", "creatures and counts", "guards (creature and count by slot)"], labels = ["D before", "F before", "X before"] },
    { field = "D: the question's text" },
    { field = "D: terrain, special field; the defending side's owner" },
    { table = ["slot", "creature", "count"], rows = 7 },
    { field = "D: the result; the messages; the next question's text" },
    { field = "D after: owner, counts, guards" },
    { field = "F: the question's text" },
    { field = "F: terrain, special field; the defending side's owner" },
    { table = ["slot", "creature", "count"], rows = 7 },
    { field = "F: the result; the messages; the next question's text" },
    { field = "F after: owner, counts, guards" },
    { field = "X: the question's text" },
    { field = "X: terrain, special field; the defending side's owner" },
    { table = ["slot", "creature", "count"], rows = 7 },
    { field = "X: the result; the messages; the next question's text" },
    { field = "X after: owner, counts, guards" },
    { field = "anything odd" },
]
predictions = """
- **The records before** (survey §2.2, `dwelling_record_init` and `dwelling_week_refill`): every
  count its creature's growth and, for each creature of level 5 or more, a guard stack of 3 ×
  growth, in creature order; owner −1. **D:** 1 Green Dragon; guards slot 0 **3 Green Dragons**.
  **F:** Stone 6, Iron 6, Gold 3, Diamond 2 Golems; guards slot 0 **9 Gold Golems**, slot 1 **6
  Diamond Golems**. **X:** Air 6, Fire 5, Earth 4, Water 6 Elementals; guards slot 0 **12 Earth
  Elementals** (Fire is level 4).
- **The question** (§4.2, GENRLTXT 422): "Much to your dismay, the {name} is guarded by {size word}
  {first slot's creature}. Do you wish to fight the guards?", the size word of **the guards' total**
  (`creature_quantity_word`, below 5 a few, below 10 several, below 20 a pack of): D "the Dragon
  Cliffs is guarded by **a few** Green Dragons", F "the Golem Factory is guarded by **a pack of** Gold
  Golems" (15 in all; its first stack's 9 would say **several**: VCMI's), X "the Elemental Conflux is
  guarded by **a pack of** Earth Elementals".
- **The battle** (§4.2): `adventure_battle` with the guards' army **as it stands, unsplit** (D one
  stack, F two, X one, as the records' slots), the defending side's owner **−1**, no hero; the
  terrain grass (the entrance tile's), no special field.
- **After a win** (§4.3, §4.4): the guards gone, the dwelling **flagged for Red** (owner 0; the
  radius-3 reveal falls inside E10-1's sight; the reading shows no message of the flag's own), then
  the hire question:
  ADVEVENT 35 "{Dragon Cliffs} Would you like to recruit Green Dragons?" for D, ADVEVENT 36 with the
  four plurals for F ("Stone Golems, Iron Golems, Gold Golems, or Diamond Golems") and X ("Air
  Elementals, Fire Elementals, Earth Elementals, or Water Elementals"). No: the visit ends, the flag
  kept, **the counts as before** (growth).
- **VCMI** (`CGDwelling`): the same counts and guards (`dwellings.json`), the same question but its
  size word from the first stack's count (F "several"), the guards unsplit, the defending side the
  dwelling's owner (here neutral too: D-51 needs an owned dwelling, dropped with E10-2), the flag
  then the recruitment question. **The wiki:** guards of 3 × growth on dwellings of level 5 to 7.
"""
[encounter.hero]
type = "Edric"
specialty = "creature Griffin"
at = [9, 12]
primary = [10, 10, 1, 1]
army = [["Archangel", 10]]


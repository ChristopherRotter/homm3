    { field = "after it: E10-3b's army (creature and count by slot); Q's owner and count" },
    { field = "anything odd" },
]
predictions = """
- **The code** (survey §4.3, §4.4): a Guardhouse has no guards (Pikemen are level 1), so the visit
  flags it at once (owner Red) and asks ADVEVENT 35 "{Guardhouse} Would you like to recruit

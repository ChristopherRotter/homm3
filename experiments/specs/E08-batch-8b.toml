# Experiment batch E8b (E08 T67; decisions 158, 165, 167, 171): rows E8-6, E8-8, E8-9 and E8-11 to
# E8-14 of increment 8's plan (survey docs/rules/surveys/E08-sea.md §11; docs/epics/E08-design.md
# §17), the sea's pickups and the battles at sea, in SoD on Easy, hot seat, on one map. Build:
# docs/experiments/README.md. Predictions are for the agent who evaluates the results; the
# template never shows them.
#
# | row   | settles                                  | the reading (faithful)                          | the other source(s)                     |
# | E8-6  | §8.3, §8.4: a full backpack at sea        | an artifact chest gives 1 500 gold and no       | VCMI: the artifacts given (no backpack  |
# |       |                                          | artifact; a Survivor nothing, and it leaves     | limit); the wiki as the reading         |
# | E8-8  | §8.2 to §8.4: the draws and the gains     | Flotsam 0 to 3 about 10 each; chests about 8,   | VCMI and the wiki: the same chances     |
# |       |                                          | 28, 4; Survivors' classes about 22, 8, 8, 2     |                                         |
# | E8-9  | §8.5: the Ocean Bottle                    | the default text by column mod 25; the map's    | VCMI and the wiki: a random text        |
# |       |                                          | text; every bottle gone                         |                                         |
# | E8-11 | §7.1, §7.3: the deck                      | water, no field, the ship flag, at most the     | consensus (VCMI's battlefield, the wiki)|
# |       |                                          | water obstacle; the loser's boat gone           |                                         |
# | E8-12 | §7.1, §7.3: two boats                     | water, the ship flag, exactly the 32 hexes;     | consensus                               |
# |       |                                          | the winner in its boat; the loser's boat gone   |                                         |
# | E8-13 | §7.2: a monster on water                  | no path past its guarded tiles; the battle on   | consensus                               |
# |       |                                          | the guarded tile, on the deck                   |                                         |
# | E8-14 | §7.2, §4.3: events on water               | the first fires and ends the move on its tile;  | consensus                               |
# |       |                                          | the second's guards on the deck                 |                                         |
#
# **Who sails** (survey §4.2): every hero here boards its boat on day 1 (no Admiral's Hat: 0 points
# after) and sails on day 2 with the sea's points: Expert Navigation 3 750, the Necklace of Ocean
# Guidance +1 000, the Sea Captain's Hat +500. A visit from the neighbouring tile costs a step.
#
# **The words** (survey §8): Flotsam 0 to 3 (0 nothing, 1 five wood, 2 five wood and 200 gold, 3
# ten wood and 500 gold); a Sea Chest's bits 0 to 2 its kind (0 nothing, 1 1 500 gold, 2 an
# artifact and 1 000 gold), bits 3 to 12 the artifact; a Survivor's word its artifact. The harness
# reads every word at the start (save 1).
#
# **E8-13's row as staged.** Survey §11 asks the boat to sail "across a tile it guards that is not
# the path's end"; the original's pathfinder never goes on from a guarded tile (E08-battles §2.2,
# VCMI the same), so no path reaches past the guards: the row checks that (a click past them) and
# then sails onto a guarded tile.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or resources. The template asks for gold; an artifact the spec does not give goes under
# "anything odd", and the treasury is read before and after each visit, never across a day's start.

[map]
name = "E08 batch E8b"
description = "Engine-generated experiment map (E08, batch E8b): boats and the sea, the pickups and the battles: a full backpack at sea, the sea pickups' draws, Ocean Bottles, a hero in a boat attacked from the shore, two boats, a monster on water, events on water. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-8b.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and at the start of each later turn (save 2 Blue's day 1, save 3 Red's day 2).",
    "At the start (save 1) read every Flotsam's, Sea Chest's and Survivor's word (E8-6's and E8-8's): if none of E8-6's thirty chests holds an artifact (bits 0 to 2 equal 2), or none of E8-8's forty, restart the scenario (a new game draws again) and save again, at most 20 times.",
    "Most records are the game's memory: an object's word on its tile, a hero's tile, movement points (+0x4D), day's maximum (+0x49), status flags (+0x105; bit 18, 0x40000, is the hero in a boat), its backpack's count (+0x3D4) and worn positions (+0x12D), the boats' records (game +0x4E3BC, 0x28 bytes each: tile, in use +0x18, type +0x1A, facing +0x1B, owner +0x1C, captain +0x20, aboard +0x24; `docs/exe/structs.toml` \"boat\"), the players' treasuries, a battle's terrain, special field, ship flag (`battle_manager` +0x53C6) and blocked hexes at its opening, the path marks (batch E1a's). The capture harness reads them (`clients/capture/batches/E08-batch-8b.toml`, E08 T68). Played by hand, read the screens instead and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left. A walk: click the target once (the path's marks show; note them where asked), then again (the hero goes). A boat stands on water beside the hero's tile; a click on it from the land beside it boards it. A pickup, a bottle or another hero in a boat is visited by a click on it: the hero sails to a water tile beside it and visits it from there.",
    "Battles by auto combat unless the encounter says otherwise; a tactics phase is ended at once (its Start button).",
    "Order: day 1, Red's turn: E8-6, E8-8, E8-9, E8-12, E8-13 and E8-14 board their boats (E8-11 does nothing); end the turn. Blue's turn: E8-11b and E8-12b board theirs; end the turn. Day 2, Red's turn: E8-6, E8-8, E8-9, E8-11, E8-12, E8-13, E8-14. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


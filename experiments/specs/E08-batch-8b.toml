# --- E8-6: a full backpack at sea (Red) ----------------------------------------------------------

[[encounter]]
id = "E8-6"
title = "A full backpack at sea: Sea Chests that hold an artifact, and Shipwreck Survivors"
questions = ["ADV-PIK-015", "ADV-PIK-016", "ADV-QUIRK-22"]
procedure = [
    "Day 1, Red's turn: E8-6 stands at (19, 10) with 64 Centaurs Axes in its backpack, the Necklace of Ocean Guidance and the Sea Captain's Hat worn and Expert Navigation; its boat at (20, 10). Thirty Sea Chests stand on the water at (24, 4) to (34, 12), every second column and row, and three Shipwreck Survivors at (24, 16), (27, 16) and (30, 16). Click the boat: E8-6 boards it.",
    "Day 2, Red's turn: visit **every chest whose word holds an artifact** (bits 0 to 2 equal 2), then one chest of kind 1 and one of kind 0 (the nearest), then the three Survivors. At each: read E8-6's backpack count and Red's gold; click the object (twice); note the message (first words, the pictures shown); read the backpack count, Red's gold and the object's word (or that it is gone) again.",
]
record = [
    { table = ["object (tile)", "its word (hex)", "the message (first words; pictures)", "backpack before / after", "gold before / after", "the object after"], rows = 9 },
    { field = "E8-6's movement points at day 2's start" },
    { field = "anything odd" },
]
predictions = """
- **The code** (survey §8.3, `visit_object` 0x4A5030): a chest of kind 2 with 64 or more artifacts
  in the backpack becomes kind 1: **+1 500 gold, no artifact**, the backpack 64, the chest gone;
  kind 1 +1 500; kind 0 nothing (its message). **A Survivor** (0x4A52A0) with a full backpack:
  **nothing** (the "no room" message) **and it leaves**, its artifact lost (§8.4).
- **The wiki** (Sea Chest: "If your backpack is full, you will receive 1500 gold and no
  artifact"; the Survivor's "no room" text): the same. **VCMI** (no backpack limit by default):
  the artifact and 1 000 gold; the Survivor's artifact given.
- Day 2's start: 3 750 + 1 000 + 500 = **5 250**.
"""
[encounter.hero]
type = "Rion"
specialty = "skill First Aid"
at = [19, 10]
primary = [1, 1, 1, 1]
skills = [["Navigation", 3]]
army = [["Pikeman", 10]]
artifacts = { neck = "Necklace of Ocean Guidance", head = "Sea Captain's Hat" }
fill_backpack = "Centaurs Axe"


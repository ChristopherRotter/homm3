# --- TWN-3-1: the creature's month and an upgraded dwelling -------------------------------------

[[encounter]]
id = "TWN-3-1"
title = "A month of the Griffin: K1's upgraded Griffin Tower and K2's Griffin Tower"
questions = ["TD-13", "T-13", "TWN-GRO-004"]
procedure = [
    "Red's turn, day 1: read K1's (entrance (7, 7)) and K2's (15, 7) available creatures.",
    "Play the weeks as TWN-3-4 says. Before the second month starts (Red's turn of month 1, week 4, its last day; by the harness the second month's draw forced to the Griffin's) read K1's and K2's available creatures; on Red's first day of month 2 read them again, with the month's kind and creature.",
]
record = [
    { field = "day 1: K1's and K2's available creatures" },
    { field = "month 1, week 4 (before the month): K1's and K2's available creatures" },
    { field = "month 2, day 1: the week's and month's kinds; K1's and K2's available creatures" },
    { field = "anything odd" },
]
predictions = """
The Griffin index 2 (base) and the Royal Griffin index 9, both growth 7; no castle, no horde, no
Grail; the Statue of Legion worn by TWN-3-2s adds (7 + 0) ÷ 2 = 3 in every town of Red's (survey
§1): a week's growth 10. Day 1: K1 index 9 7 (the upgrade moved the base count, survey §6), index 2
0; K2 index 2 7. Each week + 10 at K1's index 9 (index 2's growth 0: building 39 built) and at
K2's index 2 (three weeks before the month: 37 each at month 1 week 4).
- **The reading** (§3: the exact creature doubles; the week first, then the month): **K1 index 9
  before + 10** (not doubled: the Royal Griffin is not the month's creature), **K2 index 2 (before
  + 10) × 2**.
- **VCMI and the wiki** (a creature's month doubles that creature's dwellings, upgraded or not):
  K1 doubled too. VCMI doubles the growth rather than the count: K2 before + 20.
"""
[encounter.hero]
type = "Grindan"
specialty = "resource gold"
at = [62, 62]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]

# --- TWN-3-2: a dwelling's growth, every part ------------------------------------------------------

[[encounter]]
id = "TWN-3-2"
title = "A dwelling's growth with the Castle, a horde, the Grail, two flagged Guardhouses, the Statue of Legion elsewhere and Legs of Legion on the visitor (G1)"
questions = ["TWN-GRO-001", "TWN-GRO-003"]
procedure = [
    "Red's turn, day 1, before any hero moves: read G1's (entrance (23, 7)) available creatures and external dwellings' counts.",
    "Read G1's standing and every-built sets. TWN-3-2s (the Statue of Legion) steps onto the Guardhouse GH1's entrance (10, 30), TWN-3-2t onto GH2's (16, 30): each flags it for Red (answer No to the hire question). Read G1's external dwellings' counts.",
    "TWN-3-2 (Legs of Legion) steps north onto G1's entrance and stays there (close the town screen): G1's visitor.",
    "At the first week's start (Red's turn of week 2, day 1) read G1's available creatures, its visitor and which heroes wear the Statue and Legs.",
]
record = [
    { field = "day 1: G1's available creatures; its external dwellings' counts; its standing and every-built sets" },
    { field = "after the flags: G1's external dwellings' counts; GH1's and GH2's owners" },
    { field = "after the visit: G1's visitor" },
    { field = "week 2, day 1: G1's available creatures; its visitor; the Statue's and Legs' wearers" },
    { field = "anything odd" },
]
predictions = """
G1's indexes (Castle): 0 Pikemen (g 14), 1 Archers (9), 2 Griffins (7; the Griffin Bastion 18,
+3, the horde of index 2), 7 to 9 their upgrades (no upgraded dwelling: growth 0). Day 1 (the
setup builds each dwelling with its base growth alone, §6): 14, 9, 7, the rest 0; the external
dwellings' counts 0; the every-built set holds 18 (the Griffin Bastion; the map's "horde 3", the horde of the level-3 dwelling). After
the flags (`set_dwelling_owner` → `town_dwelling_count_add`): index 0 **2** and index 7 **2** (a
base creature counts at its upgrade too).
- **The reading** (§1): with c the Castle's (+ g), the Statue (+ (g + c) ÷ 2), Legs of Legion on
  the visitor (+5 at level 2), the horde (+3 at index 2), the flagged dwellings (+2 at index 0),
  then the Grail (× 1.5, truncated, on the whole): index 0 (14 + 14 + 14 + 2) = 44 → **66**; index
  1 (9 + 9 + 9 + 5) = 32 → **48**; index 2 (7 + 7 + 7 + 3) = 24 → **36**; indexes 7 to 9 **0** (no
  dwelling, the external count at index 7 not added). So at week 2: **80, 57, 43**, the rest 0.
- **VCMI** (§11: the Statue's bonus on the base growth only, the Grail's on base + castle?): index
  0 14 + 14 + 7 + 2 + Grail; the difference shows in the Statue's term (7 for 14, 4 for 9, 3 for 7).
- The visitor read −1 while it is the selected hero: the reading then counts the hero standing on
  the entrance, so Legs counts either way.
"""
[encounter.hero]
type = "Caitlin"
specialty = "resource gold"
at = [23, 8]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
[encounter.hero.artifacts]
"misc 1" = "Legs of Legion"
[[encounter.also]]
type = "Octavia"
specialty = "resource gold"
name = "TWN-3-2s"
at = [10, 31]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
[encounter.also.artifacts]
"misc 1" = "Statue of Legion"
[[encounter.also]]
type = "Nagash"
specialty = "resource gold"
name = "TWN-3-2t"
at = [16, 31]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]

# --- TWN-3-3: the Plague -------------------------------------------------------------------------

[[encounter]]
id = "TWN-3-3"
title = "The Plague: an owned town (O1) and a neutral one (N1) with known counts"
questions = ["TD-14", "T-12", "TWN-GRO-004"]
procedure = [
    "Red's turn, day 1: read O1's (entrance (39, 7)) and N1's (47, 7) available creatures and N1's garrison.",
    "Play the weeks as TWN-3-4 says. Before the third month starts (Red's turn of month 2, week 4, its last day; by the harness the third month's draw forced to the Plague) read O1's and N1's available creatures; on Red's first day of month 3 read them again, with the month's kind, and N1's garrison.",
]
record = [
    { field = "day 1: O1's and N1's available creatures; N1's garrison" },
    { field = "month 2, week 4 (before the Plague): O1's and N1's available creatures" },
    { field = "month 3, day 1: the week's and month's kinds; O1's and N1's available creatures; N1's garrison" },
    { field = "anything odd" },
]
predictions = """
Indexes 0 Pikemen (g 14), 1 Archers (g 9). Day 1: both towns 14, 9. Each week O1 + 14, + 9; N1 + 7,
+ 4 (halved, truncated; its garrison's week never changes it: seven stacks far above any new
stack's value, so `neutral_town_garrison_week` stops before the counts, §4.4). Let (a, b) be O1's and
(c, d) N1's counts before the month.
- **The reading** (§3: the week, then the Plague: the count less the unhalved growth, at least 0,
  halved): **O1 (a ÷ 2, b ÷ 2)** (half of before the week); **N1 (max(0, c + 7 − 14) ÷ 2, max(0, d
  + 4 − 9) ÷ 2)** = ((c − 7) ÷ 2, (d − 5) ÷ 2) (TD-14, T-12: ⌈g ÷ 2⌉ lost).
- **VCMI and the wiki** (the Plague halves the counts after the week's growth): O1 ((a + 14) ÷ 2,
  (b + 9) ÷ 2), N1 ((c + 7) ÷ 2, (d + 4) ÷ 2). (Some accounts: no growth that week, the counts
  halved: (a ÷ 2, b ÷ 2) for both.)
"""
[encounter.hero]
type = "Damacon"
specialty = "resource gold"
at = [62, 64]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]

# --- TWN-3-4: the neutral towns' garrisons -----------------------------------------------------------

[[encounter]]
id = "TWN-3-4"
title = "The neutral towns' garrisons over eight weeks: with a Fort (F1, F2, FF), the Citadel (F3), without (W1, W2)"
questions = ["TD-15", "TWN-GRO-006"]
procedure = [
    "Red's turn, day 1: read the six towns' garrisons (F1 (7, 15), F2 (15, 15), F3 (23, 15), W1 (31, 15), W2 (39, 15), FF (47, 15)) and F1's available creatures.",
    "Each week: end Red's turn and Blue's (by the harness: the date first written to the week's last day); on Red's new turn read the date, the six garrisons, F1's available creatures and the draws the week made (by the harness: xdd.dll's log). The weeks: month 1 weeks 2 to 4, month 2 week 1, month 3 weeks 1 to 4 (month 2 weeks 2 to 4 skipped by writing the date).",
]
record = [
    { table = ["week (the date)", "F1 garrison", "F2 garrison", "F3 garrison", "W1 garrison", "W2 garrison", "FF garrison", "F1's available creatures", "the garrisons' draws (in the towns' order)"], rows = 9 },
    { field = "anything odd" },
]
predictions = """
Per neutral town (the game's towns in their order; the strong N1 too), each week (§4): a draw
`random_between(0, 100)`, below 80 with a Fort, Citadel or Castle standing (F1, F2, F3, FF), else
below 40 (W1, W2, N1), calls the garrison's week: n = min(days ÷ 7, 8) (days (month × 4 + week − 5)
× 7 + day: 1, 2, 3, 4, 8, 8, 8, 8 by the weeks), S = three draws `random_between(0, n + 1)`
summed; the level the first of the weights 2, 3, 4, 5, 4, 3 that S does not exceed (S lessened by
each passed), else 7; the faction's base creature of the level (its upgrade when the garrison
holds the upgrade), the count its growth; room: a stack of it or an empty slot, else the stack of
the least AI value × count below the new stack's is cleared (the first of equal ones), else
nothing more; then the stack added (merged), the town's counts at the level's base and upgraded
indexes lowered by the count (at least 0), and for a base creature `random_between(1, 100)` ≤ 5
turns every stack of it into the upgrade. So each logged chance, sum and upgrade draw predicts its
week's change exactly; FF's first replaced stacks are the Gremlin (44), then the Imp, the Gnoll,
the Troglodyte, the Skeleton (60, the first of the two at 60). An owned town's garrison never grows.
- **VCMI** (§11): neutral garrisons do not grow; nothing changes.
"""
[encounter.hero]
type = "Clavius"
specialty = "resource gold"
at = [62, 66]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]


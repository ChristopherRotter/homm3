# Experiment batch TWN-3, part a (E09 T23; decision 74; design note §47): growth's five rows of
# increment 3's survey (docs/rules/surveys/E09-growth.md §1 to §5, §14), in SoD on Easy, hot seat.
# Part b (`E09-batch-3b.toml`) holds row TWN-3-6. Build: docs/experiments/README.md. Predictions are
# for the agent who evaluates the results; the template never shows them. "The reading" is the
# survey's code reading of Heroes3.exe (the engine follows it, faithful); VCMI's is VCMI 1.7.5 as
# the survey summarises it (§11).
#
# | row     | settles               | the reading                           | otherwise                    |
# | TWN-3-1 | TD-13, T-13 (§3)      | a creature's month doubles the index  | VCMI and the wiki: both      |
# |         |                       | of the exact creature: the base Grif- | towns' Griffins doubled (the |
# |         |                       | fin Tower's, not the upgraded one's   | month's creature or its      |
# |         |                       |                                       | upgrade)                     |
# | TWN-3-2 | §1 (the sum)          | each index as §1 computes it (the     | VCMI: the Statue on the base |
# |         |                       | Statue on base + castle, the Grail on | only (§11)                   |
# |         |                       | the whole)                            |                              |
# | TWN-3-3 | TD-14, T-12 (§3)      | the Plague: owned half of before the  | VCMI and the wiki: every     |
# |         |                       | week; neutral max(0, before − ⌈g/2⌉)  | count halved after the week  |
# |         |                       | ÷ 2                                   |                              |
# | TWN-3-4 | TD-15 (§4)            | §4's chances, levels, creatures,      | VCMI: no neutral garrison    |
# |         |                       | room, counts lowered, upgrade         | growth (§11)                 |
# | TWN-3-5 | §5, T-11              | the Portal's count set to the         | VCMI: added like a dwell-    |
# |         |                       | growth (not added), no Plague, the    | ing's; the first creature at |
# |         |                       | first creature at the town screen     | the week's start (§11)       |
#
# **Forcing the draws.** The week's and the month's kinds are drawn when the week or the month
# starts (`new_day_week_events`, `new_month`), into the globals they are read from straight after,
# so writing them before does nothing: the capture harness forces the draws themselves (xdd.dll's
# sites `week_chance`, `month_kind`, `month_creature`; E09 T23, the runbook's "Forced rolls"):
# every week normal (`week_chance` 2: never a creature's), the second month the Griffin's
# (`month_kind` 6, `month_creature` 1), the third the Plague (`month_kind` 10). It logs the neutral
# towns' garrison draws and the Portal's (`garrison_*`, `portal_*`). Played by hand, only the
# reads can be followed: the weeks' kinds then come as they fall.
#
# **The weeks.** The harness writes the date (game +0x1F63E) to the week's last day before each
# pair of end turns (Red's, Blue's), so each pair starts a week: M1 W2, W3, W4, M2 W1 (the
# Griffin's month), M3 W1 (after M2 W4 written: the Plague), M3 W2, W3, W4. A neutral garrison's
# n (survey §4) counts the days from the written date: 1, 2, 3, 4, 8, 8, 8, 8.
#
# **The towns** (`[[map.town]]`, custom sets by name; the game's ids in the predictions): map row 7,
# entrances 8 columns apart from column 7: K1 (7, 7) Red's Castle with the upgraded Griffin Tower,
# K2 (15, 7) with the Griffin Tower (TWN-3-1); G1 (23, 7) Red's Castle with the Castle, the
# Guardhouse, the Archers' Tower, the Griffin Tower, the Griffin Bastion and the Grail (TWN-3-2); D1
# (31, 7) Red's Dungeon with the Portal of Summoning (TWN-3-5); O1 (39, 7) Red's Castle and N1 (47,
# 7) a neutral one, each with the Guardhouse and the Archers' Tower (TWN-3-3; N1's garrison seven
# strong stacks of other factions, so its garrison's week never changes it or its counts). Map row
# 15, neutral (TWN-3-4), the garrisons empty unless said: F1 (7, 15) Castle with the Fort, the
# Guardhouse and the Archers' Tower; F2 (15, 15) Rampart with the Fort; F3 (23, 15) Castle with the
# Citadel; W1 (31, 15) Castle and W2 (39, 15) Tower without a fort; FF (47, 15) Castle with the
# Fort, its garrison seven weak stacks of other factions (one each: Gremlin, Imp, Gnoll,
# Troglodyte, Skeleton, Goblin, Centaur; AI values 44, 50, 56, 59, 60, 60, 100).
#
# **The dwellings** (`[[map.ownable]]`, neutral at the start, flagged by Red's heroes on day 1):
# two Guardhouses (Pikemen) at (10, 30) and (16, 30), a Harpy Loft (Harpies) at (22, 30), each
# entered from the tile below it.
#
# **The heroes** (Red's unless said): TWN-3-2 (Legs of Legion) south of G1, enters it on day 1 and
# stays (its visitor); TWN-3-2s (the Statue of Legion: worn by a hero of Red's, it adds to every
# one of Red's towns, survey §1) flags GH1, TWN-3-2t flags GH2; TWN-3-5 flags the
# Harpy Loft; TWN-3-5d south of D1, enters it after the flags (its town screen's first Portal draw);
# TWN-3-1, TWN-3-3 and TWN-3-4 far off, never moving (each encounter has a hero); Blue's TWN-3b far
# off (a player without a hero is offered no Artifact as its starting bonus).

[map]
name = "E09 batch TWN-3a"
description = "Engine-generated experiment map (E09, batch TWN-3, part a): a dwelling's growth, the creature's month, the Plague, the neutral towns' garrisons and the Portal of Summoning over eight weeks. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E09-batch-3a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, Red and Blue both human, difficulty **Easy**. Before you start it, compare the stamp at the start of the map's description with the stamp above.",
    "The records are the game's memory: a town's record (game +0x21614, 0x168 bytes each, `docs/exe/structs.toml`): its available creatures +0x16 (i16 by the faction's index, 0-6 base, 7-13 upgraded), its Portal's creature +0x3C and count +0x40, its garrison +0xE0, its external dwellings' counts +0x118; the date +0x1F63E. The capture harness reads them and forces the weeks' and months' draws (`clients/capture/batches/E09-batch-3a.toml`, E09 T23). Played by hand the counts show in the town screen (the Fort's list) and the garrisons in the town's popup; the weeks' and months' kinds come as they fall.",
    "Tiles are (column, row) from 0 at the top left; a town's or dwelling's entrance is the tile a hero visits. A step: click the target once (the path's marks show), then again (the hero goes).",
    "Order: Red's day 1 (the reads, the flags, the visits); then each week: end Red's turn and Blue's (by hand: play the days through), the reads on Red's new turn.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


[[map.object]]  # the Den of Thieves, entered at its anchor
picture = "AVXdend0"
at = [52, 10]

# --- TWN-4-7: the Thieves' Guild ------------------------------------------------------------------

[[encounter]]
id = "TWN-4-7"
title = "The Thieves' Guild at 1 to 5 taverns and at the Den of Thieves: the rows' places and the players' parts"
questions = ["TWN-TAV-007", "TWN-TAV-008", "TWN-TAV-009"]
procedure = [
    "Red's turn, day 1. Set the resources (Red: gold 20 000, wood 5, ore 5, the rare four 10 each; Blue: gold 10 000, wood 20, ore 20, the rare four 1 each).",
    "Open R1's town screen from the town list (no hero visits it), click the Tavern, then the Thieves' Guild button: note each row's places and each player's parts (one tavern). Close the guild, the tavern and the town screen.",
    "TWN-4-7a stands south of N2 at (15, 11): step north onto the entrance (the town is taken, its screen opens). Click the Tavern, then the Thieves' Guild: note the rows and the parts (two taverns). Close them.",
    "The same with TWN-4-7b at N3 (23, 11) (three taverns), TWN-4-7c at N4 (31, 11) (four) and TWN-4-7f at N5 (39, 11) (five).",
    "TWN-4-7d stands south of the Den of Thieves at (52, 11): step north onto it; note its message, then the guild's rows and parts. Close it.",
]
record = [
    { field = "one tavern (R1): the rows' places; the parts" },
    { field = "two taverns (N2 taken): the rows' places; the parts" },
    { field = "three taverns (N3 taken): the rows' places; the parts" },
    { field = "four taverns (N4 taken): the rows' places; the parts" },
    { field = "five taverns (N5 taken): the rows' places; the parts" },
    { field = "the Den of Thieves: its message; the rows' places; the parts" },
    { field = "anything odd" },
]
predictions = """
The values (survey §6, §13): **towns** Red 1 (R1), then 2 to 5 as N2 to N5 are taken, Blue 1;
**heroes** on the map Red 7, Blue 1; **gold** Red 20 000, Blue 10 000; **wood and ore** Red 10,
Blue 40; **the rare four** Red 40, Blue 4; **obelisks** none; **artifacts** (the backpacks; the
worn count nothing, T-17) Red 0, Blue 1; **army** (`hero_army_power`: the army's AI value, a
sum of value x count, times sqrt((1 + 0.05 D)(1 + 0.05 A)), truncated; plus each town that
`town_defended` holds, a visitor or a creature in its shown army, that army's value without a
factor): Red's heroes 10 Champions x 2 100 x 1.25 = 26 250 and six of 1 Pikeman, 84 each, R1's
10 Archangels 87 760 (N2 to N5: defended by their visitors, an empty army: 0), about 114 500;
Blue's hero 20 Champions x 2 100 x 1.05 = 44 100, its town undefended: 0; **income** (the day's
gold: each town's hall) Red 500 a town (500 to 2 500), Blue 500.
- **The reading** (`thieves_guild_fill`): **one tavern**: 2 rows, towns 1st Red and Blue (equal),
  heroes 1st Red, 2nd Blue; the parts: each player's best hero only: **Red's TWN-4-7s** (Orrin:
  the greatest army power, not the most experienced TWN-4-7e), Blue's TWN-4-7x. **Two**: 4 rows,
  towns 1st Red (2 against 1), heroes as before, gold 1st Red, wood and ore 1st Blue; the parts
  add the best hero's four primary skills (Red's **5 5 1 1**, TWN-4-7s's; Blue's 1 1 1 1).
  **Three**: 6 rows, the rare resources 1st Red, obelisks 1st Red and Blue (equal); the parts add
  the tactic (both human: the same line). **Four**: 8 rows, **artifacts 1st Blue, 2nd Red** (the
  backpacks alone: 1 against 0, though Red's hero wears three), **army 1st Red** (R1's
  Archangels counted); the parts add the best creature: **Red's Archangel** (R1's garrison: the
  towns' shown armies first, then the heroes'), Blue's Champion. **Five**: 9 rows, income 1st Red.
  **The Den**: its message (ADVEVENT 142), then the window with 99: every row and every part, as
  at five. The places only, never a value; equal values one place, both flags in it.
- **VCMI** (`obtainPlayersStats`, survey §13; TD-23, T-17): the same thresholds and places for
  towns, heroes, gold, wood and ore, the rare four, obelisks and income; but the best hero by
  experience (**Red's TWN-4-7e**, its skills 1 1 1 1), **artifacts 1st Red** (the worn counted:
  Red's three against Blue's one), **army 1st Blue** (the heroes' armies only: about 26 750
  against 44 100) and **Red's best creature the Champion** (the heroes' armies only).
"""

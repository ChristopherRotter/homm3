# Experiment batch TWN-4, part c (E09 T34; design note §78, survey
# docs/rules/surveys/E09-tavern.md §6, §9 row TWN-4-7, §13): the Thieves' Guild by the viewer's
# taverns (1 to 5) and the Den of Thieves, in SoD on Easy, hot seat. Parts a and b
# (`E09-batch-4a.toml`, `-4b.toml`) hold the other seven rows. Build: docs/experiments/README.md.
# Predictions are for the agent who evaluates the results; the template never shows them. "The
# reading" is the survey's code reading of Heroes3.exe (the engine follows it, faithful; TD-23 the
# reading, T-17 the flag `TWN-QUIRK-13` on in `faithful`: decisions 117, 118); VCMI's is VCMI 1.7.5
# as the survey summarises it (§13).
#
# | row     | settles                  | the reading                         | otherwise              |
# | TWN-4-7 | §6's thresholds, §13,    | 2/4/6/8/9 rows at 1/2/3/4/5 taverns | VCMI: the best hero by |
# |         | TD-23, T-17              | (the Den all); the artifacts row by | experience; worn and   |
# |         |                          | the backpacks alone; the best hero  | backpack artifacts;    |
# |         |                          | by army power; the army row and the | the heroes' armies     |
# |         |                          | best creature with the towns' shown | only                   |
# |         |                          | armies                              |                        |
#
# **The players** (only Red and Blue play; the guild ranks the players in the game): Red, the
# viewer, the Castle; Blue the Stronghold. Every value the rows rank is set so that each row's
# places are known: the resources written by the harness before the first read (`resources`:
# Red's gold 20 000, wood 5, ore 5, mercury 10, sulfur 10, crystal 10, gems 10; Blue's gold
# 10 000, wood 20, ore 20, the rare four 1 each), no obelisk anywhere.
#
# **Red's towns** (`[[map.town]]`, map row 10, entrances 8 columns apart from column 7): R1 (7,
# 10) Red's Castle with the Tavern, a garrison of 10 Archangels (the army row's and the best
# creature's town army); four neutral towns with a Tavern and an empty garrison, each taken by a
# hero of Red's that walks in (a tavern more each): N2 (15, 10) Rampart, N3 (23, 10) Tower, N4
# (31, 10) Stronghold, N5 (39, 10) Castle with the Tavern and the Brotherhood of the Sword (the
# Castle's building that `player_tavern_count` also counts). Blue's town B (55, 40), Stronghold,
# its garrison empty, no Tavern.
#
# **The heroes:** Red's TWN-4-7s (the strongest: 10 Champions, Attack 5, Defense 5, no
# experience; three worn artifacts, the backpack empty) and TWN-4-7e (the most experienced: 30 000
# experience, 1 Pikeman, Attack 1, Defense 1) far off, never moving; TWN-4-7a, -7b, -7c and -7f
# (1 Pikeman each, nothing worn) south of N2 to N5; TWN-4-7d (the same) south of the Den of
# Thieves (52, 10), entered at
# its anchor from (52, 11). Blue's TWN-4-7x (20 Champions, Attack 1, Defense 1, one artifact in
# the backpack, nothing worn).

[map]
name = "E09 batch TWN-4c"
description = "Engine-generated experiment map (E09, batch TWN-4, part c): the Thieves' Guild by the number of taverns and at the Den of Thieves. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E09-batch-4c.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, Red and Blue both human, difficulty **Easy**. Before you start it, compare the stamp at the start of the map's description with the stamp above.",
    "Set the players' resources as the encounter says (the capture harness writes them, player record +0x9C; by hand: the console or a trainer, or note the resources each player has and score the rows by them).",
    "The Thieves' Guild opens from a town's Tavern (the town screen's Tavern building, then the Thieves' Guild button) and at the Den of Thieves; it shows each row's places by the players' flags and, per player, its best hero's portrait and primary skills, its tactic and its best creature, by the viewer's taverns. Note each row's places (the colours in each place, from the first) and each player's parts.",
    "Tiles are (column, row) from 0 at the top left; a town's entrance is the tile a hero visits. A step: click the target once (the path's marks show), then again (the hero goes).",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


# banks (survey docs/rules/surveys/E08-banks.md §11 with docs/epics/E08-design.md §19's changes), in
# SoD on Easy, hot seat, days 1 and 2 (Red's turn, then Blue's). Build: docs/experiments/README.md.
# Predictions are for the agent who evaluates the results; the template never shows them.
#
# | row    | settles                                   | the reading (faithful)                       | the other source(s)                     |
# | E13-1  | §2, §3: the draw at a new game            | each record a level's row of §2; five stacks | VCMI 1.7.5: the same chances and split  |
# |        |                                           | split as §3, at most slot 2 upgraded (class  | (written out in its config); the Naga   |
# |        |                                           | 16 only, never the Dragon Flies)             | Bank's gems, the Imp Cache's no Mercury |
# | E13-2  | §4, §7, D-66: a declined Stockpile and a  | the Stockpile's guards' size word for Red,   | VCMI: every visit scouts, so the Crypt  |
# |        | declined Crypt                            | "(Not visited)" for Blue; the Crypt "(Not    | shows its guards to Red too             |
# |        |                                           | visited)" for both (no mark)                 |                                         |
# | E13-3  | §5, design §13: the bank flag's rules     | no tactics phase, no obstacles, no war       | VCMI and the wiki the same; the cart's  |
# |        |                                           | machine; Red's stacks by ordinal at 57, 61,  | supply: the wiki (passive effects stay) |
# |        |                                           | 90, 93; the Archers' shots unchanged         |                                         |
# | E13-4  | §5, D-69: two-hex guards                  | the Griffins at 15, 185, 172, 2, 100 by the  | VCMI's wide table: 171, 1 for the third |
# |        |                                           | footprint rule (14-15, 184-185, 171-172, 1-2,| and fourth                              |
# |        |                                           | 99-100)                                      |                                         |
# | E13-5  | §5: the sea banks' battlefield            | the deck, from the coast and from a boat     | VCMI the same                           |
# | E13-6  | §6, D-67 corrected: the dialogs' order    | the level-ups first, then the reward's       | VCMI the same                           |
# |        |                                           | message and the army dialog with the Angels  |                                         |
# | E13-7  | §6, D-68: Dragon Utopia's artifacts       | the backpack relics first                    | VCMI: treasure first                    |
# | E13-8  | §4: looted banks                          | the Conservatory deserted, nothing more; −1  | VCMI: no question for a looted search;  |
# |        |                                           | for the first Crypt, none for the second, −1 | the same −1 per kind                    |
# |        |                                           | for the Shipwreck; 0 after the next battle   |                                         |
# | E13-9  | §5: a retreat                             | the survivors in the record, not looted; the | VCMI and the wiki the same              |
# |        |                                           | hint by the survivors                        |                                         |
# | E13-10 | §2, D-65: the rewards' resources          | the Naga Bank's sulfur; the Imp Cache's 2    | VCMI: gems; no Mercury                  |
# |        |                                           | Mercury at level 1                           |                                         |
# | E13-11 | design §6, §3: where the hero stands      | on the entrance at the question, after the   | VCMI the same; the wiki silent          |
# |        |                                           | decline and after the battle; the Shipwreck  |                                         |
# |        |                                           | visited from the coast, the hero on land     |                                         |
# | E13-12 | design §9, `E08-sea.md` §16: the          | a flight passes over its water entrance from | untested in the original (E8c tested a  |
# |        | Shipwreck's water tile                    | land and from water; a water walker visits   | boat's tile); VCMI unread               |
# |        |                                           | from the coast and has no path across        |                                         |
#
# **The draw is the game's** (survey §3): the level, the artifacts and the upgrade are drawn when
# the game starts, so every row reads the drawn records first (E13-1; the banks' vector at game
# +0x4E3D8, begin +0x4E3DC, 0x6C bytes a record: the guards +0x0, the resources +0x38, the creature
# +0x54 and its count +0x58, the artifacts' vector +0x5C, begin +0x60, end +0x64) and predicts from
# them. The object's word on its entrance holds the record's index in bits 13 to 24, the visited
# marks in bits 5 to 12 (bit 5 Red, bit 6 Blue) and the looted mark in bit 25.
#
# **The pictures** (docs/experiments/README.md, "Increment 13's objects"; each entrance on the
# picture's bottom row, blocked and entered or visited): the Cyclops Stockpile `AVXbnk10`, the
# Medusa Stores `AVXbnk50` and the Naga Bank `AVXbnk60` cover `at` and the tile west of it,
# entered at the western one; the Griffin Conservatory `AVXbnk30` and the Imp Cache `AVXbnk40`
# the same two, entered at `at`; the Dwarven Treasury `AVXbnk20` and the Crypt `AVXgyne0` `at` and
# the two tiles west of it, entered at the middle one; the Dragon Fly Hive `AVXbnk70` the tile west
# of `at`, entered there; Dragon Utopia `AVSutop0` the three tiles west of `at` (the nearest, `at`
# − 1, its entrance; `at` itself passable), five west of the tile above `at` and `at` with three
# west of it two rows up; on water the Derelict Ship `AVAdlic0` and the Shipwreck `AVAwrek0` `at` and the tile
# west of it, the western one the entrance, the Shipwreck `AVAwre20` the same two, `at` the
# entrance. A step onto an entered bank's entrance ends the move there (the hero stands on it);
# none of them is entered from the three tiles above its entrance, nor left upward (ADV-OBJ-004:
# classes 16, 24, 25 and 84 are not in `object_classes_from_above` 0x63AB00), so every walk below
# comes from the side or from below. The Shipwreck is visited from a neighbouring tile, from above
# too, the hero staying where it is.
#
# **The heroes.** Red has seven, Blue four. A step costs 100 on grass and water, 141 diagonally
# (priced by hand: the banks import as blockers until T123b, so no reach query prices a step onto
# one); Archangels or Titans give 2 000 land points a day, Wood Elves 1 700, an army whose slowest
# is a Pikeman or an Archer 1 560, a boat 1 500 (packs/base/adventure.toml `land_points`,
# `sea_points`); boarding leaves 0 points (no Admiral's Hat). A visit from a neighbouring tile pays
# the step (ADV-OBJ-003). A hero's scouting radius is 5 (ADV-FOG-002: dx² + dy² ≤ 30), so every
# target is explored at its click. No hero has a skill but E13-3's Tactics, no artifact but the
# war machines, wings, boots and E13-7's worn set; the experience thresholds are 1 000, 2 000,
# 3 200, 4 600, 6 200 (packs/base/core.toml).
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact (E13-7's backpack) or a resource; the template asks for gold, and an artifact on a
# moving hero goes under "anything odd".

[map]
name = "E08 batch E13"
description = "Engine-generated experiment map (E08, batch E13): creature banks: the records drawn at the start, declined banks and their hints, the bank battle's layout without tactics, obstacles or war machines, the sea banks' deck, the dialogs after a win, Dragon Utopia's artifacts, looted banks, a retreat, the rewards' resources, the Shipwreck's water tile. Hot seat, Red and Blue human; difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-13.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), at the start of Blue's turn (save 2) and at the start of Red's day 2 (save 3).",
    "Most records are the game's memory: a hero's tile, its movement points (hero +0x4D), army, experience, level, status bits (+0x105) and morale byte (+0x11A), its worn artifacts and backpack; a bank's record (the banks' vector at game +0x4E3D8, 0x6C bytes each) and its object's word (the visited bits 5 to 12, the record's index 13 to 24, the looted bit 25); the questions, messages and dialogs in their order; the treasury; the path's marks after one click; the hint (the status bar's text over a tile); and as a battle opens its stacks with their hexes, the tactics phase, the obstacles, the war machines and the battlefield. The capture harness reads them (`clients/capture/batches/E08-batch-13.toml`, E08 T120). Played by hand, read the screens instead and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left. A walk: click the target once (the path's marks show), then again (the hero goes). A bank's question: answer as the procedure says (yes: attack or search; no: leave).",
    "Battles against a bank's guards by auto combat unless the procedure says otherwise. A level-up's dialog: take the left skill. An army dialog (a reward's creatures with no room): note both bars, then close it with OK without a move.",
    "Order: day 1, Red's turn: E13-1's reads, E13-2, E13-9, E13-3, E13-6, E13-7, E13-5 (the coast and the boarding); end the turn. Blue's turn: E13-1's Blue reads, E13-12; end the turn. Day 2, Red's turn: E13-10 (in E13-3's encounter), E13-5's Derelict Ship, E13-8 (in E13-7's encounter); end the turn. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


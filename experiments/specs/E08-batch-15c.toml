# Experiment batch E15c (E08 T138; ADV-Q63's checkpoint, decision 407): increment 15's plan, the boats'
# spells, Fly and Water Walk at sea, Cursed Ground and an anti-magic garrison (survey
# docs/rules/surveys/E08-spells.md §15 with docs/epics/E08-design.md §19's changes), in SoD on
# Easy, hot seat, days 1 and 2. The Prison and the Market of Time are `E08-batch-15a.toml`, the door
# and the fog `E08-batch-15b.toml`. Build: docs/experiments/README.md. Predictions are for the
# agent who evaluates the results; the template never shows them.
#
# | row    | settles                                   | the reading (faithful)                        | the other source(s)                    |
# | E15-4  | §4.1: Cursed Ground, an anti-magic        | Fly (level 5) refused (GENRLTXT 748), free;   | VCMI: a spell's problems (not compared |
# |        | garrison                                  | Summon Boat (level 1) cast; in the garrison   | further)                               |
# |        |                                           | both refused (685), free                      |                                        |
# | E15-9  | §5, D-75: Summon Boat's choice            | E15-9a: its last boat, from the underground;  | VCMI: the nearest by `dist2d`, any     |
# |        |                                           | E15-9b: the nearest own (Manhattan), never    | owner: Blue's both times; the manual:  |
# |        |                                           | Blue's nearer one                             | the hero's own boats first             |
# | E15-10 | §6, A-50: Scuttle Boat's target           | the cursor on a hidden empty boat, none on an | VCMI `ignoreFow` false: no cursor on   |
# |        |                                           | occupied boat or a hidden tree; sunk at       | the hidden boat; the manual "a boat,   |
# |        |                                           | Expert                                        | unless occupied"                       |
# | E15-11 | §7.1: Fly's casts                         | the second: nothing, free; with Angel Wings:  | the wiki (shoutwiki): not on a boat    |
# |        |                                           | nothing, free; in a boat: GENRLTXT 193, free  |                                        |
# | E15-12 | §7.1, A-49: Water Walk cast in a boat     | charged; after the landing the hero walks on  | not compared                           |
# |        |                                           | water (421 by the level-0 prices)             |                                        |
#
# **Changes from survey §15** (agent's calls): **E15-9** splits into E15-9a (the hero whose last
# boat lies underground, far) and E15-9b (a hero that never sailed, from the same shore) instead of
# one hero twice: the plan's "the boats reset" is a reload of save 2 between the two casts. The
# boats' last captains and owners come from sailing first in the procedure (design §19): a hero
# with the Admiral's Hat boards and lands again the same day (free boarding keeps its points,
# D-41), so B1 (underground, E15-9a's), B2 (Red's, E15-9r's) and B3 (Blue's, E15-9blue's) keep
# their tiles. **E15-12** is E15-11's hero after its Fly in the boat (the Admiral's Hat lets it
# land and walk the same day; every effect lasts until the new day), recorded in E15-11's
# encounter (Red holds eight heroes already). **E15-10**'s added click (design §19) is on a hidden
# tree; a seen empty boat CB is the cursor's control.
#
# **The fog** (`[[map.hidden]]`, checked by the build; each Red hero reveals radius 5 at the
# start, dx² + dy² ≤ 30; the anti-magic garrison 3 around its tiles; the towns 5): the rectangle
# (18, 10) to (21, 14) (E15-10's hidden boat HB on (19, 12) and tree on (21, 12)), inside the
# scuttle dialog's view (the view centred on the caster: dx −9 to +9, dy −8 to +8). After E15-10o
# boards O on (14, 17) its reveal reaches neither (25 + 25 = 50 to HB).
#
# **The boats** (`AVXboat0` to `AVXboat2`): a boat stands one column west of its `at`; it is
# boarded by a click on it from a land tile beside it (boarding without the Hat leaves 0 points),
# and a click on a land tile beside a hero's boat lands it. Summon Boat (survey §5,
# `summon_boat_choice` 0x4E54A0): 1. the first boat whose last captain is the hero, no hero aboard,
# whatever its owner and level; 2. else among the empty boats of the player or of none the least
# |dx| + |dy|, levels ignored, a tie to the later; it goes to the hero's first water neighbour
# clockwise from up. On day 2 the empty boats and their Manhattan distances from E15-9a's tile
# (4, 57) and E15-9b's (6, 57): B3 (4, 50) Blue's 7 and 9; B2 (16, 56) Red's 13 and 11; B1 (38, 55,
# underground) Red's 36 and 34; CB (15, 8) none's, B5 (40, 35) Red's after E15-11, B4 (50, 6)
# after E15-4: 50 or more.
#
# **The heroes.** Red has eight, Blue one. Every army is 10 Pikemen (speed 4, native to grass):
# 1 560 points a day on land; a step costs 100 on grass and on subterranean ground, 141
# diagonally. With the Admiral's Hat the sea's maximum is 3 000 (1 500 and the Hat's 1 500):
# boarding converts the points after the step × 3 000 ÷ 1 560, landing × 1 560 ÷ 3 000, truncated
# (D-41, batch E8's E8-1 and E8-2). A caster wears a spell book with the spells listed and starts
# with 10 × knowledge spell points. The costs (packs/base/core.toml): Summon Boat 8 at None, 7
# above; Scuttle Boat 8, 6; Fly 20, 15; Water Walk 12, 8; the chances 50, 50, 75, 100 (Expert:
# certain, the draw made). Level-0 Water Walk prices a step from land onto water at the land's
# price, from water 140 (survey `E08-hero-movement.md` §2.3). No hero has a skill or an artifact
# but those listed.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact; the template asks for gold. An artifact the spec does not give goes under "anything
# odd".

[map]
name = "E08 batch E15c"
description = "Engine-generated experiment map (E08, batch E15c): Summon Boat's choice among a hero's last boat underground, its own and an enemy's; Scuttle Boat in the fog and on an occupied boat; Fly and Water Walk at sea; Cursed Ground and an anti-magic garrison. Hot seat, Red and Blue human; difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-15c.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1) and at the start of Red's day 2 (save 2).",
    "Most records are the game's memory: a hero's tile and level, movement points (hero +0x4D), spell points (+0x18), status flags (+0x105; bit 18, 0x40000, the hero in a boat), Fly (+0x112) and Water Walk (+0x116) levels; the boats' records (game +0x4E3BC, 0x28 bytes each: tile, in use +0x18, type +0x1A, facing +0x1B, owner +0x1C, captain +0x20, aboard +0x24; `docs/exe/structs.toml` \"boat\"); whether a tile is explored for Red; the mouse cursor's frame over a tile in a target dialog; the messages in their order; the path's marks after one click. The capture harness reads them (`clients/capture/batches/E08-batch-15c.toml`, E08 T139). Played by hand, read the screens instead (an unexplored tile is black) and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left; the underground's tiles carry \"level 1\". A walk: click the target once (the path's marks show), then again (the hero goes). **A cast:** select the hero, click the cast button (the spell book opens), click the spell named; Scuttle Boat then waits for a tile: move the pointer over the tiles the procedure names (note the cursor over each: the spell's cursor or none) and left-click the target named. Close every message with its OK button.",
    "Order: day 1, Red's turn: E15-10 (first: nothing else moves before it), E15-4, E15-11 (with E15-12), E15-9's day 1 (E15-9r, then E15-9a); end the turn. Blue's turn: E15-9's Blue step; end the turn. Day 2, Red's turn: save 2, E15-9a, then load save 2 and E15-9b. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


# Experiment batch E12b (E08 T109b; decisions 299 to 303, 306 to 309, 312, 313): rows E12-7 to
# E12-17 of increment 12's plan, the bonus visitables (survey
# docs/rules/surveys/E08-garrisons-bonuses.md §10, §12; docs/epics/E08-design.md §18), in SoD on
# Easy, hot seat, days 1 to 8 (the second week's first), then the third's and the fourth's first
# days for E12-12 alone; Red plays, Blue only ends its turns. Batch E12a (`E08-batch-12a`) is the
# garrisons. Build: docs/experiments/README.md. Predictions are for the agent who evaluates the
# results; the template never shows them.
#
# | row    | settles                                    | the reading (faithful)                       | the other source(s)                     |
# | E12-7  | §10.5, D-64: the Sirens                    | 90, 10, 1 keep 62, 7, 1 (the double product  | VCMI: 63, 7, 1 and 300 (ceil 30 %       |
# |        |                                            | trunc(n × 0.7)); experience 310             | drowned)                                |
# | E12-8  | §10.5, A-44: the Sirens after a battle     | losses again (bit 20 cleared by the battle)  | VCMI the same; the wiki: a bug (HotA)   |
# | E12-9  | §10.6, D-62: a Magic Spring's entrances    | each refills once a week on its own; both    | VCMI: one object, the second refused;   |
# |        |                                            | again at the week                            | the wiki: two independent tiles         |
# | E12-10 | §10.4, D-63: the Stables visited again     | +400 once a week (a hero's mark); Cavaliers  | VCMI: nothing while its week bonus      |
# |        |                                            | upgraded at every visit; +400 to the day's   | holds (Cavaliers kept)                  |
# |        |                                            | land points                                  |                                         |
# | E12-11 | §10.2: the Idol by the day, the Temple     | odd luck, even morale, day 7 both; Temple +1,| VCMI and the wiki the same              |
# |        |                                            | day 7 +2                                     |                                         |
# | E12-12 | §10.6: two Fountains of Fortune            | −1, +1, +2 or +3 each; new only at a week's  | VCMI the same (reset every 7 days)      |
# |        |                                            | start                                        |                                         |
# | E12-13 | §10.4: Oasis, Watering Hole, Swan Pond     | +800 and +400 to the points and the day's    | VCMI: the points only, its maximum      |
# |        |                                            | maximum; then points 0, the maximum kept     | computed anew                           |
# | E12-15 | §10.4, open point: the Admiral's Hat after | the boarding divides by the raised maximum   | VCMI: by the maximum computed anew      |
# |        | an Oasis                                   |                                              |                                         |
# | E12-16 | §10.7: the hint's bonus line and mark      | the kind's line once the team visited one;   | the original only (E24's reading)       |
# |        |                                            | the mark by the selected hero's bit          |                                         |
# | E12-17 | rewards survey §6.1, §6.3: a School of War | refused (no gold), the kind mark still set:  | the original only                       |
# |        | without gold                               | the line over a second School                |                                         |
#
# **Rows and heroes.** Red has eight heroes (the original's most): E12-7 plays E12-15, E12-7,
# E12-8 and E12-16's water part in that order (the Oasis, the boat, the Sirens, a battle, the
# Sirens again, a Buoy, the Mermaids); E12-13 plays E12-13 and, on day 2, E12-16's land part;
# E12-17 also reads E12-12 (which needs no hero) and is the other hero E12-16's marks are read with.
#
# **A town each** (the lane's TRAPS.md): a player without a town is defeated seven days after, and
# the run reaches day 22. Red has a Castle at (10, 66), Blue a Stronghold at (10, 50), each with
# the editor's standard buildings, far from every row; no hero enters them. **Red's treasury** is
# emptied by a timed event on day 1 (as batch E10a's "Take": its results left Red exactly the gold
# its events gave, the starting bonus before them): E12-17 visits its School on day 1 with no gold.
# Nothing else reads the treasury.
#
# **The pictures** (docs/experiments/README.md, "Increment 12's objects"; `Objects.txt`): the Idol,
# the Magic Wells, the Fountains of Fortune and the Buoys block their tile `at` and are visited
# from a neighbour, never stood on; the others are entered (stood on): the Stables and the Rally
# Flag at `at` (they block `at` and the tile west of it), the Swan Pond, the Faerie Ring, the
# Temple at the tile west of `at` (the same two tiles), the Fountain of Youth at `at` (it blocks
# `at`, the tile west and the two above), the Magic Spring and the Oasis at `at` and the tile west
# of it (the Oasis also blocks the two above), the Watering Hole at `at` and the three west of
# it, the Mermaids and the Sirens at the middle of their three tiles; the School of War `AVSwar20`
# (since T109b, E12-17) at the tile west of `at`. **None is visited or entered from above** (design
# §1; neither of the original's lists holds them), so every visit below comes from the row of the
# object or from below, and no hero leaves an entered object upwards.
#
# **The points.** Ten or two Archangels and one Archangel give 2 000 land points a day; an army
# whose slowest is a Pikeman or an Archer 1 560 (packs/base/adventure.toml `land_points`); at sea
# 1 500, with the Admiral's Hat 3 000 (HER-ADV-009). A step costs 100 on grass and at sea, 141
# diagonally (priced by hand: the bonus visitables import as blockers until T113b, so no reach
# query prices a step onto one; the plain legs by a throwaway search on the written map). A hero's
# scouting radius is 5 (dx² + dy² ≤ 30, ADV-FOG-002): every click below is on a tile explored by
# then (the long walks are split into legs for it, ADV-MOV-008).
#
# **The reads** (the capture harness, E08 T110): a hero's status bits (+0x105), its visits' morale
# and luck bytes (+0x11A, +0x11B), the day's maximum (+0x49), the points left (+0x4D), the spell
# points (+0x18), experience and army; a tile's word (the Fountain of Fortune's value, bits 13 to
# 16 signed; a Magic Spring's entrance, bit 6 full); the map hint's text over an entrance. **A hero
# standing on an entrance hides its tile's word** (batch E10b's trap): a Spring's word is read on
# the entrance the hero does not stand on.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact; an artifact on a moving hero goes under "anything odd" (boots, a Necklace of Ocean
# Guidance would move the points; a Talisman of Mana the spell points).


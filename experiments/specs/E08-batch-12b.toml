  left Red exactly the 1 000 they gave, the starting bonus included before them).
- **The hint before** (E24-design.md §4.11: on an entrance the name, the bonus when the viewing
  player knows the kind, then the mark by the selected hero): no School of War visited by Red, so
  `kinds_visited` + 10 clear: **the name, then "not visited"** (GENRLTXT 354; E12-17's +0x7B bit

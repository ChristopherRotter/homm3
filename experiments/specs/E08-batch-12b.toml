E12-12:

- **The value** (survey §10.6; 0x4C1479 at a new game, 0x4C8C9F at each new week): the tile word's
  bits 13 to 16, drawn by `random_between(0, 3)`, 0 giving **−1** and 1 to 3 themselves: each of
  −1, +1, +2, +3 one in four, for each fountain apart (in the map walk's order among the weekly
  classes; this map holds no other). **Unchanged on days 2 to 7**; drawn again on **days 8, 15
  and 22** (each new week). Never 0 (no fountain has a body to set it). The team bits **0**
  throughout (cleared at the new game, kept at a week; nobody visits). VCMI: four rewards of 25 %,
  reset every 7 days (the same law); the wiki: −1 to +3, changed on a week's first day.

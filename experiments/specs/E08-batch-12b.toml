name = "E08 batch E12b"
description = "Engine-generated experiment map (E08, batch E12b): the bonus visitables through a week and the next week's first day: the Sirens before and after a battle, a Magic Spring's two entrances, the Stables visited again, the Idol and the Temple by the day, two Fountains of Fortune, the movement objects and the Admiral's Hat, the hint's bonus lines, a School of War without gold. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-12b.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and at the start of Red's turn on days 2, 6, 8 and 15 (saves 2 to 5).",
    "Day 1 opens with a message for Red (a tax collector takes its gold): close it.",
    "Most records are the game's memory: the date (game +0x1F63E the day of the week, +0x1F640 the week), a hero's tile, status bits (hero +0x105), its visits' morale and luck (+0x11A, +0x11B), the day's maximum movement (+0x49), the points left (+0x4D), the spell points (+0x18), experience and army; a tile's word; the map hint's text; every message's text. The capture harness reads them (`clients/capture/batches/E08-batch-12b.toml`, E08 T110). Played by hand, read the screens instead (the hero screen's morale and luck lists, the status bar's hint) and leave the memory-only lines empty.",
    "Tiles are (column, row) from 0 at the top left. A walk: click the target once (the path's marks show), then again (the hero goes). A visit of an object that is not entered: click it twice from where the hero stands. **A hint:** with the hero named selected, hold the mouse over the tile named (an object's entrance) and note the status bar's text. **Another hero's hint:** select that hero in the hero list, centre the view on the tile with a click on the minimap, then hold the mouse over it.",
    "**A cast:** open the hero's spell book on the adventure map, cast View Earth, close its view.",
    "**The exchange between two heroes** (a click on a hero of one's own beside the hero): a move is a click on a stack, then a click on an empty slot of the other hero's bar (slots 0 to 6 from the left); close it with OK.",
    "Each battle by auto combat. A level-up's dialog: take the left skill.",
    "Order, Red's turns (Blue ends each of its turns at once): **day 1**: E12-12's reads, E12-17, E12-14, E12-9, E12-10, E12-11, E12-13, E12-7; **day 2**: E12-12, E12-14, E12-10, E12-11, E12-13 (E12-16's land part); **days 3 to 5**: E12-12; **day 6**: E12-12, E12-11; **day 7**: E12-12, E12-11; **day 8**: E12-12, E12-9; then end the turns to **day 15** and **day 22**: E12-12 on each. Then the map is done.",

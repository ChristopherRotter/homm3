  universities"): **never**.
- D-36 is the user's after this row (the reading against both).
"""
[encounter.hero]
type = "Ingham"
specialty = "creature Monk"
at = [36, 58]
primary = [0, 0, 0, 0]
army = [["Pikeman", 1]]


# Experiment batch E7a (E08 T56; decisions 129, 132, 139, 142): rows E7-1 to E7-6 and E7-8 to
# E7-11 of increment 7's plan (survey docs/rules/surveys/E08-rewards.md §11; docs/epics/E08-design.md
# §18), the pickups and the objects that teach, in SoD on Easy, hot seat, on one map; row E7-7 is
# on an RoE map of its own (E08-batch-7a-roe.toml). Build: docs/experiments/README.md. Predictions
# are for the agent who evaluates the results; the template never shows them.
#
# | row   | settles                                   | the reading (faithful)                         | the other source(s)                    |
# | E7-1  | D-29: a guarded artifact without a text   | a question naming the guards; no battle first  | VCMI the same; the wiki: a battle      |
# | E7-2  | D-30: where a pickup's artifact goes      | the axe worn (right hand), the scroll at misc 1| the wiki: both in the backpack         |
# | E7-3  | D-31: the classes of a random artifact    | treasure, minor or major: no relic among 40    | VCMI: any class, relics too            |
# | E7-4  | §2.2, §6.4: the chest's and stone's grant | (gold − 500) × 1.05; the stone 1 050           | VCMI the same; the wiki the same       |
# | E7-5  | §2.2: a chest's artifact, full backpack   | 1 000 gold or 500 experience; backpack 64      | the code's alone                       |
# | E7-6  | §5: a monster's artifact, full backpack   | the artifact lost, the resources given         | VCMI: no full backpack; the wiki silent|
# | E7-8  | D-34: random Shrines of one level         | 15 different spells                            | VCMI: uniform, repeats                 |
# | E7-9  | D-36: Necromancy at a University          | drawn like any skill: in some of 30            | VCMI and the wiki: never               |
# | E7-10 | §6.9: the finds with a full backpack      | Corpse 1 000 gold; Wagon its resources; Tomb   | the code's alone                       |
# |       |                                           | keeps its artifact, still −3 morale            |                                        |
# | E7-11 | §6.9: two Tombs                           | −3 after both (not −6), −3 at the opening, 0   | the wiki: −3 until the next battle     |
# |       |                                           | after the battle                               |                                        |
#
# **The plan's rows as staged.** E7-5 and E7-10 visit only the objects whose word holds an
# artifact (the harness reads every word at the start) and a few controls: the full backpack's
# cases are the ones that differ; about 2 of the 40 chests (5 %), 4 of the 20 Corpses (20 %) and
# 4 of the 10 Wagons (40 %) hold one. E7-3, E7-8 and E7-9 read the map's draws at the new game and
# play nothing. A hero with a full backpack carries 64 Centaurs Axes (`fill_backpack`): an axe the
# visit gives is lost or kept by the backpack's count, not by a free right hand.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or resources. The template asks for gold; an artifact the spec does not give goes under
# "anything odd", and the treasury is read before and after each visit, never across a day's start.

[map]
name = "E08 batch E7a"
description = "Engine-generated experiment map (E08, batch E7a): the pickups and the objects that teach: a guarded artifact, where a pickup's artifact goes, random artifacts, chests, a monster's treasure, random Shrines, Universities, Corpses, Wagons and Warrior's Tombs. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 72
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-7a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1).",
    "Most records are the game's memory: an object's word on its tile, a hero's experience, primary and secondary skills, spell points, morale and luck bonuses (+0x11A, +0x11B) and status flags, its worn positions (+0x12D, 8 bytes each), its backpack in order (+0x1D4, the count +0x3D4), its learned spells (+0x3EA), its army (creature ids +0x91, counts +0xAD), the players' treasuries, the game's Universities (+0x4E3CC). The capture harness reads them (`clients/capture/batches/E08-batch-7a.toml`, E08 T57). Played by hand, read the screens instead and leave the memory-only lines empty.",
    "Positions are the original's numbers: head 0, shoulders 1, neck 2, right hand 3, left hand 4, torso 5, rings 6 and 7, feet 8, misc 9 to 12 (the hero screen's misc 1 to 4) and 18 (misc 5), war machines 13 to 16, spell book 17. Army slots count from 0 at the left. Tiles are (column, row) from 0 at the top left.",
    "Answer questions as the encounter says; write each question's or message's text (or its first words) down where the encounter asks for it. A level-up: take the offer the encounter names, else the left one.",
    "Each battle by auto combat unless the encounter says otherwise; a tactics phase is ended at once (its Start button).",
    "At the start (save 1) read every chest's, Corpse's and Wagon's word: if none of E7-5's forty chests (26, 4) to (44, 10), none of E7-10's Corpses or none of its Wagons holds an artifact, restart the scenario (a new game draws again) and save again. Rows E7-3, E7-8 and E7-9 read the map of the game that is played; nothing is played for them.",
    "Order: day 1, Red's turn: E7-1, E7-2, E7-4, E7-6, E7-5 (a hero out of movement points goes on the next day); end the turn. Blue's turn (save 2 at its start): E7-10, E7-11. Further days only for E7-4, E7-5 and E7-10 if their heroes need them. Then the map is done.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",

# --- R1: the retreat test's share of Fight Value and its cap (§7.55, 0x41E570) ----------------------

[[encounter]]
id = "R1a"
title = "R1a: a computer hero defending on Hard retreats at a 14 % share of Fight Value"
questions = ["E23 survey row 4b R1", "BAT-AI-024", "slip 26"]
procedure = [
    "Hard. Step east into Tan's hero (2000 experience; Tan owns a Tavern town). Red's 3 Archangels act first and defend.",
    "Note Tan's first stack's action (a retreat, 4, or a move), Tan's gold at the opening; after round 2 Red retreats.",
]
predictions = """
At Tan's first activation (round 1, after Red's Archangels defended): steps 1 to 6 pass (Hard,
no Shackles; Tan's Tavern town; the worn Catapult's 500 and 2000 experience; Red's predicted turn
kills at most one of Tan's two stacks; gold for the price, 700, and 2500 more: read Tan's gold).
Step 7: Tan's 2 + 2 Dendroid Guards, not acted, 2 x trunc(1380 x 1.2) = 3312; Red's 3 Archangels,
acted, 18099, x 1.1 = 19908. Step 8: 0.2 (artifacts worth above 0) - 2 x 0.015 = 0.17, capped at
0.16. Step 9: 3312 / 23220 = 0.1426 < 0.16.
- The reading: **Tan retreats** (action 4) at its first activation.
- Otherwise: other thresholds (a fight here would refute the cap or the share).
"""
[encounter.hero]
type = "Octavia"
specialty = "resource gold"
at = [3, 14]
primary = [0, 10, 1, 1]
skills = []
army = [["Archangel", 3]]
[encounter.opponent.hero]
type = "Serena"
specialty = "skill Eagle Eye"
owner = "tan"
experience = 2000
primary = [0, 0, 1, 1]
skills = []
army = [["Dendroid Guard", 2], ["Dendroid Guard", 2]]
[[encounter.also]]
type = "Voy"
specialty = "skill Navigation"
owner = "blue"
at = [33, 14]
primary = [0, 0, 1, 1]
skills = []
army = [["Peasant", 1]]
[[encounter.record]]
field = "R1a: Tan's gold; Tan's first action (retreat or not)"
[[encounter.record]]

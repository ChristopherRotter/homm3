# Experiment batch E5b (E08 T36a; decisions 78, 80): where a flight or a water walk may go, rows
# E5-7, E5-9 and E5-11 of the survey's plan (docs/rules/surveys/E08-hero-movement.md §9;
# docs/epics/E08-design.md §11), in SoD on Easy, hot seat. The day's points and the step prices
# (E5-1, E5-4 to E5-6) are batch E5a; E5-2, E5-3 and E5-10 are T36b's. E5-8 was dropped (A-14
# withdrawn, decision 75). Build: docs/experiments/README.md. Predictions are for the agent who
# evaluates the results; the template never shows them.
#
# | row   | settles                                      | the reading (faithful)       | the other source(s)        |
# | E5-7  | D-25: where a move may end (a check)          | not on a tree, not on water  | consensus (VCMI, the wiki) |
# | E5-9  | A-13: a flight through unexplored tiles       | a green path through them    | VCMI (and the engine): none |
# | E5-11 | a flight over a Border Gate without its key   | a path over the gate         | no other source states it   |
#
# Every hero's army is 10 Pikemen (speed 4: 1560 points, native to grass, the map's terrain); no
# hero has a skill. A flight costs 100 per straight step from an inland tile (§2.1), so each
# walk's points count its steps.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact; note a worn artifact the spec does not give under "anything odd".

[map]
name = "E08 batch E5b"
description = "Engine-generated experiment map (E08, batch E5b): where a flying or water-walking hero may go: over trees, water, unexplored tiles and a Border Gate. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-5b.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1).",
    "A click on a tile shows the hero's path (arrows and a cross on the tile clicked); a second click on the same tile makes the hero go. Each walk below is one such pair of clicks on the tile named; note the colour of the target's mark (green, red, or none when no path shows), the number of marks, whether the hero arrived and its movement points after it (the harness reads them from memory: clients/capture/batches/E08-batch-5b.toml). Whether a tile is explored for Red shows only in the game's memory (the harness reads it); by hand, whether the tile is black.",
    "Order: day 1, Red's turn: E5-9 first (nothing else may move before it: its strip must stay unexplored), then E5-7a, E5-7b and E5-11, each as its encounter says. Then the map is done: one day, no battle. Blue's hero never moves.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


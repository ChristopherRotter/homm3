# --- A-13: a flight through unexplored tiles ---------------------------------------------------

[[encounter]]
id = "E5-9"
title = "A flight over a strip of unexplored land"
questions = ["A-13", "ADV-MOV-008", "ADV-MOV-009"]
procedure = [
    "Day 1, Red's turn, before any other hero moves: E5-9 (Angel Wings worn) stands on (5, 24), the walker E5-9w (no artifact) on (5, 26), the scout E5-9s on (21, 24). Each explored around itself at the start (radius 5); between them columns 11 to 15 stay unexplored (black) on rows 19 to 31. Nothing else of Red's is near.",
    "Read whether (13, 24), in the strip's middle, and (18, 24), near the scout, are explored for Red (the harness, from memory).",
    "Control first: select E5-9w and click (18, 26) (east of the strip, explored by the scout): note the target's mark and the number of marks; click it again and note whether E5-9w moved.",
    "Then select E5-9 and click (18, 24): note the target's mark and the number of marks; click it again and note where it arrived and its points.",
]
record = [
    { field = "(13, 24) explored before the clicks (yes/no)" },
    { field = "(18, 24) explored before the clicks (yes/no)" },
    { field = "E5-9w's mark at (18, 26)" },
    { field = "E5-9w's marks" },
    { field = "did E5-9w move (yes/no)" },
    { field = "E5-9's mark at (18, 24)" },
    { field = "E5-9's marks" },
    { field = "did E5-9 arrive (yes/no)" },
    { field = "E5-9's points after" },
    { field = "anything odd" },
]
predictions = """
- The strip: (13, 24) **not explored**, (18, 24) **explored** (the reveal's radius 5 around each
  hero, ADV-FOG-002: dx^2 + dy^2 <= 30; columns 11 to 15 lie beyond both). If (13, 24) is
  explored, the row says nothing: report it.
- **The control, every source**: a walking hero's path never enters an unexplored tile (the
  reading: `pathfinder_fog_test` 0x4B25D4 makes it blocked, which only a flyer passes; VCMI; the
  user's observation behind ADV-FOG-005): **no mark, no move**.
- **The reading** (survey §3.1 point 3, A-13): an unexplored tile is passable only flying, so
  E5-9's path runs straight east through the strip: **a green mark, 13 marks**; it **arrives**
  on (18, 24) with **260** points (13 x 100 from 1560).
- **VCMI 1.7.5** (unexplored tiles blocked in every layer) and the engine (A-13 fixed, decision
  75): **no path**, as the walker.
- A path that goes around the strip cannot exist (the strip spans the explored areas' rows).
"""
[encounter.hero]
type = "Sorsha"
specialty = "creature Swordsman"
at = [5, 24]
primary = [1, 1, 1, 1]
army = [["Pikeman", 10]]
artifacts = { "shoulders" = "Angel Wings" }
[[encounter.also]]
type = "Tyris"
specialty = "creature Cavalier"
name = "E5-9w"
at = [5, 26]
primary = [1, 1, 1, 1]
army = [["Pikeman", 10]]
[[encounter.also]]
type = "Rion"
specialty = "skill First Aid"
name = "E5-9s"
at = [21, 24]
primary = [1, 1, 1, 1]
army = [["Pikeman", 10]]

# --- D-25: where a flight or a water walk may end ----------------------------------------------

[[encounter]]
id = "E5-7a"
title = "Angel Wings: a tree beyond a tree line, then the free tile before it"
questions = ["D-25", "ADV-MOV-009"]
procedure = [
    "Day 1, Red's turn, after E5-9: select E5-7a (Angel Wings worn) on (7, 8). Two rows north of it a line of trees (row 6, columns 3 to 11); beyond it the free tile (7, 5) and a tree on (7, 4).",
    "Walk 1: click the tree on (7, 4): note the target's mark and the number of marks; click it again and note whether the hero moved.",
    "Walk 2: click (7, 5): note the mark and the number of marks; click it again, note where the hero arrived and its points.",
]
record = [
    { field = "points before the walks" },
    { table = ["walk", "mark", "marks", "arrived", "hero's tile", "points after"], labels = [
        "1 the tree on (7, 4)",
        "2 the free tile (7, 5)",
    ] },
    { field = "anything odd" },
]
predictions = """
- 1560 points.
- **Walk 1, every source** (the reading's second reading §3.4: a move ends only on a node that
  may stop, never over a blocked tile; the wiki: "to an unoccupied map location"; VCMI: a flyer
  lands on free tiles): **no mark, no move**, the hero stays on (7, 8) with 1560.
- **Walk 2, every source**: a flyer passes over the blocked tree on (7, 6): **a green mark, 3
  marks**, it arrives on (7, 5) with **1260** (3 x 100).
- A path to the tree on (7, 4): D-25 reopened (a flight may end over a blocked tile).
"""
[encounter.hero]
type = "Orrin"
specialty = "skill Archery"
at = [7, 8]
primary = [1, 1, 1, 1]
army = [["Pikeman", 10]]
artifacts = { "shoulders" = "Angel Wings" }

[[encounter]]
id = "E5-7b"
title = "Boots of Levitation: a water tile, then the shore beyond the lake"
questions = ["D-25", "ADV-MOV-010"]
procedure = [
    "Day 1, Red's turn: select E5-7b (Boots of Levitation worn) on (25, 7), the lake's south shore (the lake covers rows 4 to 6, columns 20 to 30).",
    "Walk 1: click (25, 5), water in the lake's middle: note the target's mark and the number of marks; click it again and note whether the hero moved.",
    "Walk 2: click (25, 3), land beyond the lake: note the mark and the number of marks; click it again, note where the hero arrived and its points.",
]
record = [
    { field = "points before the walks" },
    { table = ["walk", "mark", "marks", "arrived", "hero's tile", "points after"], labels = [
        "1 the water tile (25, 5)",
        "2 the shore (25, 3)",
    ] },
    { field = "anything odd" },
]
predictions = """
- 1560 points.
- **Walk 1, every source** (§3.4: a water-walking move never ends on water; the wiki: "provided
  the end destination is an unoccupied location on land"; VCMI: never a turn on water): **no
  mark, no move**.
- **Walk 2, every source**: across the lake: grass onto water 100, two water steps 100, onto
  the shore 100: **a green mark, 4 marks**, it arrives on (25, 3) with **1160**.
"""
[encounter.hero]
type = "Edric"
specialty = "creature Griffin"
at = [25, 7]
primary = [1, 1, 1, 1]
army = [["Pikeman", 10]]
artifacts = { "feet" = "Boots of Levitation" }

# --- E5-11: a flight over a Border Gate without its key ---------------------------------------

[[encounter]]
id = "E5-11"
title = "Angel Wings over a light blue Border Gate whose key Red lacks"
questions = ["E5-11", "ADV-MOV-009", "ADV-VIS-005"]
procedure = [
    "Day 1, Red's turn: select E5-11 (Angel Wings worn) on (31, 16). Two rows north of it the light blue Border Gate: its entrance (31, 14) between its two blocked sides (30, 14) and (32, 14). Red holds no key.",
    "Click (31, 12), the free tile two rows beyond the gate: note the target's mark, the number of marks and the tiles the path crosses on row 14; click it again, note where the hero arrived, its points and any message (a locked gate's).",
]
record = [
    { field = "points before the walk" },
    { field = "the mark at (31, 12)" },
    { field = "marks" },
    { field = "the path's tile on row 14" },
    { field = "arrived (yes/no)" },
    { field = "hero's tile after" },
    { field = "points after" },
    { field = "a message (its text)" },
    { field = "anything odd" },
]
predictions = """
- 1560 points.
- **The reading** (survey §3.1 point 7: a flying node reaching an entrance is also stored without
  "may stop", so the flight goes on over it without the visit; the move visits only its
  destination, 0x48147D to 0x4814E1): the cheapest path runs straight north **over the gate's
  entrance (31, 14)**: **a green mark, 4 marks**, it **arrives** on (31, 12) with **1160** (4 x
  100), **no message**.
- **The gate closes the flight at its entrance** (a flyer's step onto it only a visit): the path
  crosses row 14 over a blocked side, (30, 14) or (32, 14), with two diagonals: 4 marks, **1078**
  (100 + 141 + 141 + 100).
- **The walk stops at the gate**: E5-11 stays on (31, 15) with 1460 and the locked gate's message
  (the visit from the tile before).
- No other source states the case (the wiki's Border Gate page, VCMI: not looked at for a flyer;
  design note §13): an answer the engine's passage table rests on (T41).
"""
[encounter.hero]
type = "Adela"
specialty = "spell Bless"
at = [31, 16]
primary = [1, 1, 1, 1]
army = [["Pikeman", 10]]
artifacts = { "shoulders" = "Angel Wings" }


# increment 12's plan, the garrisons (survey docs/rules/surveys/E08-garrisons-bonuses.md §12;
# docs/epics/E08-design.md §18), in SoD on Easy, hot seat, day 1 (Red's turn, then Blue's). Batch
# E12b (`E08-batch-12b`) is the bonus visitables. Build: docs/experiments/README.md. Predictions are
# for the agent who evaluates the results; the template never shows them.
#
# | row   | settles                                    | the reading (faithful)                        | the other source(s)                     |
# | E12-1 | §7, D-59: a move through its own garrison  | the path through, no dialog on the way; the   | VCMI: the path through, but the move    |
# |       | (a vertical one, 219 loaded as 33)         | exchange only at a move's end there           | stops at it, the dialog mid-move        |
# | E12-2 | §3, §7, D-59: an empty neutral garrison on | no path beyond it; the path to it ends there, | VCMI: an empty garrison crossed (the    |
# |       | the way                                    | the visit flags it Red's, the exchange opens  | path beyond, flagged on the way)        |
# | E12-3 | §6, D-61: an own garrison not removable    | a move into an empty slot only; the merge and | VCMI and the wiki the same (added, not  |
# |       |                                            | the takes refused                             | removed)                                |
# | E12-4 | §4, D-60, design §14: a hero standing in   | attacked there: no cast for either side;      | VCMI: casts allowed (BLOCK_ALL_MAGIC on |
# |       | an anti-magic garrison                     | attacking out of it: casts allowed            | the garrison's own army only)           |
# | E12-5 | §2, §5: the flag's reveal, radius 3        | the disk dx² + dy² ≤ 12 around the entrance   | VCMI the same (sight radius 3)          |
# | E12-6 | §3 to §5: a neutral garrison won           | no question, its army unsplit; then Red's,    | VCMI the same                           |
# |       |                                            | empty, the hero on the entrance, the exchange |                                         |
#
# **E12-5's read** (decision 314, the user at T109b's start): the capture's reveal (radius 3 around
# the entrance, `garrison_set_owner` 0x4C6960) lies inside the capturing hero's own (radius 5 from
# the entrance it stands on), so no capture shows it. The same call (`reveal_disk` 0x49D160, radius
# 3) reveals an owned garrison's surroundings for its owner at the game's start (`reveal_owned`
# 0x4C7C50, survey §2): E12-5 reads that, around a Red garrison far from every Red hero.
#
# **The pictures** (docs/experiments/README.md, "Increment 12's objects"): the horizontal garrisons
# `AVCgar10` and `AVCgar20` (anti-magic) block `at` and the two tiles west of it, entered at the
# middle one from the three tiles above it or the three below; the vertical `AVCvgr` blocks `at`
# and the two tiles above it, entered at the middle one from the column left of it or the column
# right (the original loads AB's 219 as 33; survey §2).
#
# **The heroes.** Red has five, Blue three (Blue's third far from everything, so that Blue is not
# defeated when the other two fall). A step costs 100 on grass, 141 diagonally (priced by hand: the
# garrisons import as blockers until T113b, so no reach query prices a step onto one); ten
# Archangels give 2 000 land points a day, an army whose slowest is a Pikeman or an Archer 1 560
# (packs/base/adventure.toml `land_points`); a hero's scouting radius is 5 (ADV-FOG-002: dx² + dy² ≤
# 30), so every target is explored at its click. No hero has a skill or an artifact but the spell
# books of E12-4.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or a resource; an artifact on a moving hero goes under "anything odd".


# Experiment batch TWN-2 (E09 T14a; decisions 41, 42): two rows of increment 2's survey (survey
# docs/rules/surveys/E09-construction.md §1, §6, §11, §12; docs/epics/E09-design.md §33), the
# hall's build, in SoD on Easy, hot seat. Build: docs/experiments/README.md. Predictions are for the
# agent who evaluates the results (T14c, as the survey's §13 for TWN-1); the template never shows
# them. "The reading" is the survey's code reading of Heroes3.exe (the engine follows it,
# faithful); VCMI's is VCMI 1.7.5 as the survey summarises it.
#
# | row     | settles                  | the reading                         | otherwise                   |
# | TWN-2-1 | TD-9 (§6): the Conflux's | refused without the upgraded Altar  | VCMI: the Altar of Fire and |
# |         | upgraded Altar of Fire   | of Air (38): the text names it;     | the Altar of Air (31) only; |
# |         | (40)                     | built in the control town           | the wiki: the Altar of Fire |
# | TWN-2-2 | TD-11 (§1.1, §1.4): an   | built (no owner test on the hall's  | VCMI: the owner only        |
# |         | ally's visitor at the    | path), paid from the visitor's      | (`throwIfWrongOwner`); no   |
# |         | hall                     | player's treasury                   | source on building          |
#
# **The towns** (`[[map.town]]`, custom sets by name; the map's bits name the levels, the game's
# ids below): three towns on map row 7, the entrances 10 columns apart from column 7, each with a
# hero of Red's on the tile south of its entrance. C1 (7, 7) and C2 (17, 7) Red's Conflux, B1
# (27, 7) Blue's Castle with a Fort only. Red and Blue are one team (`teams`); both human. Blue's
# hero TWN-2-2b stands far off at (27, 30) and never moves (a player without a hero is offered no
# Artifact as its starting bonus, which moved the harness's choice of Gold off its place). T1
# (7, 30) is Tan's Castle (a computer player, alone on its team): without an enemy the game
# declares Red's victory at the first visit's end (seen in T14b's probe).
#
# **The building ids** (the game's; a town's standing set +0x150 and every-built set +0x158 hold a
# bit per id; the Conflux's requirements: survey §6, the executable's list): 0 Mage Guild 1, 5
# Tavern, 7 Fort, 10 Village Hall (always), 23 the Conflux's hall companion of 10 (built with it,
# survey E09-towns.md §16.2 (4)), 30 Magic Lantern (needs 7), 31 Altar of Air (30, 0), 33 Altar of
# Fire (31), 38 the upgraded Altar of Air (31), 40 the upgraded Altar of Fire (33, 38). C1: 0, 7,
# 30, 31, 33 (the closure of 33, without 38); C2: the same and 38. The hall's level-4 slot shows
# 40 once 33 stands (survey §1.2).
#
# **The costs** (`Building.txt`, wood, mercury, ore, sulfur, crystal, gems, gold): 40 0, 5, 5, 0,
# 0, 0, 2 000; 5 (the Castle's Tavern) 5, 0, 0, 0, 0, 0, 500. Easy's starting resources pay both.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus (gold, an artifact or
# a resource) moves the treasuries, so each treasury is read right before and right after a build.

[map]
name = "E09 batch TWN-2"
description = "Engine-generated experiment map (E09, batch TWN-2): the hall's build of the Conflux's upgraded Altar of Fire without the upgraded Altar of Air, with a control town; an allied visitor's build in the ally's town. Hot seat, Red and Blue human and allied, Tan the computer, difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
teams = [["red", "blue"]]
instructions = [
    "Copy `E09-batch-2a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, Red and Blue both human (one team: the map's alliance), Tan the computer, difficulty **Easy**. Before you start it, compare the stamp at the start of the map's description with the stamp above.",
    "The records are the game's memory: a town's record (game +0x21614, 0x168 bytes each, `docs/exe/structs.toml`): its day's mark +0x2 (survey E09-construction.md §3), its standing set +0x150 and every-built set +0x158 (a bit per building id); a player's resources (the player record +0x9C: wood, mercury, ore, sulfur, crystal, gems, gold). The capture harness reads them (`clients/capture/batches/E09-batch-2a.toml`, E09 T14b). Played by hand, the sets show in the town screen and the resources in the kingdom's bar.",
    "Tiles are (column, row) from 0 at the top left; a town's entrance is the tile its gate stands on. A step: click the target once (the path's marks show), then again (the hero goes). The hall: on the town screen, the Village Hall's building (or its successor's); in the hall, a building's slot; in its dialog, the Build button.",
    "Order: day 1, Red's turn, before any hero moves: the reads of TWN-2-1, then its two visits; then TWN-2-2. Close each town screen before the next step.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]

# --- the towns --------------------------------------------------------------------------------

[[map.town]]  # C1: the Altar of Fire without the upgraded Altar of Air
entrance = [7, 7]
faction = "conflux"
owner = "red"
buildings = ["fort", "mage guild 1", "dwelling 1", "dwelling 2", "dwelling 4"]

[[map.town]]  # C2: the control, with the upgraded Altar of Air
entrance = [17, 7]
faction = "conflux"
owner = "red"
buildings = ["fort", "mage guild 1", "dwelling 1", "dwelling 2", "upgraded dwelling 2", "dwelling 4"]

[[map.town]]  # B1: Blue's, a Fort only
entrance = [27, 7]
faction = "castle"
owner = "blue"
buildings = ["fort"]

[[map.town]]  # T1: Tan's (the computer's), the enemy; no hero comes near it
entrance = [7, 30]
faction = "castle"
owner = "tan"
buildings = ["fort"]

# --- TWN-2-1: the upgraded Altar of Fire without the upgraded Altar of Air ---------------------

[[encounter]]
id = "TWN-2-1"
title = "The Conflux's upgraded Altar of Fire (40): C1 without the upgraded Altar of Air (38), C2 with it"
questions = ["TD-9", "TWN-BLD-002", "TWN-BLD-007"]
procedure = [
    "Red's turn, day 1, before any hero moves. Read C1's (entrance (7, 7)) and C2's (17, 7) standing and every-built sets and day's marks, and Red's resources.",
    "C1: Red's hero TWN-2-1 stands south of it at (7, 8). Step north onto the entrance (the town screen opens). Open the hall (a click on the hall's building); the level-4 slot shows the upgraded Altar of Fire. Note the slot's look (built, buildable, not now, never). Click the slot: note whether the dialog's Build button is enabled or greyed and which buildings the text under it names. Press Build (a greyed one does nothing) and note what shows then; close what is left open (the dialog by its cancel, the hall, the town screen). Read C1's sets and mark, and Red's resources.",
    "C2: Red's hero TWN-2-1c stands south of it at (17, 8). The same: step in, the hall, the level-4 slot, its dialog (Build's state, the text), Build pressed, what shows then, the screens closed. Read C2's sets and mark, and Red's resources.",
]
record = [
    { field = "before: C1's standing and every-built sets, its mark; C2's the same; Red's resources" },
    { field = "C1: the screen after the hall's click; the level-4 slot's look" },
    { field = "C1: the slot's dialog: Build (enabled or greyed); the text (its record, the buildings it names)" },
    { field = "C1: the screen after Build pressed" },
    { field = "C1 after the visit: its standing and every-built sets, its mark; Red's resources" },
    { field = "C2: the screen after the hall's click; the level-4 slot's look" },
    { field = "C2: the slot's dialog: Build (enabled or greyed); the text (its record, the buildings it names)" },
    { field = "C2: the screen after Build pressed" },
    { field = "C2 after the visit: its standing and every-built sets, its mark; Red's resources" },
    { field = "anything odd" },
]
predictions = """
Before: C1 standing and every-built {0, 7, 10, 23, 30, 31, 33} (23 the Conflux's companion of the
Village Hall, as batch TWN-1 found it in the Conflux's standard sets; its absence from a custom set
is no part of this row), C2 the same and 38 (whether 31 still stands beside 38 is the setup's,
not this row's; the every-built set holds it either way); both marks 0.
- **The reading** (survey §1.3, §1.4, §6: the list 0x63EC80 gives 40 the requirements 33 and 38;
  `build_dialog_requirements_text` 0x5D5BE0 names the requirement set less the every-built set):
  **C1** the slot not now but still buildable (the set's other look, `town_build_possible` true),
  **Build disabled**, the text names **the upgraded Altar of Air** (38) and nothing else; Build
  pressed does nothing: the sets, the mark (0) and Red's resources unchanged. **C2** the slot
  buildable, **Build enabled**, no requirement named; pressed: the standing set **40 in, 33 out**
  (`town_build` §16.2 (1): 40 supersedes 33), the every-built set **40 added** (33 stays), the
  mark **1** (§3: a human's team), Red's resources **2 000 gold, 5 ore and 5 mercury less**.
- **VCMI** (40 needs 33 and the base Altar of Air 31, which C1 holds) and **the fandom wiki** (40
  needs 33 alone): C1 as C2: Build enabled and the building built, 2 000 gold, 5 ore, 5 mercury
  paid. The control C2 is built under every source; a C2 not built points at the setup (the sets
  or the resources), not at TD-9.
"""
[encounter.hero]
type = "Caitlin"
specialty = "resource gold"
at = [7, 8]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
[[encounter.also]]
type = "Jenova"
specialty = "resource gold"
name = "TWN-2-1c"
at = [17, 8]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]

# --- TWN-2-2: an ally's visitor at the hall ----------------------------------------------------

[[encounter]]
id = "TWN-2-2"
title = "An allied visitor's build: Red's hero in Blue's town (Red and Blue one team), the hall's Tavern"
questions = ["TD-11", "TWN-BLD-001"]
procedure = [
    "After TWN-2-1, in the same turn (Red's, day 1). Blue's Castle B1 (a Fort only) has its entrance at (27, 7); Red's hero TWN-2-2 stands south of it at (27, 8). Read B1's standing and every-built sets and mark, and both players' resources.",
    "Step north onto the entrance: Red's hero enters its ally's town (a town screen: yes/no). Open the hall (what shows then); the Tavern's slot shows the Tavern. Note the slot's look; click it: note whether Build is enabled or greyed and what the text says. Press Build and note what shows then; close what is left open (the dialog by its cancel, the hall, the town screen).",
    "Read B1's standing and every-built sets and mark, and both players' resources.",
]
record = [
    { field = "before: B1's standing and every-built sets, its mark; Red's resources; Blue's resources" },
    { field = "the step: a town screen (yes/no)" },
    { field = "the screen after the hall's click; the Tavern's slot's look" },
    { field = "the Tavern's dialog: Build (enabled or greyed); the text (its record, the buildings it names)" },
    { field = "the screen after Build pressed" },
    { field = "after the visit: B1's standing and every-built sets, its mark; Red's resources; Blue's resources" },
    { field = "anything odd" },
]
predictions = """
Before: B1 standing and every-built {7, 10}, the mark 0.
- **The reading** (survey §1.1: the town screen opens at an ally's visit and no step of the hall's
  path tests the owner; §1.3: the slots' paid test reads the current player's resources; §1.4:
  Build takes the cost from the current player's record, 0x5D679C): a town screen, the hall
  opens, the Tavern's slot buildable, **Build enabled**; pressed: B1's standing and every-built
  sets **5 added**, the mark **1**, **Red's resources 500 gold and 5 wood less, Blue's
  unchanged**.
- **VCMI** (`visitBuildStructure`: `throwIfWrongOwner`; the owner pays): **not built**, both
  treasuries and B1's sets unchanged (where the refusal shows, the hall or the Build, is not read).
- **A third outcome** to tell apart: built but paid from Blue's treasury (the owner's, as the
  computer's buy pays, survey §2.3).
"""
[encounter.hero]
type = "Octavia"
specialty = "resource gold"
at = [27, 8]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
[[encounter.also]]
type = "Aine"
specialty = "resource gold"
owner = "blue"
name = "TWN-2-2b"
at = [27, 30]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]

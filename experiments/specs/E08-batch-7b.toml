# Experiment batch E7b (E08 T56; decisions 129, 131, 132, 139, 141, 142): rows E7-12 to E7-23 of
# increment 7's plan (survey docs/rules/surveys/E08-rewards.md §11; docs/epics/E08-design.md §18),
# Pandora's Box, events and the Pyramid, in SoD on Easy, hot seat, on one map. Build:
# docs/experiments/README.md. Predictions are for the agent who evaluates the results; the
# template never shows them.
#
# | row   | settles                                | the reading (faithful)                           | the other source(s)                     |
# | E7-12 | D-37: a box's skill the hero knows     | Basic + Advanced: Advanced                       | VCMI: Expert                            |
# | E7-13 | D-38: a box's mana past the maximum    | 100 + 500 = 600                                  | VCMI: 100                               |
# | E7-14 | D-39: the Learning and the experience  | 1 000 (the Learning before the box's)            | VCMI: 1 150                             |
# | E7-15 | D-39: the spells before the level      | the level-3 spell not learned                    | VCMI: the level-up first, learned       |
# | E7-16 | D-40: the Pyramid's golems             | a weak army: 5 (or 4) Gold stacks, two Diamond   | VCMI: one stack of 40; the wiki silent  |
# |       |                                        | of 10 (E7-22's strong army: one Gold stack)      |                                         |
# | E7-17 | §7.3: an event's stop and colours      | Red's fires, the hero stays on it; Blue's does   | consensus (VCMI, the wiki)              |
# |       |                                        | nothing, the hero stands on it                   |                                         |
# | E7-18 | §7.3: an event that stays              | +100 twice; the event stays                      | consensus                               |
# | E7-19 | §7.4: a box's artifact, full backpack  | lost; the box removed                            | VCMI: no full backpack                  |
# | E7-20 | §7.4: a box's creatures without room   | one army dialog with the three; two lost         | VCMI the same                           |
# | E7-21 | §7.5: a looted Pyramid, twice          | −2 luck after both (not −4), 0 after the battle  | VCMI: −2 per visit?; the wiki: −2       |
# | E7-22 | §7.5: the Pyramid's spell, no Expert   | lost; the Pyramid looted                         | the wiki the same                       |
# |       | Wisdom                                 |                                                  |                                         |
# | E7-23 | A-23: a path and a hidden event        | paths never cross an event: around it in the     | VCMI and the engine: through it         |
# |       |                                        | open; no path past it in a dead-end corridor     |                                         |
#
# **The bans** (D-39's row E7-15): the map bans every secondary skill but Wisdom and Learning, so
# a level-up offers only those two (and E7-14's box teaches an allowed skill: a box's skills are
# not tested against the bans, but nothing here depends on that). Every level-up of the map
# therefore offers Wisdom or Learning; each encounter says which to take.
#
# **The Pyramid's order** (E7-16, E7-22, E7-21 on Blue's turn): the weak hero fights and retreats
# (the Pyramid stays guarded and keeps 40 and 20), the strong hero wins it (looted), then E7-21
# visits the looted Pyramid twice.
#
# **E7-23's corridor** is a dead end: rock north, south and east of the row (10, 30) to (20, 30),
# open only to the west; the event at (14, 30) is Red's, so Blue's hero would not fire it. A path
# to (15, 30) must cross the event's tile or not exist.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or resources. The template asks for gold; an artifact the spec does not give goes under
# "anything odd", and the treasury is read before and after each visit, never across a day's start.


# --- TWN-6-8: the stock ------------------------------------------------------------------------------

[[encounter]]
id = "TWN-6-8"
title = "The Artifact Merchants' stock on day 1 and day 29, 18 of the 21 minors placed (§3.1, §3.2, D-32)"
questions = ["D-32", "ADV-OBJ-006", "TWN-STK-001", "TWN-STK-002"]
procedure = [
    "Red's turn, day 1, before any hero moves. Note the merchants' seven by class (the window at T shows them).",
    "Set Red's gold to 100 000. TWN-6-8 stands south of T at (7, 9): walk onto the entrance (7, 7). On the town screen click the Artifact Merchants; pick the first entry and gold, note its price; press Trade. Note the entries, Red's treasury and TWN-6-8's artifacts. Close the window and the town.",
    "End both players' turns until Red's day 29 (month 2, week 1, day 1). Note the date and the merchants' seven by class.",
]
record = [
    { field = "day 1: the seven (name; class)" },
    { field = "day 1: the first entry with gold: the price; after Trade: the entries; Red's treasury; TWN-6-8's artifacts" },
    { field = "day 29: the date; the seven (name; class)" },
    { field = "anything odd" },
]
predictions = """
- **The reading** (§3.1: the given marks start as the bans, then every Artifact object marks its
  artifact; the seven are drawn last at the new game by `random_artifact_of_level`, entries 0 to 2
  a treasure, 3 to 5 a minor, 6 a major, each draw marked; §3.2: on the first day of every month
  from the second, all seven redrawn, sold or not, the old marks kept): **day 1**: three distinct
  treasures, **the three minors the map does not place (Rib Cage, Ring of Life, Boots of Speed, in
  the draw's order)**, one major; none of the 18 placed. The purchase (Red's count 1: 2.5 times the
  cost in gold, E08 §4) empties entry 0 (-1) and puts the treasure on TWN-6-8. **Day 29** (month
  2): seven again, **entry 0 refilled**; three treasures none of day 1's (34 left in the pool),
  three minors drawn from **all 21** (the minors' pool empty, so their marks reset to the bans:
  placed ones possible, day 1's possible), one major not day 1's.
- **VCMI** (§9, D-32): the bans and the combinations excluded, the least rolled first, **placed
  artifacts not excluded**: day 1's minors any three of the 21; the same redraw each month.
"""
[encounter.hero]
type = "Orrin"
specialty = "skill Archery"
at = [7, 9]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]

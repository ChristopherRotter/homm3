# Experiment batch TWN-6, part c (E09 T54; design note §117, survey
# docs/rules/surveys/E09-trades.md §11 row TWN-6-8): the Artifact Merchants' stock at the new game
# and on the first day of the second month, on a map that places 18 of the 21 minor artifacts
# (§3.1, §3.2; E08's D-32); in SoD on Easy, hot seat, from Red's day 1 to Red's day 29. Parts a, b
# and d: `E09-batch-6a.toml`, `-6b.toml`, `-6d.toml`. Build: docs/experiments/README.md.
# Predictions are for the agent who evaluates the results; the template never shows them. "The
# reading" is the survey's code reading of Heroes3.exe; VCMI's is VCMI 1.7.5 as the survey
# summarises it (§9).
#
# | row     | settles             | the reading                          | otherwise                   |
# | TWN-6-8 | §3.1, §3.2 (D-32)   | day 1: 3 treasures, the 3 minors the | VCMI: placed artifacts not  |
# |         |                     | map does not place, 1 major; day 29: | excluded (any 3 minors);    |
# |         |                     | seven again, the bought entry too,   | the same month's redraw     |
# |         |                     | minors from all 21 (the pool reset)  |                             |
#
# **The map** (36 x 36, grass): 18 of the 21 minors (SoD's `ARTRAITS.TXT` class N) stand as
# Artifact objects (class 5) in two rows south of the towns, (2, 20) to (18, 20) and (2, 22) to
# (18, 22), every second column; Rib Cage, Ring of Life and Boots of Speed are not placed. Nothing
# else draws an artifact: no random artifact, Black Market, chest, corpse, wagon, tomb, Pandora's
# Box or event, and the starting bonus is gold. Red owns T (7, 7), a Tower with the Marketplace and
# the Artifact Merchants (Red's count 1); Blue owns B (23, 7), a Castle with a Fort (each player
# keeps a town over the month). No hero stands on an entrance; no main town.

[map]
name = "E09 batch TWN-6c"
description = "Engine-generated experiment map (E09, batch TWN-6, part c): the Artifact Merchants' stock on day 1 and day 29, with 18 of the 21 minor artifacts placed on the map. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E09-batch-6c.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, Red and Blue both human, difficulty **Easy**, both players' starting bonus Gold. Before you start it, compare the stamp at the start of the map's description with the stamp above.",
    "The records are the game's screens and memory (the capture harness, `clients/capture/batches/E09-batch-6c.toml`, E09 T54): the Artifact Merchants' seven (game +0x1F664, i32[7], -1 an entry bought), the trade window's entries and price, the players' treasuries, a hero's artifacts, the date. Played by hand the seven show at T's merchants.",
    "Tiles are (column, row) from 0 at the top left; a town's entrance is the tile its gate stands on. A step: click the target once (the path's marks show), then again (the hero goes).",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


# Experiment batch 2 (E08 T16b; the user, 2026-10-13): the points left after a step (D-3,
# ADV-Q3) and the amounts of random resource piles (D-5, ADV-Q10). Both were settled by the code
# reading before this batch (the user chose the reading: ADV-Q3 on 2026-10-11, ADV-Q10 on
# 2026-10-12); the batch confirms them in the original or refutes them.
# Build: see docs/experiments/README.md. Predictions are for the agent who evaluates the results;
# the template never shows them. "The reading" is the code reading in
# docs/rules/surveys/E08-adventure-core.md §1.3 (D-3: 0x481182 sets the points left to 0 when
# they are fewer than the cheapest straight step from the new tile, 0x4B1880: its road's cost,
# else 100) and docs/rules/surveys/E08-objects.md §3.1 (D-5: 0x4C1AD1 draws 5-10 wood or ore and
# 3-6 of a rare resource at setup), which the engine builds (ADV-MOV-006, ADV-PIK-001). Costs from
# packs/base/adventure.toml: sand and snow 150, grass 100 (native to Castle creatures, 100 anyway),
# a step from terrain onto a road priced by the terrain left, road to road 50 (cobblestone) or 75
# (dirt); an army of Angels (speed 12) has 2000 points a day (ADV-MOV-001, -002). A throwaway run
# of the compiled map through h3-map's reader and import and the engine (seeds 1 to 3) gave every
# prediction marked "the reading" below: the reachable-tiles query's path to each D-3 destination
# straight east, D3a 50 points and a further road step to 0, D3b 0 and no step, D3c 100, D3d 0;
# 16 random wood and 16 random mercury piles, each collector spending 1246 of 2000 points in the
# procedure's order, the amounts within 5-10 and 3-6 (E08 T16b, E08-log.md).
#
# D-3 (Red, day 1): four walkers with one Angel each (not native to sand or snow: ADV-MOV-004), no
# skills, no artifacts, walk 13 steps straight east on their row; no diagonal step anywhere (the
# diagonal exception, ADV-MOV-006, A-2/A-3, stays out of the way). The original's path preview
# (0x56B440) does not apply the drop to 0, so the observation is the walk: where the hero stops and
# the points it shows. Two scouts (heroes that never move) explore the walkers' rows beyond the
# destinations, so each destination can be clicked from the start. Map: sand; a grass band for the
# piles; single tiles of grass (D3c's start) and snow (the D3c and D3d destinations, a marker that
# prices as sand).
# D-5 (Blue, day 1): 16 random wood piles and 16 random mercury piles, two rows of four on either
# side of each of four collectors (one Angel each, on grass).

[map]
name = "E08 batch 2"
description = "Engine-generated experiment map (E08, batch 2): the points left after a step, random resource piles. Hot seat, Red and Blue human; follow the results template."
size = 72
terrain = "sand"
instructions = [
    "Copy `E08-batch-2.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1), and again at the start of Blue's turn (save 2). If a walk or a pickup goes wrong (a wrong tile clicked), load the save before it and do the encounters of that turn again.",
    "Move only the hero an encounter names, and only as it says; the scouts never move.",
    "A click on a tile shows the hero's path (arrows and a cross on the tile clicked); a second click on the same tile makes the hero go. Read a hero's movement points left as you did in batch 1a.",
    "Order: day 1, Red's turn: D3a, D3b, D3c and D3d in any order; end the turn. Day 1, Blue's turn: save 2, then D5w and D5m. Then the map is done: one day, no battle.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


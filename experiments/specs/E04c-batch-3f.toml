# --- BAT-SIE-021: a war machine's share of its army ----------------------------------------------

[[encounter]]
id = "BA"
title = "The attacker's Ballista or a hundred Zombies"
questions = ["BAT-SIE-020", "BAT-SIE-021", "BAT-SIE-022"]
procedure = [
    "Every stack defends; the keep shoots on its own (Red has no Artillery: its Ballista shoots on its own too).",
    "Play to round 2, noting the keep's targets, then end the battle as you like.",
]
predictions = """
No desperate mode (30 Swordsmen). The Ballista shoots (divisor 1); the Zombies walk, behind the
walls (a fifth). The Ballista's worth is its Fight Value times the army's other hit points over
its own and theirs: 650 x 2000 / 2250 = 577.8.
- The code: the Ballista 15 x 577.8 / 250 = 34, the Zombies 15 x 160 / 20 = 120, a fifth: 24:
  **the Ballista**.
- VCMI (a stack that is no war machine first) and the wiki's classes (Zombies C: 33 % of 6.4,
  the Ballista A: 2.4): the Zombies (slot 0).
"""
[encounter.hero]
type = "Clavius"
specialty = "resource gold"
at = [18, 28]
primary = [0, 0, 1, 1]
army = [["Zombie", 100]]
artifacts = { "war machine 1" = "Ballista" }
[encounter.opponent.town]
faction = "Castle"
buildings = ["fort", "citadel"]
garrison = [["Swordsman", 30]]
[[encounter.record]]
field = "BA1: the keep's count; the keep's shot in rounds 1 and 2: the stack it hit (slot, the Ballista or the Catapult) and the hit points it lost"
[[encounter.record]]
field = "anything odd"

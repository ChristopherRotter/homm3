# Experiment batch TWN-4, part b (E09 T34; design note §78, survey
# docs/rules/surveys/E09-tavern.md §2.3, §4, §9 rows TWN-4-3, -4 and -5): the heroes that leave
# the game (a retreat, a surrender, a loss), the week that keeps a returning offer, and a
# dismissed hero drawn again, in SoD on Easy, hot seat. Parts a and c (`E09-batch-4a.toml`,
# `-4c.toml`) hold the other rows. Build: docs/experiments/README.md. Predictions are for the agent
# who evaluates the results; the template never shows them. "The reading" is the survey's code
# reading of Heroes3.exe (the engine follows it, faithful; TD-18 to TD-20 the reading, decisions
# 103 to 107; T-16 `TWN-QUIRK-12`, on in `faithful`); VCMI's is VCMI 1.7.5 as the survey
# summarises it (§7, §8).
#
# | row     | settles          | the reading                              | otherwise              |
# | TWN-4-3 | §4, TD-18        | a hero fled after its owner's turn ended | VCMI: both cleared at  |
# |         |                  | that day is kept at the week; one fled   | the week               |
# |         |                  | in its owner's turn is released          |                        |
# | TWN-4-4 | §4               | the surrendered with its army, the fled  | VCMI: the same armies  |
# |         |                  | with one creature, both with their       | (TD-19: the slot)      |
# |         |                  | points; the lost one free, refilled      |                        |
# | TWN-4-5 | T-14             | a dismissed hero keeps its artifacts     | (T-14: a quirk         |
# |         |                  | when offered again                       | candidate)             |
#
# **The days** (survey §2.3): the harness writes the date (game +0x1F63E) to day 6 of the first
# week before any hero moves, so that Red's day 6 and day 7 and Blue's are played, and Blue's end
# of day 7 starts week 2 (TWN-4-3's day 8).
#
# **The draws** (the capture harness, E09 T34): xdd.dll logs `leave_slot` (hero_leave_game's
# random_between(0, 1), the returning hero's slot, the other one when that slot's hero is a
# returning one) and the taverns' `tavern_class` and `tavern_type` with their ranges.
#
# **The narrowed pool** (TWN-4-5; survey §9's "a map with few free types"): before the dismissal
# the harness marks every free hero type of the pool reserved (game +0x4DF18: 0x40) but the lost
# TWN-4-4b's, as a map that allows no other: the dismissed type and TWN-4-4b's are then the only
# free types, and a hire's replacement draws one of them.
#
# **The towns** (`[[map.town]]`, map row 10): R1 (7, 10) and R2 (15, 10), Red's Castles with the
# Fort and the Tavern; Blue's B (27, 10), a Stronghold with the Fort.

[map]
name = "E09 batch TWN-4b"
description = "Engine-generated experiment map (E09, batch TWN-4, part b): heroes that retreat, surrender, lose and are dismissed, back in the taverns. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E09-batch-4b.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, Red and Blue both human, difficulty **Easy**. Before you start it, compare the stamp at the start of the map's description with the stamp above.",
    "The records are the game's memory: a player's two tavern offers (player record +0x28, +0x2C: hero types), each hero's record (game +0x21620 + 0x492 x type: owner +0x22, army +0x91, points +0x4D of the day's +0x49, spell points +0x18, the returning mark bit 17 of +0x105, the artifacts), the hero pool (game +0x4DF18: -1 free, 0x40 reserved, a colour). The capture harness reads them, writes the date and some heroes' spell points, narrows the pool and logs the draws (`clients/capture/batches/E09-batch-4b.toml`, E09 T34). Played by hand the tavern dialog shows the offers.",
    "Tiles are (column, row) from 0 at the top left; a town's entrance is the tile a hero visits. A step: click the target once (the path's marks show), then again (the hero goes).",
    "Order: Red's day 6 (TWN-4-3's retreat, TWN-4-4's surrender and loss); Blue's day 6; Red's day 7; Blue's day 7 (TWN-4-3's attack on TWN-4-3f); Red's day 8 (the new week; TWN-4-5).",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]

# --- the towns --------------------------------------------------------------------------------

[[map.town]]  # R1
entrance = [7, 10]
faction = "castle"
owner = "red"
buildings = ["fort", "tavern"]
garrison = []

[[map.town]]  # R2
entrance = [15, 10]
faction = "castle"
owner = "red"
buildings = ["fort", "tavern"]
garrison = []

[[map.town]]  # B
entrance = [27, 10]
faction = "stronghold"
owner = "blue"
buildings = ["fort"]
garrison = []

# --- TWN-4-3: a retreat in the owner's turn (day 6) and one in another's (day 7) -----------------------

[[encounter]]
id = "TWN-4-3"
title = "TD-18: a hero that flees on day 6 in Red's turn and one that flees on day 7 in Blue's; Red's offers on day 8"
questions = ["TWN-TAV-002", "TWN-TAV-005", "TWN-TAV-006"]
procedure = [
    "Red's turn, day 1, before any hero moves: the harness writes the date to day 6 of week 1. Read Red's two offers and the pool states of TWN-4-3, -3f, -4, -4b and -5 (Red's).",
    "Set TWN-4-3's spell points to 3. TWN-4-3 (4, 20) attacks the Gnolls east of it (5, 20) and retreats at its first stack's turn. Read Red's offers, TWN-4-3's record (owner, army, points, spell points, returning mark), its pool state and the slot's draw.",
    "(TWN-4-4's surrender and TWN-4-4b's loss follow, then Red's turn ends.) On Blue's turn of day 6: read TWN-4-3's and TWN-4-4's returning marks. On Red's day 7: read Red's offers and TWN-4-3's and TWN-4-4's points; set TWN-4-3f's spell points to 4; end Red's turn.",
    "Blue's day 7: Blue's TWN-4-3b (13, 20) attacks Red's TWN-4-3f (12, 20); TWN-4-3f retreats at its first stack's turn. Read Red's offers, TWN-4-3f's record, the pool states of TWN-4-3, -3f and -4, the slot's draw.",
    "End Blue's turn: week 2 starts. On Red's day 8 read Red's offers, the pool states of TWN-4-3, -3f, -4 and -4b, and the week's draws.",
]
record = [
    { field = "before (Red's day 1, written to day 6): Red's offers; the pool states" },
    { field = "TWN-4-3 retreats (day 6, Red's turn): Red's offers; its record; its pool state; the slot's draw" },
    { field = "Blue's turn, day 6: the returning marks of TWN-4-3 and TWN-4-4" },
    { field = "Red's day 7: Red's offers; TWN-4-3's and TWN-4-4's points (of the day's)" },
    { field = "TWN-4-3f retreats (day 7, Blue's turn): Red's offers; its record; the pool states; the slot's draw" },
    { field = "Red's day 8 (week 2): Red's offers; the pool states; the week's draws" },
    { field = "anything odd" },
]
predictions = """
- **The reading** (survey §4, §2.3; TD-18 the reading, decision 104): **TWN-4-3's retreat**: off
  the map, owner none, its type reserved and **in Red's slot `leave_slot`** (the offer it replaced
  freed), **one creature of its type's first starting stack** (a Pikeman: not its Swordsmen or
  Monks), **its points as they were** (those its walk and the battle left) and **its spell points
  3**, the returning mark set. **On Blue's day 6 both marks clear** (Red's turn end clears its
  two offers'); on Red's day 7 its offers' points are set to their maximum (the turn start,
  `next_player_turn`; TD-20). **TWN-4-3f's retreat in Blue's turn**: into a slot by `leave_slot`
  (neither offer has the mark), the offer there (TWN-4-3 or TWN-4-4) freed; one creature, its
  points as they were, spell points 4, **the mark set**. **Day 8**: the week releases every slot
  but the marked one: **TWN-4-3f still offered** (its one creature, its points; the mark until
  Red's turn ends), **the day-6 fugitive left in the other slot released** (free; that slot drawn
  anew, a full army; the week's log one draw pair for Red, two for Blue).
- **VCMI** (TD-18, survey §8): both returning offers cleared at the week; the day-7 fugitive
  released as well.
"""
[encounter.hero]
type = "Sorsha"
specialty = "creature Swordsman"
name = "TWN-4-3"
at = [4, 20]
primary = [1, 1, 1, 1]
army = [["Swordsman", 5], ["Monk", 2]]
[encounter.opponent]
monster = "Gnoll"
count = 5
[[encounter.also]]
type = "Ingham"
specialty = "creature Monk"
name = "TWN-4-3f"
at = [12, 20]
primary = [1, 1, 1, 1]
army = [["Cavalier", 2]]
[[encounter.also]]
type = "Yog"
specialty = "creature Cyclops"
owner = "blue"
name = "TWN-4-3b"
at = [13, 20]
primary = [1, 1, 1, 1]
army = [["Ogre", 10]]

# --- TWN-4-4: a surrender and a loss ------------------------------------------------------------------

[[encounter]]
id = "TWN-4-4"
title = "A hero that surrenders (TWN-4-4) and one that loses (TWN-4-4b) on day 6, beside TWN-4-3's retreat"
questions = ["TWN-TAV-006"]
procedure = [
    "Red's day 6, after TWN-4-3's retreat. Set TWN-4-4's spell points to 2. TWN-4-4 (4, 26) attacks Blue's TWN-4-4x east of it (5, 26) and surrenders at its first stack's turn (the price paid). Read Red's offers, TWN-4-4's record, its pool state, Red's gold before and after, and the slot's draw.",
    "Set TWN-4-4b's spell points to 1. TWN-4-4b (12, 26) attacks the Black Dragons east of it (13, 26) with auto combat and loses. Read TWN-4-4b's record (owner, army, points of the day's, spell points), its pool state and Red's offers.",
]
record = [
    { field = "TWN-4-4 surrenders (day 6): Red's offers; its record; its pool state; Red's gold before and after; the slot's draw" },
    { field = "TWN-4-4b loses (day 6): its record; its pool state; Red's offers; the battle's winner" },
    { field = "anything odd" },
]
predictions = """
- **The reading** (survey §4, `hero_leave_game` 0x4D9EC0): **TWN-4-4's surrender**: the price
  paid, off the map, into **the other slot** (`leave_slot` draws, but TWN-4-3's slot has the mark:
  the other one taken), **its army kept** (4 Swordsmen, 3 Monks), **its points as they were and
  its spell points 2**, the mark set; the offer it replaced freed. **TWN-4-4b's loss**: off the
  map, owner none, **its type free** (pool -1), no slot (Red's offers unchanged), **one creature
  of its first starting stack** (a Centaur), **its points the land maximum and its spell points
  refilled** (Knowledge x 10: 10, not 1).
- **VCMI** (survey §7): a surrendered hero keeps its army, a fled one one creature; the slot by
  TD-19 (VCMI: the first free one); a lost hero to the pool.
"""
[encounter.hero]
type = "Tyris"
specialty = "creature Cavalier"
name = "TWN-4-4"
at = [4, 26]
primary = [1, 1, 1, 1]
army = [["Swordsman", 4], ["Monk", 3]]
[encounter.opponent.hero]
type = "Crag Hack"
specialty = "skill Offense"
name = "TWN-4-4x"
primary = [1, 1, 1, 1]
army = [["Orc", 10]]
[[encounter.also]]
type = "Mephala"
specialty = "skill Armorer"
name = "TWN-4-4b"
at = [12, 26]
primary = [1, 1, 1, 1]
army = [["Pikeman", 2]]

[[encounter]]
id = "TWN-4-4b"
title = "TWN-4-4b's opponent: 30 Black Dragons (the loss of row TWN-4-4)"
questions = ["TWN-TAV-006"]
procedure = ["TWN-4-4's second half: the Black Dragons east of TWN-4-4b, whom it attacks and loses to."]
record = [{ field = "anything odd" }]
[encounter.hero]
type = "Clancy"
specialty = "creature Unicorn"
name = "TWN-4-4z"
at = [30, 32]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
[encounter.opponent]
monster = "Black Dragon"
count = 30
at = [13, 26]

# --- TWN-4-5: a dismissed hero drawn again ------------------------------------------------------------

[[encounter]]
id = "TWN-4-5"
title = "T-14: TWN-4-5 dismissed with its artifacts, then drawn again as a replacement"
questions = ["GAM-MAN-003", "TWN-TAV-004"]
procedure = [
    "Red's day 8, after TWN-4-3's reads. Read TWN-4-5's artifacts (worn and in the backpack). The harness narrows the pool: every free type reserved but TWN-4-4b's.",
    "Open TWN-4-5's hero screen and click Dismiss (the question: yes). Read its owner, pool state, artifacts and army, and the pool's states.",
    "Open R1's screen from the town list, click the Tavern, select slot 0, Recruit. Read the hired hero, Red's slot 0 (the replacement: its name, army, artifacts) and the draws.",
    "Open R2's screen from the town list, the same hire of slot 0. Read the same.",
]
record = [
    { field = "before: TWN-4-5's artifacts (worn, backpack); the pool narrowed (its states)" },
    { field = "TWN-4-5 dismissed: the question; its owner, pool state, artifacts, army; the pool's states" },
    { field = "the first hire (R1, slot 0): the hired hero; Red's slot 0 now (the replacement); the draws" },
    { field = "the second hire (R2, slot 0): the hired hero; Red's slot 0 now (the replacement); the draws" },
    { field = "anything odd" },
]
predictions = """
- **The reading** (survey §4, §12, T-14; `hero_screen_proc`'s Dismiss, GENRLTXT 23, then
  `hero_leave_game`): dismissed, TWN-4-5 is off the map, owner none, **its type free**, **its
  artifacts all kept** in its record (the Badge of Courage worn, the Clover of Fortune in the
  backpack: nothing on the path strips them), one creature of its first starting stack (a
  Gremlin), its points and spell points refilled. With the pool narrowed only TWN-4-5's and
  TWN-4-4b's types are free: **the two hires' replacements are these two** (each draw's class
  range their two classes' weights in Castle's column, the Alchemist's 6 and the Ranger's 6, less
  the other slot's class when it is one of them), each with **one creature** of its first starting
  stack, **TWN-4-5 with its artifacts** (no equipping at a replacement: the Clover still in the
  backpack), TWN-4-4b with its record (the level and skills it had).
- **VCMI**: (T-14) not compared in the survey; a quirk candidate either way.
"""
[encounter.hero]
type = "Neela"
specialty = "skill Armorer"
name = "TWN-4-5"
at = [20, 26]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
artifacts = { "misc 1" = "Badge of Courage" }
backpack = ["Clover of Fortune"]

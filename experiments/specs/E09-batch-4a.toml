# Experiment batch TWN-4, part a (E09 T34; design note §78, survey
# docs/rules/surveys/E09-tavern.md §2, §3, §9 rows TWN-4-1, -2, -6 and -8): the taverns' offers
# over eight weeks, the town's hire and its replacement, and the Recruit button, in SoD on Easy,
# hot seat. Parts b and c (`E09-batch-4b.toml`, `-4c.toml`) hold the other rows. Build:
# docs/experiments/README.md. Predictions are for the agent who evaluates the results; the
# template never shows them. "The reading" is the survey's code reading of Heroes3.exe (the engine
# follows it, faithful); VCMI's is VCMI 1.7.5 as the survey summarises it (§7).
#
# | row     | settles            | the reading                            | otherwise               |
# | TWN-4-1 | §2 (the week's     | slot 0 a class of the player's faction | the wiki: the same; the |
# |         | fill)              | each week; the two classes differ;     | manual: two heroes that |
# |         |                    | full starting armies                   | change each week        |
# | TWN-4-2 | §3 (the hire, the  | at once, any faction, the other's      | VCMI: the same          |
# |         | replacement)       | class avoided, one creature; the hero  |                         |
# |         |                    | on the entrance, the guild's spells    |                         |
# | TWN-4-6 | §3 (Recruit)       | disabled at 8 heroes on the map        | VCMI: two caps (TD-21)  |
# |         |                    | whatever the garrison, and with a      |                         |
# |         |                    | visitor                                |                         |
# | TWN-4-8 | §2.2 (the edition) | a Conflux class now and then in slot   | the SoD retail's rule   |
# |         |                    | 1 (edition 3: the Conflux classes      | (edition 2): no Conflux |
# |         |                    | weigh 5 in the draw)                   | class for a non-Conflux |
# |         |                    |                                        | player                  |
#
# **The draws** (survey §2.2): xdd.dll logs each tavern draw with its range (the capture harness,
# E09 T34: `tavern_class v of 1-total`, `tavern_type v of 1-n`): a class by random_between(1,
# the weights' total), then a type of the class by random_between(1, its free types). The
# weights are `HCTRAITS.TXT`'s tavern column of the player's faction: Castle's (Red's) 6 for the
# Knight, Cleric, Ranger, Druid, Alchemist, Wizard, Barbarian, Battle Mage, Beastmaster and Witch,
# 5 for the other eight (the two Conflux classes among them); Stronghold's (Blue's) 6 for the
# Knight, Cleric, Ranger, Alchemist, Demoniac, Death Knight, Overlord, Barbarian, Battle Mage and
# Beastmaster, 5 for the other eight. So slot 0 (own faction only) totals 12 (the faction's two
# classes, 6 each); slot 1 (any class, slot 0's avoided) 100 less the avoided class's weight, 94
# with the Conflux classes weighing, 84 without.
#
# **The weeks** (as batch TWN-3): the harness writes the date (game +0x1F63E) to the week's last
# day before each pair of end turns (Red's, Blue's), so each pair starts a week: M1 W2, W3, W4, M2
# W1, W2, W3, W4. Nobody hires before the eighth week.
#
# **The towns** (`[[map.town]]`, map row 10, entrances 8 columns apart from column 7): R1 (7, 10),
# R2 (15, 10), R3 (23, 10) and R4 (31, 10), Red's Castles with the Fort, the Tavern and the Mage
# Guild level 1, garrisons empty; Blue's B (27, 28), a Stronghold with the Fort.
#
# **The heroes:** Red's TWN-4-6 (Edric) south of R1 at (7, 11); TWN-4-1, -2 and TWN-4-6a to -6c
# far off on row 30, never moving: Red 6 heroes on the map. Blue's TWN-4-1b at (30, 32).

[map]
name = "E09 batch TWN-4a"
description = "Engine-generated experiment map (E09, batch TWN-4, part a): the taverns' offers over eight weeks, the town's hire and its replacement, the Recruit button. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E09-batch-4a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, Red and Blue both human, difficulty **Easy**. Before you start it, compare the stamp at the start of the map's description with the stamp above.",
    "The records are the game's memory: a player's two tavern offers (player record +0x28, +0x2C: hero types), each offer's hero record (game +0x21620 + 0x492 x type: its army +0x91, points +0x4D of the day's +0x49, spell points +0x18, class +0x30), the hero pool (game +0x4DF18). The capture harness reads them, writes the date for the weeks and logs the taverns' draws (`clients/capture/batches/E09-batch-4a.toml`, E09 T34). Played by hand the tavern dialog shows the two offers (portrait, name, level, class).",
    "Tiles are (column, row) from 0 at the top left; a town's entrance is the tile a hero visits. A step: click the target once (the path's marks show), then again (the hero goes).",
    "Order: the offers on Red's day 1; then each week: end Red's turn and Blue's (by hand: play the days through), the offers on Red's new turn, eight weeks in all; then, in the eighth week, the hires and the Recruit button (TWN-4-6, TWN-4-2).",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


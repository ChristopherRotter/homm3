# --- TWN-4-1 and TWN-4-8: the offers over eight weeks -------------------------------------------

[[encounter]]
id = "TWN-4-1"
title = "The two players' tavern offers over eight weeks (rows TWN-4-1 and TWN-4-8)"
questions = ["TWN-TAV-001", "TWN-TAV-002"]
procedure = [
    "Red's turn, day 1, before any hero moves: read Red's and Blue's two offers (each: the hero, its class, army, points, spell points, artifacts) and the draws the game's start made.",
    "Then each week (eight in all): write the date to the week's last day, end Red's turn and Blue's; on Red's new turn read the four offers again and the draws of the week's start.",
]
record = [
    { table = ["week", "Red's slot 0", "Red's slot 1", "Blue's slot 0", "Blue's slot 1", "the taverns' draws (class, type; with their ranges)"], rows = 8 },
    { field = "anything odd" },
]
predictions = """
- **The reading** (survey §2.2, §2.3): at the start and each week every slot is released and
  filled anew, Red's slot 0, slot 1, then Blue's (the log: four pairs `tavern_class`,
  `tavern_type` a week). **Slot 0 a class of the player's faction** every week (Red's Knight or
  Cleric, Blue's Barbarian or Battle Mage), its class draw's range **1-12**; **slot 1 another
  class** (never slot 0's), any faction, its range **1-94** (100 less slot 0's class, 6 for every
  one of these four classes); the type within the class drawn uniformly over its free types (the
  type draw's range their count: no placed hero's type, no type offered). Every offer: **a full
  starting army** (`draw_starting_army` with the one-creature flag clear: its type's first stack
  with a count in its range, a second with 88 in 100, a third with 25 in 100 of those), its spell
  points Knowledge x 10 (x the Intelligence factor), no returning mark. A type may come again in a
  later week (released types are free for every draw).
- **Row TWN-4-8** (survey §2.2, finding 6): the edition is 3 in this build, so **the Conflux
  classes (Planeswalker, Elementalist) weigh 5** in both players' slot 1: every slot-1 range is
  94, and over the 32 slot draws a Conflux class shows now and then in a slot 1 (about one draw in
  nine). The SoD retail's rule (the edition 2) would give 84 and no Conflux class.
- **VCMI** (`TavernHeroesPool`, survey §7): the same weights, slot 0 the faction, the other's
  class avoided, Conflux heroes for any player; both slots changed each week.
"""
[encounter.hero]
type = "Orrin"
specialty = "skill Archery"
name = "TWN-4-1"
at = [4, 30]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
[[encounter.also]]
type = "Gurnisson"
specialty = "creature Ballista"
owner = "blue"
name = "TWN-4-1b"
at = [30, 32]
primary = [1, 1, 1, 1]
army = [["Goblin", 1]]

# --- TWN-4-6: the Recruit button ------------------------------------------------------------------

[[encounter]]
id = "TWN-4-6"
title = "The Recruit button: a visitor in the town; Red's heroes on the map with a garrison hero (5, 7, 8)"
questions = ["TWN-TAV-003"]
procedure = [
    "In the eighth week, Red's turn. TWN-4-6 stands south of R1 at (7, 11): step north onto the entrance (R1's screen opens; Red has 6 heroes on the map). Click the Tavern: note Recruit (enabled or greyed) and the status line with the mouse over it. Close the tavern.",
    "Click TWN-4-6's portrait (the lower bar), then the upper one (the town's flag): it moves into the garrison (Red: 5 on the map). Click the Tavern again: note Recruit. Hire slot 0 (TWN-4-2's first hire). Click the Tavern again: note Recruit and the status line over it. Close the tavern and the town screen.",
    "After TWN-4-2's hire in R2 (Red: 7 on the map, TWN-4-6 in R1's garrison): open R3's screen from the town list (no visitor), click the Tavern: note Recruit; hire slot 0 (Red: 8 on the map).",
    "Open R4's screen from the town list (no visitor), click the Tavern: note Recruit and the status line over it. Close.",
]
record = [
    { field = "R1 with TWN-4-6 its visitor (Red 6 on the map): Recruit; the status line over it" },
    { field = "TWN-4-6 into R1's garrison: R1's garrison hero and visitor; Red's heroes on the map" },
    { field = "R1 without a visitor (Red 5 on the map, a garrison hero): Recruit" },
    { field = "R1 after the hire (the hired hero its visitor; Red 6 on the map): Recruit; the status line over it" },
    { field = "R3 from the list, no visitor (Red 7 on the map, a garrison hero in R1): Recruit; Red's heroes on the map after a hire there" },
    { field = "R4 from the list, no visitor (Red 8 on the map, a garrison hero in R1): Recruit; the status line over it; Red's heroes on the map" },
    { field = "anything odd" },
]
predictions = """
- **The reading** (survey §3; the Recruit button 0x5D81EE, the hint `tavern_dialog_hint`
  0x5D7920): R1 with a visitor: **disabled**, the status line the visitor's refusal text; into
  the garrison: R1's garrison hero TWN-4-6, no visitor, Red 5 on the map (a garrison hero is off
  the list); **enabled** (gold enough, an offer selected, 5 below 8, no visitor); after the hire,
  the hired hero R1's visitor: **disabled** (the visitor); R3 (7 on the map, 8 heroes with the
  garrison hero): **enabled**, a hire there brings Red to 8 on the map; R4 (8 on the map):
  **disabled**, the status line the 8-heroes refusal (with 8 in its text): the garrison hero not
  counted either way.
- **VCMI** (TD-21, survey §8): a hire is refused with 8 heroes on the map and also with 16 in all
  (the garrison heroes counted); a visitor refuses a town's hire as well.
"""
[encounter.hero]
type = "Edric"
specialty = "creature Griffin"
name = "TWN-4-6"
at = [7, 11]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
[[encounter.also]]
type = "Valeska"
specialty = "creature Archer"
name = "TWN-4-6a"
at = [10, 30]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
[[encounter.also]]
type = "Sylvia"
specialty = "skill Navigation"
name = "TWN-4-6b"
at = [13, 30]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
[[encounter.also]]
type = "Christian"
specialty = "creature Ballista"
name = "TWN-4-6c"
at = [16, 30]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]

# --- TWN-4-2: the hire and its replacement -----------------------------------------------------------

[[encounter]]
id = "TWN-4-2"
title = "A hire from each slot: the hired hero's tile and spells, the slot's replacement"
questions = ["TWN-TAV-003", "TWN-TAV-004"]
procedure = [
    "In the eighth week, Red's turn, in R1 (TWN-4-6's visit, after it moved into the garrison): click the Tavern, select slot 0 and note the offer; click Recruit. Note the hired hero (on R1's entrance? its spells against R1's guild's), Red's two slots now (the replacement in slot 0), Red's gold, and the draws.",
    "Open R2's screen from the town list (no visitor): click the Tavern, select slot 1 and note the offer; click Recruit. Note the same.",
    "In R3 (TWN-4-6's third step): the hire of slot 0 there; note the same.",
]
record = [
    { field = "R1, slot 0 selected: the dialog; the offer" },
    { field = "R1, slot 0 hired: the hired hero (R1's visitor: offer, tile, spells); R1's guild spells; Red's two slots; Red's gold" },
    { field = "R1's step: the taverns' draws" },
    { field = "R2, slot 1 selected: the dialog; the offer" },
    { field = "R2, slot 1 hired: the hired hero (R2's visitor: offer, tile, spells); R2's guild spells; Red's two slots; Red's gold" },
    { field = "R2's step: the taverns' draws" },
    { field = "R3, slot 0 hired: the hired hero (R3's visitor: offer, tile); Red's two slots; Red's gold; the draws" },
    { field = "anything odd" },
]
predictions = """
- **The reading** (survey §3, `town_tavern_hire` 0x5C12E0, `tavern_slot_replace` 0x4C86A0): each
  hire takes 2 500 gold; the hired hero stands on the town's **entrance** as its visitor (R1 (7,
  10), R2 (15, 10), R3 (23, 10)), with the army it was offered with (the week's full one), and
  **learns the town's guild spells when it has a spell book** (a Cleric's, a Battle Mage's...: its
  spells then include R1's level-1 spells; a hero without a book learns none). **The slot is
  refilled at once**: one draw pair, the class range **100 less the other slot's class weight** (94
  or 95 in Castle's column; any faction: not own faction only), the new offer of another class
  than the other slot's, with **one creature** (its type's first starting stack, count 1), its
  spell points full.
- **VCMI** (`TavernHeroesPool`, `CGameHandler::hireHero`): the same replacement (a new hero at
  once, one creature, the other's class avoided); the hero placed on the town's visitable tile.
"""
[encounter.hero]
type = "Rion"
specialty = "skill First Aid"
name = "TWN-4-2"
at = [7, 30]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]

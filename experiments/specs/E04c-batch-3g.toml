procedure = [
    "Round 1, at the Swordsmen's turn: the Red hero casts Teleport on them and tries, in this order, hex 64 (inside), hex 61 (the moat), hex 91 (outside), until one is accepted.",
    "Every other turn defends. Play to round 2, then end the battle as you like.",
]

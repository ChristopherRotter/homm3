# Experiment batch E5a (E08 T36a; decisions 78, 80): increment 5's day's points and step prices,
# rows E5-1, E5-4, E5-5 and E5-6 of the survey's plan (docs/rules/surveys/E08-hero-movement.md §9;
# docs/epics/E08-design.md §11), in SoD on Easy, hot seat. Where a flight or a water walk may go
# (E5-7, E5-9, E5-11) is batch E5b; the rows that need the heroes' seed bytes and the scorer (E5-2,
# E5-3, E5-10) are T36b's. Build: docs/experiments/README.md. Predictions are for the agent who
# evaluates the results; the template never shows them.
#
# | row  | settles                               | the reading (faithful)        | the other source(s)          |
# | E5-1 | ADV-MOV-001's bonuses (a check)        | 1560 x (1 + Logistics) + 600/300 | consensus (VCMI, the wiki) |
# | E5-4 | D-24: flying's price on an inland road | 100 per straight step         | the wiki, VCMI: 50 (the lesser) |
# | E5-5 | water walking's price (a check)        | the land tile's, then 100, 141 | consensus                   |
# | E5-6 | D-23: Cursed Ground and native terrain | 175 from it (the native 100 lost) | VCMI: 100 (no such rule)  |
#
# Every hero's army is speed 4 (10 Pikemen, Gnolls or Archers): the land table's 1560
# (packs/base/adventure.toml `land_points`, 0x698A98), no hero has Pathfinding, Logistics or a
# Logistics specialty unless a row gives it, and every army is native to the terrain it starts on
# only where the row says so (ADV-MOV-004). The rates are the original's floats (0x63EA68: 0.1,
# 0.2, 0.3 as f32) and the x87's trunc((rate + 1) x points): 1716, 1872, 2028 (§1.1).
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact; Boots of Speed or Equestrian's Gloves on an E5-1 hero would change its points. Note a
# worn artifact the spec does not give under "anything odd" (the harness: a hero's `equipment`).

[map]
name = "E08 batch E5a"
description = "Engine-generated experiment map (E08, batch E5a): a hero's day's points by Logistics, artifacts and specialty; flying, water walking and Cursed Ground prices. Hot seat, Red and Blue human, difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-5a.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1).",
    "A click on a tile shows the hero's path (arrows and a cross on the tile clicked); a second click on the same tile makes the hero go. Each walk below is one such pair of clicks on the tile named; note the colour of the target's mark, the number of marks and the hero's movement points after it (the harness reads them from memory: clients/capture/batches/E08-batch-5a.toml). A walk that does not happen: note it and go on with the next.",
    "Order: day 1, Red's turn: E5-4a, E5-4b, E5-5, E5-6a, E5-6b, each as its encounter says; end the turn. Blue's turn: read E5-1's points (no hero moves); end the turn. Day 2, Red's turn: end the turn. Blue's turn: read E5-1's points again. Then the map is done: two days, no battle.",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


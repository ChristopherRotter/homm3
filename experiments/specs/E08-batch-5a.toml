# --- ADV-MOV-001: the day's points (Blue) ------------------------------------------------------

[[encounter]]
id = "E5-1"
title = "The day's points: Logistics, Boots of Speed, Equestrian's Gloves, a creature specialist"
questions = ["ADV-MOV-001", "ADV-MOV-002", "HER-ADV-003", "HER-ADV-004"]
procedure = [
    "Day 1, Blue's turn, before anything moves: read the movement points of Blue's eight heroes E5-1a to E5-1h (row 32; the harness, from memory). None of them moves. End the turn.",
    "Day 2, Blue's turn start: read the eight heroes' points again.",
    "Note each hero's worn artifacts if any is not the one its line names (a starting bonus).",
]
record = [
    { table = ["hero", "day 1 points", "day 2 points"], labels = [
        "E5-1a (no Logistics)",
        "E5-1b (Basic Logistics)",
        "E5-1c (Advanced Logistics)",
        "E5-1d (Expert Logistics)",
        "E5-1e (Boots of Speed)",
        "E5-1f (Equestrian's Gloves)",
        "E5-1g (both, Expert Logistics)",
        "E5-1h (Valeska, Archers)",
    ] },
    { field = "anything odd" },
]
predictions = """
- Every source (the reading 0x4E4990, VCMI 1.7.5, the wiki; consensus, a check): the land table
  at the slowest speed, times 1 + the Logistics rate, then +600 for worn Boots of Speed and +300
  for worn Equestrian's Gloves; a creature specialist's creature counts one faster. The same on
  both days (the points are set at the build and at each turn start of the owner, ADV-MOV-002).
- **E5-1a 1560**, **E5-1b 1716**, **E5-1c 1872**, **E5-1d 2028**, **E5-1e 2160**, **E5-1f 1860**,
  **E5-1g 2928** (2028 + 600 + 300), **E5-1h 1630** (Archers at speed 5: the table's next entry).
- A difference of 600 or 300 on one hero only: a starting bonus's artifact (its equipment).
  Another difference: the bonuses are not as read (ADV-MOV-001's amendment reopened, the survey
  §1.1).
"""
[encounter.hero]
type = "Orrin"
specialty = "skill Archery"
owner = "blue"
name = "E5-1a"
at = [2, 32]
primary = [1, 1, 1, 1]

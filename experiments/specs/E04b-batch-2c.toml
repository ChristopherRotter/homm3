# Experiment batch 2c (E04b, after T5a): the battlefield spells and the control spells. Checks what
# the code reading of the executable (docs/formats/installation.md §7.14, §7.15) inferred but no
# observation has shown, and the engine's own choices where the code was not read: the anchor hex
# of a natural obstacle (OPEN-QUESTIONS Q55: free, yet marked with the obstacle's index), Fire Wall
# burning a stack that waits and then defends in it (BAT-MAG-028), Force Field's shape when the
# defender casts it (not mirrored in the original's descriptor, mirrored in VCMI; BAT-MAG-027), a
# walker's path among equally short ones past a Fire Wall (BAT-MOV-003, the engine's own), Berserk
# between two equally near stacks (BAT-MAG-025, the engine draws), Hypnotize's limit against a
# wounded stack and Expert Cure on a hypnotized stack (BAT-MAG-026, quirk Q-0012).
# Build: see docs/experiments/README.md. Predictions are for the agent who evaluates the results;
# the template never shows them. Predictions are the engine's at 90db906 (faithful profile unless a
# line names another); the alternatives name their source.
#
# Played with plain HD (HD+ off). Heroes at level 1 with resource or adventure-only specialties;
# casters get a Spell Book and only the listed spells; no Wisdom; no school skills except where
# listed (mastery none: Fire Wall and Force Field cover 2 hexes, Berserk one stack); no Sorcery, no
# Orbs. Every caster starts with full mana, 10 x knowledge. The layout of the battlefield (its
# obstacles) comes from the map tile (the game's choice), so no encounter relies on one: each says
# what to do if an obstacle is in the way. Terrain dirt: of its 16 usual obstacle types, 6 leave
# their anchor hex free (harvested `base` pack: obstacle_5, 6, 8, 13, 14, 15).
# Reach (the batch 2b note): the armies start 14 columns apart; every move below is at most the
# stack's speed. Morale: the armies of F1 and F2 mix two alignments (morale 0), so no extra turn
# adds a burn; elsewhere a good-morale extra turn Defends, which changes nothing.
# Creatures: Pikeman 4/5, 1-3 damage, 10 hit points, speed 4; Swordsman 10/12, 6-9, 35, speed 5;
# Wolf Rider 7/5, 2-4, 10, speed 6; Peasant 1/1, 1, 1, speed 3; Phoenix flies, speed 21.
# Not staged (docs/experiments/README.md): the E04a candidates (1)-(4), T4a's (Magic Mirror on an
# own war machine, Sorrow and Basic Anti-Magic), Q-0005's single-precision resistance, Q43, batch
# 2a's open costs (R6, T7).

[map]
name = "E04b batch 2c"
description = "Engine-generated experiment map (E04b, batch 2c). Play it in hot seat with Red and Blue as human players and follow the results template."
size = 36
terrain = "dirt"
instructions = [
    "Copy `E04b-batch-2c.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human. In the battles against Blue's heroes you control both sides. Save right away.",
    "On day 1, play Red's encounters A1, A2, F1, F2, B1, H1 and C1 in any order: each Red hero attacks the Blue hero next to it. Play A3 only if neither A1 nor A2 found a free hex that takes Remove Obstacle.",
    "In battle, switch on the hex grid and the movement shadow in the combat options (the button at the bottom left). The combat log at the bottom shows each strike's and each burn's damage and kills (scroll it with its arrow); right-click a stack to see its numbers (count, health left of the top creature, active spells). To try a spell's cursor without casting, choose the spell in the book, move the cursor over the hex and cancel (right-click or Esc): the normal spell cursor means the spell may be cast there, the crossed-out cursor that it may not. Unless an encounter says otherwise, a stack that is not needed Defends, and a stack that gets an extra turn from good morale Defends.",
    "\"Up-right\", \"up-left\", \"down-left\" mean the neighbouring hex in that direction; \"two rows straight up\" is the hex directly above, two rows higher.",
    "Fill in this file (anything unexpected goes into the last line of an encounter) and keep it in the repo.",
]

# --- The anchor hexes of natural obstacles (Q55, BAT-MAG-027, T5b) ---------------------------------

[[encounter]]
id = "A1"
title = "Anchor hexes: free hexes beside an obstacle that take Remove Obstacle"
questions = ["Q55"]
procedure = [
    "Attack the Blue hero. Round 1, on the Phoenix's turn: choose Remove Obstacle and try its cursor on one hex of each obstacle and on every free hex touching each obstacle on its left and below it (cancel, do not cast). Note each free hex that takes it: which obstacle (a few words: look, size, place), and where the hex is (for example 'left of its lowest hex', 'down-left of its lowest hex'). Call the first such hex X. Also note any obstacle whose own hexes refuse Remove Obstacle.",
    "Still on the Phoenix's turn, if you found X: choose Fire Wall and try its cursor on X, then on the hex down-left of X (Fire Wall covers the hex under the cursor and its up-right neighbour, so this one reaches X too), then on a free hex far from every obstacle; cancel each time. Note for each: allowed or refused, and whether the wall's other hex was free.",
    "Then the Phoenix flies onto X. Can it land there?",
    "Round 2: the Phoenix flies to any other free hex.",
    "Round 3, on the Phoenix's turn: cast Remove Obstacle on X. What disappears (the whole obstacle, nothing, or the spell is refused)? Then finish the battle as you like.",
    "If you found no X, finish the battle as you like.",
]
predictions = """
Ours (the code reading, installation.md §7.15; T5a does not model anchors yet): every usual
obstacle takes Remove Obstacle on its own hexes; an obstacle whose picture's lower left corner is a
free hex (obstacle_5, 6, 8, 13, 14, 15 on dirt) has exactly one free hex that takes it, its anchor
X: left of its lowest blocked hex (obstacle_5, 13, 15), two left of it (obstacle_14) or in the row
below, down-left of it (obstacle_6, 8); every other free hex refuses it. Fire Wall is refused with
X as either of its hexes and allowed far from obstacles; the Phoenix lands on X; Remove Obstacle on
X removes the whole obstacle (its blocked hexes become free). The absolute obstacles (large, no
anchor) refuse Remove Obstacle.
- VCMI 1.7.5 (obstacles by their blocked hexes only): no free hex takes Remove Obstacle; Fire Wall is
  allowed on X when its other hex is free.
- Outcome decides Q55's seam options (a)-(c) and whether Fire Wall's, Force Field's and Remove
  Obstacle's tests need the anchor (T5b).
"""
[encounter.hero]
type = "Caitlin"
specialty = "resource gold"
primary = [0, 0, 1, 2]
army = [["Phoenix", 1]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Remove Obstacle", "Fire Wall"]
[encounter.opponent.hero]
name = "A1b"
type = "Damacon"
specialty = "resource gold"
primary = [0, 0, 0, 0]
army = [["Peasant", 1]]
[[encounter.record]]
table = ["obstacle (look, size, place)", "own hexes take Remove Obstacle (yes/no)", "free hexes that take it (where; none)"]
rows = 6
[[encounter.record]]
field = "Fire Wall on X; on the hex down-left of X; far from obstacles (allowed/refused, other hex free?)"
[[encounter.record]]
field = "the Phoenix lands on X (yes/no)"
[[encounter.record]]
field = "Remove Obstacle cast on X in round 3: what disappears"
[[encounter.record]]
field = "anything odd"

[[encounter]]
id = "A2"
title = "Anchor hexes: a second battlefield"
questions = ["Q55"]
procedure = [
    "As A1 (another map tile, so other obstacles).",
]
predictions = """
As A1.
"""
[encounter.hero]
type = "Jenova"
specialty = "resource gold"
primary = [0, 0, 1, 2]
army = [["Phoenix", 1]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Remove Obstacle", "Fire Wall"]
[encounter.opponent.hero]
name = "A2b"
type = "Sephinroth"
specialty = "resource crystal"
primary = [0, 0, 0, 0]
army = [["Peasant", 1]]
[[encounter.record]]
table = ["obstacle (look, size, place)", "own hexes take Remove Obstacle (yes/no)", "free hexes that take it (where; none)"]
rows = 6
[[encounter.record]]
field = "Fire Wall on X; on the hex down-left of X; far from obstacles (allowed/refused, other hex free?)"
[[encounter.record]]
field = "the Phoenix lands on X (yes/no)"
[[encounter.record]]
field = "Remove Obstacle cast on X in round 3: what disappears"
[[encounter.record]]
field = "anything odd"

[[encounter]]
id = "A3"
title = "Anchor hexes: a third battlefield (only if A1 and A2 found no X)"
questions = ["Q55"]
procedure = [
    "Play this only if neither A1 nor A2 found a free hex that takes Remove Obstacle; then as A1.",
]
predictions = """
As A1. With 6 of 16 dirt types leaving the anchor free, two battlefields without one are unlikely.
"""
[encounter.hero]
type = "Rissa"
specialty = "resource mercury"
primary = [0, 0, 1, 2]
army = [["Phoenix", 1]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Remove Obstacle", "Fire Wall"]
[encounter.opponent.hero]
name = "A3b"
type = "Saurug"
specialty = "resource gems"
primary = [0, 0, 0, 0]
army = [["Peasant", 1]]
[[encounter.record]]
table = ["obstacle (look, size, place)", "own hexes take Remove Obstacle (yes/no)", "free hexes that take it (where; none)"]
rows = 6
[[encounter.record]]
field = "Fire Wall on X; on the hex down-left of X; far from obstacles (allowed/refused, other hex free?)"
[[encounter.record]]
field = "the Phoenix lands on X (yes/no)"
[[encounter.record]]
field = "Remove Obstacle cast on X in round 3: what disappears"
[[encounter.record]]
field = "anything odd"

# --- Fire Wall: entering, waiting, defending; the defender's Force Field and Fire Wall --------------

[[encounter]]
id = "F1"
title = "Fire Wall burns on entering, on Wait and on Defend; the shapes the defender casts"
questions = ["BAT-MAG-027", "BAT-MAG-028"]
procedure = [
    "Attack the Blue hero. The Pikemen stand in the third row from the top. Round 1: the Wolf Riders act first: Blue casts Force Field on a free hex in the right half of the field, away from obstacles. Note which hexes it covers: the hex you clicked and its up-right neighbour, or its up-left neighbour? The Wolf Riders Defend.",
    "On the Pikemen's turn: Red casts Fire Wall on the hex two hexes to the right of the Pikemen in their row (it covers that hex and its up-right neighbour). Then the Pikemen walk two hexes straight right, into the wall's lower hex. Note the log's lines and the Pikemen's number. (If an obstacle is in the way, move the Pikemen to a free row first and do this step in the next round; note it.)",
    "Round 2: the Wolf Riders' turn: Blue casts Fire Wall on a free hex in the right half; note its second hex: up-right or up-left of the hex you clicked. The Wolf Riders Defend. On the Pikemen's turn they Wait: note the log and their number. When they come back at the end of the round, they Defend: note the log and their number.",
    "Round 3: is Red's Fire Wall still on the field? Finish the battle as you like.",
]
predictions = """
Red's hero power 1, Fire Wall at mastery none: 10 x 1 + 10 = 20 per burn, no resistance roll, no
bonus; 2 Pikemen per burn (10 hit points). Every army has morale 0 (two alignments).
- Ours (BAT-MAG-028, the code reading: the hexes are entered again after an action that does not
  move the stack): entering 50 -> **48**; Wait **46**; Defend **44**; no burn at the round start;
  the wall gone at the start of round 3 (2 rounds).
- Burnt once per round only (VCMI-like, at the stack's turn): 48, then 46 for round 2.
- Blue's Force Field: ours **up-right** (the original's descriptor is the same for both sides);
  VCMI mirrors it: up-left. Blue's Fire Wall: up-left in both (mirrored).
"""
[encounter.hero]
type = "Aine"
specialty = "resource gold"
primary = [0, 0, 1, 1]
army = [["Pikeman", 50], ["Peasant", 1]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Fire Wall"]
[encounter.opponent.hero]
name = "F1b"
type = "Gelare"
specialty = "resource gold"
primary = [0, 0, 1, 3]
army = [["Wolf Rider", 10], ["Peasant", 1]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Force Field", "Fire Wall"]
[[encounter.record]]
field = "Blue's Force Field (round 1): covers the clicked hex and its up-right or up-left neighbour"
[[encounter.record]]
table = ["step", "log lines (copy)", "Pikemen left"]
rows = 3
[[encounter.record]]
field = "Blue's Fire Wall (round 2): second hex up-right or up-left"
[[encounter.record]]
field = "round 3: Red's Fire Wall still there (yes/no)"
[[encounter.record]]
field = "anything odd"

[[encounter]]
id = "F2"
title = "A walker with two equally short paths past a Fire Wall"
questions = ["BAT-MOV-003", "BAT-MAG-028"]
procedure = [
    "Attack the Blue hero. Both Pikemen stacks stand in the third row from the top. Round 1: Red's Pikemen walk two hexes straight right, Blue's Pikemen two hexes straight left (away from the field's edges). No spells.",
    "Round 2, Red's Pikemen's turn: Red casts Fire Wall on the hex up-right of the Pikemen (it covers that hex and its own up-right neighbour). Then the Pikemen walk to the hex two rows straight up (the top row, directly above them): two steps, through the burning up-right hex or the free up-left hex. Burnt or not (log, number)?",
    "Blue's Pikemen's turn: Blue casts Fire Wall on the hex up-left of Blue's Pikemen (for Blue it covers that hex and its own up-left neighbour). Then the Pikemen walk to the hex two rows straight up. Burnt or not?",
    "(If an obstacle stands on any of these hexes, use another pair of free rows and note it.) Finish the battle as you like.",
]
predictions = """
Both heroes power 1, Fire Wall at mastery none: 20 per burn, 10 Pikemen -> 8. Morale 0.
- Ours (BAT-MOV-003: from the end, the first neighbour in the order right, bottom right, ...,
  so a walker two rows straight up passes its **up-right** neighbour): Red's Pikemen **burnt (8)**,
  Blue's **not burnt (10)**.
- The original's pathfinder (0x4B3400, not read) prefers up-left: Red not burnt, Blue burnt.
- It avoids fire (the code reading says it avoids only visible Quicksand): neither burnt.
"""
[encounter.hero]
type = "Octavia"
specialty = "resource gold"
primary = [0, 0, 1, 1]
army = [["Pikeman", 10], ["Peasant", 1]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Fire Wall"]
[encounter.opponent.hero]
name = "F2b"
type = "Grindan"
specialty = "resource gold"
primary = [0, 0, 1, 1]
army = [["Pikeman", 10], ["Peasant", 1]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Fire Wall"]
[[encounter.record]]
table = ["walker", "burnt (yes/no; log line)", "Pikemen left"]
rows = 2
[[encounter.record]]
field = "anything odd"

# --- Berserk between two equally near stacks (BAT-MAG-025) ------------------------------------------

[[encounter]]
id = "B1"
title = "Berserk: which of two equally near stacks is attacked"
questions = ["BAT-MAG-025"]
procedure = [
    "Attack the Blue hero. Blue's three stacks stand in its column: Pikemen at the top, Swordsmen in the middle, Pikemen at the bottom, the Swordsmen three rows from each.",
    "Round 1, the Wolf Riders' turn (they act first): Red casts Berserk on Blue's Swordsmen; the Wolf Riders Defend. On their turn the Swordsmen act on their own: which Pikemen stack do they attack, the upper or the lower one?",
    "Finish the battle as you like. If you are willing: reload the save, play B1 again the same way and note the choice again (up to three tries in all).",
]
predictions = """
The Swordsmen (speed 5) reach an attack position of either Pikemen stack in 2 steps (rows 2 and 8
against row 5; the field is symmetric about row 5). Red's hero power 1, Berserk at mastery none:
one stack.
- Ours (BAT-MAG-025): one of the two nearest drawn with equal chances: upper or lower; three tries
  all alike with probability 1/4.
- The original picks from its AI pathfinder's map (0x4B3400, not read; survey S-11, which HD may
  fix): if every try picks the same stack, a deterministic choice (maybe the first in hex order,
  the upper one); a repeat may also come from the game's random numbers being restored with the
  save, so the result is a hint, not proof.
"""
[encounter.hero]
type = "Calid"
specialty = "resource sulfur"
primary = [0, 0, 1, 2]
army = [["Wolf Rider", 5]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Berserk"]
[encounter.opponent.hero]
name = "B1b"
type = "Sylvia"
specialty = "skill Navigation"
primary = [0, 0, 0, 0]
army = [["Pikeman", 10], ["Swordsman", 5], ["Pikeman", 10]]
[[encounter.record]]
table = ["try", "the Swordsmen attack (upper/lower Pikemen)"]
rows = 3
[[encounter.record]]
field = "anything odd"

# --- Hypnotize's limit and Cure on a hypnotized stack (BAT-MAG-026, Q-0012) -------------------------

[[encounter]]
id = "H1"
title = "Hypnotize against a wounded stack; Expert Cure on a hypnotized stack"
questions = ["BAT-MAG-026", "Q-0012"]
procedure = [
    "Attack the Blue hero. Round 1, the Wolf Riders' turn: choose Hypnotize and try its cursor on the 2 Swordsmen and on the 1 Swordsman (cancel each time); note allowed or refused. Then cast Magic Arrow on the 2 Swordsmen: note the damage, and right-click them: number, health left of the top one. The Wolf Riders Defend; Blue's stacks Defend.",
    "Round 2, the Wolf Riders' turn: try Hypnotize's cursor on the 2 Swordsmen again: allowed or refused? Then cast Hypnotize on the 1 Swordsman. The Wolf Riders Defend.",
    "Next, Blue's 2 Swordsmen act (the Swordsmen tie on speed; the army slot decides): Blue casts Cure (Expert: on all of Blue's stacks). Right-click the 1 Swordsman: is Hypnotize still listed? Right-click the 2 Swordsmen: health of the top one? They Defend. When the 1 Swordsman acts, note which side commands it; it Defends. The Pikemen Defend.",
    "Round 3: which side commands the 1 Swordsman? Finish the battle as you like.",
]
predictions = """
Red's hero power 2, mastery none: Hypnotize affects a stack of at most 25 x 2 + 10 = 60 hit points;
Magic Arrow deals 10 x 2 + 10 = 30. Swordsmen 35 hit points.
- Round 1, every model: 2 Swordsmen (70) refused, 1 Swordsman (35) allowed; Magic Arrow 30, no
  kill, the top one at 5.
- Round 2 (2 Swordsmen at 40 of 70): ours **refused** (BAT-MAG-026: the full hit points count, the
  top creature's wounds give no credit; the executable's test); VCMI 1.7.5 (the stack's current
  health) allowed.
- Expert Cure (Blue's power 1: 5 + 30 = 35 healed): ours, faithful (Q-0012, the original's loop
  skips hypnotized stacks): **Hypnotize still listed**, Red commands the Swordsman in rounds 2 and
  3; the 2 Swordsmen's top one back at 35. Strict-fixed and VCMI: Hypnotize ended, Blue commands
  it from its round 2 turn.
"""
[encounter.hero]
type = "Clavius"
specialty = "resource gold"
primary = [0, 0, 2, 3]
army = [["Wolf Rider", 5]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Magic Arrow", "Hypnotize"]
[encounter.opponent.hero]
name = "H1b"
type = "Kyrre"
specialty = "skill Logistics"
primary = [0, 0, 1, 1]
skills = [["Water Magic", 3]]
army = [["Swordsman", 2], ["Swordsman", 1], ["Pikeman", 10]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Cure"]
[[encounter.record]]
field = "round 1: Hypnotize on 2 Swordsmen, on 1 Swordsman (allowed/refused)"
[[encounter.record]]
field = "Magic Arrow: damage; 2 Swordsmen afterwards: number, health of the top one"
[[encounter.record]]
field = "round 2: Hypnotize on the wounded 2 Swordsmen (allowed/refused)"
[[encounter.record]]
field = "after Expert Cure: Hypnotize still listed on the 1 Swordsman (yes/no); 2 Swordsmen's top one health"
[[encounter.record]]
field = "round 2, after the Cure: the 1 Swordsman commanded by (Red/Blue)"
[[encounter.record]]
field = "round 3: the 1 Swordsman commanded by (Red/Blue)"
[[encounter.record]]
field = "anything odd"

[[encounter]]
id = "C1"
title = "Basic Cure on a hypnotized stack"
questions = ["BAT-MAG-026", "Q-0012"]
procedure = [
    "Attack the Blue hero. Round 1, the Wolf Riders' turn: Red casts Hypnotize on the Swordsman. The Wolf Riders Defend. The Swordsman acts for Red: it Defends.",
    "On the Pikemen's turn: Blue casts Cure on the Swordsman (is it allowed?). Right-click the Swordsman: is Hypnotize still listed? The Pikemen Defend.",
    "Round 2: which side commands the Swordsman? Finish the battle as you like.",
]
predictions = """
The control for H1: does Cure end Hypnotize at all? Red's power 2, limit 60, the Swordsman 35.
- Ours (BAT-MAG-026, the code reading: the owner may cast positive spells on its hypnotized stack;
  below Expert, Cure's dispel ends Hypnotize): Cure allowed, **Hypnotize ended**, Blue commands
  the Swordsman in round 2. VCMI the same.
- If Cure is refused or Hypnotize stays: Cure does not end Hypnotize at any mastery, and H1 says
  nothing about Expert Cure (Q-0012 would be no quirk).
"""
[encounter.hero]
type = "Nagash"
specialty = "resource gold"
primary = [0, 0, 2, 2]
army = [["Wolf Rider", 5]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Hypnotize"]
[encounter.opponent.hero]
name = "C1b"
type = "Gunnar"
specialty = "skill Logistics"
primary = [0, 0, 1, 1]
skills = [["Water Magic", 1]]
army = [["Swordsman", 1], ["Pikeman", 10]]
artifacts = { "spell book" = "Spell Book" }
spells = ["Cure"]
[[encounter.record]]
field = "Cure on the hypnotized Swordsman: allowed (yes/no); Hypnotize still listed afterwards (yes/no)"
[[encounter.record]]
field = "round 2: the Swordsman commanded by (Red/Blue)"
[[encounter.record]]
field = "anything odd"

# |        |                                          | banned, the two distinct; unchanged at day 29 | restocked (`blackMarketRestockPeriod` 0)|
# | E14-4  | §7.2, A-46: a purchase with no room      | the price paid, the artifact nowhere, the     | VCMI: an unbounded backpack takes it    |
# |        |                                          | entry empty (the engine refuses it, 366)      |                                         |
# | E14-5  | §4, §5: the Trading Post's trade         | +150 gold; +1 wood; +1 gem                    | VCMI the same at five                   |
# | E14-6  | §5: the transfer                         | Red −5 ore, Blue +5                           | VCMI the same                           |
# | E14-7  | §12.1: the Altar's screens               | Castle artifacts only; Necropolis creatures   | VCMI the same (the client's test)       |
# |        |                                          | only; Fortress both, the artifacts first      |                                         |
# | E14-8  | §12.2: the artifacts' experience         | +11 500 (1 000, 1 500, 3 000, 6 000)          | VCMI the same                           |
# | E14-9  | §12.2, D-72, A-47: the special artifacts | 1 000; the four gone; the Catapult kept, a    | VCMI: the Ballista refused              |
# |        |                                          | message                                       |                                         |
# | E14-10 | §12.3, D-73: the Learning per stack      | 21                                            | VCMI 22 (one product)                   |
# | E14-11 | §12.3: the army keeps a creature         | the most 9; All 9                             | VCMI the same                           |
# | E14-12 | §13, D-74: the Hill Fort's prices        | 0; 125; 37; 56; 2 000 gold and 2 gems; 25     | VCMI 120, 36, 54; 24                    |
# | E14-13 | §13: the states                          | Rogues and Marksmen 0; the Pegasi 2; All      | VCMI the same                           |
# |        |                                          | refused, nothing paid                         |                                         |
# | E14-15 | §14: the War Machine Factory             | Ballista 0, the tent and the cart 1; −1 750;  | VCMI and the manual the same            |
# |        |                                          | both equipped; then all 0                     |                                         |
# | E14-16 | design §0: where the hero stands         | on the entrance at the window, after it and   | VCMI the same (no `blockedVisitable`)   |
# |        |                                          | after Space; none entered from above          |                                         |
# | E14-17 | design §14: the Altar and a level-up     | the level-up over the Altar, then the Altar   | VCMI unread                             |
# |        |                                          | open; then 10 Gnolls 55 (Advanced Learning)   |                                         |
#
# **Changes from design §20** (agent's calls): **E14-17** has no hero of the Learning specialty
# (none of the 156 hero types has one, `h3-experiment --list heroes`): a Fortress hero at level 1
# with eight secondary skills, seven at Expert and Basic Learning, so its level-up offers Advanced
# Learning alone; a treasure (1 050) gives the level, then the creatures' screen reads the new
# Learning (10 Gnolls: 55, not Basic's 52); a relic would give five levels from level 1, and a hero
# placed higher takes its levels at load (below). The dialogs' order as planned. **Blue's starting resources** need no field (the format holds none): E14-6 reads
# Blue's treasury from memory on Red's turn before and after the transfer, and on Blue's turn.
# **Day 2** is not needed: every row plays on day 1, E14-3's second read on Red's day 29. **E14-12**
# adds four Air Elementals (level 2 under the ab pack: trunc(100 × 0.25) = 25, VCMI 6 × 4 = 24), the
# SoD side of E14-14's RoE elementals. **E14-9's Spell Scroll** is picked up from the map (Haste):
# a hero's artifacts in the format are codes without a spell, so a scroll in the starting backpack
# would hold none; it reaches the altar from its misc position, the Grail from the backpack. **E14-13**'s Pegasi are 3 000 (56 250 gold, above Blue's
# Easy treasury), so no event makes Blue poor. **E14-16** is read in the other rows' visits (the
# guild, a Black Market, both Trading Posts, the Altars, a Hill Fort, the factory), the step from
# above in E14-8's.
#
# **The pictures** (docs/experiments/README.md, "Increment 14's objects"): each blocks `at` and the
# tile west of it on its bottom row, the Freelancer's Guild also the second tile west; the entrance
# is `at` for the Altar `AvXAltar`, the Black Market `AVXmktb0`, the Hill Fort `AVXhild0` and
# `AVXhilg0` and the Trading Posts `AVXpost0` and `AVXpsSn` (class 221), the tile west of `at` for
# the War Machine Factory `AVGsieg0` and the guild `avxfgld`. The hero steps onto the entrance and
# stands there (the class lists `object_classes_not_entered` 0x63AA58 and
# `object_classes_from_above` 0x63AB00 name none of the seven); none is entered from the three
# tiles above its entrance, nor left upward (ADV-OBJ-004). No visit spends points but the step; the
# windows' trades spend none (survey §2). Space visits the tile the hero stands on again.
#
# **The rates** are at five Marketplaces for every map market (survey §4 to §7: binary32 steps,
# half up). **The heroes.** Red has eight (the most a player holds), Blue two. A step costs 100 on
# grass, 141 diagonally; an army whose slowest is speed 4 (Pikemen, Archers, Skeletons, Gnolls) gives
# 1 560 points a day, speed 6 (Rogues, Marksmen) 1 700 (packs/base/adventure.toml `land_points`). A hero's scouting radius is 5 (ADV-FOG-002), so every
# target is explored at its click. Valeska's Archers are one faster (her specialty): 1 630. No
# hero has a skill but E14-8's, E14-9's, E14-10's and E14-17's, no artifact but its listed ones.
#
# **Levels at load** (survey `E08-progression.md` §3, GAM-SET-002): a hero placed with experience
# takes its levels at the new game, the computer choosing every offer (a Logistics or a Learning
# could come). So E14-8 (68 700, level 19) and E14-9 (2 100, level 3) know eight skills, all at
# Expert and none of them Learning, Logistics, Pathfinding or Scouting: their levels at load add
# primary skills only. The thresholds past level 12 are the pack's steps grown by a fifth (24 320,
# 28 784, 34 140, 40 567, 48 279, 57 533, 68 637, 81 961; packs/base/core.toml).
#
# **The bans** (E14-3): every treasure, minor and major below 127 but seven treasures (Centaurs Axe,
# Shield of the Dwarven Lords, Helm of the Alabaster Unicorn, Breastplate of Petrified Wood,
# Spyglass, Bird of Perception, Stoic Watchman), seven minors (Blackshard of the Dead Knight,
# Greater Gnoll's Flail, Shield of the Yawning Dead, Buckler of the Gnoll King, Crown of the Supreme
# Magi, Rib Cage, Red Dragon Flame Tongue) and three majors (Sword of Hellfire, Shield of the
# Damned, Hellstorm Helmet), beside the editor's default bans 127 to 143. Every hero's starting
# artifact is a banned one, a relic or a special one, so the draw's pool is these seventeen whether
# or not the game counts the heroes' artifacts as given.
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give an artifact (a
# draw from the same pool, which would leave the markets one treasure fewer) or a resource; the
# template asks for gold, and every treasury is read before and after each row.


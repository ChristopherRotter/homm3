# (survey docs/rules/surveys/E08-trades.md §18 with docs/epics/E08-design.md §20's changes), in SoD
# on Easy, hot seat, day 1 (Red's turn, then Blue's) and Red's day 29. The RoE row E14-14 is
# `E08-batch-14-roe.toml`. Build: docs/experiments/README.md. Predictions are for the agent who
# evaluates the results; the template never shows them.
#
# | row    | settles                                  | the reading (faithful)                        | the other source(s)                     |
# | E14-1  | §6, D-71: the guild's sale               | 10 Pixies 170 gold; 2 Vampires 2 wood         | VCMI 180; 4                             |
# | E14-2  | §6: the army keeps a creature            | the slider's most 9 of the only stack of 10   | VCMI the same                           |

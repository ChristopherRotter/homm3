    "Most records are the game's memory: a hero's tile, its movement points (hero +0x4D), army, experience, level, worn artifacts and backpack; both players' treasuries; the Black Markets' records (game +0x1F680, seven artifacts each) and each market's object word; the trade window's screen, pair and slider's most (`market_screen` 0x6AAAA4, `market_kind` 0x6AAAC4, `market_count` 0x6AAA98); the Altar's dialog (+0x78 the total, its places, the slider's most); the Hill Fort's rows (prices, states, the whole +0x298); the questions, messages and dialogs in their order; the path's marks after one click. The capture harness reads them (`clients/capture/batches/E08-batch-14.toml`, E08 T129). Played by hand, read the screens instead and leave the memory-only lines empty.",

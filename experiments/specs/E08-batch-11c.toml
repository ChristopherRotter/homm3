# Experiment batch E11c (E08 T103c; decisions 269, 279, 282): decision 279's investigation, the
# agent's call (docs/epics/E08-design.md §16, "Batch E11c"; survey docs/rules/surveys/E08-teleporters.md
# §15): a hero arriving on a one-way monolith's exit beside a guard and its step off onto the guarded
# tile; guarded entered objects of other kinds (a mine, a Learning Stone: the guard first, the visit
# after a win?); Space on a two-way pair whose exit is guarded (the user's play). In SoD on Easy, hot
# seat, Red's turn of day 1 alone. Build: docs/experiments/README.md. Predictions are for the agent who
# evaluates the results; the template never shows them.
#
# | row    | settles                                   | the reading (faithful)                       | the other source(s)                     |
# | E11-20 | §4.2, §5, §11: a one-way exit beside a     | no battle on arrival; Space: ADVEVENT 70, no | VCMI the same (IGNORE_GUARDS); the user |
# |        | guard, Space on it, the step off it        | battle; the step off into the zone fought    | from play: a fight only on a step off   |
# | E11-21 | decision 279: a guarded mine               | the guard first (the mine neutral at the     | VCMI the same (visitDestAfterVictory);  |
# |        |                                           | battle's opening), then the flag             | the engine as built: the flag first     |
# | E11-22 | decision 279: a guarded Learning Stone     | the guard first (experience 0 at the         | VCMI the same; the engine as built: the |
# |        |                                           | opening), then the stone's 1 000             | stone first (1 000 at the opening)      |
# | E11-23 | §11, decision 273: Space cycling on a pair | no battle at any press, also arriving by the | the user from play; the wiki            |
# |        | whose exit is guarded                      | key on the guarded tile; the control fought  | ("unlimited cycling")                   |
#
# **Why these rows.** Batch E11a's E11-19 showed the original fights a step's guard before the
# entrance's visit (ADV-Q47): decision 279 makes that order every entered kind's, and its building
# task (T103d) needs it observed on kinds other than a teleporter. A mine (flagged by the visit) and
# a Learning Stone (experience given by the visit) each beside a monster tell the order by what the
# game's memory holds as the battle opens (`at_opening`): the mine's owner, the hero's experience.
# E11-20 is the one-way case the user expected alike (survey §15's end: §5's reading predicts no
# fight on arrival, unobserved); E11-23 the two-way cycle the user saw, with an arrival by the key on
# the guarded tile (E11-19's Space left the guarded tile only).
#
# **The guards** (ADV-MON-005): each monster stands on its object's row or the row below; a tile
# whose object is not entered from above leaves the row above out of its guard scan (the original's
# 0x41A460, VCMI's `checkForVisitableDir`). P20 (15, 4) guards X20 and (14, 5); Q21 (4, 13) the
# mine's entrance (5, 12); R22 (7, 20) the stone (6, 20); N23 (15, 28) B23 and (14, 29). Every
# hero starts two columns or more from every monster: outside every zone. Every monster is a lone
# Peasant (savage, never flees: the battle at once, won by auto combat).
#
# **The heroes.** Red has four, one a row, each with ten Archangels (2 000 land points a day,
# packs/base/adventure.toml `land_points`), no skills, no artifacts; Blue one, far from every row,
# which never moves (the batch ends in Red's turn). A step costs 100 on grass, 141 diagonally; a
# hero's scouting radius is 5 (ADV-FOG-002), so every target is explored at its click (each within
# 5 of its hero's tile then: the start's, or the exit's after a jump).
#
# **The pictures** (docs/experiments/README.md): a monolith is the one tile `at`, entered there from
# any side but the three tiles above it; the crystal cavern `AVMcrys0` covers `at` and the two tiles
# west of it and is entered at the middle one from the row below; the Learning Stone `AVSgzbo0` is
# the tile `at`, entered there. One-way channel 0 (blue): the entrance E20 (4, 4), its one exit X20
# (14, 4); two-way channel 0 (green): A23 (4, 28) and B23 (14, 28). One exit for each entrance: no
# jump draws (`random_between` returns an equal bound without a draw, survey §4.1).
#
# **The walks** are one step each (priced by hand: grass, 100 straight, 141 diagonal; the teleporters
# import as entered kinds whose step the engine refuses until T105a, so no reach query prices them).
#
# The trap of the starting bonus: a hot-seat player's random starting bonus may give a hero an
# artifact or a resource; an artifact on a moving hero goes under "anything odd" (boots would move
# the points).

[map]
name = "E08 batch E11c"
description = "Engine-generated experiment map (E08, batch E11c): guards and entered objects: a one-way monolith's exit beside a monster, Space on it, the step off it; a mine and a Learning Stone beside a monster; Space back and forth on a two-way pair whose exit is guarded. Hot seat, Red and Blue human; difficulty Easy; follow the results template."
size = 36
terrain = "grass"
difficulty = "easy"
instructions = [
    "Copy `E08-batch-11c.h3m` into `D:\\Heroes3\\HoMM 3 Complete\\Maps`.",
    "Use the HD launcher with plain HD (HD+ off).",
    "Start the map in hot seat: *New Game → Multiplayer → Hot Seat*, two players, Red and Blue both human, difficulty **Easy**. If the scenario's options let you, set both players' starting bonus to gold. Before you start it, compare the stamp at the start of the map's description with the stamp above. Save right away (save 1).",
    "Most records are the game's memory: a hero's tile, its movement points (hero +0x4D), experience and level, a mine's record (owner, resource), Red's treasury, the messages and dialogs shown (by their text's table and line), the battles (the defender, the hero's tile as each opens, the result) and what the memory holds as the first battle of a step opens. The capture harness reads them (`clients/capture/batches/E08-batch-11c.toml`, E08 T103c). Played by hand, read the screens instead and leave the memory-only lines empty (a battle's opening: note whether the mine's flag or the stone's message came before it).",
    "Tiles are (column, row) from 0 at the top left. A step: click the target once (the path's marks show), then again (the hero goes). **Space:** with the hero selected, press the space bar once.",
    "Each battle against a monster by auto combat. A level-up's dialog: take the left skill.",
    "Order: day 1, Red's turn: E11-20, E11-21, E11-22, E11-23. Then the map is done (Blue never plays).",
    "Fill in this file (anything unexpected goes into the encounter's last line) and keep it in the repo.",
]


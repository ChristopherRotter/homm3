# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "5 random-vs-random games of 28 days on the trades map (E08 T135b2, increment 14's design note §18; T135b1's e08-trades-36.h3m: the seven classes twice, the Trading Posts, the Freelancer's Guilds and the Black Markets under batch E14-3's bans, the Altars, the Hill Forts and the War Machine Factories, heroes of the three alignments below the entrances); seed 68 by a search of seeds 1 to 100 for the most answers that changed a treasury or an army at an open market, Altar, Hill Fort or factory dialog, every kind among them: 1 835 steps, 220 with a trade decision open, 175 such answers (167 at the markets, 2 at the Altars, 3 at the Hill Forts, 3 at the factories); about 2 625 000 Ir a step, 85 % inside h3_game::legal::legal_moves (the agent's legal moves of the heroes at every step), Reach::search 72 % itself, AdventureState::visit_at 0.9 %; the trades' code inlined, no symbol of its own above 0.1 %; counts only inside h3_sim::adventure::random_rollout (the agent, the reachable-tiles queries, apply); baselined at its first count; E08 T144a2 re-baselined: master 4 826 896 313 in the same sandbox, the branch +3.49 % on it: the random agent draws the heroes' casts (encoding v21: each listed cast without a target, each hero's Scuttle Boat and Dimension Door with a target, T144a1's filter gone), so the games changed course (1 519 steps for 2 719); the code alone +0.05 to +0.12 % on the random-play workloads whose games did not change"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-trades-36.h3m",
    "--workload",
    "play",
    "--games",
    "5",
    "--days",
    "28",
    "--seed",
    "68",
]
collect = "*adventure*random_rollout*"
instructions = 4995273649
threshold_percent = 2

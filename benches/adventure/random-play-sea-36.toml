# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "5 random-vs-random games of 28 days on the sea map (E08 T75a, increment 8: 4 boardings, 3 landings, Favorable Winds sailed, both events on water, the guarded one's battle on the deck, a hero battle on the shore; 1 532 steps, about 1 714 000 Ir a step, the rewards map's about 862 000: 52 % inside the flyer's and the water walker's layered search over the open sea, `Reach::expand_layered`, the boats' own search 4 %); since E08 T83b2a +2.47 % against master's count of the same games (2 613.9 M): the objects added in play, asked for by the walking search's rare case (boats in the window), the passage's live read and the visit's lookup, none added on this map; counts only inside h3_sim::adventure::random_rollout (the agent, the reachable-tiles queries, apply); since E08 T142b re-baselined: with ADV-QUIRK-15 on (faithful) a flight's reach goes on over the tiles its owner has not explored, as the original's (increment 15's design note section 11.1), so the flyer's and the water walker's games changed course, the flyer's queries over the hidden tiles: +4.03 % against master measured in the same sandbox, the code alone (the faithful row kept as before) +0.21 %; E08 T144a2 re-baselined: master 2 771 431 142 in the same sandbox, the branch +6.37 % on it: the random agent draws the heroes' casts (encoding v21: each listed cast without a target, each hero's Scuttle Boat and Dimension Door with a target, T144a1's filter gone), so the games changed course (1 244 steps for 1 159); the code alone +0.05 to +0.12 % on the random-play workloads whose games did not change"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-sea-36.h3m",
    "--workload",
    "play",
    "--games",
    "5",
    "--days",
    "28",
    "--seed",
    "1",
]
collect = "*adventure*random_rollout*"
instructions = 2948003201
threshold_percent = 2

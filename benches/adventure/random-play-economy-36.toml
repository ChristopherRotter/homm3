# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "5 random-vs-random games of 60 days on the economy map (E08 T86b2 on T86a's map: the mines' flags, guards and battles, Leave Guards, the Lighthouses, the Shipyard's boats, the weekly objects, the timed events; two month starts a game, creature months in games 1, 3 and 5 on day 29 and in game 4 on day 57; 6 318 steps, about 452 000 Ir a step, 90 % inside the reachable-tiles search, Reach::search); counts only inside h3_sim::adventure::random_rollout (the agent, the reachable-tiles queries, apply)"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-economy-36.h3m",
    "--workload",
    "play",
    "--games",
    "5",
    "--days",
    "60",
    "--seed",
    "1",
]
collect = "*adventure*random_rollout*"
instructions = 2858062897
threshold_percent = 2

# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "the reachable-tiles query of every flying or water-walking hero of the acting player (since E08 T42 each player's flyer and water walker of the generated 144 x 144 two-level map: the reach's two kinds of node, E08 T41) at each step of the reach workload's games: 3 158 queries, about 279 k Ir each, 1.9 times a walker's on the same games; since E08 T85b re-baselined: the day advance changed the games (the monsters grow, the heroes regain spell points: 2 291 steps for 2 698, the walkers' queries 4 940 for 5 759), −4.1 % against master, every function in proportion; counts only inside h3_cli::adventure::bench::lifted_queries; since E08 T105b2 re-baselined with the revisits in the legal set (the random games that place the heroes changed course: the same games: 2 633 steps for 2 291; each query's search the same code): master's code measured +0.77 % against the old count, the branch -3.27 % against master; since E09 T37b re-baselined: the XL map's engine-written map-wide entry of type 3, a type it does not place, makes a record at the build whose default experience moves the setup stream's later draws (the map objects' contents), so the random games changed (3 007 steps and 6 200 queries of both kinds for 2 633 and 5 656), every counted function the same code and shape: -5.05 % against master measured in the same sandbox; since E08 T142b re-baselined: with ADV-QUIRK-15 on (faithful) a flight's reach goes on over the tiles its owner has not explored, as the original's (increment 15's design note section 11.1), so each flyer's query relaxes 43 % more nodes (4 310 763 calls of the passage for 3 004 272; 1 578 queries for 1 550): +33.40 % against master measured in the same sandbox, the code alone (the faithful row kept as before) -0.31 %"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-xl-144.h3m",
    "--workload",
    "reach",
    "--games",
    "2",
    "--days",
    "28",
    "--seed",
    "1",
]
collect = "*lifted_queries*"
instructions = 1045005865
threshold_percent = 2

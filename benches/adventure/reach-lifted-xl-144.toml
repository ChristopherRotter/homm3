# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "the reachable-tiles query of every flying or water-walking hero of the acting player (since E08 T42 each player's flyer and water walker of the generated 144 x 144 two-level map: the reach's two kinds of node, E08 T41) at each step of the reach workload's games: 3 158 queries, about 279 k Ir each, 1.9 times a walker's on the same games; counts only inside h3_cli::adventure::bench::lifted_queries"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-xl-144.h3m",
    "--workload",
    "reach",
    "--games",
    "2",
    "--days",
    "28",
    "--seed",
    "1",
]
collect = "*lifted_queries*"
instructions = 880080619
threshold_percent = 2

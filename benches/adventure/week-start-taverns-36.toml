# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "E09 T40b (decision 159, the town epic's design note §78: the week workload on the taverns map): the step that starts day 8 (the last EndTurn of day 7: the week's step, the taverns' release and fill, TWN-TAV-002, sparing the returning offers, TD-18, from the six free types of e09-taverns-36.h3m, then red's turn start with its tavern heroes' points, TWN-TAV-005) in each of 16 random games of 7 days on the taverns map, where the random agent hires at both towns and the map Tavern and its heroes retreat, surrender and come back; the fork that tries the step is dropped before it, as day-start-builds-36's; a new workload, no engine code changed (master's code)"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e09-taverns-36.h3m",
    "--workload",
    "day-start",
    "--games",
    "16",
    "--days",
    "7",
    "--seed",
    "1",
]
collect = "*day_start_step*"
instructions = 1833609
threshold_percent = 2

# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "the reachable-tiles query of every hero of the acting player, walking, flying or water-walking and sailing, at each step of 2 random games of 28 days on the banks XL map (E08 T125b2b, increment 13's design note §17; T125b1's e08-banks-144.h3m: 144 x 144 with the sea on columns 96 to 143, 106 creature banks as Thousand Islands in the census's shares, fourteen Shipwrecks along the coast each visited from the land beside it with a 3 x 3 island beyond it, ten heroes, a flyer of each player in front of a coast Shipwreck, a boat by a coast hero of each, 136 gnoll stacks on every hundredth free land tile); seed 32 by a search of seeds 1 to 48 for the most queries listing a coast Shipwreck's entrance or an island beyond one (3 268 steps, 25 battles): 9 601 queries, about 173 k Ir each; 7 670 walkers' (about 125 k each, 412 or 5.4 % listing a coast Shipwreck's water entrance, visited from the coast: ADV-MOV-009), 1 925 flyers' and water walkers' (about 364 k each, 366 or 19 % reaching an island, the flight across a Shipwreck: ADV-SEA-002), 6 in boats; 96 % inside h3_game::legal::legal_moves, Reach::search 36 % itself, AdventureState::passage 17 %, Reach::expand_layered 10 %; counts inside h3_cli::adventure::bench's reach_queries (58 %), lifted_queries (42 %) and sail_queries (0.2 %), matched by one pattern; baselined at its first count"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-banks-144.h3m",
    "--workload",
    "reach",
    "--games",
    "2",
    "--days",
    "28",
    "--seed",
    "32",
]
collect = "*_queries*"
instructions = 1665110723
threshold_percent = 2

# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "5 random-vs-random games of 28 days on the rewards map (E08 T64a, increment 7: every reward class, the visits, their decisions and their guards' battles; 1 358 steps, about 862 000 Ir a step, the duel's about 305 000); since E08 T72 -2.22 %, the same games: the static map's tiles grew by the winds' and holes' marks from 14 to 16 bytes, likely copied in fewer instructions; counts only inside h3_sim::adventure::random_rollout (the agent, the reachable-tiles queries, apply); E08 T86b2 re-set it at master's count (+1.50 % against T72's count, the same 1 358 steps: the code of increment 9, T83b2a's live reads +0.76 %, T84a's visit arm +0.35 %, T85b's day advance +0.37 %); E08 T103d -4.05 % against master's count (1 163 035 980 in the sandbox): the guard first for every entered object (decision 279) changes the games, 1 287 steps instead of 1 358, every function's share the same (callgrind per function)"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-rewards-36.h3m",
    "--workload",
    "play",
    "--games",
    "5",
    "--days",
    "28",
    "--seed",
    "1",
]
collect = "*adventure*random_rollout*"
instructions = 1115925596
threshold_percent = 2

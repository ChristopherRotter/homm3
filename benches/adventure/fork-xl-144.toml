# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "100 000 forks of the env with a battle open on the generated 144 x 144 two-level map (E08 decision 6 and 11: a fork must barely grow with the map; E08 T19b1: the heroes seek each other until a battle opens; since E08 T20b3b2 a monster or a guarded pile on the way opens one after 18 steps; since E08 T42 the map's flyers and water walkers: +0.17 %, the code alone on the old map the same); counts only inside h3_cli::adventure::bench::fork_workload; E08 T83b1 re-set it (+2.92 % against the old count: this change's part, the rest the earlier creep under the threshold): the state's two new blocks, the owners and the weekly contents, none on this map, add about 30 Ir to a fork's clone and drop; E08 T86b2 re-set it at master's count (+0.98 % against T83b1's count, 36 Ir more a fork: the state's blocks added since, T83b2a to T85b1, the fractions, the objects added in play, the month and the timed events, empty on this map); E09 T9c re-set it at master's count (+1.38 % against T86b2's count, 51 Ir more a fork: the state's blocks added since, E08's increment 10 and E09's store of towns, an empty Option<Arc> on this map, about 9 Ir of it as E09 T7b2a measured on fork-boxes-xl-144)"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-xl-144.h3m",
    "--workload",
    "fork",
    "--games",
    "1",
    "--days",
    "7",
    "--forks",
    "100000",
    "--seed",
    "1",
    "--battle",
    "1",
]
collect = "*fork_workload*"
instructions = 375500024
threshold_percent = 2

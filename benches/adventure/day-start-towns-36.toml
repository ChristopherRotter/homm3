# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "the step that starts day 8 (the last EndTurn of day 7: the week's step, each owned town's income, TWN-INC-001, -002, the spell points, the next turn's start) in each of 16 random games of 7 days on the town map (E09 T9c, the town epic's design note §18: e09-towns-36.h3m, 36 x 36, eight towns, four owned at load and those captured in the week): about 52 000 Ir a day start (day-start-xl-144's about 322 000 on its 144 x 144 map with an underground); the fork that tries the step is dropped before it, as day-start-xl-144's; counts only inside h3_cli::adventure::bench::day_start_step (the env's step); since E09 T19c1 re-baselined with the builds in the random agent's draw (encoding v9: the week's games build, so the day start pays more halls' and silos' income, h3_towns::daily_income 25 000 to 35 400 Ir, and clears the towns' marks; every counted function the same code): the branch +3.29 % against master's 826 336 measured in the same sandbox; E09 T26a1 re-baselined at 1 206 371 (+41.1 % against master's 854 709 measured in the same sandbox): the step now runs the towns' week and each town's inputs once (TWN-GRO-001, -003: h3_game::town::growth's grow_week and inputs, h3_towns::TownGrowth's one pass over a town's buildings); every other counted function the same code; E08 T114b re-baselined: master 1 228 742 measured in the same sandbox (+1.85 % since the last baseline, E09 T26a2's week's kind), the branch -0.01 % on it; E09 T26b re-baselined at 1 328 051 (+8.10 % against master's 1 228 566 after E08 T114b, measured in the same sandbox): the step now runs the neutral towns' garrison week (TWN-GRO-006: h3_towns::garrison_week 27 000 Ir, its draws 7 900, h3_game::town::garrison::garrison_weeks 16 500, the garrison's and the store's writes and their allocations about 30 000, siege::fort 4 000) and the Portals' loop (h3_game::town::portal::draw 4 700, has_portal 2 800); every other counted function the same code; E09 T37a re-baselined: master 1 309 163 measured in the same sandbox (-1.42 % on the last baseline), the branch +63.25 % on it: the week's taverns' release and fill (TWN-TAV-002: h3_game::town::tavern::weekly 32 %: the new records' defaults, the draws' counts, the starting armies), the new tavern heroes' first points at the turn start (tavern::start_turn 4.5 %) and the regain's skip list; every other counted function the same code; E09 T38a2 re-baselined: master 2 146 708 in the same sandbox, the branch +51.1 % on it with the same counted code (no new function): the random agent hires (encoding v12), so the day starts' states hold more heroes; E09 T38b1 re-baselined: master 3 235 965 in the same sandbox, the branch +2.11 % on it with the same counted code (the functions in the same shares, `town::leave` in none): a hero that leaves the game now comes back (a retreat or a surrender into its owner's tavern, TWN-TAV-006; a freed type drawn again with its record and one creature), so the random games changed course; E08 T141a re-baselined: master 3 273 406 in the same sandbox (#1136's code), the branch +3.44 % on it with the same counted code (the functions in the same shares): each player's list of heroes (decision 413) orders the env's hero slots (encoding v20), so the random games changed course (the games before the day starts 3 646 steps for 2 782); E09 T58a2 re-baselined: master 3 385 065 in the same sandbox, the branch -8.85 % on it with the same counted code (the functions in the same shares): `legal_commands` lists an owned town's market window (TownCommand::Market, TWN-MKT-002) and the random agent draws it (encoding v22), trading inside the windows it opens, so the random games changed course"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e09-towns-36.h3m",
    "--workload",
    "day-start",
    "--games",
    "16",
    "--days",
    "7",
    "--seed",
    "1",
]
collect = "*day_start_step*"
instructions = 3085584
threshold_percent = 2

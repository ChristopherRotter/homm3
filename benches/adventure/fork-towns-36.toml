# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "100 000 forks of the env after 7 days of random play on the town map (E09 T9c, the town epic's design note §18: the forks carry the game state's store of towns, eight records behind one reference count, ADR-0028 point 4; 66 steps): 3 548 Ir a fork (fork-xl-144's 3 755 on its map without towns, the store empty); counts only inside h3_cli::adventure::bench::fork_workload; since E09 T19c1 re-baselined with the builds in the random agent's draw (encoding v9: the week's random games changed course, so the forked state differs; fork_workload the same code): 3 328 Ir a fork, the branch -6.12 % against master"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e09-towns-36.h3m",
    "--workload",
    "fork",
    "--games",
    "1",
    "--days",
    "7",
    "--forks",
    "100000",
    "--seed",
    "1",
]
collect = "*fork_workload*"
instructions = 332800024
threshold_percent = 2

# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "100 000 forks of the env after 7 days of random play on the town map (E09 T9c, the town epic's design note §18: the forks carry the game state's store of towns, eight records behind one reference count, ADR-0028 point 4; 66 steps): 3 548 Ir a fork (fork-xl-144's 3 755 on its map without towns, the store empty); counts only inside h3_cli::adventure::bench::fork_workload; since E09 T19c1 re-baselined with the builds in the random agent's draw (encoding v9: the week's random games changed course, so the forked state differs; fork_workload the same code): 3 328 Ir a fork, the branch -6.12 % against master; E09 T28a re-baselined: master 333 800 075 in the same sandbox, the branch +6.74 % on it: the forked state changed with the random agent's town hero moves (145 steps for 182, another hero on the map: its clone about 60 Ir and malloc and free about 127 Ir a fork more), the garrison heroes' block about 23 Ir a fork; E09 T37a re-baselined: master 358 500 075 measured in the same sandbox (+0.62 % on the last baseline), the branch -5.91 % on it with the same counted code (h3_sim::adventure::env::AdventureEnv::fork +2 %: the state's taverns' stream, 32 bytes more to copy): glibc's _int_free and _int_malloc count fewer with the heap the game's new allocations leave (the town lane's TRAPS, the benchmarks follow the heap); E09 T38a2 re-baselined: master 337 300 047 in the same sandbox, the branch +38.8 % on it with the same counted code: the random agent hires (encoding v12), so the forked state holds more heroes (the heroes' Vec<HeroOnMap> clone, malloc and free); E08 T141a re-baselined: master 463 900 176 in the same sandbox, the branch +26.38 % on it with the same counted code (the functions in the same shares, `HeroOnMap` 56 bytes as before): each player's list of heroes (decision 413) orders the env's hero slots (encoding v19), so the random games changed course (the forked game 358 steps for 135, more heroes to clone); E09 T58a2 re-baselined: master 587 900 210 in the same sandbox, the branch -16.11 % on it with the same counted code (the functions in the same shares): `legal_commands` lists an owned town's market window (TownCommand::Market, TWN-MKT-002) and the random agent draws it (encoding v22), trading inside the windows it opens, so the random games changed course"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e09-towns-36.h3m",
    "--workload",
    "fork",
    "--games",
    "1",
    "--days",
    "7",
    "--forks",
    "100000",
    "--seed",
    "1",
]
collect = "*fork_workload*"
instructions = 493200482
threshold_percent = 2

# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "the reachable-tiles query of every hero of the acting player at each step of 2 random games of 28 days on the generated 144 x 144 two-level map (E08 decision 11; since E08 T20b3b2 with its monsters, whose guarded tiles end paths; since E04c T10b with the original's obstacles in its battles; since E08 T31 with its heroes near a level and one levelled at load; since E08 T40 the heroes' day's points, Pathfinding and radius from their details, which changed the games: 4 784 queries; the same games under T40's code measured -0.09 %); counts only inside h3_cli::adventure::bench::reach_queries"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-xl-144.h3m",
    "--workload",
    "reach",
    "--games",
    "2",
    "--days",
    "28",
    "--seed",
    "1",
]
collect = "*reach_queries*"
instructions = 497169538
threshold_percent = 2

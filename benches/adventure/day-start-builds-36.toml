# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "E09 T19c2 (the town epic's design note §32): the step that starts day 8 (the last EndTurn of day 7: the week's step, the towns' income, the marks cleared, then red's turn start with its town events, TWN-EVT-001, -002: the Harbour's every-day and weekly gifts) in each of 16 random games of 7 days on the builds map (e09-builds-36.h3m, 36 x 36, four towns with custom sets and town events, increment 2's own map, decision 59); the fork that tries the step is dropped before it, as day-start-towns-36's: 760 steps, about 22 500 Ir a day start, the town events 15 % (h3_game::town::events::fire_events 9 %, firing 6 %), the towns' income 19 %; counts only inside h3_cli::adventure::bench::day_start_step; master's 359 566 measured in the same sandbox (the same code, the bench binary's inlining +0.05 %); E09 T26a1 re-baselined at 567 462 (+56.9 % against master's 361 745 measured in the same sandbox): the step now runs the towns' week (TWN-GRO-003: h3_game::town::growth::grow_week 23 %, of it h3_towns::TownGrowth::of 9 %, one pass over a town's buildings for its fourteen indexes, a pass per index having cost +199 %) and each town's inputs once (TWN-GRO-001: growth::inputs 11 %, the visitors 4 %); every other counted function the same code; E08 T114b re-baselined: master 577 013 measured in the same sandbox (+1.68 % since the last baseline, E09 T26a2's week's kind), the branch +0.23 % on it (the town lane's `Told` holding the map garrisons' views, `AdventureOutcome::garrison_flagged`); E09 T28a re-baselined: master 587 514 in the same sandbox (+1.59 % since the last baseline, other changes), the branch -3.83 % on it: the towns' entrances cached in the static map (StaticMap::town_entrance), which the day's start reads through AdventureState::town_visitor in place of each town's template (about 24 600 Ir); E09 T29a re-baselined: master 565 557 in the same sandbox (+0.09 % on the last baseline), the branch +51.7 % on it with no code changed: the builds map gained red's Dungeon Pit (a Fort, the Warren and its horde, the Portal, the Grail), the neutral Rampart Grove (a Fort, two dwellings, six Centaurs), red's Valeska and red's Guardhouse (increment 3's gates), so the step grows six towns (h3_towns::growth::TownGrowth::of 50 201 to 64 910, week_growth 33 107 to 49 172), the Grove's garrison week (h3_towns::garrison::garrison_week 7 465) and the Pit's Portal (h3_towns::portal::summon 6 886, its offer 7 600) and pays a third hero's and two more towns' income; E09 T37a re-baselined: master 858 101 measured in the same sandbox (+0.01 % on the last baseline), the branch +98.98 % on it: day 8 is a week's first day, so the step runs the taverns' release and fill (TWN-TAV-002: h3_game::town::tavern::weekly 42 %, of it the first week's new records' defaults, setup::hero_details 18 %, the draws' counts, HeroPool::class_counts 11 %, the starting armies), the new tavern heroes' first points at red's turn start (tavern::start_turn 6 %) and the regain's skip list (+2 %; the full records skipped, E09 T37a: unskipped they cost +55 %); every other counted function the same code; E09 T38a2 re-baselined: master 1 718 846 in the same sandbox, the branch +104.7 % on it with the same counted code (no new function): the random agent hires (encoding v12), so the day starts' states hold more heroes (h3_heroes::max_mana, day_mana and the heroes' walks scale with them; 5 110 steps for 2 846)"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e09-builds-36.h3m",
    "--workload",
    "day-start",
    "--games",
    "16",
    "--days",
    "7",
    "--seed",
    "1",
]
collect = "*day_start_step*"
instructions = 3519275
threshold_percent = 2

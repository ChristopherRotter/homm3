# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "5 random-vs-random games of 28 days on the generated duel map (E08 decision 11; since E08 T20b3b2 with its monsters, guarded piles and grounds; since E04c T10b with the original's obstacles in its battles; since E08 T31 with its heroes' level-ups, the heroes near a level and one levelled at load: 2 858 steps, many of them battle commands, the neutral seat playing the unowned sides); counts only inside h3_sim::adventure::random_rollout (the agent, the reachable-tiles queries, apply)"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-duel-36.h3m",
    "--workload",
    "play",
    "--games",
    "5",
    "--days",
    "28",
    "--seed",
    "1",
]
collect = "*adventure*random_rollout*"
instructions = 567113377
threshold_percent = 2

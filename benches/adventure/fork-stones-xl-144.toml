# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "100 000 forks of the env after 7 days of random play on the 144 x 144 two-level map with a Learning Stone on every free tile (E08 T64b, decision 133: the forks carry the visits block, the marks of the stones the heroes entered in the game's 46 steps; 2 367 Ir a fork, as on the all-boxes map without the block: the block adds nothing to a fork); counts only inside h3_cli::adventure::bench::fork_workload"
args = [
    "adventure",
    "bench",
    "--map",
    "fixtures/maps/e08-stones-144.h3m",
    "--workload",
    "fork",
    "--games",
    "1",
    "--days",
    "7",
    "--forks",
    "100000",
    "--seed",
    "1",
]
collect = "*fork_workload*"
instructions = 236700024
threshold_percent = 2

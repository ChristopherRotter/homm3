# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "E31 T2a (ADR-0030 point 13): the original's computer player (h3_game::computer::choose) playing every player of 4 games of 28 days on the town map (fixtures/maps/e09-towns-36.h3m, 36 x 36, eight towns, red's four heroes and blue's two), the battles' sides by h3_battle_ai::choose outside the count (h3 ai computer); counts only inside h3_game::computer::choose, the policy's own cost, so lane-only (it reads the adventure lane's state through its accessors). T2a's frame: each hero done at once, the garrison steps (each day a garrison hero sent out and back), 224 turns, 664 commands (224 Enter, 216 Leave, 224 EndTurn), about 7 400 Ir a command: 66 % the hero order's primary skills (h3_heroes::primary_skills over each awake hero's effects, effective_primary_from), 10 % the frame (turn::step), 9 % the towns' owners for a garrison hero to send out (towns_of); new in T2a, no master count. E31 T2d: 4 933 409 to 207 152 091 Ir (+4 099 %), the turn start's records (h3_game::computer's start::record): 87 % the threat fold's searches, one reach per enemy hero with its day's maximum plus 800 (AdventureState::reach_with, the original's pathfinder run), about 925 000 Ir a turn, inside the 50 ms budget. E31 T2e: 207 152 091 to 228 988 508 Ir (+10.5 %), the heroes' spell gains at the turn start (start::heroes, CPU-STA-007): a caster record per hero (spells::record: fight::battle_hero's derive_battle_hero, 7.5 % of the count) and seven best spell values on it; about 1 020 000 Ir a turn. E31 T2f: 228 988 508 to 308 572 724 Ir (+34.8 %; master 229 045 298, +0.02 %), the turn start's artifacts' mean (artifacts::mean, CPU-STA-008): each of the player's heroes on the map valued for every artifact 7 to 140 (the effects' values 13 % of the count, the heroes' reads 9 %: its own morale's derive_battle_hero and each slot's free position, h3_heroes::first_position once a slot); the start's caster records reused, a plain artifact's free position read by its slot (first: 375 734 800, +64 %); about 1 380 000 Ir a turn. Re-baselined at E31 T2i0 (AI-Q41): the threat fold searches with the computer's search (h3_adventure::search, mode 3, the original's pathfinder: no fog, objects and teleporters passed, two slots a tile, over the whole map) instead of the human reach (AI-STUB-11 lifted): first 2 484 645 912 (+705 %), then a tile read once a search, the step's price reused for an identical tile, the mode-3 loop of its own and the refused relaxes cheap (-50 %, every search's result unchanged); the fold now about 85 % of the count. E31 T2i: 1 236 132 835 to 5 783 230 233 Ir (+368 %), the planning (h3_game::computer::plan, CPU-PLN-001 to -008; every hero still done after it, the walk T2j): each awake hero's danger map (a fight estimate per enemy hero and a mode-3 search from each one it loses to, 12 %), its own mode-4 search under a budget of 1 000 to 32 000 points up to five runs (20 %), its colleagues' claims (mode 2) and a mode-1 search of 500 points per explored candidate for the value field, the object values (10 %); searches without asks (modes 1 to 3, the start's threat fold included) about 63 % of the count inclusive, the search's read-ahead 10 %, the explored test 7 %; about 25.8 M Ir a turn, inside the 50 ms budget"
args = [
    "ai",
    "computer",
    "--map",
    "fixtures/maps/e09-towns-36.h3m",
    "--games",
    "4",
    "--days",
    "28",
    "--seed",
    "1",
]
collect = "h3_game::computer::choose"
instructions = 5783230233
threshold_percent = 2
lane_only = true

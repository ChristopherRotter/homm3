# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "the original's battle AI's decisions (ADR-0027 point 11, E23 T2b): 40 battles of random armies of the harvested SoD creatures (base:faithful, no heroes, every difficulty), on the open field the defender the computer against random legal commands, at a Fort both sides the computer, at most 300 steps each; counts only inside h3_battle_ai::choose (re-set on purpose at each part of E23 T3, the budget: T3a's walkers fight, so the battles are shorter and each decision costs more; T3b's hex scores search each enemy's reach, and the battles run longer again; T3c's last retaliation's gain searches the side's maps on Hard and its walkers hold back, guard their shooters and walk to the walls, and the battles run twice as long; E23 T4a's casters cast, the Faerie Dragons at every activation with a cast left, and the battles run shorter: 1 151 decisions, about 8 % more instructions each)"
args = [
    "bench-computer",
    "--games",
    "40",
    "--seed",
    "1",
]
collect = "*h3_battle_ai::choose*"
instructions = 518013597
threshold_percent = 2

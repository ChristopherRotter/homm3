# Instruction-count baseline of one `cargo xtask bench-check` workload (valgrind/callgrind, event
# Ir); the directory names the owning lane (lanes.toml). Counts are deterministic for a given
# toolchain + target + source and are compared only when both match this file. A change above
# `threshold_percent` fails verify. Update intentionally with
# `cargo xtask bench-check --update --workload <name>` and state the reason in the commit message.

toolchain = "rustc 1.97.0 (2d8144b78 2026-07-07)"
target = "x86_64-unknown-linux-gnu"

[workload]
description = "20 hosted battles of the full synthetic scenario, two scripted clients answering every turn with a strike if there is one; counts only inside h3_server::bench::serve_frame (the hello gate and the session core: decode, validate, apply, project, encode), the battle engine's legal commands and apply included, so lane-only"
args = [
    "--games",
    "20",
    "--scenario",
    "packs/synthetic/scenarios/full.toml",
    "--seed",
    "1",
]
collect = "*serve_frame*"
instructions = 301184833
threshold_percent = 2
package = "h3-server"
bin = "h3-server-bench"
lane_only = true

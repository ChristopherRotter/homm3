# Lane ownership on pull requests: `cargo xtask check-lane` (lanes.toml, docs/08-work-process.md,
# "Lanes"). A pull request changes one lane's paths (plus the common ones), or shared paths only.
# The lane comes from the branch name (`<lane>/<task>`, `shared/<topic>`) or is inferred from the
# diff. A deliberate cross-lane change carries the label `cross-lane`; adding or removing the label
# re-runs this check.
#
# Its own workflow (not a job in ci.yml), so that a label change re-runs only this check and does
# not cancel a running verify.
name: lanes

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with the target branch must exist.
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: cargo xtask check-lane
        env:
          CROSS_LANE: ${{ contains(github.event.pull_request.labels.*.name, 'cross-lane') && '--cross-lane' || '' }}
        run: cargo xtask check-lane --base "origin/${{ github.base_ref }}" $CROSS_LANE

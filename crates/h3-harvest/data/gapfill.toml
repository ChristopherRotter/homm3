# Obstacle types (BAT-GEO-004), from VCMI's table (`id` = VCMI index). Terrains by TERRNAME.txt
# name. `blocked`: for usual obstacles [dx, dy] from the anchor (its bottom-left hex, dy < 0 is
# upwards; VCMI's row-major offsets o are dy = floor((o + 8) / 17), dx = o - 17 dy), for absolute
# obstacles [x, y] on the 17 x 11 field. Obstacles that only appear on special battlefields

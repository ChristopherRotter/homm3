# What spells do in battle beyond what the executable's flag word gives (E04b T2a; pack format
# v4). The harvester derives `target` and the `damage` effect from the flags (installation.md
# 7.6); these entries add areas, chains and target conditions, by `SPTRAITS.TXT` name.
[[spells.targeting]]
spell = "Implosion"
excludes = ["war_machine"]      # spell flag 0x1000 (installation.md §7.8; M-1 settled)
sources = ["vcmi-spells-offensive"]

[[spells.targeting]]
spell = "Chain Lightning"
chain = { targets = [4, 4, 5, 5], factor_bp = 5000 }    # the jumps: BAT-MAG-006
# Neutral in the spell table, but the original's targeting code refuses the caster's own stacks
# for spell 19 (installation.md §7.8; observed in batch 2a R1); VCMI makes it smart.
side = "enemy"
sources = ["vcmi-spells-offensive", "vcmi-casting"]

[[spells.targeting]]
spell = "Frost Ring"
area = { inner = 1, radius = [1, 1, 1, 1] }
sources = ["vcmi-spells-offensive"]

[[spells.targeting]]
spell = "Fireball"
area = { radius = [1, 1, 1, 1] }
sources = ["vcmi-spells-offensive"]

[[spells.targeting]]
spell = "Inferno"
area = { radius = [2, 2, 2, 2] }
sources = ["vcmi-spells-offensive"]

[[spells.targeting]]
spell = "Meteor Shower"
area = { radius = [1, 1, 1, 1] }
sources = ["vcmi-spells-offensive"]

[[spells.targeting]]
spell = "Death Ripple"
excludes = ["undead", "war_machine"]
sources = ["vcmi-spells-offensive"]

[[spells.targeting]]
spell = "Destroy Undead"
requires = ["undead"]
sources = ["vcmi-spells-offensive"]

# Timed spells (E04b T3a; pack format v5): what each changes while active. Target, side, mass
# version, `mind` and the war-machine exclusion come from the flag word (installation.md 7.6);
# the changes, counters and Disrupting Ray's permanence from the original's code (7.9).

[[spells.timed]]
spell = "Haste"
changes = ["speed"]
counters = ["Slow"]
sources = ["exe-timed-spells", "vcmi-spells-timed"]

[[spells.timed]]
spell = "Slow"
changes = ["speed_percent"]
counters = ["Haste"]
sources = ["exe-timed-spells", "vcmi-spells-timed"]

[[spells.timed]]
spell = "Bloodlust"
changes = ["melee_attack"]
sources = ["exe-timed-spells", "vcmi-spells-timed"]

[[spells.timed]]

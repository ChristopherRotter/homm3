[heroes]
# Upgrades the harvester's pairing rule (consecutive even/odd ids of one town and level) cannot
# find: the executable gives the upgraded elementals different levels (quirk S-05).
upgrades = [
    ["Air Elemental", "Storm Elemental"],
    ["Water Elemental", "Ice Elemental"],
    ["Fire Elemental", "Energy Elemental"],
    ["Earth Elemental", "Magma Elemental"],
]
upgrade_sources = ["vcmi-elemental-upgrades"]

# Creature specialists (specialty kind 1). The executable's record holds only the creature; the
# formula is code. Step = the creature's level (the Ballista's level is 5).
[heroes.creature_specialty]
bp_per_step = 500
speed = 1
war_machine_speed = 0           # the wiki excludes the Ballista; VCMI gives it +1 too
sources = ["wiki-hero-specialty", "vcmi-specialties"]

# Spell specialists (specialty kind 3, E04b T2a). The executable's record holds only the spell;
# the formula is code: the effect grows by bp_per_level per hero level, divided by the target
# creature's level. A few heroes have a fixed damage bonus instead (`spell_damage`).
[heroes.spell_specialty]
bp_per_level = 300
fixed = [{ hero = "Ciele", bp = 5000 }, { hero = "Luna", bp = 10000 }]
sources = ["wiki-spell-specialty", "wiki-ciele", "vcmi-spell-specialties"]

# Limits of a hero's details: the pack's `[hero_params]` (Tier 2, E04a T4a; HER-DET-001,
# HER-ART-002).
[heroes.params]
primary_min = [0, 0, 1, 1]      # attack, defense, power, knowledge: lower totals count as these
primary_max = 99
backpack = 64                   # VCMI: unlimited (dispute D7, decided with the outcome, T9)
sources = ["wiki-primary-skill", "vcmi-game-config", "wiki-artifact"]


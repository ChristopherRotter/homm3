ref = "Heroes3.exe code reading (docs/formats/installation.md 7.9): the duration bonus of the Conjuring artifacts and the Ring of the Magi (0x4E4DB0); what each timed spell changes when cast (0x4448F0) and gives back when it ends (0x444510); only Bless/Curse and Haste/Slow end each other; Disrupting Ray lowers the defense at every cast and never ends (0x5A1A53)"
url = "docs/formats/installation.md"
retrieved = "2026-10-06"

[[source]]
id = "vcmi-spells-timed"
kind = "vcmi"
ref = "config/spells/timed.json (1.7.5): haste, slow, bloodlust, precision, weakness, stoneSkin, disruptingRay (cumulative, permanent), prayer, bless, curse, mirth, sorrow, fortune, misfortune: their bonuses by level and smart mass targets at Expert; counters for five pairs"
url = "https://github.com/vcmi/vcmi/blob/1.7.5/config/spells/timed.json"
retrieved = "2026-10-06"


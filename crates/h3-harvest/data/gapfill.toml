bonus = { kind = "creature_level", values = [4, 3, 2, 1, 0, 0, 0] }
sources = ["exe-spell-specialist", "vcmi-spell-specialist"]

[[spells.specialist]]
spells = ["Disrupting Ray"]
bonus = { kind = "fixed", amount = 2 }
sources = ["exe-spell-specialist", "vcmi-spell-specialist"]

[[spells.specialist]]
spells = ["Fortune"]
bonus = { kind = "total", value = 3 }
sources = ["exe-spell-specialist", "vcmi-spell-specialist"]

# When a spell is useful on a stack for a creature that draws among useful spells (E04b T7b2b,
# pack format v24; installation.md 7.21, 0x447A80): every other spell is useful whenever it is not
# active on the stack and can affect it.
[[spells.useful]]
spells = ["Shield", "Fire Shield"]
when = "enemy_melee"
sources = ["exe-useful"]

[[spells.useful]]
spells = ["Air Shield"]
when = "enemy_shooter"
sources = ["exe-useful"]

[[spells.useful]]
spells = ["Protection from Air", "Protection from Fire", "Prot. from Water", "Prot. from Earth", "Anti-Magic", "Magic Mirror"]
when = "enemy_spell_book"
sources = ["exe-useful"]

[[spells.useful]]
spells = ["Cure"]
when = "wounded"
sources = ["exe-useful"]

[[spells.useful]]
spells = ["Bloodlust"]
when = "melee"
sources = ["exe-useful"]

[[spells.useful]]
spells = ["Precision"]
when = "shooting"
sources = ["exe-useful"]

[[spells.useful]]
spells = ["Prayer"]
when = "not_acted"
sources = ["exe-useful"]

[[spells.useful]]
spells = ["Slayer"]
when = "enemy_king"
sources = ["exe-useful"]

[spells]
# The order in which a damage spell's schools meet the target's protections (quirk Q-0007).
protection_order = ["Earth", "Air", "Fire", "Water"]
protection_sources = ["exe-protection-spells"]

# Battlefield spells (E04b T5a, pack format v13; installation.md 7.15). The hex target comes from
# the flag word. A shape's steps lead from the target hex as the attacker casts it; Fire Wall's
# are mirrored for the defender, Force Field's are not.
[[spells.obstacle]]
spell = "Force Field"
obstacle = "wall"
shape = { steps = ["top_right", "top_left"], hexes = [2, 2, 3, 3], rounds = 2 }
sources = ["exe-obstacle-spells"]

[[spells.obstacle]]
spell = "Fire Wall"
obstacle = "fire"
shape = { steps = ["top_right", "top_left"], hexes = [2, 2, 3, 3], mirrored = true, separate = true, rounds = 2 }
sources = ["exe-obstacle-spells"]

# Quicksand (E04b T5c1, pack format v14; installation.md 7.16): random pits for the whole battle,
# hidden from the other side; the spell book casts it at once, so the harvester writes target
# none for a random shape although the flag word names a hex.
[[spells.obstacle]]
spell = "Quicksand"
obstacle = "pit"
shape = { hexes = [4, 4, 6, 8], random = true, separate = true }
sources = ["exe-quicksand"]

# Land Mine (E04b T5c2, pack format v15; installation.md 7.17): random mines for the whole battle,
# hidden from the other side, with the spell's damage; cast at once as Quicksand (target none),
# refused by the engine while the other side's natives would see the mines (BAT-MAG-033).
[[spells.obstacle]]
spell = "Land Mine"
obstacle = "mine"
shape = { hexes = [4, 4, 6, 8], random = true, separate = true }
sources = ["exe-land-mine"]

[[spells.other]]
spell = "Teleport"
effects = ["teleport"]
sources = ["exe-obstacle-spells"]

# Resurrection, Animate Dead and Sacrifice (E04b T6a, pack format v17; installation.md 7.18): the
# target stack and the war-machine exclusion come from the flag word, the creature conditions,
# Resurrection's temporary raise below Advanced and Sacrifice's target test as Resurrection's
# (quirk BAT-QUIRK-5) from the code.
[[spells.other]]
spell = "Resurrection"
effects = ["raise"]
requires = ["alive"]
temporary_below = "advanced"
sources = ["exe-raise"]

[[spells.other]]
spell = "Animate Dead"
effects = ["raise"]
requires = ["undead"]
sources = ["exe-raise"]

[[spells.other]]
spell = "Sacrifice"
effects = ["sacrifice"]
requires = ["alive"]
excludes = ["undead"]
tests_as = "Resurrection"
sources = ["exe-raise"]

# Clone and the Summon Elemental spells (E04b T6b, pack format v18; installation.md 7.19): Clone's
# target stack, own side and war-machine exclusion come from the flag word, its rules from the
# code; the summoned creature of spells 66-69 (Fire, Earth, Water, Air) from the cast routine.
[[spells.other]]
spell = "Clone"
effects = ["clone"]
sources = ["exe-clone-summon"]

[[spells.summon]]
spell = "Fire Elemental"
creature = 114
sources = ["exe-clone-summon"]

[[spells.summon]]
spell = "Earth Elemental"
creature = 113
sources = ["exe-clone-summon"]

[[spells.summon]]
spell = "Water Elemental"
creature = 115
sources = ["exe-clone-summon"]

[[spells.summon]]
spell = "Air Elemental"
creature = 112
sources = ["exe-clone-summon"]

# Remove Obstacle (E04b T5b, pack format v16; installation.md 7.15): the target hex comes from the
# flag word (0x100); a removable natural obstacle at every mastery, the spell obstacles by the
# table 0x5A3C64 (Fire Wall from Advanced, any at Expert).
[[spells.remove]]
spell = "Remove Obstacle"
removes = { fire = "advanced", wall = "expert", pit = "expert", mine = "expert" }
sources = ["exe-remove-obstacle"]

# The raisers (E04b T7b3, BAT-MAG-051, BAT-MAG-052): the Archangel raises another stack of its
# side for good under Resurrection's test, the Pit Lord raises Demons from a living creature's
# corpse of its side, each as the creature's cast (the casts per battle are the creature
# table's).
[[source]]
id = "exe-raisers"
kind = "original-data"
ref = "Heroes3.exe code reading (docs/formats/installation.md 7.21, the raisers): the cast's case 0 (0x448260) for the Archangel (13) finds the stack with 0x5A3CC0(side, hex, 1), Resurrection's search and test (0x5A8090 with spell 38 and the Archangels' 100 x creatures hit points), and raises it by 100 x creatures hit points for good (0x5A7560(stack, hp, 0)); for the Pit Lord (51) 0x5A3E40(side, hex) finds the topmost corpse of the side whose creature is alive (flag 0x10) on an unblocked hex without a living stack, with no spell test, and 0x5A7390 creates Demons (48) there in its army slot: min(start, min(50 x Pit Lords, start x health) div the Demon's health) (0x447330); the cursor (0x4473D0, 0x4476C0) needs that count above 0"
url = "docs/formats/installation.md"
retrieved = "2026-10-08"

[[creature_abilities]]
creature = "Archangel"
abilities = [{ kind = "stack_raiser", spell = "base:resurrection", hit_points_per_creature = 100 }]
sources = ["exe-raisers"]

[[creature_abilities]]
creature = "Pit Lord"
abilities = [{ kind = "corpse_raiser", creature = "Demon", hit_points_per_creature = 50 }]
sources = ["exe-raisers"]

# Data quirks (E04b T8e; ADR-0007, amendment E04b T8e): the packs keep the executable's value and
# an override gated by the quirk's `quirk.content` flag carries the fix, applied only in profiles
# that turn the flag off (`strict-fixed`).
[[source]]
id = "wiki-elemental-levels"
kind = "wiki"
ref = "Ice Elemental (SoD): \"Though Ice Elementals are level 3 units, the game considers them as level 4 in creature level-based calculations\" (fixed in Horn of the Abyss); the Energy and Magma Elemental pages note the same kind of level bug. The executable's creature table holds exactly these levels (survey S-05)"
url = "https://heroes.thelazy.net/index.php/Ice_Elemental"
retrieved = "2026-10-03"

[[source]]
id = "wiki-swordsman-specialty"
kind = "wiki"
ref = "Swordsman (SoD): the Swordsman specialties are \"bugged to only affect Crusaders. Fixed in Horn of the Abyss\"; batch 1a (E04a, experiments/results/E04a-batch-1a.md B4-B6) observed it for Roland only, whose record in the executable's specialty table names the Crusader (survey S-03, quirk Q-0006)"
url = "https://heroes.thelazy.net/index.php/Swordsman"
retrieved = "2026-10-03"

# BAT-QUIRK-19 (survey S-05): upgrades whose level in the executable differs from their base
# creature's; the fix gives each its base creature's level (Ice 4 -> 3, Magma 3 -> 5, Energy 5 -> 4).
[[data_quirks.base_level]]
flag = "quirk.content.elemental_levels"
creatures = ["Ice Elemental", "Magma Elemental", "Energy Elemental"]
sources = ["wiki-elemental-levels"]

# Q-0006: a creature specialist whose record names the wrong creature; the fix names the
# creature the specialty is presented for (the specialty raises it and its upgrade).
[[data_quirks.specialty_creature]]
flag = "quirk.content.roland_crusader_specialty"
hero = "Roland"
creature = "Swordsman"
sources = ["wiki-swordsman-specialty"]

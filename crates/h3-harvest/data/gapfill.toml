# ---------------------------------------------------------------------------------------------
# Battle parameters (Tier 2) of `base`. The values follow the sourced rules in
# docs/rules/catalog/battle.toml; the formation is the original's loose formation (VCMI layout
# table converted to rows). Tight formations and tactics come with E03 (BAT-SET-001).
# ---------------------------------------------------------------------------------------------

[battle]
field_width = 17                            # BAT-GEO-001
field_height = 11
side_columns = 1
army_slots = 7
damage_roll_samples = 10                    # BAT-DMG-001
attack_bonus_per_point_percent = 5          # BAT-DMG-002
attack_bonus_cap_percent = 300              # BAT-DMG-002 (Q11)
defense_reduction_per_point_permille = 25   # BAT-DMG-002
defense_reduction_cap_permille = 700        # BAT-DMG-002
defend_bonus_percent = 20                   # BAT-TRN-004
defend_bonus_min = 1                        # BAT-TRN-004
ranged_full_damage_distance = 10            # BAT-RNG-002
ranged_penalty_percent = 50                 # BAT-RNG-002
melee_penalty_percent = 50                  # BAT-RNG-003
morale_dice = 24                            # BAT-MOR-003/004 (wiki Morale: 1/24, 1/12, 1/8;
good_morale_chances = [1, 2, 3]             #   bad 1/12, 1/6, 1/4)
bad_morale_chances = [2, 4, 6]
luck_dice = 24                              # BAT-LCK-002 (wiki Luck: 1/24, 1/12, 1/8;
good_luck_chances = [1, 2, 3]               #   no bad luck in RoE/AB/SoD)
formation = [[5], [2, 8], [2, 5, 8], [0, 4, 6, 10], [0, 2, 5, 8, 10], [0, 2, 4, 6, 8, 10], [0, 2, 4, 5, 6, 8, 10]]
formation_sources = ["vcmi-layouts"]


# ---------------------------------------------------------------------------------------------
# Expansion membership: what Armageddon's Blade added (everything else is RoE = `base`).
# SoD added no creatures or factions.
# ---------------------------------------------------------------------------------------------

[ab]
sources = ["wiki-ab", "wiki-creature-pages"]
factions = ["Conflux"]
creatures = [
    # Conflux (the four classic elementals are RoE creatures that AB moved to Conflux, see below)
    "Pixie", "Sprite", "Psychic Elemental", "Magic Elemental", "Ice Elemental", "Magma Elemental",
    "Storm Elemental", "Energy Elemental", "Firebird", "Phoenix",
    # new neutral creatures
    "Azure Dragon", "Crystal Dragon", "Faerie Dragon", "Rust Dragon", "Enchanter", "Sharpshooter",
    "Halfling", "Peasant", "Boar", "Mummy", "Nomad", "Rogue", "Troll",
]

# RoE creatures whose faction/level differ in RoE. `base` uses these values; `ab` overrides them

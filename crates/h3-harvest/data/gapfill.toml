# T4c (E04b, 2026-10-07; installation.md 7.14): control. Berserk's area (the table 0x642264) and
# its exception to the polarity test (it also reaches the caster's stacks), its fixed 255 rounds
# (survey S-17) and its end at the stack's own attack; Hypnotize's limit by the stack's full hit
# points and its refusal of a mirrored stack. Each ends the other.
[[spells.timed]]

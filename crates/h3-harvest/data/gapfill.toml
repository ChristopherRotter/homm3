# Gap-fill facts for the harvester (E02 T4, OPEN-QUESTIONS Q8/Q13/Q15).
#
# The installation (GOG Complete 4.0) holds the SoD tables (H3bitmap.lod), an unpatched AB-era copy
# (H3ab_bmp.lod) and the executable's static creature table (docs/formats/installation.md). It does
# not say which content each expansion added, nor how the latest patches of RoE (1.4) and AB (2.2)
# differed from SoD. Those facts live here, each with a labelled source (docs/04-rules-and-sources.md).
# Short identifiers and titles only; no text is copied from the sources (ADR-0009).
#
# Creatures and factions are named by their singular name / town name as in the original tables.

# ---------------------------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------------------------


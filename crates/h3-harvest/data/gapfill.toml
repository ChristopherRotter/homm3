changes = ["ranged_attack"]
sources = ["exe-timed-spells", "vcmi-spells-timed"]

[[spells.timed]]
spell = "Weakness"
changes = ["attack_loss"]
sources = ["exe-timed-spells", "vcmi-spells-timed"]

[[spells.timed]]
spell = "Stone Skin"
changes = ["defense"]
sources = ["exe-timed-spells", "vcmi-spells-timed"]

[[spells.timed]]

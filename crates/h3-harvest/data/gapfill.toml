changes = ["berserk"]
area = { radius = [0, 0, 1, 2] }
side = "any"
duration = "fixed"
fixed_rounds = 255
ends = "own_attack"
counters = ["Hypnotize"]
sources = ["exe-berserk-hypnotize"]

[[spells.timed]]
spell = "Hypnotize"
changes = ["hypnotize"]
health_limit = true
refuses = ["magic_mirror"]
counters = ["Berserk"]
sources = ["exe-berserk-hypnotize"]


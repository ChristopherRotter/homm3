# ---------------------------------------------------------------------------------------------
# Expansion membership: what Armageddon's Blade added (everything else is RoE = `base`).
# SoD added no creatures or factions.
# ---------------------------------------------------------------------------------------------

[ab]
sources = ["wiki-ab", "wiki-creature-pages"]
factions = ["Conflux"]
creatures = [
    # Conflux (the four classic elementals are RoE creatures that AB moved to Conflux, see below)
    "Pixie", "Sprite", "Psychic Elemental", "Magic Elemental", "Ice Elemental", "Magma Elemental",
    "Storm Elemental", "Energy Elemental", "Firebird", "Phoenix",
    # new neutral creatures
    "Azure Dragon", "Crystal Dragon", "Faerie Dragon", "Rust Dragon", "Enchanter", "Sharpshooter",
    "Halfling", "Peasant", "Boar", "Mummy", "Nomad", "Rogue", "Troll",
]

# RoE creatures whose faction/level differ in RoE. `base` uses these values; `ab` overrides them
# with the executable's values (Conflux, levels 2/5/4/3).
[[roe_creature]]
name = "Air Elemental"
level = 4
sources = ["wiki-ab", "wiki-elementals"]

[[roe_creature]]
name = "Earth Elemental"
level = 5
sources = ["wiki-ab", "wiki-elementals"]

[[roe_creature]]
name = "Fire Elemental"
level = 4
sources = ["wiki-ab", "wiki-elementals"]

[[roe_creature]]
name = "Water Elemental"
level = 4
sources = ["wiki-ab", "wiki-elementals"]

# ---------------------------------------------------------------------------------------------
# Rows of the creature table that differ between the AB-era copy (H3ab_bmp.lod) and SoD
# (H3bitmap.lod). The harvester refuses to run if a differing row is not listed here, or a listed
# row does not differ.
#   since = "base": the change shipped in RoE patch 1.3 / AB patch 2.1 too, so the latest RoE and
#                   AB patches (Q15) already have the SoD values; no override.
#   since = "sod":  SoD-only; `base`/`ab` keep the AB-era values and `sod` overrides the changed
#                   fields.
# ---------------------------------------------------------------------------------------------

[[table_change]]
name = "Lizardman"
since = "base"
sources = ["wiki-lizardman"]

[[table_change]]
name = "Lizard Warrior"
since = "base"
sources = ["wiki-lizardman"]

[[table_change]]
name = "Serpent Fly"
since = "base"
sources = ["wiki-serpent-fly"]

[[table_change]]
name = "Dragon Fly"
since = "base"
sources = ["wiki-serpent-fly"]

[[table_change]]
name = "Angel"
since = "sod"
sources = ["wiki-angel"]

[[table_change]]
name = "Archangel"
since = "sod"
sources = ["wiki-angel"]

[[table_change]]
name = "Cerberus"
since = "sod"
sources = ["wiki-cerberus"]

# ---------------------------------------------------------------------------------------------
# Battle parameters (Tier 2) of `base`. The values follow the sourced rules in
# docs/rules/catalog/battle.toml; the formation is the original's loose formation (VCMI layout
# table converted to rows). Tight formations and tactics come with E03 (BAT-SET-001).
# ---------------------------------------------------------------------------------------------

[battle]
field_width = 17                            # BAT-GEO-001
field_height = 11
side_columns = 1
army_slots = 7
damage_roll_samples = 10                    # BAT-DMG-001
attack_bonus_per_point_percent = 5          # BAT-DMG-002
attack_bonus_cap_percent = 300              # BAT-DMG-002 (Q11)
defense_reduction_per_point_permille = 25   # BAT-DMG-002
defense_reduction_cap_permille = 700        # BAT-DMG-002
defend_bonus_percent = 20                   # BAT-TRN-004
defend_bonus_min = 1                        # BAT-TRN-004
formation = [[5], [2, 8], [2, 5, 8], [0, 4, 6, 10], [0, 2, 5, 8, 10], [0, 2, 4, 6, 8, 10], [0, 2, 4, 5, 6, 8, 10]]
formation_sources = ["vcmi-layouts"]

# ---------------------------------------------------------------------------------------------
# War machines (E03 T8): harvested from the tables like creatures (flag war_machine); the siege
# machines (Catapult, Arrow Tower) wait for sieges. Their behaviour is the war-machine rules
# (BAT-WAR-001..004) plus the abilities below.
# ---------------------------------------------------------------------------------------------

[war_machines]
harvest = ["Ballista", "First Aid Tent", "Ammo Cart"]
sources = ["wiki-ballista", "wiki-first-aid-tent", "wiki-ammo-cart"]

[[creature_abilities]]
creature = "First Aid Tent"
abilities = [{ kind = "first_aid", min_hp = 1, max_hp = 25 }]
sources = ["wiki-first-aid-tent"]

[[creature_abilities]]
creature = "Ammo Cart"
abilities = [{ kind = "ammo_supply" }]
sources = ["wiki-ammo-cart"]


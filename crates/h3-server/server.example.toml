# An example configuration for `h3-server` (E16 M2; the format: `crates/h3-server/src/config.rs`).
# Relative paths are taken from this file's directory. Run from the repository's root:
#
#   cargo run -p h3-server -- crates/h3-server/server.example.toml

[server]
bind = "127.0.0.1:7878"        # loopback; the internet only behind a TLS proxy (ADR-0018 point 2)
data = "../../target/h3-server"   # journals, replays: readable by the server's user only
checkpoint_every = 25
shadow_instance = false         # true: a second battle checks every command (E16-design.md §8)
# public_url = "wss://h3.example.org"   # the server's id, which logins sign: the address clients
                                        # dial (behind a TLS proxy); else ws:// and `bind`'s address
anonymous = true                # false: a game is joined or created only after a login
# trusted_proxies = ["127.0.0.1"]       # reverse proxies whose X-Forwarded-For (its last entry)
                                        # names the client the limits count (README.md)

[content]
packs = "../../packs"

[limits]
max_frame = 4096
messages_per_second = 20         # per connection; WebSocket pings count too
messages_per_address = 40        # per second, across one address's connections
connections = 64
connections_per_address = 8
idle_timeout_ms = 300000         # no message this long closes a connection
ping_every_ms = 15000            # a WebSocket ping to each connection (0: none)
ping_timeout_ms = 30000          # nothing heard this long, not even a pong, closes it
hello_timeout_ms = 10000         # no hello this long after the handshake closes it
lobby_timeout_ms = 60000         # in no game this long after the hello closes it
outbound_queue = 256             # frames waiting for a slow client; full drops it
outbound_bytes = 2097152         # bytes waiting for a slow client; full drops it
record_bytes = 524288            # a viewer's record keeps its latest messages within this
replays_kept = 10000             # finished games' replays kept (listed and closed each); the oldest go
games = 16
games_per_address = 2
spectators_per_game = 8         # 0: no spectators; a game's host may close it to them
empty_game_ms = 1800000         # a running game whose seats all stay empty this long pauses (0: never)
paused_game_ms = 259200000      # a paused game nobody resumes this long is void (0: never)
failed_logins_per_address = 10  # a minute; beyond, the address's logins close their connection
account_changes_per_address = 20  # an hour: registrations, re-keys, renames, preferences
commands_per_game = 10000       # a game that reaches it without an end is void

# What clients may create games from (`CreateGame { offer }`).
[[offer]]
id = "full"
scenario = "../../packs/synthetic/scenarios/full.toml"

[[offer]]
id = "duel-bot"
scenario = "../../packs/synthetic/scenarios/duel.toml"
bots = ["defender"]            # the server's random bot plays the defender

# A ranked game configuration (E16 M4; ADR-0019): its pool on one ruleset, Glicko-2 ratings in
# <data>/ladders/arena.log, a new season when its content changes. Logged-in players queue for it
# and play the matches it makes (games of `arena.1`, `arena.2`); results are rated from M4 T3b on.
[[ladder]]
id = "arena"
name = "Arena"
scenarios = ["../../packs/synthetic/scenarios/duel.toml", "../../packs/synthetic/scenarios/full.toml"]
grace_ms = 300000               # a player away longer at once forfeits
grace_total_ms = 600000         # a player away longer in all in one game forfeits
bot_after_ms = 60000            # a player waiting this long without a match plays the bot
pauses = 1                      # pauses each player may propose in a game, the other agreeing
pause_ms = 600000               # the longest of them; after it a player not back is away

# The server's bot on the ladder (E16 M4 T5): an account of its own that never logs in, rated and
# listed (flagged) as any player.
[[ladder.bot]]
login = "randy"
display = "Randy the Bot"

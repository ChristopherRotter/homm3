[package]
name = "h3-server"
description = "Adapter: hosts the engine's games for untrusted clients over WebSocket (E16, ADR-0018)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "h3-server"
path = "src/main.rs"

# The session core's workload (`benches/server/`, `cargo xtask bench-check`).
[[bin]]
name = "h3-server-bench"
path = "src/bin/h3-server-bench.rs"

[dependencies]
h3-kernel.workspace = true
h3-content.workspace = true
h3-contracts.workspace = true
h3-battle.workspace = true
h3-pack.workspace = true
h3-sim.workspace = true
h3-cli.workspace = true
h3-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
getrandom.workspace = true

[lints]
workspace = true

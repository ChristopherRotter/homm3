# E25 T33's third arm: `e25-continue.toml` (the first 2 M samples of a 20 M run from
# `e25-structure-1` #2, the entropy bonus at 0) at a quarter of the learning rate (`lr` 6.25e-5,
# #2's own at 15 M of its 20: 6.25e-5 to 5.6e-5 over the arm). A start from a trained network at
# PPO's full rate may first undo some of it; this arm measures whether a long run from #2 should
# start lower. About 2 hours on the GTX 1070. From python/:
#
#   uv run --group train python -m h3env.train --config configs/e25-continue-lr.toml --init-from runs/e25-structure-1/best.pt --out runs/e25-continue-lr-1
#
# Ctrl-C stops it at the next update boundary, checkpointed; each later part:
#
#   uv run --group train python -m h3env.train --resume runs/e25-continue-lr-1

seed = 1
samples = 2_000_000

[env]
kinds = [78, 2, 100, 50, 25, 3]

[network]
kind = "hexconv"
norm = "layer"
width = 96
layers = 6
mask_input = true
order = true
attack_hex = true
tactics_rounds = 3

[ppo]
lr = 6.25e-5
lr_horizon = 20_000_000
accumulate = 4
chunk_align = 32
shaping = true
entropy_coef = 0.0

[league]
self_play = 0.5
snapshot_every = 1_000_000
max_members = 16
live = 4
live_every = 250_000

[gate]
gate_every = 10_000_000

[ladder]
ladder_episodes = 1
ladder_final_episodes = 0

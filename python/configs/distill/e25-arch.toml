# E25 T32's architecture probes (increment 8, AI-Q17; the arms the user's, 2026-11-13: "mixed";
# `h3env.train.clone`, the distillation bench's clone mode): T26b's structure sweep
# (`e25-structure.toml`: the fair system actor as the teacher on `e25-neutral.toml`'s mix, 4 M
# samples, two passes, the same seed and held-out set) with `hexconv` normalised 96 x 6 at 1e-3,
# T26b's winner and #2's network, as the control, and three arms beside it: the control at twice
# the rate (T26b: the higher rate led in every family, 1e-3 the highest `hexconv` had), wider
# (128 x 6: about 1.34 times the control's sample-pass on the GTX 1070, T24's grid) and deeper
# (64 x 10: about 1.1 times, a wider reach on the field). Each student's ladder at the end against
# both system actors on the report set v1 and on the neutral set v1, 500 a kind (T27's), the
# clone's ladder the predictor of PPO's endpoint (T22, T28). About 7 hours of the GTX 1070 (T26b's
# 683 us a sample-pass for the control; 917 and 757 for the wider and the deeper by the grid). The
# measures and the rule: the AI queue's T32. From python/:
#
#   uv run --group train python -m h3env.train.distill --teacher system --config configs/distill/e25-arch.toml --out runs/arch-1
#
# It resumes (E25 T26a): Ctrl-C stops it at the next minibatch, scored and saved (a part under 2
# hours, the user's rule); each later part continues it to the budget, then plays the ladders:
#
#   uv run --group train python -m h3env.train.distill --resume runs/arch-1
run = "configs/e25-neutral.toml"
seed = 7
samples = 4_000_000
heldout = 16_384
eval_every = 500_000
envs = 256
rollout = 128
epochs = 2
minibatch = 512
lr = 3e-4
lr_floor = 0.1
value_coef = 0.5
max_grad_norm = 0.5
device = "auto"
ladder = ["system", "system-all-seeing"]
ladder_per_kind = 500

# The control: T26b's winner (`e25-structure.toml`'s student of the same name), #2's network.
[students.hexconv-n-96x6-a]
kind = "hexconv"
norm = "layer"
width = 96
layers = 6
mask_input = true
order = true
attack_hex = true
lr = 1e-3
warmup = 131_072
weight_decay = 0.01

# The rate: the control at twice T26b's highest `hexconv` rate.
[students.hexconv-n-96x6-lr2]
kind = "hexconv"
norm = "layer"
width = 96
layers = 6
mask_input = true
order = true
attack_hex = true
lr = 2e-3
warmup = 131_072
weight_decay = 0.01

# Wider: 128 channels, the control's 6 blocks.
[students.hexconv-n-128x6]
kind = "hexconv"
norm = "layer"
width = 128
layers = 6
mask_input = true
order = true
attack_hex = true
lr = 1e-3
warmup = 131_072
weight_decay = 0.01

# Deeper: 10 blocks of 64 channels (20 convolutions, each a hex's six neighbours).
[students.hexconv-n-64x10]
kind = "hexconv"
norm = "layer"
width = 64
layers = 10
mask_input = true
order = true
attack_hex = true
lr = 1e-3
warmup = 131_072
weight_decay = 0.01

# E06 T3b's hour with gates on the user's machine (design §9, §10): E05's pool run with a gate
# every 5 M samples (about 10 minutes at E05's 8 500 samples/s), each promotion's ladder on the
# first 250 episodes per kind of the report set v1, the final best's on all 500. It measures what
# the gates and ladders cost (the record's `progress.evaluation_minutes` against `minutes`), from
# which T4's configs set `gate_every` and `ladder_episodes` (evaluation under about 20 %).
#
#   uv run --group train python -m h3env.train --config configs/e06-t3b.toml --out runs/t3b-1

seed = 1
samples = 30_000_000

[pool]
pool_share = 0.5
pool_size = 8
pool_every = 600_000

[gate]
gate_every = 5_000_000

[ladder]
ladder_episodes = 250
ladder_final_episodes = 500

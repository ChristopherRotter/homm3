# E05's pool run (`docs/epics/E05-log.md`, T8c) with its budget and cadences in samples (E06 T2a,
# ADR-0026): about 40 minutes on the user's machine at E05's rate (8 500 samples/s). A config
# states what differs from `h3env.train.run.Config`'s defaults; these repeat them to show them.
#
#   uv run --group train python -m h3env.train --config configs/pool-smoke.toml --out runs/smoke

seed = 1
samples = 20_000_000

[pool]
pool_share = 0.5
pool_size = 8
pool_every = 600_000

[evaluation]
eval_every = 5_000_000

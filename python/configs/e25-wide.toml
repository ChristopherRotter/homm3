# E25 T7d's run (T7c, the user's choice 2026-10-30): `e25-scale.toml`'s settings with the MLP's
# layers twice as wide (`[network] hidden = 1024`, the distillation bench's best student,
# `records/distill/distill-1.json`), from scratch, at T4b's 20 M samples (the scale run was flat
# from 20 M). Against `e25-scale-1`. On the user's machine (about 1.5 to 2 hours):
#
#   uv run --group train python -m h3env.train --config configs/e25-wide.toml --out runs/e25-wide-1
#   uv run --group train python -m h3env.train --resume runs/e25-wide-1

seed = 1
samples = 20_000_000

[env]
kinds = [0, 0, 100, 50, 25, 0]

[network]
hidden = 1024
tactics_rounds = 3

[ppo]
shaping = true

[league]
self_play = 0.5
snapshot_every = 1_000_000
max_members = 16
live = 4
live_every = 250_000

[gate]
gate_every = 10_000_000

[ladder]
ladder_episodes = 250
ladder_final_episodes = 500

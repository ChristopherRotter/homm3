# The Multiplayer dialog's first stage (§2.6: multiplayer_dialog_init 0x50E050, its stage 1
# multiplayer_stage_types 0x50EFC0; E27 M2 T7): at (173, 55), 454 x 490, over the screen as the
# game type menu left it; a shadow (recorded: `mp-new`; its constructor's flags are 0, so the
# shadow comes from how it is shown, not read). Its items in the order it adds them: mupopup.pcx (100);
# the DEF buttons Hot Seat (102, without the CD notice), IPX, TCP/IP, Modem, Direct Connect,
# Online (101), Cancel (124: its item 64 x 48 over its 32 rows, CLT-Q89); the player's name, an
# edit (125: smalfont.fnt, colour 4, left, 21 with its terminator); the status line (123:
# colour 1 made with the flag 8, so drawn in 3; centred; its box filled with entry 32); the map's
# picture over the list (129). Stage 2's Host, Join, Search, headings, scroll bar and rows are not
# built (decision 10, CLT-STUB-6). Hints and help: Help.txt 264 + id - 100 (the key catalogue).
[multiplayer]
place = [173, 55]
shadow = [454, 490]


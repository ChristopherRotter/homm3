# The game shell's screens at the native resolution (E27 M2 T4; docs/epics/E27-design.md §2).
# The numbers are the executable's; loader: h3_view::shell::look (the format is provisional until
# M2's review, T8). Each built screen: the picture copied whole onto the screen first, then its
# dialog's items (h3_ui::ui), drawn in the order the executable adds them.

# The players' palette (32 entries a player): a box's frame in the viewing player's colours (E27
# M2 T6a: red at the main menu).
player_palette = "PLAYERS.PAL"

# The cursor the menu loop sets (0x4EE842): the arrow, the default cursor's frame 0.
[cursor]
def = "crdeflt.def"
frame = 0

# The message boxes over the shell's screens (E27 M2 T6a: Quit's question, GENRLTXT 70 in a box of
# style 2; the buttons' help, style 4): the battle's [message] (message_box 0x4F6570), the
# executable's literals; h3_view::message lays them out.
[message]
background = "diboxbck.pcx"
frame = "dialgbox.def"
button_back = "Box64x30.pcx"
ok = "iOkay.def"
cancel = "iCancel.def"
font = "medfont.fnt"
caption_font = "smalfont.fnt"
font_palette = "game.pal"
spell_pictures = "spellScr.def"
resources = "resour82.def"
cursor = "crdeflt.def"

# The main menu (§2.3: main_menu_create 0x4FB2A0): a dialog at (0, 0, 800, 600) with no picture
# of its own over the loop's GamSelBk.pcx; its five DEF buttons (group 0, four frames: 0, pressed
# 1, disabled 2, selected 3, the hover) in this order, their rectangles from main_menu_layout
# 0x63FF28. Their hotkeys are the shell's key table's (h3_view::shell::keys), their help the
# user's Help.txt's (E27 M2 T6a). The hover's redraw shows (520, 4, 250, 567), all five inside it
# (main_menu_proc 0x4FBACD).
[main_menu]
background = "GamSelBk.pcx"
redrawn = [[520, 4, 250, 567]]

[main_menu.dialog]
place = [0, 0]

[[main_menu.dialog.items]]

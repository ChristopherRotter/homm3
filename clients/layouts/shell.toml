id = 101
def = "mmenung.def"
at = [540, 10]
size = [207, 121]

[[main_menu.dialog.items]]
kind = "button"
id = 102
def = "mmenulg.def"
at = [532, 132]
size = [226, 120]

[[main_menu.dialog.items]]
kind = "button"
id = 103
def = "mmenuhs.def"
at = [524, 251]
size = [239, 106]

[[main_menu.dialog.items]]
kind = "button"
id = 104
def = "mmenucr.def"
at = [557, 359]
size = [173, 110]

[[main_menu.dialog.items]]
kind = "button"
id = 105
def = "mmenuqt.def"

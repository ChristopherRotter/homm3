# The scenario screen (§3: scenario_dialog_create 0x579960; E27 M3 T1a: a new single scenario's,
# the list hidden): a dialog at (0, 0, 800, 600) over one of two backgrounds by the draw (the
# constructor's "gamselb%d.pcx": random_between(1, 100) < 51 gives gamselb1.pcx), the right-hand
# panel's picture first, then the items in the order the constructor adds them (the network's,
# the list's, the advanced options' and the random map's not yet: M3 T1b to T5), then what the
# redraw draws itself, as items of the client's own ids (1000 on: no hint, no right press). The
# texts: h3_view::shell::scenario::LABELS and the screen's (its entry's).

# The battle screen's layout at the native resolution (E17 M1 T7; ADR-0020 point 3). The numbers
# are the executable's (docs/epics/E17-design.md §4, read 2026-10-13); an HD layout is another file
# of this format. Loader: h3_view::layout (the format is provisional until the M1 review).

frame = [800, 600]
# The hex boxes (§4.1, 0x4642D0): left = 14 + 44 c + 22 e, top = 86 + 42 r, e = 1 on even rows.
hex_origin = [14, 86]
hex_step = [44, 42]
even_row_shift = 22
# Where sprites stand: the box's centre column, 42 px below its top (the hex record's anchor).
anchor = [22, 42]
# A creature's canvas (§4.2, 0x43E140): top-left at the anchor - (196, 267) facing right; mirrored
# facing left, its left edge at the anchor's x - the DEF's width + 196.
stack_canvas = [196, 267]
# The layer-1 obstacles' pass reads these columns (§4.6, 0x494440).
before_stacks_columns = [1, 15]
# The outlines' palette and the active stack's entry (§4.2: 0x6AACB0, entry 0x60).
outline_palette = "game.pal"
outline_active = 96
# Its range's entries (96-103): each idle step rotates them by one (0x4960D0 via 0x522950, §4.2).
outline_ramp = 8
# The heroes' and their flags' canvases, top-left corners, the left side's and the right side's
# (§4.5, `battle_redraw` 0x494701): each flag, then its hero; the right hero mirrored in its
# canvas (E17 M3 T3a).
hero_canvas = [[-43, -19], [693, -19]]
flag_canvas = [[29, 20], [755, 20]]
# The players' colours (0x5FFE20): a flag takes its player's 32 entries over 224-255.
player_palette = "PLAYERS.PAL"

# A stack's count box (§4.3, `draw_battle_stack` 0x43E568; E17 M3 T4a): the picture, index 0
# transparent, beside the stack; its inside tinted (0x44E940); the count in the font, centred.
[count_box]
picture = "CmNumWin.pcx"
font = "tiny.fnt"
font_palette = "game.pal"
# From the anchor, the hex ahead free: facing right, facing left (x negated); a two-hex stack's x
# +44; the hex ahead taken: x -37 and y -15; free: x + the creature's troop-count offset.
beside = [[22, -15], [52, -30]]
two_hex = 44
taken = [-37, -15]
# The tint over the inside, from (1, 1), 28 x 9: without spells hue 0.75, saturation 0.8 (the
# bits of the executable's f32 values).
tint_rect = [[1, 1], [28, 9]]
tint = [0x3F400000, 0x3F4CCCCD]
# The count's text box from the box's corner, the text drawer's colour (game.pal's entry 13) and
# alignment (centred).
text_size = [30, 15]
text_colour = 4
text_align = 1

# The battle log's item in the panel (design §9.5; E17 M3 T4b-2b-1): its picture drawn opaque at
# its corner (the panel's (0, 556) plus (214, 7)), then the shown entries in the font over it,
# in the item's 400 x 32 box, with the text drawer's colour 1 and alignment 1 (centred).
[log]
picture = "cRollovr.pcx"
place = [214, 563]
size = [400, 32]
font = "smalfont.fnt"
font_palette = "game.pal"
colour = 1
align = 1

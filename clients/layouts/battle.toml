# The battle screen's layout at the native resolution (E17 M1 T7; ADR-0020 point 3). The numbers
# are the executable's (docs/epics/E17-design.md §4, read 2026-10-13); an HD layout is another file
# of this format. Loader: h3_view::layout (the format is provisional until the M1 review).

frame = [800, 600]
# The hex boxes (§4.1, 0x4642D0): left = 14 + 44 c + 22 e, top = 86 + 42 r, e = 1 on even rows.
hex_origin = [14, 86]
hex_step = [44, 42]
even_row_shift = 22
# Where sprites stand: the box's centre column, 42 px below its top (the hex record's anchor).
anchor = [22, 42]
# A creature's canvas (§4.2, 0x43E140): top-left at the anchor - (196, 267) facing right; mirrored
# facing left, its left edge at the anchor's x - the DEF's width + 196.
stack_canvas = [196, 267]
# The layer-1 obstacles' pass reads these columns (§4.6, 0x494440).
before_stacks_columns = [1, 15]
# The outlines' palette and the active stack's entry (§4.2: 0x6AACB0, entry 0x60).
outline_palette = "game.pal"
outline_active = 96
# Its range's entries (96-103): each idle step rotates them by one (0x4960D0 via 0x522950, §4.2).
outline_ramp = 8
# The stack the mouse marks (0x43E23A, E17 M3 T6c-1): entry 0x70 (112-119), its range rotated as
# the active one's; the active stack's outline wins (0x43E259).
outline_mouse = 112
# The heroes' and their flags' canvases, top-left corners, the left side's and the right side's
# (§4.5, `battle_redraw` 0x494701): each flag, then its hero; the right hero mirrored in its
# canvas (E17 M3 T3a).
hero_canvas = [[-43, -19], [693, -19]]
flag_canvas = [[29, 20], [755, 20]]
# The players' colours (0x5FFE20): a flag takes its player's 32 entries over 224-255.
player_palette = "PLAYERS.PAL"
# The movement shade's cell (E17 M5 T4c2a, §7.23; loaded at 0x463385): drawn at a shaded hex's box
# corner into the background, each pixel of a non-zero index halving what lies under it
# (0x44E6A0).
cell_shade = "ccellshd.pcx"

# A stack's count box (§4.3, `draw_battle_stack` 0x43E568; E17 M3 T4a): the picture, index 0
# transparent, beside the stack; its inside tinted (0x44E940); the count in the font, centred.
[count_box]
picture = "CmNumWin.pcx"
font = "tiny.fnt"
font_palette = "game.pal"
# From the anchor, the hex ahead free: facing right, facing left (x negated); a two-hex stack's x
# +44; the hex ahead taken: x -37 and y -15; free: x + the creature's troop-count offset.
beside = [[22, -15], [52, -30]]
two_hex = 44
taken = [-37, -15]
# The tint over the inside, from (1, 1), 28 x 9: without spells hue 0.75, saturation 0.8 (the
# bits of the executable's f32 values).
tint_rect = [[1, 1], [28, 9]]
tint = [0x3F400000, 0x3F4CCCCD]
# The count's text box from the box's corner, the text drawer's colour (game.pal's entry 13) and
# alignment (centred).
text_size = [30, 15]
text_colour = 4
text_align = 1

# The mouse over the battle (design §9.9; E17 M3 T6c-1).
[mouse]
# The battlefield's part of the screen (0x4753E4): below it the panel.
field = [800, 556]
# The heroes' rectangles, the attacker's and the defender's: left, top, right, bottom, inclusive
# (`screen_to_hex` 0x4647A0, from 0x4626A0 and 0x4626D0).
heroes = [[0, 16, 57, 127], [741, 16, 799, 127]]
# A siege's keep's rectangle ("hex" 0xFE) and its upper tower's (0xFF), the same way, tested after
# the heroes' (set for every battle by 0x462700 and 0x462730; E17 M4 T2c-2: the client takes them
# in a siege only, CLT-Q21).
keep = [742, 160, 799, 337]
tower = [564, 0, 651, 85]
# A hex box's slanted top edge, its height: a point above it is the row above's (0x4648B6).
slant = 10
# A hex's centre from its box's corner: the attack's slot is the mouse's angle from it (0x474A54).
centre = [22, 26]
# The combat cursor (the mouse manager's type 2, 0x67FF38), its frames' hot spots (0x67FF50: the
# canvas's corner is the mouse less these) and the frame over the panel (0x47551F).
cursor = "CRCOMBAT.DEF"
hot = [
    [8, 9], [10, 11], [12, 10], [12, 12], [12, 10], [6, 9], [0, 0], [22, 0], [30, 6], [20, 21],
    [0, 21], [0, 6], [0, 0], [6, 0], [6, 31], [14, 0], [12, 12], [12, 10], [12, 12], [12, 12],
]
panel_frame = 6
# The spell cursor (E17 M5 T3b): the mouse manager's type 3, set by a spell's aim over a hex it
# takes (0x59F700); its frames' hot spot (0x67FF50: the same for all), its frames (group 0's) and
# the time between them (the mouse poll's second grid, 0x50D827).
spell_cursor = "CRSPELL.DEF"
spell_hot = [18, 27]
spell_frames = 20
spell_step = 100

# The panel below the battlefield (design §9.5, §9.7; E17 M3 T4b-2b-1, T6a): a dialog of the
# executable's items, each `kind` drawn by its own drawer (h3_view::ui), in the order the
# executable adds them (`battle_panel_base` 0x46B610, then `battle_panel_create` 0x46BC30), each
# at the panel's corner plus its `at`; `id` is the executable's control id (h3_view::panel names
# them). A button's frames default to the constructor's: 0 normal, 1 pressed, 2 disabled, 3
# selected. A `hint` is the key of the status line's text while the mouse is over the item
# (`SetHints` 0x5FE840, from `Help.txt`; E17 M3 T6c-1): the log's item and its scroll buttons have
# none (their rows' first field is empty). A button's hotkeys (its +0x48, the scan codes
# `battle_panel_base` adds) are the battle window's table of keys' (h3_view::keys, E24 M3 T1b).
[panel]
place = [0, 556]

# The picture (0x46B704), in the acting player's colours (0x450520). It takes the mouse where no
# control does (E17 M4 T3b: the hovered item, `hovered_item` 0x6AAC68, at the park point: id
# 2000, its box (0, 556, 800, 44), its state 6), with no hint: entering it writes an empty line.
[[panel.items]]
kind = "picture"
id = 2000
picture = "cbar.pcx"
at = [0, 0]
size = [800, 44]

# The buttons, 48 x 36 (0x46B765 to 0x46BAB8): Surrender, Retreat, the options, Auto Combat.
[[panel.items]]
kind = "button"
id = 2001
def = "icm001.def"
at = [54, 5]
size = [48, 36]
hint = "battle.control.surrender"

[[panel.items]]
kind = "button"
id = 2002
def = "icm002.def"
at = [105, 5]
size = [48, 36]
hint = "battle.control.retreat"

[[panel.items]]
kind = "button"
id = 2003
def = "icm003.def"
at = [3, 5]
size = [48, 36]
hint = "battle.control.options"

[[panel.items]]
kind = "button"
id = 2004
def = "icm004.def"
at = [156, 5]
size = [48, 36]
hint = "battle.control.auto"

# The hero's spell book, Wait, Defend.
[[panel.items]]
kind = "button"
id = 2008
def = "icm005.def"
at = [645, 5]
size = [48, 36]
hint = "battle.control.spell-book"

[[panel.items]]
kind = "button"
id = 2009
def = "icm006.def"
at = [696, 5]
size = [48, 36]
hint = "battle.control.wait"

[[panel.items]]
kind = "button"
id = 2010
def = "icm007.def"
at = [747, 5]
size = [48, 36]
hint = "battle.control.defend"

# The battle log's item (0x46BCBE; §9.5): its picture opaque, at most the item's 400 x 32 of it,
# then the shown entries in the font over it, the text drawer's colour 1 and alignment 1
# (centred).
[[panel.items]]
kind = "text"
id = 2005
picture = "cRollovr.pcx"
at = [214, 7]
size = [400, 32]
font = "smalfont.fnt"
font_palette = "game.pal"
colour = 1
align = 1

# The log's scroll buttons, 18 x 17 (0x46BD35, 0x46BDCE): up frames 0 and 1, down 2 and 3; each
# disabled shows its pressed frame (0x46BD65, 0x46BE1A).
[[panel.items]]
kind = "button"
id = 2006
def = "ComSlide.def"
at = [624, 5]
size = [18, 17]
frames = { normal = 0, pressed = 1, disabled = 1 }

[[panel.items]]
kind = "button"
id = 2007
def = "ComSlide.def"
at = [624, 24]
size = [18, 17]
frames = { normal = 2, pressed = 3, disabled = 3 }


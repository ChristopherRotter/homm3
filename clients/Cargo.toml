# The client workspace (E17, clients/README.md, ADR-0020).
# Separate from the engine workspace (the root Cargo.toml excludes `clients`): its own lockfile,
# deny policy and CI job. Engine crates are path dependencies; their `workspace = true` fields
# resolve from the engine's root manifest.
[workspace]
resolver = "3"
members = [
    "crates/h3-assets",
    # The Bink video decoder (E17 M5 T4b2a, CLT-Q29): a port of FFmpeg's, pure.
    "crates/h3-bink",
    "crates/h3-render",
    "crates/h3-sdl",
    # What both viewers share (E24 M3 T1a, the user's decision at T0): common to both client lanes.
    "crates/h3-ui",
    "crates/h3-view",
    # The adventure map client (the map-client lane, E24).
    "crates/h3-map-view",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-2.0-or-later"
publish = false

[workspace.dependencies]
# Client crates.
h3-assets = { path = "crates/h3-assets" }
h3-bink = { path = "crates/h3-bink" }
h3-render = { path = "crates/h3-render" }
h3-sdl = { path = "crates/h3-sdl" }
h3-ui = { path = "crates/h3-ui" }
# Engine crates (public crates only, ADR-0020 point 1). A change the client needs in one of them
# goes through that crate's lane.
h3-formats = { path = "../crates/h3-formats" }
# The record's types and the sans-I/O session (E17 M1 T7): the viewer's input (ADR-0020 point 8).
h3-protocol = { path = "../crates/h3-protocol" }
# The headless renderer's scenario adapter only (E17 M1 T7, *provisional*, the M1 review list): a
# scenario file and its packs become a battle setup, as `h3 run` reads them; never in a pure crate.
h3-battle = { path = "../crates/h3-battle" }
h3-kernel = { path = "../crates/h3-kernel" }
h3-pack-battle = { path = "../crates/h3-pack-battle" }
# The capture harness's situations (E17 M2 T1, *provisional*, the M2 review list): a scenario's
# battle as a map the original plays (`h3-view situation`), with h3-map's writer; and the ruleset's
# type, which the scenario adapter names. Never in a pure crate.
h3-content-battle = { path = "../crates/h3-content-battle" }
h3-content = { path = "../crates/h3-content" }
h3-contracts = { path = "../crates/h3-contracts" }
h3-map = { path = "../crates/h3-map" }
# Light dependencies (the engine's versions and features).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# The asset tables' parser (E17 M1 T4): serde is the engine's (without std); toml is the engine's
# crate in a newer major version, the first that parses without std (the engine has 0.8, std only).
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# The language packs' parser (E17 M3 T4b-1: nested JSON, the user's choice of 2026-10-19): the
# engine's version and features (`h3-protocol` has it without std), so the lockfile gains nothing.
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# The platform adapter's (E17 M2 T5a, ADR-0024): SDL 3 built from its sources by `sdl3-src` (CMake
# and a C compiler) and linked statically, one executable; the subsystems the client does not use
# left out (audio stays: T5b). Only `h3-sdl` names it.
sdl3-sys = { version = "0.7.2", default-features = false, features = [
    "build-from-source-static",
    "no-sdl-camera",
    "no-sdl-dialog",
    "no-sdl-gpu",
    "no-sdl-haptic",
    "no-sdl-hidapi",
    "no-sdl-joystick",
    "no-sdl-power",
    "no-sdl-sensor",
    "no-sdl-tray",
] }
# A game on a server (E17 M5 T6a; the user, 2026-10-30: the server's stack, blocking on the I/O
# thread only): the WebSocket client, dialing `wss://` through rustls with the pure-Rust graviola
# backend and the operating system's roots, as the server dials its peers (ADR-0021 point 4); the
# welcome's Ed25519 signature checked strictly; the hello's nonce from the OS. The engine's
# versions; `ring` and `aws-lc` are not GPLv2-compatible: no default features. Licenses: MIT OR
# Apache-2.0 (tungstenite, getrandom), Apache-2.0 OR ISC OR MIT (rustls, rustls-native-certs),
# Apache-2.0 OR ISC OR MIT-0 (rustls-graviola), BSD-3-Clause (ed25519-dalek). Only `h3-view`'s
# binary names them.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
rustls-native-certs = "0.8"
ed25519-dalek = "3"
getrandom = "0.3"
# Test-only (the engine's version and features).
# MP3 for the music (E17 M2 T5b; ADR-0024 point 5): pure Rust, minimp3's samples.
nanomp3 = { version = "0.2", default-features = false, features = ["std"] }
proptest = { version = "1", default-features = false, features = ["std"] }

# The engine's lints (root Cargo.toml), unchanged. The engine's clippy.toml and rustfmt.toml at the
# repository root apply here too (both tools search the parent directories).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"

# The engine's codegen settings (overflow checks on in release too, ADR-0003 §6).
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
panic = "unwind"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16
overflow-checks = true
panic = "unwind"

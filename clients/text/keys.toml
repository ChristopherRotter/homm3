# The key catalogue (E17 M3 T4b-1; the format: clients/README.md, "The string catalogue";
# docs/epics/E17-design.md §9). Every text the client shows is a key's message; the language packs
# (nested JSON) give the messages, and the original's own text is read at run time from the user's
# text tables through the `original` forms below. Identifiers and numbers only (ADR-0009): never
# the original's text, nor a translation of it (CLT-Q7).
#
# A key: `id`; `args`, the arguments its messages may use (`text` or `number`); `plural`, forms by
# the number `count`; `contexts`, forms by the argument `context`; `original`, its forms in the
# original's tables: `form` (its suffix: a plural category, a context, none for the only form),
# `at = "<TABLE>:<record>[:<column>]"` (records from 0 with the header rows, as the parser reads
# them; VCMI's `core.genrltxt.<n>` is GENRLTXT's record n + 1) and `printf`, the arguments its `%s`
# and `%d` stand for in order. A family: a key per entry of the asset tables (`creature`:
# `creature.<table>:<key>`, the creature's names; `spell` and `hero` since E17 M3 T7b-1), its row
# the `first`-based non-blank record of its original id (with `by`, the records whose column `by`
# is filled), its forms' columns in `forms`, or a single form's in `column`.
#
# The battle log's lines, as the executable writes them (read in M3 T4b-2a; docs/epics/E17-design.md
# §9.4; composed by `h3_view::battle_log`). The executable's row n of a table is its record n here,
# the header included. A creature's name is the singular for a count of exactly 1, else the plural.

# A strike's or a shot's damage (0x469A90's first row); `count`: the striking stack's number, which
# also picks the attacker's name.
[[key]]
id = "battle.log.damage"
args = { attacker = "text", damage = "number" }
plural = true
original = [
    { form = "one", at = "GENRLTXT:377", printf = ["attacker", "damage"] },
    { form = "other", at = "GENRLTXT:378", printf = ["attacker", "damage"] },
]

# The creatures a strike killed, after its damage line (the row starts a new line); `count`: how
# many, which also picks the name (or the word for creatures when the strike killed several kinds).
[[key]]
id = "battle.log.perish"
args = { creature = "text" }
plural = true
original = [
    { form = "one", at = "GENRLTXT:379", printf = ["creature"] },
    { form = "other", at = "GENRLTXT:380", printf = ["count", "creature"] },
]

# A war machine the strike destroyed, after the damage line instead of the perish row (the row
# starts a new line).
[[key]]
id = "battle.log.destroyed"
args = { creature = "text" }
original = [{ at = "GENRLTXT:668", printf = ["creature"] }]

# A stack waits (not in the tactics phase); `count`: its number.
[[key]]
id = "battle.log.wait"
args = { creature = "text" }
plural = true
original = [
    { form = "one", at = "GENRLTXT:137", printf = ["creature"] },
    { form = "other", at = "GENRLTXT:138", printf = ["creature"] },
]

# A stack defends (a war machine writes nothing); `count`: its number; `defense`: the skill it
# gains, max(1, its defense x 20 / 100) in the executable (0x479758).
[[key]]
id = "battle.log.defend"
args = { creature = "text", defense = "number" }
plural = true
original = [
    { form = "one", at = "GENRLTXT:121", printf = ["creature", "defense"] },
    { form = "other", at = "GENRLTXT:122", printf = ["creature", "defense"] },
]

# Good morale: the stack acts again; its name by its number.
[[key]]
id = "battle.log.morale-good"
args = { creature = "text" }
original = [{ at = "GENRLTXT:34", printf = ["creature"] }]

# Bad morale: the stack loses its turn; its name by its number.
[[key]]
id = "battle.log.morale-bad"
args = { creature = "text" }
original = [{ at = "GENRLTXT:35", printf = ["creature"] }]

# Good luck on a strike or a shot; the striker's name by its number. (The battle writes no line
# for bad luck: the original has none.)
[[key]]
id = "battle.log.luck-good"
args = { creature = "text" }
original = [{ at = "GENRLTXT:46", printf = ["creature"] }]

# Fear freezes a stack (E17 M3 T7b-2b-2b): the frightening creature's name by the number of them on
# the other side (0x464EE0), then the frozen stack's by its own.
[[key]]
id = "battle.log.fear"
args = { frightener = "text", creature = "text" }
original = [{ at = "GENRLTXT:729", printf = ["frightener", "creature"] }]

# The First Aid Tent heals a stack (0x478CE4, E17 M3 T6b): the tent's name and the patient's, each
# by its own number; `hit_points`: the hit points healed. Its row's line break joins or splits it
# as any line's (0x472E90).
[[key]]
id = "battle.log.heal"
args = { healer = "text", creature = "text", hit_points = "number" }
original = [{ at = "GENRLTXT:415", printf = ["healer", "creature", "hit_points"] }]

# A round starts outside the tactics phase (`round_start` 0x4761E9, E17 M3 T6b; the battle's first
# round writes none).
[[key]]
id = "battle.log.round"
original = [{ at = "GENRLTXT:413" }]

# A hero casts a spell on a stack (`battle_log_cast` 0x5A8950, the caster kind 0 with a target;
# E17 M3 T7b-1): the hero's name, the spell's and the stack's by its number.
[[key]]
id = "battle.log.cast-on"
args = { hero = "text", spell = "text", creature = "text" }
original = [{ at = "GENRLTXT:196", printf = ["hero", "spell", "creature"] }]

# A spell resisted by the stack it was aimed at (`cast_spell` 0x5A1FB0, E17 M3 T7b-1): the stack's
# name by its number, and the verb `word.resist` by it.
[[key]]
id = "battle.log.resisted"
args = { creature = "text", verb = "text" }
original = [{ at = "GENRLTXT:190", printf = ["creature", "verb"] }]

# Disrupting Ray's line (`cast_spell` 0x5A1B0B, E17 M3 T7b-2a): the defense it took from the stack.
[[key]]
id = "battle.log.disrupted"
args = { defense = "number" }
original = [{ at = "GENRLTXT:92", printf = ["defense"] }]

# A hero's spell aimed over a stack (E17 M3 T7b-1, *provisional*: the aiming loop is not read):
# the spell's name and the stack's by its number; elsewhere on the battlefield the spell's alone.
[[key]]
id = "battle.hint.cast-on"
args = { spell = "text", creature = "text" }
original = [{ at = "GENRLTXT:28", printf = ["spell", "creature"] }]

[[key]]
id = "battle.hint.cast"
args = { spell = "text" }
original = [{ at = "GENRLTXT:27", printf = ["spell"] }]

# The status line's hints over the battlefield (`battle_status_line` 0x492840; E17 M3 T6c-1,
# docs/epics/E17-design.md §9.9): `creature` the acting stack's or the target's name by its number
# (the stack looked at: its singular), as the cursor's kind says. A strike's and, while the army
# info is off, a shot's are the same row.
[[key]]
id = "battle.hint.move"
args = { creature = "text" }
original = [{ at = "GENRLTXT:295", printf = ["creature"] }]

[[key]]
id = "battle.hint.fly"
args = { creature = "text" }
original = [{ at = "GENRLTXT:296", printf = ["creature"] }]

[[key]]
id = "battle.hint.attack"
args = { creature = "text" }
original = [{ at = "GENRLTXT:221", printf = ["creature"] }]

[[key]]
id = "battle.hint.view"
args = { creature = "text" }
original = [{ at = "GENRLTXT:298", printf = ["creature"] }]

[[key]]
id = "battle.hint.heal"
args = { creature = "text" }
original = [{ at = "GENRLTXT:420", printf = ["creature"] }]

[[key]]
id = "battle.hint.hero"
original = [{ at = "GENRLTXT:418" }]

[[key]]
id = "battle.hint.enemy-hero"
original = [{ at = "GENRLTXT:419" }]

# Over nothing, for a shooter without shots whose target is still set (`battle_status_line`'s
# kind 0; E17 M3 T6c-2, design §9.10).
[[key]]
id = "battle.hint.no-shots"
original = [{ at = "GENRLTXT:299" }]

# The panel's controls' hints (`battle_panel_base` 0x46B7A3 on, `SetHints` from the pairs at
# 0x6A6968; E17 M3 T6c-1): `Help.txt`'s first column, records 379 to 387 (its loader 0x5B98B0
# copies them there in order); the log's item (383) and its scroll buttons (384) have empty hints.
[[key]]
id = "battle.control.surrender"
original = [{ at = "HELP:379" }]

[[key]]
id = "battle.control.retreat"
original = [{ at = "HELP:380" }]

[[key]]
id = "battle.control.options"
original = [{ at = "HELP:381" }]

[[key]]
id = "battle.control.auto"
original = [{ at = "HELP:382" }]

[[key]]
id = "battle.control.spell-book"
original = [{ at = "HELP:385" }]

[[key]]
id = "battle.control.wait"
original = [{ at = "HELP:386" }]

[[key]]
id = "battle.control.defend"
original = [{ at = "HELP:387" }]

# The word for a creature, by `count`: a strike's perish row names it when the strike killed
# several kinds.
[[key]]
id = "word.creature"
plural = true
original = [
    { form = "one", at = "GENRLTXT:43" },
    { form = "other", at = "GENRLTXT:44" },
]

# The verb of a resisted spell's line, by the stack's number (0x5A1FA8: its row for exactly 1).
[[key]]
id = "word.resist"
plural = true
original = [
    { form = "one", at = "GENRLTXT:145" },
    { form = "other", at = "GENRLTXT:144" },
]

# A hero's possessive pronoun, by the hero's sex as `context`.
[[key]]
id = "word.possessive"
contexts = ["male", "female"]
original = [
    { form = "male", at = "GENRLTXT:540" },
    { form = "female", at = "GENRLTXT:541" },
]

# A creature's names, singular and plural (CRTRAITS.TXT's first two columns; its non-blank records
# from record 2 are the original ids in order, as the harvesters read them).
[[family]]
id = "creature"
table = "CRTRAITS"
first = 2
forms = { one = 0, other = 1 }

# A spell's name (SPTRAITS.TXT's first column; E17 M3 T7b-1): its records from record 2 whose
# second column is filled are the original ids in order (the group rows fill only their first, as
# the harvesters read them).
[[family]]
id = "spell"
table = "SPTRAITS"
first = 2
by = 1
column = 0

# A hero type's name (HOTRAITS.TXT's first column; E17 M3 T7b-1): its non-blank records from
# record 2 are the hero types in order. A hero on a map may carry a name of its own (not read).
[[family]]
id = "hero"
table = "HOTRAITS"
first = 2
column = 0

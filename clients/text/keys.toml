column = 0

# A spell's description by the hero's mastery (SPTRAITS.TXT's columns 29 to 32, the spell record's
# +0x78; E17 M5 T3a): the spell book's status line shows its first line (0x59BAA0), its message box
# the whole. A key per spell of the asset tables, `spell-text.<table>:<key>`, its form by the
# argument `context`.
[[family]]
id = "spell-text"
list = "spell"
table = "SPTRAITS"
first = 2
by = 1
raw = true
contexts = { none = 29, basic = 30, advanced = 31, expert = 32 }

# A town's moat, which names its damage in the battle's log (ARRAYTXT.TXT's nine records after its
# "Moat Names" row, by town type, as `moat_names` 0x6A5D60 is loaded by 0x5B9CC0; E17 M4 T2c-1): a
# key per faction of the asset tables' towns, `moat.<faction>`.
[[family]]
id = "moat"
table = "ARRAYTXT"
first = 260
column = 0

# A town's wall part, which the Catapult's target hint names (`battle.hint.attack`; the cursor's
# kind 16, 0x492E70; E17 M4 T2c-2): WALLS.TXT's 18 records per town type after its town's row, the
# parts' (their second column filled), as `siege_wall_parts_by_town` 0x66D868 is loaded; a key per
# faction of the asset tables' towns and wall-shot target's part, `wall.<faction>.<part>`.
[[family]]
id = "wall"
table = "WALLS"
first = 3
by = 1
column = 0

# A hero type's name (HOTRAITS.TXT's first column; E17 M3 T7b-1): its non-blank records from
# record 2 are the hero types in order. A hero on a map may carry a name of its own (not read).
[[family]]
id = "hero"
table = "HOTRAITS"
first = 2
column = 0

# The view following (T1b): the view not centred on the hero, a tile eight steps east clicked twice
# (the first step centres the view, every step keeps it there), then Ctrl and Down (the view
# scrolls off, the hero back on its tile) and Right alone (the step centres the view again).

[[sequence]]
id = "walk-follow"
situation = "seq-walk-follow"
ms = 2600
hero_speed = 2
points = 2000
why = "the view following a walk from a view not centred on the hero, and a step after a scroll"
inputs = [
    { at = 100, click = [472, 344] }, { at = 100, pointer = [700, 300] },
    { at = 300, click = [472, 344] }, { at = 300, pointer = [700, 300] },
    { at = 1800, keydown = "ctrl+Down" }, { at = 1860, keyup = "ctrl+Down" },
    { at = 2100, keydown = "Right" }, { at = 2160, keyup = "Right" },
]

# A walk the movement points end (T1b): 450 points, a tile six steps east clicked twice: four
# steps (the fifth costs more than the 50 left, which the step then sets to 0), the rest of the
# path kept.

[[sequence]]
id = "walk-points"
situation = "seq-walk"
ms = 1300
hero_speed = 2
points = 450
why = "a walk ended by the movement points, the path's rest kept"
inputs = [
    { at = 100, click = [504, 280] }, { at = 100, pointer = [700, 300] },
    { at = 300, click = [504, 280] }, { at = 300, pointer = [700, 300] },
]


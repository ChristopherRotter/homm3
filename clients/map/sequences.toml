# The view's limits (T1a2, design §3.4): at the fast speed the pointer in the bottom-right corner
# until the view stops at the map's last column and row (the cursor back to the arrow), in the
# top-left until it stops at (-9, -8), in the top-right with the top limit reached (the view
# still moves right: its cursor stays the corner's), then Ctrl and Up at the top limit.

[[sequence]]
id = "scroll-limits"
situation = "seq-scroll"
ms = 2500
scroll_speed = 2
why = "the scroll's limits at the map's sides: the corners, the cursor where the view stops"
inputs = [
    { at = 100, pointer = [798, 598] },
    { at = 800, pointer = [0, 0] },
    { at = 1900, pointer = [798, 0] },
    { at = 2200, pointer = [700, 300] },
    { at = 2300, keydown = "ctrl+Up" }, { at = 2360, keyup = "ctrl+Up" },
]

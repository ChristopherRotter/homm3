# The keys during a walk (E24 M3 T6b3, design §4.15), on `seq-walk` at hero speed 2. `walk-queue`:
# the view scrolled off the hero, then Space (the hero chosen again: the view centred on it,
# lifted); a step to the east, and during it 80 key messages (the east and west keys pressed and
# released by turns, 20 times) and Space's two: the input ring keeps the last 63, so the 30 steps
# their key downs give run one after another, Space last (the hero lifted: nothing); the view

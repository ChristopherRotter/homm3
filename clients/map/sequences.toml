# The map's recorded sequences (E24 M2, *provisional*; the epic's M2 decision; clients/capture/README.md,
# "The map's sequences"): each a situation of `situations/` (one of the capture set's or its own,
# `seq-*.toml`) shown in the original as `h3map.py still` shows it, then played on the virtual clock
# 1 ms at a time from the sequence's 0 (the palette tick and the view's redraw both due then) to `ms`
# (`python3 capture/h3map.py frames [--only <id>]`, from clients/). Its timeline, numbers only, is
# `timelines/<id>.txt` (the changes of the view, the objects' steps, the palette steps and where the
# screen changed); the live part its screen shows at 0, `timelines/<id>-live.toml`. A run whose
# timeline differs fails. Since T1a2 a sequence may give the options the original holds
# (`scroll_speed` 0 to 2, `hero_speed` 1 to 4: written once the situation is staged) and its
# `inputs`, each at a millisecond from 1 to `ms`: `keydown` or `keyup` (xdotool's key names,
# `ctrl+` holding the Control key with it: the map scrolls by Ctrl and the eight direction keys,
# without Ctrl they walk the selected hero) and `pointer` (a point of the 800 x 600 screen: the
# map scrolls while it lies within 16 pixels of a side). Since T1b `points` (the selected hero's
# movement points, written once the situation is staged) and `click` (the left button at a point:
# a tile clicked shows the selected hero's path to it, clicked again the hero walks it; the
# pointer is then parked over the right panel in the same millisecond, so that the cursor over
# the view, M3's, stays out of the frames).

[[sequence]]
id = "idle-cycles"
situation = "seq-idle-cycles"
ms = 8000
why = "the map standing still: water, lava and the clear, muddy and lava rivers cycling, past a whole cycle (36 steps of 200 ms)"

[[sequence]]
id = "idle-objects"
situation = "objects-flat"
ms = 8000
why = "the map standing still: animated objects (116 copied, 47 of them flat) stepping every 180 ms"

# The scroll (M2 T1a2, E24 design §3.4): at each scroll speed, Ctrl with each of the eight direction
# keys once (pressed and released: a scroll at the press), Ctrl and Right held 400 ms (one press,
# the original repeats nothing itself), the pointer at the left edge (a scroll every 70 ms after
# 70 ms there) and in the top-right corner (the same 70 ms grid), then back over the right panel.

[[sequence]]
id = "scroll-0"
situation = "seq-scroll"
ms = 3100
scroll_speed = 0
why = "the scroll at the slow speed (1 tile a step): keys, the left edge, a corner"
inputs = [
    { at = 100, keydown = "ctrl+Up" }, { at = 160, keyup = "ctrl+Up" },
    { at = 300, keydown = "ctrl+Prior" }, { at = 360, keyup = "ctrl+Prior" },
    { at = 500, keydown = "ctrl+Right" }, { at = 560, keyup = "ctrl+Right" },
    { at = 700, keydown = "ctrl+Next" }, { at = 760, keyup = "ctrl+Next" },
    { at = 900, keydown = "ctrl+Down" }, { at = 960, keyup = "ctrl+Down" },
    { at = 1100, keydown = "ctrl+End" }, { at = 1160, keyup = "ctrl+End" },
    { at = 1300, keydown = "ctrl+Left" }, { at = 1360, keyup = "ctrl+Left" },
    { at = 1500, keydown = "ctrl+Home" }, { at = 1560, keyup = "ctrl+Home" },
    { at = 1700, keydown = "ctrl+Right" }, { at = 2100, keyup = "ctrl+Right" },
    { at = 2300, pointer = [2, 300] },
    { at = 2700, pointer = [798, 1] },
    { at = 3000, pointer = [700, 300] },
]


# The sequences of E24 M4 T2b1 (design §5.4), recorded before the viewer plays them (T2b2:
# `frames --sequences map/to-record.toml --no-check`; each moved into sequences.toml once the
# viewer plays it, as T2a1's were). Answers: Enter the OK, Escape the Cancel, a click a picture.

[[sequence]]
id = "ask-join"
situation = "seq-ask-join"
ms = 2600
hero_speed = 4
seed = 7
why = "a compliant monster's offer to join for free, accepted by Enter: it joins and dissolves"
inputs = [
    { at = 100, keydown = "Up" }, { at = 160, keyup = "Up" },
    { at = 1000, keydown = "Return" }, { at = 1060, keyup = "Return" },
]


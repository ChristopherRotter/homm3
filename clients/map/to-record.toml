# E24 M4 T2d3's sequences (design §5.8), recorded before the viewer plays them (`frames
# --sequences map/to-record.toml --no-check`): moved into sequences.toml once it does.

# Summon Boat through the spell book: the cast button's hotkey C (down, up: the book opens),
# its place 0 clicked (the book closes, the cast), the pointer parked; the hero at Expert.
[[sequence]]
id = "cast-boat"
situation = "seq-cast-boat"
ms = 1800
hero_speed = 2
seed = 7
why = "Summon Boat through the book: the boat in sight dissolved off its place and in beside the hero, the mana spent (MCL-Q14)"
inputs = [
    { at = 100, keydown = "c" }, { at = 160, keyup = "c" },
    { at = 300, click = [246, 123] }, { at = 300, pointer = [700, 300] },
]

[[sequence]]
id = "cast-boat-far"
situation = "seq-cast-boat-far"
ms = 1400
hero_speed = 2
seed = 7
why = "Summon Boat's boat out of sight: only its arrival beside the hero dissolved in"
inputs = [
    { at = 100, keydown = "c" }, { at = 160, keyup = "c" },
    { at = 300, click = [246, 123] }, { at = 300, pointer = [700, 300] },
]

[[sequence]]
id = "cast-boat-new"
situation = "seq-cast-boat-new"
ms = 1400
hero_speed = 2
seed = 7
why = "Summon Boat with no boat: one made beside the hero and dissolved in"
inputs = [
    { at = 100, keydown = "c" }, { at = 160, keyup = "c" },
    { at = 300, click = [246, 123] }, { at = 300, pointer = [700, 300] },
]

# The hot seat's hand-over recorded before the viewer plays it (E24 M5 T5 part two, design §5.31;
# clients/capture/README.md, "A hot seat"): `python3 capture/h3map.py frames --sequences
# map/to-record.toml --no-check [--only <id>]` from clients/, each a sound run of its own on the
# virtual clock (`sound = true`: the cover's `NewWeek.wav`, the start's waits), two humans Red and
# Blue (`hot_seat`, their names as the box's text: the colours' own); its timeline is kept in
# `timelines/<id>.txt` and its samples in `timelines/<id>-sounds.txt` (copied by hand from a
# second run as the first), its live part with the run. Part three (the hand-over built) moves
# them into `sequences.toml` once the viewer plays them (the viewer's parser takes neither
# `hot_seat` nor `sound` yet). Each End Turn by its key (down at 100, up at 160: the turn's end
# and the next human's cover and box in that millisecond); each box's OK by Enter. A second
# hand-over comes after the first start's date window (its 3 000 ms, gone at the redraw after
# 7 360): one within it keeps that window under the next cover (`seat-new-day-quick`).

[[sequence]]
id = "seat-hand-over"
situation = "seq-seat"
ms = 8000
hot_seat = ["Red", "Blue"]
sound = true
seed = 1
why = "a hot seat's hand-over, day 1: Red's End Turn, Blue's cover (the shroud from (0, 0), the empty lists, the blank resource bar with the date, the shield, the date's window at its first frame) and its box with Blue's crest; the OK 500 ms after it (the wait's 4 s, NewWeek.wav cut), then Blue's start and its date's window"
inputs = [
    { at = 100, keydown = "e" }, { at = 160, keyup = "e" },
    { at = 600, keydown = "Return" }, { at = 660, keyup = "Return" },
]

[[sequence]]
id = "seat-hand-over-late"
situation = "seq-seat"
ms = 7400
hot_seat = ["Red", "Blue"]
duration = 0
sound = true
seed = 1
why = "the hand-over with the OK 6 s after the box (NewWeek.wav over: no wait), on a one-minute turn (the timer stopped at Red's End Turn, started again only after Blue's box)"
inputs = [
    { at = 100, keydown = "e" }, { at = 160, keyup = "e" },
    { at = 6100, keydown = "Return" }, { at = 6160, keyup = "Return" },
]

[[sequence]]
id = "seat-new-day"
situation = "seq-seat"
ms = 12400
hot_seat = ["Red", "Blue"]
sound = true
seed = 1
why = "Blue's End Turn after its start's date window (its 3 000 ms) ends day 1: Red's cover on day 2 (the date's window built with the new date under it, newday.wav with NewWeek.wav), its box, the OK, Red's start (newday.wav again)"
inputs = [
    { at = 100, keydown = "e" }, { at = 160, keyup = "e" },
    { at = 300, keydown = "Return" }, { at = 360, keyup = "Return" },
    { at = 7440, keydown = "e" }, { at = 7500, keyup = "e" },
    { at = 7700, keydown = "Return" }, { at = 7760, keyup = "Return" },
]

[[sequence]]
id = "seat-new-day-quick"
situation = "seq-seat"
ms = 10000
hot_seat = ["Red", "Blue"]
sound = true
seed = 1
why = "Blue's End Turn 240 ms after its start, its date's window still up: Red's day-2 cover keeps that window (day 1's, stepping on; no newday.wav under it), its box, the OK, Red's start (the window built with day 2)"
inputs = [
    { at = 100, keydown = "e" }, { at = 160, keyup = "e" },
    { at = 300, keydown = "Return" }, { at = 360, keyup = "Return" },
    { at = 4600, keydown = "e" }, { at = 4660, keyup = "e" },
    { at = 5100, keydown = "Return" }, { at = 5160, keyup = "Return" },
]


# The sequences of E24 M4 T2b1 (design §5.4), recorded before the viewer plays them (T2b2:
# `frames --sequences map/to-record.toml --no-check`; each moved into sequences.toml once the
# viewer plays it, as T2a1's were). Answers: Enter the OK, Escape the Cancel, a click a picture.

[[sequence]]
id = "choose-chest"
situation = "seq-choose-chest"
ms = 3400
hero_speed = 4
seed = 7
why = "a chest's choice: Enter with no picture chosen does nothing, the gold chosen, then the experience, Enter"
inputs = [
    { at = 100, keydown = "Up" }, { at = 160, keyup = "Up" },
    { at = 600, keydown = "Return" }, { at = 660, keyup = "Return" },
    { at = 1000, click = [338, 380] }, { at = 1400, click = [462, 380] },
    { at = 1800, keydown = "Return" }, { at = 1860, keyup = "Return" },
]


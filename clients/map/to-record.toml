inputs = [
    { at = 100, keydown = "e" }, { at = 160, keyup = "e" },
    { at = 300, keydown = "Return" }, { at = 360, keyup = "Return" },
    { at = 7440, keydown = "e" }, { at = 7500, keyup = "e" },
    { at = 7700, keydown = "Return" }, { at = 7760, keyup = "Return" },
]

[[sequence]]
id = "seat-new-week"
situation = "seq-seat-week"
ms = 12800
hot_seat = ["Red", "Blue"]
sound = true
seed = 1
rolls = { week_chance = 2, week_name = 4 }
why = "Blue's End Turn ends week 1: Red's cover on week 2's first day (the week's picture under it, no newday.wav), its box, the OK, Red's start and the week's box last (newweek.wav), closed by Enter"
inputs = [
    { at = 100, keydown = "e" }, { at = 160, keyup = "e" },
    { at = 300, keydown = "Return" }, { at = 360, keyup = "Return" },
    { at = 7440, keydown = "e" }, { at = 7500, keyup = "e" },
    { at = 7700, keydown = "Return" }, { at = 7760, keyup = "Return" },
    { at = 12300, keydown = "Return" }, { at = 12360, keyup = "Return" },
]


# The map's sequences recorded before the viewer plays them (E24 M4 T2a1, design §5.3; the format
# is `sequences.toml`'s): `python3 capture/h3map.py frames --sequences map/to-record.toml
# --no-check [--only <id>]` from clients/ records them, the frame check left out (the viewer draws
# no find yet: T2a2). Each moves into `sequences.toml` once the viewer plays it, and the file goes
# with the last (as T1b1's did at T1b2). A find's visit is a step by a direction key at hero speed
# 4 onto the object's entrance; a box's OK is Enter; every sequence seeds the game (the objects'
# draws at the start: a Windmill's resource, the armies).

[[sequence]]
id = "find-windmill"
situation = "seq-find-windmill"
ms = 1600
hero_speed = 4
seed = 7
why = "a Windmill visited: its box with the resource found, closed by Enter"
inputs = [
    { at = 100, keydown = "Right" }, { at = 160, keyup = "Right" },
    { at = 1000, keydown = "Return" }, { at = 1060, keyup = "Return" },
]


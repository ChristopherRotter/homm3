# E24 M4 T2d2's sequences (design §5.7), recorded before the viewer plays them
# (`python3 capture/h3map.py frames --sequences map/to-record.toml --no-check`); each moves into
# `sequences.toml` once the viewer plays it, and this file is removed.

# A boat boarded (design §5.7): a key's step right onto a boat turned down-left (the hero
# dissolved off the land with killfade, the step, the boat lifted as the hero's), then a path of
# three steps onto a boat facing right, clicked twice.

[[sequence]]
id = "board"
situation = "seq-board"
ms = 1800
hero_speed = 2
points = 1500
seed = 7
why = "a boat boarded by a key's step: the hero dissolved off the land, the step, the boat lifted as the hero's"
inputs = [{ at = 100, keydown = "Right" }, { at = 160, keyup = "Right" }]

[[sequence]]
id = "board-walk"
situation = "seq-board-walk"
ms = 2200
hero_speed = 2
points = 1500
seed = 7
why = "a boat boarded at a walk's end: two steps on land, the hero dissolved, the step onto the boat"
inputs = [
    { at = 100, click = [304, 280] }, { at = 100, pointer = [700, 300] },
    { at = 300, click = [304, 280] }, { at = 300, pointer = [700, 300] },
]

# A boat left (design §5.7): the hero in a boat on the inlet steps back onto the coast by a key
# (the boat put back on its water tile, the step, the hero dissolved onto the land with
# killfade), then sails three tiles east and lands, clicked twice.

[[sequence]]
id = "land"
situation = "seq-land"
ms = 1800
hero_speed = 2
points = 1500
seed = 7
why = "a boat left by a key's step: the boat put back on the water, the step, the hero dissolved onto the coast"
inputs = [{ at = 100, keydown = "Left" }, { at = 160, keyup = "Left" }]

[[sequence]]
id = "land-walk"
situation = "seq-land"
ms = 2200
hero_speed = 2
points = 1500
seed = 7
why = "a boat left at a walk's end: three steps at sea, the boat put back, the step onto the land, the hero dissolved in"
inputs = [
    { at = 100, click = [432, 280] }, { at = 100, pointer = [700, 300] },
    { at = 300, click = [432, 280] }, { at = 300, pointer = [700, 300] },
]

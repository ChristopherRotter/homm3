# A scripted game of a computer player's turn in sight, recorded (E24 M4 T4c; `frames --sequences
# map/to-record.toml --only game-ai-boat --no-check`, seed 1, twice the same) before the viewer
# plays it: the computer's boarding and landing in sight (the hero dissolved off the land, then
# its step onto the boat; the boat put back at the landing) are not built for a computer's turn
# (MCL-STUB-2). Moved into `sequences.toml` once the viewer plays it.

[[sequence]]
id = "game-ai-boat"
situation = "game-ai-boat"
ms = 5600
seed = 1
why = "a scripted game's computer player at sea in sight: End Turn's key, Blue's hero walking round a lake onto an empty boat in Red's sight; the next days End Turn again, the hero sailing a tile and landing on an island in the lake (the boat left, the points 0), the day after taking the island's gold pile from below"
inputs = [
    { at = 100, keydown = "e" }, { at = 160, keyup = "e" },
    { at = 2000, keydown = "e" }, { at = 2060, keyup = "e" },
    { at = 4400, keydown = "e" }, { at = 4460, keyup = "e" },
]
script = [
    "0 end-turn",
    "1 move 2 21,14,0 21,13,0 21,12,0 21,11,0 21,10,0 20,9,0 19,9,0 18,10,0",
    "1 end-turn",
    "0 end-turn",
    "1 move 2 18,11,0 19,12,0",
    "1 end-turn",
    "0 end-turn",
    "1 move 2 19,11,0",
    "1 end-turn",
]

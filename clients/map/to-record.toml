# The level-up's sequences (E24 M4 T2c, design §5.5), recorded before the viewer plays them
# (`python3 capture/h3map.py frames --sequences map/to-record.toml --no-check --only <id>`, from
# clients/); moved into sequences.toml once it does. The dialog at (205, 65), 385 x 470: two
# offers' pictures at (329, 391) and (427, 391), 44 x 44, the OK at (501, 478), 64 x 30.

[[sequence]]
id = "level-up"
situation = "seq-level-up"
ms = 2800
hero_speed = 4
seed = 7
why = "a Learning Stone's experience, a level: Enter with no offer chosen does nothing, the left one clicked, Enter"
inputs = [
    { at = 100, keydown = "Right" }, { at = 160, keyup = "Right" },
    { at = 1000, keydown = "Return" }, { at = 1060, keyup = "Return" },
    { at = 1400, keydown = "Return" }, { at = 1460, keyup = "Return" },
    { at = 1800, click = [351, 413] },
    { at = 2200, keydown = "Return" }, { at = 2260, keyup = "Return" },
]


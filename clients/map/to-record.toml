# The map client's sequences recorded before the viewer plays them (E24 M4 T5a, design §5.19:
# the battles handed over and back). `h3map.py frames --sequences map/to-record.toml --no-check`
# records them; T5b moves them into `sequences.toml` once the viewer plays them.
#
# Each battle is played with the clock running (`battle`, `h3adv.fight`'s plan) from the
# millisecond its screen first shows whole and takes none of the sequence's time: the result
# window's OK and the inputs after it are given from that millisecond on (README, "A battle in a
# sequence").

[[sequence]]
id = "battle-won"
situation = "seq-battle-won"
ms = 1600
hero_speed = 4
seed = 7
battle = "auto"
why = "a savage monster fought at once and beaten by auto combat: the switch to the battle and back by Enter at its result, then the monster taken off the map"
inputs = [
    { at = 100, keydown = "Up" }, { at = 160, keyup = "Up" },
    { at = 500, keydown = "Return" }, { at = 560, keyup = "Return" },
]


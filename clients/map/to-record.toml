# Sequences recorded before the viewer plays them (E24 M4 T1b1): `h3map.py frames --sequences
# map/to-record.toml --no-check`; each moves into sequences.toml once the viewer plays it (T1b2),
# this file removed once empty. Their timelines are kept in timelines/ as the others'.

# A computer player's moves in sight (E24 M4 T1b1, design §5.2): Red's End Turn, Blue's turn with
# its hero walking in Red's explored land (the view following it, the status window's kind 5),
# then Red's next day.

[[sequence]]
id = "ai-walk"
situation = "seq-turn-ai"
ms = 2000
seed = 1
why = "a computer player's walk in sight at Computer Walk Speed 3 (the first run's): the view on its hero, kind 5's steps, the cursor hidden, then the next day"
inputs = [{ at = 100, keydown = "e" }, { at = 160, keyup = "e" }]

[[sequence]]
id = "ai-walk-slow"
situation = "seq-turn-ai"
ms = 2800
seed = 1
computer_speed = 2
why = "the same walk at Computer Walk Speed 2: three frames of 50 ms a step"
inputs = [{ at = 100, keydown = "e" }, { at = 160, keyup = "e" }]

[[sequence]]
id = "ai-walk-fast"
situation = "seq-turn-ai"
ms = 600
seed = 1
computer_speed = 4
why = "the same walk at Computer Walk Speed 4: each step drawn once with no wait, so the whole turn in End Turn's millisecond"
inputs = [{ at = 100, keydown = "e" }, { at = 160, keyup = "e" }]

[[sequence]]
id = "ai-walk-blackout"
situation = "seq-turn-ai"
ms = 600
seed = 1
blackout = 1
why = "the same walk under Blackout Computer: no step shown, so the whole turn in End Turn's millisecond"
inputs = [{ at = 100, keydown = "e" }, { at = 160, keyup = "e" }]

[[sequence]]
id = "ai-walk-fog"
situation = "seq-turn-ai-fog"
ms = 2000
seed = 1
why = "the walk starting in the fog: its first steps unseen (no time), the view on the hero at its first step in sight"
inputs = [{ at = 100, keydown = "e" }, { at = 160, keyup = "e" }]

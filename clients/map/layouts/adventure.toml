[[dialog.items]]
kind = "label"
id = 37
at = [54, 100]
size = [520, 440]
font = "medfont.fnt"
font_palette = "game.pal"
colour = 13
align = 8

# The resource bar (the dialog's +0x5C, resource_bar_create 0x558BA0): at (3, 575), its picture in
# the viewer's colours, then its texts (E24 M3 T5a, design §4.7; texts alone, 0x5BC280, in
# `smalfont.fnt`'s colour 4, filled by 0x558F20): the seven amounts 1001-1007 (0x558CE5's loop,
# each followed by its hint's area 1009-1015, T6's), left-aligned, and the date 1008, centred.
[resource_bar]
place = [3, 575]

[[resource_bar.items]]
kind = "picture"
id = 1000
picture = "AResBar.pcx"
at = [0, 0]
size = [794, 22]

[[resource_bar.items]]

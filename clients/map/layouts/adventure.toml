# (747, 212) a row 32 lower, their frames a slot's update sets (town_list_slot 0x4037A0): a town's
# picture, the empty slot's 0, the selected town's 1 drawn over its picture after the items
# (lists_selection_frames 0x4038C0).
[[dialog.items]]
kind = "def"
id = 32
def = "itpa.def"
at = [747, 212]
size = [48, 32]

# The adventure screen's layout at the native resolution (E24 M1 T2; ADR-0020 point 3). The numbers
# are the executable's (docs/epics/E24-design.md §1.1, §1.2, §1.9, read 2026-10-23); an HD layout
# is another file of this format. Loader: h3_map_view::layout (the format is provisional until the
# M1 review). The panels right of and below the view come with M3: the dialog and the resource
# bar since M3 T2a (design §4.1, in h3_ui::ui's format), the minimap since T3a (§4.4), the lists'
# contents since T4a (§4.5); the status window (T5) later.

frame = [800, 600]
# Drawn opaque at (0, 0) before the view, entries 224-255 of its palette the viewing player's
# colours (adventure_full_update 0x417420, §1.9).
picture = "AdvMap.pcx"
player_palette = "PLAYERS.PAL"

[view]
# The tile (vx + i, vy + j) at origin + 32 (i, j) (manager +0xF4 and +0xF8 are 0, §1.2).
origin = [0, 8]
tile = 32
# The passes' loops (§1.1): the columns, then the rows.
columns = [-1, 19]
rows = [-1, 17]
# Every pass's clip: x 8-599, y 8-551 (§1.2).
clip = [8, 8, 600, 552]
# The corner gems (0x40F2F0), 46 x 46 each.
gems = [
    { def = "agemul.def", at = [6, 6] },
    { def = "agemur.def", at = [556, 6] },
    { def = "agemll.def", at = [6, 508] },
    { def = "agemlr.def", at = [556, 508] },
]

# The view's scroll (E24 M2 T2; view_scroll 0x4195C0, edge_scroll 0x419820; design §3.4): the
# map's first and last column and row stop at the view's tile `middle` (its corner within -9 to
# the map's width less 10, -8 to its height less 9); the view scrolls while the pointer lies
# within `edge` pixels of a side of the frame (MCL-Q6: 16 on every side; the original's 16, 14, 16
# and 15 only for the comparisons).
[scroll]
middle = [9, 8]
edge = 16

# The adventure cursor (the mouse manager's type 1, cursor_defs 0x67FF38): the arrow's frame, the
# first of the eight edge cursors (north clockwise to north-west), every frame's hot spot
# (cursor_hot_spots 0x67FF50 + (144 + frame) x 8: the canvas's corner is the mouse less these).
[cursor]
def = "cradvntr.def"
arrow = 0
edges = 32
hot = [
    [0, 0], [10, 12], [12, 10], [12, 12], [14, 13], [12, 13], [20, 22], [12, 16], [8, 9],
    [14, 14], [14, 13], [12, 13], [20, 22], [12, 16], [8, 9], [14, 14], [14, 13], [12, 13],
    [20, 22], [12, 16], [8, 9], [14, 14], [14, 13], [12, 13], [20, 22], [12, 16], [8, 9],
    [14, 14], [20, 22], [20, 22], [20, 22], [20, 22], [6, 0], [16, 1], [22, 6], [16, 17],
    [6, 22], [0, 17], [0, 5], [0, 1], [0, 0], [12, 14], [20, 26],
]

# The adventure screen's dialog (E24 M3 T2a; design §4.1: adventure_dialog_create 0x401510, the
# manager's +0x44): at (0, 0), its items in the executable's order, each with its control id (the
# hero list's pictures, bars and frames, ids 15-29 and 39-43, and the town list's pictures, 32-36,
# since T4a); the chat's edit (38, 0x5541A0) draws nothing outside a chat.
[dialog]
place = [0, 0]

# The map (+0x50), the minimap (+0x4C) and the status window: areas, drawing nothing.
[[dialog.items]]
kind = "area"
id = 0
at = [8, 8]
size = [592, 544]

[[dialog.items]]
kind = "area"
id = 1
at = [630, 26]
size = [144, 144]

[[dialog.items]]
kind = "area"
id = 2
at = [605, 389]
size = [188, 182]


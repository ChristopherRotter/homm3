        "AVCdunx0.def", "AVCstrx0.def", "AVCftrx0.def", "AVChforx.def"]
capitol = ["AVCcasz0.def", "AVCramz0.def", "AVCtowz0.def", "AVCinfz0.def", "AVCnecz0.def",
           "AVCdunz0.def", "AVCstrz0.def", "AVCforz0.def", "AVChforz.def"]


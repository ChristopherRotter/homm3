# The map's asset tables of the pack `base` (E24 M1 T2; ADR-0020 points 5 and 6; the format:
# clients/README.md, "The map's asset tables"). Written from the code reading of M1 T1a
# (docs/epics/E24-design.md §1.3 to §1.6: the manager's DEF loads 0x406FD0, its name tables
# 0x65F55C, 0x65F588, 0x65F59C, the tick 0x4ED490; the shroud's table copied from 0x65F694 and
# checked against §1.5), maintained as source afterwards. Identifiers and
# numbers only (ADR-0009). The AB and SoD packs add nothing the view draws yet (their objects come
# with T4).

[table]
id = "base"
depends = []

[map]
edge = "edg.def"
path = "adag.def"
road_offset = 16
cycle_ms = 200
frame_ms = 180
# The scroll and the mouse over time (E24 M2 T2; design §3.4): the tiles a scroll step moves the
# view at the scroll speeds 0 to 2 (scroll_steps 0x63A66C), the edge scroll's time between steps
# (edge_scroll 0x419820), the mouse poll's (mouse_poll 0x50D680: the cursor is drawn where it
# last read the mouse, E17 design §9.10).
scroll_steps = [1, 2, 3]
scroll_ms = 70
poll_ms = 33

[map.shroud]
full = "tshrc.def"
edge = "tshre.def"
# The piece of each mask (0x65F694), 16 masks a row: mask = 16 x row + column.
pieces = [
     11,   7,   8, 129,   9,  10, 128,  33, 108,  29,  30,  32,  28, 133,  34,  22,
     11,   7,   8, 113,   9,  10, 128, 126, 108,  29,  30, 131,  28, 133,  34, 120,
     11,   7,   8, 129,   9,  10, 112, 127, 108,  29,  30,  32,  28, 133, 125, 121,
     11,   7,   8, 113,   9,  10, 112, 103, 108,  29,  30, 131,  28, 133, 125, 117,
     11,   7,   8, 129,   9,  10, 128,  33, 108,  29,  30,  32,  12,  27,  25,  21,
     11,   7,   8, 113,   9,  10, 128, 126, 108,  29,  30, 131,  12,  27,  25, 118,
     11,   7,   8, 129,   9,  10, 112, 127, 108,  29,  30,  32,  12,  27,   1,  19,
     11,   7,   8, 113,   9,  10, 114, 103, 108,  29,  30, 131,  12,  27,   1, 116,
     11,   7,   8, 129,   9,  10, 128,  33, 108,  13,  30,  31,  28,  26,  34,  20,
     11,   7,   8, 113,   9,  10, 128, 126, 108,  13,  30,   5,  28,  26,  34,  24,
     11,   7,   8, 129,   9,  10, 112, 127, 108,  13,  30,  31,  28,  26, 125,  18,
     11,   7,   8, 115,   9,  10, 112, 103, 108,  13,  30,   5,  28,  26, 125, 123,
     11,   7,   8, 129,   9,  10, 128,  33, 108,  13,  30,  31,  12,   3,  25,  17,
     11,   7,   8, 113,   9,  10, 128, 126, 108,  15,  30,   5,  12,   3,  25,  23,
     11,   7,   8, 129,   9,  10, 112, 127, 108,  13,  30,  31,  14,   3,   1,  16,
     11,   7,   8, 115,   9,  10, 114, 103, 108,  15,  30,   5,  14,   3,   1,   0,
]

# The heroes' and boats' pictures (E24 M1 T5a; design §2.3, §2.8): the manager's DEFs by its
# name tables (0x65F5A8 by class, 0x65F5F0 by owner, 0x65F670 and 0x65F67C by type, 0x65F610 by
# type x 8 + colour) and the group each facing draws (0x4D9110, 0x4D9160), mirrored above 4.
[map.heroes]
classes = [
    "ah00_.def", "ah01_.def", "ah02_.def", "ah03_.def", "ah04_.def", "ah05_.def",
    "ah06_.def", "ah07_.def", "ah08_.def", "ah09_.def", "ah10_.def", "ah11_.def",
    "ah12_.def", "ah13_.def", "ah14_.def", "ah15_.def", "ah16_.def", "ah17_.def",
]
flags = ["af00.def", "af01.def", "af02.def", "af03.def",
         "af04.def", "af05.def", "af06.def", "af07.def"]
boats = ["ab01_.def", "ab02_.def", "ab03_.def"]
waves = ["abm01_.def", "abm02_.def", "abm03_.def"]
boat_flags = [
    "abf01l.def", "abf01g.def", "abf01r.def", "abf01d.def",
    "abf01b.def", "abf01p.def", "abf01w.def", "abf01k.def",
    "abf02l.def", "abf02g.def", "abf02r.def", "abf02d.def",
    "abf02b.def", "abf02p.def", "abf02w.def", "abf02k.def",
    "abf03l.def", "abf03g.def", "abf03r.def", "abf03d.def",
    "abf03b.def", "abf03p.def", "abf03w.def", "abf03k.def",
]
groups = [0, 1, 2, 3, 4, 3, 2, 1]

# The hero's walk (E24 M2 T3a; design §3.5, hero_walk_animation 0x480380): the walking group by
# the step's direction, 0 north to 7 north-west (the switch 0x4805BC; mirrored above 4), the frames
# a walking group steps through (pass 9's +0x200 mod 8, 0x47FF74), a frame's time at the hero
# speeds 1 to 3 (walk_frame_times 0x63D6DC) and the pixels each frame slides the view by at the
# hero speeds 1 to 4 (walk_frame_pixels 0x63D6C8: a tile in 32 / that many frames; speed 2's
# middle frame 12, 0x480509; speed 4 one draw at the step's end place, no wait, 0x480483).
[map.walk]
groups = [5, 6, 7, 8, 9, 8, 7, 6]
frames = 8
frame_ms = 50
pixels = [[8, 8, 8, 8], [10, 12, 10], [16, 16], []]

# The owned objects' colours (E24 M1 T5b1; design §2.9): the bodies of these classes (the
# dwellings 17 and 20, a garrison 33, a lighthouse 42, a mine 53, the towns 77 and 98, a shipyard
# 87: the view passes' jump tables 0x41153C and 0x412470's; and the map's classes the game loads
# as two of them, the vertical garrison 219 as 33 and the AB mine 220 as 53: object_class_values
# 0x63A6E4) draw their flag pixels in game.pal's entry 63 without an owner, 64 + the owner's
# colour else (game_palette16's +0x9C, tile_object_owner 0x40FD20); every other class's are
# skipped.
[map.owners]
palette = "game.pal"
neutral = 63
classes = [17, 20, 33, 42, 53, 77, 87, 98, 219, 220]

# The towns' pictures by faction (0 Castle ... 8 Conflux) and buildings (object_template_redraw
# 0x4C9990 at every new game, after the town's buildings: 0x677A0C without a Fort, Citadel or
# Castle, 0x677A30 with one, 0x677A54 with a Capitol).
[map.towns]
village = ["AVCcast0.def", "AVCramp0.def", "AVCtowr0.def", "AVCinft0.def", "AVCnecr0.def",
           "AVCdung0.def", "AVCstro0.def", "AVCftrt0.def", "AVChfor0.def"]

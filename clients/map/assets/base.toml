# The heroes' and boats' pictures (E24 M1 T5a; design §2.3, §2.8): the manager's DEFs by its
# name tables (0x65F5A8 by class, 0x65F5F0 by owner, 0x65F670 and 0x65F67C by type, 0x65F610 by
# type x 8 + colour) and the group each facing draws (0x4D9110, 0x4D9160), mirrored above 4.

# The minimap (E24 M3 T3a; design §4.4: minimap_draw 0x412C40): a terrain DEF's palette entries of
# its open and blocked colours (+0x2C, +0x2E); the classes whose blocked or entrance tiles take the
# owner's colour (the switch 0x412FF0's cases 0 to 4) and those whose blocked tiles take the
# terrain's blocked colour (case 5, table 0x413670); by the map's size each tile's pixels (the
# columns' and rows' counters, 0x413198) and the box, radar.def's frame and the scale of the view's

# The palette cycles of every kind in one view, for the idle sequence `idle-cycles` (E24 M2 T1a1;
# clients/map/sequences.toml): four quadrants copied from the set's situations, each where its
# cycling tiles lie in the view (found by the viewer: its frames at one step apart differ there).
# Top-left lava-water's lava and water (Thousand Islands (allies)' (108, 126)-(117, 134)), top-right
# rivers-mud's muddy river (Dead and Buried's (4, 0)-(12, 8)), bottom-left rivers-clear's clear
# river (Dragon Pass's (18, 6)-(27, 13)), bottom-right rivers-lava's lava river (All for One's
# underground (28, 9)-(36, 16)). The quadrants' seams are drawn as given.
size = 36
terrain = "grass"
copy = [
    { map = "Thousand Islands (allies).h3m", from = [108, 126], to = [117, 134], at = [0, 0] },
    { map = "Dead and Buried.h3m", from = [4, 0], to = [12, 8], at = [10, 0] },
    { map = "Dragon Pass.h3m", from = [18, 6], to = [27, 13], at = [0, 9] },
    { map = "All for One.h3m", from = [28, 9], to = [36, 16], level = 1, at = [10, 9] },
]
heroes = [{ at = [33, 33], class = 2 }, { at = [33, 30], owner = 1 }]
view = [0, 0, 0]

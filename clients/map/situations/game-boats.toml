# A scripted game's boats (E24 M4 T4b2; clients/map/sequences.toml `game-boats`): Red's Rion with
# its army in the map (as `game-turns`) on the shore of a lake, an empty boat beside it facing
# right: a key's step right boards it (the hero dissolved off the land, the boat lifted, the
# points 0), End Turn, the computer's turn out of sight (Blue's hero and town on an island, as
# `game-turns`), the next day a key's step right at sea and one back, then one left onto the shore
# (the boat put back, the hero dissolved in, the points 0). Nothing drawn at random between the two
# games. A second hero of Red's far off (its selection shows the engine's resources). The engine
# plays the same commands (the sequence's `script`).
size = 36
terrain = "grass"

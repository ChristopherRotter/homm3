# Play's notices (E24 M5 T4c, design §5.28; MCL-STUB-7): every decision the view does not ask and
# a town entered, for a hand test in play (`h3-map-view play`, no recording of the original). Four
# heroes of Red's, each by a row of objects whose entrances lie one row above its road:
# - Hero A (its army of seven kinds: no room for another) on the road of row 12: a guarded pile
#   (a fight, from beside), compliant Peasants (their join, then the army dialog), an abandoned
#   mine (its guards' fight, on its entrance), a Monastery (its guards), Red's Guardhouse (its
#   hire), a Refugee Camp (its hire), a University, a Trading Post and an Altar of Sacrifice.
# - Hero B on the road of row 20: a Hill Fort, a Tavern, Red's garrison, Red's Shipyard on a lake's
#   shore, then Hero C on the road (a meeting).
# - Hero D below the entrance of Red's town (the town screen).
# Blue's hero far off. The pile's message is the client's own words (no original text).

# The map's capture set (E24 M1 T3b2, T4a, *provisional*; clients/capture/README.md, "The map's
# stills"): the situations beside this file, each a still the harness shows the original and
# compares with ours (`python3 capture/h3map.py set`, from clients/): its map built with the
# writer (`h3-map-view situation`), Red's explored tiles written (all but the situation's
# `hidden`), the view by the minimap, the clock frozen; ours drawn with the original's drawing
# bugs (`render --bugs original`) at the palette step the original's memory shows. Masked: the
# panels (M3) and the parked cursor over them. Per situation the pixels that differ outside the
# masks, with why; a run that counts another number fails.


# A scripted game's computer player at sea in sight (E24 M4 T4c; clients/map/sequences.toml
# `game-ai-boat`): Red's Rion and a second hero of Red's (its selection shows the engine's
# resources) on the west shore of a strait one tile wide, Red's town behind them; across it, in
# Red's start-explored land, a ring of land around a lake, an island in the lake with a gold pile
# on it (no land reaches it) and an empty boat in the lake's corner, Blue's hero (a computer
# player's, its army in the map) on the ring. End Turn: the computer walks its hero round the ring
# onto the boat; the next days it sails, lands on the island and takes the pile, all in Red's
# sight. The strait keeps Blue's hero off Red's heroes and town, the ring keeps the boat off the
# strait; Blue's town on an island in the fog keeps Blue in the game (as `game-turns`). The engine
# plays the same commands (the sequence's `script`).
size = 36
terrain = "grass"
explored = "start"
patches = [
    { terrain = "water", from = [16, 0], to = [35, 35] },
    { terrain = "grass", from = [17, 9], to = [21, 15] },
    { terrain = "water", from = [18, 10], to = [20, 14] },
    { terrain = "grass", from = [19, 11], to = [19, 13] },
    { terrain = "grass", from = [27, 27], to = [34, 34] },
]
heroes = [
    { at = [15, 10], class = 1, map_army = [[0, 15], [2, 5]] },
    { at = [15, 14], class = 5, map_army = [[28, 20]] },
    { at = [21, 15], owner = 1, class = 6, map_army = [[42, 10], [44, 4]] },
]
towns = [
    { at = [8, 8], faction = 0, owner = 0, buildings = "fort" },
    { at = [32, 31], faction = 1, owner = 1, buildings = "fort" },
]
boats = [{ at = [18, 10], kind = 1 }]
objects = [{ def = "AVTgold0.def", at = [19, 11], amount = 500 }]
bonus = "gold"
resources = [20, 10, 20, 10, 10, 10, 20000]
select = { hero = [15, 14] }
reselect = [15, 10]
view = [6, 2, 0]

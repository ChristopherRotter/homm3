# A scripted game's level-up (E24 M4 T4b1; clients/map/sequences.toml `game-level`): Red's Rion
# with its army in the map (as `game-walk`) and no experience, a key's step right onto a Learning
# Stone's entrance (its box with the 1 000 experience, Enter), level 2's dialog with two offers
# (the right one clicked, the OK clicked). The level's primary skill and offers are drawn in both
# games: the engine's seed (`engine_seed`) is one whose draws are the original's under the
# sequence's `seed`. A town of Red's out of the way (no visit's scenario test warns of a town
# lost); a second hero of Red's far off (its selection shows the engine's resources); Blue's hero
# far off. The engine plays the same commands (the sequence's `script`).

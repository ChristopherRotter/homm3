# A scripted game's turns (E24 M4 T4a1; clients/map/sequences.toml `game-day` and `game-week`,
# design §5.12): Red's Rion with its army in the map and Red's town, a second hero of Red's far
# off (its selection shows the engine's resources), Blue's hero and town alone on an island in the
# fog (a computer player that cannot leave it: its turns are the engine's `1 end-turn`; its town
# keeps it in the game, which the original ends for a player without one after seven days, a
# rule of E10's the engine does not have yet), End Turn into the next days. The engine plays the
# same commands (the sequence's `script`).
size = 36
terrain = "grass"
explored = "start"
patches = [
    { terrain = "water", from = [24, 24], to = [35, 35] },
    { terrain = "grass", from = [27, 27], to = [34, 34] },
]
heroes = [
    { at = [12, 12], class = 1, map_army = [[0, 15], [2, 5]] },
    { at = [4, 28], class = 5, map_army = [[28, 20]] },
    { at = [29, 33], owner = 1, class = 6 },
]
towns = [
    { at = [8, 8], faction = 0, owner = 0, buildings = "fort" },
    { at = [32, 31], faction = 1, owner = 1, buildings = "fort" },
]
bonus = "gold"
resources = [20, 10, 20, 10, 10, 10, 20000]
# The engine's resources shown by a selection's redraw (as `engine-start-panels`): the second hero
# selected, then the turn start's again.
select = { hero = [4, 28] }
reselect = [12, 12]
view = [3, 4, 0]

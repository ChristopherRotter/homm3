# E08 batch E8a played by the capture harness (E08 T68a; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-8a.toml as steps, on Easy, with T68a's reads (README, "Boats and the
# sea"). Hot seat, Red and Blue human, in the spec's order: day 1, Red: E8-1 (both heroes board),
# E8-3, E8-4, E8-10 (both board), E8-15 (boards); Blue: E8-7. Day 2, Red: every hero's turn-start
# reads first, then E8-1's landings, E8-3, E8-4, E8-10, E8-15; Blue: E8-16. Day 3, Red: E8-10's
# last reads. A leg's points the template has no row for go under "anything odd" (`note`), so the
# record shows every leg the procedure names. Row E8-5 is the map `E08-batch-8a-water` (its own
# recipe).

spec = "experiments/specs/E08-batch-8a.toml"
players = ["Red", "Blue"]
difficulty = "easy"


# E08 batch E5a played by the capture harness (E08 T37b, `cross-lane`; h3adv.py batch): the
# procedure of experiments/specs/E08-batch-5a.toml as steps, on Easy. Hot seat, Red and Blue
# human; every hero stands where the spec puts it (`at`). Day 1, Red: E5-4a's six one-step walks
# (a road, grass, swamp with Angel Wings), E5-4b's two on the coastal road, E5-5 across the lake and
# back (Boots of Levitation), E5-6a and E5-6b off a Cursed Ground (RoE's, SoD's) with Gnolls; each
# hero's points read before its first walk (`hero:points`, E08 T37a), each walk's cells by `<row> |
# <column>`. Blue: E5-1's eight heroes' points read by name (no hero moves); day 2 again. `note`
# reads each hero's worn artifacts but the war machines: the spec's own, or a starting bonus's.

spec = "experiments/specs/E08-batch-5a.toml"
players = ["Red", "Blue"]
difficulty = "easy"


[[step]]
encounter = "E15-10"
hero = "E15-10"
[step.cast]
spell = "Scuttle Boat"
hover = [[15, 8], [14, 17], [19, 12], { at = [20, 12], offset = [38, 16] }]
[[step.cast.targets]]
at = [20, 12]
offset = [38, 16]
record = { "the click on the tree: what happens; spell points" = ["cast:click:1", "text:spell points: ", "hero:spell_points", "text:HB: ", "boat:HB"] }
[[step.cast.targets]]
at = [19, 12]
[step.record]
"CB (15, 8), seen, empty | the cursor" = "cast:hover:1"
"O (14, 17), occupied | the cursor" = "cast:hover:2"
"HB (19, 12), hidden, empty | the cursor" = "cast:hover:3"
"the tree (21, 12), hidden | the cursor" = "cast:hover:4"
"the click on HB: messages; spell points; HB's record; what lies on (19, 12)" = ["cast:click:2", "text:the dialog: ", "cast:dialog", "text:messages: ", "messages", "text:spell points: ", "cast:spell_points", "text:HB: ", "boat:HB", "text:records on (19, 12): ", "boat_record:19,12", "text:the tile: ", "tile:19,12"]
"explored after: (19, 12); (21, 12)" = ["text:(19, 12): ", "explored:19,12", "text:(21, 12): ", "explored:21,12"]


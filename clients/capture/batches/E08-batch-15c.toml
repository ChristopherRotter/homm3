note = { "the date at the start" = "date", "the game's version" = "map_kind", "the difficulty" = "difficulty", "the boats at the start" = "boats", "E15-10 worn at the start (the starting bonus)" = "hero:equipment", "E15-10o's" = "hero[E15-10o]:equipment" }

[[step]]

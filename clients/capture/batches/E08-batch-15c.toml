# E08 batch E15c played by the capture harness (E08 T139a; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-15c.toml as steps, on Easy, the starting bonus gold, Red and Blue
# human in hot seat, in the spec's order: day 1, Red: E15-10 (first: nothing moves before it),
# E15-4, E15-11 with E15-12, E15-9's day 1 (E15-9r, then E15-9a); Blue: E15-9blue; day 2, Red:
# save 2, E15-9a's cast, the load of save 2, E15-9b's cast. Each row's reads before a cast are a
# step of their own (a tile's `explored:` is read live, never `before:`). The spec's save 1 is
# not made (no record reads it).
#
# A cast (README, "Casts on the adventure map"): `cast = "<spell>"` or `{ spell, hover, target,
# targets, cancel }` opens the selected hero's spell book by the key C, clicks the spell's place
# found by its name among the page's places (`cast:listed` the page; E15-4's and E15-11's heroes
# hold two spells each) and keeps every message in order (`messages`); `cast:view` is what showed
# right after the spell's click (the book still open, or the map). Scuttle Boat's target dialog
# (`cast:dialog`: its kind and vtable) is played as Dimension Door's: the mouse over each `hover`
# tile (`cast:hover:<n>`: the cursor's type and frame, the tile the dialog picks, its accept
# flag), a left click on each `targets` entry while the dialog shows (`cast:click:<n>`: what it
# did, the messages after it; an entry's `record` read right after its click), the dialog
# cancelled by Escape if still open. The view is centred on E15-10 (12, 12): its corner (3, 4),
# the map area's cells x 0 to 18 (x below 600). The tree (21, 12) is cell 18, the area's last
# column, which the harness's tile_point does not reach: `{ at = [20, 12], offset = [38, 16] }`
# puts the pointer at x 590 (cell 18), y 280 (cell 8), and the record names the tile picked.
#
# The boats by name (`boats`: the record in use on each tile at the start, README "Boats and the
# sea"): `boat:<name>` (its record, wherever it lies, in use or not), `boat:<name>:<part>` (a
# table's cell), `boats` (every record by name), `boats:beside` (those in use on the step's
# hero's tile and its eight neighbours). `save = "E15c2"` saves from the system options;
# `load = "E15c2"` starts the game again and loads it (README, "Saves and loads in a batch").

spec = "experiments/specs/E08-batch-15c.toml"
players = ["Red", "Blue"]
difficulty = "easy"
gold = true
boats = { HB = [19, 12], CB = [15, 8], O = [14, 17], B4 = [52, 7], B5 = [40, 35], B2 = [16, 56], B3 = [4, 50], B1 = [38, 55, 1] }


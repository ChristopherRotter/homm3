# E08 batch E3b played by the capture harness (E08 T22a2a, `cross-lane`; h3adv.py batch): the
# procedure of experiments/specs/E08-batch-3b.toml as steps, on Normal. Hot seat, Red and Blue
# human. A visit clicks a monster twice and answers its questions No (a flee offer: let it go; a
# join offer: decline); a battle is played by auto combat or retreated at once, as the spec's
# procedure says. E3-3's aggression comes from the tile's word before its first visit. `expect`
# is the code reading's outcome (the engine's) where it is fixed: a difference shows under the
# encounter's "anything odd" (E3-3's questions depend on the aggression drawn: no `expect`).

spec = "experiments/specs/E08-batch-3b.toml"
players = ["Red", "Blue"]
difficulty = "normal"

# --- Day 1, Red: D-9 and D-10's control on Normal -----------------------------------------------

[[step]]
encounter = "E3-1"
hero = "E3-1"
walk = [4, 3]
answer = "no"
battle = "auto"
expect = { question = "none", battle = true, dialogs = true }
record = { "E3-1's primary skills (attack/defense/power/knowledge) before" = "before:hero:primary", "the questions asked (none, flee, join, …)" = "question", "a battle (yes/no)" = "battle", "the monster on its tile after" = "monster:4,3" }


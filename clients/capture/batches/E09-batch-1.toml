# --- Game 2: TWN-1-3b, the siege won --------------------------------------------------------------

[[step]]
encounter = "TWN-1-3"
hero = "TWN-1-3"
walk = [20, 61]
# Both players are human in hot seat, so auto combat does not play the battle (h3adv.fight;
# batch E9a's E9-2), and `attack` would have Blue's stacks act too, its shooters (Marksmen, Monks)
# included, which its melee strikes were never tried with. The table form with a list (E09 T3b):
# the Archangels strike Blue's stacks creature by creature, shooters first (an Archer listed too:
# a merge that leaves them in), while every Blue stack defends, as the procedure says; a creature
# not there is passed over, and `attack` plays anything left.
battle = { attack = ["Marksman", "Monk", "Archer", "Cavalier", "Griffin", "Swordsman", "Halberdier", "Centaur", "Pikeman"], by = "attacker", then = "attack" }
# The level-up's first offer (the dialog's left one, or its only one).
level_up = "left"
expect = { question = "none", battle = true, dialogs = true }
[step.record]
"0 | 3b opening: Blue's stacks" = "opening:slot:0:defender"
"1 | 3b opening: Blue's stacks" = "opening:slot:1:defender"
"2 | 3b opening: Blue's stacks" = "opening:slot:2:defender"
"3 | 3b opening: Blue's stacks" = "opening:slot:3:defender"
"4 | 3b opening: Blue's stacks" = "opening:slot:4:defender"
"5 | 3b opening: Blue's stacks" = "opening:slot:5:defender"
"6 | 3b opening: Blue's stacks" = "opening:slot:6:defender"
"3b after the battle: Red's hero's tile, movement points; the town's owner; a town screen (yes/no); the garrison" = ["hero:tile", "hero:points", "town:20,61:owner", "town_screen", "town:20,61:garrison"]
[step.note]
"3b (game 2) before the step: Red's hero's tile, points; the garrison; Blue's army" = ["before:hero:tile", "before:hero:points", "before:town:20,61:garrison", "before:hero[Visitor]:slots"]
"3b: the winner; the level-ups; the messages" = ["winner", "level_up_dialogs", "messages"]
"3b after: the town's visitor; built; Visitor on the map" = ["town:20,61:visitor", "town:20,61:built", "hero[Visitor]:on_map"]
"3b: screens not known by their vtable" = "unknown_screens"


# E09 batch TWN-1 played by the capture harness (E09 T3b; h3adv.py batch): the procedure of
# experiments/specs/E09-batch-1.toml as steps, on Easy, with T3b's reads (README, "Towns"). Hot
# seat, Red and Blue human, the starting bonus Gold, everything on Red's day 1 (Blue never plays).
# Game 1: TWN-1-1's and TWN-1-2's reads (each by its row's hero, which never moves), TWN-1-3a (the
# reads before, the siege, Red retreats, the reads after). Game 2, a new game: the same reads,
# TWN-1-3b (the siege won), TWN-1-4 (a siege won, then the later step onto the gate). Game 3, a
# new game: the same reads.
#
# 3b is played in game 2 instead of loading save 1 (the user's decision, 2026-11-03): the merge
# has no random part, so game 2's is game 1's, and 3b's record of the opening shows any
# difference; no save is made. The heroes' names on the map are the rows' ids (TWN-1-1 to
# TWN-1-4) and Blue's Visitor. A town by its entrance (`town:x,y:<part>`), a slot by its row's
# label (TWN-1-3's table: `<slot> | <column>`). The town screen is known by its vtable (0x64372C,
# learned live in T3b) and closed by its exit button; the walks onto a gate note any other screen
# not known by its vtable (`unknown_screens`; README, "Towns").

spec = "experiments/specs/E09-batch-1.toml"
players = ["Red", "Blue"]
difficulty = "easy"
gold = true


record = { "after the battle: Red's hero's tile and movement points; the owner; a town screen (yes/no); the garrison" = ["hero:tile", "hero:points", "town:40,61:owner", "town_screen", "town:40,61:garrison"] }
note = { "the siege: the winner; the defenders at the opening; the level-ups; the messages" = ["winner", "opening:stacks:defender", "level_up_dialogs", "messages"], "the siege: screens not known by their vtable" = "unknown_screens" }

[[step]]

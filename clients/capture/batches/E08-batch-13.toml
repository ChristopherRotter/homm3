# E08 batch E13 played by the capture harness (E08 T120; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-13.toml as steps, on Easy, the starting bonus gold, with T120's
# reads (README, "Creature banks"). Hot seat, Red and Blue human. In the spec's order: day 1,
# Red: E13-1's records and the draws' check, E13-2 with E13-11, E13-9, E13-3, E13-6 with E13-4
# and E13-8's first part, E13-7, E13-5 (the coast and the boarding); Blue: E13-1's Blue reads,
# E13-12; day 2, Red: E13-10, E13-5's Derelict Ship, E13-8.
#
# A bank's record and word are read by its entrance (`bank:x,y[:part]`, live; under a hero
# standing there, its record's word). The draws' check is the recipe's `[[require]]` with
# `starts = 5` (at most five starts, then the last played); the banks E13-7 and E13-10 take are
# the steps' `pick` (the first that meets the record's condition, else the first). Each
# bank's visit notes its dialogs in order (`order`) and the hero's tile and points at the question
# (`questions:at`); each battle its stacks with every hex they cover (`opening:cover`), its
# obstacles (`blocked`), war machines (`opening:machines`) and battlefield (`opening:field`).
# E13-3's battle plays `{ shoot = "Archer", then = "auto" }` (the other stacks defend until the
# Archers' first turn, their shots read before and after their shot), E13-9's `{ shoot = "Wood
# Elf", then = "retreat" }`.

spec = "experiments/specs/E08-batch-13.toml"
players = ["Red", "Blue"]
difficulty = "easy"
gold = true
starts = 5

[[require]]
what = "an Imp Cache of level 1 (1000 gold) among I2, I3, I4"
any = [[14, 21], [7, 21], [12, 24]]
bank = { gold = 1000 }

[[require]]
what = "U1 or U2 with fewer than four relics"
any = [[16, 44], [16, 50]]
bank = { relics_below = 4 }


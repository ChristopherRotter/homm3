# E08 batch E9a played by the capture harness (E08 T79a; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-9a.toml as steps, on Easy, with T79a's reads (README, "Mines,
# Lighthouses and Shipyards"). Hot seat, Red and Blue human, in the spec's order: day 1, Red: the
# reads before any hero moves (E9-4's explored tiles and Lighthouses, E9-1's mines, E9-5's
# Shipyard words), E9-1, E9-3, E9-4 (boards), E9-5 (the visit's boat, boarding, E9-5b's click from
# afar), the treasury; Blue: the treasury, E9-2 (Leave Guards in both mines), E9-3b, the
# treasury. Day 2, Red: the treasury, E9-4's points, E9-5 sails off and E9-5b's click builds,
# E9-2r's two battles (auto combat on again at each stop: who plays the guards); Blue: the
# treasury.

spec = "experiments/specs/E08-batch-9a.toml"
players = ["Red", "Blue"]
difficulty = "easy"


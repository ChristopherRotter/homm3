# E08 batch E12b played by the capture harness (E08 T110; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-12b.toml as steps, on Easy, the starting bonus gold, with T110's
# reads (README, "Garrisons and the bonus visitables"). Hot seat, Red and Blue human; Blue only
# ends its turns. In the spec's order: day 1, Red: E12-12's reads, E12-17, E12-14, E12-9, E12-10,
# E12-11, E12-13, E12-7 (E12-15, E12-7, E12-8, E12-16's water part); day 2: E12-12, E12-14,
# E12-10, E12-11, E12-13 (E12-16's land part); days 3 to 5: E12-12; days 6 and 7: E12-12,
# E12-11; day 8: E12-12, E12-9, E12-10's reads; days 15 and 22: E12-12.
#
# Each day's E12-12 row is read as Red's turn starts (an end-turn step `to_day = <n>`: the turns
# ended until Red's turn of day n). A Fountain's word (`fountain:x,y`: its value, bits 13 to 16
# signed, and the team bits) and a Spring's entrance (`spring:x,y`: bit 6) are the tile's own
# word; a hero's status bit (`hero:bit:<n>`, +0x105), its visits' morale and luck bytes
# (`hero:morale_bonus`, `hero:luck_bonus`, +0x11A, +0x11B) and a u32 of its record
# (`hero:word:0x7B`, the School of War bits). A `cast` step opens the selected hero's spell book on
# the map and casts View Earth (its only adventure spell), its view closed. A hint step's list of
# tiles (`hint = [[x, y], ...]`) reads each tile's status bar text with the step's hero selected
# (the view centred by the minimap when the tile is out of it), named by its records (`hints`).

spec = "experiments/specs/E08-batch-12b.toml"
players = ["Red", "Blue"]
difficulty = "easy"
gold = true

# --- Day 1, Red: E12-12's reads, E12-17 ----------------------------------------------------------------

[[step]]
encounter = "E12-17"
hero = "E12-17"

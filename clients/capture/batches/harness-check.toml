# The capture harness's own check (E17 H1, *provisional*; capture/checks/harness-check.toml, the
# runbook's "An experiment batch"): each thing the harness does on the adventure map, played on
# Easy (E17 H1, H2). The underground waits for h3-map's writer (E17-log.md, H2: a shipped map). A monster's questions wait for h3-experiment's dispositions (E08 T22a): until then they
# were checked on a local map (E17-log.md, H1).

spec = "clients/capture/checks/harness-check.toml"
players = ["Red", "Blue"]
difficulty = "easy"

# Day 1, Red: the seventh hero of the list and the heroes off the map, a battle fought by the
# computer, a retreat, a surrender, a hero's details, a level-up, a battle by plan (E08 T32b1).

[[step]]
encounter = "Seven"
hero = "Seven"
record = { "the hero's tile" = "hero:tile", "the heroes off the map: experience" = "heroes:experience" }

[[step]]
encounter = "Win"
hero = "Win"
walk = [4, 3]
battle = "auto"
expect = { question = "none", battle = true, dialogs = true }
record = { "difficulty" = "difficulty", "gold at the start" = "before:resource:gold", "a battle (yes/no)" = "battle", "stacks at the start" = "stacks:start", "stacks at the end" = "stacks:end", "the hero's army after" = "hero:army", "experience after" = "hero:experience", "the monster after" = "monster:4,3" }

[[step]]
encounter = "Run"
hero = "Run"
walk = [4, 8]
battle = "retreat"
expect = { question = "none", battle = true, dialogs = true }
record = { "stacks at the start" = "stacks:start", "the hero on the map after (yes/no)" = "hero:on_map", "the monster after" = "monster:4,8" }

[[step]]
encounter = "Hot"
hero = "Hot"
walk = [4, 13]
battle = "defender surrender"
expect = { question = "none", battle = true, dialogs = true }
record = { "Red's gold before" = "before:resource:gold:red", "Blue's gold before" = "before:resource:gold:blue", "Red's gold after" = "resource:gold:red", "Blue's gold after" = "resource:gold:blue", "Red's hexes at the start" = "hexes:start:attacker", "Blue's hexes at the start" = "hexes:start:defender", "Blue's hero on the map after (yes/no)" = "hero[Hot B]:on_map" }

[[step]]
encounter = "Exp"
hero = "Exp"
record = { "experience" = "hero:experience", "level" = "hero:level", "primary skills" = "hero:primary", "Diplomacy" = "hero:skill:Diplomacy", "Logistics" = "hero:skill:Logistics", "secondary skills (in the hero's order)" = "hero:skills", "seed byte (hero +0x8F)" = "hero:seed", "Wisdom last offered (hero +0x90)" = "hero:wisdom_offer", "a school last offered (hero +0x3F)" = "hero:school_offer" }

[[step]]
encounter = "Lvl"
hero = "Lvl"
walk = [4, 23]
battle = "auto"
level_up = "left"
expect = { question = "none", battle = true, dialogs = true }
record = { "level after" = "hero:level", "experience after" = "hero:experience", "level-up dialogs" = "level_ups", "dialog 1, level" = "level_up:1:level", "dialog 1, primary skill raised" = "level_up:1:primary", "dialog 1, left offer (or the only one)" = "level_up:1:left", "dialog 1, right offer" = "level_up:1:right", "dialog 1, taken" = "level_up:1:taken", "secondary skills after (in the hero's order)" = "hero:skills", "the battlefield's special field" = "battlefield", "the battlefield's terrain" = "battlefield:terrain", "messages after the battle" = "messages" }

# E08 T32b1: a hero's artifacts and backpack; a battle on a Clover Field played by plan (batch
# E4's E4-9: Blue's Thunderbirds destroy Red's Ballista while Red's Archangels defend, then auto
# combat), two level-ups answered left, then right.

[[step]]
encounter = "Gear"
hero = "Gear"
record = { "artifacts before (worn, by slot)" = "hero:artifacts", "backpack before" = "hero:backpack" }

[[step]]
encounter = "Gear"
hero = "Gear"
walk = [11, 13]
battle = { attack = "Ballista", by = "defender", then = "auto" }
level_up = ["left", "right"]
expect = { question = "none", battle = true, dialogs = true }
record = { "the battlefield's special field" = "battlefield", "the battlefield's terrain" = "battlefield:terrain", "the Ballista destroyed (yes/no)" = "destroyed:Ballista", "the battle's winner" = "winner", "artifacts after (worn, by slot)" = "hero:artifacts", "backpack after" = "hero:backpack", "level-up dialogs" = "level_ups", "dialog 1, level" = "level_up:1:level", "dialog 1, primary skill raised" = "level_up:1:primary", "dialog 1, left offer (or the only one)" = "level_up:1:left", "dialog 1, right offer" = "level_up:1:right", "dialog 1, taken" = "level_up:1:taken", "dialog 2, level" = "level_up:2:level", "dialog 2, primary skill raised" = "level_up:2:primary", "dialog 2, left offer (or the only one)" = "level_up:2:left", "dialog 2, right offer" = "level_up:2:right", "dialog 2, taken" = "level_up:2:taken", "secondary skills after (in the hero's order)" = "hero:skills" }

[[step]]
end_turn = true

[[step]]
end_turn = true

# Day 2, Red.

[[step]]
encounter = "Six"
hero = "Six"
walk = [11, 3]
record = { "the date" = "date", "points before the walk" = "before:points" }

# The capture harness's own check (E17 H1, *provisional*; capture/checks/harness-check.toml, the
# runbook's "An experiment batch"): each thing the harness does on the adventure map, played on
# Easy (E17 H1, H2). The underground waits for h3-map's writer (E17-log.md, H2: a shipped map). A monster's questions wait for h3-experiment's dispositions (E08 T22a): until then they
# were checked on a local map (E17-log.md, H1).

spec = "clients/capture/checks/harness-check.toml"
players = ["Red", "Blue"]
difficulty = "easy"

# Day 1, Red: the seventh hero of the list and the heroes off the map, a battle fought by the
# computer, a retreat, a surrender, a hero's details, a level-up, a battle by plan (E08 T32b1).

[[step]]
encounter = "Seven"
hero = "Seven"
record = { "the hero's tile" = "hero:tile", "the heroes off the map: experience" = "heroes:experience" }

[[step]]
encounter = "Win"
hero = "Win"
walk = [4, 3]
battle = "auto"
expect = { question = "none", battle = true, dialogs = true }
record = { "difficulty" = "difficulty", "gold at the start" = "before:resource:gold", "a battle (yes/no)" = "battle", "stacks at the start" = "stacks:start", "stacks at the end" = "stacks:end", "the hero's army after" = "hero:army", "experience after" = "hero:experience", "the monster after" = "monster:4,3" }

# E08 T57: Win's chest (the experience taken) and Warrior's Tomb (yes), its backpack full.
[[step]]
encounter = "Win"
hero = "Win"
walk = [3, 5]
choice = "right"
record = { "the chest's word before (hex)" = ["before:word:3,5", "before:object:3,5"], "the chest's choice" = "choice", "experience before / after the chest" = ["before:hero:experience", "hero:experience"], "the chest after" = "object:3,5" }
note = { "level-ups" = "level_up_dialogs" }

[[step]]
encounter = "Win"
hero = "Win"
walk = [7, 5]
answer = "yes"
record = { "the Tomb's question; messages" = ["questions", "messages", "message_pictures"], "morale bonus, status flags before / after the Tomb" = ["before:hero:morale_bonus", "before:hero:status", "hero:morale_bonus", "hero:status"], "spell points, luck bonus, backpack count after the Tomb" = ["hero:spell_points", "hero:luck_bonus", "hero:backpack_count"], "the Tomb after" = ["word:7,5", "object:7,5"] }

[[step]]
encounter = "Run"
hero = "Run"
walk = [4, 8]
battle = "retreat"
expect = { question = "none", battle = true, dialogs = true }
record = { "stacks at the start" = "stacks:start", "the hero on the map after (yes/no)" = "hero:on_map", "the monster after" = "monster:4,8" }

[[step]]
encounter = "Hot"
hero = "Hot"
walk = [4, 13]
battle = "defender surrender"
expect = { question = "none", battle = true, dialogs = true }
record = { "Red's gold before" = "before:resource:gold:red", "Blue's gold before" = "before:resource:gold:blue", "Red's gold after" = "resource:gold:red", "Blue's gold after" = "resource:gold:blue", "Red's hexes at the start" = "hexes:start:attacker", "Blue's hexes at the start" = "hexes:start:defender", "Blue's hero on the map after (yes/no)" = "hero[Hot B]:on_map" }

[[step]]
encounter = "Exp"
hero = "Exp"
record = { "experience" = "hero:experience", "level" = "hero:level", "primary skills" = "hero:primary", "Diplomacy" = "hero:skill:Diplomacy", "Logistics" = "hero:skill:Logistics", "secondary skills (in the hero's order)" = "hero:skills", "seed byte (hero +0x8F)" = "hero:seed", "Wisdom last offered (hero +0x90)" = "hero:wisdom_offer", "a school last offered (hero +0x3F)" = "hero:school_offer" }

[[step]]
encounter = "Lvl"
hero = "Lvl"
walk = [4, 23]
battle = "auto"
level_up = "left"
expect = { question = "none", battle = true, dialogs = true }
record = { "seed byte (hero +0x8F)" = "hero:seed", "Wisdom last offered (hero +0x90)" = "before:hero:wisdom_offer", "a school last offered (hero +0x3F)" = "before:hero:school_offer", "experience at the start" = "before:hero:experience", "level at the start" = "before:hero:level", "primary skills at the start (attack/defense/power/knowledge)" = "before:hero:primary", "secondary skills at the start (in the hero's order)" = "before:hero:skills", "level after" = "hero:level", "experience after" = "hero:experience", "level-up dialogs" = "level_ups", "dialog 1, level" = "level_up:1:level", "dialog 1, primary skill raised" = "level_up:1:primary", "dialog 1, left offer (or the only one)" = "level_up:1:left", "dialog 1, right offer" = "level_up:1:right", "dialog 1, taken" = "level_up:1:taken", "secondary skills after (in the hero's order)" = "hero:skills", "the battlefield's special field" = "battlefield", "the battlefield's terrain" = "battlefield:terrain", "messages after the battle" = "messages" }

# E08 T32b1: a hero's artifacts and backpack; a battle on a Clover Field played by plan (batch
# E4's E4-9: Blue's Thunderbirds destroy Red's Ballista while Red's Archangels defend, then auto
# combat), two level-ups answered left, then right.

[[step]]
encounter = "Gear"
hero = "Gear"
record = { "artifacts before (worn, by slot)" = "hero:artifacts", "backpack before" = "hero:backpack" }

[[step]]
encounter = "Gear"
hero = "Gear"
walk = [11, 13]
battle = { attack = "Ballista", by = "defender", then = "attack" }
level_up = ["left", "right"]
expect = { question = "none", battle = true, dialogs = true }
record = { "seed byte (hero +0x8F)" = "hero:seed", "Wisdom last offered (hero +0x90)" = "before:hero:wisdom_offer", "a school last offered (hero +0x3F)" = "before:hero:school_offer", "experience at the start" = "before:hero:experience", "level at the start" = "before:hero:level", "primary skills at the start (attack/defense/power/knowledge)" = "before:hero:primary", "secondary skills at the start (in the hero's order)" = "before:hero:skills", "the battlefield's special field" = "battlefield", "the battlefield's terrain" = "battlefield:terrain", "the Ballista destroyed (yes/no)" = "destroyed:Ballista", "the battle's winner" = "winner", "artifacts after (worn, by slot)" = "hero:artifacts", "backpack after" = "hero:backpack", "experience after" = "hero:experience", "level-up dialogs" = "level_ups", "dialog 1, level" = "level_up:1:level", "dialog 1, primary skill raised" = "level_up:1:primary", "dialog 1, left offer (or the only one)" = "level_up:1:left", "dialog 1, right offer" = "level_up:1:right", "dialog 1, taken" = "level_up:1:taken", "dialog 2, level" = "level_up:2:level", "dialog 2, primary skill raised" = "level_up:2:primary", "dialog 2, left offer (or the only one)" = "level_up:2:left", "dialog 2, right offer" = "level_up:2:right", "dialog 2, taken" = "level_up:2:taken", "secondary skills after (in the hero's order)" = "hero:skills" }

[[step]]
end_turn = true

# Day 1, Blue (E08 T37a, batch E5's reads): whether Blue has explored the probes at its disk's edge
# and whether Red has explored Fog's tile, before and after a step east (each cell of the table by
# its column); Equip's Boots of Speed and Spyglass put on from the backpack in the hero screen.

[[step]]
encounter = "Fog"
hero = "Fog"
record = { "points at the start" = "hero:points", "A (33, 30) | at the start" = "explored:33,30", "B (34, 30) | at the start" = "explored:34,30", "C (33, 32) | at the start" = "explored:33,32", "D (33, 33) | at the start" = "explored:33,33", "Red explored the hero's tile (yes/no)" = "explored:28,30:red" }

[[step]]
encounter = "Fog"
hero = "Fog"
walk = [29, 30]
record = { "points after the step" = "points", "A (33, 30) | after the step" = "explored:33,30", "B (34, 30) | after the step" = "explored:34,30", "C (33, 32) | after the step" = "explored:33,32", "D (33, 33) | after the step" = "explored:33,33" }

[[step]]
encounter = "Equip"
hero = "Equip"
record = { "artifacts before (worn, by slot)" = "hero:artifacts", "backpack before" = "hero:backpack", "points before" = "hero:points", "day's points before (hero +0x49)" = "hero:day_points" }

[[step]]
encounter = "Equip"
hero = "Equip"
equip = { "Boots of Speed" = "feet", "Spyglass" = "misc 1" }
record = { "artifacts after (worn, by slot)" = "hero:artifacts", "backpack after" = "hero:backpack", "points after" = "hero:points", "day's points after (hero +0x49)" = "hero:day_points" }

# E08 T47a (batch E6's clicks and reads): Kit's hero screen (army slots, split and slider, the
# creature dialog's dismiss, the formation buttons, artifacts, a combination's questions, right
# clicks, the backpack's arrow; slots, counts shown, flags, spells, positions) and a battle's
# tactics phase; Full's army dialog after a join without room and its exchange with Full B.

[[step]]
encounter = "Kit"
hero = "Kit"
screen = "hero"
actions = [
    { record = { "slots at the start" = "hero:slots", "counts shown at the start" = "shown:army", "flags at the start" = "hero:flags", "learned spells" = "hero:spells", "positions at the start" = "hero:positions", "backpack at the start" = "hero:backpack", "backpack shown at the start" = "shown:backpack" } },
    { click = ["army:0", "army:1"], record = { "slots after the swap" = "hero:slots" } },
    { click = ["army:0", "split", "army:3"], record = { "split dialog at the start" = "split:counts" } },
    { slider = "max", record = { "split dialog at the maximum" = "split:counts" } },
    { click = ["ok"], record = { "slots after the split" = "hero:slots" } },
    { click = ["army:3", "army:3", "dismiss"], answer = "yes", record = { "the dismiss question" = "questions", "slots after the dismissal" = "hero:slots", "counts shown after the dismissal" = "shown:army" } },
    { click = ["tactics"], record = { "flags after the tactics button" = "hero:flags" } },
    { click = ["tactics"], record = { "flags after it again" = "hero:flags" } },
    { click = ["tight"], record = { "flags after tight" = "hero:flags" } },
    { click = ["loose"], record = { "flags after loose" = "hero:flags" } },
    { click = ["backpack:Mystic Orb of Mana", "worn:12"], answer = "no", record = { "the first equip's question" = "questions", "positions after it" = "hero:positions" } },
    { right = "worn:12", answer = "yes", record = { "the right click" = "shown", "positions after the assembly" = "hero:positions" } },
    { click = ["worn:Wizard's Well", "backpack:0"], record = { "backpack after the Well put in" = "hero:backpack" } },
    { right = "backpack:Wizard's Well", answer = "no", record = { "the right click in the backpack" = "shown" } },
    { click = ["backpack right"], record = { "backpack after the arrow" = "hero:backpack", "backpack shown after the arrow" = "shown:backpack", "positions at the end" = "hero:positions" } },
]

[[step]]
encounter = "Kit"
hero = "Kit"
walk = [29, 8]
battle = "auto"
expect = { question = "none", battle = true, dialogs = true }
record = { "tactics phase (yes/no)" = "tactics", "the battle's winner" = "winner" }

[[step]]
encounter = "Full"
hero = "Full"
walk = [29, 13]
answer = "yes"
expect = { question = "join" }
actions = [
    { record = { "the dialog's title" = "dialog", "the dialog's counts, upper" = "shown:upper", "the dialog's counts, lower" = "shown:lower" } },
    { click = ["lower:3", "lower:3", "dismiss"], answer = "yes", record = { "the dismiss question" = "questions", "the army after the dismissal" = "hero:slots" } },
    { click = ["upper:0", "lower:3"], record = { "the army after the group taken" = "hero:slots" } },
    { click = ["ok"] },
]
record = { "the join question" = "questions", "the group's tile after" = "monster:29,13" }

[[step]]
encounter = "Full"
hero = "Full"
walk = [27, 13]
actions = [
    { record = { "the exchange's counts, left" = "shown:left army", "the exchange's counts, right" = "shown:right army" } },
    { click = ["left army:0", "right army:1"], record = { "the hero's army after the move" = "hero:slots", "Full B's army after the move" = "hero[Full B]:slots" } },
    { click = ["right army:0", "right split", "left army:0"], record = { "split dialog at the start" = "split:counts" } },
    { slider = "max", record = { "split dialog at the maximum" = "split:counts" } },
    { click = ["ok"], record = { "the hero's army after the split" = "hero:slots", "Full B's army after the split" = "hero[Full B]:slots", "counts shown after the split, left" = "shown:left army", "counts shown after the split, right" = "shown:right army" } },
    { click = ["close"] },
]

[[step]]
end_turn = true

# Day 2, Red.

[[step]]
encounter = "Six"
hero = "Six"
walk = [11, 3]
record = { "the date" = "date", "points before the walk" = "before:points" }

[[step]]
end_turn = true

# Day 2, Blue (E08 T37a): Equip's points at the turn start, read without a walk.

[[step]]
encounter = "Equip"
hero = "Equip"
record = { "day 2 points (no walk)" = "hero:points", "day 2 day's points (hero +0x49)" = "hero:day_points" }

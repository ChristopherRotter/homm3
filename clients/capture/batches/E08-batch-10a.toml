# E08 batch E10a played by the capture harness (E08 T90; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-10a.toml as steps, on Easy, with T90's reads (README, "Dwellings, the
# hire dialog and a computer player's turn"). Hot seat, Red and Blue human (allied by the map), Tan
# a computer. In the spec's order: day 1, Red: the reads before any hero moves (E10-6's teams and
# treasury, E10-7's objects, tiles and records, E10-1's three records, E10-3's two), E10-1 (three
# battles), E10-3 (P twice, Q), E10-6 (Blue's Barracks and Dragon Cliffs), E10-4, the treasury;
# Blue: E10-6's records again; Tan plays inside the end-turn (never seen as the current player:
# `ai_turns` reads none), so Tan's treasury and hero are read before (day 1, Red) and after (day
# 2, Red). Day 2, Red: the treasury, E10-5 (the dialog with no crystal, the pile, the dialog with
# one); Blue: the end.
#
# The answers by kind (KINDS, h3adv.py): `guards` the guards' question (GENRLTXT 422), `hire` the
# hire question (ADVEVENT 35, 36). A guards' question's size word is read as its ARRAYTXT row
# (`size_words`). A visit to a dwelling is a walk onto its entrance from the tile below it.

spec = "experiments/specs/E08-batch-10a.toml"
players = ["Red", "Blue"]
difficulty = "easy"


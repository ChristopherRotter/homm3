# E08 batch E3c played by the capture harness (E08 T22a2b, `cross-lane`; h3adv.py batch): the
# procedure of experiments/specs/E08-batch-3c.toml as steps, on Normal. Hot seat, Red and Blue
# human; Blue's hero never moves. Two reads at the start (the heroes off the map, a hero with a
# custom experience), then Red's E3-8 attacks Blue's E3-9 and surrenders at its first stack's
# turn (Blue's stacks defend until then). `expect` is the code reading's outcome (the engine's): a
# difference shows under the encounter's "anything odd".

spec = "experiments/specs/E08-batch-3c.toml"
players = ["Red", "Blue"]
difficulty = "normal"

# --- Day 1, Red: the reads at the start --------------------------------------------------------

[[step]]
encounter = "E3-7"
hero = "E3-7"
record = { "the heroes off the map: experience (how many, lowest to highest, how many at each)" = "heroes:experience", "E3-7's experience" = "hero:experience", "E3-7's level" = "hero:level" }

[[step]]
encounter = "E3-6"
hero = "E3-6"
record = { "E3-6's experience" = "hero:experience", "E3-6's level" = "hero:level", "E3-6's primary skills (attack/defense/power/knowledge)" = "hero:primary", "Pathfinding" = "hero:skill:Pathfinding", "Archery" = "hero:skill:Archery", "Logistics" = "hero:skill:Logistics", "Scouting" = "hero:skill:Scouting", "Navigation" = "hero:skill:Navigation", "Mysticism" = "hero:skill:Mysticism", "Offense" = "hero:skill:Offense", "Armorer" = "hero:skill:Armorer" }

# --- Day 1, Red: D-13 and E3-9 -----------------------------------------------------------------

[[step]]
encounter = "E3-8"
hero = "E3-8"
walk = [4, 11]
battle = "surrender"
expect = { question = "none", battle = true, dialogs = true }
record = { "E3-8's primary skills (attack/defense/power/knowledge) before" = "before:hero:primary", "Red's gold before" = "before:resource:gold:red", "Blue's gold before" = "before:resource:gold:blue", "the questions asked (none, …)" = "question", "the attacker's hexes at the start (Red, loose)" = "hexes:start:attacker", "the defender's hexes at the start (Blue, tight on the map)" = "hexes:start:defender", "the stacks at the start" = "stacks:start", "who surrendered (attacker, defender, none)" = "surrendered", "the battle's winner" = "winner", "Red's gold after" = "resource:gold:red", "Blue's gold after" = "resource:gold:blue", "E3-8 on the map after (yes/no)" = "hero:on_map", "E3-8's army after" = "hero:army", "E3-9's experience after" = "hero[E3-9]:experience" }

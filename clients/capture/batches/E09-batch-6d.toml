# E09 batch TWN-6, part d, played by the capture harness (E09 T54; h3adv.py batch): the procedure
# of experiments/specs/E09-batch-6d.toml as steps, on Easy, hot seat, Red and Blue human, the
# starting bonus Gold. Red's day 1: TWN-6-6's two boats at F (the second through the town screen's
# pixel (233, 341)), TWN-6-7's visit to C's Magic University.
#
# The town screen's actions: `building = <id>` with `opens` (E09-batch-6a.toml's header), `pixel =
# [x, y]` a click at a screen pixel with `opens` the same; the boat dialog's `build`. The reads:
# `town:x,y:spot` the town's boat spot (+0x8, +0x9: `9,11`, `none` for 0xFF), `boat_record:x,y`
# every boat record on a tile, `boats:used`; the University's dialog (vtable 0x643BD8):
# `university` the four slots (`Fire Magic: learnable (GENRLTXT:608; banner 1)`: each slot's
# status line hovered), its `slot:fire` (`air`, `water`, `earth`; or `slot:<n>`, n 0 to 3 in the
# dialog's order) clicked opens the purchase box (`university_buy`), whose `buy` buys (`cancel`
# closes it) and `university:buy` reads the button's state.

spec = "experiments/specs/E09-batch-6d.toml"
players = ["Red", "Blue"]
difficulty = "easy"
gold = true

# --- TWN-6-6: the two boats at F --------------------------------------------------------------------------

[[step]]
encounter = "TWN-6-6"
hero = "TWN-6-6"
record = { "before: F's boat spot; the boats; Red's treasury" = ["text:spot: ", "town:10,9:spot", "text:on (9, 11): ", "boat_record:9,11", "text:on (11, 11): ", "boat_record:11,11", "text:in use: ", "boats:used", "text:treasury: ", "treasury:red"] }
note = { "the game's version; the difficulty" = ["map_kind", "difficulty"] }

[[step]]
encounter = "TWN-6-6"
town = [10, 9]
resources = { red = [50, 10, 50, 10, 10, 10, 50000] }
[[step.actions]]
building = 6
opens = "boat"
record = { "the first boat: what the Shipyard's click opened; the boats; Red's treasury; F's buildings standing" = ["text:opened: ", "screen"] }
[[step.actions]]
click = ["build"]
record = { "+the first boat: what the Shipyard's click opened; the boats; Red's treasury; F's buildings standing" = ["text:after Build: ", "screen", "text:on (9, 11): ", "boat_record:9,11", "text:on (11, 11): ", "boat_record:11,11", "text:in use: ", "boats:used", "text:treasury: ", "treasury:red", "text:standing: ", "town:10,9:built"] }

[[step]]
encounter = "TWN-6-6"
town = [10, 9]
[[step.actions]]
record = { "F reopened: F's buildings standing; the ship clicked: what opens" = ["text:standing: ", "town:10,9:built"] }
[[step.actions]]
building = 20
opens = "nothing"
record = { "+F reopened: F's buildings standing; the ship clicked: what opens" = ["text:after the ship's click: ", "screen", "text:messages: ", "messages"] }
[[step.actions]]
pixel = [233, 341]
opens = "boat"
record = { "at (233, 341): what opens; after Build: the boats; Red's treasury; F's buildings standing" = ["text:opened: ", "screen"] }
[[step.actions]]
click = ["build"]
record = { "+at (233, 341): what opens; after Build: the boats; Red's treasury; F's buildings standing" = ["text:after Build: ", "screen", "text:on (9, 11): ", "boat_record:9,11", "text:on (11, 11): ", "boat_record:11,11", "text:in use: ", "boats:used", "text:treasury: ", "treasury:red", "text:standing: ", "town:10,9:built"] }

# --- TWN-6-7: the Magic University with Fire Magic banned ---------------------------------------------------

[[step]]
encounter = "TWN-6-7"
hero = "TWN-6-7"
record = { "before: TWN-6-7's secondary skills; Red's treasury" = ["text:skills: ", "hero:skills", "text:treasury: ", "treasury:red"] }

[[step]]
encounter = "TWN-6-7"
hero = "TWN-6-7"
walk = [26, 9]
resources = { red = [50, 10, 50, 10, 10, 10, 5000] }
expect = { question = "none", battle = false }
[[step.actions]]
building = 21
opens = "university"
record = { "the University: the four slots (skill: state, text)" = "university" }
[[step.actions]]
click = ["slot:fire"]
record = { "the Fire Magic slot clicked: what opens; the buy button" = ["text:opened: ", "screen", "text:buy: ", "university:buy", "text:messages: ", "messages"] }
[[step.actions]]
click = ["buy"]
record = { "after the purchase: TWN-6-7's secondary skills; Red's treasury; the four slots" = ["text:skills: ", "hero:skills", "text:treasury: ", "treasury:red", "text:screen: ", "screen", "text:slots: ", "university"] }
[step.note]
"TWN-6-7's visit: a town screen; how it closed; the messages" = ["text:town screen: ", "town_screen", "text:closed: ", "town_screen_closed", "text:messages: ", "messages"]

record = { "D day 1 after its battle | owner" = "dwelling:10,10:owner", "D day 1 after its battle | creatures and counts" = "dwelling:10,10:creatures", "D day 1 after its battle | guards (creature and count by slot)" = "dwelling:10,10:guards" }


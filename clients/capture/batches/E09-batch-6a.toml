# --- TWN-6-3: the sale after the backpack's arrow (T1, Red's count 8) ----------------------------------------

[[step]]
encounter = "TWN-6-3"
hero = "TWN-6-3"
record = { "before: TWN-6-3's backpack; Red's treasury" = ["text:backpack: ", "hero:backpack", "text:; treasury: ", "treasury:red"] }

[[step]]
encounter = "TWN-6-3"
hero = "TWN-6-3"
walk = [7, 7]
expect = { question = "none", battle = false }
[[step.actions]]
building = 17
opens = "market"
[[step.actions]]
click = ["sell"]
record = { "screen 3 as it opened: the places shown; the count" = ["text:screen: ", "market:screen", "text:; places: ", "market:places", "text:; offset: ", "market:offset", "text:; count: ", "market:count", "text:; buttons: ", "market:buttons"] }
[[step.actions]]
click = ["backpack right"]
record = { "after the right arrow: the places shown; the first place picked with gold: the offer" = ["text:places: ", "market:places", "text:; offset: ", "market:offset"] }
[[step.actions]]
click = ["position:18", "want:gold"]
record = { "+after the right arrow: the places shown; the first place picked with gold: the offer" = ["text:; the pair: ", "market:pair", "text:; the offer: ", "market:rate", "text:; most: ", "market:most", "text:; buttons: ", "market:buttons"] }
[[step.actions]]
click = ["trade"]
record = { "after Trade: the gold gained; TWN-6-3's backpack; the places shown" = ["text:gained: ", "gain", "text:; treasury: ", "treasury:red", "text:; backpack: ", "hero:backpack", "text:; places: ", "market:places", "text:; offset: ", "market:offset"] }
[step.note]
"TWN-6-3's visit: a town screen; how it closed; the messages" = ["town_screen", "text:; ", "town_screen_closed", "text:; ", "messages"]


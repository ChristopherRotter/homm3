# E09 batch TWN-6, part a, played by the capture harness (E09 T54; h3adv.py batch): the procedure
# of experiments/specs/E09-batch-6a.toml as steps, on Easy, hot seat, Red and Blue human, the
# starting bonus Gold. Red's day 1: TWN-6-1's three reads at T1 (the count 2, then 4 and 8 after
# the Marketplaces built in C1 to C6), TWN-6-3's sale at T1, TWN-6-5's clicks at T1 and S1 with a
# garrison hero; Blue's day 1: TWN-6-4's offer at B.
#
# The town screen's actions (README, "Towns"): `building = <id>` clicks the building (where the
# status line names it) and waits for what `opens` names (`market`, `message`, `boat`,
# `university`, `nothing`; `hire` the default); a message is recorded (`messages`, `order`) and its
# OK clicked. The trade window's items by name (README, "Markets"; E09 T54: `sell` the button to
# screen 3, `position:<n>` screen 3's place n, 0 to 17 worn and 18 to 22 the backpack's five,
# `backpack left` and `backpack right` its arrows); `market:places` screen 3's five backpack places
# as drawn, `market:offset` the backpack offset 0x6AAA70.

spec = "experiments/specs/E09-batch-6a.toml"
players = ["Red", "Blue"]
difficulty = "easy"
gold = true

# --- TWN-6-1: the count 2 (T1, S1) ----------------------------------------------------------------------

[[step]]
encounter = "TWN-6-1"
town = [7, 7]
[[step.actions]]
building = 14
opens = "market"
record = { "2 Marketplaces: the count; 1 wood for (gold); 1 ore for (gold)" = ["text:screen: ", "market:screen", "text:; count: ", "market:count"] }
[[step.actions]]
click = ["give:wood", "want:gold"]
record = { "+2 Marketplaces: the count; 1 wood for (gold); 1 ore for (gold)" = ["text:; wood: ", "market:rate"] }
[[step.actions]]
click = ["give:ore", "want:gold"]
record = { "+2 Marketplaces: the count; 1 wood for (gold); 1 ore for (gold)" = ["text:; ore: ", "market:rate"] }
[step.note]
"the game's version; the difficulty" = ["map_kind", "text:; ", "difficulty"]

# --- the Marketplaces of C1 and C2 ----------------------------------------------------------------------

[[step]]
encounter = "TWN-6-1"
town = [23, 7]
resources = { red = [50, 10, 50, 10, 10, 10, 50000] }
actions = [{ hall = true }, { slot = 14 }, { click = ["build"] }]
record = { "the builds in C1 and C2: each town's buildings after" = ["text:C1: ", "town:23,7:built"] }

[[step]]
encounter = "TWN-6-1"
town = [31, 7]
actions = [{ hall = true }, { slot = 14 }, { click = ["build"] }]
record = { "+the builds in C1 and C2: each town's buildings after" = ["text:; C2: ", "town:31,7:built"] }

[[step]]
encounter = "TWN-6-1"
town = [7, 7]
[[step.actions]]
building = 14
opens = "market"
record = { "4 Marketplaces: the count; 1 wood for (gold); 1 ore for (gold)" = ["text:screen: ", "market:screen", "text:; count: ", "market:count"] }
[[step.actions]]
click = ["give:wood", "want:gold"]
record = { "+4 Marketplaces: the count; 1 wood for (gold); 1 ore for (gold)" = ["text:; wood: ", "market:rate"] }
[[step.actions]]
click = ["give:ore", "want:gold"]
record = { "+4 Marketplaces: the count; 1 wood for (gold); 1 ore for (gold)" = ["text:; ore: ", "market:rate"] }


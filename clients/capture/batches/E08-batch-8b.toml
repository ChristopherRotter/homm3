each = { from = [24, 24], to = [38, 32], step = [2, 2] }
walk = "each"
select = { is = "Flotsam: 10 wood, 500 gold", count = 1 }
near = true
days = 1
expect = { dialogs = true }
record = { "row:object visited (tile)" = [["text:Flotsam ({x}, {y})", "before:object:{x},{y}"], "before:word:{x},{y}", ["messages", "message_pictures"], ["before:resource:wood", "before:resource:gold", "resource:wood", "resource:gold"], ["before:hero:backpack_count", "hero:backpack_count", "hero:positions", "hero:backpack"]] }
note = { "Flotsam ({x}, {y}) after the visit" = ["text:its object", "object:{x},{y}"] }

[[step]]
encounter = "E8-8"
hero = "E8-8"
each = { from = [24, 40], to = [38, 48], step = [2, 2] }
walk = "each"
select = { is = "Survivor", count = 1 }
near = true
days = 1
expect = { dialogs = true }
record = { "row:object visited (tile)" = [["text:Survivor ({x}, {y})", "before:object:{x},{y}"], "before:word:{x},{y}", ["messages", "message_pictures"], ["before:resource:wood", "before:resource:gold", "resource:wood", "resource:gold"], ["before:hero:backpack_count", "hero:backpack_count", "hero:positions", "hero:backpack"]] }
note = { "Survivor ({x}, {y}) after the visit" = ["text:its object", "object:{x},{y}"] }

[[step]]
encounter = "E8-8"
hero = "E8-8"
each = { from = [44, 24], to = [58, 32], step = [2, 2] }
walk = "each"
select = { holds = "artifact", count = 1 }
near = true
days = 1
expect = { dialogs = true }
record = { "row:object visited (tile)" = [["text:Sea Chest ({x}, {y})", "before:object:{x},{y}"], "before:word:{x},{y}", ["messages", "message_pictures"], ["before:resource:wood", "before:resource:gold", "resource:wood", "resource:gold"], ["before:hero:backpack_count", "hero:backpack_count", "hero:positions", "hero:backpack"]] }
note = { "Sea Chest ({x}, {y}) after the visit" = ["text:its object", "object:{x},{y}"] }


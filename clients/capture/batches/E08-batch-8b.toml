# E08 batch E8b played by the capture harness (E08 T68b; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-8b.toml as steps, on Easy, with T68a's and T68b's reads (README,
# "Boats and the sea"). Hot seat, Red and Blue human. A new game without an artifact chest among
# E8-6's thirty or E8-8's forty is started again (`require`, the spec's restart rule). At the
# start every word of E8-6's and E8-8's pickups is read (E8-8's into its tables, E8-6's under its
# "anything odd"). Day 1, Red: E8-6, E8-8, E8-9, E8-12, E8-13 and E8-14 board; Blue: E8-11b and
# E8-12b board. Day 2, Red: the turn-start reads (E8-6's points, E8-14's gold), then E8-6, E8-8,
# E8-9, E8-13, E8-14, E8-11 and E8-12, in the spec's order. A visit picks its objects by their
# words (`select`), sails toward a target not yet explored over open water first (`near`), and
# waits for the hero's next turn when beyond the day's points (`days`: the spec's "a row left
# unfinished goes on in Red's day 3"; never a second click on a red path, TRAPS.md). E8-11's
# battle is played by `attack` (two human players: auto combat does not play it), E8-12's by
# `defender retreat`.

spec = "experiments/specs/E08-batch-8b.toml"
players = ["Red", "Blue"]
difficulty = "easy"

[[require]]
what = "an artifact chest among E8-6's thirty"
each = { from = [24, 4], to = [34, 12], step = [2, 2] }
holds = "artifact"

[[require]]
what = "an artifact chest among E8-8's forty"
each = { from = [44, 24], to = [58, 32], step = [2, 2] }
holds = "artifact"

# --- The start (save 1): the pickups' words ----------------------------------------------------

[[step]]
encounter = "E8-8"
hero = "E8-8"
each = { from = [24, 24], to = [38, 32], step = [2, 2] }
record = { "row:Flotsam (tile)" = ["text:({x}, {y})", ["word:{x},{y}", "object:{x},{y}"]] }

[[step]]
encounter = "E8-8"
hero = "E8-8"
each = { from = [44, 24], to = [58, 32], step = [2, 2] }
record = { "row:Sea Chest (tile)" = ["text:({x}, {y})", ["word:{x},{y}", "object:{x},{y}"]] }

[[step]]
encounter = "E8-8"
hero = "E8-8"
each = { from = [24, 40], to = [38, 48], step = [2, 2] }
record = { "row:Survivor (tile)" = ["text:({x}, {y})", ["word:{x},{y}", "object:{x},{y}"]] }

[[step]]
encounter = "E8-6"
hero = "E8-6"
each = { from = [24, 4], to = [34, 12], step = [2, 2] }
note = { "({x}, {y}) at the start" = ["word:{x},{y}", "object:{x},{y}"] }

[[step]]
encounter = "E8-6"
hero = "E8-6"
each = { from = [24, 16], to = [30, 16], step = [3, 1] }
note = { "({x}, {y}) at the start" = ["word:{x},{y}", "object:{x},{y}"] }

# --- Day 1, Red: six heroes board their boats --------------------------------------------------

[[step]]
encounter = "E8-6"
hero = "E8-6"
walk = [20, 10]
note = { "worn at the start (the starting bonus)" = "hero:equipment", "backpack count at the start" = "hero:backpack_count", "E8-6's boarding (arrived, tile, points, status, boat)" = ["arrived", "hero:tile", "hero:points", "hero:status", "boat"] }

[[step]]
encounter = "E8-8"
hero = "E8-8"
walk = [42, 36]
note = { "worn at the start (the starting bonus)" = "hero:equipment", "backpack at the start" = "hero:backpack", "E8-8's boarding (arrived, tile, points, status, boat)" = ["arrived", "hero:tile", "hero:points", "hero:status", "boat"] }

[[step]]
encounter = "E8-9"
hero = "E8-9"
walk = [20, 57]
note = { "worn at the start (the starting bonus)" = "hero:equipment", "backpack at the start" = "hero:backpack", "E8-9's boarding (arrived, tile, points, status, boat)" = ["arrived", "hero:tile", "hero:points", "hero:status", "boat"] }

[[step]]
encounter = "E8-12"
hero = "E8-12"
walk = [61, 10]
note = { "worn at the start (the starting bonus)" = "hero:equipment", "E8-12's boarding (arrived, tile, points, status, boat)" = ["arrived", "hero:tile", "hero:points", "hero:status", "boat"] }

[[step]]
encounter = "E8-13"
hero = "E8-13"
walk = [5, 63]
note = { "worn at the start (the starting bonus)" = "hero:equipment", "E8-13's boarding (arrived, tile, points, status, boat)" = ["arrived", "hero:tile", "hero:points", "hero:status", "boat"] }

[[step]]
encounter = "E8-14"
hero = "E8-14"
walk = [5, 68]
note = { "worn at the start (the starting bonus)" = "hero:equipment", "E8-14's boarding (arrived, tile, points, status, boat)" = ["arrived", "hero:tile", "hero:points", "hero:status", "boat"] }

[[step]]
encounter = "E8-11"
hero = "E8-11"
note = { "worn at the start (the starting bonus)" = "hero:equipment" }

# Red's day 1 ends: Blue's day 1.
[[step]]
end_turn = true

# --- Day 1, Blue: E8-11b and E8-12b board -------------------------------------------------------

[[step]]
encounter = "E8-11"
hero = "E8-11b"
walk = [61, 4]
note = { "E8-11b's boarding (arrived, tile, status, boat)" = ["arrived", "hero:tile", "hero:status", "boat"] }

[[step]]
encounter = "E8-12"
hero = "E8-12b"
walk = [62, 10]
note = { "E8-12b's boarding (arrived, tile, status, boat)" = ["arrived", "hero:tile", "hero:status", "boat"] }

# Blue's day 1 ends: Red's day 2.
[[step]]
end_turn = true

# --- Day 2, Red: the turn-start reads, before anything moves ----------------------------------

[[step]]
encounter = "E8-6"
hero = "E8-6"
record = { "E8-6's movement points at day 2's start" = "hero:points" }
note = { "E8-6 at day 2's start (day's maximum, status)" = ["hero:day_points", "hero:status"] }

[[step]]
encounter = "E8-8"
hero = "E8-8"
note = { "E8-8 at day 2's start (points, day's maximum)" = ["hero:points", "hero:day_points"] }

[[step]]
encounter = "E8-9"
hero = "E8-9"
note = { "E8-9 at day 2's start (points, day's maximum)" = ["hero:points", "hero:day_points"] }

[[step]]
encounter = "E8-14"
hero = "E8-14"
record = { "gold at day 2's start" = "resource:gold" }
note = { "E8-14 at day 2's start (points, day's maximum)" = ["hero:points", "hero:day_points"] }

# --- Day 2, Red: E8-6 visits every artifact chest, one of kind 1 and one of kind 0, then the
# three Survivors -----------------------------------------------------------------------------

[[step]]
encounter = "E8-6"
hero = "E8-6"
each = { from = [24, 4], to = [34, 12], step = [2, 2] }
walk = "each"
select = { holds = "artifact", then = ["Sea Chest: 1500 gold", "Sea Chest: nothing"] }
near = true
days = 1
expect = { dialogs = true }
record = { "row:object (tile)" = [["text:({x}, {y})", "before:object:{x},{y}"], "before:word:{x},{y}", ["messages", "message_pictures"], ["before:hero:backpack_count", "hero:backpack_count"], ["before:resource:gold", "resource:gold"], "object:{x},{y}"] }

[[step]]
encounter = "E8-6"
hero = "E8-6"
each = { from = [24, 16], to = [30, 16], step = [3, 1] }
walk = "each"
select = { is = "Survivor" }
near = true
days = 1
expect = { dialogs = true }
record = { "row:object (tile)" = [["text:({x}, {y})", "before:object:{x},{y}"], "before:word:{x},{y}", ["messages", "message_pictures"], ["before:hero:backpack_count", "hero:backpack_count"], ["before:resource:gold", "resource:gold"], "object:{x},{y}"] }
note = { "E8-6 after its visits (tile, points, backpack)" = ["hero:tile", "hero:points", "hero:backpack_count"] }

# --- Day 2, Red: E8-8 visits the nearest Flotsam of word 3, the nearest Survivor and the nearest
# artifact chest -------------------------------------------------------------------------------

[[step]]

# --- Day 2, Red: E8-13, a click past the guards, then onto a guarded tile -----------------------

[[step]]
encounter = "E8-13"
hero = "E8-13"
walk = [10, 63]
record = { "the click on (10, 63): the marks (or none); E8-13's tile after" = ["marks", "path_tiles", "hero:tile"] }
note = { "(10, 63) explored before the click; E8-13's points before" = ["before:explored:10,63", "before:hero:points"], "the guards before (8, 63)" = "before:monster:8,63" }

[[step]]
encounter = "E8-13"
hero = "E8-13"
walk = [7, 63]
battle = "auto"
answer = "no"
expect = { battle = true }
record = { "the click on (7, 63): the marks; the tile where the battle starts" = ["marks", "path_tiles", "battle:tile"], "the opening: terrain, special field, ship flag, blocked hexes" = "opening:field", "after: E8-13's tile and status flags" = ["hero:tile", "hero:status", "drawn", "boat"] }
note = { "the battle (winner; stacks at the start)" = ["winner", "stacks:start"], "questions" = "questions", "messages" = "messages" }

# --- Day 2, Red: E8-14, the two events on the channel -------------------------------------------

[[step]]
encounter = "E8-14"
hero = "E8-14"
walk = [10, 68]
expect = { dialogs = true }
record = { "the click on (10, 68): the marks; tile, movement points and gold after; the message" = ["marks", "path_tiles", "hero:tile", "hero:points", "resource:gold", "messages", "message_pictures"] }
note = { "gold and points right before the click" = ["before:resource:gold", "before:hero:points"], "(8, 68) after (what stands there)" = "object:8,68" }

[[step]]
encounter = "E8-14"
hero = "E8-14"
walk = [13, 68]
battle = "auto"
answer = "no"
expect = { battle = true, dialogs = true }
record = { "the click on (13, 68): the marks; the message; the tile where the battle starts" = ["marks", "path_tiles", "messages", "battle:tile"], "the opening: terrain, special field, ship flag, blocked hexes" = "opening:field", "after: E8-14's tile and status flags" = ["hero:tile", "hero:status", "drawn", "boat"] }
note = { "the battle (winner; stacks at the start)" = ["winner", "stacks:start"], "questions" = "questions" }

# --- Day 2, Red: E8-11 attacks E8-11b's boat from the shore -------------------------------------

[[step]]
encounter = "E8-11"
hero = "E8-11"
record = { "the boat's record before (tile, in use, owner, captain, aboard)" = "boat[E8-11b]" }
note = { "E8-11b before (tile, status)" = ["hero[E8-11b]:tile", "hero[E8-11b]:status"], "boats in use before" = "boats:used" }

[[step]]
encounter = "E8-11"
hero = "E8-11"
walk = [61, 4]
# Two human players' battle: auto combat does not play it in hot seat (h3adv.fight), so every
# stack attacks the other side's nearest one, as a player would (`attack`).
battle = "attack"
expect = { battle = true }
record = { "the marks of the click on E8-11b" = ["marks", "mark", "path_tiles"], "the opening: terrain, special field, ship flag, blocked hexes" = "opening:field", "after: E8-11's tile and status flags; the boat's record; what stands on (61, 4)" = ["hero:tile", "hero:status", "boat_record:61,4", "object:61,4"] }
note = { "the battle (winner; stacks at the start)" = ["winner", "stacks:start"], "boats in use after" = "boats:used", "messages" = "messages" }

# --- Day 2, Red: E8-12 attacks E8-12b's boat from its own; Blue retreats ----------------------

[[step]]
encounter = "E8-12"
hero = "E8-12"
walk = [62, 10]
battle = "defender retreat"
expect = { battle = true }
record = { "the marks of the click on E8-12b" = ["marks", "mark", "path_tiles"], "the opening: terrain, special field, ship flag, blocked hexes (all of them)" = "opening:field", "after: E8-12's tile and status flags" = ["hero:tile", "hero:status", "drawn"], "after: Red's boat's record; Blue's boat's record; what stands on (62, 10)" = ["boat", "boat_record:62,10", "object:62,10"] }
note = { "the boats' records before (Red's, Blue's)" = ["before:boat[E8-12]", "before:boat[E8-12b]"], "the battle (winner, retreated; stacks at the start, at the end)" = ["winner", "retreated", "stacks:start", "stacks:end"], "boats in use after" = "boats:used", "messages" = "messages" }

# E09 batch TWN-3, part a, played by the capture harness (E09 T23; h3adv.py batch): the procedure
# of experiments/specs/E09-batch-3a.toml as steps, on Easy, hot seat, Red and Blue human, the
# starting bonus Gold. Red's day 1: the reads, the dwellings flagged, G1's visitor placed, D1's
# town screen; then eight weeks, each a pair of end turns (Red's, Blue's) whose first writes the
# date to the week's last day (`date = [month, week, day]`), the reads on Red's new turn.
#
# The draws (README, "Forced rolls"; xdd.dll's sites, E09 T23): the recipe's `rolls` make every
# week normal (`week_chance` 2: a creature's week needs 1); a step's `roll` forces the next month's
# kind (`month_kind` 6, a creature's, with `month_creature` 1, the Griffin; `month_kind` 10, the
# Plague). The neutral towns' garrison draws and the Portal's are logged: `draws:<prefix>` those of
# the step, `turn_draws:<prefix>` those of the last end turn (a later step's record). The reads: a
# town by its entrance (`town:x,y:counts`, `:garrison`, `:portal`, `:dwellings`, `:visitor`),
# `kinds` (the week's and month's kinds as the game holds them), `date`, a dwelling's owner.

spec = "experiments/specs/E09-batch-3a.toml"
players = ["Red", "Blue"]
difficulty = "easy"
gold = true
rolls = { week_chance = 2 }

# --- Red's day 1: the reads before any hero moves -------------------------------------------

[[step]]
encounter = "TWN-3-1"
hero = "TWN-3-1"
[step.record]
"day 1: K1's and K2's available creatures" = ["text:K1: ", "town:7,7:counts", "text:K2: ", "town:15,7:counts"]
[step.note]
"the game's version" = "map_kind"
"the kinds at the start" = "kinds"

[[step]]
encounter = "TWN-3-2"
hero = "TWN-3-1"
[step.record]
"day 1: G1's available creatures; its external dwellings' counts; its standing and every-built sets" = ["town:23,7:counts", "text:dwellings: ", "town:23,7:dwellings", "text:standing: ", "town:23,7:built", "text:every: ", "town:23,7:every"]

[[step]]
encounter = "TWN-3-3"
hero = "TWN-3-1"
[step.record]
"day 1: O1's and N1's available creatures; N1's garrison" = ["text:O1: ", "town:39,7:counts", "text:N1: ", "town:47,7:counts", "text:N1's garrison: ", "town:47,7:garrison"]

[[step]]
encounter = "TWN-3-4"
hero = "TWN-3-1"
[step.record]
"row:week (the date)" = ["date", "town:7,15:garrison", "town:15,15:garrison", "town:23,15:garrison", "town:31,15:garrison", "town:39,15:garrison", "town:47,15:garrison", "town:7,15:counts"]

[[step]]
encounter = "TWN-3-5"
hero = "TWN-3-1"
[step.record]
"day 1: D1's Portal" = "town:31,7:portal"

# --- the flags: GH1 by TWN-3-2s (the Statue of Legion), GH2 by TWN-3-2t, the Harpy Loft by TWN-3-5 ------

[[step]]
encounter = "TWN-3-2"
hero = "TWN-3-2s"
walk = [10, 30]
answer = { hire = "no" }
expect = { battle = false }
[step.note]
"GH1's visit: the questions" = "questions"

[[step]]
encounter = "TWN-3-2"
hero = "TWN-3-2t"
walk = [16, 30]
answer = { hire = "no" }
expect = { battle = false }
[step.record]
"after the flags: G1's external dwellings' counts; GH1's and GH2's owners" = ["town:23,7:dwellings", "text:GH1: ", "dwelling:10,30:owner", "text:GH2: ", "dwelling:16,30:owner"]
[step.note]
"GH2's visit: the questions" = "questions"

[[step]]
encounter = "TWN-3-5"
hero = "TWN-3-5"
walk = [22, 30]
answer = { hire = "no" }
expect = { battle = false }
[step.record]
"after the three flags: D1's Portal; the Harpy Loft's owner" = ["town:31,7:portal", "text:the Harpy Loft: ", "dwelling:22,30:owner"]
[step.note]
"the Harpy Loft's visit: the questions" = "questions"
"the Harpy Loft's record" = "dwelling:22,30"

# --- G1's visitor (Legs of Legion) and D1's town screen -------------------------------------------


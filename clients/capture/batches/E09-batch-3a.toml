[step.record]
"D1's visit: the Portal before; after; the Portal's draws" = ["text:before: ", "before:town:31,7:portal", "text:after: ", "town:31,7:portal", "text:draws: ", "draws:portal"]
[step.note]
"D1's visit: a town screen; how it closed" = ["town_screen", "town_screen_closed"]
"D1's visit: screens not known by their vtable" = "unknown_screens"


# E08 batch E7a played by the capture harness (E08 T57; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-7a.toml as steps, on Easy, with T57's reads (README, "Rewards on the
# map"). Hot seat, Red and Blue human. The rows that read the new game's draws come first (E7-3,
# E7-8, E7-9, and the words of E7-5's chests and E7-10's Corpses, Wagons and Tombs); then day 1,
# Red: E7-1, E7-2, E7-4, E7-6, E7-5; Blue: E7-10, E7-11. A new game without an artifact among
# E7-5's chests, E7-10's Corpses or its Wagons is started again (`require`, the spec's restart
# rule). E7-5 and E7-10 visit only the objects whose word holds an artifact, nearest first, then
# the nearest controls without one (`select`); a target not yet explored is approached first over
# open tiles (`near`: the original finds no path onto an unexplored tile), and a visit beyond the
# day's points waits for the hero's next turn (`days`), as the spec allows.

spec = "experiments/specs/E08-batch-7a.toml"
players = ["Red", "Blue"]
difficulty = "easy"

[[require]]
what = "an artifact chest among E7-5's forty"
each = { from = [26, 4], to = [44, 10], step = [2, 2] }
holds = "artifact"

[[require]]
what = "an artifact Corpse among E7-10's twenty"
each = { from = [26, 16], to = [44, 18], step = [2, 2] }
holds = "artifact"

[[require]]
what = "an artifact Wagon among E7-10's ten"
each = { from = [26, 22], to = [44, 22], step = [2, 1] }
holds = "artifact"

# --- At the start: the new game's draws ------------------------------------------------------------

[[step]]
encounter = "E7-3"
hero = "E7-3"
each = { from = [4, 40], to = [13, 43] }
record = { "({x}, {y}) | the word (hex)" = "word:{x},{y}", "({x}, {y}) | the artifact" = "object:{x},{y}" }

[[step]]
encounter = "E7-8"
hero = "E7-8"
each = { from = [4, 48], to = [32, 48], step = [2, 1] }
record = { "({x}, {y}) | the word (hex)" = "word:{x},{y}", "({x}, {y}) | the spell" = "object:{x},{y}" }

[[step]]
encounter = "E7-9"
hero = "E7-9"
each = { from = [40, 40], to = [65, 56], step = [5, 4] }
record = { "({x}, {y})" = "object:{x},{y}" }

[[step]]
encounter = "E7-9"
hero = "E7-9"
record = { "how many offer Necromancy" = "offering:Necromancy" }

[[step]]
encounter = "E7-5"
hero = "E7-5"
each = { from = [26, 4], to = [44, 10], step = [2, 2] }
record = { "({x}, {y}) | its word (hex)" = ["word:{x},{y}", "object:{x},{y}"] }

# E7-10's objects are Blue's hero's to visit; their words are read now, at the start (a Red hero
# selected only for the step).
[[step]]
encounter = "E7-10"
hero = "E7-3"
each = { from = [26, 16], to = [44, 18], step = [2, 2] }
record = { "({x}, {y}) | its word before" = ["word:{x},{y}", "object:{x},{y}"] }

[[step]]
encounter = "E7-10"
hero = "E7-3"
each = { from = [26, 22], to = [44, 22], step = [2, 1] }
record = { "({x}, {y}) | its word before" = ["word:{x},{y}", "object:{x},{y}"] }

[[step]]
encounter = "E7-10"
hero = "E7-3"
each = { from = [48, 16], to = [51, 16], step = [3, 1] }
record = { "({x}, {y}) | its word before" = ["word:{x},{y}", "object:{x},{y}"] }

# --- Day 1, Red: E7-1, the guarded axe on (7, 4): No, then Yes ---------------------------------------

[[step]]
encounter = "E7-1"
hero = "E7-1"
walk = [7, 4]
expect = { dialogs = true }
answer = "no"
battle = "auto"
record = { "after the step (the question's text, or: the battle at once)" = ["questions", "battle"], "after No: the axe on (7, 4) (yes or no); E7-1's artifacts" = ["object:7,4", "hero:positions", "hero:backpack"] }

[[step]]
encounter = "E7-1"
hero = "E7-1"
walk = [7, 4]
expect = { dialogs = true }
answer = "yes"
battle = "auto"
record = { "the battle's result; E7-1's army after" = ["questions", "battle", "winner", "hero:army"], "worn positions after (position: artifact)" = "hero:positions", "backpack after" = "hero:backpack", "the axe on (7, 4) after (yes or no)" = "object:7,4" }
note = { "messages" = "messages" }

# --- E7-2: the axe on (7, 8), then the scroll on (10, 8) -----------------------------------------------

[[step]]
encounter = "E7-2"
hero = "E7-2"
walk = [7, 8]
expect = { dialogs = true }
record = { "the axe's message (first words)" = ["messages", "message_pictures"], "worn positions after the axe (position: artifact)" = "hero:positions", "backpack after the axe" = "hero:backpack" }

[[step]]
encounter = "E7-2"
hero = "E7-2"
walk = [10, 8]
expect = { dialogs = true }
record = { "the scroll's message (first words)" = ["messages", "message_pictures"], "worn positions after the scroll" = "hero:positions", "backpack after the scroll" = "hero:backpack", "learned spells after the scroll" = "hero:spells" }

# --- E7-4: six chests (7, 12) to (17, 12), the experience taken; the Learning Stone (18, 12) ----------

[[step]]
encounter = "E7-4"
hero = "E7-4"
each = { from = [7, 12], to = [17, 12], step = [2, 1] }
record = { "({x}, {y}) | its word (hex)" = ["word:{x},{y}", "object:{x},{y}"] }

[[step]]
encounter = "E7-4"
hero = "E7-4"
each = { from = [7, 12], to = [17, 12], step = [2, 1] }
walk = "each"
expect = { dialogs = true }
choice = "right"
level_up = "not Learning"
days = 2
near = true
record = { "({x}, {y}) | gold shown" = "choice:left", "({x}, {y}) | experience shown" = "choice:right", "({x}, {y}) | experience before" = "before:hero:experience", "({x}, {y}) | experience after" = "hero:experience", "+level-ups (level: the two offers, the one taken)" = "level_up_dialogs" }
note = { "messages" = "messages" }

[[step]]
encounter = "E7-4"
hero = "E7-4"
walk = [18, 12]
expect = { dialogs = true }
level_up = "not Learning"
days = 2
near = true
record = { "the Learning Stone: experience before, after, its message" = ["before:hero:experience", "hero:experience", "messages"], "+level-ups (level: the two offers, the one taken)" = "level_up_dialogs", "secondary skills at the end" = "hero:skills" }

# --- E7-6: the Pikemen east of (4, 16) with a treasure, a full backpack -------------------------------

[[step]]
encounter = "E7-6"
hero = "E7-6"
walk = [5, 16]
expect = { dialogs = true }
battle = "auto"
record = { "before: backpack count, worn positions, gold" = ["before:hero:backpack_count", "before:hero:positions", "before:resource:gold"], "the messages after the battle (first words, in order)" = ["messages", "message_pictures"], "after: backpack count, worn positions, gold" = ["hero:backpack_count", "hero:positions", "resource:gold"] }
note = { "battle" = "winner" }

# --- E7-5: the artifact chests, then three gold chests; the gold taken --------------------------------

[[step]]
encounter = "E7-5"
hero = "E7-5"
each = { from = [26, 4], to = [44, 10], step = [2, 2] }
select = { holds = "artifact", controls = 3 }
walk = "each"
expect = { dialogs = true }
choice = "left"
days = 3
near = true
record = { "({x}, {y}) | what is shown" = ["choice", "messages"], "({x}, {y}) | backpack before / after" = ["before:hero:backpack_count", "hero:backpack_count"], "({x}, {y}) | gold before / after" = ["before:resource:gold", "resource:gold"] }

[[step]]
end_turn = true

# --- Blue: E7-10, the artifact Corpses and Wagons and a control each, then both Tombs -----------------

[[step]]
encounter = "E7-10"
hero = "E7-10"
each = { from = [26, 16], to = [44, 18], step = [2, 2] }
select = { holds = "artifact", controls = 1 }
walk = "each"
expect = { dialogs = true }
days = 3
near = true
record = { "({x}, {y}) | message" = ["messages", "message_pictures"], "({x}, {y}) | treasury before / after" = ["before:treasury", "treasury"], "({x}, {y}) | backpack before / after" = ["before:hero:backpack_count", "hero:backpack_count"], "({x}, {y}) | its word after" = ["word:{x},{y}", "object:{x},{y}"] }

[[step]]
encounter = "E7-10"
hero = "E7-10"
each = { from = [26, 22], to = [44, 22], step = [2, 1] }
select = { holds = "artifact", controls = 1 }
walk = "each"
expect = { dialogs = true }
days = 3
near = true
record = { "({x}, {y}) | message" = ["messages", "message_pictures"], "({x}, {y}) | treasury before / after" = ["before:treasury", "treasury"], "({x}, {y}) | backpack before / after" = ["before:hero:backpack_count", "hero:backpack_count"], "({x}, {y}) | its word after" = ["word:{x},{y}", "object:{x},{y}"] }

[[step]]
encounter = "E7-10"
hero = "E7-10"
each = { from = [48, 16], to = [51, 16], step = [3, 1] }
walk = "each"
expect = { dialogs = true }
answer = "yes"
days = 3
near = true
record = { "({x}, {y}) | the question" = "questions", "({x}, {y}) | messages" = ["messages", "message_pictures"], "({x}, {y}) | morale bonus before / after" = ["before:hero:morale_bonus", "hero:morale_bonus"], "({x}, {y}) | backpack before / after" = ["before:hero:backpack_count", "hero:backpack_count"], "({x}, {y}) | its word after" = ["word:{x},{y}", "object:{x},{y}"] }

# --- E7-11: two Tombs west, then the Pikemen east of (24, 28) ------------------------------------------

[[step]]
encounter = "E7-11"
hero = "E7-11"
record = { "before: morale bonus, status flags (hex)" = ["hero:morale_bonus", "hero:status"] }

[[step]]
encounter = "E7-11"
hero = "E7-11"
walk = [21, 28]
expect = { dialogs = true }
answer = "yes"
record = { "first Tomb: messages; morale bonus, status flags after" = ["questions", "messages", "hero:morale_bonus", "hero:status"] }

[[step]]
encounter = "E7-11"
hero = "E7-11"
walk = [21, 31]
expect = { dialogs = true }
answer = "yes"
record = { "second Tomb: messages; morale bonus, status flags after" = ["questions", "messages", "hero:morale_bonus", "hero:status"] }

[[step]]
encounter = "E7-11"
hero = "E7-11"
walk = [25, 28]
expect = { dialogs = true }
battle = "auto"
record = { "the opening: each of E7-11's stacks' morale" = "morale:start:attacker", "after the battle: morale bonus, status flags" = ["hero:morale_bonus", "hero:status"] }
note = { "battle" = "winner", "the opponent's morale at the opening" = "morale:start:defender" }

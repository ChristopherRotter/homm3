# E08 batch E4a played by the capture harness (E08 T32b2, `cross-lane`; h3adv.py batch): the
# procedure of experiments/specs/E08-batch-4a.toml as steps, on Easy. Hot seat, Red and Blue
# human. The encounters' tiles are h3-experiment's grid (size 36: heroes at (3 + 6 (i mod 6),
# 3 + 5 (i div 6)) by the encounter's index i, each Pikeman or Swordsman one column east).
# Day 1, Red: the five E4-1 heroes are Blue's and never move: each is read by name (`hero[..]`)
# while Red's E4-2a is selected, before anything moves; then E4-2a to E4-4b fight in the spec's
# order, the start read before each walk (`before:`), each level-up dialog recorded. Blue: E4-5a
# to E4-5c. `note` puts a hero's artifacts besides the war machines (`equipment`: every hero
# wears a Catapult) under "anything odd" when it wears any (the starting bonus's trap: an
# artifact's primary skills show in the hero's); the scorer
# (crates/h3-map/examples/e4_score.rs) predicts the rest from each seed byte.

spec = "experiments/specs/E08-batch-4a.toml"
players = ["Red", "Blue"]
difficulty = "easy"

# --- Day 1, Red: E4-1's levels at load (Blue's heroes, read by name) ---------------------------


[[step.cast.targets]]
at = [17, 10]
[step.record]
"(13, 10) seen, free | the cursor" = "cast:hover:1"
"(13, 12) the seen tree | the cursor" = "cast:hover:2"
"(17, 10) hidden, free | the cursor" = "cast:hover:3"
"(17, 12) the hidden tree | the cursor" = "cast:hover:4"
"the door onto (17, 10): messages; tile; points; spell points; the day's doors" = ["cast:click:2", "text:dialog: ", "cast:dialog", "text:messages: ", "messages", "text:tile: ", "hero:tile", "text:points: ", "hero:points", "text:spell points: ", "hero:spell_points", "text:doors: ", "hero:doors"]
"explored after: (17, 5); (22, 10); (17, 15); (16, 14); (21, 13); (22, 13)" = ["explored:17,5", "explored:22,10", "explored:17,15", "explored:16,14", "explored:21,13", "explored:22,13"]

# The hidden tree's click closed the dialog (the hero still on (10, 10)): the door cast again.

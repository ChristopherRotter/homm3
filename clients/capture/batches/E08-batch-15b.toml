# E08 batch E15b played by the capture harness (E08 T139a; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-15b.toml as steps, on Easy, the starting bonus gold, Red and Blue
# human in hot seat; day 1, Red's turn only, in the spec's order: E15-14 (its one click first:
# nothing moves before it), E15-13, E15-8 with E15-16, E15-5, E15-6, E15-7, E15-15. Each row's
# reads before a cast are a step of their own (a tile's `explored:` is read live, never `before:`).
#
# A cast (README, "Casts on the adventure map"): `cast = "<spell>"` or `{ spell, hover, target,
# targets, cancel, button }` opens the selected hero's spell book by the key C (`button = true`:
# by the panel's cast button, its state kept: E15-15), clicks the spell's place found by its name
# among the page's places (`cast:listed` the page), keeps every message in order (`messages`)
# and plays a target dialog (Dimension Door's): the mouse over each `hover` tile (`cast:hover:<n>`:
# the cursor's type and frame, the tile the dialog picks, its accept flag), a left click on each
# `targets` entry while the dialog shows (`cast:click:<n>`: what it did, the messages after it;
# an entry's `record` read right after its click), the dialog cancelled by Escape if still open
# (`cast:cancel`). `[x, y, dx, dy]` or `offset = [dx, dy]` puts the pointer dx, dy pixels from
# the drawn tile's top-left corner (E15-16: (17, 18)'s lower 8 rows pick (17, 19)). The day's
# marks: `hero:doors` (+0x10D), `hero:fly` (+0x112), `hero:water_walk` (+0x116; -1 not cast).
# A path's tiles in order: `path_order` (chained from the hero's tile). E15-14's path is not
# cancelled: the next step selects E15-13 (its path not shown) and E15-14 never moves again.

spec = "experiments/specs/E08-batch-15b.toml"
players = ["Red", "Blue"]
difficulty = "easy"
gold = true

# --- Day 1, Red: E15-14 (Water Walk facing hidden water; one click, first) ------------------------------

[[step]]
encounter = "E15-14"
hero = "E15-14"
record = { "explored before: (9, 27); (10, 27); (13, 27); (14, 27)" = ["explored:9,27", "explored:10,27", "explored:13,27", "explored:14,27"], "before the cast: points; spell points" = ["text:points: ", "hero:points", "text:spell points: ", "hero:spell_points"] }
note = { "the date at the start" = "date", "the game's version" = "map_kind", "the difficulty" = "difficulty", "E15-14 worn at the start (the starting bonus)" = "hero:equipment" }

[[step]]
encounter = "E15-14"
hero = "E15-14"
cast = "Water Walk"
record = { "the cast: messages; spell points; the Water Walk level" = ["text:messages: ", "messages", "text:spell points: ", "cast:spell_points", "text:level before: ", "before:hero:water_walk", "text:after: ", "hero:water_walk", "text:the book: ", "cast:book", "text:listed: ", "cast:listed", "text:points: ", "hero:points"] }

[[step]]
encounter = "E15-14"
hero = "E15-14"
walk = [14, 27]
once = true
record = { "the click on (14, 27): the target's mark; the marks" = ["text:mark: ", "mark", "text:marks: ", "marks", "text:tiles: ", "path_order", "text:the cursor over (14, 27): ", "cursor"], "E15-14's tile after" = ["hero:tile", "text:points: ", "hero:points"] }


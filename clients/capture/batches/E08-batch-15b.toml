skip_quietly = true
cast = { spell = "Dimension Door", target = [17, 10] }
record = { "the door onto (17, 10): messages; tile; points; spell points; the day's doors" = ["text:cast again: ", "cast:book", "cast:click:1", "text:messages: ", "messages", "text:tile: ", "hero:tile", "text:points: ", "hero:points", "text:spell points: ", "hero:spell_points", "text:doors: ", "hero:doors"], "explored after: (17, 5); (22, 10); (17, 15); (16, 14); (21, 13); (22, 13)" = ["explored:17,5", "explored:22,10", "explored:17,15", "explored:16,14", "explored:21,13", "explored:22,13"] }

# E15-16: the pointer at (17, 10)'s column, y 548 (the drawn row (17, 18)'s lower 8 pixels: the cell
# row 17, dy +9).
[[step]]

# E08 batch E11a played by the capture harness (E08 T100a; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-11a.toml as steps, on Easy, the starting bonus gold, with T100a's
# reads (README, "Teleporters and Replay Opponent Turn"). Hot seat, Red and Blue human. In the
# spec's order: day 1, Red: E11-1 (rows E11-1 to E11-3), E11-4 (E11-5, then E11-4), E11-6, E11-9
# (then E11-8), E11-19, E11-7's and E11-18's first reads; Blue: E11-7b's step, E11-18's, the six
# boardings; day 2, Red: E11-18's reads and replay, E11-7's step and battle; Blue: the six steps
# onto W1 (E11-10 to E11-13), E11-18's hero's legs.
#
# A row's branch after a jump is a step `only_if = { at = [x, y] }` (played only while the hero
# stands there; a skipped step leaves the field another step filled). A walk that may show no
# path clicks again only if it showed one (`again_if = { marks = "any" }`). The explored bits are
# Red's (`:red`), read by tile boxes (`explored:x0,y0..x1,y1`); `at_opening` reads them as E11-7's
# battle opens. A message's text is its record (`ADVEVENT:70`), never the text (ADR-0009).

spec = "experiments/specs/E08-batch-11a.toml"
players = ["Red", "Blue"]
difficulty = "easy"
gold = true


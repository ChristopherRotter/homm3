# E08 batch 2 played by the capture harness (E17 M2 T6, *provisional*; h3adv.py batch): the
# procedure of experiments/specs/E08-batch-2.toml as steps. Hot seat, Red and Blue human; the
# scouts never move. A step selects its hero, clicks `walk`'s tile twice (the first click shows
# the path, read from the game's memory) and records what the template asks.

spec = "experiments/specs/E08-batch-2.toml"
players = ["Red", "Blue"]

# --- Day 1, Red: D-3 ------------------------------------------------------------------------------

[[step]]
encounter = "D3a"
hero = "D3a"
walk = [19, 6]
expect = { marks = 13, path = "green" }
record = { "did D3a stop on the road's first tile (yes/no)" = "arrived", "movement points left there" = "points" }

[[step]]
encounter = "D3a"
hero = "D3a"
walk = [20, 6]
record = { "the next road tile's mark (green/red)" = "mark", "did the hero step onto it (yes/no)" = "moved", "movement points left after that step (if it stepped)" = "points_if_moved" }

[[step]]
encounter = "D3b"
hero = "D3b"
walk = [19, 10]
expect = { marks = 13, path = "green" }
record = { "did D3b stop on the road's first tile (yes/no)" = "arrived", "movement points left there" = "points" }

[[step]]
encounter = "D3b"
hero = "D3b"
walk = [20, 10]
record = { "the next road tile's mark (green/red)" = "mark", "did the hero step onto it (yes/no)" = "moved" }

[[step]]
encounter = "D3c"
hero = "D3c"
walk = [19, 14]
expect = { marks = 13, path = "green" }
record = { "did D3c stop on the snow tile (yes/no)" = "arrived", "movement points left there" = "points" }

[[step]]
encounter = "D3d"
hero = "D3d"
walk = [19, 18]
expect = { marks = 13, path = "green" }
record = { "did D3d stop on the snow tile (yes/no)" = "arrived", "movement points left there" = "points" }

[[step]]
end_turn = true


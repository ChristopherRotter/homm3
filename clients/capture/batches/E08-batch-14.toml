actions = [
    { click = ["give:wood", "want:gold"], record = { "wood → gold: the rate; the most; Red's treasury after 2" = ["text:the rate: ", "market:rate", "text:the most: ", "market:most", "text:counts: ", "market:slider"] } },
    { amount = 2 },
    { click = ["trade"], record = { "+wood → gold: the rate; the most; Red's treasury after 2" = ["text:the trade's change: ", "gain", "text:treasury after: ", "treasury"] } },
    { click = ["give:gold", "want:wood"], record = { "gold → wood: the rate; the most; Red's treasury after 1" = ["text:the rate: ", "market:rate", "text:the most: ", "market:most", "text:counts: ", "market:slider"] } },
    { amount = 1 },
    { click = ["trade"], record = { "+gold → wood: the rate; the most; Red's treasury after 1" = ["text:the trade's change: ", "gain", "text:treasury after: ", "treasury"] } },
    { click = ["give:mercury", "want:gems"], record = { "mercury → gems: the rate; the most; Red's treasury after 1" = ["text:the rate: ", "market:rate", "text:the most: ", "market:most", "text:counts: ", "market:slider"] } },
    { amount = 1 },
    { click = ["trade"], record = { "+mercury → gems: the rate; the most; Red's treasury after 1" = ["text:the trade's change: ", "gain", "text:treasury after: ", "treasury"] } },
]
record = { "P1's window: its screen; E14-5's tile; points" = ["text:the path: ", "path_tiles", "text:the window: ", "market:opening:screen", "text:kind: ", "market:opening:kind", "text:count: ", "market:opening:count", "text:buttons: ", "market:opening:buttons", "text:at the window: ", "market:at", "text:in order: ", "order"], "after closing P1: E14-5's tile; points; Space: what opens; the tile" = ["text:tile: ", "hero:tile", "text:points: ", "hero:points"] }

[[step]]
encounter = "E14-5"
hero = "E14-5"
key = "space"
record = { "+after closing P1: E14-5's tile; points; Space: what opens; the tile" = ["text:Space: ", "key", "text:in order: ", "order", "text:tile after: ", "hero:tile"] }

[[step]]
encounter = "E14-5"
hero = "E14-5"
walk = [26, 10]
actions = [
    { record = { "before the transfer: Red's treasury; Blue's treasury; the recipients offered" = ["text:red: ", "treasury:red", "text:blue: ", "treasury:blue"] } },
    { click = ["transfer"], record = { "+before the transfer: Red's treasury; Blue's treasury; the recipients offered" = ["text:the screen: ", "market:screen", "text:the recipients offered: ", "market:recipients", "text:buttons: ", "market:buttons"] } },
    { click = ["give:ore", "player:blue"], record = { "+before the transfer: Red's treasury; Blue's treasury; the recipients offered" = ["text:the pair: ", "market:pair", "text:the rate: ", "market:rate", "text:the most: ", "market:most"] } },
    { amount = 5 },
    { click = ["trade"], record = { "after the transfer: Red's treasury; Blue's treasury" = ["text:red: ", "treasury:red", "text:red's change: ", "gain:red", "text:blue: ", "treasury:blue", "text:blue's change: ", "gain:blue"] } },
]
record = { "P2: the path's marks; at the window its screen; E14-5's tile; points" = ["text:the path: ", "path_tiles", "text:marks: ", "marks", "text:the window: ", "market:opening:screen", "text:kind: ", "market:opening:kind", "text:buttons: ", "market:opening:buttons", "text:at the window: ", "market:at", "text:in order: ", "order"], "after closing P2: the tile; Space: what opens; the tile" = ["text:tile: ", "hero:tile", "text:points: ", "hero:points"] }

[[step]]
encounter = "E14-5"
hero = "E14-5"
key = "space"
record = { "+after closing P2: the tile; Space: what opens; the tile" = ["text:Space: ", "key", "text:in order: ", "order", "text:tile after: ", "hero:tile"] }

# T129b: E14-8, E14-9, E14-10, E14-12, E14-15 here, before Red's turn ends.


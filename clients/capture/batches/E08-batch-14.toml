# E08 batch E14 played by the capture harness (E08 T129; h3adv.py batch): the procedure of
# experiments/specs/E08-batch-14.toml as steps, on Easy, the starting bonus gold, Red and Blue
# human in hot seat. T129 was cut in two by family (decision 376): **T129a, the markets** (E14-3's
# day-1 reads, E14-1 with E14-2, E14-4, E14-5 with E14-6, E14-16 at each of them, Blue's read on
# its turn, E14-3's day-29 reads); **T129b, the services** (E14-8, E14-9, E14-10 with E14-11,
# E14-12, E14-15 on Red's day 1, E14-13 and E14-17 on Blue's, E14-16 and E14-7 with them) in the
# template's order; the RoE map's E14-14 is `E08-batch-14-roe.toml`.
#
# The trade window (README, "Markets"): a walk onto a market plays its `actions` in the window
# (`click` its items by name: `slot:<n>`, `give:<resource>`, `want:<resource>`, `entry:<n>`,
# `pay:<resource>`, `player:<colour>`, `trade`, `max`, `transfer`; `amount = <n>` the slider) and
# closes it with its OK; `market` reads it after an action (`:pair`, `:rate`, `:most`, ...),
# `market:opening` as it opened, `market:at` the hero's tile and points then. A Black Market's
# record by its entrance: `black_market:x,y[:part]`; a wide table's cell `<row> | <column>`, here
# with its encounter first (`E14-4|<row> | <column>`). A `key = "space"` step on a market's
# entrance is E14-16's revisit: `order` names what opens (the window, closed again at once).

spec = "experiments/specs/E08-batch-14.toml"
players = ["Red", "Blue"]
difficulty = "easy"
gold = true

# --- Day 1, Red: E14-3's first reads (before any hero moves) ------------------------------------

[[step]]
encounter = "E14-4"
hero = "E14-4"
record = { "E14-4|M1 (12, 8), day 1 | the seven (name; class)" = ["black_market:12,8:artifacts", "text:classes: ", "black_market:12,8:classes"], "E14-4|M1 (12, 8), day 1 | the word's record index" = ["text:record: ", "black_market:12,8:index", "text:word: ", "black_market:12,8:word"], "E14-4|M2 (18, 8), day 1 | the seven (name; class)" = ["black_market:18,8:artifacts", "text:classes: ", "black_market:18,8:classes"], "E14-4|M2 (18, 8), day 1 | the word's record index" = ["text:record: ", "black_market:18,8:index", "text:word: ", "black_market:18,8:word"] }
note = { "the date at the start" = "date", "the game's version" = "map_kind", "the difficulty" = "difficulty" }


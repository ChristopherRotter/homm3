# The oracle's corpus (E14 T1b1; docs/lanes/rmg/ORACLE.md): each case's choices on the
# scenario screen's Random Map tab (none Random) and its seed (xdd.dll's H3TIME, the generator's
# time()), generated by the original under Wine (`h3rmg.py corpus`). The maps are never committed
# (ADR-0009): their digests are in kept.txt.
#
# Choices: size S, M, L, XL (36 to 144 tiles a side); levels 1 or 2; players the tab's "human or
# computer" count 1 to 8 (one human: the scenario screen's red); teams 0 to players - 1; computers
# the "computer only" count, at most 8 - players; computer_teams 0 to computers - 1 (with
# computers only); water none, normal, islands; monsters weak, normal, strong. Unset choices:
# h3rmg.DEFAULTS (M, 1 level, 2 players, no teams, no computers, normal water and monsters).
# The size index the templates' ranges are in: width x height x levels / 1296 (survey §1.4).


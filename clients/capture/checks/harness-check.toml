# E08 T37a (batch E5's reads, `cross-lane`): Blue's two heroes in the south-east and north-east
# corners, far from every other hero of Blue's. Fog: whether Blue has explored tiles at the edge of
# its disk (radius 5 without Scouting: dx^2 + dy^2 <= 30, ADV-FOG-002), before and after a step
# east, and whether Red has (its heroes stand far west); each cell of a table by its column. Equip:
# Boots of Speed and the Spyglass put on from the backpack in the hero screen; its points at the
# start of Blue's day 2, read without a walk.

[[encounter]]
id = "Fog"
title = "A tile's explored bit for a player, before and after a step (E08 T37a)"
questions = []
procedure = [
    "Day 1, Blue's turn: read the hero's points and whether Blue has explored the probes; whether Red has explored the hero's tile.",
    "Walk one step east onto (29, 30) (two clicks on it). Read the points and the probes again.",
]
[encounter.hero]
type = "Tyris"
specialty = "creature Cavalier"
owner = "blue"
at = [28, 30]
primary = [1, 1, 1, 1]
army = [["Pikeman", 1]]
[[encounter.record]]
field = "points at the start"
[[encounter.record]]
table = ["probe", "at the start", "after the step"]
labels = ["A (33, 30)", "B (34, 30)", "C (33, 32)", "D (33, 33)"]
[[encounter.record]]
field = "Red explored the hero's tile (yes/no)"
[[encounter.record]]
field = "points after the step"
[[encounter.record]]
field = "anything odd"


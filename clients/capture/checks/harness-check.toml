    "Click Full B west of the hero twice: in the exchange, move the hero's Pikeman (slot 0) into Full B's empty slot 1; split Full B's Pikemen (slot 0) into the hero's emptied slot 0 with the split button, the slider at its maximum, OK; close.",
]
[encounter.hero]
type = "Ignatius"
specialty = "creature Imp"
owner = "blue"
at = [28, 13]
primary = [1, 1, 1, 1]
army = [
    ["Pikeman", 1], ["Archer", 1], ["Griffin", 1], ["Swordsman", 1], ["Monk", 1],
    ["Cavalier", 1], ["Angel", 1],
]
[encounter.opponent]

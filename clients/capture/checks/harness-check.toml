# The capture harness's own check (E17 H1, *provisional*; clients/capture/README.md, "An experiment
# batch"): not an experiment of the rules but a map whose recipe (capture/batches/harness-check.toml)
# plays each thing the harness does on the adventure map: the difficulty, a battle started from
# the map and fought by the computer, a retreat, a surrender in hot seat, a hero's details read from
# memory. Built by h3-experiment as the domain lanes' specs are; the questions of a monster's offers
# need a monster that offers (a disposition other than savage, or one that may flee), which
# h3-experiment places from E08 T22a on: the recipe's question steps wait for it. E08 T32b1 (batch
# E4's reads, `cross-lane`): Exp's skills in order, seed byte and offer counters, Lvl's level-up
# dialogs and messages, and Gear: a hero's artifacts and backpack, a battle on a Clover Field
# played by plan (Blue's Thunderbirds destroy Red's Ballista first, as batch E4's E4-9).

[map]
name = "Harness check"
description = "The capture harness's check map (E17 H1): played by clients/capture/h3adv.py, not by hand."
size = 36
terrain = "grass"

# Gear's battle: a Clover Field (6 x 4 left of and above its anchor) under both heroes (E08 T32b1).
[[map.ground]]
picture = "AVXcf0"
at = [13, 14]

[[encounter]]
id = "Win"
title = "A battle against a monster, fought by the computer (auto combat)"
questions = []
procedure = ["Walk into the Pikemen; auto combat."]
[encounter.hero]
type = "Caitlin"
specialty = "resource gold"
at = [3, 3]
primary = [5, 5, 1, 1]
army = [["Archangel", 20]]
[encounter.opponent]
monster = "Pikeman"
count = 5
[[encounter.record]]
field = "difficulty"
[[encounter.record]]
field = "gold at the start"
[[encounter.record]]
field = "a battle (yes/no)"
[[encounter.record]]
field = "stacks at the start"
[[encounter.record]]
field = "stacks at the end"
[[encounter.record]]
field = "the hero's army after"
[[encounter.record]]
field = "experience after"
[[encounter.record]]
field = "the monster after"
[[encounter.record]]
field = "anything odd"

[[encounter]]

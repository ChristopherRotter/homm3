# E08 T47a (batch E6's clicks and reads): Kit, the hero screen (army slots, split, the creature
# dialog's dismiss, the formation and tactics formation buttons, artifacts picked up and put down,
# a combination's questions, right clicks, the backpack's arrow; the flags, learned spells, worn
# positions) and a battle's tactics phase; Full, the army dialog after a join without room and the
# exchange with Full B (armies, split, closing). Blue then holds eight heroes, the list's most.

[[encounter]]
id = "Kit"
title = "The hero screen's clicks; a tactics phase ended at once (E08 T47a)"
questions = []
procedure = [
    "Day 1, Blue's turn: read the hero's army slot by slot, its flags (+0x48), learned spells, worn positions and backpack.",
    "Open its hero screen. Swap slots 0 and 1; split slot 0 into the empty slot 3 with the split button, the slider at its maximum, OK; dismiss slot 3's stack from its creature dialog (Yes). Press the tactics formation button twice, the tight and the loose formation buttons.",
    "Put the Mystic Orb of Mana from the backpack on misc 4 (position 12) and answer the assembly's question No; right-click it and answer Yes; put the Wizard's Well into the backpack's first place and right-click it there; press the backpack's right arrow. Close the screen.",
    "Click the Pikemen east of the hero twice: end the tactics phase at once (Start); auto combat.",
]
[encounter.hero]
type = "Christian"
specialty = "creature Ballista"
owner = "blue"
at = [28, 8]
primary = [2, 2, 1, 1]
skills = [["Tactics", 2]]
army = [["Swordsman", 20], ["Archer", 5]]
artifacts = { "misc 2" = "Charm of Mana", "misc 3" = "Talisman of Mana", "spell book" = "Spell Book" }
backpack = [
    "Mystic Orb of Mana", "Centaurs Axe", "Greater Gnoll's Flail", "Ogre's Club of Havoc",
    "Sword of Hellfire", "Shield of the Dwarven Lords",
]
spells = ["Bless"]
[encounter.opponent]
monster = "Pikeman"
count = 5
[[encounter.record]]
table = ["read", "value"]
labels = [
    "slots at the start", "counts shown at the start", "flags at the start", "learned spells",
    "positions at the start", "backpack at the start", "backpack shown at the start",
    "slots after the swap", "split dialog at the start", "split dialog at the maximum",
    "slots after the split", "the dismiss question", "slots after the dismissal",
    "counts shown after the dismissal", "flags after the tactics button",
    "flags after it again", "flags after tight", "flags after loose",
    "the first equip's question", "positions after it", "the right click", "positions after the assembly",
    "backpack after the Well put in", "the right click in the backpack", "backpack after the arrow",
    "backpack shown after the arrow", "positions at the end",
]
[[encounter.record]]
field = "tactics phase (yes/no)"
[[encounter.record]]
field = "the battle's winner"
[[encounter.record]]
field = "anything odd"


# E27 M1 T2: the system options' recipes (design §4.1 to §4.8; h3shell.py, the runbook's "The
# shell's screens"). Each starts Arrogance as a single scenario, closes its first message and
# opens the dialog by its hotkey O. Coordinates are the original's 800 × 600 screen: the dialog at
# (159, 56), its items at their own places + (159, 56) (design §4.1's table), a point the middle of
# the item: Load (455, 378), Save (566, 378), Restart (455, 437), Main Menu (566, 437), Quit
# (455, 495), Return (566, 495); the music bar i (197 + 19 i, 433), the effects' (197 + 19 i,
# 499); Hero Speed i (210 + 48 i, 149), Enemy Speed i (210 + 48 i, 216), Map Scroll Speed i
# (218 + 64 i, 282); High (234, 348), Low (330, 348); the box k (421, 123 + 32 k). The pointer
# parks at (700, 300), over the map's right panel, outside the dialog. `opt-first`, `opt-rows` and
# `opt-bars` have a first run's settings (design §4.5): the registry's, but the effects' volume,
# which h3drive's `Game.start` writes 0 after the recipe's registry (`sound_settings`: no sound
# driver), so it is written into the game's setting (0x698764) before the dialog opens; the other
# recipes keep setup.sh's (the volumes 0, most boxes off). The save from play (Save, GENRLTXT
# 351) is scenario.toml's `scn-save`. A map's load is given real time to end before the clock
# moves on (`settle` before Begin, `wait` once the restart's load began).

[[recipe]]
id = "opt-first"
what = "§4.1, §4.2, §4.8: the dialog with a first run's settings; each kind of item's press held and the pointer gone off it before the release (a button: nothing; a box and a bar act: Show Route off, the music 3); every item's right press popup; Return and Escape, the dialog opened again"
maps = ["Arrogance.h3m"]
registry = { "Walk Speed" = 2, "Computer Walk Speed" = 3, "Window Scroll Speed" = 1, "Music Volume" = 5, "Last Music Volume" = 5, "Show Route" = 1, "Move Reminder" = 1, "Quick Combat" = 0, "Video Subtitles" = 1, "Town Outlines" = 1, "Animate SpellBook" = 1, "Blackout Computer" = 0 }

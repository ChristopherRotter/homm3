# E27 M1 T2: the menus' recipes (design §2.2 to §2.5, §2.11; h3shell.py, the runbook's "The
# shell's screens"). Coordinates are the original's 800 × 600 screen; a button's point is the
# middle of its rectangle (design §2.3's and §2.4's tables). Each button: its hover (frame 3), its
# press held (frame 1), the pointer gone off it with the button still down (released there: no
# command), its right press's popup (style 4, Help.txt) and the screen once it closed.

[[recipe]]
id = "menu-main"
what = "§2.3: the main menu: each button's hover, press and right press's popup"
steps = [
  "until:main_menu", "shot:menu",
  "move:643,70", "shot:new-hover", "down:643,70", "shot:new-press", "move:300,560", "up", "shot:new-left",
  "right:643,70", "shot:new-popup", "right-up", "shot:new-closed",
  "move:645,192", "shot:load-hover", "down:645,192", "shot:load-press", "move:300,560", "up", "shot:load-left",
  "right:645,192", "shot:load-popup", "right-up", "shot:load-closed",
  "move:643,304", "shot:scores-hover", "down:643,304", "shot:scores-press", "move:300,560", "up", "shot:scores-left",
  "right:643,304", "shot:scores-popup", "right-up", "shot:scores-closed",
  "move:643,414", "shot:credits-hover", "down:643,414", "shot:credits-press", "move:300,560", "up", "shot:credits-left",
  "right:643,414", "shot:credits-popup", "right-up", "shot:credits-closed",
  "move:643,520", "shot:quit-hover", "down:643,520", "shot:quit-press", "move:300,560", "up", "shot:quit-left",
  "right:643,520", "shot:quit-popup", "right-up", "shot:quit-closed",
]

[[recipe]]
id = "menu-quit"
what = "§2.3: Quit's question (GENRLTXT 70) by the button and by Escape, Cancel staying"
steps = [
  "until:main_menu",
  "click:643,520", "shot:question", "move:359,350", "shot:ok-hover", "move:441,350",
  "shot:cancel-hover", "down:441,350", "shot:cancel-press", "up", "shot:cancelled",
  "key:Escape", "shot:question-key", "key:Escape", "shot:escaped",
]


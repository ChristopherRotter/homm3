# E27 M1 T2: the multiplayer dialog's and the hot seat's recipes (design §2.6, §2.7, §2.11;
# h3shell.py, the runbook's "The shell's screens"). Coordinates are the original's 800 × 600
# screen: the dialog's items at its own positions + (173, 55), the hot seat's + (218, 96); a
# button's point is the middle of its DEF. Each button: its hover (its hint in the status line),
# its press held, the pointer gone off it with the button still down (released there: no
# command), its right press's popup and the screen once it closed. Online is never released over
# its button: its command ends the game (game_shutdown; no shot can follow). Under the harness's
# Wine IPX fails (its message), TCP/IP opens with the machine's address in its title (the
# stage-2 shots hold this computer's address), Modem and Direct Connect open.

[[recipe]]
id = "mp-new"
what = "§2.6: the multiplayer dialog over New Game's menu: stage 1, each button's hint, press and popup; Cancel, Escape"
steps = [
  "until:main_menu", "click:643,70", "check:new_game_menu", "click:649,180", "check:multiplayer", "shot:dialog",
  "move:578,157", "shot:hot-hover", "down:578,157", "shot:hot-press", "move:358,300", "up", "shot:hot-left",
  "right:578,157", "shot:hot-popup", "right-up", "shot:hot-closed",
  "move:578,214", "shot:ipx-hover", "down:578,214", "shot:ipx-press", "move:358,300", "up", "shot:ipx-left",
  "right:578,214", "shot:ipx-popup", "right-up", "shot:ipx-closed",
  "move:578,271", "shot:tcp-hover", "down:578,271", "shot:tcp-press", "move:358,300", "up", "shot:tcp-left",
  "right:578,271", "shot:tcp-popup", "right-up", "shot:tcp-closed",
  "move:578,328", "shot:modem-hover", "down:578,328", "shot:modem-press", "move:358,300", "up", "shot:modem-left",
  "right:578,328", "shot:modem-popup", "right-up", "shot:modem-closed",
  "move:578,385", "shot:direct-hover", "down:578,385", "shot:direct-press", "move:358,300", "up", "shot:direct-left",
  "right:578,385", "shot:direct-popup", "right-up", "shot:direct-closed",
  "move:578,442", "shot:online-hover", "down:578,442", "shot:online-press", "move:358,300", "up", "shot:online-left",
  "right:578,442", "shot:online-popup", "right-up", "shot:online-closed",
  "move:578,495", "shot:cancel-hover", "down:578,495", "shot:cancel-press", "move:358,300", "up", "shot:cancel-left",
  "right:578,495", "shot:cancel-popup", "right-up", "shot:cancel-closed",
  "move:359,500", "shot:name-hover", "right:359,500", "shot:name-popup", "right-up", "shot:name-closed",
  "move:518,300", "shot:map-hover", "right:518,300", "shot:map-popup", "right-up", "shot:map-closed",
  "click:578,495", "check:new_game_menu", "shot:cancelled",
  "click:649,180", "check:multiplayer", "shot:again", "key:Escape", "check:new_game_menu", "shot:escaped",
]


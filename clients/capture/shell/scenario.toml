# E27 M1 T2: the scenario screen's recipes (design §3.1 to §3.11; h3shell.py, the runbook's "The
# shell's screens"). Coordinates are the original's 800 × 600 screen (design §3.2's table): the
# panel buttons Show Scenarios (514, 91), Random Map (514, 115), Advanced Options (514, 519), Begin
# (497, 555), Back (667, 555); the columns players (41, 106), size (74, 106), version (107, 106),
# name (216, 106), victory (325, 106), loss (358, 106); the filters (183 + 47 i, 68); a row i
# (216, 135 + 25 i); the bar's arrows (383, 99), (383, 562); the difficulty i (521 + 32 i, 478).
# A row press comes 500 ms after the last one or the screen's opening (a second within 400 ms
# begins, §3.4). The saves' time is fixed by `games-time` (the list shows it, §3.5). Each recipe
# first moves the pointer to its park (the main menu came at 0 or 10 ms when the first `until`
# looked too early, the machine busy), and a move comes before each later `until` (the same).
# A press that loads a game is a `click-wait` (the load's bar fills in real time on the frozen
# clock: the input step waits for its end; a clip shows the frames from there).


[[recipe.made]]
file = "Arrogance Retold.h3m"
from = "Arrogance.h3m"
name = "Arrogance Retold"
# Ours (E27 M3 T2c): 277 bytes, under the list record's 300 (scenario_header_read's strncpy); two
# spaces inside a line, three before a newline, an empty line, an indent, a word wider than the
# line, braces whose width the split counts and a highlight across a line's end, code-page letters.
description = "The harness's own map.  Its text runs past the box, so it scrolls.   \n\n   Indented.\nPneumonoultramicroscopicsilicovolcanoconiosisandmore\n{The long word} was cut; {this lit part runs word past the break,} then plain.\nCafé, Über, Ångström.\n9\n10\n11\n12\n13\n14\n15\n16\nThe last line.  "


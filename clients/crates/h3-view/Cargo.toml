[package]
name = "h3-view"
description = "The viewer: the scene model (messages to what is on screen at a time; pure, the library) and its adapters (the binary: the real-asset gate, the headless renderer, the window through h3-sdl)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
h3-assets.workspace = true
h3-formats.workspace = true
h3-protocol.workspace = true
h3-render.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# What both viewers share (E24 M3 T1a): the clock, the cursor and its `Sprite`, the dialog items,
# the string catalogue.
h3-ui.workspace = true
# The binary's adapters only (`tests/purity.rs`: the library never names them).
h3-battle.workspace = true
h3-kernel.workspace = true
h3-pack-battle.workspace = true
h3-content-battle.workspace = true
# A hero's battle effects and the skills that give them (E17 M3 T7b-2b-2a, `situation`).
h3-content.workspace = true
h3-contracts.workspace = true
h3-map.workspace = true
# The window (E17 M2 T5a): the platform adapter, the binary's only.
h3-sdl.workspace = true
# The music (E17 M2 T5b): MP3, the binary's only.
nanomp3.workspace = true

[lints]
workspace = true

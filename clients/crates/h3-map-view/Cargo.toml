[package]
name = "h3-map-view"
description = "The adventure map's viewer (E24): the map's static art, its live part, the asset tables and the screen's layout (pure, the library) and its adapters (the binary: the real-asset gate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
h3-assets.workspace = true
# The raw map's model (`h3_map::RawMap`): the static art is read from it (E24 T0's finding).
h3-map.workspace = true
# The compositor: the screen, its palettes and drawers, the PNG (E24 M1 T3b1).
h3-render.workspace = true
serde.workspace = true
toml.workspace = true
# What both viewers share (E24 M3 T1a): the clock, the cursor and its `Sprite`, the key table, the
# music thread's model.
h3-ui.workspace = true
# The binary's adapters only (`tests/purity.rs`: the library never names them): the archives.
h3-formats.workspace = true
# The window (E24 M2 T4a): the platform adapter, the binary's only.
h3-sdl.workspace = true
# The music (E24 M2 T5): the terrain tracks' MP3s, decoded by the binary only (`h3-view`'s
# decoder).
nanomp3.workspace = true

[lints]
workspace = true

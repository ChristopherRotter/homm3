[package]
name = "h3-map-client"
description = "The adventure map client (E24): the adapters around the map viewer's pure library (the window's map, its painter and sound, the record's battles hosted, the real-asset gate, the headless renderer, the harness's commands) as a library another host runs, and the `h3-map-view` command line over it (E24 M5 T2a: `h3-map-view`'s binary until then)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The map viewer's pure library: what is on screen at a time.
h3-map-view.workspace = true
h3-assets.workspace = true
h3-map.workspace = true
# A record's rules and its observer (E24 M4 T3a, `render --record`).
h3-protocol.workspace = true
h3-game.workspace = true
# The compositor: the screen, its palettes and drawers, the PNG (E24 M1 T3b1).
h3-render.workspace = true
serde.workspace = true
toml.workspace = true
# What both viewers share (E24 M3 T1a): the clock, the cursor and its `Sprite`, the key table, the
# music thread's model.
h3-ui.workspace = true
# The archives (E24 M1 T2: the gate's, then every command's).
h3-formats.workspace = true
# The window (E24 M2 T4a): the platform adapter.
h3-sdl.workspace = true
# The music (E24 M2 T5): the terrain tracks' MP3s (`h3-view`'s decoder).
nanomp3.workspace = true
# The packs a record's rules are read from (E24 M4 T3a, `render --record`).
h3-files.workspace = true
# A record's battles in the window (E24 M4 T5b1, the user's choice at its start: a dependency on the
# client lane's crate, not a binary over both): the battle client's hosted element
# (`window::Hosted`), its ground from a whole game's battle (`battle::Ground::load_battle`) and the
# host's sound (`audio::HostSound`), the map's sound on it too; `h3-view` for the battle's record
# (`game_record`), its keys and its combat options' settings.
h3-battle-client.workspace = true
h3-view.workspace = true
# A player's id (E24 M5 T2b: play's first human, its record; the renderer's tests since E24 M4 T3a).
h3-contracts.workspace = true
# A human's battle hosted in play (E24 M5 T6a): the unowned side played by the original's battle AI
# (`h3-battle-ai`, as `h3_sim::computer`'s system actor) from a stream of the host's own
# (`h3-kernel`'s generator).
h3-battle-ai.workspace = true
h3-kernel.workspace = true

[lints]
workspace = true

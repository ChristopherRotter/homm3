# E17 M5 T5a: Clone (design §7.25): Orrin clones his Swordsmen; the clone slides from its
# original's place in 16 redraws (0x5A6FDE); everyone defends; at round 2's start its one round has
# run out and it vanishes in a dissolve (`round_start` 0x47614D). Hot seat; on grass at the capture
# set's tile (`sacrifice`'s).

[scenario]
id = "sequence-clone"
# Both players human, as the original's hot-seat map (`h3-view situation --hot-seat`).
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"
obstacles = [
    { hexes = [75, 76, 77, 78, 61, 60, 59, 58], anchor = 74, kind = "base:obstacle_22" },
    { hexes = [91, 92], anchor = 91, kind = "base:obstacle_20" },
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_19" },
]

[[attacker]]
slot = 0
creature = "base:swordsman"
count = 20

[[defender]]
slot = 0
creature = "base:archer"
count = 10

# The heroes (E17 M3 T3a) with 1 in every primary skill but Orrin's knowledge.
[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 3
mana = 30
max_mana = 30
spell_book = ["base:clone"]

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 1
power = 1
knowledge = 1

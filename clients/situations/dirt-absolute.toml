# E17 M2 T1: a situation of the capture set (set.toml) on dirt, the battle at tile (20, 20), where
# the original places an absolute obstacle; the armies as dirt.toml's. The obstacles are the
# original's, found in its capture (`h3cap.py find`).

[scenario]
id = "situation-dirt-absolute"
# Red human, Blue a computer, as the original's map (`h3-view situation`): the panel's buttons
# lit on the human's turn (E17 M3 T6a).
human = ["attacker"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:dirt"
obstacles = [
    { hexes = [62, 63, 47, 46, 45], anchor = 62, kind = "base:obstacle_2" },
    { hexes = [146, 147, 130], anchor = 145, kind = "base:obstacle_13" },
    { hexes = [80, 94, 95, 96, 97, 105, 106, 107, 108, 109, 110], kind = "base:obstacle_100" },
]

[[attacker]]
slot = 0
creature = "base:royal_griffin"
count = 5

[[attacker]]
slot = 4
creature = "base:swordsman"
count = 10

[[defender]]
slot = 1
creature = "base:black_knight"
count = 3

[[defender]]
slot = 5
creature = "base:skeleton"
count = 20

# The heroes (E17 M3 T3a), as the original's map gets them (`h3-view situation`): Orrin, a
# Knight, and Crag Hack, a Barbarian, each with 1 in every primary skill.
[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 1

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 1
power = 1
knowledge = 1

# E17 M3 T1b-1: shots and rays in a battle in progress in hot seat (`hot_seat` in
# sequences.toml: the harness plays both sides). Round 1: the Arch Mages shoot their ray up at the
# Beholders, the Cyclops throw down at the Gnolls, the Beholders shoot their ray left at the
# Cyclops, the Gnolls defend. Round 2: the Arch Mages' ray straight at the defending Gnolls (their
# defend reaction), the Cyclops' straight throw kills the Beholders (a death by a shot). The counts
# keep every hit but the last from killing and make the last always kill, whatever the rolls.
# Distinct speeds (7, 6, 5, 4) fix the turns; two factions a side, so morale is 0. On grass at the
# capture set's tile (grass.toml's obstacles).

[scenario]
id = "sequence-shots"
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"
obstacles = [
    { hexes = [75, 76, 77, 78, 61, 60, 59, 58], anchor = 74, kind = "base:obstacle_22" },
    { hexes = [91, 92], anchor = 91, kind = "base:obstacle_20" },
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_19" },
]

[[attacker]]
slot = 0
creature = "base:cyclops"
count = 3

[[attacker]]
slot = 2
creature = "base:arch_mage"
count = 5

[[defender]]
slot = 0
creature = "base:beholder"
count = 2

[[defender]]
slot = 2
creature = "base:gnoll"
count = 30

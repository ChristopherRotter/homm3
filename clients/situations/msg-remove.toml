# E17 M6 T5a (design §12.17, "To record" 4): the still `msg-remove`. A siege's field holds no
# natural obstacle (`quake`'s: a Castle town with a Fort, its walls and gate, no turrets and no
# moat; both heroes human, hot seat, so that the attacker's commanded Catapult opens: no war
# machine acts before the engine's record opens). Valeska with Remove Obstacle at Basic (Basic
# Water Magic on the original's map): chosen in the book on the Catapult's turn, nothing to
# remove: GENRLTXT 713 over the battle (whether the original's walls are objects its test takes:
# to confirm by the capture).

[scenario]
id = "msg-remove"
# Both human (hot seat): the attacker commands the Catapult.
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"

# The town: a Fort has walls and a gate, no turrets and no moat.
[scenario.siege]
faction = "base:castle"
fort = "fort"
moat = "absent"

[[attacker]]
slot = 0
creature = "base:pikeman"
count = 12

[[defender]]
slot = 0
creature = "base:hobgoblin"
count = 20

# The heroes, each with 1 in every primary skill (`h3-view situation` writes them so); Valeska's
# 10 spell points the original's hero starts with (10 per knowledge).
[scenario.attacker_hero]
hero_type = "base:valeska"
attack = 1
defense = 1
power = 1
knowledge = 1
mana = 10
max_mana = 10
spell_book = ["base:remove_obstacle"]
masteries = { "base:remove_obstacle" = 1 }
# Basic Ballistics: the Catapult waits for its command.
catapult = 1

[scenario.defender_hero]
hero_type = "base:ufretin"
attack = 1
defense = 1
power = 1
knowledge = 1

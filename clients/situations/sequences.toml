    { seat = "Defender", at = 2400, command = { Defend = {} } },
    { seat = "Attacker", at = 2400, command = { Move = { to = 88 } } },
    { seat = "Defender", at = 3244, command = { Cast = { spell = 54, target = { Stack = { stack = 0 } }, second = { None = {} } } } },

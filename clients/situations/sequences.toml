# E17 M3 T7b-2b-3: the Thunderbird's bolt and Life Drain (`seq-thunder.toml`, hot seat; design
# §7.16, players 1 and 2). Round 1: the Thunderbirds fly to row 6 (the Vampire Lords are beyond
# their reach), the Vampire Lords defend. Round 2: the Thunderbirds strike them from the left, the
# bolt's roll forced (`roll:thunderbird`: the line, `LightBlt.wav`, animation 1 at 10 ms, the
# damage's line, 49 over the marked target with its reaction); the Vampire Lords strike back and
# drain them (`DrainLif.wav`, the line, 74 over the drinkers). Good morale failed: one town each.
# `seed`: one Vampire Lord killed, 50 drained, one raised, as in the original. Frames: as the
# original's but the landing's boxes at 4 490 ms (86 pixels, as `luck`'s at 2 730, design §4.3)
# and the drinkers' box listed at 8 410 (memory holds the raised number a frame before the
# screen shows it).
[[sequence]]
id = "thunder"
scenario = "seq-thunder.toml"
hot_seat = true

# The recorded sequences (E17 M2 T3, *provisional*; clients/capture/README.md, "Sequences"): each
# runs its scenario's battle in the original (its map from `h3-view situation`), steps the clock
# `pre` ms after the opening, performs its actions at the frozen clock (`hex:<n>` clicks a hex)
# and steps 1 ms at a time for `ms` ms, reading the stacks' animation state from the game's
# memory (h3mem.py). `timeline` holds what it recorded: one line per change of a stack's group,
# frame or hex, `<ms after the opening> <side>.<record> g<group> f<frame> h<hex>`, numbers only
# (ADR-0009). Inside an animation a change at t is the frame the game drew at t, shown from the
# next frame deadline; a change by the idle step (a fidget) shows at t (design §7.1).
# `h3drive.py sequences` fails when a timeline changes. The timings these confirm:
# docs/epics/E17-design.md §7. `[[sequence.command]]` (E17 M2 T4a): the engine's commands for what
# the actions did in the original, each a seat and a wire command (stack ids: the attacker's
# stacks by slot, then the defender's; a two-hex stack's position is its rear hex);
# `h3-view sequences` plays them and checks the viewer's timeline against the recorded one.
# `frames` (E17 M2 T4b-1, design §7.9): the frame check's recorded counts, `<ms> <differing
# pixels> <redraw artifacts among them>` for every distinct battlefield the original showed
# (`h3drive.py frames`; the artifacts since M3 T1c, design §7.11). `boxes = true` (E17 M3 T5a,
# design §4.3): the frame check compares the count boxes; without it they are masked where the
# drawn poses show them and where the viewer drew them. Compared in the sequences whose counts
# never change (no rolled strike: T5a), in `shot` and `melee` (T5b-1, the numbers over time) and
# in `behind` and `shots` (T5b-2a): a box whose count is not the one the original's memory shows
# (the engine rolls its own damage) is masked and listed after the frame's counts
# (` n<side>.<record>`); `strike` at 2 730 ms differs in 134 pixels of the original's redraws
# (design §4.3).

[[sequence]]
id = "walk"
scenario = "seq-walk.toml"
actions = ["hex:40"]
ms = 2700
timeline = "timelines/walk.txt"
frames = "timelines/walk-frames.txt"
boxes = true
command = [{ seat = "Attacker", command = { Move = { to = 39 } } }]

[[sequence]]
id = "shot"
scenario = "seq-shot.toml"
actions = ["hex:49"]
ms = 3100
timeline = "timelines/shot.txt"
frames = "timelines/shot-frames.txt"
boxes = true
command = [{ seat = "Attacker", command = { Shoot = { target = 2, at = 49 } } }]

# E17 M3 T5b: 7 000 ms (6 000 before) to the strike back's end, where the Wolf Riders' box goes
# from 30 to 12 (6 466 ms; the Angels' fixed damage, the engine's kills the original's).
[[sequence]]
id = "melee"
scenario = "seq-melee.toml"
actions = ["hex:43"]
ms = 7000
timeline = "timelines/melee.txt"
frames = "timelines/melee-frames.txt"
boxes = true
command = [
    { seat = "Attacker", command = { Move = { to = 43 } } },
    { seat = "Defender", command = { Attack = { target = 0, from = 45 } } },
]

[[sequence]]
id = "turn"
scenario = "seq-turn.toml"
actions = ["hex:19"]
ms = 3500
timeline = "timelines/turn.txt"
frames = "timelines/turn-frames.txt"
boxes = true
command = [{ seat = "Attacker", command = { Move = { to = 18 } } }]

# E17 M3 T1a: a two-hex walker climbs two rows (35 to 1, clicking its front hex 2): a turn on the
# path's first step and a flip later (§7.10).
[[sequence]]
id = "climb"
scenario = "seq-turn.toml"
actions = ["hex:2"]
ms = 3500
timeline = "timelines/climb.txt"
frames = "timelines/climb-frames.txt"
boxes = true
command = [{ seat = "Attacker", command = { Move = { to = 1 } } }]

# E17 M3 T1a: a battle in progress in hot seat (the harness's actions play both sides, each as its
# stack's turn starts, `turn:<side>.<record>`; the times in the commands' `at`): the Pegasi wait,
# the Centaurs walk to 41, the Marksmen to 143, the Goblins defend, the Pegasi land behind the
# Centaurs (39, 40); in the second round the Pegasi wait, the Centaurs strike them standing (both
# turn) and the Marksmen shoot them (it turns).
[[sequence]]
id = "behind"
scenario = "seq-behind.toml"
hot_seat = true
actions = [
    "key:w", "turn:0.0", "hex:42", "turn:0.1", "hex:143", "turn:1.1", "key:d", "turn:1.0",
    "hex:39", "turn:1.0", "key:w", "turn:0.0", "click:340,196", "turn:0.1", "hex:39",
]
ms = 4000
timeline = "timelines/behind.txt"
frames = "timelines/behind-frames.txt"
boxes = true
command = [
    { seat = "Defender", command = { Wait = {} } },
    { seat = "Attacker", at = 0, command = { Move = { to = 41 } } },
    { seat = "Attacker", at = 1988, command = { Move = { to = 143 } } },
    { seat = "Defender", at = 5464, command = { Defend = {} } },
    { seat = "Defender", at = 5464, command = { Move = { to = 40 } } },
    { seat = "Defender", at = 7144, command = { Wait = {} } },
    { seat = "Attacker", at = 7144, command = { Attack = { target = 2, from = 41 } } },
    { seat = "Attacker", at = 12544, command = { Shoot = { target = 2, at = 39 } } },
]

# E17 M3 T1b-1: shots and rays in a battle in progress in hot seat (`seq-shots.toml`). Round 1:
# the Arch Magi's ray at the Beholders, the Cyclops' throw down at the Gnolls, the Beholders' ray
# at the Cyclops, the Gnolls defend; round 2: the Arch Magi's ray at the defending Gnolls, the
# Cyclops' throw kills the Beholders (design §7.12, §7.4).
[[sequence]]
id = "shots"
scenario = "seq-shots.toml"
hot_seat = true
actions = [
    "hex:49", "turn:0.0", "hex:151", "turn:1.0", "hex:35", "turn:1.1", "key:d", "turn:0.1",
    "hex:151", "turn:0.0", "hex:49",
]
ms = 3000
timeline = "timelines/shots.txt"
frames = "timelines/shots-frames.txt"
boxes = true
command = [
    { seat = "Attacker", command = { Shoot = { target = 2, at = 49 } } },
    { seat = "Attacker", at = 1517, command = { Shoot = { target = 3, at = 151 } } },
    { seat = "Defender", at = 3471, command = { Shoot = { target = 0, at = 35 } } },
    { seat = "Defender", at = 4638, command = { Defend = {} } },
    { seat = "Attacker", at = 4638, command = { Shoot = { target = 3, at = 151 } } },
    { seat = "Attacker", at = 6655, command = { Shoot = { target = 2, at = 49 } } },
]

# E17 M3 T1b-2: flights across rows and a breath on two stacks in hot seat (`seq-fly.toml`). The
# Black Dragons fly from row 2 to row 3 beside the attacker's column and breathe down and to the
# left through the Pikemen into the Gnolls (the cursor up and to the right of the Pikemen puts
# the Dragons' head there, on hex 53); the Pikemen strike back; then the Angels fly from row 0
# down to row 9 over the Dragons and five stacks (design §7.10, §7.4).
[[sequence]]
id = "fly"
scenario = "seq-fly.toml"
hot_seat = true
actions = ["click:116,267", "turn:0.0", "hex:155"]
ms = 3000
timeline = "timelines/fly.txt"
frames = "timelines/fly-frames.txt"
command = [
    { seat = "Defender", command = { Attack = { target = 2, from = 54 } } },
    { seat = "Attacker", at = 5900, command = { Move = { to = 155 } } },
]

# E17 M3 T3b: the war machines in hot seat (`seq-machines.toml`). Round 1: the Pikemen defend, the
# Archers shoot them; then the machines on their own: the attacker's Ballista shoots right at the
# Archers, the defender's Ballista left at the Pikemen, the attacker's First Aid Tent heals the
# Pikemen (the magic animation 79, design §7.15); round 2: the Archers defend.
[[sequence]]
id = "machines"
scenario = "seq-machines.toml"
hot_seat = true
actions = ["key:d", "turn:1.0", "hex:86", "turn:1.0", "key:d"]
ms = 500
timeline = "timelines/machines.txt"
frames = "timelines/machines-frames.txt"
command = [
    { seat = "Attacker", command = { Defend = {} } },
    { seat = "Defender", at = 0, command = { Shoot = { target = 0, at = 86 } } },
    { seat = "Defender", at = 7945, command = { Defend = {} } },
]

# E17 M3 T1b-2: the mouse over a stack (`seq-fly.toml`'s opening, the Black Dragons' turn). The
# mouse enters the Pikemen at once: they show group 1 from frame 0, one frame per idle step
# (`battle_mouse_stack` 0x477C20; their outline 0x70); it leaves at 150 ms and enters again at 200,
# while they still show group 1: they stand (group 2, frame 0). No engine command: the viewer
# draws no mouse in a record (design §7.2), so `h3-view sequences` and the frame check skip it.
[[sequence]]
id = "hover"
scenario = "seq-fly.toml"
hot_seat = true
actions = ["move:102,280", "at:150", "move:300,300", "at:200", "move:102,280"]
ms = 1300
timeline = "timelines/hover.txt"

# E17 M3 T4b-2b-2: a strike's line in the log (`seq-strike.toml`, design §9.6). The Archangel
# flies beside the Pikemen (its rear hex 47, the cursor left of their centre) and kills all ten
# with its fixed damage; the defender's Goblins' turn starts at 3 730. From then on (`log_at`) the
# original's log shows the strike's line, which the viewer composes from the record's `Struck`
# (`battle_log::strike`) and the frame check compares with the log's item unmasked (before it the
# status line shows the hint over the Pikemen: the panel's, M3 T6).
[[sequence]]
id = "strike"
scenario = "seq-strike.toml"
hot_seat = true
actions = ["click:700,196"]
ms = 4300
timeline = "timelines/strike.txt"
frames = "timelines/strike-frames.txt"
boxes = true
log_at = 3730
command = [
    { seat = "Attacker", command = { Attack = { target = 3, from = 47 } } },
]

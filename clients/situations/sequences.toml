# E17 M3 T8: the battle's end (`seq-end.toml`, design §8.2, "The battle's end"): `strike`'s
# battle without the defender's Goblins, so the lone Pikemen stand at hex 100 (a one-stack army's
# place); the Archangel flies beside them (its rear hex 98, the cursor left of their centre) and

# The recorded sequences (E17 M2 T3, *provisional*; clients/capture/README.md, "Sequences"): each
# runs its scenario's battle in the original (its map from `h3-view situation`), steps the clock
# `pre` ms after the opening, performs its actions at the frozen clock (`hex:<n>` clicks a hex;
# `roll:<name>` and the key `fail`, E17 M3 T7b-2b-1: the original's forced rolls, the runbook's
# "Forced rolls") and steps 1 ms at a time for `ms` ms, reading the stacks' animation state from
# the game's memory (h3mem.py). `timeline` holds what it recorded: one line per change of a
# stack's group, frame or hex, `<ms after the opening> <side>.<record> g<group> f<frame> h<hex>`,
# numbers only (ADR-0009). Inside an animation a change at t is the frame the game drew at t,
# shown from the next frame deadline; a change by the idle step (a fidget) shows at t (design
# §7.1).
# `h3drive.py sequences` fails when a timeline changes. The timings these confirm:
# docs/epics/E17-design.md §7. `[[sequence.command]]` (E17 M2 T4a): the engine's commands for what
# the actions did in the original, each a seat and a wire command (stack ids: the attacker's
# stacks by slot, then the defender's; a two-hex stack's position is its rear hex);
# `h3-view sequences` plays them and checks the viewer's timeline against the recorded one.
# `frames` (E17 M2 T4b-1, design §7.9): the frame check's recorded counts, `<ms> <differing
# pixels> <redraw artifacts among them>` for every distinct battlefield the original showed
# (`h3drive.py frames`; the artifacts since M3 T1c, design §7.11). `boxes = true` (E17 M3 T5a,
# design §4.3): the frame check compares the count boxes; without it they are masked where the
# drawn poses show them and where the viewer drew them. Compared in the sequences whose counts
# never change (no rolled strike: T5a), in `shot` and `melee` (T5b-1, the numbers over time), in
# `behind` and `shots` (T5b-2a) and in `fly` and `machines` (T5b-2b): in every sequence with
# frames. A box whose count is not the one the original's memory shows
# (the engine rolls its own damage) is masked and listed after the frame's counts
# (` n<side>.<record>`); `strike` at 2 730 ms differs in 134 pixels of the original's redraws
# (design §4.3). The panel is compared since E17 M3 T6b (design §9.8), the cursor since T6c-2 (the
# viewer follows the harness's `actions` with its mouse, design §9.10: the cursor drawn where the
# original's memory says, the status line's hints, the marked and entered stacks); the log's item
# where the original's text (its memory) is not the viewer's and its pixels differ is masked and
# listed (` log`: a rolled line).

[[sequence]]
id = "walk"
scenario = "seq-walk.toml"
actions = ["hex:40"]
ms = 2700
timeline = "timelines/walk.txt"
frames = "timelines/walk-frames.txt"
boxes = true
command = [{ seat = "Attacker", command = { Move = { to = 39 } } }]

[[sequence]]
id = "shot"
scenario = "seq-shot.toml"
actions = ["hex:49"]
ms = 3100
timeline = "timelines/shot.txt"
frames = "timelines/shot-frames.txt"
boxes = true
command = [{ seat = "Attacker", command = { Shoot = { target = 2, at = 49 } } }]


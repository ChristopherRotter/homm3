frames = "timelines/resist-frames.txt"
boxes = true
command = [
    { seat = "Defender", at = 0, command = { Defend = {} } },
    { seat = "Attacker", at = 0, command = { Cast = { spell = 54, target = { Stack = { stack = 1 } }, second = { None = {} } } } },
    { seat = "Attacker", at = 2900, command = { Defend = {} } },
    { seat = "Defender", at = 2900, command = { Defend = {} } },
    { seat = "Attacker", at = 2900, command = { Cast = { spell = 54, target = { Stack = { stack = 1 } }, second = { None = {} } } } },
]


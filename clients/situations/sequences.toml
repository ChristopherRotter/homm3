# E17 M3 T1b-2: the mouse over a stack (`seq-fly.toml`'s opening, the Black Dragons' turn). The
# mouse enters the Pikemen at once: they show group 1 from frame 0, one frame per idle step
# (`battle_mouse_stack` 0x477C20; their outline 0x70); it leaves at 150 ms and enters again at 200,
# while they still show group 1: they stand (group 2, frame 0). Since M3 T6c-2 the viewer follows
# the harness's mouse (design §9.10): no engine command, the opening's battle with the mouse over
# it; its timeline compares the stacks the mouse entered (the original's own fidgets aside), its
# frames the cursor, the attack's hint and the outline.
[[sequence]]
id = "hover"
scenario = "seq-fly.toml"

# E17 M3 T7b-2b-2b: good luck on a melee strike (design §7.16, player 1): `strike`'s battle with
# Orrin's luck 3 (Expert Luck on the original's map, T7b-2b-2a). The Archangel flies to the
# Pikemen; as its strike starts the luck roll (`roll:luck`, 0x441837) falls: `goodluck.82m`, the
# log's line, then animation 18 (`C09spA0`) over the Archangel, and the strike (its damage, doubled
# twice over, still the Pikemen's 100 hit points). Three factions and the Archangel's +1 make the
# attacker's morale 0, so no good morale follows. On grass at the capture set's tile.

[scenario]
id = "sequence-luck"
# Both players human, as the original's hot-seat map (`h3-view situation --hot-seat`): the
# panel's buttons lit on either side's turn (E17 M3 T6a).
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"
obstacles = [
    { hexes = [75, 76, 77, 78, 61, 60, 59, 58], anchor = 74, kind = "base:obstacle_22" },
    { hexes = [91, 92], anchor = 91, kind = "base:obstacle_20" },
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_19" },
]

[[attacker]]
slot = 0
creature = "base:archangel"
count = 1

[[attacker]]
slot = 2
creature = "base:goblin"
count = 10

[[attacker]]
slot = 4
creature = "base:gnoll"
count = 10

[[defender]]
slot = 0
creature = "base:pikeman"
count = 10

[[defender]]
slot = 2
creature = "base:goblin"
count = 10

# The heroes (E17 M3 T3a), as the original's map gets them (`h3-view situation`): Orrin, a
# Knight, with 1 in every primary skill, and Crag Hack, a Barbarian, with defense 6.
[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 1
effects = [{ kind = "luck", amount = 3 }]

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 6
power = 1
knowledge = 1

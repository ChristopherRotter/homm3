# E17 M4 T2b: the recorded sequence `keep` (sequences.toml; design §10.2, "A turret's shot"): a
# siege of a Castle town with a Castle, both heroes commanding their war machines (hot seat), so
# the keep and both towers shoot at the commanded targets on their turns, the upper tower at a
# two-hex stack (the Griffins); the turrets' damage is free (the engine's seed searched).

[scenario]
id = "sequence-keep"
# Both human (hot seat): the defender commands the keep.
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"

# The town: under SoD rules (the situation's map) its moat damages.
[scenario.siege]
faction = "base:castle"
fort = "castle"
moat = "damaging"
# The original's keep counts 5 creatures here, each tower 3 (`town_turret_count` 0x5BF4F0: 4 plus
# one structure of the situation's town; the engine's 4 + `structures`, BAT-SIE-016).
structures = 1

[[attacker]]
slot = 0
creature = "base:pikeman"
count = 12

[[attacker]]
slot = 3
creature = "base:griffin"
count = 4

[[attacker]]
slot = 6
creature = "base:archer"
count = 10

[[defender]]
slot = 0
creature = "base:goblin"
count = 15

[[defender]]
slot = 3
creature = "base:wolf_rider"
count = 6

[[defender]]
slot = 6
creature = "base:orc"
count = 8

# The heroes, each with 1 in every primary skill (`h3-view situation` writes them so).
[scenario.attacker_hero]
hero_type = "base:valeska"
attack = 1
defense = 1
power = 1
knowledge = 1
# Basic Ballistics: the Catapult waits for its command.
catapult = 1

[scenario.defender_hero]
hero_type = "base:ufretin"
attack = 1
defense = 1
power = 1
knowledge = 1

# Basic Artillery: the turrets wait for their commands.
[scenario.defender_hero.ballista]
level = 1
shots = 1
double_damage_chance_bp = 5000

# E17 M6 T4c (design §12.16): the wall aims' shades, in hot seat (`hot_seat`: Blue's turn waits
# for its player). At the opening the Marksmen's turn (speed 6, hex 86); Orrin aims Fire Wall
# (place 0) at Basic Fire Magic (the hex and its upper right neighbour) and Force Field (place 1,
# no shade), then the Marksmen defend; at the Goblins' turn (speed 5, hex 100) Crag Hack aims
# Fire Wall at Advanced (the hex, its upper left neighbour and the hex two rows up). On grass at
# the capture set's tile (grass.toml's obstacles), as `spell-aim`.

[scenario]
id = "sequence-shade-wall"
# Both players human, as the original's hot-seat map (`h3-view situation --hot-seat`).
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"
obstacles = [
    { hexes = [75, 76, 77, 78, 61, 60, 59, 58], anchor = 74, kind = "base:obstacle_22" },
    { hexes = [91, 92], anchor = 91, kind = "base:obstacle_20" },
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_19" },
]

[[attacker]]
slot = 0
creature = "base:marksman"
count = 10

[[defender]]
slot = 0
creature = "base:goblin"
count = 15

# The heroes (E17 M3 T3a) with 1 in every primary skill but knowledge 2 (20 spell points, the
# original's hero starts with 10 per knowledge); Orrin's book Fire Wall and Force Field, Basic
# Fire and Earth Magic; Crag Hack's Fire Wall, Advanced Fire Magic (the masteries ask the school
# skills of the original's map).
[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 2
mana = 20
max_mana = 20
spell_book = ["base:fire_wall", "base:force_field"]
masteries = { "base:fire_wall" = 1, "base:force_field" = 1 }

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 1
power = 1
knowledge = 2
mana = 20
max_mana = 20
spell_book = ["base:fire_wall"]
masteries = { "base:fire_wall" = 2 }

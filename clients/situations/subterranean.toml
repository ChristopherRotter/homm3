# E17 M2 T1: a situation of the capture set (set.toml) on subterranean: the human's Royal Griffins
# (speed 9) open; the defender's stacks face left. The obstacles are the original's, found in its
# capture (`h3cap.py find`).

[scenario]
id = "situation-subterranean"
packs = ["base"]
profile = "base:faithful"
terrain = "base:subterranean"
obstacles = [
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_4" },
    { hexes = [74, 75, 76, 59, 58], anchor = 74, kind = "base:obstacle_45" },
    { hexes = [128, 129, 130, 131, 113, 112, 111], anchor = 128, kind = "base:obstacle_47" },
]

[[attacker]]
slot = 0
creature = "base:royal_griffin"
count = 5

[[attacker]]
slot = 4
creature = "base:halberdier"
count = 14

[[defender]]
slot = 1
creature = "base:manticore"
count = 3

[[defender]]
slot = 5
creature = "base:troglodyte"
count = 20

# The heroes (E17 M3 T3a), as the original's map gets them (`h3-view situation`): Orrin, a
# Knight, and Crag Hack, a Barbarian, each with 1 in every primary skill.
[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 1

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 1
power = 1
knowledge = 1

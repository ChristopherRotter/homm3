# The casts' sequences (E17 M3 T7a-2a; T7a-2b adds the others): recorded as sequences.toml's
# (`h3drive.py sequences situations/casts.toml` replays them and fails when a timeline changes),
# kept beside it until the viewer's timeline plays them (T7b, T7c): then each moves into
# sequences.toml with its engine commands and its frames (T7b-1: `cast`, `resist`, `arrow`; T7c-1:
# `mass`, `dragon`).
# `cast:<k>[:<hex>]` casts the hero's spell at its book's place k (design §7.16, "The spell
# book"); a Faerie Dragon casts by a click on its target. `heroes = true`: the timeline has the heroes' changes too
# (`<ms> hero <side> g<group> f<frame>`); `screens = true` (T7a-2b) the screen's changes
# (`<ms> screen <x0>,<y0>,<x1>,<y1>`, the box that differs from the step before), for what memory
# does not show (the at-hex and Armageddon players, the projectiles, the rays, design §7.16).
# A key pressed at the frozen clock right after a hero's cast acts once the cast has played
# (sequences.toml's `resist`: its stack defends as the hero stands).

# Lightning Bolt (round 1) and Chain Lightning (round 2) at the Swordsmen at row 4 (§7.16: the bolt
# from the sky, the rays, the marked target; Chain Lightning's own animation never drawn).
[[sequence]]
id = "bolt"
scenario = "seq-bolt.toml"
hot_seat = true
actions = [
    "turn:1.0", "key:d", "turn:1.1", "key:d", "turn:1.2", "key:d", "turn:1.3", "key:d",
    "turn:0.0", "cast:0:83", "key:d",
    "turn:1.0", "key:d", "turn:1.1", "key:d", "turn:1.2", "key:d", "turn:1.3", "key:d",
    "turn:0.0", "cast:1:83",
]
ms = 2400
heroes = true
screens = true
timeline = "timelines/bolt.txt"

# The raise (§7.16, player 4): Resurrection on the Pikeman the Grand Elves shot (round 1; the
# raised Pikeman then takes its turn), Animate Dead on the Skeleton the Marksmen shot (round 2).
[[sequence]]
id = "raise"
scenario = "seq-raise.toml"
hot_seat = true
actions = [
    "turn:1.0", "hex:35", "turn:1.1", "hex:86", "turn:0.2", "cast:1:35", "key:d",
    "turn:0.0", "key:d",
    "turn:1.0", "key:d", "turn:1.1", "key:d", "turn:0.2", "cast:0:86",
]
ms = 3000
heroes = true
screens = true
timeline = "timelines/raise.txt"

# The at-hex player and the whole field (§7.16, players 5 and 6): a Fire Wall (round 1),
# Quicksand (round 2), a Force Field (round 3), Armageddon (round 4).
[[sequence]]
id = "obstacles"
scenario = "seq-obstacles.toml"
hot_seat = true
actions = [
    "turn:1.0", "key:d", "turn:1.1", "key:d", "turn:0.0", "cast:0:146", "key:d",
    "turn:1.0", "key:d", "turn:1.1", "key:d", "turn:0.0", "cast:1", "key:d",
    "turn:1.0", "key:d", "turn:1.1", "key:d", "turn:0.0", "cast:2:63", "key:d",
    "turn:1.0", "key:d", "turn:1.1", "key:d", "turn:0.0", "cast:3",
]
ms = 3000
heroes = true
screens = true
timeline = "timelines/obstacles.txt"

# Two creatures' animations (§7.16): the Archangels strike the Efreet Sultans from hex 31 (their
# Fire Shield's return), the Sultans defend, the Power Liches shoot the Archangels (their cloud).
[[sequence]]
id = "creatures"
scenario = "seq-creatures.toml"
hot_seat = true
actions = ["turn:0.0", "hex:49", "turn:1.0", "key:d", "turn:1.1", "hex:31"]
ms = 3340
heroes = true
screens = true
timeline = "timelines/creatures.txt"

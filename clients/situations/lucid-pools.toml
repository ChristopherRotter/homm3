# E17 M3 T2: a situation of the capture set (situations/set.toml) on a special battlefield,
# Lucid Pools (special field 6, `CmBkLP.pcx`): the SoD ground (class 228) under both heroes
# (`h3-view situation`; design §5, §6.2). The grass situation's armies: the human's Royal
# Griffins open. The obstacles are the original's, of the field's own types, found in its
# capture (`h3cap.py find`).

[scenario]
id = "situation-lucid-pools"
packs = ["base", "ab", "sod"]
profile = "base:faithful"
terrain = "base:grass"
battlefield = "sod:lucid_pools"
obstacles = [
    { hexes = [106], anchor = 106, kind = "sod:obstacle_75" },
    { hexes = [144, 145], anchor = 144, kind = "sod:obstacle_76" },
    { hexes = [62, 63, 64, 47, 46, 45, 44], anchor = 61, kind = "sod:obstacle_78" },
]

[[attacker]]
slot = 0
creature = "base:royal_griffin"
count = 5

[[attacker]]
slot = 2
creature = "base:pikeman"
count = 12

[[defender]]
slot = 0
creature = "base:wolf_rider"
count = 8

[[defender]]

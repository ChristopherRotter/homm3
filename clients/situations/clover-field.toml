# E17 M3 T2: a situation of the capture set (situations/set.toml) on a special battlefield,
# Clover Field (special field 5, `CmBkCF.pcx`): the SoD ground (class 222) under both heroes
# (`h3-view situation`; design §5, §6.2). The grass situation's armies: the human's Royal
# Griffins open. The obstacles are the original's, of the field's own types, found in its
# capture (`h3cap.py find`).

[scenario]
id = "situation-clover-field"
packs = ["base", "ab", "sod"]
profile = "base:faithful"
terrain = "base:grass"
battlefield = "sod:clover_field"
obstacles = [
    { hexes = [112], anchor = 112, kind = "sod:obstacle_71" },
    { hexes = [25, 26, 27], anchor = 25, kind = "sod:obstacle_72" },
    { hexes = [145, 146, 129, 128], anchor = 144, kind = "sod:obstacle_73" },
]

[[attacker]]
slot = 0
creature = "base:royal_griffin"
count = 5

[[attacker]]
slot = 2
creature = "base:pikeman"
count = 12

[[defender]]
slot = 0
creature = "base:wolf_rider"
count = 8

[[defender]]
slot = 2
creature = "base:goblin"
count = 15

# E17 M3 T1a: a battle in progress in hot seat (`hot_seat` in sequences.toml: the harness plays
# both sides). The Centaur Captains walk right to hex 41 and the Marksmen to 143; the Silver Pegasi,
# who waited, land behind the Centaurs (39, 40). In the second round the Centaurs strike the
# Pegasi standing (both turn: neither stands on the other's front side) and the Marksmen shoot
# them (the target lies left of the shooter: it turns). Two factions a side, so morale is 0 and
# nothing moves on its own. On grass at the capture set's tile (grass.toml's obstacles).

[scenario]
id = "sequence-behind"
# Both players human, as the original's hot-seat map (`h3-view situation --hot-seat`): the
# panel's buttons lit on either side's turn (E17 M3 T6a).
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"
obstacles = [
    { hexes = [75, 76, 77, 78, 61, 60, 59, 58], anchor = 74, kind = "base:obstacle_22" },
    { hexes = [91, 92], anchor = 91, kind = "base:obstacle_20" },
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_19" },
]

[[attacker]]
slot = 0
creature = "base:centaur_captain"
count = 20

[[attacker]]
slot = 2
creature = "base:marksman"
count = 10

[[defender]]
slot = 0
creature = "base:silver_pegasus"
count = 10

[[defender]]
slot = 2
creature = "base:goblin"
count = 20

# The heroes (E17 M3 T3a), as the original's map gets them (`h3-view situation`): Orrin, a
# Knight, and Crag Hack, a Barbarian, each with 1 in every primary skill.
[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 1

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 1
power = 1
knowledge = 1

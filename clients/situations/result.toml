# E17 M5 T4b1: the battle's result window after a surrender (design §7.20). `grass`'s battle
# (grass.toml: its stacks, heroes and obstacles), Red human with the gold a Normal game gives it
# (20 000): the Royal Griffins open, so S asks Surrender's question, whose price (half the army's
# cost) Red can pay; its OK ends the battle and the result window shows Red's side, the loser.

[scenario]
id = "result"
human = ["attacker"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"
attacker_funds = 20000
obstacles = [
    { hexes = [75, 76, 77, 78, 61, 60, 59, 58], anchor = 74, kind = "base:obstacle_22" },
    { hexes = [91, 92], anchor = 91, kind = "base:obstacle_20" },
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_19" },
]

[[attacker]]
slot = 0
creature = "base:royal_griffin"
count = 5

[[attacker]]
slot = 2
creature = "base:pikeman"
count = 12

[[defender]]
slot = 0
creature = "base:wolf_rider"
count = 8

[[defender]]
slot = 2
creature = "base:goblin"
count = 15

[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 1

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 1
power = 1
knowledge = 1

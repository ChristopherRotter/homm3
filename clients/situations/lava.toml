# E17 M2 T1: a situation of the capture set (set.toml) on lava: the human's Royal Griffins
# (speed 9) open; the defender's stacks face left. The obstacles are the original's, found in its
# capture (`h3cap.py find`).

[scenario]
id = "situation-lava"
packs = ["base"]
profile = "base:faithful"
terrain = "base:lava"
obstacles = [
    { hexes = [78, 61, 60], anchor = 93, kind = "base:obstacle_48" },
    { hexes = [108, 107, 106, 92, 91, 90, 89], anchor = 122, kind = "base:obstacle_50" },
]

[[attacker]]
slot = 0
creature = "base:royal_griffin"
count = 5

[[attacker]]
slot = 4
creature = "base:crusader"
count = 6

[[defender]]
slot = 1
creature = "base:hell_hound"
count = 5

[[defender]]
slot = 5
creature = "base:imp"
count = 25

# The heroes (E17 M3 T3a), as the original's map gets them (`h3-view situation`): Orrin, a
# Knight, and Crag Hack, a Barbarian, each with 1 in every primary skill.
[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 1

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 1
power = 1
knowledge = 1

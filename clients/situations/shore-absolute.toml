# E17 M3 T2: a situation of the capture set (situations/set.toml) on the shore with one of its
# absolute obstacles: the battle at tile (18, 5) (`tile` in set.toml), water east of Blue, so the
# battle's tile (the defender's) is a coast tile, fought on sand (`h3-view situation`; design §5,
# §6.2). The shore's other situation's armies. The obstacles are the original's, of the shore's
# own types, found in its capture (`h3cap.py find`).

[scenario]
id = "situation-shore-absolute"
# Red human, Blue a computer, as the original's map (`h3-view situation`): the panel's buttons
# lit on the human's turn (E17 M3 T6a).
human = ["attacker"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:desert"
battlefield = "base:shore"
obstacles = [
    { hexes = [128, 129], anchor = 128, kind = "base:obstacle_4" },
    { hexes = [59, 60, 61], anchor = 59, kind = "base:obstacle_57" },
    { hexes = [73, 91, 108, 109, 110, 111, 112, 113], kind = "base:obstacle_126" },
]

[[attacker]]
slot = 0
creature = "base:royal_griffin"
count = 5

[[attacker]]
slot = 2
creature = "base:pikeman"
count = 12

[[defender]]
slot = 0
creature = "base:wolf_rider"
count = 8

[[defender]]
slot = 2
creature = "base:goblin"
count = 15

# The heroes (E17 M3 T3a), as the original's map gets them (`h3-view situation`): Orrin, a
# Knight, and Crag Hack, a Barbarian, each with 1 in every primary skill.
[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 1

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 1
power = 1
knowledge = 1

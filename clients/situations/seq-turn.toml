# E17 M2 T4b-2a: a sequence to record (T4b-2b; then its entry in sequences.toml): the human's Angels (speed
# 12, one hex, fliers) fly to hex 83 and strike the computer's Wolf Riders (two hexes, 99 and 100)
# from above and to the right, where neither faces the other: both turn before the strike and
# back after it (design §7.3). On grass at the capture set's tile, so the original's obstacles
# are the grass situation's (grass.toml).

[scenario]
id = "sequence-turn"
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"
obstacles = [
    { hexes = [75, 76, 77, 78, 61, 60, 59, 58], anchor = 74, kind = "base:obstacle_22" },
    { hexes = [91, 92], anchor = 91, kind = "base:obstacle_20" },
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_19" },
]

[[attacker]]
slot = 0
creature = "base:angel"
count = 2

[[defender]]
slot = 0
creature = "base:wolf_rider"
count = 30

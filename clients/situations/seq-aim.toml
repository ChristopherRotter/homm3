# E17 M4 T2c-2: the recorded sequence `aim` (sequences.toml; design §10.2, "The mouse"): a siege
# of a Castle town with a Castle (the keep, both towers, a damaging moat), both heroes human (hot
# seat). On the keep's turn (the defender's) the mouse rests over the upper tower's rectangle
# (0xFF), the keep's (0xFE) and the lower tower's hex 183: "View arrow tower info" (22). The
# turrets defend; on the Catapult's turn (Basic Ballistics) the mouse rests over the same two
# rectangles and each wall target's aim hex: the Catapult's target (16) and "Attack %s" with the
# part's name. Then the Catapult hits the upper wall.

[scenario]
id = "sequence-aim"
# Both human (hot seat): the defender commands the turrets, the attacker the Catapult.
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"

# The town: a Castle has the keep, both towers and a moat; the turrets' counts (BAT-SIE-016).
[scenario.siege]
faction = "base:castle"
fort = "castle"
moat = "damaging"
structures = 1

[[attacker]]
slot = 0
creature = "base:pikeman"
count = 12

[[defender]]
slot = 0
creature = "base:goblin"
count = 15

# The heroes, each with 1 in every primary skill (`h3-view situation` writes them so).
[scenario.attacker_hero]
hero_type = "base:valeska"
attack = 1
defense = 1
power = 1
knowledge = 1
# Basic Ballistics: the Catapult waits for its command.
catapult = 1

[scenario.defender_hero]
hero_type = "base:ufretin"
attack = 1
defense = 1
power = 1
knowledge = 1

# Artillery (the situation writes it): the turrets wait for their commands.
[scenario.defender_hero.ballista]
level = 1
shots = 1
double_damage_chance_bp = 5000

# E17 M4 T2b: the recorded sequence `tower` (sequences.toml; design §10.2, "A wall shot", "A
# turret's shot"): a Castle, the Catapult with Expert Ballistics destroys the upper tower (its
# cover and shooter gone at the explosion's frame 5), its second shot retargeted to the upper wall;
# the Archangel flies into the town beside the lower tower, and in round 2 the keep shoots the
# Pikemen and the lower tower the Archangel (facing right: drawn unmirrored).

[scenario]
id = "sequence-tower"
# Both human (hot seat): the defender commands the keep.
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"

# The town: under SoD rules (the situation's map) its moat damages.
[scenario.siege]
faction = "base:castle"
fort = "castle"
moat = "damaging"
# The original's keep counts 5 creatures here, each tower 3 (`town_turret_count` 0x5BF4F0: 4 plus
# one structure of the situation's town; the engine's 4 + `structures`, BAT-SIE-016).
structures = 1

[[attacker]]
slot = 0
creature = "base:pikeman"
count = 12

[[attacker]]
slot = 3
creature = "base:archangel"
count = 1

[[defender]]
slot = 0
creature = "base:goblin"
count = 15

# The heroes, each with 1 in every primary skill (`h3-view situation` writes them so).
[scenario.attacker_hero]
hero_type = "base:valeska"
attack = 1
defense = 1
power = 1
knowledge = 1
# Expert Ballistics: two shots of 2 damage, commanded.
catapult = 3

[scenario.defender_hero]
hero_type = "base:ufretin"
attack = 1
defense = 1
power = 1
knowledge = 1

# Basic Artillery: the turrets wait for their commands.
[scenario.defender_hero.ballista]
level = 1
shots = 1
double_damage_chance_bp = 5000

# E17 M6 T2b2: a situation of the capture set (situations/set.toml): siege-citadel.toml's siege
# of a Fortress town with a Citadel (the keep alone with its turret; hot seat, the keep's turn
# first) with the original's keep count, for a turret's info (design §12.6).

[scenario]
id = "situation-turret-citadel"
# Both human (hot seat): the defender commands the keep.
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"

# The town: under SoD rules (the situation's map) its moat damages.
[scenario.siege]
faction = "base:fortress"
fort = "citadel"
moat = "damaging"
# The original's keep counts 5 creatures here (`town_turret_count` 0x5BF4F0: 4 plus one structure
# of the situation's town; the engine's 4 + `structures`, BAT-SIE-016): the info's count.
structures = 1

[[attacker]]
slot = 0
creature = "base:pikeman"
count = 12

[[attacker]]
slot = 3
creature = "base:griffin"
count = 4

[[attacker]]
slot = 6
creature = "base:archer"
count = 10

[[defender]]
slot = 0
creature = "base:goblin"
count = 15

[[defender]]
slot = 3
creature = "base:wolf_rider"
count = 6

[[defender]]
slot = 6
creature = "base:orc"
count = 8

# The heroes, each with 1 in every primary skill (`h3-view situation` writes them so).
[scenario.attacker_hero]
hero_type = "base:valeska"
attack = 1
defense = 1
power = 1
knowledge = 1
# Basic Ballistics: the Catapult waits for its command.
catapult = 1

[scenario.defender_hero]
hero_type = "base:ufretin"
attack = 1
defense = 1
power = 1
knowledge = 1

# Basic Artillery: the turrets wait for their commands.
[scenario.defender_hero.ballista]
level = 1
shots = 1
double_damage_chance_bp = 5000

# E17 M5 T3b: a hero's aim (design §7.18): at the opening the Champions' turn (speed 9, as `cast`),
# and Orrin aims Fireball from his spell book (place 1: the first page shows Magic Arrow, level 1,
# then Fireball, level 3) over an empty hex, over the Wolf Riders (its area marks them) and over a
# side column (refused), gives it up by Escape, then aims Magic Arrow (place 0) over nobody, over
# his own Champions (refused) and over the Wolf Riders, and casts it. On grass at the capture set's
# tile (grass.toml's obstacles), as `cast`.

[scenario]
id = "sequence-spell-aim"
# Red human, Blue a computer, as the original's map (`h3-view situation`).
human = ["attacker"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"
obstacles = [
    { hexes = [75, 76, 77, 78, 61, 60, 59, 58], anchor = 74, kind = "base:obstacle_22" },
    { hexes = [91, 92], anchor = 91, kind = "base:obstacle_20" },
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_19" },
]

[[attacker]]
slot = 0
creature = "base:champion"
count = 5

[[attacker]]
slot = 2
creature = "base:marksman"
count = 10

[[defender]]
slot = 0
creature = "base:wolf_rider"
count = 8

[[defender]]
slot = 2
creature = "base:goblin"
count = 15

# The heroes (E17 M3 T3a) with 1 in every primary skill but Orrin's knowledge 2, for Fireball's
# 15 spell points; his spell book Magic Arrow and Fireball: the original's hero starts with 10
# spell points per knowledge.
[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 2
mana = 20
max_mana = 20
spell_book = ["base:magic_arrow", "base:fireball"]

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 1
power = 1
knowledge = 1

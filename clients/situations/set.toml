# The capture set (E17 M2 T1, *provisional*; clients/capture/README.md): the situations the
# harness shows the original and compares with our renders, unattended
# (`clients/capture/h3drive.py set`). Each names its scenario (beside this file; its map comes from
# `h3-view situation`, Blue's hero on `tile`, default [11, 10]), the masks over what we do not draw
# yet (`mask`, `h3cap.py diff`; none since M3 T6c-1 drew the game's cursor where the recipes park
# the mouse), where the mouse rests (`mouse`, default the parked point; M3 T6c-1), and per frame
# (ms after the opening, on the original's clock) the number of pixels that differ outside the
# masks, with why. A run that counts another number fails: a change, to be fixed or recorded
# deliberately.
#
# The situations: every land terrain's battlefield (its third background: nothing around the
# battle, design §4.4), human-first openings (the Royal Griffins' outline), two-hex stacks facing
# either way, the original's usual obstacles and, at tile (20, 20), an absolute one. Since M3
# T1b-2 each frame is compared with ours at its time (`h3-view render --frames`): the outline's
# pulse on the original's clock (design §4.2, §7.1), a fidget in the original's poses read from
# its memory (as the frame check, design §7.9). Until then one still stood for every frame: the
# outline's colour differed by a step of its pulse (412 pixels) and the grass Pikemen's fidget
# (200 to 700 ms) by up to 2 036.


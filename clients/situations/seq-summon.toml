# E17 M5 T5a: Summon Elemental (design §7.25): Orrin summons two Fire Elementals (power 1, Basic)
# at the Swordsmen's turn; they show in a dissolve of 75 ms steps (`create_battle_stack`
# 0x47A2A8). The elementals wait and the Archers shoot them both dead: they leave no corpse and
# dissolve away (`battle_dissolve_removed`, trunc(150 F) steps). Hot seat; on grass at the
# capture set's tile (`sacrifice`'s).

[scenario]
id = "sequence-summon"
# Both players human, as the original's hot-seat map (`h3-view situation --hot-seat`).
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"
obstacles = [
    { hexes = [75, 76, 77, 78, 61, 60, 59, 58], anchor = 74, kind = "base:obstacle_22" },
    { hexes = [91, 92], anchor = 91, kind = "base:obstacle_20" },
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_19" },
]

[[attacker]]
slot = 0
creature = "base:swordsman"
count = 20

[[defender]]
slot = 0
creature = "base:archer"
count = 80

# The heroes (E17 M3 T3a) with 1 in every primary skill but Orrin's knowledge.
[scenario.attacker_hero]
hero_type = "base:orrin"
attack = 1
defense = 1
power = 1
knowledge = 3
mana = 30
max_mana = 30
spell_book = ["base:fire_elemental"]

[scenario.defender_hero]
hero_type = "base:crag_hack"
attack = 1
defense = 1
power = 1
knowledge = 1

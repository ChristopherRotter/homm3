# E17 M4 T2c-1: the recorded sequence `moat` (sequences.toml; design §10.2, "The moat's
# damage"): a siege of a Castle town with a Citadel (the keep, a damaging moat under SoD rules),
# both heroes human (hot seat) commanding their machines. The attacker's Champions walk until
# their front enters the moat (77): the walk stops there, the moat's damage, its line and their
# reaction; the moat's strip over their front and their box drawn again. In round 2 they wait in
# the moat: the re-entry's damage (`reenter_own_hexes` 0x441F70).

[scenario]
id = "sequence-moat"
# Both human (hot seat): the defender commands the keep, the attacker the Catapult.
human = ["attacker", "defender"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"

# The town: under SoD rules (the situation's map) its moat damages.
[scenario.siege]
faction = "base:castle"
fort = "citadel"
moat = "damaging"
# The original's keep counts 5 creatures here (`town_turret_count` 0x5BF4F0: 4 plus one
# structure of the situation's town; the engine's 4 + `structures`, BAT-SIE-016).
structures = 1

[[attacker]]
slot = 0
creature = "base:champion"
count = 5

[[defender]]
slot = 0
creature = "base:goblin"
count = 15

# The heroes, each with 1 in every primary skill (`h3-view situation` writes them so).
[scenario.attacker_hero]
hero_type = "base:valeska"
attack = 1
defense = 1
power = 1
knowledge = 1
# Basic Ballistics: the Catapult waits for its command.
catapult = 1

[scenario.defender_hero]
hero_type = "base:ufretin"
attack = 1
defense = 1
power = 1
knowledge = 1

# Basic Artillery: the keep waits for its commands.
[scenario.defender_hero.ballista]
level = 1
shots = 1
double_damage_chance_bp = 5000

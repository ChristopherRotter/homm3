# E17 M3 T3a: a situation of the capture set (situations/set.toml): the grass battle (grass.toml)
# with other heroes, so that every hero's battle picture is compared: base:charna, a female Death
# Knight (CH09), against base:arlach, a male Overlord (CH010).

[scenario]
id = "situation-heroes-necropolis-dungeon"
# Red human, Blue a computer, as the original's map (`h3-view situation`): the panel's buttons
# lit on the human's turn (E17 M3 T6a).
human = ["attacker"]
packs = ["base"]
profile = "base:faithful"
terrain = "base:grass"
obstacles = [
    { hexes = [75, 76, 77, 78, 61, 60, 59, 58], anchor = 74, kind = "base:obstacle_22" },
    { hexes = [91, 92], anchor = 91, kind = "base:obstacle_20" },
    { hexes = [122, 123], anchor = 122, kind = "base:obstacle_19" },
]

[[attacker]]
slot = 0
creature = "base:royal_griffin"
count = 5

[[attacker]]
slot = 2
creature = "base:pikeman"
count = 12

[[defender]]
slot = 0
creature = "base:wolf_rider"
count = 8

[[defender]]
slot = 2
creature = "base:goblin"
count = 15

# The heroes, each with 1 in every primary skill (`h3-view situation` writes them so).
[scenario.attacker_hero]
hero_type = "base:charna"
attack = 1
defense = 1
power = 1
knowledge = 1

[scenario.defender_hero]
hero_type = "base:arlach"
attack = 1
defense = 1
power = 1
knowledge = 1
